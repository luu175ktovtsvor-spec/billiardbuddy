name: 桌面版-macOS现役TS出包

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: 安装内核依赖
        working-directory: ts
        run: bun install --frozen-lockfile

      - name: 安装桌面依赖
        working-directory: ts/desktop
        run: bun install --frozen-lockfile

      - name: 审计发布源码均已纳入 Git
        working-directory: ts
        run: bun run scripts/check-release-tracked-files.ts

      - name: 准备经审核的打包凭据与媒体工具链
        shell: bash
        env:
          BB_RELEASE_UPLOAD_SSH_KEY_B64: ${{ secrets.BB_RELEASE_UPLOAD_SSH_KEY_B64 }}
          BB_MACOS_MEDIA_TOOLCHAIN_URL: ${{ secrets.BB_MACOS_MEDIA_TOOLCHAIN_URL }}
          BB_MACOS_MEDIA_TOOLCHAIN_SHA256: ${{ secrets.BB_MACOS_MEDIA_TOOLCHAIN_SHA256 }}
          BB_MACOS_CERTIFICATE_P12_B64: ${{ secrets.BB_MACOS_CERTIFICATE_P12_B64 }}
          BB_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.BB_MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          required=(
            BB_RELEASE_UPLOAD_SSH_KEY_B64
            BB_MACOS_MEDIA_TOOLCHAIN_URL
            BB_MACOS_MEDIA_TOOLCHAIN_SHA256
            BB_MACOS_CERTIFICATE_P12_B64
            BB_MACOS_CERTIFICATE_PASSWORD
            APPLE_ID
            APPLE_APP_SPECIFIC_PASSWORD
            APPLE_TEAM_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "缺少 GitHub Secret: ${name}" >&2
              exit 1
            fi
          done
          if [[ ! "${BB_MACOS_MEDIA_TOOLCHAIN_URL}" =~ ^https:// ]]; then
            echo 'BB_MACOS_MEDIA_TOOLCHAIN_URL 必须使用 HTTPS' >&2
            exit 1
          fi
          expected_hash="$(printf '%s' "${BB_MACOS_MEDIA_TOOLCHAIN_SHA256}" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "${expected_hash}" =~ ^[a-f0-9]{64}$ ]]; then
            echo 'BB_MACOS_MEDIA_TOOLCHAIN_SHA256 必须是 64 位十六进制 SHA-256' >&2
            exit 1
          fi

          archive="${RUNNER_TEMP}/billiardbuddy-media-toolchain-macos-arm64.tar.gz"
          source_dir="${RUNNER_TEMP}/billiardbuddy-media-toolchain-macos-arm64"
          rm -rf "${archive}" "${source_dir}"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "${BB_MACOS_MEDIA_TOOLCHAIN_URL}" \
            --output "${archive}"
          actual_hash="$(shasum -a 256 "${archive}" | awk '{print $1}')"
          if [[ "${actual_hash}" != "${expected_hash}" ]]; then
            echo 'macOS 媒体工具链压缩包 SHA-256 不匹配' >&2
            exit 1
          fi
          mkdir -p "${source_dir}"
          tar -xzf "${archive}" -C "${source_dir}"
          for file in ffmpeg ffprobe LICENSE.txt media-toolchain-source.json; do
            if [[ ! -f "${source_dir}/${file}" ]]; then
              echo "媒体工具链压缩包根目录缺少必需文件: ${file}" >&2
              exit 1
            fi
          done

          ssh_dir="${HOME}/.ssh"
          key_path="${ssh_dir}/billiardbuddy-release-upload"
          known_hosts_path="${ssh_dir}/known_hosts"
          mkdir -p "${ssh_dir}"
          printf '%s' "${BB_RELEASE_UPLOAD_SSH_KEY_B64}" | base64 -D > "${key_path}"
          chmod 600 "${key_path}"
          {
            printf '%s\n' '39.106.214.21 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIgaQWyo3iZcvWHsVpYf+Oncgf5RZhkpMdz7ap5Gbusc'
            printf '%s\n' 'zzyppz.cn ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJIxRR8LH+6jH3sUGNFy9HlxDKRF9MA9QLYm7AYuwa3P'
          } > "${known_hosts_path}"
          chmod 600 "${known_hosts_path}"

          gateway_credentials="$(
            ssh -i "${key_path}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              root@39.106.214.21 \
              "sed -n 's/^GW_APP_CREDENTIALS=//p' /opt/qfgw/gw.env"
          )"
          license_provisioning_json="$(
            ssh -i "${key_path}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              root@39.106.214.21 \
              "sed -n 's/^GW_LICENSE_PROVISIONING=//p' /opt/qfgw/gw.env"
          )"
          gateway_bootstrap_credential="$(
            node -e '
              const credential = process.argv[1].split(",").map(value => value.trim()).filter(Boolean)[0];
              if (!/^[A-Za-z0-9_-]{16,256}$/.test(credential || "")) process.exit(1);
              process.stdout.write(credential);
            ' "${gateway_credentials}"
          )"
          gateway_license_key="$(
            node -e '
              const licenses = JSON.parse(process.argv[1]);
              const key = Array.isArray(licenses) ? licenses[0]?.licenseKey : undefined;
              if (!/^[A-Za-z0-9._-]{8,256}$/.test(key || "")) process.exit(1);
              process.stdout.write(key);
            ' "${license_provisioning_json}"
          )"
          mkdir -p ts/desktop/build
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(
              "ts/desktop/build/product-secrets.json",
              `${JSON.stringify({ gatewayBootstrapCredential: process.argv[1], licenseKey: process.argv[2] })}\n`,
              { mode: 0o600 },
            );
          ' "${gateway_bootstrap_credential}" "${gateway_license_key}"

          certificate_path="${RUNNER_TEMP}/billiardbuddy-developer-id.p12"
          keychain_path="${RUNNER_TEMP}/billiardbuddy-build.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "${BB_MACOS_CERTIFICATE_P12_B64}" | base64 -D > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${BB_MACOS_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -d user -s "${keychain_path}"
          security find-identity -v -p codesigning "${keychain_path}" |
            grep -F 'Developer ID Application'

          {
            printf 'BB_MEDIA_TOOLCHAIN_SOURCE_DIR=%s\n' "${source_dir}"
            printf 'BB_MACOS_BUILD_KEYCHAIN=%s\n' "${keychain_path}"
            printf 'BB_MACOS_CERTIFICATE_PATH=%s\n' "${certificate_path}"
          } >> "${GITHUB_ENV}"

      - name: 构建并签名公证 macOS Apple Silicon 安装包
        working-directory: ts/desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
        run: |
          set -euo pipefail
          BB_MEDIA_TOOLCHAIN_PLATFORM=darwin bun run stage:media-toolchain
          bun run clean:electron-output
          SIDECAR_TARGET_TRIPLE=aarch64-apple-darwin bun run build:sidecars
          bun run build
          bun run build:electron
          node ./node_modules/electron-builder/out/cli/cli.js \
            --mac dmg zip \
            --arm64 \
            --publish never

      - name: 校验签名、公证与安装包产物
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir='ts/desktop/build-artifacts/electron'
          shopt -s nullglob
          apps=("${artifact_dir}/mac-arm64/"*.app)
          dmgs=("${artifact_dir}/"*.dmg)
          zips=("${artifact_dir}/"*.zip)
          blockmaps=("${artifact_dir}/"*.blockmap)
          metadata=("${artifact_dir}/latest-mac.yml")
          if [[ "${#apps[@]}" -ne 1 || "${#dmgs[@]}" -ne 1 || "${#zips[@]}" -ne 1 ||
                "${#blockmaps[@]}" -ne 2 || "${#metadata[@]}" -ne 1 ||
                ! -s "${metadata[0]}" ]]; then
            echo 'macOS 发布文件不完整或不唯一' >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          signature="$(codesign -dv --verbose=4 "${apps[0]}" 2>&1)"
          printf '%s\n' "${signature}" | grep -E '^Authority=Developer ID Application:'
          printf '%s\n' "${signature}" | grep -E '^TeamIdentifier=[A-Z0-9]+$'
          spctl --assess --type execute --verbose=2 "${apps[0]}"
          for file in "${dmgs[0]}" "${zips[0]}" "${blockmaps[@]}" "${metadata[0]}"; do
            test -s "${file}"
          done

      - name: 发布 macOS 安装包与更新清单
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir='ts/desktop/build-artifacts/electron'
          key_path="${HOME}/.ssh/billiardbuddy-release-upload"
          shopt -s nullglob
          dmgs=("${artifact_dir}/"*.dmg)
          zips=("${artifact_dir}/"*.zip)
          blockmaps=("${artifact_dir}/"*.blockmap)
          metadata="${artifact_dir}/latest-mac.yml"
          if [[ "${#dmgs[@]}" -ne 1 || "${#zips[@]}" -ne 1 ||
                "${#blockmaps[@]}" -ne 2 || ! -s "${metadata}" ]]; then
            echo 'macOS 发布文件不完整或不唯一' >&2
            exit 1
          fi

          incoming="/var/www/desktop-updates/.incoming-mac-${GITHUB_RUN_ID}"
          ssh_args=(-i "${key_path}" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_args[@]}" root@zzyppz.cn "set -eu; mkdir -p '${incoming}'"
          files=("${dmgs[0]}" "${zips[0]}" "${blockmaps[@]}")
          for file in "${files[@]}" "${metadata}"; do
            scp "${ssh_args[@]}" "${file}" "root@zzyppz.cn:${incoming}/$(basename "${file}")"
          done

          publish_commands=('set -eu')
          for file in "${files[@]}" "${metadata}"; do
            publish_commands+=("test -s '${incoming}/$(basename "${file}")'")
          done
          for file in "${files[@]}"; do
            publish_commands+=("mv '${incoming}/$(basename "${file}")' /var/www/desktop-updates/")
          done
          publish_commands+=("mv '${incoming}/$(basename "${metadata}")' /var/www/desktop-updates/")
          publish_commands+=("rmdir '${incoming}'")
          command="$(IFS=';'; printf '%s' "${publish_commands[*]}")"
          ssh "${ssh_args[@]}" root@zzyppz.cn "${command}"

      - name: 清理临时凭据与媒体工具链
        if: always()
        shell: bash
        run: |
          rm -f ts/desktop/build/product-secrets.json
          rm -f "${HOME}/.ssh/billiardbuddy-release-upload"
          rm -f "${BB_MACOS_CERTIFICATE_PATH:-}"
          rm -rf "${RUNNER_TEMP}/billiardbuddy-media-toolchain-macos-arm64"
          rm -f "${RUNNER_TEMP}/billiardbuddy-media-toolchain-macos-arm64.tar.gz"
          if [[ -n "${BB_MACOS_BUILD_KEYCHAIN:-}" ]]; then
            security delete-keychain "${BB_MACOS_BUILD_KEYCHAIN}" || true
          fi
