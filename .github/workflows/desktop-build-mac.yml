name: 桌面版-macOS Agent-only出包

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '构建验证通过后发布到正式更新源'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: macos-14
    timeout-minutes: 150
    env:
      BB_AGENT_ONLY_BUILD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 Codex 源码锁定的 Rust 工具链
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: '1.95.0'

      - name: 安装内核依赖
        working-directory: ts
        run: bun install --frozen-lockfile

      - name: 安装桌面依赖
        working-directory: ts/desktop
        run: bun install --frozen-lockfile

      - name: 审计发布源码均已纳入 Git
        working-directory: ts
        run: bun run scripts/check-release-tracked-files.ts

      - name: 统一检查 Agent 宿主、模型适配与锁定协议
        working-directory: ts
        run: |
          set -euo pipefail
          bun run check:server
          bun test --preload ./test/setup.ts ./test/codexNativeProvider.test.ts
          bun run check:electron
          bun run verify:codex-engine-source

      - name: 配置 Agent-only 无签名打包
        shell: bash
        run: |
          set -euo pipefail
          printf 'CSC_IDENTITY_AUTO_DISCOVERY=false\n' >> "${GITHUB_ENV}"
          echo 'Agent-only macOS package will be unsigned and is not publishable.'

      - name: 构建 macOS Apple Silicon Agent-only 安装包
        working-directory: ts/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          CODEX_ENGINE_TARGET=aarch64-apple-darwin bun run stage:codex-engine
          bun run verify:codex-engine-smoke -- --target aarch64-apple-darwin
          bun run stage:agent-plugins -- --target aarch64-apple-darwin
          bun run stage:chrome-plugin -- --target aarch64-apple-darwin
          bun run stage:browser-plugin -- --target aarch64-apple-darwin
          bun run stage:record-replay-plugin -- --target aarch64-apple-darwin
          bun run clean:electron-output
          SIDECAR_TARGET_TRIPLE=aarch64-apple-darwin bun run build:sidecars
          bun run build
          bun run build:electron
          node ./node_modules/electron-builder/out/cli/cli.js \
            --mac dmg zip \
            --arm64 \
            --publish never \
            -c.mac.identity=- \
            -c.mac.notarize=false

      - name: 校验 macOS Agent-only 安装包产物
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir='ts/desktop/build-artifacts/electron'
          shopt -s nullglob
          apps=("${artifact_dir}/mac-arm64/"*.app)
          dmgs=("${artifact_dir}/"*.dmg)
          zips=("${artifact_dir}/"*.zip)
          blockmaps=("${artifact_dir}/"*.blockmap)
          metadata=("${artifact_dir}/latest-mac.yml")
          if [[ "${#apps[@]}" -ne 1 || "${#dmgs[@]}" -ne 1 || "${#zips[@]}" -ne 1 ||
                "${#blockmaps[@]}" -ne 2 || "${#metadata[@]}" -ne 1 ||
                ! -s "${metadata[0]}" ]]; then
            echo 'macOS 发布文件不完整或不唯一' >&2
            exit 1
          fi
          for file in "${dmgs[0]}" "${zips[0]}" "${blockmaps[@]}" "${metadata[0]}"; do
            test -s "${file}"
          done

          bun run ts/desktop/scripts/audit-packaged-resources.ts \
            --platform darwin \
            --resources "${apps[0]}/Contents/Resources"

          mount_dir="$(mktemp -d "${RUNNER_TEMP}/billiardbuddy-dmg-audit.XXXXXX")"
          cleanup_mount() {
            hdiutil detach "${mount_dir}" >/dev/null 2>&1 || true
            rmdir "${mount_dir}" >/dev/null 2>&1 || true
          }
          trap cleanup_mount EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "${mount_dir}" "${dmgs[0]}" >/dev/null
          bun run ts/desktop/scripts/audit-packaged-resources.ts \
            --platform darwin \
            --resources "${mount_dir}/BilliardBuddy.app/Contents/Resources"
          hdiutil detach "${mount_dir}" >/dev/null
          rmdir "${mount_dir}"
          trap - EXIT

      - name: 保存已审计的 macOS 安装包
        uses: actions/upload-artifact@v4
        with:
          name: BilliardBuddy-macos-arm64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ts/desktop/build-artifacts/electron/*.dmg
            ts/desktop/build-artifacts/electron/*.zip
            ts/desktop/build-artifacts/electron/*.blockmap
            ts/desktop/build-artifacts/electron/latest-mac.yml

      - name: 发布 macOS 安装包与更新清单
        if: env.BB_AGENT_ONLY_BUILD != '1' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish == true)
        shell: bash
        env:
          BB_RELEASE_UPLOAD_SSH_KEY_B64: ${{ secrets.BB_RELEASE_UPLOAD_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          artifact_dir='ts/desktop/build-artifacts/electron'
          if [[ -z "${BB_RELEASE_UPLOAD_SSH_KEY_B64:-}" ]]; then
            echo '缺少 GitHub Secret: BB_RELEASE_UPLOAD_SSH_KEY_B64' >&2
            exit 1
          fi
          ssh_dir="${HOME}/.ssh"
          key_path="${HOME}/.ssh/billiardbuddy-release-upload"
          known_hosts_path="${ssh_dir}/known_hosts"
          mkdir -p "${ssh_dir}"
          if ! printf '%s' "${BB_RELEASE_UPLOAD_SSH_KEY_B64}" | base64 -D > "${key_path}"; then
            echo 'BB_RELEASE_UPLOAD_SSH_KEY_B64 不是有效的 Base64 私钥' >&2
            exit 1
          fi
          chmod 600 "${key_path}"
          printf '%s\n' 'zzyppz.cn ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJIxRR8LH+6jH3sUGNFy9HlxDKRF9MA9QLYm7AYuwa3P' > "${known_hosts_path}"
          chmod 600 "${known_hosts_path}"
          shopt -s nullglob
          dmgs=("${artifact_dir}/"*.dmg)
          zips=("${artifact_dir}/"*.zip)
          blockmaps=("${artifact_dir}/"*.blockmap)
          metadata="${artifact_dir}/latest-mac.yml"
          if [[ "${#dmgs[@]}" -ne 1 || "${#zips[@]}" -ne 1 ||
                "${#blockmaps[@]}" -ne 2 || ! -s "${metadata}" ]]; then
            echo 'macOS 发布文件不完整或不唯一' >&2
            exit 1
          fi

          incoming="/var/www/desktop-updates/.incoming-mac-${GITHUB_RUN_ID}"
          ssh_args=(-i "${key_path}" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_args[@]}" root@zzyppz.cn "set -eu; mkdir -p '${incoming}'"
          files=("${dmgs[0]}" "${zips[0]}" "${blockmaps[@]}")
          for file in "${files[@]}" "${metadata}"; do
            scp "${ssh_args[@]}" "${file}" "root@zzyppz.cn:${incoming}/$(basename "${file}")"
          done

          publish_commands=('set -eu')
          for file in "${files[@]}" "${metadata}"; do
            publish_commands+=("test -s '${incoming}/$(basename "${file}")'")
          done
          for file in "${files[@]}"; do
            publish_commands+=("mv '${incoming}/$(basename "${file}")' /var/www/desktop-updates/")
          done
          publish_commands+=("mv '${incoming}/$(basename "${metadata}")' /var/www/desktop-updates/")
          publish_commands+=("rmdir '${incoming}'")
          command="$(IFS=';'; printf '%s' "${publish_commands[*]}")"
          ssh "${ssh_args[@]}" root@zzyppz.cn "${command}"

      - name: 清理临时凭据
        if: always()
        shell: bash
        run: |
          rm -f ts/desktop/build/product-secrets.json
          rm -f "${HOME}/.ssh/billiardbuddy-release-upload"
