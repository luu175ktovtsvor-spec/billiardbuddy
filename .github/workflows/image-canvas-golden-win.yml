name: 图片画布-Windows x64 Golden

on:
  pull_request:
    paths:
      - 'ts/src/server/services/imageCanvasRenderer.ts'
      - 'ts/shared/contracts/imageGeneration.ts'
      - 'ts/test/imageCanvasGolden.test.ts'
      - 'ts/test/setup.ts'
      - 'ts/package.json'
      - '.github/workflows/image-canvas-golden-win.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: 安装图片 Renderer 依赖
        working-directory: ts
        run: bun install --frozen-lockfile
      - name: 生成并验证 Windows x64 canonical PNG golden
        working-directory: ts
        shell: pwsh
        env:
          BB_IMAGE_GOLDEN_REPORT: ${{ runner.temp }}\\image-canvas-golden-windows-x64.json
        run: |
          $ErrorActionPreference = 'Stop'
          bun test --preload ./test/setup.ts --timeout 60000 ./test/imageCanvasGolden.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 Canvas golden 不匹配' }
          if (-not (Test-Path -LiteralPath $env:BB_IMAGE_GOLDEN_REPORT -PathType Leaf)) { throw '缺少 Windows x64 golden 审计证据' }
      - name: 上传 Windows x64 golden 审计证据
        uses: actions/upload-artifact@v4
        with:
          name: image-canvas-golden-windows-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/image-canvas-golden-windows-x64.json
