name: Codex 源内核-构建验证

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.gitmodules'
      - 'third_party/codex-engine'
      - 'third_party/codex-engine-patches/**'
      - 'ts/shared/product/codexEngineContract.ts'
      - 'ts/shared/product/binaryIntegrity.ts'
      - 'ts/desktop/electron/services/codexNativeAppServer.ts'
      - 'ts/desktop/electron/services/codexNativeProvider.ts'
      - 'ts/desktop/electron/services/computerUseConfiguration.ts'
      - 'ts/desktop/electron/services/browserPolicyConfiguration.ts'
      - 'ts/desktop/electron/services/chromeNativeMessaging.ts'
      - 'ts/desktop/runtime-assets/marketplace.json'
      - 'ts/desktop/runtime-assets/plugins/**'
      - 'native/billiardbuddy-chrome/**'
      - 'native/billiardbuddy-browser-use/**'
      - 'native/billiardbuddy-record-replay/**'
      - 'native/billiardbuddy-computer-use/**'
      - 'ts/desktop/scripts/stage-agent-plugins.ts'
      - 'ts/desktop/scripts/native-build-tools.ts'
      - 'ts/desktop/scripts/stage-chrome-plugin.ts'
      - 'ts/desktop/scripts/stage-browser-plugin.ts'
      - 'ts/desktop/scripts/stage-record-replay-plugin.ts'
      - 'ts/desktop/electron/services/inAppBrowserHost.ts'
      - 'ts/desktop/electron/services/recordReplayLifecycle.ts'
      - 'ts/desktop/electron/services/scheduledAgentTasks.ts'
      - 'ts/desktop/scripts/electron-after-pack.cjs'
      - 'ts/desktop/scripts/stage-codex-engine.ts'
      - 'ts/desktop/scripts/verify-codex-engine-smoke.ts'
      - 'ts/desktop/scripts/verify-codex-engine-source.ts'
      - 'ts/desktop/scripts/verify-codex-native-protocol.ts'
      - 'ts/desktop/scripts/verify-browser-use-e2e.ts'
      - 'ts/desktop/scripts/verify-local-agent-plugin-smoke.ts'
      - 'ts/desktop/test/browserUseE2e.ts'
      - '.github/workflows/codex-engine-build.yml'
  push:
    branches:
      - main
    paths:
      - '.gitmodules'
      - 'third_party/codex-engine'
      - 'third_party/codex-engine-patches/**'
      - 'ts/shared/product/codexEngineContract.ts'
      - 'ts/shared/product/binaryIntegrity.ts'
      - 'ts/desktop/electron/services/codexNativeAppServer.ts'
      - 'ts/desktop/electron/services/codexNativeProvider.ts'
      - 'ts/desktop/electron/services/computerUseConfiguration.ts'
      - 'ts/desktop/electron/services/browserPolicyConfiguration.ts'
      - 'ts/desktop/electron/services/chromeNativeMessaging.ts'
      - 'ts/desktop/runtime-assets/marketplace.json'
      - 'ts/desktop/runtime-assets/plugins/**'
      - 'native/billiardbuddy-chrome/**'
      - 'native/billiardbuddy-browser-use/**'
      - 'native/billiardbuddy-record-replay/**'
      - 'native/billiardbuddy-computer-use/**'
      - 'ts/desktop/scripts/stage-agent-plugins.ts'
      - 'ts/desktop/scripts/native-build-tools.ts'
      - 'ts/desktop/scripts/stage-chrome-plugin.ts'
      - 'ts/desktop/scripts/stage-browser-plugin.ts'
      - 'ts/desktop/scripts/stage-record-replay-plugin.ts'
      - 'ts/desktop/electron/services/inAppBrowserHost.ts'
      - 'ts/desktop/electron/services/recordReplayLifecycle.ts'
      - 'ts/desktop/electron/services/scheduledAgentTasks.ts'
      - 'ts/desktop/scripts/electron-after-pack.cjs'
      - 'ts/desktop/scripts/stage-codex-engine.ts'
      - 'ts/desktop/scripts/verify-codex-engine-smoke.ts'
      - 'ts/desktop/scripts/verify-codex-engine-source.ts'
      - 'ts/desktop/scripts/verify-codex-native-protocol.ts'
      - 'ts/desktop/scripts/verify-browser-use-e2e.ts'
      - 'ts/desktop/scripts/verify-local-agent-plugin-smoke.ts'
      - 'ts/desktop/test/browserUseE2e.ts'
      - '.github/workflows/codex-engine-build.yml'

permissions:
  contents: read

# This is deliberately not a desktop release workflow. It only compiles the
# pinned App Server source and keeps its unsigned build artifact for review.
jobs:
  build-app-server:
    name: ${{ matrix.label }} App Server
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-14
            target: aarch64-apple-darwin
            binary: codex-app-server
            timeout_minutes: 90
          - label: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: codex-app-server.exe
            # Windows cold linking reached the final App Server crate but did
            # not finish within the former 90-minute cap. Keep macOS tight
            # while allowing this one source build to complete.
            timeout_minutes: 150
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装并检查 Gateway 代码
        working-directory: ts
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck:server
          bun test --preload ./test/setup.ts ./test/codexNativeProvider.test.ts

      - name: 安装并检查 Electron 宿主代码
        working-directory: ts/desktop
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run check:electron

      - name: 核对固定源码、许可证和协议边界
        working-directory: ts
        run: bun run verify:codex-engine-source

      - name: 安装与上游锁定一致的 Rust 工具链
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: '1.95.0'

      - name: 准备 Codex 官方 Sandbox V8 产物
        shell: bash
        run: |
          set -euo pipefail
          python3 - '${{ matrix.target }}' "${GITHUB_ENV}" <<'PY'
          import sys
          from pathlib import Path

          scripts = Path('third_party/codex-engine/scripts').resolve()
          sys.path.insert(0, str(scripts))
          from codex_package.targets import TARGET_SPECS
          from codex_package.v8 import resolve_codex_v8_cargo_env

          environment = resolve_codex_v8_cargo_env(TARGET_SPECS[sys.argv[1]])
          with Path(sys.argv[2]).open('a', encoding='utf-8') as output:
              for name, value in environment.items():
                  output.write(f'{name}={value}\n')
          PY

      - name: 按产品合同应用所有已审核内核补丁
        working-directory: third_party/codex-engine
        shell: bash
        run: |
          set -euo pipefail
          bun ../../ts/desktop/scripts/verify-codex-engine-source.ts --apply-product-patches

      - name: 重新生成并核对 App Server 协议类型
        working-directory: third_party/codex-engine/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          python3 app-server-protocol/scripts/write_schema_fixtures.py
          git diff --exit-code -- app-server-protocol/schema/

      - name: 构建 Codex App Server、Code Mode Host 与 Windows 原生 Sandbox 辅助程序
        working-directory: third_party/codex-engine/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target '${{ matrix.target }}' \
            --package codex-app-server --bin codex-app-server
          cargo build --locked --release --target '${{ matrix.target }}' \
            --package codex-code-mode-host --bin codex-code-mode-host
          if [[ '${{ matrix.target }}' == *-windows-* ]]; then
            cargo build --locked --release --target '${{ matrix.target }}' \
              --package codex-windows-sandbox \
              --bin codex-windows-sandbox-setup \
              --bin codex-command-runner
          fi

      - name: 确认引擎产物存在
        shell: bash
        run: |
          set -euo pipefail
          artifact="third_party/codex-engine/codex-rs/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          test -s "${artifact}"
          code_mode_host="third_party/codex-engine/codex-rs/target/${{ matrix.target }}/release/codex-code-mode-host${{ contains(matrix.target, 'windows') && '.exe' || '' }}"
          test -s "${code_mode_host}"
          if [[ '${{ matrix.target }}' == *-windows-* ]]; then
            test -s 'third_party/codex-engine/codex-rs/target/${{ matrix.target }}/release/codex-windows-sandbox-setup.exe'
            test -s 'third_party/codex-engine/codex-rs/target/${{ matrix.target }}/release/codex-command-runner.exe'
          fi

      - name: 构建并核对 BilliardBuddy 本地 Agent 插件
        shell: bash
        run: |
          set -euo pipefail
          bun ts/desktop/scripts/stage-agent-plugins.ts --target '${{ matrix.target }}'
          bun ts/desktop/scripts/stage-chrome-plugin.ts --target '${{ matrix.target }}'
          bun ts/desktop/scripts/stage-browser-plugin.ts --target '${{ matrix.target }}'
          bun ts/desktop/scripts/stage-record-replay-plugin.ts --target '${{ matrix.target }}'
          bun ts/desktop/scripts/stage-agent-plugins.ts --target '${{ matrix.target }}' --verify
          bun ts/desktop/scripts/stage-chrome-plugin.ts --target '${{ matrix.target }}' --verify
          bun ts/desktop/scripts/stage-browser-plugin.ts --target '${{ matrix.target }}' --verify
          bun ts/desktop/scripts/stage-record-replay-plugin.ts --target '${{ matrix.target }}' --verify

      # Hosted runners can verify plugin boot and safe failure paths. They
      # cannot grant a real user's Accessibility, Screen Recording, or Chrome
      # profile permissions; those final permission checks remain device-side.
      - name: 无前端验证本地 Agent 插件与 Browser 宿主链路
        shell: bash
        run: |
          set -euo pipefail
          bun ts/desktop/scripts/verify-local-agent-plugin-smoke.ts --target '${{ matrix.target }}'
          bun ts/desktop/scripts/verify-browser-use-e2e.ts --target '${{ matrix.target }}'

      - name: 保存可校验的本地 Agent 插件
        uses: actions/upload-artifact@v4
        with:
          name: billiardbuddy-local-plugins-${{ matrix.target }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: ts/desktop/runtime-assets/agent-marketplace/

      # Cargo only runs on the GitHub runner. Convert its output into the
      # exact binary + manifest + license bundle Electron accepts, so local
      # development machines can consume the reviewed artifact without a
      # second hot Cargo build.
      - name: 封装受管 Codex 引擎运行时
        working-directory: ts/desktop
        shell: bash
        run: |
          set -euo pipefail
          binary="../../third_party/codex-engine/codex-rs/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          code_mode_host="../../third_party/codex-engine/codex-rs/target/${{ matrix.target }}/release/codex-code-mode-host${{ contains(matrix.target, 'windows') && '.exe' || '' }}"
          if [[ '${{ matrix.target }}' == *-windows-* ]]; then
            bun ./scripts/stage-codex-engine.ts \
              --target '${{ matrix.target }}' \
              --prebuilt-binary "${binary}" \
              --prebuilt-code-mode-host "${code_mode_host}" \
              --prebuilt-windows-sandbox-setup '../../third_party/codex-engine/codex-rs/target/${{ matrix.target }}/release/codex-windows-sandbox-setup.exe' \
              --prebuilt-windows-command-runner '../../third_party/codex-engine/codex-rs/target/${{ matrix.target }}/release/codex-command-runner.exe'
          else
            bun ./scripts/stage-codex-engine.ts \
              --target '${{ matrix.target }}' \
              --prebuilt-binary "${binary}" \
              --prebuilt-code-mode-host "${code_mode_host}"
          fi
          bun ./scripts/stage-codex-engine.ts --target '${{ matrix.target }}' --verify
          bun ./scripts/verify-codex-engine-smoke.ts --target '${{ matrix.target }}'

      - name: 保存可校验的引擎运行时供桌面构建使用
        uses: actions/upload-artifact@v4
        with:
          name: codex-engine-runtime-${{ matrix.target }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: ts/desktop/runtime-assets/binaries/
