name: Codex 源内核-构建验证

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.gitmodules'
      - 'third_party/codex-engine'
      - 'third_party/codex-engine-patches/**'
      - 'ts/shared/product/codexEngineContract.ts'
      - 'ts/desktop/electron/services/codexNativeAppServer.ts'
      - 'ts/desktop/package.json'
      - 'ts/desktop/scripts/stage-codex-engine.ts'
      - 'ts/desktop/scripts/verify-codex-engine-source.ts'
      - 'ts/desktop/scripts/verify-codex-native-protocol.ts'
      - 'ts/scripts/check-release-tracked-files.ts'
      - '.github/workflows/codex-engine-build.yml'
  push:
    branches:
      - main
    paths:
      - '.gitmodules'
      - 'third_party/codex-engine'
      - 'third_party/codex-engine-patches/**'
      - 'ts/shared/product/codexEngineContract.ts'
      - 'ts/desktop/electron/services/codexNativeAppServer.ts'
      - 'ts/desktop/package.json'
      - 'ts/desktop/scripts/stage-codex-engine.ts'
      - 'ts/desktop/scripts/verify-codex-engine-source.ts'
      - 'ts/desktop/scripts/verify-codex-native-protocol.ts'
      - 'ts/scripts/check-release-tracked-files.ts'
      - '.github/workflows/codex-engine-build.yml'

permissions:
  contents: read

# This is deliberately not a desktop release workflow. It only compiles the
# pinned App Server source and keeps its unsigned build artifact for review.
jobs:
  build-app-server:
    name: ${{ matrix.label }} App Server
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-14
            target: aarch64-apple-darwin
            binary: codex-app-server
          - label: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: codex-app-server.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: 核对固定源码、许可证和协议边界
        working-directory: ts
        run: bun run verify:codex-engine-source

      - name: 安装与上游锁定一致的 Rust 工具链
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: '1.95.0'

      - name: 应用已审核的 Hook 凭据环境隔离补丁
        working-directory: third_party/codex-engine
        shell: bash
        run: |
          set -euo pipefail
          patch='../codex-engine-patches/0001-sanitize-hook-environment.patch'
          git apply --check "${patch}"
          git apply --whitespace=nowarn "${patch}"
          git diff --check

      - name: 重新生成并核对 App Server 协议类型
        working-directory: third_party/codex-engine/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -p codex-app-server-protocol --bin write_schema_fixtures
          git diff --exit-code -- app-server-protocol/schema/typescript/v2/ThreadItem.ts

      - name: 仅构建 Codex App Server
        working-directory: third_party/codex-engine/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target '${{ matrix.target }}' \
            --package codex-app-server --bin codex-app-server

      - name: 确认引擎产物存在
        shell: bash
        run: |
          set -euo pipefail
          artifact="third_party/codex-engine/codex-rs/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          test -s "${artifact}"

      - name: 保存未签名引擎构建产物供后续适配审阅
        uses: actions/upload-artifact@v4
        with:
          name: codex-engine-${{ matrix.target }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: third_party/codex-engine/codex-rs/target/${{ matrix.target }}/release/${{ matrix.binary }}
