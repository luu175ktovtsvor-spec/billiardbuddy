name: 桌面版-Windows Agent-only出包

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '构建验证通过后发布到正式更新源'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Windows ${{ matrix.architecture }}
    runs-on: windows-latest
    env:
      BB_AGENT_ONLY_BUILD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    # Codex App Server is built from the locked Rust source before Electron
    # packaging; keep this aligned with the macOS source-build budget.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            target: x86_64-pc-windows-msvc
            timeout_minutes: 360
            codex_build_timeout_minutes: 60
          - architecture: arm64
            target: aarch64-pc-windows-msvc
            timeout_minutes: 180
            codex_build_timeout_minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 Codex 源码锁定的 Rust 工具链
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: 安装当前 Windows job 的 Rust target
        shell: bash
        run: rustup target add '${{ matrix.target }}'

      - name: 准备 Codex 官方 Sandbox V8 验证环境
        shell: bash
        run: |
          set -euo pipefail
          python - '${{ matrix.target }}' "$GITHUB_ENV" <<'PY'
          import sys
          from pathlib import Path

          scripts = Path('third_party/codex-engine/scripts').resolve()
          sys.path.insert(0, str(scripts))
          from codex_package.targets import TARGET_SPECS
          from codex_package.v8 import resolve_codex_v8_cargo_env

          environment = resolve_codex_v8_cargo_env(TARGET_SPECS[sys.argv[1]])
          with Path(sys.argv[2]).open('a', encoding='utf-8') as output:
              for name, value in environment.items():
                  output.write(f'{name}={value}\n')
          PY

      # Bun 1.3.14 occasionally receives a truncated baseline runtime on
      # GitHub's Windows runner when compiling the bundled sidecar. Seed the
      # exact runtime from the managed release origin and verify it
      # before Bun is allowed to use it.
      - name: 预置已校验的 Bun Windows 基线运行时
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $expectedVersion = '1.3.14'
          $runtimeName = "bun-windows-x64-baseline-v$expectedVersion"
          $runtimeUrl = "https://zzyppz.cn/desktop/toolchains/$runtimeName.exe"
          $expectedHash = '9005d0d585d80425e9b715690de3e614651124c94458ef3d3a302ca1a6d3d813'
          $actualVersion = (& bun --version).Trim()
          if ($actualVersion -ne $expectedVersion) {
            throw "Bun version mismatch: expected $expectedVersion, got $actualVersion"
          }

          $bunInstall = if ($env:BUN_INSTALL) { $env:BUN_INSTALL } else { Join-Path $env:USERPROFILE '.bun' }
          $cacheDir = Join-Path $bunInstall 'install\cache'
          $runtimePath = Join-Path $cacheDir $runtimeName
          $downloadPath = "$runtimePath.download"
          New-Item -ItemType Directory -Force $cacheDir | Out-Null
          Remove-Item $downloadPath -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri $runtimeUrl -OutFile $downloadPath

          $actualHash = (Get-FileHash -Algorithm SHA256 $downloadPath).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw 'Bun Windows 基线运行时 SHA-256 不匹配'
          }
          Move-Item -LiteralPath $downloadPath -Destination $runtimePath -Force

      - name: 安装内核依赖
        working-directory: ts
        run: bun install --frozen-lockfile

      - name: 安装桌面依赖
        working-directory: ts/desktop
        run: bun install --frozen-lockfile

      - name: 审计发布源码均已纳入 Git
        working-directory: ts
        run: bun run scripts/check-release-tracked-files.ts

      - name: 统一检查 Agent 宿主、模型适配与锁定协议
        if: matrix.architecture == 'x64'
        working-directory: ts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          bun run check:server
          if ($LASTEXITCODE -ne 0) { throw '服务端类型检查失败' }
          bun test --preload ./test/setup.ts ./test/codexNativeProvider.test.ts
          if ($LASTEXITCODE -ne 0) { throw '模型协议适配测试失败' }
          bun run check:electron
          if ($LASTEXITCODE -ne 0) { throw 'Electron 宿主检查失败' }
          bun run verify:codex-engine-source
          if ($LASTEXITCODE -ne 0) { throw 'Codex 锁定源码与协议检查失败' }

      - name: 验证产品运行路径中的 Rust fmt、check 与 test
        if: matrix.architecture == 'x64'
        shell: bash
        env:
          # The locked app-server guardian test builds a deeply nested async
          # notification fixture. Keep the upstream test unchanged and give
          # the Windows libtest harness the same larger stack used by Codex's
          # own stack-sensitive tests; this changes only test execution.
          RUST_MIN_STACK: '8388608'
          # Keep the Windows libtest harness deterministic. The four tests
          # below are run in their own invocations so their short WebSocket
          # and stdio deadlines cannot be affected by the long suite; every
          # test still runs.
          RUST_TEST_THREADS: '1'
        run: |
          set -euo pipefail
          target='${{ matrix.target }}'
          verification_root="${RUNNER_TEMP}/billiardbuddy-codex-rust-verify"
          verification_source="${verification_root}/source"
          plugin_target="${RUNNER_TEMP}/billiardbuddy-plugin-rust-verify"
          cleanup() {
            git -C third_party/codex-engine worktree remove --force "${verification_source}" >/dev/null 2>&1 || true
            rm -rf "${verification_root}" "${plugin_target}"
          }
          trap cleanup EXIT
          rm -rf "${verification_root}" "${plugin_target}"
          mkdir -p "${verification_root}"
          git -C third_party/codex-engine worktree add --detach "${verification_source}" HEAD
          # Check the locked upstream tree before applying the two product
          # security patches. The patch files are intentionally applied as a
          # separate product layer; the patched tree is covered by cargo
          # check/test below.
          pushd "${verification_source}/codex-rs"
          cargo fmt --all -- --check
          popd
          for patch in \
            third_party/codex-engine-patches/0001-sanitize-hook-environment.patch \
            third_party/codex-engine-patches/0002-sanitize-non-tool-child-environment.patch
          do
            git -C "${verification_source}" apply --check "${GITHUB_WORKSPACE}/${patch}"
            git -C "${verification_source}" apply --whitespace=nowarn "${GITHUB_WORKSPACE}/${patch}"
          done
          git -C "${verification_source}" diff --check

          pushd "${verification_source}/codex-rs"
          cargo check --locked --target "${target}" --all-targets \
            --package codex-app-server \
            --package codex-core \
            --package codex-code-mode-host \
            --package codex-windows-sandbox
          # app-server integration tests resolve this official RMCP helper
          # through target/<triple>/debug. Build it explicitly because it is
          # owned by another workspace package and is not a codex-app-server
          # target.
          cargo build --locked --target "${target}" \
            --package codex-rmcp-client \
            --bin test_stdio_server
          timing_sensitive_tests=(
            'suite::v2::external_agent_config::external_agent_config_secondary_source_imports_session_and_plugin_end_to_end'
            'suite::v2::mcp_server_status::mcp_server_status_list_waits_for_live_stdio_metadata_before_using_cached_tools'
            'suite::v2::realtime_conversation::websocket_v2_tool_call_delegated_turn_can_execute_shell_tool'
            'suite::v2::thread_name_websocket::thread_name_updated_broadcasts_for_loaded_threads'
          )
          # Run the rest of the locked upstream suite first, then execute the
          # timing-sensitive cases one by one. This is partitioning, not an
          # exclusion: all four names are invoked explicitly below.
          cargo test --locked --target "${target}" --all-targets \
            --package codex-app-server \
            --package codex-core \
            --package codex-code-mode-host \
            --package codex-windows-sandbox \
            -- \
            --test-threads=1 \
            --skip "${timing_sensitive_tests[0]}" \
            --skip "${timing_sensitive_tests[1]}" \
            --skip "${timing_sensitive_tests[2]}" \
            --skip "${timing_sensitive_tests[3]}"
          for test_name in "${timing_sensitive_tests[@]}"; do
            cargo test --locked --target "${target}" \
              --package codex-app-server \
              --test all "${test_name}" \
              -- \
              --exact \
              --test-threads=1
          done
          popd

          export CARGO_TARGET_DIR="${plugin_target}"
          for manifest in \
            native/billiardbuddy-browser-use/Cargo.toml \
            native/billiardbuddy-chrome/Cargo.toml \
            native/billiardbuddy-computer-use/Cargo.toml \
            native/billiardbuddy-record-replay/Cargo.toml
          do
            cargo fmt --manifest-path "${manifest}" --all -- --check
            cargo check --locked --manifest-path "${manifest}" --all-targets
            cargo test --locked --manifest-path "${manifest}" --all-targets
          done

      - name: 构建 Windows 安装包（sidecar + renderer + Electron + 打包，脚本内置 --publish never）
        working-directory: .
        env:
          SKIP_INSTALL: '1'
          CODEX_ENGINE_BUILD_TIMEOUT_MINUTES: '${{ matrix.codex_build_timeout_minutes }}'
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ts/desktop/scripts/build-windows-x64.ps1 -Architecture ${{ matrix.architecture }} -AgentOnly

      - name: 验证 x64 受管 Runtime、Hook、插件与 Browser 生产链
        if: matrix.architecture == 'x64'
        working-directory: ts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          bun run verify:codex-runtime-personal-e2e
          if ($LASTEXITCODE -ne 0) { throw '受管 App Server 的 Thread/Turn/恢复 E2E 失败' }
          bun run verify:codex-hook-environment
          if ($LASTEXITCODE -ne 0) { throw '受管 Hook capability 隔离 E2E 失败' }
          bun desktop/scripts/verify-local-agent-plugin-smoke.ts --target '${{ matrix.target }}'
          if ($LASTEXITCODE -ne 0) { throw '本地 Agent 插件 smoke 失败' }
          bun desktop/scripts/verify-browser-use-e2e.ts --target '${{ matrix.target }}'
          if ($LASTEXITCODE -ne 0) { throw '独立 Browser E2E 失败' }

      - name: 校验安装包产物
        shell: pwsh
        run: |
          $target = '${{ matrix.target }}'
          $artifactDir = 'ts/desktop/build-artifacts/windows-${{ matrix.architecture }}'
          bun ts/desktop/scripts/verify-codex-engine-smoke.ts --target $target
          if ($LASTEXITCODE -ne 0) { throw '受管 App Server/ripgrep smoke 失败' }
          $installers = @(Get-ChildItem -LiteralPath $artifactDir -Filter '*.exe' -File -ErrorAction SilentlyContinue)
          if ($installers.Count -ne 1) { throw '未生成唯一的 Windows 安装包' }
          $blockmaps = @(Get-ChildItem -LiteralPath $artifactDir -Filter '*.blockmap' -File -ErrorAction SilentlyContinue)
          if ($blockmaps.Count -ne 1) { throw '未生成唯一的 Windows 更新 blockmap' }
          $updateMetadata = @(Get-ChildItem -LiteralPath $artifactDir -Filter 'latest.yml' -File -ErrorAction SilentlyContinue)
          if ($updateMetadata.Count -ne 1) { throw '未生成唯一的 Windows 更新清单 latest.yml' }
          $installers | ForEach-Object { Write-Host "$($_.Name) $($_.Length) bytes" }

      - name: 解包并审计 Windows 成品
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = '${{ matrix.target }}'
          $artifactDir = 'ts/desktop/build-artifacts/windows-${{ matrix.architecture }}'
          $installer = @(Get-ChildItem -LiteralPath $artifactDir -Filter '*.exe' -File -ErrorAction Stop)
          if ($installer.Count -ne 1) { throw '未生成唯一的 Windows 安装包' }
          $installerAuditDir = Join-Path $env:RUNNER_TEMP 'BilliardBuddy-installer-audit-${{ matrix.architecture }}'
          $appAuditDir = Join-Path $env:RUNNER_TEMP 'BilliardBuddy-app-audit-${{ matrix.architecture }}'
          if ((Test-Path -LiteralPath $installerAuditDir) -or (Test-Path -LiteralPath $appAuditDir)) {
            throw 'Windows 解包审计目录已存在'
          }
          try {
            & 7z x $installer[0].FullName "-o$installerAuditDir" -y | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Windows NSIS 解包失败: $LASTEXITCODE" }
            $appArchives = @(Get-ChildItem -LiteralPath $installerAuditDir -Recurse -Filter 'app-*.7z' -File)
            if ($appArchives.Count -ne 1) { throw 'Windows NSIS 中缺少唯一的 app 架构归档' }
            & 7z x $appArchives[0].FullName "-o$appAuditDir" -y | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Windows App 解包失败: $LASTEXITCODE" }
            $resourcesDir = Join-Path $appAuditDir 'resources'
            if (-not (Test-Path -LiteralPath (Join-Path $resourcesDir 'app.asar') -PathType Leaf)) {
              throw 'Windows 解包内容缺少 resources/app.asar'
            }
            Push-Location ts/desktop
            try {
              bun run audit:package -- --platform win32 --target $target --resources $resourcesDir
            } finally {
              Pop-Location
            }
          } finally {
            Remove-Item -LiteralPath $installerAuditDir, $appAuditDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: 保存已审计的 Windows 安装包
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: BilliardBuddy-windows-${{ matrix.architecture }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ts/desktop/build-artifacts/windows-${{ matrix.architecture }}/*.exe
            ts/desktop/build-artifacts/windows-${{ matrix.architecture }}/*.blockmap
            ts/desktop/build-artifacts/windows-${{ matrix.architecture }}/latest.yml

      - name: 发布 Windows 安装包与更新清单
        if: env.BB_AGENT_ONLY_BUILD != '1' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish == true) && matrix.architecture == 'x64'
        shell: pwsh
        env:
          BB_RELEASE_UPLOAD_SSH_KEY_B64: ${{ secrets.BB_RELEASE_UPLOAD_SSH_KEY_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:BB_RELEASE_UPLOAD_SSH_KEY_B64)) {
            throw '缺少 GitHub Secret: BB_RELEASE_UPLOAD_SSH_KEY_B64'
          }

          $sshDir = Join-Path $env:USERPROFILE '.ssh'
          $keyPath = Join-Path $sshDir 'billiardbuddy-release-upload'
          $knownHostsPath = Join-Path $sshDir 'known_hosts'
          New-Item -ItemType Directory -Force $sshDir | Out-Null
          try {
            [System.IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:BB_RELEASE_UPLOAD_SSH_KEY_B64))
          } catch {
            throw 'BB_RELEASE_UPLOAD_SSH_KEY_B64 不是有效的 Base64 私钥'
          }
          & icacls $keyPath /inheritance:r /grant:r "$($env:USERNAME):(R)" | Out-Null
          'zzyppz.cn ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJIxRR8LH+6jH3sUGNFy9HlxDKRF9MA9QLYm7AYuwa3P' |
          Set-Content -LiteralPath $knownHostsPath -Encoding ascii

          $artifactDir = 'ts/desktop/build-artifacts/windows-x64'
          $installers = @(Get-ChildItem "$artifactDir/*.exe" -ErrorAction Stop)
          $blockmaps = @(Get-ChildItem "$artifactDir/*.blockmap" -ErrorAction Stop)
          $updateMetadata = @(Get-ChildItem "$artifactDir/latest.yml" -ErrorAction Stop)
          if ($installers.Count -ne 1 -or $blockmaps.Count -ne 1 -or $updateMetadata.Count -ne 1) {
            throw 'Windows 发布文件不完整或不唯一'
          }
          $files = @($installers[0], $blockmaps[0], $updateMetadata[0])

          $incoming = "/var/www/desktop-updates/.incoming-win-$env:GITHUB_RUN_ID"
          $sshArgs = @('-i', $keyPath, '-o', 'BatchMode=yes', '-o', 'StrictHostKeyChecking=yes')
          & ssh @sshArgs root@zzyppz.cn "set -eu; mkdir -p '$incoming'"
          if ($LASTEXITCODE -ne 0) { throw '无法创建 Windows 发布暂存目录' }

          foreach ($file in $files) {
            & scp @sshArgs $file.FullName "root@zzyppz.cn:$incoming/$($file.Name)"
            if ($LASTEXITCODE -ne 0) { throw "上传失败: $($file.Name)" }
          }

          $publishCommands = @('set -eu')
          foreach ($file in $files) {
            $publishCommands += "test -s '$incoming/$($file.Name)'"
          }
          foreach ($file in $files) {
            $publishCommands += "mv '$incoming/$($file.Name)' /var/www/desktop-updates/"
          }
          $publishCommands += "rmdir '$incoming'"
          & ssh @sshArgs root@zzyppz.cn ($publishCommands -join '; ')
          if ($LASTEXITCODE -ne 0) { throw 'Windows 发布文件校验或切换失败' }

      - name: 清理临时凭据
        if: always()
        shell: pwsh
        run: |
          Remove-Item 'ts/desktop/build/product-secrets.json' -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:USERPROFILE '.ssh\billiardbuddy-release-upload') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:RUNNER_TEMP 'billiardbuddy-published-0.4.9-installer') -Recurse -Force -ErrorAction SilentlyContinue

# Windows 发布文件仅在本工作流完成构建和完整性校验后上传至受控更新源；electron-builder 本身始终不直接发布。
