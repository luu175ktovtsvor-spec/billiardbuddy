name: 桌面版-Windows现役TS出包

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: 安装内核依赖
        working-directory: ts
        run: bun install --frozen-lockfile

      - name: 安装桌面依赖
        working-directory: ts/desktop
        run: bun install --frozen-lockfile

      - name: 发布前质量门（离线快速）
        shell: bash
        run: bash scripts/quality_gate.sh --quick

      - name: 构建 Windows 安装包（sidecar + renderer + Electron + 打包，脚本内置 --publish never）
        working-directory: ts/desktop
        run: bun run electron:package

      - name: 校验安装包产物
        shell: pwsh
        run: |
          $installers = Get-ChildItem ts/desktop/build-artifacts/electron/*.exe -ErrorAction SilentlyContinue
          if ($installers.Count -eq 0) { throw '未生成 Windows 安装包' }
          $installers | ForEach-Object { Write-Host "$($_.Name) $($_.Length) bytes" }

      - name: 上传安装包 artifact
        uses: actions/upload-artifact@v4
        with:
          name: 球房管家-Windows安装包-${{ github.ref_name }}
          path: |
            ts/desktop/build-artifacts/electron/*.exe
            ts/desktop/build-artifacts/electron/*.yml
          if-no-files-found: error
          retention-days: 7

# 当前只构建并上传 CI artifact。自动更新渠道、签名、版本策略与回滚验证完成前，不自动发布给用户（electron:package 内置 --publish never）。
