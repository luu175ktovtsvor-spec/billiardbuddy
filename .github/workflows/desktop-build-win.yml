name: 桌面版-Windows现役TS出包

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: 安装锁定依赖
        working-directory: ts
        run: bun install --frozen-lockfile

      - name: 发布前质量门
        shell: bash
        run: bash scripts/quality_gate.sh --quick

      - name: 构建 React renderer
        working-directory: ts
        run: bun run ui:build

      - name: 构建 Electron main 和 preload
        working-directory: ts
        run: bun run desktop:build

      - name: 构建 Windows Bun sidecar
        working-directory: ts
        run: bun run build:sidecar

      - name: 生成 Windows 安装包
        working-directory: ts
        run: bunx electron-builder --config electron-builder.yml --win --publish never

      - name: 校验安装包产物
        shell: pwsh
        run: |
          $installers = Get-ChildItem ts/desktop/dist/*.exe -ErrorAction SilentlyContinue
          if ($installers.Count -eq 0) { throw '未生成 Windows 安装包' }
          $installers | ForEach-Object { Write-Host "$($_.Name) $($_.Length) bytes" }

      - name: 上传安装包 artifact
        uses: actions/upload-artifact@v4
        with:
          name: 球房管家-Windows安装包-${{ github.ref_name }}
          path: |
            ts/desktop/dist/*.exe
            ts/desktop/dist/*.yml
          if-no-files-found: error
          retention-days: 7

# 当前只构建和上传 CI artifact。自动更新渠道、签名、版本策略和回滚验证完成前，不自动发布给用户。
