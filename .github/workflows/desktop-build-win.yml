name: 桌面版-Windows现役TS出包

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      # Bun 1.3.14 occasionally receives a truncated baseline runtime on
      # GitHub's Windows runner when compiling the bundled sidecar. Seed the
      # exact runtime from the managed release origin and verify it
      # before Bun is allowed to use it.
      - name: 预置已校验的 Bun Windows 基线运行时
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $expectedVersion = '1.3.14'
          $runtimeName = "bun-windows-x64-baseline-v$expectedVersion"
          $runtimeUrl = "https://zzyppz.cn/desktop/toolchains/$runtimeName.exe"
          $expectedHash = '9005d0d585d80425e9b715690de3e614651124c94458ef3d3a302ca1a6d3d813'
          $actualVersion = (& bun --version).Trim()
          if ($actualVersion -ne $expectedVersion) {
            throw "Bun version mismatch: expected $expectedVersion, got $actualVersion"
          }

          $bunInstall = if ($env:BUN_INSTALL) { $env:BUN_INSTALL } else { Join-Path $env:USERPROFILE '.bun' }
          $cacheDir = Join-Path $bunInstall 'install\cache'
          $runtimePath = Join-Path $cacheDir $runtimeName
          $downloadPath = "$runtimePath.download"
          New-Item -ItemType Directory -Force $cacheDir | Out-Null
          Remove-Item $downloadPath -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri $runtimeUrl -OutFile $downloadPath

          $actualHash = (Get-FileHash -Algorithm SHA256 $downloadPath).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw 'Bun Windows 基线运行时 SHA-256 不匹配'
          }
          Move-Item -LiteralPath $downloadPath -Destination $runtimePath -Force

      - name: 安装内核依赖
        working-directory: ts
        run: bun install --frozen-lockfile

      - name: 安装桌面依赖
        working-directory: ts/desktop
        run: bun install --frozen-lockfile

      - name: 审计发布源码均已纳入 Git
        working-directory: ts
        run: bun run scripts/check-release-tracked-files.ts

      - name: 准备经审核的打包凭据与媒体工具链
        shell: pwsh
        env:
          BB_GATEWAY_TOKEN: ${{ secrets.BB_GATEWAY_TOKEN }}
          BB_WINDOWS_MEDIA_TOOLCHAIN_URL: ${{ secrets.BB_WINDOWS_MEDIA_TOOLCHAIN_URL }}
          BB_WINDOWS_MEDIA_TOOLCHAIN_SHA256: ${{ secrets.BB_WINDOWS_MEDIA_TOOLCHAIN_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:BB_GATEWAY_TOKEN)) {
            throw '缺少 GitHub Secret: BB_GATEWAY_TOKEN'
          }
          if ([string]::IsNullOrWhiteSpace($env:BB_WINDOWS_MEDIA_TOOLCHAIN_URL)) {
            throw '缺少 GitHub Secret: BB_WINDOWS_MEDIA_TOOLCHAIN_URL'
          }
          if ($env:BB_WINDOWS_MEDIA_TOOLCHAIN_URL -notmatch '^https://') {
            throw 'BB_WINDOWS_MEDIA_TOOLCHAIN_URL 必须使用 HTTPS'
          }
          $expectedHash = $env:BB_WINDOWS_MEDIA_TOOLCHAIN_SHA256.Trim().ToLowerInvariant()
          if ($expectedHash -notmatch '^[a-f0-9]{64}$') {
            throw 'BB_WINDOWS_MEDIA_TOOLCHAIN_SHA256 必须是 64 位十六进制 SHA-256'
          }

          $archive = Join-Path $env:RUNNER_TEMP 'billiardbuddy-media-toolchain.zip'
          $sourceDir = Join-Path $env:RUNNER_TEMP 'billiardbuddy-media-toolchain'
          Remove-Item $archive, $sourceDir -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri $env:BB_WINDOWS_MEDIA_TOOLCHAIN_URL -OutFile $archive

          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw '媒体工具链压缩包 SHA-256 不匹配'
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $sourceDir
          @('ffmpeg.exe', 'ffprobe.exe', 'LICENSE.txt', 'media-toolchain-source.json') | ForEach-Object {
            if (-not (Test-Path -LiteralPath (Join-Path $sourceDir $_) -PathType Leaf)) {
              throw "媒体工具链压缩包根目录缺少必需文件: $_"
            }
          }

          $secretFile = 'ts/desktop/build/product-secrets.json'
          New-Item -ItemType Directory -Force (Split-Path $secretFile) | Out-Null
          @{ gatewayToken = $env:BB_GATEWAY_TOKEN } |
            ConvertTo-Json -Compress |
            Set-Content -LiteralPath $secretFile -Encoding utf8NoBOM

          "BB_MEDIA_TOOLCHAIN_SOURCE_DIR=$sourceDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 构建 Windows 安装包（sidecar + renderer + Electron + 打包，脚本内置 --publish never）
        working-directory: ts/desktop
        run: bun run electron:package

      - name: 校验安装包产物
        shell: pwsh
        run: |
          $installers = Get-ChildItem ts/desktop/build-artifacts/electron/*.exe -ErrorAction SilentlyContinue
          if ($installers.Count -eq 0) { throw '未生成 Windows 安装包' }
          $blockmaps = Get-ChildItem ts/desktop/build-artifacts/electron/*.blockmap -ErrorAction SilentlyContinue
          if ($blockmaps.Count -eq 0) { throw '未生成 Windows 更新 blockmap' }
          $updateMetadata = Get-ChildItem ts/desktop/build-artifacts/electron/latest.yml -ErrorAction SilentlyContinue
          if ($updateMetadata.Count -ne 1) { throw '未生成唯一的 Windows 更新清单 latest.yml' }
          $installers | ForEach-Object { Write-Host "$($_.Name) $($_.Length) bytes" }

      - name: 发布 Windows 安装包与更新清单
        shell: pwsh
        env:
          BB_RELEASE_UPLOAD_SSH_KEY: ${{ secrets.BB_RELEASE_UPLOAD_SSH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:BB_RELEASE_UPLOAD_SSH_KEY)) {
            throw '缺少 GitHub Secret: BB_RELEASE_UPLOAD_SSH_KEY'
          }

          $sshDir = Join-Path $env:USERPROFILE '.ssh'
          $keyPath = Join-Path $sshDir 'billiardbuddy-release-upload'
          $knownHostsPath = Join-Path $sshDir 'known_hosts'
          New-Item -ItemType Directory -Force $sshDir | Out-Null
          $env:BB_RELEASE_UPLOAD_SSH_KEY | Set-Content -LiteralPath $keyPath -Encoding ascii -NoNewline
          & icacls $keyPath /inheritance:r /grant:r "$($env:USERNAME):(R)" | Out-Null
          'zzyppz.cn ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJIxRR8LH+6jH3sUGNFy9HlxDKRF9MA9QLYm7AYuwa3P' |
          Set-Content -LiteralPath $knownHostsPath -Encoding ascii

          $artifactDir = 'ts/desktop/build-artifacts/electron'
          $files = @(Get-ChildItem $artifactDir -File | Where-Object {
            $_.Extension -in '.exe', '.blockmap' -or $_.Name -eq 'latest.yml'
          })
          if ($files.Count -lt 3) { throw 'Windows 发布文件不完整' }

          $incoming = "/var/www/desktop-updates/.incoming-win-$env:GITHUB_RUN_ID"
          $sshArgs = @('-i', $keyPath, '-o', 'BatchMode=yes', '-o', 'StrictHostKeyChecking=yes')
          & ssh @sshArgs root@zzyppz.cn "set -eu; mkdir -p '$incoming'"
          if ($LASTEXITCODE -ne 0) { throw '无法创建 Windows 发布暂存目录' }

          foreach ($file in $files) {
            & scp @sshArgs $file.FullName "root@zzyppz.cn:$incoming/$($file.Name)"
            if ($LASTEXITCODE -ne 0) { throw "上传失败: $($file.Name)" }
          }

          $publishCommand = "set -eu; test -s '$incoming/latest.yml'; test -n \"`$(find '$incoming' -maxdepth 1 -type f -name '*.exe' -size +1M -print -quit)\"; test -n \"`$(find '$incoming' -maxdepth 1 -type f -name '*.blockmap' -size +1k -print -quit)\"; for file in '$incoming'/*; do [ -f \"`$file\" ] || continue; mv \"`$file\" /var/www/desktop-updates/; done; rmdir '$incoming'"
          & ssh @sshArgs root@zzyppz.cn $publishCommand
          if ($LASTEXITCODE -ne 0) { throw 'Windows 发布文件校验或切换失败' }

      - name: 清理临时凭据与媒体工具链
        if: always()
        shell: pwsh
        run: |
          Remove-Item 'ts/desktop/build/product-secrets.json' -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:USERPROFILE '.ssh\billiardbuddy-release-upload') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:RUNNER_TEMP 'billiardbuddy-media-toolchain.zip') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:RUNNER_TEMP 'billiardbuddy-media-toolchain') -Recurse -Force -ErrorAction SilentlyContinue

# Windows 发布文件仅在本工作流完成构建和完整性校验后上传至受控更新源；electron-builder 本身始终不直接发布。
