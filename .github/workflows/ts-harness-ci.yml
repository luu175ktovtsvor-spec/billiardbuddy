name: TS 工程质量门

on:
  push:
    branches: [main]
    paths:
      - 'ts/**'
      - 'gateway/**'
      - 'relay/**'
      - 'dataeye/**'
      - 'scripts/**'
      - '.agents/**'
      - '.claude/skills/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'ts/**'
      - 'gateway/**'
      - 'relay/**'
      - 'dataeye/**'
      - 'scripts/**'
      - '.agents/**'
      - '.claude/skills/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/workflows/**'
  workflow_dispatch: {}

concurrency:
  group: ts-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: 安装锁定依赖
        working-directory: ts
        run: bun install --frozen-lockfile
      - name: 执行统一质量门
        run: bash scripts/quality_gate.sh
