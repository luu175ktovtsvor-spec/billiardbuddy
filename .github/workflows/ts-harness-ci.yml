name: TS Harness CI

# 只管新 TS 工程(ts/);Python 那条 desktop-build-win.yml 不动。
on:
  push:
    branches: [ts-harness-rewrite]
    paths: ['ts/**', '.github/workflows/ts-harness-ci.yml']
  pull_request:
    paths: ['ts/**', '.github/workflows/ts-harness-ci.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14' # ≥1.3.13(避 1.3.12 macOS 编译坏签名回归)
      - name: install
        working-directory: ts
        run: bun install
      - name: typecheck
        working-directory: ts
        run: bun run typecheck
      - name: test (unit + sidecar 集成;不含需下大模型的 native spike)
        working-directory: ts
        run: bun test
