# dataeye/deploy/nginx-dataeye.conf
# 装到服务器: /etc/nginx/conf.d/dataeye.conf
# 对外只暴露 /ingest 和看板 /board,PG 自身不对公网开放。

server {
    listen 443 ssl;
    server_name <域名或裸IP>;

    # ssl_certificate     /etc/letsencrypt/live/<域名>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<域名>/privkey.pem;

    # 接收端:桌面客户端上行数据的唯一入口
    location /ingest {
        proxy_pass http://127.0.0.1:9100/ingest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50m;
    }

    # 健康探活(可选对外,建议只内网/curl 用)
    location /health {
        proxy_pass http://127.0.0.1:9100/health;
    }

    # 看板:Bun/TS 自建只读页,加 Basic Auth 挡住陌生人
    location /board {
        proxy_pass http://127.0.0.1:9200;
        auth_basic "dataeye";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
}

# 生成 .htpasswd(装 httpd-tools/apache2-utils 后):
#   htpasswd -c /etc/nginx/.htpasswd <看板账号>
