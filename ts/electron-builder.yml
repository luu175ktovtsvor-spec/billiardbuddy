# ts-desktop 打包配置(electron-builder)。出安装包:bun run desktop:dist(先 desktop:build 出 main.mjs/preload.cjs,
# 再 build:sidecar 出后端二进制放 desktop/binaries,electron-builder 打成 dmg/nsis)。
appId: com.qiufang.assistant
productName: 球房管家
copyright: © 2026
directories:
  output: desktop/dist
  buildResources: desktop/build-resources

# 打进包的文件(前端渲染器 + 编译后的 electron 主/预加载 + package.json)。
# 过渡期两套前端都打进包:vanilla(renderer,默认路径)+ React(renderer-dist,QF_UI_REACT=1 时 loadFile)。
# React 达 parity 正式切默认后,再删 vanilla 那行(对齐蓝图:过时即删)。
files:
  - desktop/electron/main.mjs
  - desktop/electron/preload.cjs
  - desktop/renderer/**/*
  - desktop/renderer-dist/**/*
  - package.json
  - "!**/*.ts"
  - "!**/*.test.*"

# 后端 sidecar 二进制随包(build:sidecar 产物)→ resources/binaries;prod 主进程从 process.resourcesPath/binaries 找。
# ⚠️ bundled 三层能力随包(2026-07-11 修复打包蒸发):编译二进制 import.meta.dir=/$bunfs、cwd=userData
# 都找不到运行时 readdir 读的 .md,故把 agents/skills/commands 发到 Resources/bundled/<name>,
# sidecar 经 resolveBundledDir 按 execPath 相对(<execDir>/../bundled/<name>)定位。缺这段=打包后
# 子代理/技能/斜杠命令静默消失(已实证:repo 外跑编译二进制→命令/技能数=0)。
extraResources:
  - from: desktop/binaries
    to: binaries
    filter:
      - "**/*"
  - from: src/agents/bundled
    to: bundled/agents
    filter:
      - "**/*.md"
  - from: src/skills/bundled
    to: bundled/skills
    filter:
      - "**/*"
  - from: commands
    to: bundled/commands
    filter:
      - "**/*.md"

mac:
  target:
    - dmg
  category: public.app-category.productivity
  # 未签名(开发/自用);正式对外分发需 owner 苹果开发者账号做签名 + 公证(codesign + notarize)。
  identity: null

win:
  target:
    - nsis
  # win 签名同理需 owner 证书;未配则出未签名安装包。

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# 自动更新:发布渠道(generic/github)+ latest.yml 需 owner 定发布服务器后开启(publish 段)。
