<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>球房管家 · Agent</title>
<style>
  /* 设计 token 对齐 docs/design/桌面Agent-macOS设计规范.md(走法 B:中性主体 + 绿色点缀) */
  :root {
    --accent: #10a37f;          /* 绿,只做点缀:链接/焦点/成功/图标 */
    --primary: #1c1c1e;         /* 中性近黑:主按钮 */
    --user-bubble: #eeeef0;     /* 用户气泡中性浅灰 */
    --bg: #ffffff;              /* 主对话区底 */
    --page: #f5f5f7;            /* 页面浅灰 */
    --text: #1d1d1f;            /* 主文字 */
    --text-2: #86868b;          /* 次文字 */
    --hairline: rgba(0,0,0,0.07);
    --danger: #ff3b30;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "PingFang SC", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--font); color: var(--text); background: var(--page); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  #app { display: flex; height: 100vh; background: var(--bg); }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* 侧栏(毛玻璃):新对话 + 会话列表 */
  aside { width: 240px; flex: none; display: flex; flex-direction: column; background: rgba(245,245,247,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-right: 1px solid var(--hairline); -webkit-app-region: drag; }
  aside .top { height: 44px; flex: none; }
  aside .newchat { margin: 4px 12px 8px; }
  aside .newchat button { -webkit-app-region: no-drag; width: 100%; height: 34px; border-radius: 9px; border: 1px solid var(--hairline); background: rgba(255,255,255,0.7); color: var(--text); font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  aside .newchat button:hover { background: #fff; }
  aside .newchat .plus { color: var(--accent); font-size: 15px; line-height: 1; }
  aside .list { -webkit-app-region: no-drag; flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  aside .sess { border-radius: 8px; padding: 7px 10px; margin-bottom: 2px; cursor: default; }
  aside .sess:hover { background: rgba(0,0,0,0.04); }
  aside .sess.active { background: rgba(0,0,0,0.07); }
  aside .sess .t { font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  aside .sess .m { font-size: 11px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
  aside .empty-s { font-size: 12px; color: var(--text-2); padding: 8px 10px; }

  /* 顶栏:可拖拽(红绿灯留白在侧栏区) */
  header { height: 44px; flex: none; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--hairline); -webkit-app-region: drag; background: rgba(245,245,247,0.85); }
  header .title { font-size: 13px; font-weight: 600; }
  header .status { margin-left: 10px; font-size: 12px; color: var(--text-2); -webkit-app-region: no-drag; }
  header .status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--text-2); margin-right: 5px; vertical-align: middle; }
  header .status.online .dot { background: var(--accent); }

  /* 对话线 */
  #thread { flex: 1; overflow-y: auto; padding: 24px 0 16px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 24px; }
  .msg { margin-bottom: 18px; }
  .msg.user .bubble { background: var(--user-bubble); border-radius: 14px; padding: 9px 13px; display: inline-block; max-width: 78%; white-space: pre-wrap; }
  .msg.user { text-align: right; }
  .msg.assistant .text { white-space: pre-wrap; }

  /* 低噪工具流:思考=弱化,工具步骤=折叠行,结果=默认折叠 */
  .thinking { color: var(--text-2); font-size: 13px; border-left: 2px solid var(--hairline); padding: 2px 0 2px 12px; margin: 6px 0; white-space: pre-wrap; }
  .tool { border: 1px solid var(--hairline); border-radius: 10px; margin: 8px 0; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  .tool summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 13px; user-select: none; }
  .tool summary::-webkit-details-marker { display: none; }
  .tool .ico { width: 16px; text-align: center; color: var(--text-2); }
  .tool.ok .ico { color: var(--accent); }
  .tool.err .ico { color: var(--danger); }
  .tool .name { font-weight: 500; }
  .tool .sub { color: var(--text-2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .tool pre { margin: 0; padding: 10px 12px; border-top: 1px solid var(--hairline); background: #fafafa; font-size: 12px; font-family: "SF Mono", ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; }

  /* 审批卡 */
  .approval { border: 1px solid var(--accent); border-radius: 12px; margin: 10px 0; padding: 12px 14px; background: rgba(16,163,127,0.04); }
  .approval .head { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .approval .why { font-size: 12px; color: var(--text-2); margin-bottom: 10px; white-space: pre-wrap; }
  .approval .acts { display: flex; gap: 8px; }
  .approval button { height: 30px; padding: 0 14px; border-radius: 8px; font-size: 13px; cursor: pointer; border: 1px solid var(--hairline); background: #fff; color: var(--text); }
  .approval button.approve { background: var(--primary); color: #fff; border-color: var(--primary); }
  .approval.done { opacity: 0.6; }

  .err-line { color: var(--danger); font-size: 13px; margin: 6px 0; }

  /* 输入区 */
  footer { flex: none; border-top: 1px solid var(--hairline); padding: 12px 0 16px; background: var(--bg); }
  .composer { max-width: 720px; margin: 0 auto; padding: 0 24px; display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { flex: 1; resize: none; border: 1px solid var(--hairline); border-radius: 12px; padding: 10px 13px; font: inherit; font-size: 14px; max-height: 160px; outline: none; }
  .composer textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(16,163,127,0.12); }
  .composer button { height: 40px; padding: 0 18px; border-radius: 12px; border: none; background: var(--primary); color: #fff; font-size: 14px; cursor: pointer; transition: transform .06s; }
  .composer button:active { transform: scale(0.98); }
  .composer button:disabled { opacity: 0.45; cursor: default; }
  .empty { text-align: center; color: var(--text-2); font-size: 14px; margin-top: 22vh; }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="top"></div>
    <div class="newchat"><button id="newchat"><span class="plus">＋</span> 新对话</button></div>
    <div class="list" id="sesslist"><div class="empty-s">还没有会话</div></div>
  </aside>
  <div id="main">
    <header>
      <span class="title">球房管家</span>
      <span class="status" id="status"><span class="dot"></span>连接中…</span>
    </header>
    <div id="thread"><div class="wrap"><div class="empty" id="empty">跟它说点什么，它会读写文件、跑命令、上网查、把活干完。</div></div></div>
    <footer>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="给球房管家发消息…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="send">发送</button>
      </div>
    </footer>
  </div>
</div>
<script src="./app.js"></script>
</body>
</html>
