<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>球房管家 · Agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231A1B1E'/%3E%3Ccircle cx='16' cy='16.5' r='8.2' fill='none' stroke='%23FAFAFA' stroke-width='1.9'/%3E%3Ccircle cx='13' cy='14.5' r='1.2' fill='%23FAFAFA'/%3E%3Ccircle cx='19' cy='14.5' r='1.2' fill='%23FAFAFA'/%3E%3Cpath d='M11.6 18.6c1 1.5 2.6 2.3 4.4 2.3s3.4-.8 4.4-2.3' fill='none' stroke='%23FAFAFA' stroke-width='1.9' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  /* ================= WorkBuddy(腾讯 CodeBuddy)三层 token 系统 =================
     精确值照抄 docs/references/竞品拆解/02-前端设计-配色与质感.md §3.2。
     架构:palette(原始尺度·主题无关)→ semantic(语义层·主题只重写这层)→ component alias(组件别名·沿用旧变量名不改引用)。
     只换皮(颜色/圆角/动效/字体/文案),交互行为与 DOM 结构不动。 */

  /* —— Layer 1 · palette:原始尺度(浅深两套一次定义,与主题无关) —— */
  :root {
    /* 灰阶·浅 gray 1–5 */
    --wb-gray-l1:#FAFAFA; --wb-gray-l2:#F7F7F7; --wb-gray-l3:#F2F2F2; --wb-gray-l4:#EBEBEB; --wb-gray-l5:#E6E6E6;
    /* 灰阶·深 gray 1–5(抬高的暖/冷黑,非 #000) */
    --wb-gray-d1:#0E0F11; --wb-gray-d2:#141518; --wb-gray-d3:#1A1B1E; --wb-gray-d4:#212327; --wb-gray-d5:#2A2C31;
    /* 文字/中性透明度锚·黑 rgba(0,0,0,.x) */
    --wb-black-96:rgba(0,0,0,.96); --wb-black-90:rgba(0,0,0,.9); --wb-black-80:rgba(0,0,0,.8);
    --wb-black-70:rgba(0,0,0,.7); --wb-black-50:rgba(0,0,0,.5); --wb-black-30:rgba(0,0,0,.3); --wb-black-24:rgba(0,0,0,.24);
    --wb-black-12:rgba(0,0,0,.12); --wb-black-08:rgba(0,0,0,.08); --wb-black-06:rgba(0,0,0,.06); --wb-black-04:rgba(0,0,0,.04);
    /* 文字/中性透明度锚·白 rgba(255,255,255,.x)(深色侧) */
    --wb-white-92:rgba(255,255,255,.92); --wb-white-65:rgba(255,255,255,.65); --wb-white-45:rgba(255,255,255,.45); --wb-white-25:rgba(255,255,255,.25);
    --wb-white-12:rgba(255,255,255,.12); --wb-white-10:rgba(255,255,255,.1); --wb-white-08:rgba(255,255,255,.08); --wb-white-06:rgba(255,255,255,.06);
    /* 强调=中性墨色(去绿:主按钮/选中/焦点走中性黑白;青绿旧品牌色 #00C29A/#5FE3C5 已弃用) */
    --wb-ink-light:rgba(0,0,0,.9); --wb-ink-dark:rgba(255,255,255,.92);
    /* 功能状态绿(仅语义:成功✓/diff 新增;非品牌主调,已从青绿改为常规绿) */
    --wb-ok-light:#1f8a52; --wb-ok-dark:#4fc98a;
    /* 体系外必要色:危险/警告(保留) */
    --wb-red:#ff3b30; --wb-orange:#ff9500;
    /* 圆角量表 xs/sm/md/lg/xl/2xl/full */
    --wb-radius-xs:2px; --wb-radius-sm:4px; --wb-radius-md:6px; --wb-radius-lg:8px; --wb-radius-xl:12px; --wb-radius-2xl:16px; --wb-radius-full:9999px;
    /* 动效时长 fast/sm/base/slow + 两条缓动 */
    --wb-dur-fast:120ms; --wb-dur-sm:150ms; --wb-dur-base:200ms; --wb-dur-slow:320ms;
    --wb-ease-standard:cubic-bezier(.4,0,.2,1); --wb-ease-emphasized:cubic-bezier(.2,0,0,1);
    /* 字体系统栈(body 走系统字体,CJK 兜 PingFang SC) */
    --wb-font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "PingFang SC", sans-serif;
    --wb-font-mono:"SF Mono", ui-monospace, Menlo, monospace;
    /* 阴影:柔和·多层·低透明度 */
    --wb-shadow-sm:0 1px 2px rgba(0,0,0,.04);
    --wb-shadow-md:0 4px 12px rgba(0,0,0,.06), 0 3px 6px rgba(0,0,0,.04);
  }

  /* —— Layer 2 · semantic:语义层(浅色默认) —— */
  :root {
    --wb-text-primary:var(--wb-black-90);
    --wb-text-secondary:var(--wb-black-70);
    --wb-text-tertiary:var(--wb-black-50);
    --wb-text-disabled:var(--wb-black-30);
    --wb-bg-base:var(--wb-gray-l2);          /* 页面底(gray-2) */
    --wb-bg-elevated:#FFFFFF;                /* 主对话区/白卡/浮层 */
    --wb-bg-sunken:var(--wb-gray-l3);        /* 代码块/pre 底、次级面板(gray-3) */
    --wb-bg-sidebar:rgba(247,247,247,0.85);  /* 侧栏/顶栏毛玻璃(gray-2 半透) */
    --wb-bg-surface-trans:rgba(255,255,255,0.7); /* 半透白面(新对话按钮) */
    --wb-fill-hover:var(--wb-black-04);
    --wb-fill-active:var(--wb-black-06);
    --wb-border:var(--wb-black-08);
    --wb-border-strong:var(--wb-black-12);
    --wb-brand:var(--wb-ink-light);          /* 强调=中性墨:链接/角标/选中/焦点走中性,不再用青绿 */
    --wb-brand-tint:var(--wb-black-06);      /* 中性浅染(选中/审批卡底) */
    --wb-brand-tint-weak:rgba(0,0,0,0.035);
    --wb-focus-ring:rgba(0,0,0,0.20);
    --wb-danger:var(--wb-red);
    --wb-warn:#b25000;
    --wb-warn-tint:rgba(255,149,0,0.10);
    --wb-add-bg:rgba(31,138,82,0.12); --wb-add-fg:var(--wb-ok-light);
    --wb-del-bg:rgba(255,59,48,0.10); --wb-del-fg:#c0392b;
    --wb-bubble-user:var(--wb-gray-l4);      /* 用户气泡中性浅灰 */
    /* 主按钮:中性黑(非品牌色);hover 96%/active 80% */
    --wb-btn-primary-bg:var(--wb-black-90);
    --wb-btn-primary-bg-hover:var(--wb-black-96);
    --wb-btn-primary-bg-active:var(--wb-black-80);
    --wb-btn-primary-fg:#FFFFFF;
    /* 流光扫字锚点(§3.2:透明度 0.26/0.55) */
    --wb-shine-base:rgba(0,0,0,0.26);
    --wb-shine-hi:rgba(0,0,0,0.55);
  }

  /* —— 深色:只重写语义层。显式 data-theme + 跟随系统 —— */
  :root[data-theme="dark"] {
    --wb-text-primary:var(--wb-white-92);
    --wb-text-secondary:var(--wb-white-65);
    --wb-text-tertiary:var(--wb-white-45);
    --wb-text-disabled:var(--wb-white-25);
    --wb-bg-base:var(--wb-gray-d2);
    --wb-bg-elevated:var(--wb-gray-d3);
    --wb-bg-sunken:var(--wb-gray-d1);
    --wb-bg-sidebar:rgba(20,21,24,0.80);
    --wb-bg-surface-trans:rgba(255,255,255,0.06);
    --wb-fill-hover:var(--wb-white-06);
    --wb-fill-active:var(--wb-white-10);
    --wb-border:var(--wb-white-10);
    --wb-border-strong:var(--wb-white-12);
    --wb-brand:var(--wb-ink-dark);
    --wb-brand-tint:var(--wb-white-10);
    --wb-brand-tint-weak:rgba(255,255,255,0.06);
    --wb-focus-ring:rgba(255,255,255,0.22);
    --wb-warn:#e0904a;
    --wb-warn-tint:rgba(255,149,0,0.14);
    --wb-add-bg:rgba(79,201,138,0.16); --wb-add-fg:var(--wb-ok-dark);
    --wb-del-bg:rgba(255,99,90,0.14); --wb-del-fg:#ff8a80;
    --wb-bubble-user:var(--wb-gray-d4);
    --wb-btn-primary-bg:var(--wb-white-92);
    --wb-btn-primary-bg-hover:#FFFFFF;
    --wb-btn-primary-bg-active:var(--wb-white-65);
    --wb-btn-primary-fg:var(--wb-gray-d1);
    --wb-shine-base:rgba(255,255,255,0.26);
    --wb-shine-hi:rgba(255,255,255,0.55);
    --wb-shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --wb-shadow-md:0 4px 12px rgba(0,0,0,.4), 0 3px 6px rgba(0,0,0,.3);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --wb-text-primary:var(--wb-white-92);
      --wb-text-secondary:var(--wb-white-65);
      --wb-text-tertiary:var(--wb-white-45);
      --wb-text-disabled:var(--wb-white-25);
      --wb-bg-base:var(--wb-gray-d2);
      --wb-bg-elevated:var(--wb-gray-d3);
      --wb-bg-sunken:var(--wb-gray-d1);
      --wb-bg-sidebar:rgba(20,21,24,0.80);
      --wb-bg-surface-trans:rgba(255,255,255,0.06);
      --wb-fill-hover:var(--wb-white-06);
      --wb-fill-active:var(--wb-white-10);
      --wb-border:var(--wb-white-10);
      --wb-border-strong:var(--wb-white-12);
      --wb-brand:var(--wb-ink-dark);
      --wb-brand-tint:var(--wb-white-10);
      --wb-brand-tint-weak:rgba(255,255,255,0.06);
      --wb-focus-ring:rgba(255,255,255,0.22);
      --wb-warn:#e0904a;
      --wb-warn-tint:rgba(255,149,0,0.14);
      --wb-add-bg:rgba(79,201,138,0.16); --wb-add-fg:var(--wb-ok-dark);
      --wb-del-bg:rgba(255,99,90,0.14); --wb-del-fg:#ff8a80;
      --wb-bubble-user:var(--wb-gray-d4);
      --wb-btn-primary-bg:var(--wb-white-92);
      --wb-btn-primary-bg-hover:#FFFFFF;
      --wb-btn-primary-bg-active:var(--wb-white-65);
      --wb-btn-primary-fg:var(--wb-gray-d1);
      --wb-shine-base:rgba(255,255,255,0.26);
      --wb-shine-hi:rgba(255,255,255,0.55);
      --wb-shadow-sm:0 1px 2px rgba(0,0,0,.3);
      --wb-shadow-md:0 4px 12px rgba(0,0,0,.4), 0 3px 6px rgba(0,0,0,.3);
    }
  }

  /* —— Layer 3 · component alias:沿用旧变量名,repoint 到语义 token(旧 var() 引用零改动) —— */
  :root {
    --accent:var(--wb-brand);            /* 中性墨,只点缀 */
    --primary:var(--wb-btn-primary-bg);  /* 中性主按钮 */
    --primary-fg:var(--wb-btn-primary-fg);
    --user-bubble:var(--wb-bubble-user);
    --bg:var(--wb-bg-elevated);
    --page:var(--wb-bg-base);
    --text:var(--wb-text-primary);
    --text-2:var(--wb-text-tertiary);
    --hairline:var(--wb-border);
    --danger:var(--wb-danger);
    --font:var(--wb-font);
  }

  /* —— 流光扫字(§3.2 @keyframes cb-shining-text-sweep,背景位置 200%→-200%) —— */
  @keyframes cb-shining-text-sweep { 0% { background-position: 200% center; } 100% { background-position: -200% center; } }
  .wb-shining {
    background: linear-gradient(100deg, var(--wb-shine-base) 0 40%, var(--wb-shine-hi) 50%, var(--wb-shine-base) 60% 100%);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: cb-shining-text-sweep 2.2s linear infinite;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--font); color: var(--text); background: var(--page); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  #app { display: flex; height: 100vh; background: var(--bg); }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  /* 右侧预览面板(§9) */
  #preview { width: 340px; flex: none; border-left: 1px solid var(--hairline); display: none; flex-direction: column; background: var(--wb-bg-sunken); }
  #preview.show { display: flex; }
  #preview .pv-head { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 14px; border-bottom: 1px solid var(--hairline); font-size: 13px; font-weight: 600; }
  #preview .pv-head button { border: none; background: none; color: var(--text-2); cursor: pointer; font-size: 16px; }
  #preview .pv-body { flex: 1; overflow: auto; }
  #preview .changed { padding: 8px; }
  #preview .changed .cf { font-size: 12px; padding: 5px 8px; border-radius: var(--wb-radius-md); cursor: pointer; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: background var(--wb-dur-sm) var(--wb-ease-standard); }
  #preview .changed .cf:hover { background: var(--wb-fill-active); }
  #preview .changed .cf .ico { color: var(--accent); margin-right: 4px; }
  #preview pre { margin: 0; padding: 10px 12px; font-size: 12px; font-family: var(--wb-font-mono); white-space: pre-wrap; word-break: break-word; }
  header .changes-btn { -webkit-app-region: no-drag; margin-left: auto; font-size: 12px; color: var(--text-2); background: var(--wb-fill-active); border: none; border-radius: var(--wb-radius-md); padding: 3px 9px; cursor: pointer; display: none; transition: background var(--wb-dur-sm) var(--wb-ease-standard); }
  header .changes-btn.has { display: inline-block; }
  header .changes-btn:hover { background: var(--wb-border-strong); }
  header .changes-btn .n { color: var(--accent); font-weight: 600; }

  /* 侧栏(毛玻璃):新对话 + 对话列表 */
  aside { width: 240px; flex: none; display: flex; flex-direction: column; background: var(--wb-bg-sidebar); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-right: 1px solid var(--hairline); -webkit-app-region: drag; }
  aside .top { height: 44px; flex: none; }
  aside .newchat { margin: 4px 12px 8px; }
  aside .newchat button { -webkit-app-region: no-drag; width: 100%; height: 34px; border-radius: var(--wb-radius-lg); border: 1px solid var(--hairline); background: var(--wb-bg-surface-trans); color: var(--text); font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background var(--wb-dur-sm) var(--wb-ease-standard), border-color var(--wb-dur-sm) var(--wb-ease-standard); }
  aside .newchat button:hover { background: var(--wb-bg-elevated); border-color: var(--wb-border-strong); }
  aside .newchat .plus { color: var(--accent); font-size: 15px; line-height: 1; }
  /* 工作区栏 + 目录树 */
  aside .ws { -webkit-app-region: no-drag; margin: 0 12px 8px; }
  aside .ws .row { display: flex; align-items: center; gap: 6px; }
  aside .ws .path { flex: 1; font-size: 11px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  aside .ws .pick { font-size: 11px; color: var(--accent); background: none; border: none; cursor: pointer; padding: 2px 4px; white-space: nowrap; }
  aside .tree { -webkit-app-region: no-drag; max-height: 180px; overflow: auto; margin: 4px 0 4px 12px; padding-right: 8px; }
  aside .tree .node { font-size: 12px; color: var(--text); padding: 2px 4px; border-radius: var(--wb-radius-sm); cursor: default; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background var(--wb-dur-fast) var(--wb-ease-standard); }
  aside .tree .node:hover { background: var(--wb-fill-hover); }
  aside .tree .node.dir { cursor: pointer; }
  aside .tree .ico { color: var(--text-2); margin-right: 3px; }
  aside .list { -webkit-app-region: no-drag; flex: 1; overflow-y: auto; padding: 0 8px 12px; border-top: 1px solid var(--hairline); }
  aside .list-title { font-size: 11px; color: var(--text-2); padding: 8px 10px 2px; }
  aside .sess { border-radius: var(--wb-radius-lg); padding: 7px 10px; margin-bottom: 2px; cursor: default; transition: background var(--wb-dur-sm) var(--wb-ease-standard); }
  aside .sess:hover { background: var(--wb-fill-hover); }
  aside .sess.active { background: var(--wb-fill-active); }
  aside .sess .t { font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  aside .sess .m { font-size: 11px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
  aside .empty-s { font-size: 12px; color: var(--text-2); padding: 8px 10px; }

  /* 顶栏:可拖拽(红绿灯留白在侧栏区) */
  header { height: 44px; flex: none; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--hairline); -webkit-app-region: drag; background: var(--wb-bg-sidebar); }
  header .title { font-size: 13px; font-weight: 600; }
  header .status { margin-left: 10px; font-size: 12px; color: var(--text-2); -webkit-app-region: no-drag; }
  header .status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--text-2); margin-right: 5px; vertical-align: middle; }
  header .status.online .dot { background: var(--accent); }
  /* 加载态:未连接时的状态文案走"流光扫字"(§3.2 loading) */
  header .status:not(.online) {
    background: linear-gradient(100deg, var(--wb-shine-base) 0 40%, var(--wb-shine-hi) 50%, var(--wb-shine-base) 60% 100%);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: cb-shining-text-sweep 2.2s linear infinite;
  }

  /* 对话线 */
  #thread { flex: 1; overflow-y: auto; padding: 24px 0 16px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 24px; }
  .msg { margin-bottom: 18px; }
  .msg.user .bubble { background: var(--user-bubble); border-radius: var(--wb-radius-xl); padding: 9px 13px; display: inline-block; max-width: 78%; white-space: pre-wrap; }
  .msg.user { text-align: right; }
  .msg.assistant .text { white-space: pre-wrap; }

  /* 低噪工具流:思考=弱化,工具步骤=折叠行,结果=默认折叠 */
  .thinking { color: var(--text-2); font-size: 13px; border-left: 2px solid var(--hairline); padding: 2px 0 2px 12px; margin: 6px 0; white-space: pre-wrap; }
  .tool { border: 1px solid var(--hairline); border-radius: var(--wb-radius-lg); margin: 8px 0; overflow: hidden; box-shadow: var(--wb-shadow-sm); }
  .tool summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 13px; user-select: none; transition: background var(--wb-dur-fast) var(--wb-ease-standard); }
  .tool summary:hover { background: var(--wb-fill-hover); }
  .tool summary::-webkit-details-marker { display: none; }
  .tool .ico { width: 16px; text-align: center; color: var(--text-2); }
  .tool.ok .ico { color: var(--accent); }
  .tool.err .ico { color: var(--danger); }
  .tool .name { font-weight: 500; }
  .tool .sub { color: var(--text-2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .tool pre { margin: 0; padding: 10px 12px; border-top: 1px solid var(--hairline); background: var(--wb-bg-sunken); font-size: 12px; font-family: var(--wb-font-mono); white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; }
  /* diff 面板:文件改动彩色渲染(绿加/红删) */
  .diff { margin: 0; border-top: 1px solid var(--hairline); font-size: 12px; font-family: var(--wb-font-mono); max-height: 360px; overflow: auto; }
  .diff .ln { display: block; padding: 0 12px; white-space: pre-wrap; word-break: break-word; }
  .diff .add { background: var(--wb-add-bg); color: var(--wb-add-fg); }
  .diff .del { background: var(--wb-del-bg); color: var(--wb-del-fg); }
  .diff .hunk { background: var(--wb-fill-hover); color: var(--text-2); }

  /* 审批卡(选中/待确认描边用品牌绿,§3.2 品牌只点缀描边) */
  .approval { border: 1px solid var(--accent); border-radius: var(--wb-radius-xl); margin: 10px 0; padding: 12px 14px; background: var(--wb-brand-tint-weak); }
  .approval .head { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .approval .warn { font-size: 12px; color: var(--wb-warn); background: var(--wb-warn-tint); border-radius: var(--wb-radius-md); padding: 5px 8px; margin-bottom: 8px; }
  .approval .why { font-size: 12px; color: var(--text-2); margin-bottom: 10px; white-space: pre-wrap; }
  .approval .acts { display: flex; gap: 8px; }
  .approval button { height: 30px; padding: 0 14px; border-radius: var(--wb-radius-lg); font-size: 13px; cursor: pointer; border: 1px solid var(--hairline); background: var(--wb-bg-elevated); color: var(--text); transition: background var(--wb-dur-sm) var(--wb-ease-standard), border-color var(--wb-dur-sm) var(--wb-ease-standard); }
  .approval button.approve { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
  .approval button.approve:hover { background: var(--wb-btn-primary-bg-hover); }
  .approval button.approve-session { border-color: var(--accent); color: var(--accent); }
  .approval.done { opacity: 0.6; }

  .err-line { color: var(--danger); font-size: 13px; margin: 6px 0; }
  .retry-btn { font-size: 12px; color: var(--accent); background: none; border: 1px solid var(--accent); border-radius: var(--wb-radius-md); padding: 1px 8px; cursor: pointer; margin-left: 4px; transition: background var(--wb-dur-sm) var(--wb-ease-standard); }
  .retry-btn:hover { background: var(--wb-brand-tint); }

  /* 输入区 */
  footer { position: relative; flex: none; border-top: 1px solid var(--hairline); padding: 12px 0 16px; background: var(--bg); }
  .composer-wrap { max-width: 720px; margin: 0 auto; padding: 0 24px; }
  .expert-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .expert-row label { font-size: 12px; color: var(--text-2); }
  .expert-row select { font: inherit; font-size: 12px; color: var(--text); background: var(--wb-fill-hover); border: 1px solid var(--hairline); border-radius: var(--wb-radius-md); padding: 3px 8px; cursor: pointer; outline: none; transition: border-color var(--wb-dur-sm) var(--wb-ease-standard); }
  .expert-row select:focus { border-color: var(--accent); }
  .composer { display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { flex: 1; resize: none; border: 1px solid var(--hairline); border-radius: var(--wb-radius-xl); padding: 10px 13px; font: inherit; font-size: 14px; max-height: 160px; outline: none; background: var(--wb-bg-elevated); color: var(--text); transition: border-color var(--wb-dur-sm) var(--wb-ease-standard), box-shadow var(--wb-dur-sm) var(--wb-ease-standard); }
  .composer textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--wb-focus-ring); }
  .composer button { height: 40px; padding: 0 18px; border-radius: var(--wb-radius-xl); border: none; background: var(--primary); color: var(--primary-fg); font-size: 14px; cursor: pointer; transition: transform var(--wb-dur-fast) var(--wb-ease-standard), background var(--wb-dur-sm) var(--wb-ease-standard); }
  .composer button:hover:not(:disabled) { background: var(--wb-btn-primary-bg-hover); }
  .composer button:active { transform: scale(0.98); }
  .composer button:disabled { opacity: 0.45; cursor: default; }
  .empty { text-align: center; color: var(--text-2); font-size: 14px; margin-top: 22vh; }

  /* —— 流式尾光标(cc AssistantMessage:isStreaming 时气泡尾闪烁竖条,色=品牌绿) —— */
  .msg.assistant .av { display: inline; white-space: pre-wrap; }
  .wb-cursor { display: inline-block; width: 2px; height: 1em; background: var(--accent); vertical-align: text-bottom; margin-left: 1px; border-radius: 1px; animation: wb-cursor-blink 1s step-end infinite; }
  @keyframes wb-cursor-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  /* —— 助手富文本(机制抄 cc markdown,配色全用 wb token)。收尾渲染后 .text 切 .md:关掉 pre-wrap,交给块元素排版。 —— */
  .msg.assistant .text.md { white-space: normal; }
  .msg.assistant .text.md > :first-child { margin-top: 0; }
  .msg.assistant .text.md > :last-child { margin-bottom: 0; }
  .md-p { margin: 8px 0; line-height: 1.6; }
  .md-h { font-weight: 600; color: var(--wb-text-primary); line-height: 1.35; margin: 16px 0 7px; }
  .md-h1 { font-size: 1.4em; } .md-h2 { font-size: 1.24em; } .md-h3 { font-size: 1.1em; }
  .md-h4, .md-h5, .md-h6 { font-size: 1em; } .md-h6 { color: var(--wb-text-secondary); }
  .md-ul, .md-ol { margin: 8px 0; padding-left: 22px; }
  .md-ul { list-style: disc; } .md-ol { list-style: decimal; }
  .md-ul li, .md-ol li { margin: 3px 0; line-height: 1.55; }
  .md-ul li::marker, .md-ol li::marker { color: var(--wb-text-tertiary); }
  .md-quote { border-left: 3px solid var(--wb-border-strong); padding: 2px 0 2px 12px; margin: 8px 0; color: var(--wb-text-secondary); }
  .md-hr { border: none; border-top: 1px solid var(--wb-border); margin: 16px 0; }
  .msg.assistant .text.md a { color: var(--wb-brand); text-decoration: none; word-break: break-word; }
  .msg.assistant .text.md a:hover { text-decoration: underline; }
  .msg.assistant .text.md strong { font-weight: 600; color: var(--wb-text-primary); }
  .msg.assistant .text.md em { font-style: italic; }
  .msg.assistant .text.md del { color: var(--wb-text-tertiary); }
  /* 行内 code:浅底圆角(§ wb bg-sunken + border) */
  .md-ic { font-family: var(--wb-font-mono); font-size: 0.9em; background: var(--wb-bg-sunken); border: 1px solid var(--wb-border); border-radius: var(--wb-radius-sm); padding: 1px 5px; color: var(--wb-text-primary); word-break: break-word; }

  /* —— 代码卡片(cc CodeViewer:顶部条 语言/文件名/行数 + 复制;等宽 + overflow-x 横向滚动不撑破) —— */
  .code-card { border: 1px solid var(--wb-border); border-radius: var(--wb-radius-lg); overflow: hidden; margin: 10px 0; box-shadow: var(--wb-shadow-sm); background: var(--wb-bg-sunken); }
  .cc-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 10px 6px 12px; background: var(--wb-bg-sunken); border-bottom: 1px solid var(--wb-border); }
  .cc-meta { display: flex; align-items: baseline; gap: 10px; min-width: 0; overflow: hidden; }
  .cc-lang { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--wb-text-secondary); flex: none; }
  .cc-file { font-size: 11px; font-family: var(--wb-font-mono); color: var(--wb-text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cc-lines { font-size: 11px; color: var(--wb-text-tertiary); flex: none; }
  .cc-copy { -webkit-app-region: no-drag; flex: none; font-size: 11px; color: var(--wb-text-secondary); background: var(--wb-bg-elevated); border: 1px solid var(--wb-border); border-radius: var(--wb-radius-md); padding: 2px 10px; cursor: pointer; transition: background var(--wb-dur-sm) var(--wb-ease-standard), color var(--wb-dur-sm) var(--wb-ease-standard), border-color var(--wb-dur-sm) var(--wb-ease-standard); }
  .cc-copy:hover { background: var(--wb-fill-hover); color: var(--wb-text-primary); }
  .cc-copy.done { color: var(--wb-brand); border-color: var(--wb-brand); }
  .cc-body { margin: 0; padding: 10px 12px; background: var(--wb-bg-sunken); max-height: 420px; overflow: auto; }
  .cc-body code { display: block; font-family: var(--wb-font-mono); font-size: 12.5px; line-height: 1.5; white-space: pre; color: var(--wb-text-primary); }

  /* —— 复制轻提示 toast(WorkBuddy 中性,深浅色都清晰) —— */
  #wb-toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(8px); background: var(--wb-text-primary); color: var(--wb-bg-elevated); font-size: 12.5px; padding: 7px 16px; border-radius: var(--wb-radius-full); box-shadow: var(--wb-shadow-md); opacity: 0; pointer-events: none; transition: opacity var(--wb-dur-base) var(--wb-ease-standard), transform var(--wb-dur-base) var(--wb-ease-standard); z-index: 200; }
  #wb-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* —— 思考折叠块(cc ThinkingBlock:▸思考中+循环动画点 / 已思考;body 可滚,默认折叠低噪) —— */
  .think { margin: 6px 0; }
  .think > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); user-select: none; padding: 2px 0; transition: color var(--wb-dur-fast) var(--wb-ease-standard); }
  .think > summary:hover { color: var(--wb-text-secondary); }
  .think > summary::-webkit-details-marker { display: none; }
  .think > summary .caret::before { content: '\25B8'; font-size: 10px; color: var(--text-2); }
  .think[open] > summary .caret::before { content: '\25BE'; }
  .think > summary .label { font-weight: 500; font-style: italic; }
  .think > summary .dots::after { content: ''; animation: wb-think-dots 1.4s steps(1, end) infinite; }
  .think:not(.active) > summary .dots { display: none; }
  @keyframes wb-think-dots { 0%, 20% { content: ''; } 40% { content: '\00B7'; } 60% { content: '\00B7\00B7'; } 80%, 100% { content: '\00B7\00B7\00B7'; } }
  .think-body { max-height: 300px; overflow-y: auto; margin-top: 4px; padding: 8px 10px; border-left: 2px solid var(--hairline); font-size: 12px; color: var(--text-2); white-space: pre-wrap; word-break: break-word; line-height: 1.5; }

  /* —— 运行指示 pill(cc StreamingIndicator:闪烁✦ + 动词 + 计时 + token 估算) —— */
  #run-indicator { display: none; align-items: center; gap: 6px; width: fit-content; margin: 0 auto 8px; padding: 3px 11px; border: 1px solid var(--hairline); border-radius: var(--wb-radius-full); background: var(--wb-bg-elevated); box-shadow: var(--wb-shadow-sm); }
  #run-indicator.show { display: flex; }
  #run-indicator .spark { color: var(--accent); font-size: 12px; line-height: 1; animation: wb-spark-blink 1.6s ease-in-out infinite; }
  #run-indicator .verb { font-size: 12px; font-weight: 500; color: var(--text-2); }
  #run-indicator .meta { font-size: 11px; color: var(--wb-text-tertiary); }
  @keyframes wb-spark-blink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

  /* —— 回到最新药丸(cc MessageList jump-to-latest:WorkBuddy 中性白底 + 绿 ↓) —— */
  .jump-latest { position: absolute; right: 24px; top: -48px; z-index: 20; display: none; align-items: center; gap: 6px; height: 32px; padding: 0 13px; border: 1px solid var(--hairline); border-radius: var(--wb-radius-full); background: var(--wb-bg-elevated); color: var(--text); font-size: 12px; cursor: pointer; box-shadow: var(--wb-shadow-md); -webkit-app-region: no-drag; transition: border-color var(--wb-dur-sm) var(--wb-ease-standard), background var(--wb-dur-sm) var(--wb-ease-standard); }
  .jump-latest.show { display: inline-flex; }
  .jump-latest:hover { border-color: var(--accent); background: var(--wb-fill-hover); }
  .jump-latest .arr { color: var(--accent); font-size: 13px; line-height: 1; }

  /* —— 斜杠命令面板(cc ChatInput slashMenu:输入 / 弹命令,↑↓ 选 / Enter·Tab 选中 / Esc 关;WorkBuddy 中性卡 + 绿点缀选中) —— */
  .composer { position: relative; }
  .cmd-panel { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: 40; border: 1px solid var(--hairline); border-radius: var(--wb-radius-xl); background: var(--wb-bg-elevated); box-shadow: var(--wb-shadow-md); overflow: hidden; }
  .cmd-panel[hidden] { display: none; }
  .cmd-list { max-height: 300px; overflow-y: auto; padding: 4px; }
  .cmd-item { display: flex; align-items: baseline; gap: 10px; width: 100%; padding: 8px 10px; border-radius: var(--wb-radius-lg); cursor: pointer; text-align: left; transition: background var(--wb-dur-fast) var(--wb-ease-standard); }
  .cmd-item:hover { background: var(--wb-fill-hover); }
  .cmd-item.active { background: var(--wb-brand-tint); box-shadow: inset 0 0 0 1px var(--wb-focus-ring); }
  .cmd-item .cmd-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; flex: none; }
  .cmd-item .cmd-arg { font-family: var(--wb-font-mono); font-size: 11px; color: var(--wb-text-tertiary); white-space: nowrap; flex: none; }
  .cmd-item .cmd-desc { flex: 1; min-width: 0; font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmd-item .cmd-src { flex: none; font-size: 10px; line-height: 1.7; padding: 0 6px; border-radius: var(--wb-radius-full); white-space: nowrap; align-self: center; }
  .cmd-src.src-builtin { background: var(--wb-fill-active); color: var(--text-2); }
  .cmd-src.src-skill { background: var(--wb-brand-tint); color: var(--wb-brand); }
  .cmd-src.src-billiards { background: var(--wb-brand-tint); color: var(--wb-brand); box-shadow: inset 0 0 0 1px var(--wb-focus-ring); }
  .cmd-empty { padding: 14px 12px; font-size: 12px; color: var(--text-2); text-align: center; }
  .cmd-hint { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; border-top: 1px solid var(--hairline); padding: 6px 12px; font-size: 11px; color: var(--wb-text-tertiary); }
  .cmd-hint kbd { font-family: var(--wb-font-mono); font-size: 10px; border: 1px solid var(--hairline); border-radius: var(--wb-radius-sm); background: var(--wb-bg-sunken); padding: 0 4px; color: var(--text-2); }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="top"></div>
    <div class="newchat"><button id="newchat"><span class="plus">＋</span> 新对话</button></div>
    <div class="ws">
      <div class="row"><span class="path" id="ws-path" title="">默认工作区</span><button class="pick" id="ws-pick">选择</button></div>
      <div class="tree" id="ws-tree"></div>
    </div>
    <div class="list-title">对话</div>
    <div class="list" id="sesslist"><div class="empty-s">还没有对话，点上面「新对话」开个头。</div></div>
  </aside>
  <div id="main">
    <header>
      <span class="title">球房管家</span>
      <span class="status" id="status"><span class="dot"></span>正在连接…</span>
      <button class="changes-btn has" id="tasks-btn" style="margin-left:auto">任务</button>
      <button class="changes-btn" id="changes-btn" style="margin-left:6px">改动 <span class="n" id="changes-n">0</span></button>
    </header>
    <div id="thread"><div class="wrap"><div class="empty" id="empty">有什么要处理的，尽管说。读写文件、跑命令、上网查资料，管家一口气帮你做完。</div></div></div>
    <footer>
      <button class="jump-latest" id="jump-latest">回到最新 <span class="arr">↓</span></button>
      <div class="composer-wrap">
        <div id="run-indicator"><span class="spark">✦</span><span class="verb">处理中…</span></div>
        <div class="expert-row">
          <label for="expert">专家</label>
          <select id="expert"><option value="">通用助手</option></select>
        </div>
        <div class="composer">
          <div class="cmd-panel" id="cmd-panel" hidden></div>
          <textarea id="input" rows="1" placeholder="问问球房管家…（输入 / 唤起命令，Enter 发送）"></textarea>
          <button id="send">发送</button>
        </div>
      </div>
    </footer>
  </div>
  <div id="preview">
    <div class="pv-head"><span id="pv-title">改动文件</span><button id="pv-close">×</button></div>
    <div class="pv-body" id="pv-body"></div>
  </div>
</div>
<script src="./app.js"></script>
</body>
</html>
