    good_output_snippet: |
      私聊话术简洁稳重："好久没见你了，最近忙什么呢？哪天有空过来打两把。"不像销售、不像客服、不像群发。像朋友之间的自然关心。老板身份的稳重语气把握精准。
    why_good:
      - "老板身份的稳重语气把握精准，不推优惠不推充值不催消费"
      - "像朋友之间的自然关心，不是销售跟进"
    reusable_rules:
      - "大客户维护的轻触达策略：关心+邀约+不推销"
    suitable_for_fewshot: true
    fewshot_use_case:
      - "runtime_positive_example"
      - "product_brain_reference"
    injection_style: "short_snippet"
    priority: "P1"
    max_injection_chars: 250

  - id: "G006"
