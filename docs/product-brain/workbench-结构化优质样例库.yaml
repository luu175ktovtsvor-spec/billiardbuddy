  - id: "G015"
    source_case_id: "V28"
    title: "前厅加微信不让人反感"
    role: "frontdesk"
    target_customer_type: "groupbuy"
    output_package:
      - "private_chat"
      - "sop_checklist"
      - "execution_tips"
    scene_tags:
      - "wechat_add"
      - "groupbuy_conversion"
      - "private_domain"
    risk_tags: []
    user_intent: "今天来了好多团购客，怎么加微信才不让人反感"
    extra_note: "自然一点"
    good_output_snippet: |
      多种加微信方式：打球体验型（"今天打得怎么样？加个微信，下次来之前跟我说帮你看台"）、约球群型（"我们有个球友群经常约球，拉你进去"）、活动通知型（"周末有比赛，加微信到时候通知你"）。自然不强迫。
