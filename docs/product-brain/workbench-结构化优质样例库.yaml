# Workbench 结构化优质样例库
# 来源：workbench-优质样例库.md（10D-3 产出）+ 10F-1.5 补齐
# 用途：10F-2 轻量 few-shot 选择的数据源
# 质量要求：good_output_snippet 150-350 中文字
# few-shot 可用性：suitable_for_fewshot + fewshot_use_case + injection_style 三重标注

examples:
  - id: "G001"
    source_case_id: "C07"
    title: "团购客加微信（前厅场景）"
    role: "frontdesk"
    target_customer_type: "groupbuy"
    output_package:
      - "private_chat"
      - "group_notice"
      - "sop_checklist"
      - "execution_tips"
    scene_tags:
      - "groupbuy_conversion"
      - "wechat_add"
      - "private_domain"
      - "groupbuy_checkin"
    risk_tags: []
    user_intent: "今天来了几个团购客，我想加他们微信，后面方便喊他们来打球"
    extra_note: "不要太像推销"
    good_output_snippet: |
      哈喽，今天打得还顺手吗？我们有个球友群，平时群里经常有人约球，你要感兴趣我拉你进去。下次来之前微信跟我说一声，帮你看台。
      加微信的理由给得很自然（活动通知/预约方便/约球群），不给客户压迫感。分当面说+微信说+群里说三个版本，每个版本简短自然。
    why_good:
      - "完全符合团购客户的轻引导策略，不推销不优惠"
      - "话术自然像真人微信聊天，不像销售脚本"
      - "output_package全部响应（私聊+群公告+SOP+执行建议）"
    reusable_rules:
      - "团购客加微信的三段式：体验问询→群邀约→下次留台"
    suitable_for_fewshot: true
    fewshot_use_case:
      - "runtime_positive_example"
      - "product_brain_reference"
    injection_style: "short_snippet"
    priority: "P0"
    max_injection_chars: 350

  - id: "G002"
    source_case_id: "C13"
    title: "助教短视频配文"
    role: "assistant_manager"
    target_customer_type: "assistant"
    output_package:
      - "short_video"
      - "moments"
      - "private_chat"
    scene_tags:
      - "assistant_short_video"
      - "assistant_service"
      - "wechat_moments"
    risk_tags: []
    user_intent: "助教拍了条短视频，帮我配个文案"
    extra_note: "有吸引力，但是不要擦边"
    good_output_snippet: |
      短视频配文多条可选（抖音风格/朋友圈风格/通用风格）。话题标签贴合台球内容：#台球 #陪练 #打球日常。完全不擦边，表达为"专业台球陪练服务"。朋友圈版本更生活化、抖音版本更有节奏感。
    why_good:
      - "严格遵守不擦边、不低俗的合规红线"
      - "多渠道适配（抖音vs朋友圈风格不同）"
      - "助教表达专业体面，话题标签行业规范"
    reusable_rules:
      - "助教短视频配文的多渠道差异策略"
    suitable_for_fewshot: true
    fewshot_use_case:
      - "runtime_positive_example"
      - "product_brain_reference"
    injection_style: "short_snippet"
    priority: "P1"
    max_injection_chars: 300

  - id: "G003"
    source_case_id: "C19"
    title: "新客户第一次到店（前厅接待）"
    role: "frontdesk"
    target_customer_type: "new"
    output_package:
      - "private_chat"
      - "sop_checklist"
      - "execution_tips"
    scene_tags:
      - "new_customer_reception"
      - "frontdesk_reception"
      - "private_chat"
    risk_tags: []
    user_intent: "第一次来的客户，前台怎么跟他说比较自然"
    extra_note: "不要像背话术"
    good_output_snippet: |
      当面说控制在3-5秒："第一次来吧？我带你看一下台位和灯光。" "打得怎么样？感觉还顺手吗？" SOP流程从到店到离店完整。保持轻松自然，不像客服。当面说+微信说+群里说三分场景话术。
    why_good:
      - "话术自然简洁，适合前厅实际使用"
      - "不推销、不推卡、不推助教，对新客户保持建立关系的节奏"
    reusable_rules:
      - "新客户接待的三个自然切入点：带看台位→问打球感受→自然介绍"
    suitable_for_fewshot: true
    fewshot_use_case:
      - "runtime_positive_example"
      - "product_brain_reference"
    injection_style: "short_snippet"
    priority: "P0"
    max_injection_chars: 300

  - id: "G004"
    source_case_id: "C28"
    title: "助教群提醒发朋友圈（管理群语气）"
    role: "assistant_manager"
    target_customer_type: "assistant"
    output_package:
      - "group_notice"
      - "execution_tips"
    scene_tags:
      - "assistant_service"
      - "group_notice"
      - "wechat_moments"
    risk_tags: []
    user_intent: "助教都不怎么发朋友圈，帮我在助教群里提醒一下"
    extra_note: "别像训人"
    good_output_snippet: |
      群里提醒语气像日常沟通，不是训人："最近大家朋友圈发的少了点，提醒一下。每天发1-2条就行，不用多。发什么？可以是今天陪客户练球的小片段、店里氛围、比赛信息。不会写的来找我，我帮你看。"
    why_good:
      - "语气恰到好处——提醒但不批评，不给管理处罚压力"
      - "给出具体可执行建议（发什么内容、什么时间发）"
    reusable_rules:
      - "员工提醒类群公告的语气模板：提醒+具体建议+不批评不处罚"
    suitable_for_fewshot: true
    fewshot_use_case:
      - "runtime_positive_example"
      - "product_brain_reference"
    injection_style: "short_snippet"
    priority: "P1"
    max_injection_chars: 300

  - id: "G005"
    source_case_id: "C12"
    title: "大客户单独约访（老板视角）"
    role: "boss"
