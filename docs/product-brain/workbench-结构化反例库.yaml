# Workbench 结构化反例库
# 来源：workbench-反例库.md（10D-3 产出）
# 用途：回归测试用例 + 产品大脑规则沉淀
# 核心原则：runtime_prompt_eligible 默认 false，反例错误全文不入运行时 Prompt

anti_examples:
  - id: "B001"
    source_case_id: "C06"
    title: "助教PK总奖金5000被拆成具体金额"
    role: "manager"
    target_customer_type: "assistant"
    output_package:
      - "pk_plan"
      - "daily_report"
      - "sop_checklist"
      - "execution_tips"
    scene_tags:
      - "assistant_pk"
    risk_tags:
      - "budget_split_amount"
    user_intent: "我想搞一个助教PK，店里有15个助教，奖金大概5000块钱，你帮我设计一下"
    wrong_output_summary: "自动将5000元总奖金拆为第1名1500元、第2名1000元、第3名800元、第4-6名各500元"
    error_types:
      - "budget_split_amount"
    why_wrong:
      - "用户只给了总奖金5000，未要求具体分配，AI不应擅自决定每项金额"
    correct_approach: "输出分配思路和比例建议（如第一名约35%-45%、第二名约20%-30%），具体金额请门店确认后填写"
    runtime_rule_summary: "用户给总预算/总奖金时，只给分配思路和比例建议，严禁自动拆分具体金额"
    regression_test: true
    runtime_prompt_eligible: false
    priority: "P0"

