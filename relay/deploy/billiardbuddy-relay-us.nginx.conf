server {
    listen 443 ssl;
    server_name zzyppz.cn;

    # A task-scoped, owner-bound, expiring HMAC grant is the authorization.
    # The route is public so the desktop can download the result from the US relay
    # once, without sending a provider or relay credential through the client.
    location ^~ /relay/imgtasks/images/results/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8790/images/results/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 15s;
        access_log off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /relay/imgtasks/ {
        allow 39.106.214.21;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8790/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 15s;
        client_max_body_size 32m;
    }

    location /assets/ {
        alias /var/www/billiardbuddy-assets/;
        autoindex off;
        add_header Accept-Ranges bytes;
    }

    location /desktop/ {
        alias /var/www/desktop-updates/;
        autoindex off;
    }

    include /etc/nginx/snippets/billiardbuddy-gateway-us-https-proxy.conf;
    ssl_certificate /etc/letsencrypt/live/zzyppz.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zzyppz.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name zzyppz.cn;
    return 301 https://zzyppz.cn$request_uri;
}
