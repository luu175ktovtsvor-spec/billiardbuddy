<!-- V2 通用特效引擎:数据驱动(manifest 里每段 style + 全局 theme + 可选 customCss)。
     大模型按内容/情绪自己编排转场/字幕样式/主题色;customCss 是"随意发挥"逃生口。
     renderFrame(f) 帧精确。领域无关,适配任意视频。 -->
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  /* 渲染进程 viewport 已按 manifest 宽高开(render_frames.js/render-worker.js),100vw/100vh 天然贴合;
     init() 里再显式按 m.width/m.height 覆盖一遍(防御性,不依赖 viewport 100%准) —— 竖屏/横屏/任意比例都适配。 */
  #stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#000}
  #clip{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(0,0,0,.45) 100%);pointer-events:none}
  #grad{position:absolute;left:0;right:0;bottom:0;height:32%;background:linear-gradient(transparent,rgba(0,0,0,.72));pointer-events:none}
  #cap{position:absolute;left:60px;right:60px;font-family:'SS';font-weight:700;font-size:96px;line-height:1.1;letter-spacing:2px;text-shadow:0 4px 24px rgba(0,0,0,.6);text-align:center}
  #capbar{position:absolute;left:64px;height:10px;border-radius:6px}
  #tag{position:absolute;left:60px;top:80px;font-family:'SS';font-weight:700;color:#0a0a0a;padding:10px 22px;font-size:34px;border-radius:8px;letter-spacing:3px}
  #wipe{position:absolute;top:-15%;left:0;width:60%;height:130%;transform:translateX(-170%) skewX(-14deg);transform-origin:center}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  #brand{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:'SS';opacity:0}
  #brand .b1{font-size:150px;font-weight:700;letter-spacing:10px;text-shadow:0 6px 30px rgba(0,0,0,.7)}
  #brand .b2{width:0;height:8px;margin-top:28px;border-radius:6px}
  #dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
</style>
<div id="stage">
  <img id="clip">
  <div id="vig"></div>
  <div id="grad"></div>
  <div id="capbar"></div>
  <div id="cap"></div>
  <div id="tag"></div>
  <div id="wipe"></div>
  <div id="flash"></div>
  <div id="dim"></div>
  <div id="brand"><div class="b1"></div><div class="b2"></div></div>
</div>
<script>
let M, FPS=30, BEAT=15, ACCENT="#12E0C8", W=1080, H=1920;
const $=(id)=>document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=(x)=>1-Math.pow(1-clamp(x,0,1),3);

window.init=(m)=>{
  M=m; FPS=m.fps; BEAT=m.beatFrames||15;
  W=m.width||1080; H=m.height||1920;
  // 比例不写死:舞台尺寸按 manifest 实际宽高来(竖屏9:16/横屏16:9/方屏都适配)。
  $('stage').style.width=W+'px'; $('stage').style.height=H+'px';
  ACCENT=(m.theme&&m.theme.accent)||"#12E0C8";
  const s=document.createElement('style');
  s.textContent="@font-face{font-family:'SS';src:url('file://"+m.font+"')}";
  document.head.appendChild(s);
  // 主题色上到各部件
  $('capbar').style.background=ACCENT;
  $('tag').style.background=ACCENT;
  $('wipe').style.background=ACCENT;
  $('brand').querySelector('.b2').style.background=ACCENT;
  // 品牌 + 角标
  $('brand').querySelector('.b1').textContent=m.brand||'';
  const tagText=(m.tag!==undefined?m.tag:(m.brand||''));
  $('tag').textContent=tagText; if(!tagText)$('tag').style.display='none';
  // 大模型自定义 CSS(随意发挥逃生口)——注入 style,作用于 #stage 内
  if(m.customCss){ const c=document.createElement('style'); c.id='customCss'; c.textContent=m.customCss; document.head.appendChild(c); }
};

// 每段的默认风格,大模型没给就用它
function shotStyle(sh){
  const st=sh.style||{};
  return {
    transition: st.transition||'wipe',
    motion: st.motion||'kenburns-in',
    cap: Object.assign({pos:'bottom', anim:'slide-up', color:'#fff'}, st.caption||{}),
  };
}

// 单段素材帧上的镜头运动(不需要前一段画面,单帧可算)
function applyMotion(motion, prog, beatPulse){
  let scale=1.0, tx=0, ty=0;
  if(motion==='kenburns-in'){ scale=1.06+0.10*prog; }
  else if(motion==='kenburns-out'){ scale=1.16-0.10*prog; }
  else if(motion==='pan-left'){ scale=1.12; tx=(0.5-prog)*70; }
  else if(motion==='pan-right'){ scale=1.12; tx=(prog-0.5)*70; }
  else if(motion==='pan-up'){ scale=1.12; ty=(0.5-prog)*90; }
  else { scale=1.04; } // none/未知:轻微放大防黑边
  scale*=beatPulse;
  $('clip').style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';
}

// 入场转场(idx>0 的段前 ~9 帧),都只靠当前段/覆盖层,不需要前一段
function applyTransition(kind, lf){
  const w=$('wipe'), fl=$('flash'), dim=$('dim'), clip=$('clip');
  w.style.opacity=0; fl.style.opacity=0; clip.style.filter='';
  if(lf>=9){ dim.style.opacity=Math.max(0,parseFloat(dim.style.opacity)||0); return; }
  const p=lf/9;
  if(kind==='wipe'){ w.style.opacity=1; w.style.transform='translateX('+(-170+p*440)+'%) skewX(-14deg)'; }
  else if(kind==='fade'){ dim.style.opacity=(1-p)*0.9; }
  else if(kind==='flash'){ fl.style.opacity=1-p; }
  else if(kind==='slide-left'){ $('stage').style.transform='translateX('+((1-p)*40)+'%)'; }
  else if(kind==='slide-up'){ $('stage').style.transform='translateY('+((1-p)*40)+'%)'; }
  else if(kind==='zoom'){ clip.style.filter=''; dim.style.opacity=(1-p)*0.5; } // 放大感由 motion 兜,这里配暗角淡入
  else if(kind==='glitch'){ const j=(Math.random()-0.5)*18*(1-p); clip.style.transform='translateX('+j+'px)'; clip.style.filter='hue-rotate('+(1-p)*60+'deg) saturate('+(1+ (1-p))+')'; }
  else if(kind==='none'){ /* 硬切 */ }
}

// 字幕样式:位置 + 动画 + 颜色
function applyCaption(cap, style, lf, nFrames){
  const el=$('cap'), bar=$('capbar');
  el.textContent=cap||''; el.style.color=style.color||'#fff';
  if(!cap){ el.style.opacity=0; bar.style.opacity=0; return; }
  const posY = style.pos==='top' ? H*0.11 : style.pos==='center' ? H*0.47 : H*0.83; // 三档(按舞台高度百分比,不写死竖屏像素)
  bar.style.top=(posY+120)+'px';
  const inA=ease(lf/10.5), outA=1-ease((lf-(nFrames-9))/9);
  const a=clamp(Math.min(inA,outA),0,1);
  let ty=0, sc=1, op=a;
  if(style.anim==='slide-up'){ ty=(1-ease(lf/10.5))*46; }
  else if(style.anim==='fade'){ /* 只用 op */ }
  else if(style.anim==='pop'){ sc=0.7+0.3*ease(lf/8); }
  else if(style.anim==='typewriter'){ const n=Math.ceil((cap.length)*clamp(lf/12,0,1)); el.textContent=cap.slice(0,n); }
  el.style.top=posY+'px';
  el.style.opacity=op; el.style.transform='translateY('+ty+'px) scale('+sc+')';
  bar.style.opacity=op; bar.style.width=(op*Math.min(340,(cap.length||1)*90))+'px';
}

window.renderFrame=(f)=>{
  $('stage').style.transform=''; // 每帧先复位(滑入转场会改它)
  let sh=M.shots[0], idx=0;
  for(let i=0;i<M.shots.length;i++){ if(f>=M.shots[i].startFrame && f<M.shots[i].endFrame){sh=M.shots[i];idx=i;break;} if(i===M.shots.length-1)sh=M.shots[i];}
  const lf=f-sh.startFrame, prog=lf/Math.max(1,sh.nFrames);
  const S=shotStyle(sh);
  $('clip').src='file://'+sh.dir+'/f_'+String(clamp(lf,0,sh.nFrames-1)+1).padStart(4,'0')+'.png';
  const bp=(f%BEAT)/BEAT, pulse=1+0.014*Math.max(0,1-bp*5);
  applyMotion(S.motion, prog, pulse);
  applyTransition(idx>0 ? S.transition : 'none', lf);
  applyCaption(sh.caption, S.cap, lf, sh.nFrames);
  $('tag').style.opacity=(idx===0?0:clamp(ease((lf-3)/8),0,.92));
  // 开场品牌卡(前1.3s)
  const bT=FPS*1.3;
  if(f<bT){
    const bo=clamp(ease(f/14),0,1)*(1-clamp((f-(bT-12))/12,0,1));
    $('brand').style.opacity=bo;
    $('brand').querySelector('.b1').style.transform='scale('+(0.86+0.14*ease(f/16))+')';
    $('brand').querySelector('.b2').style.width=(ease((f-8)/16)*380)+'px';
    if(parseFloat($('dim').style.opacity||0)<0.5*bo) $('dim').style.opacity=0.5*bo;
  } else { $('brand').style.opacity=0; }
  // 返回当前帧图片的 decode promise —— 渲染器 await 它再截帧,防截到未解码的旧帧/花屏
  return $('clip').decode().catch(()=>{});
};
</script>
