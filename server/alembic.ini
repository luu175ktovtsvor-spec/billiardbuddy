[alembic]
script_location = db/migrations
prepend_sys_path = .
# NOTE: This URL is overridden by env.py which reads from DATABASE_URL env var.
# Do not rely on this value in production.
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/billiards_ai

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
