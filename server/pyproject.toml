[project]
name = "billiards-ai-server"
version = "0.1.0"
description = "球房 AI 运营助手后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0.2",
    "openai>=1.0.0",
    "pillow>=11.0.0",
    "borax>=4.1.3",
    "openpyxl>=3.1.0",
    "aiosqlite>=0.22.1",
    "fastembed>=0.8.0",
    "cryptography>=49.0.0",
    "pypdf>=6.13.3",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "mcp>=1.28.0",
    "faster-whisper>=1.2.1",
    "scenedetect[opencv]>=0.7",
    "imageio-ffmpeg>=0.6.0",
    "tzdata>=2024.1",
    # U4(E3c)：生图后 OCR 校验硬文字要素(店名/日期/价格/联系方式)有没有被模型"抽风"画错。
    # 选 rapidocr-onnxruntime(非新版 `rapidocr`)：中文检测/识别/方向分类三个 onnx 模型(~16MB)
    # 直接打包在 wheel 里，装完就能离线用；新版 `rapidocr`(3.x) 改成运行时从 ModelScope 按需下载
    # 模型，不满足"全打进包、不联网"的铁律(除非再照搬 bge 那套预下载+--add-data，本单选更简单可靠
    # 的旧包，见 u4-report.md 的取舍说明)。
    "rapidocr-onnxruntime>=1.4.4",
    "qrcode>=8.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
