[project]
name = "billiards-ai-server"
version = "0.1.0"
description = "球房 AI 运营助手后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.7.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0.2",
    "openai>=1.0.0",
    "pillow>=11.0.0",
    "borax>=4.1.3",
    "openpyxl>=3.1.0",
    "aiosqlite>=0.22.1",
    "fastembed>=0.8.0",
    "cryptography>=49.0.0",
    "pypdf>=6.13.3",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "mcp>=1.28.0",
    "faster-whisper>=1.2.1",
    "scenedetect[opencv]>=0.7",
    "imageio-ffmpeg>=0.6.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
