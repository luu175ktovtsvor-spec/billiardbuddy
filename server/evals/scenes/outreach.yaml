key: scenes_outreach
scenes:
  - id: outreach_001
    category: outreach
    generator: outreach
    store: community
    role: assistant_manager
    title: "助教私聊约刚加微信的新客体验助教课"
    input:
      customer_name: 小李
      customer_type: new
      relationship: 刚加微信、第一次到店
      style: friendly
      extra_note: 客户昨天团购到店，助教帮他开了台，客户对助教服务有点感兴趣但没主动问价格
    must_hit:
      - ["体验", "上钟", "陪打", "切磋", "试试"]
      - ["台球", "打球", "球"]
      - ["来", "到店", "过来"]
    forbidden: ["免费畅打", "终身", "私下", "出去玩", "约你吃饭"]
    judge_focus: "话术是否以'关怀混脸熟'为主、不急于推销助教课，开口时机自然而非一上来就约；是否只用'专业陪练/技术指导/情绪价值'定位助教服务"

  - id: outreach_002
    category: outreach
    generator: outreach
    store: commercial
    role: assistant_manager
    title: "助教唤醒40天未到店的沉睡老客"
    input:
      customer_name: 王哥
      customer_type: old
      relationship: 熟悉、之前常来
      style: warm
      extra_note: 客户上次来距今约40天，充值卡还有余额，之前每周来2-3次，是忠实老客
    must_hit:
      - ["好久", "不见", "最近", "一段时间"]
      - ["来", "过来", "打几杆", "甩两杆"]
      - ["余额", "卡", "权益", "老位置", "台位"]
    forbidden: ["为啥不来", "好久不理我", "是不是忘了我", "卡快过期", "赶紧来", "最后机会"]
    judge_focus: "是否给台阶而非质问；是否给一个具体回来的理由（新变化/适合的局）而不是空泛邀约；越久没来语气是否越轻松不施压"

  - id: outreach_003
    category: outreach
    generator: outreach
    store: competitive
    role: coach
    title: "教练邀请竞技客参加本周末会员赛"
    input:
      customer_name: 陈总
      customer_type: competition
      relationship: 熟悉
      style: professional
      extra_note: 客户是门店竞技群核心成员，球技A档，本周六有单败淘汰赛，名额有限
    must_hit:
      - ["比赛", "赛事", "会员赛", "周六"]
      - ["名额", "报名", "参加", "来"]
      - ["对手", "高手", "切磋", "过招"]
    forbidden: ["大额", "免费畅打", "终身"]
    judge_focus: "是否以竞技荣誉感和对手匹配切入而非优惠诱导；赛事信息是否具体（时间/形式）；是否体现高手专属感"

  - id: outreach_004
    category: outreach
    generator: outreach
    store: commercial
    role: manager
    title: "店长亲自私聊维护高充值VIP客户续费"
    input:
      customer_name: 张总
      customer_type: vip
      relationship: 很熟
      style: warm
      extra_note: 客户是门店充值最高的大客户，余额预计还有3-4次消耗量，近期来店频率略降，店长亲自跟进
    must_hit:
      - ["专属", "VIP", "优先", "留着", "帮你"]
      - ["关怀", "关心", "问候", "想到你", "记着"]
      - ["台位", "助教", "来店"]
    forbidden: ["充5000送2000", "大比例赠送", "卡快过期赶紧充", "最后优惠", "免费畅打", "终身"]
    judge_focus: "是否体现管理层亲自维护的专属感；是否先关怀再自然过渡到邀约，不先谈充值；话术有无模板感（机械客服感）"

  - id: outreach_005
    category: outreach
    generator: outreach
    store: community
    role: assistant_manager
    title: "助教约散客组搭子局、转化为常客"
    input:
      customer_name: 小赵
      customer_type: new
      relationship: 一般、见过两次
      style: lively
      extra_note: 客户单人来打球，看上去想有人一起打，助教判断是社交需求强的散客，想引导进搭子群
    must_hit:
      - ["搭子", "一起打", "约球", "组局"]
      - ["群", "进群", "拉你", "加你"]
      - ["有人", "不愁没", "水平差不多"]
    forbidden: ["免费畅打", "终身", "私下见"]
    judge_focus: "是否以'找球友'社交需求为切入点而非推销门店；是否给具体的行动指引（进群/约局时间）；语气是否像球友而非推销员"

  - id: outreach_006
    category: outreach
    generator: outreach
    store: competitive
    role: coach
    title: "教练约曾参加赛事的竞技客回来打日常训练局"
    input:
      customer_name: 李哥
      customer_type: competition
      relationship: 熟悉
      style: professional
      extra_note: 客户上次来参加月赛已过去近3周，球技B档，教练判断可用技术进阶切入重新激活
    must_hit:
      - ["练", "训练", "手感", "球感", "技术"]
      - ["来", "打两局", "切磋", "约球"]
      - ["对手", "水平", "进阶", "突破"]
    forbidden: ["免费畅打", "终身"]
    judge_focus: "是否以技术交流和竞技成长为钩子而非活动/优惠；是否像懂球人跟球友聊天；是否给一个具体回来的理由（练手感/有对手/近期赛前准备）"

  - id: outreach_007
    category: outreach
    generator: workbench_free
    store: community
    role: frontdesk
    title: "前厅写团购到店新客离店后加微信的第一条问候"
    input:
      user_intent: "帮我写一条团购客户离店后加上微信的第一条消息，客户姓小吴，今天来过了体验感还不错，我想后续约她回来打球"
      target_customer_type: new
      output_package: ["private_chat"]
      extra_note: 社区小店，前厅女生发，轻松友好，不提团购标签，不急着推充值
    must_hit:
      - ["欢迎", "欢迎来", "今天", "刚才"]
      - ["下次", "有空", "来玩", "再来"]
      - ["帮你", "留台", "方便"]
    forbidden: ["团购客", "优惠券", "充值", "免费畅打", "终身"]
    judge_focus: "第一条微信是否像人而非机器发出；是否给'下次回来'一个自然理由而非催充值；不暴露团购标签、不歧视团购客"

  - id: outreach_008
    category: outreach
    generator: outreach
    store: commercial
    role: assistant_manager
    title: "助教约久未上钟的助教老客重新预约课程"
    input:
      customer_name: 周姐
      customer_type: old
      relationship: 熟悉
      style: warm
      extra_note: 客户以前每周上两次助教课，最近1个多月没预约了，助教判断可能是忙或找了别家
    must_hit:
      - ["助教", "上钟", "陪练", "课", "预约"]
      - ["技术", "球技", "进步", "手感"]
      - ["有空", "来", "安排", "留时间"]
    forbidden: ["私下见", "出去吃饭", "免费体验课", "终身", "免费畅打"]
    judge_focus: "话术是否只围绕'专业陪练/技术指导'定位助教服务；是否给回来理由（有进步空间/有新东西学）而非质问为何消失；是否回避私下场外邀约"

  - id: outreach_009
    category: outreach
    generator: workbench_free
    store: competitive
    role: manager
    title: "店长给竞技群发通知邀请骨干参加下月精英赛报名"
    input:
      user_intent: "给我写一条竞技群公告，邀请群里的高手报名下个月的精英赛，比赛是单败淘汰制，16强，报名截止本周日，强调这次对手强、有看头"
      target_customer_type: competition
      output_package: ["group_notice"]
      extra_note: 竞技馆，群里都是常客高手，语气可以带点激将法，突出对手水平和荣誉感
    must_hit:
      - ["精英赛", "比赛", "赛事", "报名"]
      - ["截止", "本周日", "名额"]
      - ["对手", "高手", "强手", "水平"]
    forbidden: ["冠军奖金多少万", "免费畅打", "终身"]
    judge_focus: "是否以竞技荣誉感和高手对决为驱动而非奖品/优惠；报名信息是否清晰（截止时间/人数上限）；群发语气是否够直接不拖沓"

  - id: outreach_010
    category: outreach
    generator: outreach
    store: community
    role: manager
    title: "店长给快30天没来的老客发节前关怀+回店邀约"
    input:
      customer_name: 刘哥
      customer_type: old
      relationship: 熟悉
      style: warm
      extra_note: 国庆前一周，客户是固定老客每周来1-2次，最近一个月没出现，店长想借节前自然关怀唤醒
    must_hit:
      - ["节", "国庆", "假期", "长假"]
      - ["好久", "很久", "一段时间没见"]
      - ["来打", "打几杆", "来坐坐", "有空"]
    forbidden: ["赶紧来", "最后机会", "卡快过期", "不来就浪费了", "免费畅打", "终身", "情感绑架"]
    judge_focus: "是否用节假日作为自然话题切入而非强推邀约；是否体现老朋友熟人感；回来的理由是否具体轻松而非空泛"

  - id: outreach_011
    category: outreach
    generator: workbench_free
    store: commercial
    role: operator
    title: "运营写朋友圈文案唤醒沉睡会员回店"
    input:
      user_intent: "写一条朋友圈，唤醒那些好久没来打球的老客，让他们想到'哦我该去打球了'，不要太推销，像在分享球房日常"
      target_customer_type: old
      output_package: ["moments"]
      extra_note: 商业中端店，白领/情侣客群为主，用亲切不推销的语气，不点名某个客户
    must_hit:
      - ["打球", "台球", "球房"]
      - ["氛围", "状态", "感觉", "这里"]
      - ["来", "约", "有空"]
    forbidden: ["家人们", "闭眼入", "全城爆火", "好久没来了某某", "免费畅打", "终身", "优惠最后X天"]
    judge_focus: "是否卖氛围/归属感而非纯堆优惠；是否像真人分享而非广告文案；不点名具体客户、不暴露'我在做回流活动'意图"

  - id: outreach_012
    category: outreach
    generator: outreach
    store: competitive
    role: assistant_manager
    title: "助教向从未上过钟的竞技散客介绍助教服务"
    input:
      customer_name: 老马
      customer_type: competition
      relationship: 一般
      style: professional
      extra_note: 客户来竞技馆2-3次了，球技C档有进步欲望，助教想自然介绍陪练课帮他快速提升
    must_hit:
      - ["技术", "进步", "提升", "球技", "进阶"]
      - ["助教", "陪练", "指导", "一对一"]
      - ["有效", "针对", "系统", "快"]
    forbidden: ["免费体验", "白送一节课", "私下见", "终身", "免费畅打"]
    judge_focus: "是否以'技术指导/专业陪练'而非情绪价值切入竞技客（此类客户更看重进步）；是否避免助教服务的暗示性表达；推荐是否自然不硬推"
