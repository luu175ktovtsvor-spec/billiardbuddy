key: scenes_customer_pricing
scenes:
  - id: customer_pricing_001
    category: customer_pricing
    generator: workbench_free
    store: community
    role: manager
    title: "社区小店老板问如何设计一卡通充值档位"
    input:
      user_intent: "我想做一个充值活动，吸引老客锁定消费，应该怎么设计档位和赠送比例？"
      target_customer_type: old
      extra_note: 社区小店约10台，客单价偏低，首次做充值活动，不想后期涨价被动
    must_hit:
      - ["一卡通", "充值", "赠送"]
      - ["台位费", "台费", "赠送仅限"]
      - ["10%", "15%", "9.9%", "比例", "小比例"]
    forbidden: ["充5000送2000", "充10000送5000", "1:1赠送", "充多少送多少", "永久有效", "终身", "传统会员卡"]
    judge_focus: "是否明确推荐一卡通而非传统会员卡；赠送比例是否守住10-20%铁律不建议大额赠送；是否提示赠送金额仅限台位费消耗"

  - id: customer_pricing_002
    category: customer_pricing
    generator: workbench_free
    store: commercial
    role: boss
    title: "商业店老板问如何区别对待散客、助教客户、竞技客户"
    input:
      user_intent: "我们店现在客户什么类型都有，散客、喜欢约助教的、喜欢打比赛的，感觉没有针对性地服务，该怎么分类来对待？"
      extra_note: 商业中端店约20台，有助教团队，想提升服务精准度
    must_hit:
      - ["散客", "助教客户", "竞技客户"]
      - ["四大", "分类", "类型"]
      - ["不同", "差异", "针对", "分层"]
    forbidden: ["用户画像", "私域流量", "流量池", "赋能", "抓手", "闭环"]
    judge_focus: "是否清楚讲出四大客户分类（散客/竞技客户/助教客户/追分客户）及各自对应的差异化策略，而非笼统说'分层服务'"

  - id: customer_pricing_003
    category: customer_pricing
    generator: activity
    store: community
    role: manager
    title: "社区小店新开业充值活动方案"
    input:
      activity_goal: membership
      target_customer: "散客/新客"
      budget_level: light
      duration: "开业前两周"
      extra_note: 新店开业，想快速锁定周边客户，保守赠送比例，不影响后期调价空间
    must_hit:
      - ["一卡通", "充值"]
      - ["送", "赠送", "赠"]
      - ["台位费", "台费", "仅限"]
    forbidden: ["充5000送2000", "充10000送5000", "大比例", "永久有效", "终身", "传统会员卡", "1:1"]
    judge_focus: "开业充值方案赠送比例是否合理（保守方案10-14%区间）；是否说明赠送金额仅限台位费；是否用一卡通概念而非传统会员卡"

  - id: customer_pricing_004
    category: customer_pricing
    generator: workbench_free
    store: competitive
    role: coach
    title: "教练问如何给客户打ABCD分级标签"
    input:
      user_intent: "怎么给客户打标签做ABCD分级？我想知道每种客户具体该怎么维护频率和动作"
      extra_note: 竞技馆，教练主要接触竞技客户，想系统做客户档案
    must_hit:
      - ["A类", "B类", "C类", "D类", "ABCD"]
      - ["频率", "每周", "每月", "维护"]
      - ["竞技", "赛事", "比赛", "组局"]
    forbidden: ["用户画像", "私域流量", "流量池", "赋能", "抓手"]
    judge_focus: "ABCD分级标准是否清晰（不是模糊说'高中低'，要有具体频次和客单价标准）；竞技客户的具体维护动作是否落地（赛事邀约/竞技群）"

  - id: customer_pricing_005
    category: customer_pricing
    generator: workbench_free
    store: commercial
    role: manager
    title: "店长问团购产品占比太高怎么办"
    input:
      user_intent: "我们店团购占台费收入已经超过40%了，感觉越来越依赖低价团购，客单价很难提升，该怎么办？"
      extra_note: 商业中端店，团购引来的客户转化率低，希望降低团购依赖
    must_hit:
      - ["20%", "比例", "控制", "占比"]
      - ["转化", "充值", "一卡通", "锁客"]
      - ["客单价", "提升", "助教", "消费"]
    forbidden: ["取消团购", "关掉美团", "全靠口碑", "用户画像", "私域流量", "免费畅打", "终身"]
    judge_focus: "是否给出团购占比控制在20%以内的明确目标；是否给出团购客转化为充值客的具体操作路径（而非只说'要转化'）"

  - id: customer_pricing_006
    category: customer_pricing
    generator: workbench_free
    store: commercial
    role: frontdesk
    title: "前厅主管向散客介绍一卡通充值权益"
    input:
      user_intent: "帮我写一段话，给今天刚来的散客介绍一卡通充值，让他们觉得划算想充，但不要有推销感"
      target_customer_type: new
      output_package: ["private_chat"]
      extra_note: 客户刚打完一局，感觉不错，前厅趁热介绍充值，要自然不硬推
    must_hit:
      - ["一卡通", "充值"]
      - ["台位费", "台费", "打球"]
      - ["划算", "方便", "省", "优惠"]
    forbidden: ["会员卡", "传统会员", "充5000送2000", "永久有效", "终身有效", "一充就有", "不限次"]
    judge_focus: "是否用一卡通概念而非'会员卡'；赠送权益描述是否准确（赠送仅限台费）；介绍是否自然像朋友聊天而非机器背话术"

  - id: customer_pricing_007
    category: customer_pricing
    generator: diagnosis
    store: community
    role: manager
    title: "诊断：社区小店充值留存做不起来"
    input:
      situation: "我们店做过几次充值活动，但客户普遍不愿意充，来了就散客消费，充过的也不常来，感觉充值留不住人，不知道问题出在哪里"
      problem_area: customer_loss
    must_hit:
      - ["一卡通", "充值", "锁客"]
      - ["转化", "回访", "邀约", "复购"]
      - ["原因", "问题", "流失", "不来"]
    forbidden: ["大额赠送", "充5000送2000", "打价格战", "免费畅打", "终身有效", "会员卡档位"]
    judge_focus: "诊断是否从客户转化流程找问题（加微/跟进/邀约断链）而非单纯建议提高赠送比例；是否触及四大客户分类对应的针对性锁客方式"

  - id: customer_pricing_008
    category: customer_pricing
    generator: workbench_free
    store: competitive
    role: manager
    title: "竞技馆调整台费定价策略"
    input:
      user_intent: "我们竞技馆想重新梳理一下定价，现在高峰期和平时收一样价，感觉不合理，该怎么设计分时段和桌型定价？"
      extra_note: 竞技馆含斯诺克台和中式台，想做桌型梯度和时段梯度，价格尾数用9
    must_hit:
      - ["分时", "时段", "高峰", "闲时"]
      - ["梯度", "桌型", "档位", "差价"]
      - ["9", "尾数", "心理定价", "29", "39", "49"]
    forbidden: ["打价格战", "比最低价", "免费", "大额充值赠送", "终身", "用户画像"]
    judge_focus: "是否给出分时段定价原则（闲/忙/深夜各档）；桌型梯度是否有参考区间；价格尾数建议是否说到'8改9'这个具体运营技巧"

  - id: customer_pricing_009
    category: customer_pricing
    generator: workbench_free
    store: commercial
    role: operator
    title: "运营写中秋节一卡通充值活动朋友圈"
    input:
      user_intent: "帮我写一条中秋节充值活动的朋友圈，推我们的一卡通，节日活动比日常赠送多一点，主要想吸引老客趁节日充值"
      target_customer_type: old
      output_package: ["moments"]
      extra_note: 商业中端店，节日活动别做太频繁，这次中秋做一次，赠送比例适度提升但守住红线
    must_hit:
      - ["中秋", "节日", "节"]
      - ["一卡通", "充值"]
      - ["台位费", "台费", "赠送"]
    forbidden: ["充5000送2000", "1:1赠送", "送助教课", "永久有效", "终身", "家人们", "闭眼入", "全城爆火"]
    judge_focus: "节日赠送比例是否合理（不超过20-25%）；是否明确赠送仅限台位费；文案是否有节日氛围而非纯广告感；是否避免'传统会员卡'表述"

  - id: customer_pricing_010
    category: customer_pricing
    generator: workbench_free
    store: commercial
    role: manager
    title: "店长问散客如何一步步培育成充值老客"
    input:
      user_intent: "团购散客来了一次，怎么让他变成我们的充值老客？有没有具体的步骤？"
      target_customer_type: new
      extra_note: 商业中端店，团购客进店率高但转化率差，希望有一套可执行的从散客到充值老客的培育路径
    must_hit:
      - ["加微信", "加微", "微信"]
      - ["回访", "邀约", "二次", "第二次"]
      - ["充值", "一卡通"]
    forbidden: ["第一次来就推充值", "立刻推销", "免费畅打", "永久有效", "终身", "大额赠送", "充5000送2000"]
    judge_focus: "培育路径是否分步骤（加微→次日回访→3天邀约→引导充值）而非'一步到位推充值'；每步动作是否具体可执行；充值引导是否在关系建立后自然过渡"

  - id: customer_pricing_011
    category: customer_pricing
    generator: activity
    store: commercial
    role: manager
    title: "商业店设计拉新团购套餐+爆款策略"
    input:
      activity_goal: traffic
      target_customer: "新客/散客"
      budget_level: light
      duration: "长期"
      extra_note: 想重新设计美团/抖音团购产品，控制品类数量设爆款，不要依赖低价倾销，团购占比控制在20%以内
    must_hit:
      - ["爆款", "引流款", "主打", "核心套餐"]
      - ["4-5个", "品类", "控制", "精简"]
      - ["转化", "充值", "留客", "回头"]
    forbidden: ["越多越好", "全部打折", "免费畅打", "大额赠送", "充5000送2000", "终身", "家人们"]
    judge_focus: "是否给出团购品类控制在4-5个的原则；爆款设计逻辑是否清晰（引流款低价拉新+核心套餐转化）；是否说明团购是拉新手段不是长期收入来源"

  - id: customer_pricing_012
    category: customer_pricing
    generator: workbench_free
    store: competitive
    role: boss
    title: "竞技馆老板问如何向竞技客户解释取消大额充值赠送"
    input:
      user_intent: "我们要把之前充5000送2000的大额赠送活动停掉，改成小比例送台费，怎么跟老客户解释这个调整？写几条话术"
      target_customer_type: old
      output_package: ["private_chat"]
      extra_note: 竞技馆有部分老客户已习惯大额赠送，需要妥善引导过渡，减少流失
    must_hit:
      - ["一卡通", "台位费", "赠送", "优惠"]
      - ["透明", "公平", "说明", "解释", "调整"]
      - ["服务", "球台", "体验", "质量"]
    forbidden: ["充5000送2000继续做", "大额赠送更合算", "终身有效", "永久", "传统会员卡更好"]
    judge_focus: "话术是否正面说明调整原因（维持服务质量/不涨价的间接保障）而非道歉推卸；是否给客户一个接受调整的合理动机；是否避免让步回到大额赠送"
