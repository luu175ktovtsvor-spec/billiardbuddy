key: scenes_activity
scenes:
  - id: activity_001
    category: activity
    generator: activity
    store: community
    role: manager
    title: "周末双人优惠朋友圈文案"
    input:
      activity_goal: traffic
      target_customer: "散客/情侣/朋友局"
      budget_level: light
      duration: "周末两天"
      extra_note: "想吸引情侣和朋友结伴来，侧重社交氛围不是单纯打折"
    must_hit:
      - ["双人", "2人", "搭子", "情侣", "朋友"]
      - ["周末", "周六", "周日"]
      - ["氛围", "一起", "结伴", "陪你"]
    forbidden: ["免费畅打", "终身", "必赢", "稳赚", "家人们", "闭眼入"]
    judge_focus: "是否卖氛围/社交而非纯堆折扣，文案是否让人感受到'一起来'的吸引力而非'便宜'的吸引力"

  - id: activity_002
    category: activity
    generator: workbench_free
    store: competitive
    role: manager
    title: "月赛报名预热朋友圈三连"
    input:
      user_intent: "帮我写本月月赛的报名预热朋友圈，三条，分三天发"
      target_customer_type: all
      output_package: ["moments"]
      extra_note: "竞技客为主，想让客户提前期待、主动报名，不要只是通知，要有热度"
    must_hit:
      - ["报名", "参赛", "名额"]
      - ["赛制", "让分", "让条件", "档位", "让球"]
      - ["下期", "本期", "本月", "月赛", "赛事"]
    forbidden: ["大额奖金", "现金", "家人们", "闭眼入", "全城爆火"]
    judge_focus: "三条是否节奏递进（热身→造势→紧迫），有无写清赛制和让条件而不只是模糊说'公平'"

  - id: activity_003
    category: activity
    generator: activity
    store: commercial
    role: operator
    title: "七夕情侣台球夜活动策划"
    input:
      activity_goal: holiday
      target_customer: "情侣/年轻客群"
      budget_level: medium
      duration: "七夕当晚（单日）"
      extra_note: "情侣对抗赛+你来我往教学局，卖互动体验不卖低价；话术浪漫有温度，绝不擦边"
    must_hit:
      - ["七夕", "情人节", "情侣"]
      - ["对抗", "互动", "教学", "一起打", "陪"]
      - ["套餐", "双人", "2人"]
    forbidden: ["免费畅打", "终身", "性感", "闭眼入", "家人们", "全城爆火"]
    judge_focus: "活动是否有明确互动玩法（不止'来打球'），氛围是否浪漫有温度而非低俗擦边，价格是否用占位符而非编造数字"

  - id: activity_004
    category: activity
    generator: workbench_free
    store: community
    role: boss
    title: "老客户流失回流活动方案"
    input:
      user_intent: "上个月有几个老客户快三个月没来了，帮我想个能把他们召回来的活动方案"
      target_customer_type: old
      output_package: ["moments", "private_chat", "group_notice"]
      extra_note: "要自然不催促，用活动吸引而非'你的卡快过期了'这种施压"
    must_hit:
      - ["老朋友", "老客", "好久没见", "许久", "想起你"]
      - ["活动", "赛事", "有人教", "搭子", "新玩法"]
      - ["私聊", "群公告", "朋友圈"]
    forbidden: ["你的卡快过期了", "最后三天", "再不来优惠就没了", "催", "施压", "家人们", "闭眼入"]
    judge_focus: "回流话术是否以情感唤醒为切入点而非利益施压，是否分渠道给出了不同话术（私聊/群/圈），私聊话术有无个性化感"

  - id: activity_005
    category: activity
    generator: activity
    store: competitive
    role: coach
    title: "新手友好赛季制积分联赛方案"
    input:
      activity_goal: tournament
      target_customer: "新手/初中级球员"
      budget_level: light
      duration: "一个月（赛季制，每周一场）"
      extra_note: "让新手敢参赛，每周有理由来；让条件拉平水平差；老手当导师带新手；报名费奖金用占位符"
    must_hit:
      - ["赛季", "积分", "每周"]
      - ["新手", "友好", "无压力", "人人都有机会"]
      - ["让条件", "让球", "让分", "档位"]
      - ["报名费", "奖励", "请填写", "占位"]
    forbidden: ["高手专场", "大额奖金", "必须有比赛经验", "家人们", "闭眼入"]
    judge_focus: "方案是否真正降低了新手心理门槛（不只是说'欢迎新手'），让条件是否写清楚了具体规则而非模糊带过，有无奖励体系但未编造具体金额"

  - id: activity_006
    category: activity
    generator: workbench_free
    store: commercial
    role: manager
    title: "企业团建包场推广朋友圈+私信话术"
    input:
      user_intent: "写一套面向周边企业的团建包场推广内容，朋友圈一条+私信话术，突出省心热闹人均不贵"
      target_customer_type: new
      output_package: ["moments", "private_chat"]
      extra_note: "不靠低价竞争，卖省心/热闹/人均合理；可提台球+桌游双业态；不承诺具体包场价格"
    must_hit:
      - ["团建", "包场", "企业", "公司", "团队"]
      - ["省心", "热闹", "人均", "不贵", "性价比"]
      - ["台球", "玩法", "活动"]
    forbidden: ["免费", "白送", "全城最低价", "保证效果", "最便宜", "家人们", "闭眼入", "全城爆火"]
    judge_focus: "是否卖场景价值（省心+热闹）而非单纯低价，私信话术是否有对企业HR/老板的针对性切入点，有无具体玩法描述而非空喊口号"

  - id: activity_007
    category: activity
    generator: activity
    store: community
    role: manager
    title: "国庆节假日引流充值活动方案"
    input:
      activity_goal: holiday
      target_customer: "家庭客/学生/周边散客"
      budget_level: medium
      duration: "国庆黄金周7天"
      extra_note: "节假日引流为主，配套一卡通充值活动；赠送比例合理不过激；强调假期运动氛围"
    must_hit:
      - ["国庆", "假期", "黄金周"]
      - ["一卡通", "充值", "储值"]
      - ["活动时间", "截止", "期间"]
    forbidden: ["充5000送2000", "大比例赠送", "免费畅打", "终身", "家人们", "闭眼入", "全城爆火", "错过等一年"]
    judge_focus: "充值活动设计是否赠送比例合理（非大额比例），活动是否有明确截止时间而非永久，节假日氛围是否体现在文案中而非只是打折通知"

  - id: activity_008
    category: activity
    generator: workbench_free
    store: competitive
    role: manager
    title: "斯诺克世锦赛看球之夜活动策划"
    input:
      user_intent: "斯诺克世锦赛期间搞个看球活动，大屏观赛加打球，想让球迷感觉来对地方了"
      target_customer_type: competition
      output_package: ["moments", "group_notice"]
      extra_note: "边看边学，有技术讨论氛围；比分竞猜挂小奖品不赌钱；不编造赛事时间对阵"
    must_hit:
      - ["斯诺克", "世锦赛", "大屏", "直播", "观赛"]
      - ["边看边学", "技术", "职业", "学习"]
      - ["竞猜", "小奖品", "互动"]
    forbidden: ["赌钱", "对赌", "现金竞猜", "家人们", "闭眼入", "全城爆火"]
    judge_focus: "是否营造出专业球迷聚集的场域感而非普通娱乐，竞猜玩法是否清楚表明仅限小奖品，有无引导客户边看边交流学技术的内容"

  - id: activity_009
    category: activity
    generator: activity
    store: commercial
    role: operator
    title: "女生闺蜜场主题夜活动方案"
    input:
      activity_goal: traffic
      target_customer: "女性客群/闺蜜组合/新手"
      budget_level: light
      duration: "每周固定一晚（长期）"
      extra_note: "主打环境出片、新手友好、有人教；适合发小红书；绝不擦边不做暧昧暗示；突出安全感"
    must_hit:
      - ["女生", "闺蜜", "姐妹", "女士"]
      - ["拍照", "打卡", "出片", "氛围", "小红书"]
      - ["新手友好", "有人教", "零基础"]
      - ["安全", "舒适", "放松"]
    forbidden: ["性感", "家人们", "闭眼入", "全城爆火"]
    judge_focus: "是否精准打到女性客群痛点（安全感+拍照出片+新手无压力），是否完全杜绝擦边表达，有无给出小红书文案方向或配套引导"

  - id: activity_010
    category: activity
    generator: workbench_free
    store: community
    role: manager
    title: "老带新转介绍裂变活动朋友圈+话术"
    input:
      user_intent: "设计一套老带新的活动，老客带新客来双方都有福利，要让老客愿意主动帮我介绍朋友"
      target_customer_type: new
      output_package: ["moments", "private_chat"]
      extra_note: "福利轻量可持续，不搞大比例充值赠送；老客一句话就能转发；时机要在客户体验好的时刻引导"
    must_hit:
      - ["老带新", "介绍", "转介绍", "带朋友"]
      - ["双方", "老客", "新客", "各得"]
      - ["台费券", "饮料", "体验", "小礼品", "请填写"]
    forbidden: ["充5000送2000", "大比例充值赠送", "拉人头", "分级返利", "传销", "家人们", "闭眼入", "全城爆火"]
    judge_focus: "裂变机制是否轻量操作简单（老客一句话能转发），福利是否合理而非吸引薅羊毛，是否有引导时机建议（体验好的时刻开口）而非随机轰炸"
