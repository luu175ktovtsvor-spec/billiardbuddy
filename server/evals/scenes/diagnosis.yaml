key: scenes_diagnosis
scenes:
  - id: diagnosis_001
    category: diagnosis
    generator: diagnosis
    store: community
    role: boss
    title: 工作日下午空台严重——社区小店淡季空台时段诊断
    input:
      situation: "我这店10张台，工作日下午2点到5点基本没人，3张台都算多了。晚上还好，周末也还行。就是下午这块死活拉不起来，台子就那么空着，灯都不知道开不开。"
      problem_area: off_season
    must_hit:
      - ["错峰", "分时", "白天", "工作日", "下午"]
      - ["退休", "学生", "午休", "错峰人群", "上班族"]
      - ["责任", "动作", "教练", "前厅", "店长"]
    forbidden: ["免费畅打", "终身", "保证提升", "承诺"]
    judge_focus: "诊断是否点出空台时段的错峰人群开发路径（退休/学生/午休等），动作是否落到具体部门而非泛泛'加强营销'"

  - id: diagnosis_002
    category: diagnosis
    generator: diagnosis
    store: commercial
    role: manager
    title: 开台量达标但总台费上不去——营收结构失衡诊断
    input:
      situation: "我们每天开台次数还算不错，基本150台次左右，但总台费就是上不去，平均客单价感觉越来越低。助教费倒还可以，商品这块也一般。"
      problem_area: revenue
    must_hit:
      - ["竞技客户", "客单价", "优质客户"]
      - ["教练", "约客", "邀约", "转化"]
      - ["责任部门", "教练部", "具体动作"]
    forbidden: ["免费畅打", "终身", "降价", "大幅优惠"]
    judge_focus: "是否识别出'开台量达标但台费低=竞技客户不足'这个核心根因，动作是否落到教练部强化竞技客户转化而非泛泛降价促销"

  - id: diagnosis_003
    category: diagnosis
    generator: diagnosis
    store: competitive
    role: boss
    title: 老客流失明显、常来的熟客越来越少——老客流失诊断
    input:
      situation: "感觉最近老客越来越少，以前每周都来的几个竞技玩家，最近一个月没怎么见到。新客还有，但留不住，来一次就不来了。总感觉店里氛围没以前好。"
      problem_area: customer_loss
    must_hit:
      - ["老客", "复购", "留存", "竞技客户"]
      - ["加微信", "约客", "社群", "维护"]
      - ["教练", "助教", "前厅"]
    forbidden: ["免费畅打", "终身", "大幅降价", "亏本促销"]
    judge_focus: "是否遵循'留住老客>拉新引流'铁律，建议是否聚焦教练/助教的主动约客和竞技客户维护，而非直接建议发优惠券"

  - id: diagnosis_004
    category: diagnosis
    generator: diagnosis
    store: community
    role: manager
    title: 客流越来越少、门可罗雀——客流持续下滑诊断
    input:
      situation: "最近这两个月客流明显少了，以前工作日晚上也能有七八成开台，现在五成都不到。团购核销倒还有，但自然进店的人就是少了。周边好像新开了一家球房。"
      problem_area: traffic
    must_hit:
      - ["私域", "微信", "社群", "老客唤回"]
      - ["竞品", "差异化", "定位"]
      - ["引流", "转化", "裂变"]
    forbidden: ["免费畅打", "终身", "全店降价"]
    judge_focus: "是否先分析客流结构（自然进店vs团购核销），再区分引流问题还是留存问题，不直接建议降价打价格战"

  - id: diagnosis_005
    category: diagnosis
    generator: diagnosis
    store: commercial
    role: boss
    title: 活动办了但效果很差、充值没上去——活动效果诊断
    input:
      situation: "上个月搞了个周年庆活动，在群里发了通知，也发了朋友圈，但来充值的没几个，活动当天人也没比平时多多少，感觉就是白折腾了。"
      problem_area: activity_effect
    must_hit:
      - ["到场转化", "充值", "锁住复购", "当场拉群"]
      - ["买赠", "秒杀", "抽奖", "一卡通"]
      - ["活动执行", "动作链", "跟进"]
    forbidden: ["终身会员", "免费畅打", "无限次数"]
    judge_focus: "是否指出'活动≠比赛/通知发完就完'，动作链是否包含到场转化+当场拉群+充值/一卡通锁复购，而非只建议下次多宣传"

  - id: diagnosis_006
    category: diagnosis
    generator: diagnosis
    store: competitive
    role: manager
    title: 赛事办了但场后客户流失、参赛客户不来平时打——活动效果诊断
    input:
      situation: "我们每月办比赛，报名人挺多，比赛那天氛围也好。但赛后这些人基本不来平时打球，参赛的和平时的客群像是两拨人，比赛拉不动日常消费。"
      problem_area: activity_effect
    must_hit:
      - ["赛后", "留存", "转化", "跟进"]
      - ["加微信", "进群", "约客", "复购"]
      - ["充值", "一卡通", "套餐"]
    forbidden: ["免费畅打", "终身", "承诺提升"]
    judge_focus: "是否识别出'赛事引流但转化断链'的根因，建议是否覆盖赛后加微跟进+当场充值引导+进日常竞技群的完整转化链路"

  - id: diagnosis_007
    category: diagnosis
    generator: workbench_free
    store: community
    role: boss
    title: 同行竞争——附近新开球房抢客，如何应对
    input:
      user_intent: "附近三百米新开了一家球房，装修比我好，价格跟我差不多，最近我这客流明显少了，怎么办？"
      target_customer_type: old
      extra_note: "社区小店，主要是周边居民，开了5年了有一批老客"
    must_hit:
      - ["老客", "熟客", "情感", "人情味", "关系"]
      - ["差异化", "定位", "特色"]
      - ["老带新", "口碑", "裂变", "推荐"]
    forbidden: ["免费畅打", "终身会员", "打价格战", "全面降价"]
    judge_focus: "是否强调社区店的老客情感纽带是核心护城河，应对竞争优先激活老客口碑裂变而非陷入价格战"

  - id: diagnosis_008
    category: diagnosis
    generator: diagnosis
    store: commercial
    role: manager
    title: 暑假/旺季结束后营收断崖下跌——淡季空台时段诊断
    input:
      situation: "暑假结束了，上个月学生客流全没了，台费掉了快一半。以前旺季每天满台，现在白天基本空着，晚上也就五六成。不知道怎么把淡季撑过去。"
      problem_area: off_season
    must_hit:
      - ["错峰定价", "分时", "白天优惠", "包场"]
      - ["上班族", "企业团建", "社群", "拼台"]
      - ["成本", "固定", "淡季"]
    forbidden: ["全店降价", "终身", "免费畅打"]
    judge_focus: "是否提出错峰人群替代方案（企业/上班族/拼台局），且明确'救场用错峰定价而非全店降价'铁律，避免破坏正常时段价格体系"

  - id: diagnosis_009
    category: diagnosis
    generator: diagnosis
    store: competitive
    role: coach
    title: 竞技客户数量停滞、约客转化率低——客流下滑诊断
    input:
      situation: "我负责维护竞技客户，感觉这三个月新增竞技客户很少，约客出来打的邀约数虽然够，但实际来的比例越来越低，很多人说'最近忙'就不了了之了。"
      problem_area: traffic
    must_hit:
      - ["约客", "邀约", "转化率", "跟进"]
      - ["朋友圈", "微信", "社群", "维护"]
      - ["氛围", "组局", "竞技"]
    forbidden: ["终身", "免费畅打", "承诺业绩"]
    judge_focus: "是否聚焦教练的主动邀约质量（内容/频率/组局氛围），而非归因到价格或外部因素；动作是否具体到朋友圈内容和微信维护节奏"

  - id: diagnosis_010
    category: diagnosis
    generator: diagnosis
    store: community
    role: boss
    title: 充值多但扣卡少、老客储值不消费——老客流失诊断
    input:
      situation: "发现一个问题：好几个老客账上还有余额，但已经一两个月没来消费了。充的钱在那里，人就是不来。催了几次也没动静，不知道是不是要流失了。"
      problem_area: customer_loss
    must_hit:
      - ["一卡通", "余额", "扣卡", "激活"]
      - ["老客唤回", "约客", "微信", "私信", "主动联系"]
      - ["粘性", "权益", "复购"]
    forbidden: ["免费畅打", "终身会员", "退款"]
    judge_focus: "是否识别出'充值空挂=粘性断裂预警'，建议是否包含老客主动唤回的具体话术方向和一卡通权益激活手段"

  - id: diagnosis_011
    category: diagnosis
    generator: workbench_free
    store: commercial
    role: manager
    title: 团购占比过高导致客单价拉不上去——营收结构诊断
    input:
      user_intent: "我们店团购占比太高了，大概有六七成台费都是团购核销的，客单价一直上不去，直接开台的客人太少了，怎么优化这个结构？"
      target_customer_type: all
      extra_note: "商业中端店，有助教团队，白领客群为主"
    must_hit:
      - ["团购占比", "直接开台", "客单价"]
      - ["约客", "私域", "老客", "转化"]
      - ["品类控制", "4-5个", "优化渠道"]
    forbidden: ["全部下架团购", "终身", "免费畅打", "大幅降价"]
    judge_focus: "是否按诊断逻辑识别出'过度依赖团购=教练/前厅直接获客能力弱'，建议是否落到具体的约客专项和团购品类收口而非简单下架"

  - id: diagnosis_012
    category: diagnosis
    generator: diagnosis
    store: competitive
    role: boss
    title: 工作日午场和下午场几乎无人——同行竞争叠加淡季诊断
    input:
      situation: "我们是竞技馆，斯诺克台为主，工作日白天到下午4点之前基本没开台。周边还有两家球房在争竞技客户，晚上还好，白天根本没人。"
      problem_area: competition
    must_hit:
      - ["白天", "午场", "错峰", "空台"]
      - ["差异化", "竞技", "赛事", "斯诺克"]
      - ["定向开发", "企业", "私人训练", "包台"]
    forbidden: ["免费畅打", "终身", "大幅降价", "跟风"]
    judge_focus: "是否结合竞技馆特色给出差异化应对（赛事+专业训练包台+斯诺克品类护城河），同时回答白天空台如何用分时定价填谷"
