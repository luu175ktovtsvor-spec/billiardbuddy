key: scenes_content
scenes:
  - id: content_001
    category: content
    generator: workbench_free
    store: community
    role: manager
    title: 周末双人到店朋友圈——卖社交氛围不堆优惠
    input:
      user_intent: "写条周末双人优惠的朋友圈，80-150字，别太广告味"
      target_customer_type: all
      output_package: [moments]
      extra_note: "门店走社区亲民路线，主打轻松氛围"
    must_hit:
      - ["双人", "2人", "搭子", "情侣", "两个人"]
      - ["周末", "周六", "周日", "假日"]
      - ["氛围", "好玩", "轻松", "来打", "约球", "约上"]
    forbidden: ["免费畅打", "终身", "最低价", "全网最低", "保证"]
    judge_focus: "是否以社交/氛围为卖点而非简单堆优惠数字；行动引导是否自然不强迫（'来打两杆'而非'限时抢购'）"

  - id: content_002
    category: content
    generator: workbench_free
    store: commercial
    role: operator
    title: 抖音短视频文案——助教专业展示，吸引新客
    input:
      user_intent: "写一条抖音短视频文案，展示我们助教服务，吸引新客户到店体验"
      target_customer_type: new
      output_package: [short_video]
      extra_note: "门店有10名专业助教，主打中端白领和情侣群体"
    must_hit:
      - ["助教", "助理教练", "技术指导", "专业"]
      - ["体验", "到店", "预约", "来试试"]
      - ["前三秒", "钩子", "开场", "标签", "#台球"]
    forbidden: ["免费畅打", "赌"]
    judge_focus: "助教描述是否合规专业（无擦边词）；前三秒钩子是否有吸引力；视频结构是否完整（钩子→正文→收尾→标签）"

  - id: content_003
    category: content
    generator: workbench_free
    store: competitive
    role: coach
    title: 赛事群公告——会员月赛报名通知，简洁可执行
    input:
      user_intent: "发个群公告，通知本月会员赛报名，周六下午举办，要求简洁能执行"
      target_customer_type: vip
      output_package: [group_notice]
      extra_note: "竞技馆，参赛者多是固定竞技客户，赛制是单淘汰赛"
    must_hit:
      - ["报名", "参加", "扣1", "回复", "联系"]
      - ["周六", "时间", "下午"]
      - ["会员", "竞技", "赛事", "比赛"]
    forbidden: ["赌", "保证", "终身", "免费畅打"]
    judge_focus: "150字内能否把时间、参与方式、奖励框架说清楚；是否有明确的报名动作引导；语气是否符合竞技馆的热血专业气质"

  - id: content_004
    category: content
    generator: workbench_free
    store: community
    role: frontdesk
    title: 美团好评引导——多角度差异化，像真实用户写
    input:
      user_intent: "帮我写3条美团好评文案，角度要不一样，不能太像广告"
      target_customer_type: old
      output_package: []
      extra_note: "社区小店，球桌台面新换过，前台服务好是大家都说的亮点"
    must_hit:
      - ["环境", "球桌", "台面", "设备"]
      - ["服务", "前台", "热情", "到位"]
      - ["3条", "三条", "不同角度", "差异"]
    forbidden: ["太棒了绝了", "全城最好", "最低价", "刷单", "刷好评", "代写", "免费"]
    judge_focus: "三条好评角度是否真实差异（环境/服务/氛围各一）；语气是否像真实顾客而非广告文案；是否避免了平台违规表达（无价格数字、无夸大）"

  - id: content_005
    category: content
    generator: workbench_free
    store: commercial
    role: manager
    title: 小红书笔记——情侣/闺蜜台球探店，卖体验和颜值
    input:
      user_intent: "写一篇小红书笔记，定位情侣或闺蜜探店，重点卖环境颜值和轻松体验"
      target_customer_type: new
      output_package: [short_video]
      extra_note: "门店装修新潮，有咖啡吧台，球桌灯光是网红感暖光"
    must_hit:
      - ["环境", "装修", "氛围", "灯光", "颜值", "好看"]
      - ["情侣", "闺蜜", "朋友", "搭子", "一起"]
      - ["体验", "来玩", "探店", "打球"]
    forbidden: ["性感", "赌", "免费畅打", "保证月入", "加V"]
    judge_focus: "是否以场景体验/社交共鸣为主线而非纯功能介绍；标题是否有数字或情绪词（小红书规律）；CTA是否符合平台规范（评论区/主页，不引导站外）"

  - id: content_006
    category: content
    generator: workbench_free
    store: competitive
    role: operator
    title: 抖音账号内容规划——赛事+助教+教学三个内容方向
    input:
      user_intent: "帮我规划这个月抖音发什么内容，我们是竞技馆有赛事有助教有教练"
      output_package: [short_video]
      extra_note: "竞技馆，本月有一场月赛，助教团队8人，有教练可出技术教学内容"
    must_hit:
      - ["赛事", "比赛", "战报", "月赛"]
      - ["助教", "助理教练", "技术", "教学"]
      - ["每月", "条数", "频次", "计划", "排期"]
    forbidden: ["月入万元", "免费畅打"]
    judge_focus: "内容规划是否有主题分类（竞技/教学/日常）；发布频次是否给出具体建议（每月≥15条）；是否区分了短视频类型与各自钩子策略"

  - id: content_007
    category: content
    generator: workbench_free
    store: community
    role: boss
    title: 老客回流朋友圈——用人情世故而非优惠打动沉默客
    input:
      user_intent: "写条朋友圈，召回两个月没来的老客户，不要直接说来打有优惠，要有点人情味"
      target_customer_type: old
      output_package: [moments]
      extra_note: "社区球房，老板认识大部分老客，客情关系好"
    must_hit:
      - ["想你", "好久", "最近", "来坐", "叙叙", "约球", "来聊"]
      - ["老客", "老朋友", "熟客", "老面孔"]
    forbidden: ["免费畅打", "终身", "限时", "错过后悔", "大额充值"]
    judge_focus: "是否用情感/关系切入而非直接利益诱导；语气是否像老板本人说话而非营销号；是否给客户留了低压力的回应空间"

  - id: content_008
    category: content
    generator: workbench_free
    store: commercial
    role: assistant_manager
    title: 群公告——助教预约高峰期提醒，引导提前锁台
    input:
      user_intent: "发个群公告，告诉客户周末助教很忙要提前预约，顺带引导早点来锁台位"
      target_customer_type: old
      output_package: [group_notice]
      extra_note: "商业中端店，周末8-10名助教全部排满是常态，经常有客户临时来约不到"
    must_hit:
      - ["提前", "预约", "锁台", "先约好"]
      - ["周末", "高峰", "火爆", "抢手", "名额"]
      - ["联系", "私信", "报名", "告知"]
    forbidden: ["性感", "免费畅打", "终身", "大额充值", "赌", "不来后悔"]
    judge_focus: "是否准确传达了供不应求的紧迫感而非虚假限量；动作指引是否清晰（私信/群里报名）；字数是否控制在150字内、适合群公告格式"

  - id: content_009
    category: content
    generator: workbench_free
    store: competitive
    role: coach
    title: 赛后战报朋友圈——热血播报，展示竞技氛围吸引围观
    input:
      user_intent: "写一条朋友圈赛后战报，要有竞技感，能让没来的人后悔没到场"
      target_customer_type: competition
      output_package: [moments]
      extra_note: "刚结束了一场馆内月赛，冠军是常客老张，打了一个精彩满杆"
    must_hit:
      - ["战报", "比赛", "赛事", "结束", "落幕"]
      - ["冠军", "夺冠", "胜出", "精彩"]
      - ["下期", "下次", "报名", "参加", "下场"]
    forbidden: ["免费畅打"]
    judge_focus: "是否用竞技叙事语言制造现场感；是否在播报中自然埋入'下次参加'的号召；避免赌博暗示的同时是否还保留了竞技激情"

  - id: content_010
    category: content
    generator: workbench_free
    store: community
    role: frontdesk
    title: 搭子群日常激活——轻松约球召集，不过度营销
    input:
      user_intent: "发条搭子群消息，晚上召集有没有人来约球，语气随意点别太正式"
      target_customer_type: new
      output_package: [group_notice]
      extra_note: "社区球房搭子群，成员多是学生和年轻上班族，档位混杂"
    must_hit:
      - ["今晚", "今天晚上", "晚上"]
      - ["约球", "来打", "有空", "有人"]
      - ["扣1", "回复", "说一声", "群里"]
    forbidden: ["免费畅打", "终身", "大额充值", "赌", "限时", "错过后悔"]
    judge_focus: "语气是否口语化随意（像朋友召集不像官方通知）；召集方式是否简单低门槛（扣1/回复即可）；是否避免了营销刷屏感"

  - id: content_011
    category: content
    generator: workbench_free
    store: commercial
    role: operator
    title: 新人体验活动朋友圈——用具体场景打消新客顾虑
    input:
      user_intent: "写条朋友圈推广新人体验活动，让没打过台球的人也敢来，打消'我不会打'的顾虑"
      target_customer_type: new
      output_package: [moments]
      extra_note: "商业中端店，有助教可以带新人入门，想吸引情侣和上班族"
    must_hit:
      - ["新手", "零基础", "第一次", "不会没关系", "入门"]
      - ["助教", "带你", "手把手", "教", "指导"]
      - ["情侣", "朋友", "搭子", "一起来"]
    forbidden: ["免费畅打", "终身", "赌", "大额充值", "保证学会"]
    judge_focus: "是否直接回应'不会打/怕丢脸'的新手心理障碍；助教描述是否合规（技术指导而非陪伴）；场景化描述是否具体可感知而非泛泛'欢迎来体验'"

  - id: content_012
    category: content
    generator: workbench_free
    store: competitive
    role: manager
    title: 抖音好评引导文案——大众点评/抖音评价，真实用户感
    input:
      user_intent: "写3条抖音评价或大众点评文案，从不同角度写，要像真实客户说的"
      target_customer_type: old
      output_package: []
      extra_note: "竞技馆，卖点是球桌多斯诺克台+氛围好+教练水平高"
    must_hit:
      - ["斯诺克", "球桌", "台面", "设备", "硬件"]
      - ["教练", "专业", "技术", "水平"]
      - ["3条", "三条", "不同", "差异化"]
    forbidden: ["刷评价", "刷单", "代写", "复制粘贴", "太棒了绝了", "全市最好", "赌", "免费畅打"]
    judge_focus: "三条评价是否从不同维度切入（硬件/教练/氛围各侧重一个）；语气是否像真实竞技爱好者而非广告；是否避免了平台违规表达（无价格数字、无虚假承诺）"
