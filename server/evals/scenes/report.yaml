key: scenes_report
scenes:
  - id: report_001
    category: report
    generator: workbench_free
    store: community
    role: manager
    title: "店长日报：数字填好让AI写问题分析和明日计划"
    input:
      user_intent: "帮我写今天的店长日报，今天营业额3800，助教上钟12钟，加了6个微信，美团来了4组新客，有一个客户投诉说台布旧了"
      extra_note: "今天周三，社区店淡日，下午人不多"
    must_hit:
      - ["台布", "台呢", "设备", "更换", "维修"]
      - ["明日", "明天", "计划"]
      - ["问题", "发现", "解决"]
      - ["微信", "加微", "客户"]
    forbidden: ["稳步提升", "持续向好", "业绩亮眼", "尊敬的"]
    judge_focus: "日报是否真实呈现了台布投诉问题并给出具体解决动作，而非淡化；数字段是否只用了用户提供的数字，未自行编造营业额或上钟数"

  - id: report_002
    category: report
    generator: workbench_free
    store: commercial
    role: coach
    title: "教练日报：今日加微信、组局、竞技群转化数据汇报"
    input:
      user_intent: "写教练日报，今天加了4个微信，晚上8点搞了台球挑战赛有9个人参与，拉了2个人进竞技群，明天想组一个三人轻竞技局"
      extra_note: "本月加微信累计已有82个"
    must_hit:
      - ["加微信", "添加", "微信"]
      - ["竞技群", "群", "转化"]
      - ["台球挑战赛", "小游戏", "活动"]
      - ["组局", "约", "三人", "对抗"]
    forbidden: ["编造", "如实填写", "稳步提升", "免费畅打"]
    judge_focus: "日报是否体现了教练的核心职责（组局拉人进竞技群），明日计划是否有具体可执行动作而非套话"

  - id: report_003
    category: report
    generator: workbench_free
    store: competitive
    role: assistant_manager
    title: "助教管理日报：助教团队状态、上钟花名册汇报"
    input:
      user_intent: "今天在岗助教8人，上钟合计27钟，小李排名第一上钟5钟，有2个助教上钟为零，朋友圈截图都交了，需要在群里公示一下排名"
      extra_note: "在岗8人中有1个新人今天第三天，另外2个零上钟是因为今天被安排做迎宾"
    must_hit:
      - ["排名", "公示", "上钟"]
      - ["新人", "实习", "培养"]
      - ["迎宾", "安排", "原因"]
      - ["朋友圈", "截图", "发圈"]
    forbidden: ["免费上钟", "稳步提升", "持续向好"]
    judge_focus: "是否区分了零上钟的真实原因（迎宾安排vs表现差），日报是否能直接发管理群，没有多余的AI前缀和套话"

  - id: report_004
    category: report
    generator: workbench_free
    store: community
    role: frontdesk
    title: "前厅日报：接待、加微信、投诉处理情况"
    input:
      user_intent: "写前厅日报，今天接待38人，加微信11个，有一个客人抱怨等开台等了20分钟没人搭理，我当时去上厕所了，商品卖了两包零食一瓶功能饮料"
    must_hit:
      - ["接待", "客流", "人数"]
      - ["等台", "等待", "服务", "跟进", "处理"]
      - ["加微", "添加微信"]
      - ["明日", "明天", "计划"]
    forbidden: ["稳步提升", "尊敬的", "特此汇报", "在这个充满活力"]
    judge_focus: "日报是否如实记录了等台投诉事件而非隐瞒，是否给出了明日改进动作，数字是否只用了用户提供的数据"

  - id: report_005
    category: report
    generator: workbench_free
    store: commercial
    role: manager
    title: "助教月度PK方案：分组规则+指标权重+奖励机制"
    input:
      user_intent: "帮我设计本月助教PK方案，我有10个助教，水平差距比较大，上钟时长是最重要的指标，希望每周在助教群公示一次排名，奖励由我自己定"
      extra_note: "这是第一次搞PK，希望规则简单好执行"
    must_hit:
      - ["分组", "水平均衡", "分法"]
      - ["上钟时长", "上钟", "权重"]
      - ["每周", "周日", "公示", "排名"]
      - ["兑现", "发放", "奖励"]
    forbidden: ["免费终身", "具体奖励金额", "稳步提升"]
    judge_focus: "PK方案是否有清晰的分组规则（按水平分而非随机）、排名公示节奏（每周不是月底）、奖励占位符（不替老板定金额），是否首次推行的上手难度合理"

  - id: report_006
    category: report
    generator: workbench_free
    store: competitive
    role: coach
    title: "教练周复盘：竞技群运营+本周赛事效果+下周计划"
    input:
      user_intent: "写本周教练工作复盘，本周一共加了21个微信，组局18桌，搞了周四的会员赛有14人参加，竞技群新增7人，感觉组局率不够，想下周重点突破"
      extra_note: "本店以竞技为主，客户对赛事参与度高，但平时组局还不够活跃"
    must_hit:
      - ["组局", "约局", "提升", "突破"]
      - ["竞技群", "群活跃", "群人数"]
      - ["赛事", "会员赛", "参与"]
      - ["下周", "计划", "重点"]
    forbidden: ["稳步提升", "持续向好", "业绩亮眼", "免费畅打"]
    judge_focus: "复盘是否直指组局率不足的问题并给出具体下周动作（不是泛泛'加强'），是否从竞技馆的客户特点出发（如利用竞技群发起约局）而非通用套话"

  - id: report_007
    category: report
    generator: workbench_free
    store: community
    role: manager
    title: "管理层绩效考核方案：店长/助教管理/教练三岗月度考核"
    input:
      user_intent: "帮我设计管理层月度绩效考核，要覆盖店长、助教管理和教练，我们是小社区店，不要太复杂，最重要的是营业额和客户留存，每个岗位给我列出考核指标和权重"
      extra_note: "总人数不多，操作要简单，老板我自己来打分"
    must_hit:
      - ["营业额", "达成率", "指标"]
      - ["权重", "占比", "%"]
      - ["客户", "留存", "复购", "满意度"]
      - ["考核", "评分", "打分"]
    forbidden: ["具体薪资数字", "违反劳动法", "稳步提升", "免费终身"]
    judge_focus: "考核方案是否给了每个岗位差异化的侧重点（非三个岗位用同一套），权重是否总计100%，金额是否用占位符而非编造数字"

  - id: report_008
    category: report
    generator: workbench_free
    store: commercial
    role: assistant_manager
    title: "助教个人阶梯奖励公告：月初在助教群发布上钟奖励规则"
    input:
      user_intent: "月初了，帮我写一条发在助教群的个人奖励规则公告，170小时、200小时、230小时三档，奖励金额我自己定，让大家知道达到了就能拿"
      extra_note: "上个月最高的人上钟195小时，大部分人在130-160区间"
    must_hit:
      - ["170小时", "200小时", "230小时", "三档", "阶梯"]
      - ["月度", "本月", "当月"]
      - ["兑现", "发放时间", "次月"]
      - ["可叠加", "累计", "叠加"]
    forbidden: ["具体奖励金额", "免费终身", "稳步提升"]
    judge_focus: "公告是否清晰说明三档门槛、奖励可叠加规则、发放时间，语气是否像管理群真实公告而非正式通知文件"

  - id: report_009
    category: report
    generator: workbench_free
    store: competitive
    role: manager
    title: "月度运营复盘：竞技馆本月赛事+助教数据+下月重点"
    input:
      user_intent: "帮我写月度运营复盘，本月月赛举办了2场共82人参加，助教整体上钟比上月多了8%，但美团差评有3条集中在排队等位，下月想重点搞好赛事引流和美团口碑"
      extra_note: "本店面向竞技客户，赛事是核心拉新手段，差评对竞技客户影响不如散客大，但也不能忽视"
    must_hit:
      - ["差评", "投诉", "口碑", "问题"]
      - ["赛事", "月赛", "引流"]
      - ["上钟", "环比", "增长"]
      - ["下月", "计划", "重点"]
    forbidden: ["稳步提升", "持续向好", "业绩亮眼", "在这个充满活力", "免费畅打"]
    judge_focus: "复盘是否正视差评问题并给出原因分析（等位排队）和下月改善动作，是否从竞技馆视角区分差评对不同客群的影响，而非一刀切说差评无所谓"

  - id: report_010
    category: report
    generator: workbench_free
    store: community
    role: frontdesk
    title: "前厅周工作总结：加微信完成情况+接待服务问题反思"
    input:
      user_intent: "写本周前厅工作总结，本周5天加微信合计22个，完成了周目标（20个），但周六有个客人嫌台布有污渍投诉了，我们及时道歉并换台，团购核销本周48单"
      extra_note: "周末客流明显比平日多，前厅这周没人手紧张"
    must_hit:
      - ["加微信", "完成", "目标", "达成"]
      - ["台布", "污渍", "处理", "道歉", "换台"]
      - ["团购", "核销", "单量"]
      - ["下周", "计划", "改进"]
    forbidden: ["稳步提升", "持续向好", "特此汇报", "尊敬的", "免费终身"]
    judge_focus: "总结是否正面呈现了投诉处理过程（道歉+换台是正确动作，应得到确认），是否基于本周实际数据给出下周工作方向而非套话"

  - id: report_011
    category: report
    generator: workbench_free
    store: commercial
    role: coach
    title: "教练月度绩效自评：线上+场内指标完成情况"
    input:
      user_intent: "帮我写教练月度绩效自评，本月加微信92个（目标90），组局58桌（目标30），赛事3场（目标2），但朋友圈只发了18条（目标30），小游戏每天都在搞，这个月总体怎么样"
      extra_note: "发朋友圈这个指标我确实做得不够，但组局和加微信都超额了"
    must_hit:
      - ["组局", "超额", "达成", "目标"]
      - ["朋友圈", "未达", "不足", "差距"]
      - ["赛事", "完成", "场次"]
      - ["下月", "改进", "计划", "朋友圈"]
    forbidden: ["稳步提升", "持续向好", "业绩亮眼", "掩盖问题"]
    judge_focus: "自评是否诚实呈现了朋友圈不达标的问题（而非淡化），是否对超额指标有数据支撑而非空泛表扬自己，整体给出的评分是否有说服力"

  - id: report_012
    category: report
    generator: workbench_free
    store: competitive
    role: assistant_manager
    title: "助教PK月末结算公告：排名结果+奖惩兑现"
    input:
      user_intent: "月末了，帮我写助教PK结算公告，发到助教群。A组冠军是小张上钟188小时，B组冠军是小陈上钟172小时，进步最大奖是小王从110小时提升到155小时，末位是小刘55小时，奖励由我定，末位要在群里发红包"
      extra_note: "这个月是第二个月搞PK，大家都很认真，最高提升幅度很明显"
    must_hit:
      - ["冠军", "排名", "第一"]
      - ["进步最大", "提升", "进步奖"]
      - ["末位", "红包", "惩处"]
      - ["兑现", "奖励", "发放"]
    forbidden: ["具体奖励金额", "免费终身", "稳步提升"]
    judge_focus: "公告是否有正向激励（冠军表彰有姓名）和末位约定惩处（发红包），奖励金额是否用占位符保留给老板决定，语气是否像真实助教群公告"
