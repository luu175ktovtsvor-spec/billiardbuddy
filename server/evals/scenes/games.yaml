key: scenes_games
scenes:
  - id: games_001
    category: games
    generator: workbench_free
    store: community
    role: frontdesk
    title: 社区店前台用"旋转5分点"小游戏做晚场散客破冰朋友圈推文
    input:
      user_intent: "今晚想搞个旋转5分点小游戏暖场，帮我写条朋友圈招呼散客来玩"
      target_customer_type: all
      output_package: [moments]
      extra_note: "游戏规则：转3圈再打球，打进越多奖品越好，奖可乐/红牛/台费卡"
    must_hit:
      - ["旋转", "转圈", "晕", "头晕"]
      - ["奖品", "可乐", "红牛", "台费卡", "奖励"]
      - ["今晚", "晚上", "今天", "今日"]
      - ["参与", "来玩", "来挑战", "欢迎"]
    forbidden: ["免费畅打", "终身", "赌博", "返现无上限"]
    judge_focus: "文案是否用游戏趣味感（转圈晕了还要打球的反差）吸引人，而非只堆奖品清单？落点是'来试试'的行动号召还是停在功能介绍？"

  - id: games_002
    category: games
    generator: workbench_free
    store: commercial
    role: coach
    title: 商业中端店教练为周末情侣客策划"苏格兰双打"玩法并写群公告
    input:
      user_intent: "周末想给情侣/搭子客人组织苏格兰双打，写条群公告让大家来报名"
      target_customer_type: all
      output_package: [group_notice]
      extra_note: "苏格兰双打规则：两人一队轮流打同一颗母球，适合老带新、情侣，水平差不影响配合"
    must_hit:
      - ["情侣", "搭子", "两人", "双人", "老带新"]
      - ["轮流", "配合", "一队", "组队"]
      - ["周末", "报名", "名额", "参加"]
      - ["奖励", "饮料", "奖品", "小礼物"]
    forbidden: ["免费畅打", "终身", "无底线赠送"]
    judge_focus: "是否用'配合感、互相补位'来卖社交氛围（而非堆技术要求），新手和老手都有参与感的逻辑是否说清楚？"

  - id: games_003
    category: games
    generator: workbench_free
    store: competitive
    role: manager
    title: 竞技馆店长为"控力接龙"高难度挑战活动写朋友圈激将文
    input:
      user_intent: "组织控力接龙挑战，专门针对我们馆里的熟客老球友，帮我写条有点激将意味的朋友圈"
      target_customer_type: vip
      output_package: [moments]
      extra_note: "控力接龙规则：7球一排不碰库不吃库，由下一颗球当母球打前一颗入中袋，全打完赢台费卡"
    must_hit:
      - ["挑战", "高手", "老球友", "技术", "实力"]
      - ["控力", "精准", "中袋", "接龙"]
      - ["你敢来", "挑战一下", "有本事", "试试", "来战"]
      - ["奖品", "台费卡", "奖励"]
    forbidden: ["免费畅打", "终身", "赌注", "现金对赌"]
    judge_focus: "激将语气是否自然且不失礼貌？是否把规则难度（不碰库/不吃库/接龙）转化为'让老球友有挑战感'而非死板描述规则？"

  - id: games_004
    category: games
    generator: workbench_free
    store: community
    role: coach
    title: 社区店教练帮前台设计"点球大战"快速破冰话术用于新客到店时
    input:
      user_intent: "新客第一次来不知道怎么打，我想用点球大战让他们快速上手有参与感，帮我写个现场介绍和邀请话术"
      target_customer_type: new
      output_package: [private_chat]
      extra_note: "点球大战：白球固定开球线中间，黑8固定三分线，打进算成功，规则最简单"
    must_hit:
      - ["新手", "第一次", "刚来", "入门", "零基础"]
      - ["简单", "容易", "门槛低", "都能玩"]
      - ["打进", "成功", "奖励", "奖品"]
      - ["来试试", "先玩一把", "不用紧张", "随时来挑战"]
    forbidden: ["免费畅打", "终身", "押金"]
    judge_focus: "话术是否从'降低新手心理门槛'出发（别怕、一击就懂），而非直接念规则？邀约动作是否自然不生硬？"

  - id: games_005
    category: games
    generator: workbench_free
    store: commercial
    role: manager
    title: 商业中端店策划周末"环打车轮战"多人活动并写朋友圈+群公告双版文案
    input:
      user_intent: "周末下午空台多，想搞个环打车轮战把散客凑一桌，帮我写朋友圈和群公告各一版"
      target_customer_type: all
      output_package: [moments, group_notice]
      extra_note: "环打规则：3-6人同台轮流打，进球者继续，失误者下台排尾，最后留台上的赢"
    must_hit:
      - ["3", "4", "5", "6", "多人", "一起"]
      - ["轮流", "车轮", "留台", "最后"]
      - ["周末", "下午", "空台"]
      - ["围观", "热闹", "气氛", "欢迎加入"]
    forbidden: ["免费畅打", "终身", "现金奖励超百元"]
    judge_focus: "文案是否突出'人越多越热闹、围观也有趣'的氛围感？朋友圈和群公告两版有没有做差异化（朋友圈卖氛围、群公告说具体时间报名），而非复制粘贴？"

  - id: games_006
    category: games
    generator: workbench_free
    store: community
    role: boss
    title: 社区店老板为"黄金满台"开业引流活动写活动说明和朋友圈预热
    input:
      user_intent: "我们下周搞开业活动，准备在台面铺满台费卡和饮料奖品做黄金满台游戏，帮我写朋友圈预热文案"
      target_customer_type: new
      output_package: [moments]
      extra_note: "黄金满台：台面铺满奖励，白球打底库弹停在哪个奖品格子上就赢哪个，视觉冲击强"
    must_hit:
      - ["开业", "新店", "首次", "欢迎"]
      - ["台面", "奖品", "台费卡", "现场"]
      - ["视觉", "满满当当", "丰厚", "大奖", "奖品铺满"]
      - ["来参与", "下周", "预约", "期待"]
    forbidden: ["免费畅打", "终身", "赌博", "返利"]
    judge_focus: "文案是否用'台面满满奖品'的视觉感营造期待感，而非只说'来玩有奖'？开业氛围与游戏规则是否有机融合，不显得是两段拼接？"

  - id: games_007
    category: games
    generator: workbench_free
    store: competitive
    role: coach
    title: 竞技馆教练为新老搭配的"让球友谊赛"活动设计群公告和现场规则说明
    input:
      user_intent: "馆里老球友太多，新手不敢来打，想搞个让球友谊赛让新手也能赢老手，帮我写个群公告通知大家来参加"
      target_customer_type: all
      output_package: [group_notice]
      extra_note: "让球友谊赛：老手让新手若干球，拉平水平差，输的请桌饮料；目的是让新手敢上桌、有参与感"
    must_hit:
      - ["让球", "让分", "新手", "初学者", "入门"]
      - ["水平差", "公平", "拉平", "有机会赢"]
      - ["饮料", "输了请", "奖励"]
      - ["老带新", "高手", "新手都能参与", "欢迎加入"]
    forbidden: ["免费畅打", "终身", "现金对赌"]
    judge_focus: "是否把'让球'的趣味性（高手也有压力、新手也有尊严）说清楚？文案能否消除新手的'不敢来'心理而非只是通知规则？"

  - id: games_008
    category: games
    generator: workbench_free
    store: commercial
    role: assistant_manager
    title: 商业店助教经理为"你来我往教学局"情侣活动设计私信邀约话术
    input:
      user_intent: "最近情侣客多，想推'你来我往教学局'——会打的教不会打的，攒进球数得奖品，帮我写个私信邀约话术发给情侣客户"
      target_customer_type: old
      output_package: [private_chat]
      extra_note: "教学局规则：会打的一方手把手教，新手每打进一颗两人庆祝，攒够颗数得奖；重点是氛围好玩不强调输赢"
    must_hit:
      - ["情侣", "两人", "教", "手把手", "一起学"]
      - ["打进", "庆祝", "攒", "奖励", "奖品"]
      - ["氛围", "好玩", "开心", "互动"]
      - ["约", "来玩", "这周末", "期待"]
    forbidden: ["免费畅打", "终身", "纯技术课", "打球比赛"]
    judge_focus: "话术是否从'两人共同体验、一起庆祝进球'的情感共鸣出发，而非把它写成普通助教推销？'教学局'的轻松感有没有体现？"

  - id: games_009
    category: games
    generator: workbench_free
    store: community
    role: frontdesk
    title: 社区店前台为工作日下午冷场策划"拼台搭子局"撮合方案并写通知话术
    input:
      user_intent: "下午空台多，有几个散客单独来的，想帮他们拼台搭子局，写个现场邀请话术和朋友圈"
      target_customer_type: all
      output_package: [moments, private_chat]
      extra_note: "拼台搭子局：把水平相近的散客撮合成2-4人一桌，AA或按人头特惠价；新人首次拼台可送小段体验"
    must_hit:
      - ["拼台", "搭子", "凑桌", "一起打"]
      - ["AA", "人均", "特惠", "优惠价", "按人头"]
      - ["水平相近", "凑得上", "散客"]
      - ["今天下午", "现在", "台位充足", "欢迎凑桌"]
    forbidden: ["免费畅打", "终身", "随机拉人"]
    judge_focus: "是否把'拼台'的好处（省钱+找到球搭子）讲清楚而非只是'我们台位空了'？撮合逻辑（水平相近、凑得上）有没有让人觉得是在为客户着想？"

  - id: games_010
    category: games
    generator: workbench_free
    store: competitive
    role: manager
    title: 竞技馆店长每周轮换小游戏规划并写一份"本周游戏"公告（本周为倒车入库）
    input:
      user_intent: "我们馆每周轮换一个小游戏保持新鲜感，本周是倒车入库，帮我写本周的活动公告发群里"
      target_customer_type: all
      output_package: [group_notice]
      extra_note: "倒车入库规则：白球开球点打到底库弹回中袋规范点位算成功，成功奖红牛；规则简单参与门槛低；每周换一个新游戏"
    must_hit:
      - ["本周", "这周", "今周"]
      - ["倒车入库", "底库", "弹回", "中袋"]
      - ["红牛", "奖励", "奖品"]
      - ["每周", "轮换", "新玩法", "保持新鲜", "下周又换"]
    forbidden: ["免费畅打", "终身", "不限次数挑战"]
    judge_focus: "公告是否同时说清本周玩法和'每周轮换'的机制感（让客人有期待感、下周再来），而非只是单次活动通知？"
