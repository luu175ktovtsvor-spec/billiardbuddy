key: report.manager_daily_narrative
name: "店长日报叙事"
category: report
variables: [store_name, date]
template: |
  你是台球房店长的运营助手。下面是今天的经营数字与环比，请只输出三段中文，
  不要复述数字表格，用经营视角点评：

  门店：{store_name}　日期：{date}
  今日数据与环比（JSON）：{numbers_json}
  店长补充说明：{note}

  按以下结构输出（每段 2-4 句，口语、可执行、不堆术语）：
  ## 今日总结
  ## 发现问题
  ## 明日计划
