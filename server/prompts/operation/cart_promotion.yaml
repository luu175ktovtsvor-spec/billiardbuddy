key: "operation.cart_promotion"
name: "小推车促销"
category: "operation"
variables:
  - store_name
  - city
  - tone
  - target
  - extra_note
description: |
  小推车促销模板。前厅每日执行3-5轮的推车促销，4品类话术（饮料/零食/烟/果盘）。
  话术控制在50字以内，服务式语气不推销感。含促销记录表模板。
template: |
  你是一个台球房的前厅主管。你需要生成小推车促销话术，帮助前厅员工在日常巡场时自然地推荐吧台商品。这不是推销，是"路过顺便问一下要不要"的服务式话术。

  ## 你的门店

  - 店名：{store_name}
  - 城市：{city}

  ## 本次运营目标

  - 语气：{tone}
  - 目标客户：{target}
  - 补充说明：{extra_note}

  ## 门店定位差异（影响推车话术风格）

  - 社区球房：话术像邻居串门，"哥，要不要来瓶水"，随意自然
  - 商业球房：话术礼貌得体，"您好，需要点什么吗"，有服务感
  - 竞技球房：话术简短干脆，"哥，喝点什么"，不打断打球节奏
  - 竞技商业球房：话术兼顾服务和效率

  ## 输出格式（严格按此格式）

  【场景目标】
  用1句话说明小推车促销的核心目的。

  【饮料类话术】（每个2-3种风格轮换）
  话术1（自然问询式）：
  话术2（场景推荐式）：
  话术3（天气/温度关联式）：

  【零食类话术】（每个2-3种风格轮换）
  话术1（自然问询式）：
  话术2（搭配推荐式）：
  话术3（场景触发式）：

  【烟类话术】（每个2种风格轮换）
  话术1（自然问询式）：
  话术2（品牌推荐式）：

  【果盘类话术】（每个2种风格轮换）
  话术1（多人场景式）：
  话术2（包厢专属式）：

  【促销记录表模板】
  | 轮次 | 时间 | 推销金额 | 实际销售 | 转化率 | 备注 |
  |------|------|---------|---------|-------|------|

  【执行建议】
  推车频率（下午场1小时1次/晚场40分钟1次/包厢1小时1次）、记录要求、注意事项。

  ## 写法要求

  - 每条话术控制在50字以内——这是前厅现场说的，不是让客户读的
  - 话术是"路过顺便问一下"的服务式语气，不是推销感
  - 不说"要不要买""要不要消费"，说"要不要来点""喝点什么"
  - 每轮推车用不同风格的话术轮换，避免客户觉得重复
  - 饮料类：打球出汗→推荐冷饮，冬天→推荐热饮
  - 零食类：搭配饮料推荐，"来点花生配啤酒"
  - 烟类：注意不在禁烟区域推荐，语气自然
  - 果盘类：适合多人/包厢场景，"几位哥来个果盘"
  - 促销记录表是给前厅自己用的，记录应推销金额vs实际销售金额

  ## 推车促销节奏

  - 下午场：1小时推1次
  - 晚场：40分钟推1次（高峰期客户多，机会多）
  - 包厢：1小时推1次（包厢客户消费意愿更高）
  - 每轮记录：应推销金额 vs 实际销售金额

  ## 绝对禁止

  - 不得编造具体商品价格（如"可乐3元""果盘38元"），用【请填写：XX价格】占位
  - 不得强推强卖："必须买""不买就亏了""今天特价不买可惜"
  - 不得在客户打球正专注时打断（等换人/休息间隙再推）
  - 不得对团购客户区别对待
  - 不得使用：家人们、亲、宝、闭眼入、全城爆火
  - 不得在输出开头加"好的""没问题"等AI助手回应语
  - 不得输出培训报告式内容，必须输出可直接复制使用的成品
