key: "operation.assistant_recruit_sop"
name: "助教招聘一线SOP"
category: "operation"
domain: talent-mgmt
freedom: red_line
tags: [scene:招聘, role:助教管理]
variables:
  - store_name
template: |
  你是带过助教团队的助教管理/店长，给 {store_name} 写一套能直接照着干的助教招聘一线 SOP。
  对内用，口语、能落地，别写成空泛的 HR 咨询体。招的是台球陪打/陪练助教，不是别的。

  讲清楚下面六块，每块给具体动作、话术、判断标准，不要只讲道理：

  ## 一、人才画像（招谁、按什么排序）
  - 优先级照实写：形象 > 沟通能力 > 台球技术。有技术更好，但不是第一标准，技术能教、形象气质教不出来。
  - 形象这块对内直说：长得周正、干净得体、有亲和力；身高、年龄按门店实际偏好筛（年轻、过得了客户眼的），别消毒成"专业素养"。具体身高/年龄线写【请补充：本店偏好（如身高范围/年龄段）】，门店自己定。
  - 软的看：会聊天、情商在线、有服务意识、赚钱欲望强、端得住场子、懂点人情世故、心态稳不玻璃心。
  - 一句话总结：愿意来挣钱、客户看着舒服、聊得来、镇得住，就是好苗子。

  ## 二、招聘平台等平台线上沟通
  - 红线：线上（平台站内/聊天）**不提"助教"两个字、不聊助教具体业务**——用别的岗位（如前台/服务/陪练助理）的口子先把人约出来，避免平台封号。具体挂什么岗位写【请补充：本店在招聘平台挂的岗位名】。
  - 发邀约的时间：**晚上11点到凌晨3点**这个点发，这时候在刷手机、在找事做的人回得快、意向高。
  - 看反应分流：立马回复的 → 马上引导加微信，趁热打铁；不回的 → 第二天上午10点后一键群发再捞一遍，不盯着单个人耗。
  - 目的就一个：把平台流量导到微信，别在平台上深聊。

  ## 三、微信沟通（主导节奏 + 直接要照片）
  - 加上微信后**你主导聊天**，别被对方带节奏，问什么答什么，高效筛。
  - **直接要照片**——大方开口要近照/生活照，别绕。同时去翻她朋友圈：
    - 朋友圈一张本人照片都没有的，大概率不合格，别浪费时间深聊。
    - 朋友圈能看出形象、状态的，重点看周正度、精神面貌、整体感觉。
  - 形象过关 → 直接约线下面试，别拖；形象不过关 → 客气收尾，不勉强。
  - 心态摆正："**是我招你，不是你招我**"——不跪舔、不画大饼求人来，主导聊天、花最少精力筛最多人。条件差不多就往面试推，磨叽的直接过。

  ## 四、线下面试（看人，不搞笔试）
  - 不做复杂笔试、不考球技理论，就看几样：
    1. 形象：到现场是不是和照片对得上，整体精神状态、得体程度。
    2. 沟通：当面聊起来自不自然、会不会接话、情绪稳不稳。
    3. 服务意识：会不会主动、眼里有没有活、待人接物的分寸。
    4. 对这行的接受度和挣钱意愿：能不能踏实干、图不图这份收入。
  - 还是双向选择，标准不为了凑人头往下降；但也别端着，合适就当场把流程和待遇讲清楚、定下来。

  ## 五、同业挖人（周边门店挖现成熟手）
  - 范围：先盯周边门店，缺人狠了再辐射到全城。挖来的好处是上手快、自带客户。
  - 手法：用**私人微信**加好友，别一上来谈工作——**先交朋友、正常聊**，把关系处熟。
  - 找痛点：聊的过程中摸清她在原店不爽的地方（分成低、排钟死、管理压人、客源差……），**把这些问题放大、让她认同你这边更好**。
  - 节奏：第一次别直奔主题，养一阵子再聊；后续熟了再直接谈过来。
  - 给好处：开**转介绍费**——老助教/熟人推荐入职给奖励，让圈子里的人主动帮你带人。转介绍费金额写【请补充：本店转介绍奖励金额/规则】。

  ## 六、薪资口径（讲清楚但不准编数字）
  - 开业前招的：通常**只有补助、没有保底**，先把人攒住。
  - 开业后/满月后：按门店约定条件执行。
  - 新人**前7天是筛选期**：薪资按实际上钟时长实打实算，**不设保底**，不合适的7天内及时止损，不耽误双方。
  - ⚠️ 所有具体金额（补助、保底、提成比例、上钟单价）一律用占位符：【请补充：开业前补助】【请补充：满月后保底】【请补充：上钟提成/单价】，没有门店真实数字就不要编。

  ---

  ## 招聘海报文案模板（贴出去用，三版任选）

  下面三版海报文案直接给 {store_name} 套用，发朋友圈/招聘群/门店贴墙都行。
  结构固定四块：**标题 + 职位&薪资档位 + 任职要求 + 0基础带薪培训&转介绍奖&联系方式**。
  ⚠️ 所有薪资数字、时薪、电话、面试地址、招的人数一律用占位符，没有门店真实数字绝不编。

  ### 版本一：综合招聘版（含助教+店长+前台多职位）
  适合开业前一次性把团队搭起来、各岗都缺人时贴。

  ```
  【LOGO 位】
  标题：{store_name} 高薪招聘

  ▍台球助教 招【请补充：招聘人数】名
  待遇：无责底薪【请补充：助教底薪】起、保底年薪【请补充：助教年薪区间】
  要求：
  1. 女性，身高【请补充：身高线】以上，形象气质佳；
  2. 亲和力强，沟通协调能力好；
  3. 做事认真细致、执行力强，有较强的服务意识。
  0 基础也能来——有专业教练，包教包会。
  有台球行业相关经验者优先。

  ▍店长 招【请补充：招聘人数】名
  待遇：月薪【请补充：店长月薪】起、保底年薪【请补充：店长年薪区间】
  要求：
  1. 有营销思维和管理能力，沟通协调、应变能力强，认真细致，执行力强；
  2. 带过【请补充：团队规模】以上团队、有门店经营经验者优先。

  ▍前台 招【请补充：招聘人数】名
  待遇：月薪【请补充：前台月薪】起、保底年薪【请补充：前台年薪区间】
  要求：女性，身高【请补充：身高线】以上，形象气质佳，亲和力强，沟通协调能力好，
  认真细致、执行力强，有服务意识，会简单 office 办公软件。
  擅长新媒体营销、有台球行业经验者优先。

  联系人：【请补充：联系人/经理】  电话：【请补充：联系电话】
  面试地址：【请补充：门店地址】
  ```

  ### 版本二：助教档位 + 转介绍版（突出晋升&带薪培训&介绍奖）
  适合主攻助教招聘、想靠老带新裂变时贴。

  ```
  【LOGO 位】
  标题：《招聘》

  初级助教：保底底薪【请补充：初级底薪】+ 时薪【请补充：初级时薪】
  中级助教：保底底薪【请补充：中级底薪】+ 时薪【请补充：中级时薪】
  高级助教：保底底薪【请补充：高级底薪】+ 时薪【请补充：高级时薪】
  特级助教：保底底薪【请补充：特级底薪】+ 时薪【请补充：特级时薪】

  岗位要求：
  1. 年龄【请补充：年龄段】，0 基础可带薪培训；
  2. 开朗活泼、性格外向，善于与人交流。

  工作内容：
  1. 提供摆球、台球陪练、斯诺克计分；
  2. 台面/卫生清理等服务。

  长期招聘：店长、助教主管、教练、服务员、收银。
  以上岗位均可晋升助教管理或店长。

  转介绍经纪人奖：成功转介绍 1 位助教入职，现金奖励【请补充：转介绍奖励金额】。

  电话：【请补充：联系电话】（【请补充：联系人/经理】）
  ```

  ### 版本三：多职位 + 转介绍版（店长/营销/助教/教练全岗）
  适合管理岗+一线岗一起招、想吸引有跨行业管理经验的人时贴。

  ```
  【LOGO 位】
  招聘：

  ▍门店店长  薪资【请补充：店长薪资区间】
  1. 具备一定管理能力、抗压力、较强执行力；
  2. 做过餐饮/娱乐等行业门店管理者优先。

  ▍营销经理  薪资【请补充：营销经理薪资区间】
  1. 负责门店活动策划与实施；
  2. 协助助教完成工作指标；
  3. 具备数据分析能力、执行力、抗压能力。

  ▍助教  薪资【请补充：助教薪资区间】
  1. 形象好、气质佳；
  2. 沟通能力强，性格开朗外向。

  ▍教练  薪资【请补充：教练薪资区间】
  1. 有一定球技水平；
  2. 沟通能力好。

  转介绍经纪人奖：成功转介绍 1 位助教入职，现金奖励【请补充：转介绍奖励金额】。

  联系方式：【请补充：联系电话】  联系人：【请补充：联系人/经理】
  面试地址：【请补充：门店地址】
  ```

  套用提醒：
  - LOGO 位放门店自己的标识；标题里的"高薪""保底"这些钩子词留着，是招聘海报的常见抓眼写法。
  - 助教岗的"形象气质佳/女性/身高线"是门店真实筛选偏好，照实写，别消毒成空话；身高/年龄线由门店填。
  - 别在海报上写"助教=陪酒/陪玩"等暗示性服务的字眼，招的是台球陪打/陪练助教，平台和线下都按这个口径。

  ---
  最后用大白话给 {store_name} 一句招人节奏建议（比如该铺多大量、先线上还是先挖人）。

  铁律：
  - 不编任何薪资/补助/提成/转介绍费数字，没有就留【请补充：...】。
  - 招的是台球陪打/陪练助教，不写、不暗示任何实际性服务或异性陪伴交易。
  - 不出现任何招聘机构名、连锁品牌名、人名、文档出处。
