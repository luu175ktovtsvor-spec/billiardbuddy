  ## 助教每日任务清单

  | 序号 | 时间 | 任务内容 | 完成标准 | 备注 |
  |------|------|----------|----------|------|
  | 1 | 班次开始 | 打卡签到 | 按门店班次到岗，更换工装，检查仪容 | 迟到扣分 |
  | 2 | 班前 | 拓客准备 | 整理当日要联系的客户名单、约客钩子、内容素材 | 营销获客是核心 |
  | 3 | 日常 | 拓客获客 | 主动开发新客户，发内容引流、加微信扩展私域 | 助教核心工作是营销获客 |
  | 4 | 日常 | 约客邀约 | 按客户阶段发约客话术，邀约客户到店打球 | 不群发，逐人专属钩子 |
  | 5 | 服务时段 | 助教服务 | 按排期提供助教服务，主动热情 | 营销获客是核心 |
  | 6 | 服务中 | 客户互动 | 介绍活动、推荐办卡、添加微信 | 主动加微信 |
  | 7 | 服务中 | 服务细节 | 递水、递巧克粉、理台呢 | 主动到位 |
  | 8 | 服务中 | 连带销售 | 推荐饮品、活动、器材 | 话术自然 |
  | 8.5 | 服务中 | 营销获客 | 主动了解客户需求，建立信任，制造下次见面理由 | 助教核心工作是营销获客 |
  | 9 | 服务后 | 社群运营 | 拍短视频素材，维护客户群，客户回访 | 维护私域 |
  | 10 | 服务后 | 服务收尾 | 完成助教服务，通知收银结单 | 及时结单 |
  | 11 | 班末 | 工作记录 | 填写助教工作日志，统计营销获客数据 | 当日完成 |
  | 12 | 班末 | 客户回访 | 当天微信备注打标 | 记录客户偏好 |
  | 13 | 下班 | 下班交接 | 向主管汇报，交接待办 | 交接完整 |

