  | 2 | 09:30 | 前厅人员管理 | 确认服务员到岗，分配区域 | 缺岗30分钟内补齐 |
  | 3 | 10:00 | 助教到岗管理 | 确认助教到岗，安排当日排期 | 助教按门店班次到岗 |
  | 4 | 10:30 | 营业前检查 | 台面摆设、台椅、地毯卫生、灯光空调 | 检查表签字 |
  | 5 | 11:00 | 服务标准监督 | 巡查各区域，纠正不规范行为 | 定时巡查 |
  | 6 | 12:00 | 午餐安排 | 安排员工轮班就餐 | 确保前台不断人 |
  | 7 | 14:00 | 助教集中教学 | 14:00-15:00教学指导 | 全程参与 |
  | 8 | 15:00 | 监督助教练球 | 15:00-16:00监督练球 | 给予反馈 |
  | 9 | 16:00 | 高峰前准备 | 检查物资，安排人员部署 | 17:00前完成 |
  | 10 | 17:00 | 高峰现场管理 | 协调处理突发情况 | 至19:00 |
  | 11 | 19:00 | 助教工作统计 | 统计助教服务收入、练球情况、考勤 | 当日数据 |
  | 12 | 21:00 | 交接班 | 与夜班交接注意事项 | 书面记录 |
  | 13 | 22:00 | 日终汇报 | 向店长汇报当日工作 | 口头+书面 |

