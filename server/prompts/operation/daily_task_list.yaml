key: "operation.daily_task_list"
name: "每日任务表模板"
category: "operation"
variables:
  - store_name
  - role
  - date
template: |
  你是{store_name}的运营助手。根据角色和日期，生成每日任务清单。

  当前角色：{role}
  当前日期：{date}

  请按以下6个角色模板生成对应的每日任务清单，包含时间节点、任务内容、完成标准。

  ## 门店定位差异（影响任务重点）

  - 社区球房：任务侧重客户关系维护、日常服务、社区氛围营造
  - 商业球房：任务侧重服务品质、会员转化、商务客户维护
  - 竞技球房：任务侧重赛事组织、助教管理、竞技氛围打造
  - 竞技商业球房：任务兼顾运营管理和竞技活动执行

  ---

  ## 店长每日任务清单

  | 序号 | 时间 | 任务内容 | 完成标准 | 备注 |
  |------|------|----------|----------|------|
  | 1 | 09:00 | 提前到店巡场 | 检查昨日闭店遗留问题，确认环境达标 | 比员工早到30分钟 |
  | 2 | 09:30 | 主持晨会 | 全员参会，传达工作安排，检查仪容仪表 | 时长15-20分钟 |
  | 3 | 10:00 | 经营数据复盘 | 核对昨日营业额、客流量、台费、商品销售数据 | 异常数据标注分析 |
  | 4 | 10:30 | 人员排班确认 | 确认各岗位到岗情况，调整缺岗 | 缺岗2小时内补齐 |
  | 5 | 11:00 | 门店巡检 | 台面、灯光、空调、卫生、安全检查 | 巡检表签字确认 |
  | 6 | 14:00 | 参与管理层例会 | 听取主管汇报，部署下午工作 | 14:10前完成 |
  | 7 | 15:00 | 客户关系维护 | 回访重点客户，处理投诉，关注会员续费 | 回访重点客户 |
  | 8 | 16:00 | 营销活动跟进 | 检查活动物料、执行情况、效果数据 | 活动ROI评估 |
  | 9 | 17:00 | 助教培训监督 | 检查助教集中教学执行情况 | 14:00-16:00时段 |
  | 10 | 17:30 | 班次沟通 | 与早晚班管理层沟通交接事项 | 17:30-18:30 |
  | 11 | 19:30 | 高峰现场管理 | 大厅迎宾，现场协调 | 至20:30 |
  | 12 | 20:30 | 客户维护+巡查 | 维护重点客户，巡查各区域 | 至闭店 |
  | 13 | 22:00 | 班后例会 | 总结当日经营，部署次日工作 | 全员参加 |
  | 14 | 22:30 | 数据统计上传 | 营业数据录入系统，生成日报 | 当日数据当日清 |

  ---

