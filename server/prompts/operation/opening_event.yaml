key: "operation.opening_event"
name: "开业活动全套内容模板"
category: "operation"
variables:
  - store_name
  - city
  - owner_name
  - host_name
  - opening_date
  - address
description: |
  台球俱乐部开业活动全套内容模板，包含老板致辞、主持人文稿、活动时间节点安排三大模块。
  数据来源：唐希台球连锁/恺九台球俱乐部开业方案。

sections:
  owner_speech:
    name: "老板致辞"
    applicable: "开业庆典老板上台致辞环节"
    structure:
      - part: "开场欢迎"
        template: |
          各位朋友，大家好！
          今天是{store_name}正式开业的日子，我是这家俱乐部的老板，特别开心能看到这么多朋友来捧场，谢谢大家！
      - part: "台球理念"
        template: |
          台球，是一项充满魅力的运动。它不仅考验着选手的技术和策略，更能培养人的专注力、耐心和心理素质。我们的台球俱乐部致力于为广大台球爱好者提供一个专业、舒适、优质的娱乐场所。
      - part: "门店亮点"
        template: |
          在这里，我们用心准备了最好的打球环境。好的台子、好的球杆、好的氛围，让你来了就不想走。如果门店有助教服务，可以补充：我们还有专业的助教团队，帮你提升球技、享受打球。
          我们的服务团队也会用心对待每一位朋友，让你在这里有家的感觉。无论你是新手还是高手，有什么需要随时跟我们说，我们一定帮你安排好。
      - part: "愿景收尾"
        template: |
          最后，再次感谢大家来捧场！我们会用心做好每一个细节，让{store_name}成为大家爱来、常来的地方。
          来，一起打球！谢谢大家！

  host_script:
    name: "开业主持人文稿"
    applicable: "开业当天主持流程"
    structure:
      - part: "开场"
        template: |
          大家好！
          欢迎来到{store_name}的开业现场！我是今天的主持人{host_name}，也是本俱乐部的店长。
          感谢各位百忙之中来捧场，你们的到来让我们特别开心！
      - part: "门店介绍"
        template: |
          台球，考验技巧、智慧与耐心，更能在球与球的碰撞中释放压力、收获快乐。今天，{store_name}开业了，为广大台球爱好者提供一个全新的去处。
          好台子、好球杆、好氛围，这是我们的基本盘。我们还精心打造了休息区，让大家打球之余能放松放松。
          服务方面，我们的团队会用心对待每一位朋友，让你在这里有家的感觉。
      - part: "请老板致辞"
        template: |
          接下来，有请{store_name}老板{owner_name}上台说几句！
      - part: "致辞后串词"
        template: |
          谢谢老板！说得实在，{store_name}就是要把台球这件事做好，让大家来了就舍不得走。
      - part: "剪彩环节"
        template: |
          现在我宣布，{store_name}正式开业！有请{owner_name}及嘉宾上前剪彩并合影！
          一起倒数！5、4、3、2、1！
          {store_name}，正式开门迎客！
      - part: "活动预告+收尾"
        template: |
          开业期间我们准备了[请填写：具体活动内容]，欢迎大家参与！
          接下来，有请{owner_name}共同开启{store_name}的大门，各位朋友，请进！
          谢谢大家！

  event_timeline:
    name: "开业活动时间节点安排"
    description: "标准开业当天时间节点参考，可根据实际情况调整"
    timeline:
      - time: "09:00-09:30"
        activity: "搭建现场准备工作"
        details: "签到台、花篮、礼炮、音响设备、剪彩道具就位"
      - time: "09:30-11:00"
        activity: "舞狮开场、点睛、吐彩"
        details: "三个环节均8炮齐鸣。舞狮队巡场一圈，为门店驱邪纳福"
      - time: "11:00-11:05"
        activity: "主持人开场+老板致辞"
        details: "主持人介绍门店亮点，老板致辞表达愿景"
      - time: "11:05-11:17"
        activity: "串词+剪彩准备工作"
        details: "主持人在致辞后串词过渡，工作人员准备剪彩彩带、金剪刀、托盘"
      - time: "11:18-11:20"
        activity: "剪彩+合影"
        details: "剪彩环节8炮齐鸣，嘉宾合影留念"
      - time: "11:21-11:22"
        activity: "串词+开门"
        details: "主持人宣布正式开业，开门环节8炮齐鸣，迎接首批客人"
      - time: "20:00-22:00"
        activity: "店长挑战赛"
        details: "可根据参与人数提前结束或推迟。设置趣味规则和奖品，吸引人流、营造氛围"

template: |
  你是一个台球房开业活动策划专家，为{store_name}生成开业活动内容。

  门店名称：{store_name}
  所在城市：{city}
  老板姓名：{owner_name}
  主持人姓名：{host_name}
  开业日期：{opening_date}
  门店地址：{address}

  请根据以上信息，生成：
  1. 老板致辞（完整版）
  2. 主持人文稿（完整版，包含互动环节串词）
  3. 开业活动时间节点安排表

  ## 门店定位差异（影响致辞和主持风格）

  - 社区球房：致辞和主持接地气亲切，像跟邻居聊天，多用口语
  - 商业球房：致辞和主持体现品质和专业，但不要官方套话
  - 竞技球房：致辞和主持突出竞技氛围，强调赛事和高手过招
  - 竞技商业球房：致辞和主持兼顾品质和竞技，"专业+舒适"

  注意事项：
  - 致辞风格真诚、不浮夸
  - 主持人文稿口语化、节奏感强
  - 时间节点安排留有缓冲时间
  - 所有岗位描述使用合规术语
  - 不编造具体价格、优惠金额、奖金数额（用[请填写：XXX]占位）