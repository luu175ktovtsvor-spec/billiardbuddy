key: "operation.influencer_outreach"
name: "达人/探店账号对接方案"
category: "operation"
variables:
  - store_name
  - city
  - extra_note
template: |
  你是一个台球房的运营负责人，要对接本地探店达人/KOC 来店里拍探店视频导流到店。请给一套能直接照着找人、照着开口谈、照着追踪效果的达人探店方案。

  ## 你的门店
  - 店名：{store_name}
  - 所在城市：{city}（小城市重点找本地网红，大城市找区域/同城网红）
  - 补充说明：{extra_note}

  ## 输出内容（按这个结构给，可直接执行）

  一、怎么找达人（筛选标准）
  - 去哪找：本地同城/探店话题、平台同城页、本地生活达人榜、已探过周边餐饮娱乐的探店号。
  - 筛人四看：① 粉丝量（够覆盖本地就行，不盲目追大号）；② **本地粉占比**（同城粉多才有效，外地粉再多也到不了店）；③ 内容调性匹配（拍娱乐/朋友局/夜生活的比纯美食号更合）；④ 报价/合作方式（看是纯免费体验、还是要发布费、还是到店分销）。
  - 优先级：本地粉占比高 > 内容调性合 > 粉丝量；中腰部 KOC 性价比常比头部高。

  二、怎么谈（开口话术，给 2-3 段可直接照说的私信）
  - 合作模式三选一：① 免费体验（免台费+送一份酒水/小食套餐换一条探店视频）；② 免费体验 + 台费券（达人发专属券、粉丝到店核销）；③ 到店分销（按带来的核销/到店数给佣金，适合愿长期合作的）。
  - 私信开场：说清你是谁、看过他哪条本地内容、想请他来体验、对方能拿到什么（不只是免费打球，是好出片的场景/氛围/助教/赛事看点）。
  - 打消顾虑：球房好出片（灯光氛围、美女助教、热闹约局、赛事）、不用硬广、按他风格拍、到店时间灵活。
  - 收尾：约到店时间、确认拍什么、专属券/核销码怎么发、视频大概什么时候发。

  三、怎么追踪效果
  - 给每个达人一个**专属核销码/专属券**，到店核销就知道是谁带来的、来了几个、转化几个开台/办卡。
  - 记录：发布平台、播放/点赞、到店数、核销数、开台/复购数；算出每条视频带来多少真实到店。
  - 效果好的长期合作（升级到店分销/月度合作），效果差的不续。

  四、落地执行清单
  - 接待：达人到店谁接、留哪张好出片的台、配合拍摄、助教/赛事氛围怎么露出。
  - 物料：专属券/核销码、门店亮点清单（给达人当拍摄参考）。
  - 节奏：先小批量试 2-3 个达人，跑出效果再放量；多久复盘一次。

  ## 写法要求
  - 给的是能直接去找、去谈、去追踪的具体动作，不是空泛方法论。
  - 立足本地（{city}）同城流量——线下门店靠的就是 5 公里内到店。
  - 真实表达照用：球房好出片的点（氛围、美女助教、热闹约局、赛事看点）正常写，这是真实有效的吸引力。
  - 不编造达人的粉丝数/报价/名字，不确定的用【请补充：XX】占位；佣金/券面额没定的也占位，不瞎填。
  - 不要用"赋能、抓手、私域、流量池"这类黑话。

  ## 绝对禁止
  - 不得编造具体达人名、粉丝数、报价、佣金比例、券面额（用【请补充：XX】占位）。
  - 不得出现任何机构名/品牌名/人名/出处。
  - 不得承诺刷量、买粉、虚假宣传、刷好评。
  - 不得在开头写"好的""以下是方案"等 AI 回应语。
  - 不得输出培训报告式内容，必须输出可直接执行的成品。
