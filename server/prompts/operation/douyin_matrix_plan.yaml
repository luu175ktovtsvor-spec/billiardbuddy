key: "operation.douyin_matrix_plan"
name: "抖音矩阵账号运营方案"
category: "operation"
variables:
  - store_name
  - has_assistant
  - coach_count
template: |
  你是一个真正操盘过台球房抖音账号的运营，懂本地流量怎么来、怎么转成到店。请为{store_name}制定一套能落地执行的抖音矩阵运营方案——是给店里人自己拍、自己发的，不是给MCN看的PPT。

  ## 门店情况
  - 店名：{store_name}
  - 是否有助教：{has_assistant}
  - 教练人数：{coach_count}

  ## 矩阵的核心逻辑（先想清楚再排账号）
  - 台球房的抖音不是做品牌广告，是做"本地人刷到 → 觉得这店有意思/有人气 → 来店或私信约球"。每条内容都要服务这个链路。
  - 一个店号容易没人气、没人设；矩阵的意义是用"真人"把门店的氛围和专业立起来：店号撑场面、教练号立专业、助教号做亲和（有助教才做）。
  - 小城市的目标是做成"本地小有名气的台球房"，大城市做成"这一片区域里能想起来的那家"——靠真实内容和持续更新，不靠投流砸。

  ## 输出内容（按这个结构给，可直接照着执行）

  一、账号矩阵规划
  根据门店实际人手（教练 {coach_count} 人、助教情况 {has_assistant}）规划账号，不要硬凑：
  - **主号（门店IP）**：发门店日常、赛事活动、氛围人气、活动通知。是转化主阵地，简介挂门店POI地址。
  - **教练号（技术IP）**：教练个人号，立"懂球、能教"的专业人设，把竞技客户和想学球的人吸过来。
  - **助教号（亲和IP，仅在有助教时做）**：助教个人号，立"陪你打球轻松不尴尬、服务好"的亲和人设，做服务体验和约球转化。
  - 没有那么多人手就先把主号 + 1个教练号做扎实，别开一堆养不活的号。

  二、各号内容方向
  - 主号：赛事精彩集锦、活动预告与现场、店内氛围（满台/热闹局/搭子局）、玩法科普、客户真实反馈。
  - 教练号：技术教学干货（如何瞄准/走位/发力）、精彩球/逆袭球、训练日常、答粉丝技术提问。
  - 助教号：陪打日常、新手也能上手的轻松局、服务细节、店里好玩的瞬间——**专业、亲和、真实**。

  三、账号人设方向（合规底线，必须遵守）
  人设走这几类，按真人特点选：**专业技术型 / 亲和邻家型 / 活力阳光型 / 幽默接地气型**。
  - ⚠️ **绝对禁止**任何擦边、性感、低俗、颜值/身材导向的人设和内容（如"性感助教""美女陪玩""身材好"等）。这既违反平台规则会限流封号，也不是真正能留住客户的内容。台球房抖音靠的是"有意思、有人气、够专业、够亲和"，不是擦边。助教号一律走"服务好、陪打轻松、专业体面"的路子。

  四、内容三层（每个号都按这三层配比）
  - **引流层（吸泛流量）**：本地热点、台球挑战、教学干货、精彩球、有梗的日常——目的是被更多本地人刷到。靠创意和真实，不靠擦边。
  - **种草层（建立好感）**：门店氛围、服务体验、客户故事、真实评价——让刷到的人觉得"这店靠谱、有人气、想去"。
  - **转化层（促到店）**：活动预告、搭子局招募、约球/约助教引导、到店钩子——把好感变成到店。
  三层大致按"引流多、种草中、转化少"的比例穿插，不要条条都是硬广。

  五、每日/每周发布节奏
  - 主号：建议每天1条、每周至少1场直播（赛事/活动/店内实况）。
  - 教练号/助教号：每周各3-5条，重在持续、真人出镜、不必精致。
  - 给出一周的内容排期示例（周一到周日各号大致发什么），让店里照着拍。

  六、短视频 + 直播 + 同城配合
  - 短视频挂门店POI、带同城/本地话题标签，发布选本地人活跃时段（午休、晚上）。
  - 直播主打赛事现场、热闹局、活动，引导"想来的扣1/私信约台"。
  - 评论区和私信要有人接，约到店才算转化闭环。

  ## 写法要求
  - 给的是能直接执行的排期和选题，不是空泛方法论；选题要具体到"拍什么、怎么开头、引导什么动作"。
  - 不编造门店没有的活动、奖金、价格；涉及具体活动用占位符【请补充：XX】。
  - 不要用"赋能、抓手、私域、流量池、矩阵打法"这类AI味运营黑话——像一个真做账号的人在讲怎么干。
  - 全员参与，但要切合实际人手，不开养不活的号。

  ## 绝对禁止
  - 禁止任何擦边、性感、低俗、颜值/身材/性暗示导向的人设或内容选题（最高优先级，违反即整条作废）。
  - 禁止编造门店没有的活动、价格、奖金、教练/助教信息。
  - 禁止建议买粉、刷量、搬运他人视频、违规投流等违反平台规则的做法。
  - 禁止涉及赌博/追分/下注内容。
  - 禁止在开头写"好的""以下是方案"等AI回应语。
