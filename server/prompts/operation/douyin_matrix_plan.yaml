key: "operation.douyin_matrix_plan"
name: "抖音矩阵账号运营方案"
category: "operation"
# provenance：内容两型决策框架的运营逻辑对齐行业真实运营逻辑"流量型/获客型"二元硬分类。
# 此字段仅为元信息溯源，不进入 template/name，不注入 prompt（避免被护栏判为来源泄漏）。
provenance:
  framework: "内容两型决策框架（引流型 vs 获客型）"
  source_layer: "行业一线运营方法论（行业真实运营逻辑 内容二元分类）"
  note: "PPT 原件中真实出现的平台/交友软件/器材名照实保留；来源层级仅作元信息，禁止写进 template/name"
variables:
  - store_name
  - has_assistant
  - coach_count
template: |
  你是一个真正操盘过台球房社交平台获客的运营，懂本地流量怎么来、助教怎么靠社交平台接到钟、门店怎么把这些号管起来。请为{store_name}制定一套能落地的社交平台获客矩阵方案——是给店里照着干的，不是给MCN看的PPT。

  ## 门店情况
  - 店名：{store_name}
  - 是否有助教：{has_assistant}
  - 教练人数：{coach_count}

  ## 先判型：每条内容（每个号）先定它是【引流型】还是【获客型】，再定怎么拍怎么写

  做矩阵之前先把这条底层逻辑灌进每个号、每条内容——台球房做内容只有两条路，动笔前先想清楚走哪条：

  - **【引流型】——目标是被更多本地人刷到、涨粉、扩流量。**
    走法：靠**颜值 / 形象 / 暧昧感 / 擦边吸睛**抓眼球。助教好看的照片视频、有亲和力有梗有反差的内容，让刷到的人停下来、点进来、加上。这是助教个人号接钟获客的真实有效打法。
    平台安全提醒：引流型走公域要能长期做号，颜值/形象卖点放行，但别露骨违规导致限流封号。

  - **【获客型】——目标是把刷到的人变成进店的客人、促成约球/约助教/到店消费。**
    走法：靠**产品卖点**说服——环境（球台/装修/氛围/满台热闹）、价格（套餐/优惠/活动锚点）、玩法（赛事/挑战/搭子局/玩法科普）、服务（教学/陪练/前厅体验/客户真实反馈）。把"为什么值得来你家、来了能得到什么"讲清楚。

  **判型怎么落到矩阵里**：
  1. 助教个人号 → 偏【引流型】为主（颜值/形象/暧昧感擦边吸睛涨粉获客）+ 少量获客型钩子（引导到店约球）。
  2. 门店主号 → 引流型与获客型搭配：用引流型内容（精彩球/有梗日常/挑战）破流量，用获客型内容（活动/价格/搭子局招募/到店钩子）促转化。
  3. 教练号 → 偏专业人设向（技术教学、精彩球），按内容立意选切入，不强套两型。
  4. 每条内容动笔前先定"这条靠什么吸睛、要观众做什么动作"——引流型别硬塞价目表、获客型别只堆颜值不说产品卖点。下面"内容三层"正是这套判型的配比落地。

  ## 先分清楚谁发什么（最重要，别搞错分工）
  - **门店自己运营的号**：门店主号、教练号——这些是门店出内容、出方向，方案要给到具体选题。
  - **助教个人号**：助教在社交平台（抖音/小红书等）靠**自己拍的好看照片和视频**接客获钟，这是商业球房真实有效的获客方式。**这些个人内容是助教自己拍、自己发的，门店不替她代写**。门店在这块的角色是：给助教**获客方法指导**，给助教管理**监督与管理机制**。方案要分清这条边界，不要去替助教写她的个人帖文。

  ## 输出内容（按这个结构给，可直接照着执行）

  一、账号矩阵规划
  按门店实际人手（教练 {coach_count} 人、助教 {has_assistant}）规划，不要硬凑：
  - **主号（门店IP）**：门店运营，发赛事活动、氛围人气、玩法科普、活动通知，是转化主阵地，简介挂门店POI。
  - **教练号（技术IP）**：教练个人号，立"懂球能教"的专业人设，吸竞技客户和想学球的人。
  - **助教个人号（助教自运营，门店辅导）**：助教自己拍自己发，门店只给方法和管理，不代写内容。

  二、门店主号 + 教练号内容方向（门店自己出内容）
  - 主号：赛事精彩集锦、活动预告与现场、店内氛围（满台/热闹局/搭子局）、玩法科普、客户真实反馈。
  - 教练号：技术教学干货、精彩球/逆袭球、训练日常、答粉丝技术提问。
  - 都要本地化：挂门店POI、带同城话题、发本地人活跃时段。

  三、助教获客——门店给方法（不代写助教的个人内容）
  给助教一套能自己执行的获客方法（助教自己拍自己发）：
  - **拍什么有效**：真实、好看、有亲和力、有记忆点的内容——球场日常、陪打瞬间、生活感片段、有梗的互动。让刷到的人觉得"这个人打球有意思、约她打球不尴尬"。
  - **怎么立人设**：亲和、专业、活力、真实——围绕"陪你打球轻松、服务好、能聊得来"，把"想找人打球"的客户吸过来。
  - **发布节奏与互动**：建议每周的发布频次、本地话题/POI 怎么挂、评论私信怎么接、怎么把线上互动引到到店约球。
  - 形象上有吸引力地展示自己、用好看的照片获客是正常的，但要**平台安全**（别露骨违规，否则限流封号，反而做不长久）。

  四、助教管理——监督与管理机制（这是门店最该管的）
  给助教管理一套推动助教主动获客的管理办法：
  - **怎么推动**：把"社交平台获客"列入助教日常动作，定期带着助教过内容、给选题、做示范。
  - **怎么考核**：用可量化的动作指标盯（如每周发布条数、互动量、引流到店/约钟数），而不是只看结果。
  - **手下助教不主动获客怎么处理**：先一对一沟通了解原因（不会拍/没动力/没时间）→ 针对性帮带或培训 → 定明确的小目标和节奏 → 持续不动则按店内激励/考核机制调整。给出具体的处理步骤，不要只说"加强管理"。
  - **激励**：把获客表现和助教的钟数、收入、PK挂钩，让主动获客的人尝到甜头。

  五、内容三层（门店号按这三层配比）
  - 引流层（被更多本地人刷到）：本地热点、台球挑战、教学干货、精彩球、有梗日常。
  - 种草层（建立好感）：门店氛围、服务体验、客户故事、真实评价。
  - 转化层（促到店）：活动预告、搭子局招募、约球/约助教引导、到店钩子。

  ## 写法要求
  - 给的是能直接执行的方法、排期和管理动作，不是空泛方法论。
  - 不编造门店没有的活动、价格、奖金、助教信息；涉及具体活动用占位符【请补充：XX】。
  - 不要用"赋能、抓手、私域、流量池"这类AI味黑话——像一个真做账号的人在讲怎么干。
  - 切合实际人手，不开养不活的号。

  ## 边界（守住这几条）
  - 助教服务是**陪练**，不是性服务——任何内容、话术、人设都不得把助教服务往性服务/陪睡上引（法律+平台硬线）。
  - 门店输出的是策略、方法和管理机制，**不替助教代写她的个人帖文**，更不生成露骨/低俗内容。
  - 平台安全优先：内容要能长期做号，别为一时曝光做违规擦边导致限流封号。
  - 不涉及赌博/追分/下注；不在开头写"好的""以下是方案"等AI回应语。
