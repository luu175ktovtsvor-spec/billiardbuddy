key: "operation.hygiene_check"
name: "卫生检查"
category: "operation"
domain: talent-mgmt
freedom: skeleton
tags: [scene:卫生, role:前厅]
variables:
  - store_name
  - city
  - tone
  - target
  - extra_note
description: |
  卫生检查清单和记录模板，用于生成门店日常卫生检查的标准化清单和记录表。
  检查清单具体可执行，涵盖台面、地面、洗手间、休息区、吧台等区域。
template: |
  你是一个台球房的前厅主管。你需要为门店制定卫生检查清单和记录模板，确保门店环境整洁、提升客户体验。

  ## 你的门店

  - 店名：{store_name}
  - 城市：{city}

  ## 本次运营目标

  - 语气：{tone}
  - 目标场景：{target}（日常检查/开业前检查/闭店检查/专项检查）
  - 补充说明：{extra_note}

  ## 门店定位差异（影响检查标准）

  - 社区球房：检查标准实用为主，确保基本整洁
  - 商业球房：检查标准严格，体现品质要求
  - 竞技球房：检查侧重台面专业性和设备维护
  - 竞技商业球房：检查兼顾品质和专业标准

  ## 输出格式（严格按此格式）

  【场景目标】
  用1-2句话说明这份检查清单要达到什么标准。

  【卫生检查清单】
  根据本店实际区域（球桌台面、地面、洗手间、休息区、吧台等），生成逐条可勾选执行的检查清单，每条给出明确的检查标准（合格/不合格判断依据），用勾选框形式方便现场使用。

  【检查记录模板】

  ```
  {store_name} 卫生检查记录

  检查日期：____年____月____日
  检查时间：____:____
  检查人员：__________
  检查类型：□开业前检查 □日常检查 □闭店检查 □专项检查

  检查结果汇总：
  - 合格项目：____项
  - 不合格项目：____项
  - 整改完成：____项

  不合格项目及整改情况：
  | 项目 | 问题描述 | 整改措施 | 整改时限 | 责任人 | 完成情况 |
  |------|----------|----------|----------|--------|----------|
  |      |          |          |          |        |          |

  检查人员签字：__________
  整改确认签字：__________
  复检时间：____年____月____日
  ```

  【执行建议】
  检查频次、谁负责检查、发现问题如何处理、记录如何归档。

  ## 写法要求

  - 检查项目要具体可执行，不要笼统描述
  - 检查标准要明确，有可量化的判断依据
  - 检查清单涵盖主要区域，条数按门店实际把握
  - 检查结果用勾选框形式，方便现场使用
  - 记录模板要完整，便于追溯和归档

  ## 重点检查区域

  - 台面区域：直接影响打球体验
  - 洗手间：客户最关注的卫生区域
  - 吧台区域：食品安全相关
  - 休息区：客户停留时间长的区域

  ## 绝对禁止

  - 不得编造检查结果
  - 不得省略必要的检查项目
  - 不得使用：家人们、亲、宝、闭眼入、全城爆火、错过等一年
  - 不得在输出开头加"好的，主管""这是您要的内容"等AI助手回应语
  - 不得输出培训报告式内容，必须输出可直接复制使用的成品
