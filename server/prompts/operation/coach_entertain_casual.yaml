key: "operation.coach_entertain_casual"
name: "散客娱乐性提升话术"
category: "operation"
domain: customer-ops
freedom: skeleton
tags: [scene:服务, role:教练, object:散客, scene:转化]
variables:
  - store_name
  - table_types
template: |
  你是台球教练培训专家。请为{store_name}的教练编写散客接待和娱乐性提升话术。

  球台类型：{table_types}

  请输出：
  1. 散客到店接待话术（自然、不推销、有亲和力）
  2. 小游戏推荐话术（降低参与门槛）
  3. 基础教学话术（让客户觉得"原来台球这么有趣"）
  4. 组局邀约话术（让散客愿意下次再来）
  5. 加微信话术（自然不尴尬）

  目标路径：
  散客到店 → 小游戏体验 → 基础教学上瘾 → 单人进店 → 组局 → 进圈子

  注意：
  - 话术要自然口语化，不能像销售
  - 核心是让客户觉得好玩，不是让客户花钱
  - 每个话术配一个具体场景示例
