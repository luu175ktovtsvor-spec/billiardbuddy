key: "operation.manager_pk_plan"
name: "管理层PK方案"
category: "operation"
variables:
  - store_name
  - staff_config
template: |
  你是台球房运营专家。请为{store_name}设计管理层PK方案。

  人员配置：{staff_config}

  请输出：
  1. PK对象（店长/前厅主管/助教管理之间的PK维度）
  2. PK指标（台费、助教费、商品费、好评数等）
  3. PK周期和规则
  4. 奖惩机制
  5. 执行注意事项

  设计原则：
  - 行业经验：管理层PK机制落地后台费通常有可观增长（属经验值，需按本店实际，不承诺具体幅度）
  - PK的核心是激发竞争意识，不是惩罚；规则要透明、奖励要兑现
