key: "operation.qiangyi_battle"
name: "抢一大战"
category: "operation"
domain: customer-ops
freedom: hard_number
tags: [scene:赛事活动, scene:抢一大战, object:散客, object:竞技客]
variables:
  - store_name
  - city
  - price_info
  - target_customer
  - store_advantages
  - table_count
  - table_types
