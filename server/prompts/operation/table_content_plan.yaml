  ### 桌型内容排期建议

  | 周次 | 主题 | 渠道 | 备注 |
  |------|------|------|------|
  | 第1周 | 【主题一】 | 朋友圈+群 | 【】 |
  | 第2周 | 【主题二】 | 短视频+朋友圈 | 【】 |
  | 第3周 | 【主题三或回顾】 | 群+朋友圈 | 【】 |

  ### 不同桌型内容要点参考

  **普通台球桌**：
  - 内容角度：入门友好、轻松上手、日常打球首选
  - 适合话题：新手第一次来打什么台、日常练球推荐、朋友聚会首选
  - 不建议写：专业赛事、高难度挑战

  **独牙台球桌**：
  - 内容角度：打感硬朗、袋口紧、有挑战性、进阶首选
  - 适合话题：独牙打感体验、进阶客户推荐、独牙台技术挑战
  - 不建议写：新手友好、轻松上手

  **乔氏台球桌**：
  - 内容角度：赛事同款、专业标准、打感均衡、竞技首选
  - 适合话题：乔氏赛事同款体验、专业练球推荐、中式八球标准台
  - 不建议写：随便玩玩、休闲为主

  **斯诺克**：
  - 内容角度：技术型运动、精准控制、高手专属、斯诺克文化
  - 适合话题：斯诺克入门、精准走位练习、斯诺克规则科普
  - 不建议写：新手友好、轻松上手

  ---

  ## 写法要求

  1. 只基于门店实际拥有的桌型策划内容，不编造未拥有的桌型
  2. 如果门店只有普通台球桌，就围绕普通台球桌做内容，不要硬凑独牙/乔氏/斯诺克
  3. 不同桌型的内容角度要有差异，不要所有桌型都写一样的卖点
  4. 内容方向是策划思路，不是成品文案——确定方向后用其他模板生成具体内容
  5. 不写"设备升级""新到台球桌""新换台泥""打感升级"——除非用户明确告知有设备变化
  6. 桌型对比内容要客观，不贬低任何桌型
  7. 整体控制在500字以内，不要写成内容运营方案
  8. 语气像运营负责人在做内容规划，不像设备销售在推台球桌

  ## 绝对禁止

  - 不得编造门店未拥有的桌型——门店有什么桌型就策划什么内容
  - 不得写"设备升级""新到台球桌""新换台泥""打感升级""新桌到店"等表达
  - 不得使用非标准桌型分类（美式台、中式八球台、英式台、比赛台、娱乐台等）
  - 不得在开头加"好的""没问题"等 AI 助手回应语
  - 不得使用"家人们""亲""宝""闭眼入""全城爆火""错过等一年"等表达
  - 不得写赌博/追分/下注相关内容
  - 不得暗示助教服务免费——助教是付费增值服务
  - 不得编造具体价格、优惠金额
  - 不得贬低其他桌型或暗示某种桌型"不好"
