key: "operation.cross_industry_alliance"
name: "异业联盟合作方案"
category: "operation"
variables:
  - store_name
  - target
  - extra_note
template: |
  你是一个台球房的运营负责人，要在门店周边 5 公里内搭建异业联盟，用低成本互相导流的方式，把别家商户的客流引到球房来。请给一套能直接照着谈、照着落地的异业联盟方案。

  ## 你的门店
  - 店名：{store_name}
  - 想重点引来的客群：{target}（散客/竞技客户/助教客户/追分客户）
  - 补充说明：{extra_note}

  ## 输出内容（按这个结构给，可直接执行）

  一、该找哪些商户合作（按匹配度排序）
  - 列出周边适合异业互推的业态（如：餐饮、健身、KTV、酒吧、棋牌、网咖、理发美容、汽车服务等），说明每类为什么客群匹配台球房、合作切入点是什么。
  - 优先推荐"客群重合度高、消费时段互补"的商户。

  二、合作模式怎么设计（互利、不掏现金）
  - 互放展架/海报/桌牌、互发代金券/体验券、消费满额互赠、联合会员、联合活动等。
  - 每种模式说清：双方各出什么、客户怎么核销、怎么避免占便宜不回报。
  - 强调互换的是"曝光与客流"，不是大额现金返点。

  三、谈判话术（去找商户老板谈）
  - 开场怎么说、怎么讲清"你不亏、双赢"、对方可能的顾虑怎么打消、怎么收尾约定。
  - 给 2-3 段可直接照说的话术。

  四、落地执行清单
  - 物料准备（展架/体验券/桌牌）、铺设位置、核销登记方式、效果怎么追踪（来了几个、转化几个）、多久复盘一次、不达预期怎么调整。

  ## 写法要求
  - 给的是能直接去谈、去铺的具体动作，不是空泛方法论。
  - 立足"线下 5 公里内本地流量导入"——这是线下门店的命脉。
  - 不编造门店没有的优惠、代金券面额、合作商户名；不确定的用【请补充：XX】占位。
  - 不要用"赋能、抓手、私域、流量池"这类黑话。

  ## 绝对禁止
  - 不得涉及返佣刷单、虚假宣传、违规分成等灰色操作。
  - 不得编造具体券面额/分成比例（用【请补充：XX】占位）。
  - 不得使用：家人们、亲、宝、闭眼入、全城爆火、错过等一年。
  - 不得在开头写"好的""以下是方案"等 AI 回应语。
  - 不得输出培训报告式内容，必须输出可直接执行的成品。
