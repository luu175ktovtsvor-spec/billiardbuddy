key: "operation.vip_maintenance"
name: "大客户维护模板"
category: "operation"
variables:
  - store_name
  - city
  - tone
  - target
  - extra_note
template: |
  你是{store_name}（位于{city}）的运营专家，专门负责大客户（VIP/高价值会员）维护工作。

  ## 任务
  生成大客户维护话术，涵盖生日关怀、节日赠礼、VIP专属活动邀约、流失预警挽回、老带新激励等场景。

  ## 核心原则
  - 让客户觉得"被记住"比"被推销"更重要
  - 话术风格：{tone}，温暖而不谄媚，专业而有温度，体现"人情世故"感
  - 私信话术必须个性化，不能有模板感

  ## 目标客户
  {target}

  ## 补充说明
  {extra_note}

  ## 门店定位差异
  - 社区球房：像老朋友走动，多用口语，"来了就是自己人"
  - 商业球房：体现专属感，"您的专属权益""会员优先安排"
  - 竞技球房：用竞技吸引，"赛事优先权""高手专属台位"
  - 竞技商业球房：兼顾专属感和竞技权益

  ## 客户分类策略
  - 散客中的高价值客户：转化为会员，强调"来了就是朋友"
  - 竞技客户中的高价值客户：用赛事权益维护，强调"高手专属"
  - 助教客户中的高价值客户：用助教服务权益维护，强调"技术提升+专属服务"
  - 追分客户中的高价值客户：用竞技权益维护，强调"对手匹配+赛事优先"

  ## 输出要求
  1. 生成3-5条不同场景的大客户维护话术（生日关怀、节日赠礼、活动邀约、流失挽回、老带新等）
  2. 话术要体现对客户的了解和重视
  3. 不要在开头加"好的，店长"等AI助手回应语
  4. 输出必须是可直接复制发送的成品，不要培训报告式内容

  ## 合规要求
  - 不泄露其他客户的个人信息
  - 不承诺无法兑现的优惠或服务
  - 不得使用任何暗示性或不当话术
  - 禁止大额充值赠送类文案

  请根据以上信息，生成大客户维护话术。

description: |
  大客户（VIP/高价值会员）维护话术模板，包含5个子场景。
  大客户维护的核心原则：让客户觉得"被记住"比"被推销"更重要。
  话术风格：温暖而不谄媚，专业而有温度，体现"人情世故"感。

  ## 门店定位差异（影响大客户维护风格）

  - 社区球房：大客户维护像老朋友走动，多用口语，"来了就是自己人"
  - 商业球房：大客户维护体现专属感，"您的专属权益""会员优先安排"
  - 竞技球房：大客户维护用竞技吸引，"赛事优先权""高手专属台位"
  - 竞技商业球房：兼顾专属感和竞技权益，"专属台位+赛事优先+品质服务"

  ## 客户分类策略

  - 散客中的高价值客户：转化为会员，强调"来了就是朋友"
  - 竞技客户中的高价值客户：用赛事权益维护，强调"高手专属"
  - 助教客户中的高价值客户：用助教服务权益维护，强调"技术提升+专属服务"
  - 追分客户中的高价值客户：用竞技权益维护，强调"对手匹配+赛事优先"

scenarios:
  birthday:
    name: "生日关怀"
    description: "客户生日当天的专属祝福与礼物"
    timing: "生日当天上午10:00-11:00发送（太早像闹钟，太晚像补发）"
    steps:
      - step: "私信祝福"
        script: "{customer_name}哥，生日快乐！今天是你的大日子，{store_name}全体小伙伴祝你新的一年杆杆进袋、万事顺意！🎱🎉"
      - step: "专属礼物通知"
        script: "给你准备了一份专属生日礼——{gift}，下次到店出示本消息即可领取。另外，生日当月来打球，台费享[请填写：生日优惠]优惠，这是咱们的一点心意。"
      - step: "到店邀约（可选）"
        script: "如果你今晚/周末有空，来店里打几杆放松放松，台位我提前帮你留好，你来了直接开打。"
    notes:
      - "礼物价值不需要很贵，但必须有'专属感'"
      - "不要在群里公开祝生日，私信才有温度"
      - "祝福语不能太模板化，要加上对方打球的特点或习惯"

  gift:
    name: "节日赠礼"
    description: "传统节日/门店重要节点的大客户赠礼话术"
    applicable_festivals:
      - "春节"
      - "中秋"
      - "端午"
      - "门店周年庆"
    steps:
      - step: "节前1-2天私信"
        script: "{customer_name}哥，{festival}快到了，{store_name}给你准备了一份{gift}，你啥时候方便来拿？或者我给你送到公司也行。"
      - step: "到店取礼时的体验"
        script: "哥，礼物在这，你看看。对了，正好今天有空，来打几杆呗？我帮你把最顺手的台子留好了。"
      - step: "节后回访（未到店取礼的客户）"
        script: "哥，{festival}过得咋样？你那份礼物还给你留着呢，啥时候来拿都行，不会跑的！😂"
    notes:
      - "赠礼不在价值，在心意和时机"
      - "高等级客户送定制礼物（印名字的巧克粉盒等）"
      - "一定要主动提出送货选项，体现重视"

  vip_event:
    name: "VIP专属活动邀约"
    description: "面向大客户的专属活动、体验优先权等话术"
    steps:
      - step: "活动邀约私信"
        script: "{customer_name}哥，跟你分享个好消息。{store_name}下周六办了个{event_name}，名额有限只邀请VIP会员。活动亮点：{highlights}。你肯定感兴趣，我第一时间通知你，要不要我帮你留个名额？"
      - step: "确认参加后"
        script: "已帮你预留好名额！活动时间{time}，地点{location}。当天来就行，不用带任何东西，人到了就行。"
      - step: "活动前一天提醒"
        script: "哥，明天就是{event_name}啦！别忘了，{time}见。台位和{special_arrangement}都给你安排好了，来了直接上手。"
    notes:
      - "强调'只邀请VIP''名额有限'制造专属感"
      - "话术中体现'我第一时间通知你'，让客户觉得被重视"
      - "活动后跟进感受，收集反馈"

  anti_churn:
    name: "流失预警挽回"
    description: "对超过15天未到店的大客户进行流失预警挽回"
    trigger: "大客户超过15天未到店"
    steps:
      - step: "第15天轻触"
        script: "{customer_name}哥，好久不见！最近是不是太忙了？注意身体啊。{store_name}的球都'想'你了，你上次打的那张台子我还经常帮你看着呢，有空就来甩两杆🎱"
      - step: "第25天价值传递"
        script: "哥，最近{store_name}上了些新东西：{new_items}。你肯定感兴趣，啥时候来体验体验？我帮你安排。"
      - step: "第40天真诚关怀"
        script: "{customer_name}哥，快一个月没见你了。不知道是不是我们哪里做得不好让你不想来了？如果是的话，你直说，我改。你的意见对我们真的很重要。不管怎样，注意身体，有空就来坐坐，不打球也行，喝杯茶聊聊。"
    notes:
      - "挽回的核心不是推销，是让客户感受到'被在乎'"
      - "第40天的消息一定要真诚，不能用模板感"
      - "如果客户明确表示不再来了，不要纠缠，礼貌告别"
      - "千万不要群发，必须私信，且内容要有个性化"

  referral:
    name: "老带新激励"
    description: "激励大客户推荐朋友到店的话术"
    steps:
      - step: "自然引入（不要硬推）"
        script: "哥，上次你跟{friend_name}一起来打球，我看你们配合默契啊。他要是也常来，你们以后约球就方便了。你要是有朋友也爱打球，介绍来{store_name}，他享[请填写：朋友权益]，你也得[请填写：推荐人权益]，双赢！"
      - step: "朋友到店后反馈"
        script: "哥，{friend_name}今天来了，人不错！我给他安排了{arrangement}，他打得很开心。你的[请填写：推荐人权益]已经到账了，下次来直接用。"
    notes:
      - "老带新必须让双方都得利，不能只奖励一方"
      - "推荐的话术要自然，在聊天中带出，不要刻意推销"
      - "朋友到店后必须第一时间反馈给推荐人，形成闭环"
      - "绝对不能在客户面前暴露'我在做老带新活动'的意图"

compliance_notes:
  - "不泄露其他客户的个人信息"
  - "不承诺无法兑现的优惠或服务"
  - "私信话术必须由店长或指定人员审核后使用"
  - "不得使用任何暗示性或不当话术"
  - "不得编造具体优惠金额（用[请填写：XXX]占位）"
  - "禁止大额充值赠送类文案（如'充5000送2000'等大比例充值赠送）"
  - "不得在输出开头加'好的，店长'等AI助手回应语"
  - "输出必须是可直接复制发送的成品，不要培训报告式内容"