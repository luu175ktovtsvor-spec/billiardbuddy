key: "operation.short_video"
name: "短视频文案模板"
category: "operation"
# provenance：内容两型决策框架的运营逻辑对齐行业真实运营逻辑"流量型/获客型"二元硬分类。
# 此字段仅为元信息溯源，不进入 template/name，不注入 prompt（避免被护栏判为来源泄漏）。
provenance:
  framework: "内容两型决策框架（引流型 vs 获客型）"
  source_layer: "行业一线运营方法论（行业真实运营逻辑 内容二元分类）"
  note: "PPT 原件中真实出现的平台/交友软件/器材名照实保留；来源层级仅作元信息，禁止写进 template/name"
variables:
  - store_name
  - city
  - video_type
  - platform
  - tone
  - extra_note
description: |
  短视频文案生成模板，用于抖音/视频号等平台的台球房短视频内容创作。
  支持老板认知、行业趋势、门店引流、助教展示、活动宣传等多种视频类型。
  内含平台风格差异、话题标签策略、合规红线等内容。

video_types:
  - key: "boss_insight"
    name: "老板认知类"
    description: "面向台球房老板的运营认知、管理理念、行业洞察类短视频"
    hook_formula: "前三秒必须用反常识或质疑式开场，例如：'你花20万装修，却舍不得花2万培训？'"
    structure: "前三秒钩子 → 道理/故事 → 金句收尾"
    style: "犀利、直接、有冲击力"
  - key: "industry_trend"
    name: "行业趋势类"
    description: "台球行业政策、市场变化、趋势分析类短视频"
    hook_formula: "用政策/数据开场制造紧迫感，例如：'2026年，台球行业要变天了'"
    structure: "政策/数据 → 解读 → 给出方向"
    style: "沉稳、专业、有前瞻性"
  - key: "store_promo"
    name: "门店引流类"
    description: "门店开业、活动、环境展示等引流短视频"
    hook_formula: "视觉冲击+价格锚点，例如：'50张球台50名助教，新人9.9元体验一小时！'（禁用「免费畅打」等无底线让利话术）"
    structure: "亮点展示 → 价格/优惠 → 引导到店"
    style: "热情、活力、有吸引力"
  - key: "assistant_show"
    name: "助教展示类"
    description: "助教服务、球技、日常等展示短视频"
    publish_target_note: "分两版按发布场景选：①【对外公开发布版】发抖音/小红书等公域平台时走合规口径——少用'陪'字、岗位用'助理教练/台球指导'、强调技术指导与规则讲解，避免被平台判涉黄；②【内部约客/私域版】发微信群、朋友圈、私聊约客时走真实卖点——助教颜值、形象、气质、情绪价值、陪打、暧昧感、到店可约照实写，这是助教真实商业价值。只守两条真实底线：不编造（姓名/年龄/价格/照片）、助教是付费陪练不写成免费、不营销实际性交易。"
    style: "对外公开版专业正能量技能优先；内部约客版突出颜值/形象/情绪价值/陪打卖点"
  - key: "activity_promo"
    name: "活动宣传类"
    description: "赛事、挑战赛、会员活动等宣传短视频"
    hook_formula: "奖励锚点+紧迫感，例如：'冠军2000现金+奖杯！本周六报名截止'"
    structure: "活动亮点 → 参与方式 → 时间地点"
    style: "热血、紧迫、号召感"

platform_differences:
  douyin:
    name: "抖音"
    characteristics:
      - "强节奏、快切换、前三秒必钩"
      - "话术密度高，5秒内必须给信息增量"
      - "音乐配合节奏感强"
      - "评论区互动是核心转化入口"
    caption_style: "短、直、带话题标签"
    typical_length: "15-60秒"
  weixin_video:
    name: "视频号"
    characteristics:
      - "节奏相对舒缓，可以讲故事"
      - "信任感优先，专业度其次"
      - "社交推荐权重高，朋友圈转发是关键"
      - "粉丝粘性强，适合深度内容"
    caption_style: "长文案可带，段落式描述"
    typical_length: "30-120秒"

hook_five_senses:
  name: "五感钩子公式（前三秒选一个感官撬开观众）"
  description: "短视频前三秒留人的底层公式——从下面五种'感官触点'里挑一个做钩子，让观众刷到就停。一条视频抓准一个点就够，别贪多。"
  hooks:
    - key: "pain"
      name: "痛点"
      meaning: "戳观众正在烦的事，让他觉得'这说的就是我'"
      example_angle: "针对老板：'装修砸20万，台子天天空着没人打？'；针对球友：'约不到搭子、技术卡半年上不去？'"
    - key: "tear"
      name: "泪点"
      meaning: "戳情绪、戳共鸣，让人有点动容或代入"
      example_angle: "草根逆袭、坚持练球多年终于赢一次、老球友多年情谊、开店的辛酸——真实有温度的故事"
    - key: "laugh"
      name: "笑点"
      meaning: "用反差、糗事、整活把人逗乐，乐了就愿意看完、愿意转"
      example_angle: "菜鸟离谱失误、助教被客户'教做人'、店里的搞笑名场面、自黑式整活"
    - key: "pee"
      name: "尿点"
      meaning: "极致爽感 / 强刺激的高潮瞬间，让人爽到忍不住看完和分享（'憋着尿也要看完'）"
      example_angle: "单杆清台、超长解球、神级走位、追分翻盘的高光一击，配紧张音乐和慢放"
    - key: "incongruity"
      name: "不协调"
      meaning: "制造意料之外的反差感，打破预期、勾起好奇'这是啥情况'"
      example_angle: "西装大叔打出绝世一杆、看着像新手的人疯狂连续清台、'最贵的台子最便宜的价'式反差"
  usage: "前三秒钩子从这五感里挑一个明确切入，正文再展开。痛点/尿点最适合引流和涨粉，泪点/笑点适合做人设和涨黏性。"

