key: "operation.short_video"
name: "短视频文案模板"
category: "operation"
variables:
  - store_name
  - city
  - video_type
  - platform
  - tone
  - extra_note
description: |
  短视频文案生成模板，用于抖音/视频号等平台的台球房短视频内容创作。
  支持老板认知、行业趋势、门店引流、助教展示、活动宣传等多种视频类型。
  内含平台风格差异、话题标签策略、合规红线等内容。

video_types:
  - key: "boss_insight"
    name: "老板认知类"
    description: "面向台球房老板的运营认知、管理理念、行业洞察类短视频"
    hook_formula: "前三秒必须用反常识或质疑式开场，例如：'你花20万装修，却舍不得花2万培训？'"
    structure: "前三秒钩子 → 道理/故事 → 金句收尾"
    style: "犀利、直接、有冲击力"
  - key: "industry_trend"
    name: "行业趋势类"
    description: "台球行业政策、市场变化、趋势分析类短视频"
    hook_formula: "用政策/数据开场制造紧迫感，例如：'2026年，台球行业要变天了'"
    structure: "政策/数据 → 解读 → 给出方向"
    style: "沉稳、专业、有前瞻性"
  - key: "store_promo"
    name: "门店引流类"
    description: "门店开业、活动、环境展示等引流短视频"
    hook_formula: "视觉冲击+价格锚点，例如：'50张球台50名助教，新人9.9元体验一小时！'（禁用「免费畅打」等无底线让利话术）"
    structure: "亮点展示 → 价格/优惠 → 引导到店"
    style: "热情、活力、有吸引力"
  - key: "assistant_show"
    name: "助教展示类"
    description: "助教服务、球技、日常等展示短视频"
    compliance_note: "严禁出现'陪'字及相关联想词，岗位描述必须合规：使用'助理教练'而非'助教'/'陪练'；描述为'提供技术指导和规则讲解'而非'陪客户打球'"
    style: "专业、正能量、技能展示优先"
  - key: "activity_promo"
    name: "活动宣传类"
    description: "赛事、挑战赛、会员活动等宣传短视频"
    hook_formula: "奖励锚点+紧迫感，例如：'冠军2000现金+奖杯！本周六报名截止'"
    structure: "活动亮点 → 参与方式 → 时间地点"
    style: "热血、紧迫、号召感"

platform_differences:
  douyin:
    name: "抖音"
    characteristics:
      - "强节奏、快切换、前三秒必钩"
      - "话术密度高，5秒内必须给信息增量"
      - "音乐配合节奏感强"
      - "评论区互动是核心转化入口"
    caption_style: "短、直、带话题标签"
    typical_length: "15-60秒"
  weixin_video:
    name: "视频号"
    characteristics:
      - "节奏相对舒缓，可以讲故事"
      - "信任感优先，专业度其次"
      - "社交推荐权重高，朋友圈转发是关键"
      - "粉丝粘性强，适合深度内容"
    caption_style: "长文案可带，段落式描述"
    typical_length: "30-120秒"

hashtag_strategy:
  douyin:
    base_tags:
      - "#台球"
      - "#台球房"
      - "#台球俱乐部"
    city_tags:
      - "#{city}台球"
      - "#{city}探店"
      - "#{city}休闲娱乐"
    content_tags:
      - "#台球教学"
      - "#台球助教"
      - "#台球比赛"
      - "#台球规则"
    trending_strategy: "关注抖音热榜，蹭相关热点话题"
  weixin_video:
    base_tags:
      - "#台球"
      - "#台球房"
      - "#台球俱乐部"
    city_tags:
      - "#{city}台球"
    content_tags:
      - "#台球教学"
      - "#台球比赛"

compliance_redlines:
  - rule: "严禁使用'陪'字及变体"
    details: "包括'陪打球'、'陪练'、'陪伴客户'、'陪聊'等，平台会自动判定为涉黄高风险"
  - rule: "严禁暗示性描述"
    details: "不能写'性格开朗会聊天能和客户打成一片'，会被识别为'陪聊'"
  - rule: "严禁虚假高薪"
    details: "不要写'月薪2万-5万'等夸张薪资，会被认为只有'陪'才能达到"
  - rule: "严禁索要与工作无关的个人信息"
    details: "不问外貌、身材、生活照、身高体重；不提情商、酒量"
  - rule: "严禁涉赌内容"
    details: "不出现赌球、追分等暗示赌博的内容"
  - rule: "严禁未成年人相关违规"
    details: "不出现未成年人打球画面、不向未成年人推销烟酒"

template: |
  你是一个台球房短视频文案专家，为{store_name}生成短视频文案。

  视频类型：{video_type}
  发布平台：{platform}
  语气风格：{tone}
  门店名称：{store_name}
  所在城市：{city}
  附加说明：{extra_note}

  ## 门店定位差异（影响视频内容重点和语气）

  - 社区球房：视频接地气亲切，展示日常氛围、老客互动、社区生活
  - 商业球房：视频体现品质和专业，展示设备、环境、服务细节
  - 竞技球房：视频突出竞技氛围，展示赛事、高手过招、技术教学
  - 竞技商业球房：视频兼顾品质和竞技，展示"专业+舒适"双卖点

  ## 客户分类策略（影响视频目标受众）

  - 散客：视频降低来店门槛，强调轻松氛围和社交体验
  - 竞技客户：视频突出赛事和对抗，强调对手水平和竞技氛围
  - 助教客户：视频围绕"专业陪练+技术指导+情绪价值"，展示技术教学
  - 追分客户：视频强调"有搭子、有对手、有氛围"，展示轻竞技社交

  请按以下结构生成：

  1. 【前三秒钩子】—— 用反常识、质疑、数据或视觉冲击开场，5秒内必须留住观众
  2. 【正文】—— 20-40秒的核心内容，每5秒给一个信息增量
  3. 【金句收尾】—— 一句话总结，让观众记住
  4. 【话题标签】—— 选择3-5个相关话题标签
  5. 【评论区话术】—— 2-3条评论区互动回复模板

  合规要求：
  - 不使用"陪"字及变体
  - 不暗示任何涉黄涉赌内容
  - 岗位描述使用合规术语（助理教练、台球指导员）
  - 薪资描述合理客观
  - 不编造具体价格、优惠金额、奖金数额