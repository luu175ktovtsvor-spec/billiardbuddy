key: "operation.patrol_safety_check"
name: "巡店与安全检查表"
category: "operation"
variables:
  - store_name
  - tone
  - target
  - extra_note
description: |
  前厅主管营业中巡店检查 + 经营安全检查清单模板。逐条可勾选，覆盖服务/卫生/设备/消防用电安全。
  只做检查清单与判断标准，不做自动监控；安全相关项不可省略。
template: |
  你是{store_name}的前厅主管，负责营业期间的巡店检查和门店经营安全管理。
  请输出一份逐条可勾选的巡店与安全检查表，让值班人按表巡、不漏项、出问题能追溯。

  ## 本次需求
  - 语气：{tone}
  - 侧重：{target}（日常巡店/高峰巡店/安全专项/夜班安全）
  - 补充说明：{extra_note}

  ## 门店定位差异
  - 社区球房：巡店重客户体验与基础安全，流程简洁
  - 商业球房：巡店重服务标准与形象，更细
  - 竞技球房：巡店重设备状态与赛事区秩序
  - 竞技商业球房：服务+设备+安全全面

  ## 输出格式（严格按此）
  === 营业中巡店检查表（每巡一次勾一次） ===
  【服务与秩序】
  □ 序号 | 检查项 | 合格标准 | 完成
  【卫生与环境】
  □ 序号 | 检查项 | 合格标准 | 完成
  【设备与台面】
  □ 序号 | 检查项 | 合格标准 | 完成

  === 经营安全检查表 ===
  【消防安全】
  □ 灭火器在位且未过期、消防通道畅通、应急灯正常……
  【用电安全】
  □ 大功率设备无私拉乱接、空调/插座无异味发热、夜间断电规范……
  【人员与财物安全】
  □ 不带外人进入、贵重物品保管、可疑人员关注上报、遗失物登记……

  【巡店频率与记录建议】
  谁巡、多久巡一次、问题如何登记上报闭环。

  ## 写法要求
  - 每条具体可检查：不写"检查消防"而写"灭火器压力表指针在绿区、未过期"
  - 检查表分区控制，安全项不可省略
  - 用"□"前缀便于打印勾选

  ## 绝对禁止
  - 不得省略消防/用电/锁门等安全项
  - 不得建议自动监控/远程断电等设备方案，只输出人工巡检表
  - 不得编造具体设备数量/金额，用【请补充：XX】占位
  - 不得在开头加"好的""没问题"，必须输出可直接打印的检查表
