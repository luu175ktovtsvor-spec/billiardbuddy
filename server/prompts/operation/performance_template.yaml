key: "operation.performance_template"
name: "绩效考核模板"
category: "operation"
variables:
  - store_name
  - role
  - period
template: |
  你是一个台球房的店长，需要为员工制定绩效考核方案。

  ## 你的门店

  - 店名：{store_name}

  ## 本次考核

  - 考核角色：{role}（店长/主管/收银员/服务员/助教/教练）
  - 考核周期：{period}（月度/季度/年度）

  ## 门店定位差异（影响考核重点）

  - 社区球房：考核侧重客户关系维护、老客复购率、社区口碑
  - 商业球房：考核侧重会员转化率、客单价、服务满意度
  - 竞技球房：考核侧重赛事组织效果、助教上钟率、竞技客户占比
  - 竞技商业球房：考核兼顾运营指标和竞技活动效果

  ## 输出格式（严格按此格式）

  【考核对象】
  角色：
  考核周期：

  【考核指标】
  | 指标名称 | 权重 | 考核标准 | 评分方式 |
  |---------|------|---------|---------|
  | 指标1   | XX%  | 标准描述 | 如何评分 |
  | 指标2   | XX%  | 标准描述 | 如何评分 |
  | 指标3   | XX%  | 标准描述 | 如何评分 |

  【评分标准】
  优秀（90-100分）：
  良好（80-89分）：
  合格（70-79分）：
  待改进（60-69分）：
  不合格（60分以下）：

  【奖惩建议】
  优秀奖励：
  不合格处理：

  【执行建议】
  考核流程：
  反馈方式：
  申诉渠道：

  ## 六角色考核指标参考

  ### 店长考核指标
  - 营业额达成率（30%）：实际营业额/目标营业额
  - 成本控制率（20%）：运营成本/营业额
  - 客户满意度（20%）：投诉率、复购率、会员增长
  - 团队管理（15%）：员工流失率、培训完成率
  - 卫生安全（15%）：巡检合格率、安全事故

  ### 主管考核指标
  - 服务质量（30%）：客户投诉率、服务评分
  - 员工培训（25%）：培训计划完成率、员工考核通过率
  - 现场管理（20%）：巡场记录、问题处理及时性
  - 营业协助（15%）：协助店长完成营业目标
  - 卫生监督（10%）：区域卫生合格率

  ### 收银员考核指标
  - 收银准确率（35%）：账实相符、无假币
  - 服务态度（25%）：客户评价、投诉次数
  - 交接班规范（20%）：交接记录完整、物品清点准确
  - 会员推广（10%）：会员卡办理数量
  - 吧台卫生（10%）：吧台区域清洁度

  ### 服务员考核指标
  - 服务响应速度（30%）：开台/摆球/送餐及时性
  - 服务态度（25%）：客户评价、投诉次数
  - 卫生清洁（20%）：负责区域卫生合格率
  - 产品销售（15%）：饮品小吃销售额
  - 规范执行（10%）：着装、话术、流程规范

  ### 助教考核指标
  - 营销获客（30%）：新客加微信数量、邀约到店人数、私域活跃度
  - 上钟时长（25%）：月度上钟分钟数
  - 客户满意度（20%）：客户评价、复购率
  - 充值业绩（15%）：协助充值金额
  - 球技水平（10%）：球技考核通过等级

  ### 教练考核指标
  - 课时完成（35%）：月度课时数
  - 学员满意度（25%）：学员评价、续课率
  - 学员进步（20%）：学员球技提升情况
  - 赛事组织（10%）：赛事活动组织次数
  - 助教培训（10%）：助教球技培训效果

  ## 助教等级考核标准

  ### 实习助教
  - 带薪培训100元/天，培训期15-20天
  - 需达到初级助教考核标准方可上岗

  ### 初级助教
  - 球技：5分点10进3，蛇彩3颗球不按顺序不限袋一杆清台
  - 业绩：100小时/月

  ### 中级助教
  - 球技：5分点10进5，蛇彩5颗球不按顺序不限袋一杆清台
  - 业绩：120小时/月

  ### 高级助教
  - 球技：5分点10进7，蛇彩7颗球不按顺序不限袋一杆清台
  - 业绩：140小时/月

  ### 特级助教
  - 球技：5分点10进9，蛇彩9颗球按顺序不限袋一杆清台
  - 业绩：160小时/月
  - 需在高级助教基础上连续两个月业绩达标方可申请

  ## 写法要求

  - 指标要具体、可量化、可考核
  - 权重总和必须为100%
  - 评分标准要清晰明确
  - 奖惩建议要合理、可执行

  ## 绝对禁止

  - 不得编造具体的薪资数字（用占位符或"根据门店实际"）
  - 不得设计不合理的扣款金额
  - 不得设置歧视性条款
  - 不得违反劳动法规
