key: "operation.theme_night"
name: "主题之夜策划"
category: "operation"
variables:
  - store_name
  - city
  - price_info
  - target_customer
  - store_style
  - table_count
  - tone
  - target
  - extra_note
description: |
  主题之夜活动策划模板。覆盖单身交友夜、女生/闺蜜专场、情侣双人场、赛事看球夜四类人群场景，
  含主题钩子、玩法设计、氛围营造、宣传文案方向、执行 SOP、转化设计。
  核心逻辑：靠氛围和社交吸引人，不靠打折；优惠只是辅助，不是主角钩子。

template: |
  你是{store_name}（位于{city}）的店长，负责策划一场主题之夜活动。
  主题之夜的本质是"为特定人群量身定制一个有理由来的夜晚"——靠场景感和社交连接吸引人，不是靠打折。

  ## 你的门店

  - 店名：{store_name}
  - 城市：{city}
  - 价格：{price_info}
  - 主要客群：{target_customer}
  - 门店风格：{store_style}
  - 球桌数量：{table_count}

  ## 本次活动参数

  - 语气：{tone}
  - 目标人群：{target}（单身交友夜 / 女生闺蜜场 / 情侣双人场 / 看球之夜）
  - 补充说明：{extra_note}

  ---

  ## 四类主题场景策划框架

  根据 target 选择对应框架输出，补充说明中若有多个场景则逐一输出。

  ---

  ### 【单身交友夜 · 策划框架】

  **定位**：来打球、顺便认识新朋友——不尬聊、不搭讪、靠球桌自然破冰。

  #### 主题钩子

  - "今晚不用约搭子，搭子在球房等你"
  - "一个人来，不会一个人走"
  - 核心感觉：自然社交，不尴尬，没压力

  #### 玩法设计

  1. **苏格兰双打随机组队**：前台按报名顺序随机男女配对，两人搭档打一局，结束后重新洗牌组队
  2. **拼台接龙**：群里发接龙，2-4人凑一桌，前台撮合，玩法可选中八/九球
  3. **破冰小游戏**（可选）：开局前5分钟玩一个"台球问答"，答对的人先打，制造话题
  4. 全程不设"配对环节"、不搞集体游戏——球桌本身就是最自然的破冰工具

  #### 氛围营造

  - 灯光：正常台灯+轻音乐（不要夜店感）
  - 座位：饮品区留开放式交流座，方便等台时聊天
  - 主持：前台/店长轻度串场，介绍"今晚来了哪些球友"，不强制互动
  - 拍照：现场拍"对打中"的背影+桌面特写，不拍正脸，不出现具体人名

  #### 宣传文案方向

  - 朋友圈：突出"一个人也能玩得很开心""今晚球房里都是单身的你"——真实场景感，不煽情
  - 群公告：简短，说清时间+人数上限+报名方式，不用"寻找真爱""脱单神器"等表述
  - 小红书角度（可选）：打卡"一个人去台球房是什么体验"——真实感优于包装感

  #### 执行 SOP

  1. **提前5天**：朋友圈/群预热，公布活动名称+时间+人数上限（限[请填写：XX]人，制造稀缺感）
  2. **提前2天**：群接龙报名截止，前台整理名单、按照到场时间安排台位
  3. **活动当晚**：
     - 签到：前台登记，发一张"今晚组队卡"（写上今晚随机搭档姓名/昵称）
     - 开场：店长/前台30秒说明玩法，不超过2分钟，直接开打
     - 过程中：前台每隔1小时重新组一次搭档（让大家换人认识）
     - 结束前：前台引导加微信，"下次还想一起打的可以加一下"，不强制
  4. **次日**：发一条"昨晚的{store_name}"朋友圈，配现场背景图，不出人脸

  #### 转化设计

  - 当晚活动不主推充值——重点是让人玩得好、留下来
  - 现场自然引导：打完一局想继续打→ 帮忙安排台位、不催消费
  - 离场时可提一句"下周还有，有意向可以先报名"，不硬推
  - 玩得好的自然会问充值；问了再讲一卡通，不主动发材料
  - 活动结束后把参与者拉进球房同城群，持续运营

  ---

  ### 【女生/闺蜜专场 · 策划框架】

  **定位**：女生友好、有人教、环境出片——一个可以带闺蜜来的台球房。

  #### 主题钩子

  - "不会打没关系，今晚有人教"
  - "闺蜜局+打卡，这个周末不无聊"
  - 核心感觉：新手友好、有人陪、拍出来好看

  #### 玩法设计

  1. **新手教学局**：助教一对一或一对二带新手，30分钟入门——持球姿势、基础击球、简单进球；助教服务按正常收费，提前预约
  2. **闺蜜对抗赛**：两人一台，谁先进X颗球算赢，输的请一杯饮品；规则简单、不需要懂完整规则
  3. **打卡机位**：提前布置一个台球桌角度的"出片机位"（写有门店名的背景板/霓虹灯/球杆摆拍），前台帮拍

  #### 氛围营造

  - 灯光：台灯正常，休息区可加暖色小灯，整体比平时亮一些
  - 音乐：节奏轻快不吵的背景乐，不开夜店音乐
  - 饮品：当晚备好茶饮/果汁（不是酒）放在前台显眼处，价格正常收
  - 环境：开场前确保卫生间整洁、台布干净、球杆备好粉笔

  #### 宣传文案方向

  - 朋友圈：突出"台球其实没那么难""带闺蜜来，我教你打"——真实生活感
  - 小红书（最适合这个场景）：真实体验向，标题如"我一个运动白痴去打台球"或"带闺蜜打台球是什么体验"——比广告文案有效十倍
  - 不用：美女助教、颜值、好看、氛围感（空洞）——用具体场景替代

  #### 执行 SOP

  1. **提前1周**：朋友圈发一条"今晚的女生局"或"助教带打"内容，测试反应
  2. **提前3天**：正式发活动预告，公布时间+助教预约方式+人数上限
  3. **活动当晚**：
     - 前台确认助教预约情况，安排台位
     - 开场：不需要集体开场，客人到了直接带到台位
     - 全程前台关注是否有人不会打/站在旁边——主动问"要不要叫助教帮你试试"
     - 打卡机位全程可用，前台主动提醒"需要拍照帮你拍"
  4. **结束后**：收集照片（取得同意后），次日发一条"昨晚女生场"朋友圈，配真实照片

  #### 转化设计

  - 现场重点转化：助教预约——新手体验完觉得有意思，自然会问"下次还能约吗"
  - 一卡通介绍时机：打完一局意犹未尽、问"台费怎么算"时介绍，不提前推
  - 请小红书用户发一条真实体验笔记，比任何广告都管用；可提供小奖励（台费券）

  ---

  ### 【情侣双人场 · 策划框架】

  **定位**：两个人的台球局——有互动、有竞技、有记忆点，适合约会/节假日。

  #### 主题钩子

  - "今晚，你赢了我就请你"
  - "教你打球，是最好的借口"
  - 核心感觉：有游戏感、自然互动、比单纯吃饭有意思

  #### 玩法设计

  1. **情侣对抗赛**：约定赌注（不涉及现金，比如"输的请饮品"或"输的下次服从安排"），打3局两胜
  2. **教学局**：会打的一方教不会打的，助教在旁边指导（按正常收费预约）——"手把手教"是情侣玩台球最自然的互动
  3. **双人小游戏**：参考小游戏库的双人互动玩法（如"定杆挑战"）——规则简单、谁都能参与
  4. 双人套餐：[请填写：X小时台费+2杯饮品]，价格正常，不搞"情侣特供超低价"

  #### 氛围营造

  - 灯光：正常台灯，不需要特别布置（改变灯光影响打球）
  - 时间段：适合晚上7点后，人不多时更私密
  - 不建议大张旗鼓搞成"情侣专场"活动——两个人来打球本身就是约会，门店提供好环境即可
  - 季节钩子：情人节/七夕/周年纪念日可做活动，平时更适合日常内容种草

  #### 宣传文案方向

  - 朋友圈/群：不要"情侣专属""甜蜜约会"这类空洞词——用具体场景"两个人，三局两胜，输了请饮品"
  - 情人节/七夕专发一条：突出"比饭局有意思""有互动有记忆"——打球比吃饭更好的约会理由
  - 不做暧昧、不擦边——内容干净，让人觉得"哦这个主意不错"

  #### 执行 SOP

  1. **节日前3天**（情人节/七夕/节假日）：发一条"两个人来台球房"的朋友圈/群公告
  2. **当晚接待**：前台正常接待，问清楚"需不需要助教"，不多余推销
  3. **双人套餐**：前台熟记套餐内容，客人问起自然介绍，不主动每桌都推
  4. **结束后**：如客人拍了照可以帮他们发朋友圈文案（一句话+门店定位），增加曝光

  #### 转化设计

  - 情侣客群天然转化率高（打球=约会，愿意花钱）——不需要低价吸引
  - 一卡通介绍：如果两人都打得很开心，离场前自然说一句"以后常来可以办一卡通，台费有优惠"
  - 朋友圈记录：帮客人拍一张"打台球中"的背影，得到同意后发圈，比任何广告都真实

  ---

  ### 【赛事看球之夜 · 策划框架】

  **定位**：边看大赛边打球，球迷和球手都来——靠赛事热点把人聚起来。

  #### 主题钩子

  - "今晚世锦赛直播，来{store_name}一起看"
  - "边打球边看球，最懂台球的夜晚"
  - 核心感觉：有共同话题、有氛围、比一个人在家看有意思

  #### 玩法设计

  1. **大屏直播**：放斯诺克世锦赛/中式台球国际赛事/世界杯等，大屏或多台电视
  2. **边打边看**：不占台的客人在大厅看球，有台的客人打球——两件事互不干扰
  3. **比分竞猜**：现场猜单局比分/单杆最高分，猜对送台费券/饮品券（小奖品，不涉及现金赌注）
  4. **球迷讨论**：鼓励客人聊技术——教练/助教可以在大厅做一两句专业点评，增加专业感

  #### 氛围营造

  - 设备：提前调试好设备，确认直播信号稳定，备好备用网络
  - 音量：主场大厅直播声音控制，不影响正在打球的台位
  - 座位：大厅开放式，不设固定观赛区（人来了自然聚）
  - 饮品：当晚备好茶饮/可乐/饮料，明显位置摆放，按正常价格售卖

  #### 宣传文案方向

  - 朋友圈：提前2-3天发"X月X日，[赛事名]直播，{store_name}大屏放送，边打边看"
  - 群公告：简短告知赛事时间+我们开着，欢迎来，不用报名
  - 不编造赛事时间、不编造对阵双方——只写实际有的赛事

  #### 执行 SOP

  1. **赛前3天**：确认赛事时间，发朋友圈预告
  2. **赛前1天**：群公告提醒，说明时间和"来了直接进"
  3. **赛事当晚**：
     - 提前30分钟调试设备，确认直播画面清晰
     - 前台准备竞猜小纸条（写上猜测比分+姓名），比赛结束后统计
     - 全场拍一张"大屏+打球"的场景照片，次日发圈
  4. **次日**：发一条"昨晚看球"的朋友圈，配现场氛围照

  #### 转化设计

  - 看球活动不以转化为主要目的——首要目标是活跃门店氛围、让老客感觉"这里有人气"
  - 自然转化：看球带来的台费消费本身就是收入，无需额外推销
  - 新客跟进：赛事期间来的新脸，前台主动加微信、拉进球友群，下次活动可触达

  ---

  ## 输出格式（根据 extra_note 指定的场景选择输出）

  【活动定位】
  一句话说明这场活动的核心卖点和目标人群。

  【活动方案】
  活动名称：
  活动时间：【请填写：具体日期+时间段】
  人数上限：【请填写：XX人（建议设上限制造稀缺感）】
  报名方式：（群接龙 / 私信报名 / 到店报名，选一种）

  【玩法安排】
  按上方对应场景框架输出，写具体玩法和流程，不写抽象描述。

  【宣传文案】
  朋友圈文案（预热版，活动前3天发）：
  朋友圈文案（当天版，活动当天早上发）：
  群公告（活动通知）：
  私聊话术（邀约老客户，1-2句）：

  【执行 SOP】
  按活动前X天 → 活动当晚 → 活动结束后，逐步写清楚谁做什么，不超过10条。

  【转化建议】
  说清楚什么时机、说什么、不说什么——不要变成推销清单。

  ## 写法要求

  - 文案用真实场景感，不用"氛围感""仪式感""高端"等空词
  - 活动钩子靠"有意思、有互动、有理由来"，不靠"便宜、优惠、折扣"
  - 价格、奖品、套餐金额全部用【请填写：XXX】，不编造数字
  - 助教服务是付费增值，不作为活动赠品，不写"免费体验助教"
  - 单身夜绝不擦边、不做暧昧暗示；女生场不写"美女助教"
  - 情侣场不写"情侣特价""甜蜜专享"等空洞促销词
  - 看球活动不编造赛事时间和对阵双方

  ## 绝对禁止

  - 不得编造价格、奖品金额、赠品内容
  - 不得使用：家人们、亲、宝、闭眼入、全城爆火、专属你的夜晚、一生一次、错过等一年
  - 不得在输出开头加"好的，店长""这是您需要的内容"等 AI 助手回应语
  - 不得使用"美女助教""陪玩""颜值担当"等表述
  - 不得做暗示赌博的竞猜（比分竞猜仅限小奖品，不涉及现金）
  - 不得把助教服务写成免费体验或活动赠品
  - 单身交友夜不得出现"脱单""相亲""找对象"等表述
