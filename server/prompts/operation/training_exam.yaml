  ## 助教培训考试试卷模板

  ### 一、填空题（每空4分，共40分）

  1. 上钟服务原则：能不让客户________就不让客户________（拿杆/收杆/架杆）。
  2. 上钟前：先理台呢，检查________是否充足、________是否在位。
  3. 上钟话术（面对生客）：先做________，再主动沟通。
  4. 挑杆服务：不要让客人自己去杆架上乱拿，助教主动挑杆并打好巧克粉。
  5. 上钟报备格式：X号上________桌。
  6. 客户备注内容：________、初次进店时间、客户类型、________。
  7. 加微信目的：约下次来提前________，把最顺手的杆和台子留好。
  8. 送客标准：必须送至________，不能在台子旁说完拜拜就走。
  9. 助教自爱原则：不引导客人去________。
  10. 超休/请假须群内________，守距离界限、不越界。

  ### 二、选择题（每题5分，共20分）

  1. 加微信的较好话术是（  ）
     A. "哥，加个微信吧，下次来找我。"
     B. "哥，下次你提前滴我，我把最顺手的杆和台子给你留着。"
     C. "哥，留个联系方式。"
     D. "哥，方便加个微信吗？"

  2. 客人击球时，助教正确做法是（  ）
     A. 看手机回消息
     B. 专注服务，不玩手机
     C. 离开台子聊天
     D. 自己练球

  3. 抢局/赞美时，助教应做到（  ）
     A. 沉默
     B. 适时赞许、人情世故、抬客自谦
     C. 纠正客人动作
     D. 跟客人比球技

  4. 客人打出好球时，助教应（  ）
     A. 不出声
     B. 及时赞许（如轻拍库边、说"好球"）
     C. 指出还能更好
     D. 自己也打一杆

  ### 三、判断题（每题2分，共10分）

  1. 助教可以在客人击球时看手机回消息。（  ）
  2. 助教可以引导客人去别的台球俱乐部。（  ）
  3. 下钟后必须送到门口，不能在台子旁说完拜拜就走。（  ）
  4. 助教超休/外出需先群内报备，守距离界限、不越界。（  ）
  5. 客户备注应记名字、初次进店时间、客户类型、球技档位。（  ）

  ### 四、简答题（共30分）

  1. 请简述上钟服务的标准动作。（10分）

  **答案要点：**
  - 能不让客户动手就不让客户动手（拿杆/收杆/架杆）
  - 自我介绍、主动沟通
  - 台面保持：理台呢、巧克粉、架杆到位
  - 适时送饮料/点烟，专注服务

  2. 请简述助教自爱与红线方向。（10分）

  **答案要点：**
  - 自爱、诚信、人情世故
  - 不引导客人去别的台球俱乐部
  - 守距离界限、不越界，不营销实际性交易

  3. 请简述客户备注（打标）应记哪些内容。（10分）

  **答案要点：**
  - 名字
  - 初次进店时间
  - 客户类型
  - 球技档位

