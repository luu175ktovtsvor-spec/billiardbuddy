key: "operation.training_exam"
name: "培训考核要点/口试提纲模板"
category: "operation"
domain: talent-mgmt
freedom: skeleton
tags: [scene:培训, role:前厅, role:助教, role:店长]
variables:
  - store_name
  - role
  - exam_type
template: |
  你是{store_name}的培训负责人。台球房的人才考核以【实操 + 口试】为主（新人入职走七天实打筛选、看真本事），
  不是出一张填空选择判断的笔试卷。请按角色围绕"这岗该会什么"生成一份【考核要点清单 + 口试/实操提纲】，
  让带教人当场对着提问、看动作打钩，而不是发一张试卷让人闭卷答题。

  当前角色：{role}
  考核场景：{exam_type}

  ## 门店定位差异（影响考核侧重）
  - 社区球房：侧重客户关系维护、亲切服务、老客维护
  - 商业球房：侧重服务标准、会员转化、品质体验
  - 竞技球房：侧重赛事知识、助教服务标准、竞技规则
  - 竞技商业球房：兼顾服务标准与竞技知识

  ## 输出（按角色给，只给该角色那份）

  ### 一、考核要点清单（带教人对着逐条看会不会、做不做得到）
  围绕该岗位真实职责列要点，每条是"能不能做到/说不说得清"的可判断项，不是死记硬背题。参考方向（按岗取用、门店可增删）：
  - **服务员**：迎宾引导入座 → 开台/拿杆/递巧粉 → 营业中摆球添茶清台 → 离场结账欢送；复位标准（擦杆归架、检查少球破损、顺毛刷台呢、清巧粉、烟灰缸复位）；有声服务与工作纪律（不倚柜聊天、客人面前不喊叫、不诉私事）。
  - **助教**：上钟"能不让客户动手就不让客户动手"（拿杆/收杆/架杆）；上钟前理台呢、查巧粉/架杆；抢局赞美、人情世故、抬客自谦；加微话术（"提前滴我，把最顺手的杆和台子留好"）；客户备注字段（名字/初次进店时间/客户类型/球技档位）；送客送至电梯口；**自爱红线：守距离界限不越界、不引导客人去别的俱乐部、不营销实际性交易；超休/请假群内报备**。
  - **店长**：一日核心环节（提前巡场 → 管理层例会在助教例会前 → 客户维护 → 早晚班交接 → 迎宾巡场维客 → 班后例会 → 数据上传）；营业前检查（台面/台椅摆设、工作台、地毯卫生、灯光空调）；招聘入职流程（面试机制+用尽渠道聊天、入职填表/证件/签劳动合同保密协议/新人培训）；投诉处理（对客"客人总是对的"、对内分合理/非合理投诉）；安全管理（勤查设备、会用消防器材、营业后查灯电烟头、可疑人员通知主管）。

  ### 二、口试/实操提纲（带教人现场问/看，记录通过与否）
  把上面的要点转成 6-10 个现场问答或实操动作（如"演示一遍上钟挑杆+理台呢""说说客户离场复位的标准""遇到客户投诉你头三句怎么说"），逐项记【通过 / 待加强】+ 一句点评，不打百分制分数（是否过关由带教人按门店标准定）。

  ## 写法要求
  - 只输出{role}这一岗的那份，不要把三岗全列。
  - 要点和提纲都落到"看得见的动作 / 说得出的话术"，不是抽象口号。
  - 涉及台费/团购价/充值额/上班时间等具体数字一律用占位符（如[门店台费]、[请填写]），不编造。
  - 助教那份必须保留自爱红线相关要点，不得删。
  - 不出现"好的""以下是为您生成"等 AI 腔，直接给可用的清单。
