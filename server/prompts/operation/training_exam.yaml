  ## 助教培训考试试卷模板

  ### 一、填空题（每空2分，共40分）

  1. 助教核心心法：客人花钱点你，买的不是你高超的球技，而是________和________。
  2. 服务宗旨：眼里有活，________，心中有账。
  3. 上钟前3分钟：必须先用刷子理台呢，检查________是否充足、________是否在位。
  4. 上钟话术（面对生客）："哥你好，我是X号助教。这张台子我刚用刷子理过，咱们店用的是________的台呢，走球非常顺。"
  5. 挑杆服务：不要让客人自己去杆架上乱拿，助教主动挑出________根重量不同的公杆，并顺手打好巧克粉。
  6. 打球中"三不问"原则：不问________、不问________、不主动纠正动作（除非客人主动请教）。
  7. 私域跟进"3-7-15法则"：第____天无痕互动，第____天器材/活动邀约，第____天沉默客户激活。
  8. 当天晚上微信备注格式：________-________-________-________。
  9. 助教红线第3条：客人不知情情况下私自________，一经发现开除。
  10. 助教红线第6条：禁止私自收取客户的________。

  ### 二、选择题（每题4分，共20分）

  1. 客人连续失误、脸色难看时，正确做法是（  ）
     A. 笑一笑缓解气氛
     B. 立刻递巧克粉，给出台阶，帮客人推责
     C. 沉默不语等客人自己调整
     D. 说"没关系，继续"

  2. 加微信的满分话术是（  ）
     A. "哥，加个微信吧，下次来找我。"
     B. "哥，下次你提前滴我，我把最顺手的杆和台子给你留着。"
     C. "哥，留个联系方式。"
     D. "哥，方便加个微信吗？"

  3. 连带推销饮料的正确话术是（  ）
     A. "哥，你要点什么喝的吗？"
     B. "哥，咱们店吧台刚调了那种很解渴的冰镇果茶，要不给你端两杯解解乏？"
     C. "哥，喝什么？"
     D. "哥，要来杯水吗？"

  4. 递水时机应该是（  ）
     A. 客人说渴了再递
     B. 打到第三局左右，客人稍微出汗或深呼吸时直接递
     C. 一上钟就递
     D. 下钟时再递

  5. 结账时未主动引导添加微信，当月扣分多少？（  ）
     A. 10分
     B. 15分
     C. 20分
     D. 30分

  ### 三、判断题（每题2分，共10分）

  1. 助教可以在客人击球时看手机回消息。（  ）
  2. 助教在客人失误时，可以帮客人把责任推给"台呢太滑"或"运气不好"。（  ）
  3. 助教收到客户打赏可以私自收下。（  ）
  4. 助教可以引导客人去别的台球俱乐部。（  ）
  5. 下钟后必须送到门口，不能在台子旁说完拜拜就走。（  ）

  ### 四、简答题（共30分）

  1. 请简述上钟前3分钟的标准动作和话术。（10分）

  **答案要点：**
  - 先用刷子理台呢，检查巧克粉、架杆是否充足
  - 面对生客第一面自我介绍并介绍台呢品质
  - 主动挑杆服务，挑出2根不同重量的公杆并打好巧克粉
  - 建立专业人设，暗捧客人球技

  2. 请简述助教红线有哪些，违反后果是什么？（10分）

  **答案要点：**
  - 拒钟、强制下钟
  - 背后勾心斗角，辱骂脏话
  - 客人不知情情况下私自挂钟扣卡
  - 不可引导客人去别的台球俱乐部
  - 禁止店内员工之间恋爱
  - 禁止私自收取客户的打赏
  - 禁止私自售卖店内的品牌器材
  - 违反红线开除处理，并取消当月工资

  3. 请简述3-7-15回访法则的具体内容和话术示例。（10分）

  **答案要点：**
  - 当天晚上：完成备注打标（姓名-香烟-饮料-打法-性格）
  - 第3天：无痕互动，走心评论客人朋友圈
  - 第7天：借用器材/活动邀约，话术示例涉及球杆皮头精修、周末活动
  - 第15天：沉默客户激活，话术示例涉及关心+请饮邀约

