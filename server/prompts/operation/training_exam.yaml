key: "operation.training_exam"
name: "培训考试试卷模板"
category: "operation"
variables:
  - store_name
  - role
  - exam_type
template: |
  你是{store_name}的培训助手。根据角色和考试类型，生成培训考试试卷。

  当前角色：{role}
  考试类型：{exam_type}

  请按以下模板生成试卷，包含填空题、选择题、判断题和简答题，附答案要点。

  ## 门店定位差异（影响考试重点）

  - 社区球房：考试侧重客户关系维护、亲切服务、老客维护
  - 商业球房：考试侧重服务标准、会员转化、品质体验
  - 竞技球房：考试侧重赛事知识、助教服务标准、竞技规则
  - 竞技商业球房：考试兼顾服务标准和竞技知识

  ---

  ## 服务员培训考试试卷模板

  ### 一、填空题（每空2分，共60分）

  1. 俱乐部普台区一小时[门店台费]元，VIP区一小时[门店VIP台费]元，包间斯诺克[门店包间价]元，棋牌包厢一小时[门店棋牌价]元。
  2. 美团和抖音新人体验[门店团购价]元，开台前需要提前出示____扫码，周五周六周日____使用。
  3. 充值[门店最低充值额]起，具体赠送金额以门店实际活动为准，不得编造。
  4. 助教上班时间________至________。
  5. 助教有____个级别，分别是____、____、____、____，费用分别是[门店助教各级别费用]。
  6. 助教每日上钟不得低于____小时，每天练球____小时，添客户微信不低于____个。
  7. 定岗站姿要求：________________________。
  8. 顾客叫摆球时应回应：__________________。
  9. 要让客户有________感、________感。

  ### 二、选择题（每题3分，共15分）

  1. 以下哪项属于"有声服务"？（  ）
     A. 微笑点头
     B. 主动打招呼说"您好"
     C. 默默递毛巾
     D. 用手势示意

  2. 客人进门后的第一反应应该是（  ）
     A. 等客人自己找台位
     B. 热情迎接并引导入座
     C. 继续做自己的事
     D. 叫主管处理

  3. 茶水添加标准是（  ）
     A. 随时加满
     B. 低于三分之一杯时及时添加
     C. 客人叫了才加
     D. 一小时加一次

  4. 烟灰缸内烟蒂不能超过（  ）根
     A. 2根
     B. 4根
     C. 6根
     D. 8根

  5. 以下哪项违反工作纪律？（  ）
     A. 主动帮客户拿杆
     B. 对讲机使用礼貌用语
     C. 倚靠柜台聊天
     D. 及时清理台面

  ### 三、判断题（每题2分，共10分）

  1. 对待客人须一视同仁，严禁向客人诉说私事。（  ）
  2. 主管可以陪客人打球喝酒。（  ）
  3. 客人永远是对的，任何时候不要忘记礼让客人。（  ）
  4. 接听电话应在电话铃响五声之内拿起听筒。（  ）
  5. 工作中无论发生任何情况，严禁在客人面前喊叫。（  ）

  ### 四、简答题（共15分）

  1. 请简要描述待客的完整工作流程。（5分）

  **答案要点：**
  - 客人进门主动迎接，引导入座
  - 帮客户开台、拿球杆、递巧克粉
  - 主动询问茶水饮料需求并下单
  - 营业中及时摆球、添茶水、清洁台面
  - 客人离场时引导结账、欢送

  2. 顾客离场后的复位标准是什么？（5分）

  **答案要点：**
  - 擦拭球杆汗渍，按标准摆放回杆架
  - 将台球放入集球器，检查少球或破损
  - 顺毛刷台呢，清理巧克粉残留
  - 擦拭库边手印和巧克粉
  - 架杆归位，茶几清洁，烟灰缸注水复位

  3. 客户投诉处理的基本原则是什么？（5分）

  **答案要点：**
  - 真诚耐心听取客人意见，不打断
  - 用和蔼语言肯定客人意见，稳定情绪
  - 任何员工都必须先道歉并表示理解
  - 接到投诉的员工必须负责到底
  - 自己处理不了的立刻通知主管

