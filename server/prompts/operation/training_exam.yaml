  ## 店长培训考试试卷模板

  ### 一、选择题（每题3分，共30分）

  1. 店长每日晨会应该包含哪些内容？（  ）
     A. 只通报营业额
     B. 传达工作要求、分配任务、激励员工、检查仪容仪表
     C. 只批评昨天的问题
     D. 随意聊天

  2. 客户投诉升级后，店长应该（  ）
     A. 等客户自己消气
     B. 立即出面，亲自处理，致歉并提供解决方案
     C. 让服务员继续处理
     D. 告诉客户公司规定

  3. 门店设备损坏后，正确的处理流程是（  ）
     A. 等工程部来修
     B. 服务员报告、主管核查、属客人损坏则当面确认赔偿、属员工违规则由责任人赔偿、领班保工程部维修
     C. 直接从员工工资扣
     D. 老板自己修

  4. 员工请假审批权限正确的是（  ）
     A. 领班最多批1天，店长最多批3天，超过3天需老板批准
     B. 任何人都可以批任何天数
     C. 只有老板可以批假
     D. 店长可以批任意天数

  5. 门店营业前检查的核心内容是（  ）
     A. 只检查卫生
     B. 台面摆设、台椅摆设、工作台、地毯卫生、环境灯光空调
     C. 只检查设备
     D. 只看一眼

  ### 二、判断题（每题2分，共10分）

  1. 店长可以不参加每日巡场。（  ）
  2. 月累计请假超过3天需老板批准。（  ）
  3. 门店每日巡查表不需要保存。（  ）
  4. 店长可以陪客人打球喝酒。（  ）
  5. 营业结束后必须检查灯、电器、开关是否关闭。（  ）

  ### 三、简答题（共60分）

  1. 请描述店长一日工作的核心环节和时间安排。（15分）

  **答案要点：**
  - 准时上班，提前巡场
  - 主持管理层例会（14:10前完成）
  - 15:00-17:00参与客户维护
  - 17:30-18:30与早晚班管理层沟通
  - 19:30-20:30参与大厅迎宾
  - 20:30后维护客户+巡查
  - 班后例会
  - 数据统计上传

  2. 请说明员工招聘和入职的完整流程。（15分）

  **答案要点：**
  - 招聘：建立面试机制、明确条件、每日用尽渠道聊天上限、介绍公司环境福利
  - 入职：填写入职表、提交身份证/学历/离职证明、签署劳动合同和保密协议、参加新员工培训

  3. 如何处理客户的合理投诉和非合理投诉？（15分）

  **答案要点：**
  - 对客标准：执行"客人总是对的"，克己自检，不争辩，道歉+解决+感谢
  - 对内标准：区分合理投诉和非合理投诉
  - 合理投诉：研究原因、制定防范措施、视情节处理责任人
  - 非合理投诉：员工已礼貌劝阻和耐心解释的，不承担个人责任

  4. 请说明门店安全管理制度的核心要点。（15分）

  **答案要点：**
  - 勤查设备防患未然
  - 熟练使用消防器材
  - 工作期间不会客，不带外人进入
  - 营业结束后检查灯、电器、烟头
  - 客人遗失物品及时追还或上交
  - 对行为不轨客人密切关注并通知主管
  - 严禁员工班后在门店逗留