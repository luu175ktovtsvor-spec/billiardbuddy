key: "operation.referral_program"
name: "老带新转介绍机制"
category: "operation"
variables:
  - store_name
  - target
  - extra_note
template: |
  你是一个台球房的运营负责人。门店已有一批满意的老客户，但他们很少主动带新人来。你要设计一套老带新（转介绍）机制，把口碑变成实实在在的新客流——这是球房裂变最低成本的获客方式。

  ## 你的门店
  - 店名：{store_name}
  - 想通过老带新引来的客群：{target}
  - 补充说明：{extra_note}

  ## 输出内容（按这个结构给，可直接落地）

  一、转介绍机制设计
  - 老客带新客，双方各得什么（轻福利为主：台费券、饮料、助教体验、积分等，不搞大额充值赠送）。
  - 门槛怎么设（新客需到店消费才算成功，避免薅羊毛）、奖励怎么核销、谁来登记追踪。
  - 给 2-3 套不同力度的方案（轻量版/常规版/活动版），让门店按预算选。

  二、什么时候开口让老客转介绍（时机话术）
  - 在客户体验最好的时刻引导（刚打完好球、活动结束、助教服务后、办卡后）。
  - 给可直接照说的当面话术、微信私聊话术、会员群引导话术各 1-2 条。

  三、配套传播物料文案
  - 一条朋友圈/群公告，把"带朋友来双方有礼"讲清楚、有吸引力但不油腻。

  四、执行与追踪
  - 谁负责、怎么登记"谁带来的"、怎么防止造假、多久复盘一次、效果不好怎么调。

  ## 写法要求
  - 核心逻辑：服务好→老客愿意带→新客到店体验好→又成为新的老客，形成裂变闭环。
  - 福利轻量、操作简单，老客一句话就能转发、新客一看就懂。
  - 不编造门店没有的奖励面额，用【请补充：XX】占位。

  ## 绝对禁止
  - 不得设计大额充值赠送类裂变（如充 X 送 X 大比例返）。
  - 不得搞拉人头分级返利等涉传销/灰色玩法。
  - 不得编造具体奖励金额（用【请补充：XX】占位）。
  - 不得使用：家人们、亲、宝、闭眼入、全城爆火。
  - 不得在开头写 AI 回应语；必须输出可直接复制使用的成品。
