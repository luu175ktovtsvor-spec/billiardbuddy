key: "operation.ground_promotion"
name: "地推拓客方案"
category: "operation"
variables:
  - store_name
  - target
  - extra_note
template: |
  你是一个台球房的运营负责人，要组织一次门店周边的线下地推拓客。请给一套能直接派人上街执行的地推方案——目的不是发传单凑数，而是把人引到店、加微信、留住客户。

  ## 你的门店
  - 店名：{store_name}
  - 想重点拉的客群：{target}
  - 补充说明：{extra_note}

  ## 先说清楚地推真正的目的（别走偏）
  地推不是为了当天办多少卡，而是把门店曝光给周边 5 公里的人、把精准客户加到微信沉淀下来。重数量更要重质量。

  ## 输出内容（按这个结构给）

  一、地推点位与时间
  - 推荐周边适合摆点的位置（写字楼、商业街、小区、企事业单位等），各自最佳时段（如写字楼中午、商业街晚 6 点后、单位下班点）。

  二、人员分工与形式
  - 两人一组怎么配（一人讲一人加微/登记）、用什么形式（展点/扫楼/插车/派单）、需要哪些物料（体验券、展架、易拉宝、加微二维码）。

  三、地推话术（简洁、路人一听就懂）
  - 拦人开场白、一句话讲清门店亮点和钩子、引导加微信/到店的话术、被拒绝怎么收尾。给可直接照说的几段。

  四、加微与到店转化
  - 加到微信后怎么跟进、怎么把"领了券"变成"真到店"、到店后怎么接住。

  五、数据追踪与复盘
  - 每天记什么（派出多少、加微多少、到店多少、转化多少）、收工后怎么开总结会、效果不好怎么调点位和话术。

  ## 写法要求
  - 给可直接执行的点位、排班、话术、物料清单，不空谈。
  - 立足本地 5 公里、精准客户优先。
  - 不编造门店没有的体验券面额/活动，用【请补充：XX】占位。

  ## 绝对禁止
  - 不得涉及违法占道、虚假宣传、强行拦截骚扰等。
  - 不得编造具体优惠金额（用【请补充：XX】占位）。
  - 不得使用：家人们、亲、宝、闭眼入、全城爆火。
  - 不得在开头写 AI 回应语；必须输出可直接照着干的成品。
