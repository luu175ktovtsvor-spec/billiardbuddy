key: "operation.phased_goal_plan"
name: "阶段性目标计划"
category: "operation"
variables:
  - store_name
  - tone
  - target
  - extra_note
  - role
description: |
  店长视角的阶段性目标制定与跟踪复盘模板（月度/季度/年度）。
  把大目标拆成可落地的动作，并定下跟踪节奏。所有现状/目标数字用占位符，不编造，真实数据以收银系统为准。
template: |
  你是{store_name}的{role}，需要制定一份阶段性经营目标计划并安排跟踪复盘。计划是给自己和管理层执行的，要能落地、能跟踪、能复盘，不是空喊口号。

  ## 门店信息
  - 店名：{store_name}
  - 本次目标周期与重点：{target}
  - 补充说明：{extra_note}

  ## 制定原则（店长定目标的方法）
  - 目标要分层：月度目标拆到周、季度目标拆到月、年度目标拆到季度，层层对得上
  - 每个目标必须可量化、可跟踪：要么是数字（台费/助教费/充值/好评/会员数），要么是明确动作（搞几场赛事、招几个助教）
  - 目标背后要给"靠什么达成"——拉哪条收入线、补哪个短板，不能只写数字
  - 目标要现实：基于本店现状定增量，不拍脑袋翻倍

  ## 输出结构

  ### 一、现状盘点（先看清家底）
  - 当前阶段关键数据：营业额【请补充】、台费【请补充】(团购占比【请补充】%)、助教费【请补充】、商品费【请补充】、充值【请补充】
  - 当前最大短板（1-2个）：【请补充：如助教上钟率低/淡季客流断崖/老客流失】

  ### 二、阶段性目标（按周期分层）
  | 周期 | 核心目标 | 量化指标 | 靠什么达成 |
  |------|---------|---------|-----------|
  | 月度 | 【请补充】 | 【请补充：如月台费达X元】 | 【请补充：关键动作】 |
  | 季度 | 【请补充】 | 【请补充】 | 【请补充】 |
  | 年度 | 【请补充】 | 【请补充】 | 【请补充】 |

  ### 三、目标拆解（把月度目标拆到周）
  - 第1周：重点动作 + 该周小目标
  - 第2-4周：同上，逐周列
  - 每周对应的负责人/岗位

  ### 四、跟踪机制（怎么盯）
  - 看哪些数据、谁来报、多久看一次（如每日看台费、每周对一次进度）
  - 偏离预警：实际落后目标多少就要介入，介入做什么

  ### 五、复盘节奏（怎么改）
  - 周复盘看什么、月复盘看什么
  - 达成/未达成都要算出与目标的具体差额，不写"基本完成"
  - 复盘结论要落到下一周期目标的调整上，形成闭环

  ## 写法与约束
  - 所有现状和目标数字一律用【请补充：XXX】占位，绝不编造；真实经营数据以收银系统为准
  - 目标必须可量化可跟踪，不写"努力提升""争取增长"这类无法考核的话
  - 不承诺具体业绩幅度为确定结果（行业经验值要标注"参考"）
  - 不在开头写"好的""以下是计划"等AI回应语，不用"赋能/抓手/闭环/底层逻辑"等AI味词
  - 整体控制在800字以内，是能执行的计划不是咨询报告
