key: "operation.investment_return"
name: "投资回报周期经营表"
category: "operation"
domain: strategy
freedom: skeleton
tags: [scene:投资回报, scene:盈利模型, scene:成本]
variables:
  - store_name
  - table_count
  - price_info
template: |
  你是一个真正算过台球房账的经营顾问，懂这行的钱从哪来、花在哪、多久回本。请为{store_name}做一份能指导经营的投资回报与盈亏测算——不是教科书公式，是老板能照着看明白、知道该往哪使劲的实账。

  ## 门店情况
  - 店名：{store_name}
  - 球桌数量：{table_count}
  - 价格体系：{price_info}

  ## 测算要点（台球房的钱是这么算的，按这个来）

  一、初始投入（一次性，回本周期的分子）
  列出主要项目，门店没给的具体金额用【请补充：XX】占位，不要编：
  - 转让费/进场费、装修、球桌与设备（普通台和乔氏/斯诺克差价大）、空调与灯光、证照、首期房租与押金、开业备货。

  二、月度固定成本（每月都要出，台球房的大头）
  - **房租**（通常最大项）、**人工**（店长/前厅/助教底薪，助教多为低底薪+提成）、**水电**（球房的空调和灯光是电费大户，夏冬两季尤其高，要单独重视）、**折旧**（台呢要定期更换、设备损耗）、杂费（物业/网络/清洁/耗材）。
  - 门店未提供的金额用占位符，并标注"按当地行情，需按实际填写"。

  三、收入结构（台球房四大收入，按门店定位占比不同）
  结合 {price_info} 的真实价格测算，不要凭空改价：
  - **台费**：主力收入，社区球房占比最高。按"可用台时 × 上座率 × 单价"估。
  - **助教费**：商业/竞技商业球房的关键增量，能不能做起来看助教数量和上钟率。
  - **商品**：烟酒、饮料、零食，毛利高，是利润的重要补充。
  - **器材**：球杆等，频次低但客单高。
  - 说明每类收入靠什么拉动（如台费靠上座率、助教费靠上钟率）。

  四、回本与盈亏判断
  - 把月收入和月度固定成本/变动成本摆在一起，看每月是盈是亏、大概多久能把初始投入收回来。
  - 给出一个区间（按经营好坏分档），并标注这是估算、随经营波动，门店没给的数据用占位符。

  五、改善建议（不只给数字，给往哪使劲）
  - 提收入：空台促活、搭子局撮合（不增成本就能拉收入）。
  - 做大助教/商品收入：低边际成本、直接增利。
  - 控成本：空调电费的时段管理、台呢养护延长寿命、人效。

  ## 写法与约束
  - 用 {table_count} 和 {price_info} 的真实数据测算；门店没给的成本/金额一律用【请补充：XX】，绝不编造具体数字。
  - 所有行业基准（如人均成本、上座率参考）必须标注"行业经验值/假设，需按门店实际调整"，不要说成确定数据。
  - 输出是给老板看的实账，不是咨询报告或商业计划书；有表格感、口径清楚、能照着算。
  - 不承诺"一定回本""稳赚"等结果；不编造行业数据来源。
  - 不要用"赋能、抓手、闭环、底层逻辑"等AI味词汇。
  - 不在开头写"好的""以下是测算"等AI回应语。
