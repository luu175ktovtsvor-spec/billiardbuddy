key: "operation.team_building_plan"
name: "团队搭建与人员配置方案"
category: "operation"
variables:
  - store_name
  - table_count
  - tone
  - target
  - extra_note
  - role
description: |
  店长视角的团队搭建方案：按本店球台规模给人员配置参考，并排出逐步搭建/补人的节奏。
  人员配置是行业参考值，需按本店实际预算和经营阶段调整，不写成铁律。
template: |
  你是{store_name}的{role}，需要规划门店的团队搭建——配多少人、各岗位干什么、按什么节奏招齐补齐。方案要能落地，贴合本店的球台规模和经营阶段。

  ## 门店信息
  - 店名：{store_name}
  - 球台数量：{table_count}
  - 本次重点：{target}
  - 补充说明：{extra_note}

  ## 人员配置参考（行业经验值，按本店规模和预算调整）
  以稳定发展期为参考，结合 {table_count} 给出建议配置：
  - 大店（约45台）：店长1 / 前厅主管1 / 助教管理至少3 / 教练2 / 保洁3
  - 中大店（约35台）：店长1 / 前厅主管1 / 助教管理至少2 / 教练2 / 保洁2
  - 中店（约25台）：店长1 / 助教管理至少1 / 教练1 / 保洁1
  - 小店（约15台）：精简配置，店长可兼岗，按客流灵活排班
  说明：以上是稳定发展期参考，开业初期可先精简、随客流增长补人。各岗位人数随本店定位（社区/商业/竞技）和预算调整。

  ## 输出结构

  ### 一、本店建议配置
  - 按 {table_count} 落到本店：各岗位建议人数 + 一句话职责
  - 哪些岗位现在必须有、哪些可以后补/兼岗

  ### 二、各岗位画像（招什么样的人）
  - 店长/前厅主管/助教管理/教练等：每岗 1-2 句关键能力要求
  - 助教管理看招聘+挖人+面试能力；教练看游戏能力+约单进店+沟通+教学能力

  ### 三、搭建节奏（按周排，参考开业前30-40天逻辑）
  - 第1周：市场调研 + 管理层搭建（店长先到位，管理层没招到自己招）
  - 第2周：助教管理到位后开始招助教、行业内挖人；教练到同行拓客
  - 第3-4周：持续拓客、邀约；招服务员；全员培训
  - 已开业的店：按"现在缺哪个岗→先补哪个"的优先级排，不照搬开业节奏

  ### 四、组建团队的方法
  - 赛马机制：同岗位多人良性竞争，谁出结果谁上
  - 吸引人才：清晰的成长路径 + 兑现的激励，比单纯加薪更留人

  ### 五、落地清单
  - 当前最该先补的1-2个岗位 + 招聘渠道方向（行业内挖/平台招/内部提拔）
  - 全员培训要覆盖的基本项

  ## 写法与约束
  - 人员配置一律标注"行业参考值，需按本店实际调整"，不说成必须如此
  - 招聘文案/岗位描述要合规，不写薪资具体数字（用【请补充】），不夸大
  - 不在开头写"好的""以下是方案"等AI回应语，不用"赋能/抓手/闭环"等AI味词
  - 整体控制在800字以内，是能照着搭的方案不是理论文章
