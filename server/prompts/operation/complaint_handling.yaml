key: "operation.complaint_handling"
name: "投诉安抚话术模板"
category: "operation"
variables:
  - store_name
  - tone
  - target
  - extra_note
description: |
  客户投诉安抚话术模板，按投诉类型生成安抚话术、处理流程、补偿建议框架。
  核心原则：先处理情绪，再处理问题。客户投诉时，要的不是解决方案，是"你理解我"。

complaint_types:
  price_issue:
    name: "价格争议"
    description: "客户认为收费不合理、活动价与原价差距大、隐形消费等"
    emotional_state: "觉得被坑了、不被尊重"
    response_steps:
      - step: "情绪安抚"
        script: "{customer_name}哥，我特别理解你的感受，换作是我也会觉得不舒服。你先别急，我马上帮你查清楚。"
      - step: "事实核实"
        script: "我刚才帮你看了一下，{fact_explanation}。可能是我们前台在沟通时没说清楚，这是我们的问题，我替她向你道歉。"
      - step: "解决方案"
        script: "这样吧，这次{solution}，你看行不行？下次你来之前提前给我发个消息，我帮你安排好，保证不会再有这种误会。"
    compensation_framework:
      - "退还差价（需由店长确认后方可执行）"
      - "赠送1小时台费券（需由店长确认后方可执行）"
      - "赠送饮品1杯（需由店长确认后方可执行）"
      - "下次到店享会员价（需由店长确认后方可执行）"
    notes:
      - "绝对不能说'我们价格就是这样'，这等于在说'你活该'"
      - "查清事实后，如果是门店的错，必须承认错误"
      - "如果是客户理解有误，要帮客户保留面子"

  service_issue:
    name: "服务不满"
    description: "服务态度差、响应慢、助理教练不专业、体验不好等"
    emotional_state: "觉得不被重视、花了钱还受气"
    response_steps:
      - step: "情绪安抚"
        script: "{customer_name}哥，真的非常抱歉让你有了不好的体验，这完全不应该发生。你能跟我具体说说当时的情况吗？我一定要处理这件事。"
      - step: "事实核实+追责"
        script: "我了解清楚了，确实是{employee_role}的问题。我已经跟她/他严肃沟通了，并且{action_taken}。这种事以后绝对不会在你身上再发生。"
      - step: "补偿+重建信任"
        script: "为了弥补今天的体验，{compensation_offer}。另外，下次你来我亲自接待你，保证让你感受到{store_name}应有的服务水平。"
    compensation_framework:
      - "本次消费免单/打折（需由店长确认后方可执行）"
      - "赠送2小时台费券（需由店长确认后方可执行）"
      - "更换服务人员（需由店长确认后方可执行）"
      - "店长亲自接待下次到店"
    notes:
      - "客户说服务不好时，不要替员工辩解"
      - "追责动作要让客户知道，但不要过度贬低员工"
      - "补偿要有诚意，不能只是'送杯水'这种敷衍"

  environment_issue:
    name: "环境问题"
    description: "台尼走线、灯光暗、空调不制冷、噪音大、卫生差等"
    emotional_state: "觉得花钱不值、被糊弄"
    response_steps:
      - step: "情绪安抚+立即行动"
        script: "{customer_name}哥，你说的问题我完全理解，这确实不应该。你现在还在店里吗？我马上安排人处理。"
      - step: "说明改善计划"
        script: "关于{issue_detail}，我们已经{improvement_plan}，{timeline}之前肯定解决。你提的意见对我们太重要了，真心感谢你告诉我们。"
      - step: "补偿"
        script: "这次体验不好是事实，{compensation_offer}算是我们的歉意。等{issue_detail}修好了我第一个通知你，到时候你来看看效果。"
    compensation_framework:
      - "当次消费打折/部分免单（需由店长确认后方可执行）"
      - "赠送台费券补偿时间损失（需由店长确认后方可执行）"
      - "改善完成后邀约免费体验（需由店长确认后方可执行）"
    notes:
      - "环境问题必须给出明确的改善时间线"
      - "不能只说'我们会处理'，要说出具体动作"
      - "改善后一定要回访，形成闭环"

  waiting_issue:
    name: "等位不满"
    description: "到店无台、排队太久、预约台被占等"
    emotional_state: "觉得不被尊重、浪费时间"
    response_steps:
      - step: "情绪安抚+当下解决"
        script: "{customer_name}哥，让你白跑一趟真的太不好意思了。我现在马上给你安排——{immediate_solution}。"
      - step: "解释原因（不推诿）"
        script: "今天{reason}所以人特别多，但这是我们的管理问题，不是你的问题。以后你提前给我发消息，我帮你锁台，保证来了就有台打。"
      - step: "补偿+锁客"
        script: "这次耽误你时间了，{compensation_offer}。我已经把你的微信备注成VIP客户了，以后你来了第一时间给你安排，不用再等。"
    compensation_framework:
      - "等待期间免费饮品（需由店长确认后方可执行）"
      - "赠送1小时台费券（需由店长确认后方可执行）"
      - "下次预约优先权"
      - "店长亲自安排台位"
    notes:
      - "等位问题必须当场给解决方案，不能只说'请等一下'"
      - "解释原因时不推诿，承认管理问题"
      - "一定要加上'以后提前通知我帮你留台'这个承诺"

# 投诉处理双标准（对客 / 对内）——内部认知，不一刀切
# 由于客人的认识、动机有差别，门店处理投诉时分别执行两类标准：
# 「对客标准」面向客人、统一口径"客人总是对的"；「对内标准」面向员工、区分合理/非合理投诉、护员工积极性。
dual_standard:
  to_customer:
    name: "对客标准（每位员工对客人的投诉都有不可推卸的责任）"
    principle: "竭力服务后仍让客人不满意时，执行'客人总是对的'——克己自检，绝不与客人争辩或批评客人，敬请客人原谅、设法满足其需要，并对客人提的意见表示感谢。"
    rules:
      - "先用真诚、友好、谦和的态度耐心听取客人意见，不表现出厌烦和愤怒，不打断客人陈述"
      - "用和蔼的语言肯定客人意见、让他感到被尊重，尽量稳定情绪，绝不与客人争辩"
      - "接到投诉的任何一名员工都必须先向客人道歉，并表示理解和同情、安慰客人，同时迅速联系解决问题"
      - "接到投诉的员工必须为这次投诉负责到底，不允许出现处理空档；自己能处理的简单投诉不推诿、不转移"
      - "提出明确的处理措施，并视情况告知客人大致所需时间"
      - "跟踪处理过程和进展，做好补救服务和后续回访闭环"
    malicious_complaint:
      name: "恶意投诉的处理"
      description: "个别客人出于不良动机、无中生有、恶意刁难，提出诸多无理要求甚至有讹诈之嫌，其行为对其他顾客及门店造成不良影响、损害门店利益。"
      action: "由管理人员（店长/主管）出面劝离；劝离无效或涉及讹诈、滋事的，报警处理。一线员工不与其正面冲突。"
  to_internal:
    name: "对内标准（区分合理/非合理投诉，不'一刀切'，护员工积极性）"
    principle: "对客人投诉，内部处理要严格区分'合理投诉'和'非合理投诉'，分别采取不同处理方法，不能用'一刀切'的简单方式，以维护员工利益、调动和保护员工积极性。"
    reasonable_complaint:
      name: "合理投诉的内部处理"
      steps:
        - "处理者执行完对客投诉处理程序后，向其直接上级汇报"
        - "管理人员召集相关人员研究此类投诉的原因，以及今后防止类似投诉的措施，并安排专人负责落实"
        - "对投诉涉及的责任人，视情节轻重作相应处理"
      protect_employee: "因硬件设施不完善（设备老化、场地条件等）造成的投诉，员工不承担个人责任——不能让员工替硬件背锅。"
    unreasonable_complaint:
      name: "非合理投诉的内部处理"
      principle: "员工按职责进行了礼貌劝阻、合理耐心解释的，不承担个人责任。"
  usage_note: "这两套标准方向不同、不冲突：对外永远统一'客人总是对的'、不在客人面前甩锅员工；对内才区分责任、该护的员工护住。生成内部培训/复盘材料时讲清两套；生成对客话术时只体现'对客标准'。"

handling_process:
  - step: 1
    name: "即时响应"
    description: "投诉发生后5分钟内必须有人回应客户，不能晾着"
  - step: 2
    name: "情绪安抚"
    description: "先认同客户感受，不要急着解释原因"
  - step: 3
    name: "事实核实"
    description: "30分钟内核清事实，避免主观臆断"
  - step: 4
    name: "提出方案"
    description: "给客户2个以上可选方案，不要只给一个"
  - step: 5
    name: "执行补偿"
    description: "补偿要当场兑现，不要拖延到'下次'"
  - step: 6
    name: "回访闭环"
    description: "投诉处理完3天内必须回访，确认客户满意"
  - step: 7
    name: "内部复盘"
    description: "投诉事件必须记录在案，月度复盘分析根因"

template: |
  你是一个台球房客户关系专家，为{store_name}生成投诉处理方案。

  语气风格：{tone}
  目标客户：{target}
  补充说明：{extra_note}

  请根据以上信息，生成以下内容：
  1. 投诉安抚话术（3个步骤：情绪安抚→事实核实→解决方案），覆盖常见投诉类型（价格争议、服务不满、环境问题、等位不满）
  2. 处理流程（7步标准流程：即时响应→情绪安抚→事实核实→提出方案→执行补偿→回访闭环→内部复盘）
  3. 补偿建议（2-3个可选方案）

  ## 投诉处理双标准（对客 / 对内，不"一刀切"）

  门店处理投诉分两套标准，方向不同、不冲突：
  - **对客标准**：统一执行"客人总是对的"。先真诚耐心倾听不打断、肯定情绪不争辩、任何员工先道歉并负责到底、给明确措施和时限、跟踪回访闭环。**恶意投诉**（无中生有、恶意刁难、有讹诈之嫌、损害门店与其他顾客利益）由管理人员出面劝离，无效或涉讹诈/滋事则报警，一线员工不正面冲突。
  - **对内标准**：严格区分"合理投诉"与"非合理投诉"，不一刀切，护员工积极性。合理投诉→处理者上报上级、复盘根因定防范措施、按情节处理责任人；但**因硬件设施不完善造成的投诉，员工不担个人责任**。非合理投诉→员工已礼貌劝阻、耐心解释的，不承担个人责任。

  生成口径要求：
  - 生成**对客话术**时，只体现"对客标准"，对外绝不甩锅员工、绝不在客人面前区分对错。
  - 生成**内部培训/复盘材料**时，把两套标准讲清；强调护员工（硬件锅不让员工背、非合理投诉尽责即免责）。
  - 遇到疑似恶意投诉，话术上保持克制礼貌，处理上明确"转管理人员出面、必要时报警"，不教员工与客人对峙。

  ## 门店定位差异（影响投诉处理语气和补偿尺度）

  - 社区球房：处理语气像邻居调解，亲切接地气，补偿用"人情味"方式
  - 商业球房：处理语气专业但不官方，补偿体现品质感
  - 竞技球房：处理语气直接干脆，补偿可结合赛事权益
  - 竞技商业球房：处理兼顾专业和温度，补偿灵活组合

  核心原则：
  - 先处理情绪，再处理问题
  - 不推诿、不辩解、不敷衍
  - 补偿要有诚意，不能只是象征性
  - 所有话术必须合规，不使用不当用语
  - 补偿方案中的具体金额用[请填写：XXX]占位，不编造