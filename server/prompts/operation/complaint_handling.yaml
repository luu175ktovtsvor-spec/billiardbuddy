key: "operation.complaint_handling"
name: "投诉安抚话术模板"
category: "operation"
variables:
  - store_name
  - tone
  - target
  - extra_note
description: |
  客户投诉安抚话术模板，按投诉类型生成安抚话术、处理流程、补偿建议框架。
  核心原则：先处理情绪，再处理问题。客户投诉时，要的不是解决方案，是"你理解我"。

complaint_types:
  price_issue:
    name: "价格争议"
    description: "客户认为收费不合理、活动价与原价差距大、隐形消费等"
    emotional_state: "觉得被坑了、不被尊重"
    response_steps:
      - step: "情绪安抚"
        script: "{customer_name}哥，我特别理解你的感受，换作是我也会觉得不舒服。你先别急，我马上帮你查清楚。"
      - step: "事实核实"
        script: "我刚才帮你看了一下，{fact_explanation}。可能是我们前台在沟通时没说清楚，这是我们的问题，我替她向你道歉。"
      - step: "解决方案"
        script: "这样吧，这次{solution}，你看行不行？下次你来之前提前给我发个消息，我帮你安排好，保证不会再有这种误会。"
    compensation_framework:
      - "退还差价（需由店长确认后方可执行）"
      - "赠送1小时台费券（需由店长确认后方可执行）"
      - "赠送饮品1杯（需由店长确认后方可执行）"
      - "下次到店享会员价（需由店长确认后方可执行）"
    notes:
      - "绝对不能说'我们价格就是这样'，这等于在说'你活该'"
      - "查清事实后，如果是门店的错，必须承认错误"
      - "如果是客户理解有误，要帮客户保留面子"

  service_issue:
    name: "服务不满"
    description: "服务态度差、响应慢、助理教练不专业、体验不好等"
    emotional_state: "觉得不被重视、花了钱还受气"
    response_steps:
      - step: "情绪安抚"
        script: "{customer_name}哥，真的非常抱歉让你有了不好的体验，这完全不应该发生。你能跟我具体说说当时的情况吗？我一定要处理这件事。"
      - step: "事实核实+追责"
        script: "我了解清楚了，确实是{employee_role}的问题。我已经跟她/他严肃沟通了，并且{action_taken}。这种事以后绝对不会在你身上再发生。"
      - step: "补偿+重建信任"
        script: "为了弥补今天的体验，{compensation_offer}。另外，下次你来我亲自接待你，保证让你感受到{store_name}应有的服务水平。"
    compensation_framework:
      - "本次消费免单/打折（需由店长确认后方可执行）"
      - "赠送2小时台费券（需由店长确认后方可执行）"
      - "更换服务人员（需由店长确认后方可执行）"
      - "店长亲自接待下次到店"
    notes:
      - "客户说服务不好时，不要替员工辩解"
      - "追责动作要让客户知道，但不要过度贬低员工"
      - "补偿要有诚意，不能只是'送杯水'这种敷衍"

  environment_issue:
    name: "环境问题"
    description: "台尼走线、灯光暗、空调不制冷、噪音大、卫生差等"
    emotional_state: "觉得花钱不值、被糊弄"
    response_steps:
      - step: "情绪安抚+立即行动"
        script: "{customer_name}哥，你说的问题我完全理解，这确实不应该。你现在还在店里吗？我马上安排人处理。"
      - step: "说明改善计划"
        script: "关于{issue_detail}，我们已经{improvement_plan}，{timeline}之前肯定解决。你提的意见对我们太重要了，真心感谢你告诉我们。"
      - step: "补偿"
        script: "这次体验不好是事实，{compensation_offer}算是我们的歉意。等{issue_detail}修好了我第一个通知你，到时候你来看看效果。"
    compensation_framework:
      - "当次消费打折/部分免单（需由店长确认后方可执行）"
      - "赠送台费券补偿时间损失（需由店长确认后方可执行）"
      - "改善完成后邀约免费体验（需由店长确认后方可执行）"
    notes:
      - "环境问题必须给出明确的改善时间线"
      - "不能只说'我们会处理'，要说出具体动作"
      - "改善后一定要回访，形成闭环"

  waiting_issue:
    name: "等位不满"
    description: "到店无台、排队太久、预约台被占等"
    emotional_state: "觉得不被尊重、浪费时间"
    response_steps:
      - step: "情绪安抚+当下解决"
        script: "{customer_name}哥，让你白跑一趟真的太不好意思了。我现在马上给你安排——{immediate_solution}。"
      - step: "解释原因（不推诿）"
        script: "今天{reason}所以人特别多，但这是我们的管理问题，不是你的问题。以后你提前给我发消息，我帮你锁台，保证来了就有台打。"
      - step: "补偿+锁客"
        script: "这次耽误你时间了，{compensation_offer}。我已经把你的微信备注成VIP客户了，以后你来了第一时间给你安排，不用再等。"
    compensation_framework:
      - "等待期间免费饮品（需由店长确认后方可执行）"
      - "赠送1小时台费券（需由店长确认后方可执行）"
      - "下次预约优先权"
      - "店长亲自安排台位"
    notes:
      - "等位问题必须当场给解决方案，不能只说'请等一下'"
      - "解释原因时不推诿，承认管理问题"
      - "一定要加上'以后提前通知我帮你留台'这个承诺"

handling_process:
  - step: 1
    name: "即时响应"
    description: "投诉发生后5分钟内必须有人回应客户，不能晾着"
  - step: 2
    name: "情绪安抚"
    description: "先认同客户感受，不要急着解释原因"
  - step: 3
    name: "事实核实"
    description: "30分钟内核清事实，避免主观臆断"
  - step: 4
    name: "提出方案"
    description: "给客户2个以上可选方案，不要只给一个"
  - step: 5
    name: "执行补偿"
    description: "补偿要当场兑现，不要拖延到'下次'"
  - step: 6
    name: "回访闭环"
    description: "投诉处理完3天内必须回访，确认客户满意"
  - step: 7
    name: "内部复盘"
    description: "投诉事件必须记录在案，月度复盘分析根因"

template: |
  你是一个台球房客户关系专家，为{store_name}生成投诉处理方案。

  语气风格：{tone}
  目标客户：{target}
  补充说明：{extra_note}

  请根据以上信息，生成以下内容：
  1. 投诉安抚话术（3个步骤：情绪安抚→事实核实→解决方案），覆盖常见投诉类型（价格争议、服务不满、环境问题、等位不满）
  2. 处理流程（7步标准流程：即时响应→情绪安抚→事实核实→提出方案→执行补偿→回访闭环→内部复盘）
  3. 补偿建议（2-3个可选方案）

  ## 门店定位差异（影响投诉处理语气和补偿尺度）

  - 社区球房：处理语气像邻居调解，亲切接地气，补偿用"人情味"方式
  - 商业球房：处理语气专业但不官方，补偿体现品质感
  - 竞技球房：处理语气直接干脆，补偿可结合赛事权益
  - 竞技商业球房：处理兼顾专业和温度，补偿灵活组合

  核心原则：
  - 先处理情绪，再处理问题
  - 不推诿、不辩解、不敷衍
  - 补偿要有诚意，不能只是象征性
  - 所有话术必须合规，不使用不当用语
  - 补偿方案中的具体金额用[请填写：XXX]占位，不编造