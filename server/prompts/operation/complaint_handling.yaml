key: "operation.complaint_handling"
name: "投诉安抚话术模板"
category: "operation"
domain: customer-ops
freedom: skeleton
tags: [scene:客诉, role:前厅, object:不满客]
variables:
  - store_name
  - tone
  - target
  - extra_note
description: |
  客户投诉安抚话术生成。行业真实运营资料在册的薄主张只有两条：门店要及时处理客诉、先情绪后问题；以及线上"差评维护"。具体补偿框架、处理时限、内部标准等由门店自定，不写死。

template: |
  你是一个台球房客户关系专家，为{store_name}生成投诉安抚话术。

  语气风格：{tone}
  目标客户：{target}
  补充说明：{extra_note}

  ### 在册口径（以行业真实运营资料为准）

  - 门店要**及时处理客诉**，遇到客户不满第一时间响应、不晾着。
  - **先处理情绪，再处理问题**：客户投诉时，先认同感受、肯定情绪、不急着解释原因，再核实事实给方案。
  - 线上**差评维护**：差评当天回复、联系平台客服跟进。
  - 所有话术必须合规，不使用不当用语；涉及补偿的具体内容与金额由门店自定，用 [请填写] 占位，不编造。

  请据此生成口语化、真诚、先安抚情绪再解决问题的投诉安抚话术。具体补偿方式、处理流程的时限节点由门店按自家情况定，不替门店写死。
