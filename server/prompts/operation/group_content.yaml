key: "operation.group_content"
name: "私域群矩阵内容模板"
category: "operation"
variables:
  - store_name
  - city
  - group_type
  - content_purpose
description: |
  私域群矩阵内容生成模板，按群类型注入不同的内容策略和语气边界。
  支持五种群类型：客户群、会员群、赛事群、搭子群、助教群。
  每种群类型有专属的内容方向、发送频次建议、语气边界和禁忌。

group_types:
  customer_group:
    name: "客户群"
    description: "面向所有到店客户的泛群，包含新老客户"
    content_purposes:
      - "活动通知"
      - "优惠推送"
      - "到店引导"
      - "互动活跃"
    tone: "热情友好，但不油腻；像一个懂分寸的邻居"
    frequency: "每天1-2条，避免刷屏"
    dos:
      - "每天固定时间发1条活跃内容（早安问候/台球小知识/趣味互动）"
      - "活动/优惠信息用简洁格式：亮点→时间→参与方式"
      - "偶尔发门店实拍/视频，增强信任感"
      - "成员发言时及时互动，营造'有人管'的感觉"
    donts:
      - "不连发3条以上消息"
      - "不发长篇大论的活动规则"
      - "不艾特全体成员超过每天1次"
      - "不发布与台球/门店无关的广告"
    content_templates:
      - type: "早安问候"
        template: "早上好！新的一天，{store_name}已就位。今天有空来甩两杆吗？🎱"
      - type: "活动通知"
        template: |
          【{store_name}活动】
          {activity_name}
          时间：{time}
          奖品：{prize}
          报名：私信我或群里扣"报名"
      - type: "到店引导"
        template: "今晚有空？{store_name}等你来战！台位充足，助教已到岗，提前滴滴我帮你留台🎱"
      - type: "互动话题"
        template: "聊聊：你打台球最爽的一杆是什么？评论区说出来，今晚来店里还原一下🎱"

  member_group:
    name: "会员群"
    description: "面向充值会员/VIP客户的高价值群"
    content_purposes:
      - "专属权益通知"
      - "会员日活动"
      - "新品/新服务优先体验"
      - "生日/节日关怀"
    tone: "尊贵感、专属感；像一个靠谱的管家"
    frequency: "每周2-3条，少而精"
    dos:
      - "强调'专属''优先''限会员'等标签"
      - "生日当天私发祝福+专属优惠"
      - "新品/新服务第一时间通知会员群"
      - "定期整理会员专属权益清单"
    donts:
      - "不群发大众优惠（让会员觉得钱白充了）"
      - "不艾特全体（会员群人数少，直接发即可）"
      - "不发布非会员也能参与的活动"
    content_templates:
      - type: "会员专属通知"
        template: |
          【会员专属】
          {store_name}会员{activity_name}
          仅限会员参与，非会员无法享受此福利
          详情私信我，凭会员账号领取
      - type: "新品优先体验"
        template: |
          【新品首发】
          {store_name}上新了{new_item}！
          会员优先体验，下周才对公众开放
          想先来试的，直接私信我安排
      - type: "生日关怀"
        template: "{customer_name}，生日快乐！{store_name}给你准备了一份专属生日礼，下次到店出示本消息即可领取。祝你新的一年杆杆进袋🎱"

  competition_group:
    name: "赛事群"
    description: "面向赛事参与者和观赛爱好者的群"
    content_purposes:
      - "赛事通知"
      - "赛程安排"
      - "战报播报"
      - "约球组队"
    tone: "热血、专业、公正；像一个严肃的裁判长"
    frequency: "赛事期间高频（每天3-5条），非赛事期间低频（每周1-2条）"
    dos:
      - "赛程/规则信息必须准确清晰"
      - "每轮战报及时播报，附比分和亮点"
      - "赛事期间营造紧张氛围"
      - "非赛事期间发约球/训练信息保持活跃"
    donts:
      - "不发布不准确的赛程信息"
      - "不偏袒任何参赛选手"
      - "赛事期间不发无关内容干扰"
    content_templates:
      - type: "赛事通知"
        template: |
          【赛事通知】{store_name}{tournament_name}
          时间：{date}
          赛制：{format}
          报名费：会员免费/非会员{fee}元
          奖励：冠军{prize}
          报名截止：{deadline}
          报名方式：群里扣"报名+姓名+档位"
      - type: "战报播报"
        template: |
          【战报】{round_name}
          {player_a} {score_a}:{score_b} {player_b}
          精彩瞬间：{highlight}
          下一场：{next_match}
      - type: "约球组队"
        template: "非赛事期间想约球的，群里喊一声！{store_name}随时有搭子，段位不限，来就开台🎱"

  matchmaking_group:
    name: "搭子群"
    description: "面向找台球搭子的用户群，以年轻人为主"
    content_purposes:
      - "约球匹配"
      - "新人欢迎"
      - "活动引流"
      - "氛围活跃"
    tone: "轻松、随意、不装；像一个爱打球的朋友"
    frequency: "每天2-3条，保持活跃"
    dos:
      - "新人入群时主动欢迎并引导自我介绍（档位+区域+时间偏好）"
      - "每天固定时间发约球召集"
      - "偶尔发门店优惠，但要自然不突兀"
      - "群内氛围以娱乐为主，不卷技术"
    donts:
      - "不发查户口式追问"
      - "不搞任何形式的营销刷屏"
      - "不发布赌博/追分信息"
      - "不艾特全体打扰"
    content_templates:
      - type: "新人欢迎"
        template: "欢迎新朋友！进群先报个到：档位+区域+一般什么时间有空，方便大家约球～🎱"
      - type: "约球召集"
        template: "今晚{time}有人约吗？{store_name}已就位，来的扣1，我帮你们拼台🎱"
      - type: "门店引流"
        template: "今天{store_name}有{activity}，群里朋友来的话我帮你们安排好台位，来了直接开打🎱"

  assistant_group:
    name: "助教群"
    description: "面向门店助教/助理教练的内部工作群"
    content_purposes:
      - "工作安排"
      - "培训通知"
      - "数据汇报"
      - "状态激励"
    tone: "专业、温暖、有方向感；像一个严格的教练+知心的大姐"
    frequency: "按需发送，工作信息及时"
    dos:
      - "每日工作安排清晰具体（几点做什么）"
      - "表扬优秀表现，用截图+文字形式"
      - "培训/新规定及时通知"
      - "关注助教情绪，及时私信疏导"
    donts:
      - "不在群里公开批评个人"
      - "不发与工作无关的内容"
      - "不在群里讨论薪资细节"
      - "不发布客户隐私信息"
    content_templates:
      - type: "工作安排"
        template: |
          【今日工作】{date}
          1. {task_1}
          2. {task_2}
          3. {task_3}
          各位加油，有问题随时找我！
      - type: "表扬激励"
        template: "表扬{assistant_name}！今天{achievement}，大家向她/他学习！💪"
      - type: "培训通知"
        template: |
          【培训通知】
          时间：{date} {time}
          内容：{topic}
          地点：{location}
          全员参加，请假提前报备

group_matrix_three_layers:
  name: "微信群三层矩阵（门店该建哪几类群、各干什么）"
  description: |
    一家球房的群不是越多越好，按用途分三层各司其职：管理层群管过程、员工群造文化、会员/客户群养消费习惯。
    生成群运营策划、群规、群内容节奏时，先认清这条群属于哪一层，再按那一层的目的发内容。
  layers:
    - key: "management_layer"
      name: "管理层群（过程留痕 + 管控）"
      who: "老板 + 店长 + 助教管理 + 教练 + 前厅主管等管理层"
      purpose: "把每天的运营过程沉淀成文字、让动作可追溯、可考核。是管控工具，不是聊天群。"
      what_to_post:
        - "每日各岗位数据汇报（充值/上钟/团购核销/加微/组局），群里留痕、好对账好复盘"
        - "异常和问题当天群里报备（设备故障/客诉/缺岗），有据可查"
        - "目标进度同步：本月业绩冲刺到哪、还差多少，盯过程不只看结果"
        - "决策和安排落文字，避免'口头说过'扯皮"
      donts:
        - "不在群里公开批评到个人（私下谈），不发员工/客户隐私"
        - "不让它变成闲聊水群，工作信息要能一眼翻出来"
    - key: "staff_layer"
      name: "员工群（喜报晒单 + 文化）"
      who: "助教 + 教练 + 前厅等一线员工"
      purpose: "用'喜报'造正向氛围和好胜文化，让员工互相看见、互相卷、有奔头。"
      what_to_post:
        - "充值喜报、球杆/器材售卖喜报：谁开了大单，截图+文字晒出来，给到面子和激励"
        - "助教突破喜报：谁上钟时长破纪录、谁约客转化好，公开表扬树标杆"
        - "奖励喜报 + 欢迎加入：发奖到位晒出来、新人入职欢迎，让团队有归属感"
        - "温馨提示 / 器材维护 / 助教笔记：日常经验和提醒沉淀进群，共享成长"
      donts:
        - "不在群里讨论具体薪资数字（避免攀比内讧），薪资细节私下沟通"
        - "喜报要真实，别造假喜报糊弄人，员工一眼看穿就废了"
    - key: "member_layer"
      name: "会员 / 客户群（养消费习惯 + 防屏蔽钩子）"
      who: "充值会员 / 到店客户"
      purpose: "靠每天的福利和活动节奏，把'来这家店消费'养成习惯；同时对抗'群消息没人看'。"
      what_to_post:
        - "每日福利播报：群红包尾号福利、手气最佳、打满抽奖，固定时间发、养成天天看群的习惯"
        - "活动播报 + 夜宵推送：晚间活动、夜宵优惠等贴着消费时段推，把流量导回店里"
        - "赛事 / 拼台 / 搭子信息：让会员觉得这群里有局可约、有人可玩，不是死群"
      anti_block_hooks:
        note: "大家都会屏蔽广告群——所以发的内容要'让他们忍不住想点进去'，靠悬念和福利钩子破屏蔽。"
        tips:
          - "标题留悬念别一上来就报价：'今晚到店的前 [X] 位有惊喜''尾号对上直接送'，勾好奇心"
          - "把福利做成'当日带截图领、过期作废'，制造紧迫感逼人当天看、当天来"
          - "少发硬广、多发有现场感的活动和 UGC，让群看着像'有人在玩'而不是'又在推销'"
      donts:
        - "不天天硬广刷屏（会被批量屏蔽/退群），福利和互动穿插着来"
        - "不发非会员也能参与的活动到会员群（让会员觉得白充了）"

template: |
  你是一个台球房私域运营专家，为{store_name}生成私域群内容。

  群类型：{group_type}
  内容目的：{content_purpose}
  门店名称：{store_name}
  所在城市：{city}

  请按以下要求生成：
  1. 根据群类型选择合适的语气和内容策略
  2. 内容简洁，适合手机阅读
  3. 不违反该群类型的禁忌事项
  4. 格式清晰，重点信息一目了然

  ## 门店定位差异（影响群内容语气和重点）

  - 社区球房：群内容接地气亲切，像邻居聊天，多用口语，强调"家门口的球房"
  - 商业球房：群内容体现品质和专业，但不要官方套话，强调"专业设备+优质服务"
  - 竞技球房：群内容突出竞技氛围，强调"高手过招""赛事文化""技术提升"
  - 竞技商业球房：群内容兼顾竞技与品质，强调"专业+舒适"

  ## 客户分类策略

  - 散客：降低来店门槛，强调轻松氛围和社交体验
  - 竞技客户：突出赛事和对抗机会，强调对手水平
  - 助教客户：围绕"专业陪练+技术指导+情绪价值"，强调技术提升
  - 追分客户：强调"有搭子、有对手、有氛围"，用轻竞技社交吸引

  合规要求：
  - 不使用"陪"字及变体，使用"助理教练"替代
  - 不暗示任何涉黄涉赌内容
  - 不发布客户隐私信息