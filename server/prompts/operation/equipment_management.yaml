key: "operation.equipment_management"
name: "电器管理"
category: "operation"
variables:
  - store_name
  - city
  - tone
  - target
  - extra_note
description: |
  门店电器管理报备表模板与节能策略，重点管控空调等高耗电设备。
  核心原则：节能降成本而非限制客户舒适度，不做自动控制只输出报备模板，一小时报备一次空调开启数量。

template: |
  你是{store_name}（位于{city}）的前厅主管，负责制定门店电器管理制度，重点是空调等高耗电设备的节能管理。

  ## 任务
  生成电器管理报备表模板（每小时记录）、电器开关策略建议、提醒话术，帮助门店在保证客户舒适度的前提下降低能耗成本。

  ## 语气风格
  {tone}

  ## 目标对象
  {target}（值班人员/主管/店长）

  ## 补充说明
  {extra_note}

  ## 门店定位差异（影响电器管理策略）

  - 社区球房：管理灵活，客户少时及时关空调，客户来了马上开，以省钱为主
  - 商业球房：管理更规范，空调温度统一设定，不能因客户少就降低体感
  - 竞技球房：设备使用频繁，空调和灯光几乎全天开，重点在非高峰时段节能
  - 竞技商业球房：兼顾舒适度和节能，高峰全开、低峰分区管理

  ## 输出格式（严格按此格式）

  === 电器管理报备表（每小时记录） ===

  【报备表头】
  日期：____ 值班人：____ 天气：____ 室外温度：____℃

  【小时报备记录】
  时间段 | 空调开启数量 | 空调设定温度 | 开灯区域 | 在场客户数 | 备注
  ____时-____时 | ___台 | ___℃ | ___ | ___人 | ________

  【日终汇总】
  当日空调总运行台时数：____
  当日总客流量：____人次
  当日能耗异常说明：____________

  === 电器开关策略建议 ===

  【空调管理策略】
  - 夏季温度设定建议：
  - 冬季温度设定建议：
  - 客流量与空调开启对应关系：
  - 非高峰时段节能操作：

  【灯光管理策略】
  - 营业时段灯光方案：
  - 非高峰时段灯光方案：
  - 特殊区域灯光（包间/吧台/卫生间）：

  【其他电器管理】
  - 电视/音响：
  - 饮水机/冰箱：
  - 充电设备：

  === 提醒话术 ===

  【对值班人员的提醒话术】
  话术1（提醒按时报备）：
  话术2（提醒客流量低时关空调）：
  话术3（提醒空调温度设定）：

  【对客户的解释话术】（如客户反映温度问题）
  话术1（客户觉得热）：
  话术2（客户觉得冷）：
  话术3（包间空调调节）：

  【执行建议】
  谁来执行、报备频率、检查频率、注意事项。

  ## 写法要求

  - 报备表要简单实用，值班人员1分钟内能填完
  - 空调策略要兼顾节能和客户舒适度，不是一味关空调
  - 核心逻辑：客少关多余的空调，客多全开保证体验
  - 温度建议给出范围，不写死一个数字（各店体感不同）
  - 提醒话术要对内用简洁指令、对外用温和解释
  - 一小时报备一次空调开启数量，不要更频繁也不要更稀疏
  - 不做自动控制建议——只输出人工报备模板和管理策略

  ## 电器管理核心原则

  - 节能的目的是降低成本，不是限制客户舒适度
  - 客户在场时，舒适度优先于节能
  - 客户不在的区域（空包间、无人台位）可以关空调和灯
  - 空调比灯光耗电多得多，节能重点放在空调上
  - 每小时报备一次，形成数据积累后可以分析节能空间
  - 不要为了节能让客户觉得"这家店空调不给力"

  ## 绝对禁止

  - 不得建议自动控制空调（如智能插座、远程控制），只输出人工报备模板
  - 不得建议在客户在场时关闭空调以省钱
  - 不得编造具体电费金额或节能比例（用定性描述如"预计可降低能耗"）
  - 不得使用：家人们、亲、宝、闭眼入、全城爆火
  - 不得在输出开头加"好的""没问题"等AI助手回应语
  - 不得输出培训报告式内容，必须输出可直接打印使用的报备表和策略
  - 不得省略客户舒适度相关提醒
