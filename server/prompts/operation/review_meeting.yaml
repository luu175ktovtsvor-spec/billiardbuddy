key: "operation.review_meeting"
name: "球房复盘会模板"
category: "operation"
domain: data-analysis
freedom: red_line
tags: [scene:复盘, role:店长]
variables:
  - store_name
  - meeting_type
  - period
  - key_metrics
template: |
  你是一位台球行业运营专家，请根据以下信息为球房生成一次"阶段性目标分析、跟踪、复盘"方案。

  门店名称：{store_name}
  会议类型：{meeting_type}（日复盘/阶段性复盘）
  复盘周期：{period}
  关键指标：{key_metrics}

  ## 门店定位差异（影响复盘重点）

  - 社区球房：复盘侧重客流量稳定性、老客复购率、社区口碑、人情味服务
  - 商业球房：复盘侧重会员转化率、客单价、服务满意度、品质体验
  - 竞技球房：复盘侧重赛事参与度、助教上钟率、竞技客户占比、赛事效果
  - 竞技商业球房：复盘兼顾运营指标和竞技活动效果，关注客户结构均衡度

  ---

  ## {store_name} {period} 阶段性目标复盘

  复盘三件事：**阶段性目标分析 → 跟踪执行情况 → 复盘改进**。围绕店长四大数据（助教数据 / 教练数据 / 前厅数据 / 总营业额数据）展开，对照阶段目标看达成、找差距、定下一步。

  ---

  ### 一、核心经营数据复盘

  对照阶段目标，逐项看达成率：

  | 指标 | 本期数据 | 目标值 | 达成率 | 环比上期 |
  |------|---------|-------|--------|---------|
  | 营业额（及利润） | | | | |
  | 台费（团购占比 %） | | | | |
  | 助教费 | | | | |
  | 商品费 | | | | |
  | 器材费 | | | | |
  | 充值金额 | | | | |
  | 客流量 / 开台数 | | | | |
  | 会员新增 / 散客转化 | | | | |

  补充关注：日均营业额、日均台费、客流高峰时段（如晚 8-10 点）、平均停留时长。

  ---

  ### 二、助教数据复盘

  - 助教到岗数、上钟数、上桌率
  - 平均陪打时长
  - 助教费贡献
  - 服务话术与技能提升进展
  - 红线提醒：助教只做正规陪打/陪练与教学服务，自尊自爱，不做擦边、不涉任何实际性交易；门店不当庄、不组织对赌、不抽水。发现苗头当场制止并记录。

  ---

  ### 三、教练与会员数据复盘

  - 教练带来的台费、器材销售、团购好评
  - 约客到店人数（如 13/88 这类"邀约/到店"口径）
  - 会员活跃度、到场人数
  - 课程转化、学员进阶效果
  - 小游戏受欢迎程度及参与度
  - 赛事参与度与效果

  ---

  ### 四、前厅数据复盘

  - 台费收入明细（分时段/桌型）、商品费、电费、器材损耗
  - 服务流程：有无客诉，客诉处理效率
  - 卫生与环境：台面清洁、巧粉放置、设备完好度
  - 设备维护：故障次数与维修情况
  - 客户反馈：美团/大众点评/抖音评价、好评数、门店评分

  ---

  ### 五、问题诊断与改进

  按优先级把问题摆出来，逐条定方案、责任人、时间：

  | 问题描述 | 原因分析 | 解决方案 | 负责人 | 完成时间 |
  |---------|---------|---------|--------|---------|
  | | | | | |

  优先处理直接影响营收/客户体验的问题（如设备维护不及时导致客诉、台费定价偏高、助教排班冲突）。

  ---

  ### 六、下一阶段目标与跟踪

  - **目标设定**：营业额（细分平日/周末）、台费均价、助教上钟/上课费、教练约客到店、一卡通充值推广、成本控制（人员/电费/器材损耗/成材率）
  - **行动计划**：前厅做活动落地、教练推体验课/约客、助教强化服务话术
  - **跟踪机制**：明确每项的责任人和时间节点，下次复盘对照本次目标看执行，形成"目标→跟踪→复盘"闭环
