key: "operation.review_meeting"
name: "球房复盘会模板"
category: "operation"
variables:
  - store_name
  - meeting_type
  - period
  - key_metrics
template: |
  你是一位台球行业运营专家，请根据以下信息为球房生成复盘会方案。

  门店名称：{store_name}
  会议类型：{meeting_type}（日复盘/月复盘/季度复盘/年复盘）
  复盘周期：{period}
  关键指标：{key_metrics}

  ## 门店定位差异（影响复盘重点）

  - 社区球房：复盘侧重客流量稳定性、老客复购率、社区口碑、人情味服务
  - 商业球房：复盘侧重会员转化率、客单价、服务满意度、品质体验
  - 竞技球房：复盘侧重赛事参与度、助教上钟率、竞技客户占比、赛事效果
  - 竞技商业球房：复盘兼顾运营指标和竞技活动效果，关注客户结构均衡度

  ---

  ## {store_name} {period} {meeting_type}会议方案

  ---

  ### 一、会议筹备

  #### 1. 明确会议主题和目的
  - 全面梳理复盘周期内球房经营情况
  - 深入分析问题根源
  - 制定针对性改进措施
  - 提升球房运营效率与盈利能力

  #### 2. 数据收集与整理

  **经营数据：**
  - 财务数据：营业额、成本（水电、人工、耗材）、毛利率、会员充值金额
  - 客流量数据：每日进店人数、高峰时段分布（如晚 8-10 点）、平均停留时长
  - 转化数据：散客转会员比例、套餐购买率

  **客户反馈：**
  - 线上渠道：美团/大众点评评价、社交媒体留言、私域社群反馈
  - 线下渠道：前台投诉建议、会员访谈记录
  - 整理方法：将负面反馈分类（服务态度、设备问题、价格争议），统计高频关键词

  **运营细节数据：**
  - 设备维护：台球桌故障次数、维修成本、配件更换频率
  - 员工表现：服务评分、排班效率
  - 活动效果：促销活动参与人数、拉新转化率

  **竞品情报（周边 3 公里）：**
  - 定价策略、新活动形式、设备升级动态

  #### 3. 参会人员分工

  | 角色 | 必须参加 | 需准备材料 |
  |------|---------|-----------|
  | 店长 | 是 | 整体经营数据、行动计划 |
  | 前厅主管 | 是 | 服务流程反馈、卫生环境数据、设备维护记录 |
  | 教练负责人 | 是 | 会员活跃度、约客数据、小游戏效果 |
  | 助教管理 | 是 | 助教到店数、上桌率、技能培训进展 |
  | 会议记录人 | 是 | 全程记录，24 小时内整理发送全员 |

  #### 4. 场地与物料准备
  - 投影仪、电子屏、网络完好
  - PPT 或 Excel 数据可视化图表
  - 打印关键数据报表、客户评价摘要、行动计划模板
  - 白板及问题清单模板

  #### 5. 会议通知与预热
  - 提前发送相关文档、报告、数据给参会人员
  - 内部群发起匿名问卷，收集员工痛点

  ---

  ### 二、日复盘流程

  #### 1. 开场
  - 店长明确会议目标：总结当日经营情况、发现问题、提出改进措施
  - 强调纪律：聚焦问题、高效沟通、避免发散

  #### 2. 核心数据汇报

  | 指标 | 当日数据 | 目标值 | 达成率 | 同比昨日 |
  |------|---------|-------|--------|---------|
  | 客流量 | | | | |
  | 营业额 | | | | |
  | 会员新增 | | | | |
  | 开台数 | | | | |
  | 商品费 | | | | |
  | 上课费 | | | | |

  #### 3. 前厅运营复盘
  - 服务流程：有无客诉
  - 卫生与环境：台面清洁、巧粉放置
  - 设备维护：故障与维修

  #### 4. 教练与会员服务复盘
  - 会员活跃度、到场人数
  - 约客人数
  - 小游戏受欢迎程度及参与度

  #### 5. 助教管理复盘
  - 助教到店数、上桌率
  - 技能提升培训进展

  #### 6. 全体管理层复盘（八个问题）
  1. 今天都做了什么？
  2. 所做的事情分别有什么产出？
  3. 做这些事情，分别花了多少时间？
  4. 哪些是应该做的？哪些是不应该做的？
  5. 遇到什么问题？分别是什么原因造成的？
  6. 应该做的事情还有更好的方式吗？
  7. 在时间花费上，还有哪些方面需要改进？
  8. 今天想明白的一个道理/启发

  #### 7. 问题讨论与解决方案
  - 全体成员逐条讨论
  - 形成《问题解决行动计划表》

  | 问题描述 | 解决方案 | 负责人 | 完成时间 |
  |---------|---------|--------|---------|
  | | | | |

  #### 8. 次日重点工作安排
  - 店长根据复盘结果优化次日工作

  #### 9. 会议总结与反馈
  - 确认行动计划责任人和时间节点
  - 参会人员对流程提出改进建议

  ---

  ### 三、月复盘流程

  #### 1. 会议目标
  - 回顾上月经营数据与目标完成情况
  - 分析运营问题并提出改进方案
  - 制定下月工作计划与目标
  - 协调各部门协作需求

  #### 2. 会议开场
  - 店长公布上月核心经营数据速览（营业额、客流量、会员转化率等）

  #### 3. 部门汇报

  **前厅运营汇报（前厅主管）：**
  - 台费收入明细（分时段/桌型）
  - 商品销售数据
  - 客户投诉与建议汇总
  - 设备维护情况
  - 高峰期服务效率评估

  **教练组汇报（教练负责人）：**
  - 约客到店人数、会员人数
  - 课程时间安排合理性
  - 学员进阶效果反馈

  **助教管理汇报（助教负责人）：**
  - 服务时长统计
  - 客户满意度评分
  - 技术提升/服务话术问题

  #### 4. 问题分析与改进

  **优先级 1 问题（直接影响营收/客户体验）：**
  例：台球桌维护不及时导致客诉
  解决方案：建立每日设备检查清单

  **优先级 2 问题（流程优化类）：**
  例：助教交接班时间冲突
  解决方案：调整排班表并设置重叠时段

  #### 5. 下月计划制定

  **目标设定：**
  - 营业额目标（细分到平日/周末）
  - 会员卡推广数量
  - 助教上课费目标
  - 教练约客到店指标

  **行动计划：**
  - 前厅：规划周末促销活动
  - 教练组：推出新手体验课套餐
  - 助教：组织服务礼仪培训

  #### 6. 总结与分工
  - 店长汇总关键决策
  - 明确责任人与时间节点

  #### 7. 待办事项清单

  | 待办事项 | 负责人 | 截止日期 |
  |---------|--------|---------|
  | | | |

  ---

  ### 四、季度/年复盘流程

  #### 1. 会前准备
  - 年度/季度财务数据（营收、成本、利润）
  - 会员增长/流失统计表
  - 活动执行效果报告
  - 客户投诉及满意度调查结果
  - 设备维护记录

  #### 2. 整体运营汇报（店长）
  - 营收对比（同比/环比）
  - 客流量高峰时段分析
  - 会员卡销售占比
  - 亮点与不足分析

  #### 3. 部门专项汇报
  - 前厅：服务投诉处理效率、卫生检查结果、耗材成本
  - 教练+助教：助教留存率、上桌数、会员活跃度、培训考核结果

  #### 4. 问题诊断与讨论
  - 分组讨论（每组 10 分钟讨论，5 分钟汇报）

  | 讨论组 | 议题 |
  |-------|------|
  | 前厅组 | 如何降低非会员散客流失率？ |
  | 教练客户经理组 | 如何提升散客转化率？ |

  - 店长汇总并分配责任人

  #### 5. 下一周期目标与计划

  **目标设定：**
  - 营收目标：季度分解指标
  - 会员增长：细化至月度
  - 成本控制：设备维修预算压缩目标

  **行动计划：**
  - 活动规划：季度主题赛事
  - 培训计划：每月 1 次服务话术培训

  #### 6. 表彰与激励

  | 奖项名称 | 适用岗位 | 评选标准 |
  |---------|---------|---------|
  | 最佳服务奖 | 前厅员工 | 客户好评率数据佐证 |
  | 教学贡献奖 | 教练/助教 | 课程销量数据佐证 |

  - 颁奖词需有数据佐证
  - 表彰名单张贴于员工休息区

  #### 7. 会议总结与任务分配
  - 店长重申核心目标与时间节点
  - 下发年度任务责任书
  - 会议纪要 48 小时内邮件同步
  - 下次进度检查时间确认

  #### 8. 会后跟进
  - 资料归档：会议记录、决议文件存入共享盘
  - 任务追踪：使用甘特图监控执行进度
  - 公示结果：表彰名单张贴于员工休息区