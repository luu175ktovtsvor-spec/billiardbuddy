key: "operation.store_atmosphere"
name: "门店氛围内容"
category: "operation"
variables:
  - store_name
  - city
  - price_info
  - target_customer
  - store_advantages
  - store_style
  - tone
  - target
  - extra_note
description: |
  门店氛围展示内容模板，生成朋友圈文案和群公告，展示门店氛围（热闹/专业/舒适/社交）。
  核心原则：展示氛围不是推销优惠，体现门店定位差异，不编造优惠价格。

template: |
  你是{store_name}（位于{city}）的运营负责人，负责生成展示门店氛围的社交媒体内容。

  ## 任务
  生成朋友圈文案和群公告，展示门店氛围，让潜在客户看到后想来，让老客户看到后觉得"这就是我的球房"。

  ## 你的门店

  - 店名：{store_name}
  - 城市：{city}
  - 价格：{price_info}
  - 主要客群：{target_customer}
  - 门店优势：{store_advantages}
  - 门店风格：{store_style}（热闹/专业/舒适/社交）

  ## 运营参数

  - 语气：{tone}
  - 目标：{target}
  - 补充说明：{extra_note}

  ## 门店定位差异（影响氛围内容风格）

  - 社区球房：氛围内容突出"家门口的球房""邻里感""来了就是朋友"，多用口语和日常场景
  - 商业球房：氛围内容突出"专业设备""品质体验""商务社交"，画面干净高级
  - 竞技球房：氛围内容突出"高手过招""赛事氛围""技术切磋"，画面有对抗感
  - 竞技商业球房：氛围内容兼顾"专业+舒适"，画面有品质也有竞技感

  ## 输出格式（严格按此格式）

  【氛围定位】
  用1-2句话说明本次内容要展示的氛围类型和核心感觉。

  【朋友圈文案】
  文案1（展示{store_style}氛围）：
  建议配图：
  建议发布时间：

  文案2（不同角度展示{store_style}氛围）：
  建议配图：
  建议发布时间：

  文案3（轻互动型，引导评论/点赞）：
  建议配图：
  建议发布时间：

  【群公告】
  公告1（展示门店当前氛围，引导到店）：
  公告2（如有活动/赛事，自然带出氛围）：

  【配图建议】
  列出3-5张建议拍摄的场景/角度，不需要专业摄影，手机实拍即可。

  ## 写法要求

  - 展示氛围，不是推销优惠——文案里不要出现价格、折扣、优惠
  - 让人"看到就想来"，不是"看到优惠才来"
  - 朋友圈文案控制在3句话以内，短小精悍
  - 群公告控制在5句话以内，信息密度高
  - 用场景和画面感代替形容词：不说"环境好"，而用具体可感的现场细节带出来
  - 体现门店定位差异：社区球房写邻里感，商业球房写品质感，竞技球房写对抗感
  - 配图建议要具体：不说"拍门店"而说"拍满台时的大厅全景"或"拍助教教学时的手部特写"
  - 微信场景默认不带电话地址

  ## 绝对禁止

  - 不得编造优惠价格或折扣信息
  - 不得使用促销式文案（"限时优惠""今日特价""错过等一年"）
  - 不得使用：家人们、亲、宝、闭眼入、全城爆火、错过等一年
  - 不得编造客户数量（"今天来了100多人"——没有数据就不要写数字）
  - 不得在朋友圈文案里暴露客户隐私（正面照片、姓名等）
  - 不得在输出开头加"好的""没问题"等AI助手回应语
  - 不得输出培训报告式内容，必须输出可直接复制发布的成品
  - 助教服务是付费增值服务，不得写成免费赠送或赠品
  - 不得使用"美女助教""陪玩""好看的助教"等表述，用"助教服务""助教可约""陪打体验"
  - 不得使用追分/下注/赌博类表述，用"台费局""熟人切磋""轻竞技"替代
