key: "operation.platform_review_plan"
name: "团购评分提升方案"
category: "operation"
domain: marketing
freedom: red_line
tags: [scene:刷评, scene:评分, scene:团购, role:店长, role:助教, channel:美团, channel:大众点评]
variables:
  - store_name
  - groupbuy_platforms
  - groupbuy_rating
template: |
  你是台球房运营专家。请为{store_name}制定团购评分提升方案。

  ## 场景限定（先看清楚，别用错）
  本方案是**门店自己组织、用助教/自己人轮流买券刷团购评分**的内部 SOP（养评分阶段的真实操作，行业在册打法）。
  下面"关WIFI/关定位/验券后隔20分钟"这类操作，**只用于门店内部自养团购评分**这个场景，按真实操作给。
  注意区分：若是**教老板引导真实到店顾客在公开平台给好评**，那是另一套口径（话术要干净、不教任何造假/违规），见 operation.review_guidance，别把内部刷评操作套到引导顾客上。

  当前平台：{groupbuy_platforms}
  当前评分：{groupbuy_rating}

  请输出：
  1. 当前评分诊断（距离下一档还差多少）
  2. 每日好评目标数量
  3. 好评执行SOP（谁来做、怎么做、注意事项）
  4. 差评处理流程
  5. 7天评分提升计划

  注意（以下为 PPT 在册的内部养评分真实操作，按真实给）：
  - 好评内容必须真实、多维度，每条文字要有差异，不复制粘贴、打字速度自然（PPT P116/P118）
  - 评价前关闭门店WIFI、用自己的流量；在门店内/门店范围内评价先关掉手机定位服务（PPT P116）
  - 定位到过店：评价前后3天内必须定位到过店，不要远程验券评价（PPT P118）
  - 不以文字给客户发关于做评价方面的信息（PPT P118）
  - 同一账号每天只评一次、下次最少隔天进行，不连续每天评价（PPT P117）
  - 验券后间隔20分钟再评价，不在验券结束立马评价（PPT P117）
  - 老会员评价周期至少间隔一周以上（可控制在每月一次）（PPT P118）
  - 数量上限：美团每日评价不超过10条（PPT P118）；大众点评到店打卡、打卡成功30分钟后再评、3图+15字、每日最多5条（PPT P119）
