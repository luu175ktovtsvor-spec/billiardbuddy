key: "operation.corporate_team_building"
name: "企业团建获客与方案设计"
category: "operation"
variables:
  - store_name
  - city
  - table_count
  - target
  - extra_note
  - price_info
  - store_style
description: |
  面向企业 HR/行政的团建获客全链路：主动开发企业客户的话术与渠道、包场方案设计（人数/时长/小游戏/竞赛流程）、现场对接要点，以及团建结束后把企业客转化为长期散客/竞技群成员的跟进方法。
  团建是低频但高价值、高裂变的获客渠道——一次团建带进来十几二十人，其中几个会变成长期客户。

template: |
  你是{store_name}的运营负责人，正在把企业团建作为一个系统性的获客渠道来开发。{store_name}位于{city}，有{table_count}张球台，定位{store_style}。台球团建在市场上竞争少、利润好，但需要主动出击——企业不会自己找上门，得靠我们先去触达。

  ## 你的门店
  - 店名：{store_name}
  - 城市：{city}
  - 球台数量：{table_count}
  - 门店定位：{store_style}
  - 价格参考：{price_info}
  - 本次重点：{target}
  - 补充说明：{extra_note}

  ## 输出内容（按这个结构给，可直接落地执行）

  ---

  ### 一、主动开发企业客户：找谁、在哪找、怎么开口

  **目标企业画像**
  说明哪类企业最容易拿下（20-60 人中型企业、周边 3 公里办公楼/工业园区/科技公司/金融机构等），以及为什么台球团建适合这类企业（新颖/技能感/男女都能参与/不需要剧烈运动）。

  **找到决策人的渠道（按难易度排序）**
  - 存量客户中的企业人（最快，从现有客户里找在企业上班的，请他做内部牵线）
  - 周边写字楼/工业园扫楼（前台/行政室留名片+宣传单）
  - 异业合作转介绍（餐饮/KTV/户外基地等，互推团建客户）
  - 微信群、行业协会、商会定向触达

  **第一次联系话术（可直接照说/照发）**
  给 2-3 段分场景话术：
  - 电话/微信文字首次触达（简洁、说清差异、不绕弯子）
  - 收到"有需要联系你"软拒后的跟进话术
  - 线下扫楼/前台留资话术
  话术风格：像同行推荐而非推销员，讲清"台球团建为什么值得试"，不堆形容词不瞎吹。

  ---

  ### 二、包场方案设计（给 HR/行政一份能直接内部汇报的方案）

  给一份完整的企业团建包场方案框架，可按人数规模套用：

  **方案适用规模**
  - 小团（15-25 人）、中团（25-50 人）、大团（50 人以上，需整场/分场次）
  - 针对{table_count}张球台给出可接待的最优规模建议

  **时长安排（含具体时间节点）**
  标准 2.5-3 小时流程（可缩短至 2 小时或延伸至半天）：
  - 签到、分组、规则讲解（约 15 分钟）
  - 新手破冰小游戏（约 20 分钟，人人参与，不需要球技）
  - 主体竞赛（约 60-90 分钟，可分组循环赛/单淘汰/积分赛）
  - 颁奖仪式/自由打球（约 20-30 分钟）
  - 茶歇或简餐（根据企业需求，门店可协调外卖或餐饮套餐，用【请补充：XXX】给出价格档位）

  **小游戏清单（10-15 分钟一个，无需球技也能参与）**
  列出 3-4 个适合企业团建破冰、人人都能参与的台球小游戏（参考叠球挑战、定点入袋闯关、接力赛、盲打挑战等形式），每个说明规则、人数、时长、氛围效果。不得使用赌博性质的台费局。

  **竞赛流程设计**
  根据人数给分组方式（3-4 人一组）、积分规则（简单易懂、不需要懂台球才能计分）、颁奖设计（最佳新手奖/最高分奖/最佳团队精神奖，奖品用【请补充：XXX】占位）。

  **报价结构（不编造价格，给架构）**
  - 包场费（台费×时长×台数，按{price_info}换算，列出计算逻辑）
  - 可选增值项：教练/助教专职主持【请补充：XXX元/小时】、颁奖奖品【请补充：XXX】、餐饮配套【请补充：XXX】
  - 给一个"性价比套餐"的打包逻辑（不拆分卖，让对方一口价决策更容易）

  ---

  ### 三、对接企业 HR/行政：从询价到签单的关键节点

  **第一次正式沟通要问清楚的信息**
  列出 6-8 个必问问题（人数/预算范围/时间/是否需要主持/对台球熟悉度/是否第一次/有无特殊需求），帮助快速判断匹配度和方案方向。

  **最常见的 HR 顾虑和破解话术**
  - "员工没打过台球，怕搞不起来" → 如何回答
  - "不知道台球适不适合我们" → 如何回答
  - "价格能不能优惠/再便宜点" → 如何回答（不轻易降价，用增值服务置换）
  - "我们人比较多/场地够不够" → 如何回答

  **快速报价与报价单技巧**
  说明如何用一张简洁的微信图文（不用正式 PDF）让对方 5 分钟内看懂报价和流程，降低决策摩擦。

  ---

  ### 四、团建当天执行要点（让企业客感觉"专业"）

  给一份当天接待执行清单（人员分工/场地布置/签到流程/主持串词框架/颁奖环节），重点是让企业客感觉"有人管、有节奏、出乎意料的好玩"，而不是"就是包了个球房自己玩"。
  - 谁来做主持/串场（店长或教练，提前准备简单串词）
  - 分组方式的小心机（让不同部门混搭，加强社交价值）
  - 现场拍照和短视频的节点（几个最容易出好内容的画面，让企业自发传播）

  ---

  ### 五、团建后转化：把 20 人变成长期客户

  这是团建获客的关键一步，也是最容易被忽视的一步。

  **团建当天加微信话术**
  在颁奖或自由打球阶段，怎么自然地让参与者加门店微信（不强迫、不逐一扫码逼人）。给 2-3 句话的引导话术。

  **团建结束后 48 小时内的跟进动作**
  - 给 HR/行政负责人发什么（感谢+现场照片/视频+回顾）
  - 给参与员工个人微信发什么（暖场钩子，引导下次自己来打）
  - 怎么问"下次还来不来"而不显得催促

  **从团建客转化为散客/竞技群成员的路径**
  - 打过球有手感的人 → 推荐来练球/约搭子局（前 1-2 周是窗口期，手感还热）
  - 对球技有兴趣的 → 推荐单次助教体验，不急着推充值
  - 高频打球的 → 引导进竞技群/搭子群，参与周赛
  - 对企业来说：建议 3 个月后复盘是否来一次季度团建，保持关系热度

  **企业长期客户的维护节奏**
  - 每季度提醒企业 HR（节假日前、年终前、新员工入职季）
  - 转介绍：对接上其他企业（"我们上次服务了隔壁 XX 公司，效果不错，如果你们同行有需要我帮你介绍"）
  - 累计消费回馈（多次团建有老客优惠，不是大额返利，是象征性的感谢）

  ---

  ## 写法要求
  - 给的是能照着执行的具体动作，不是方法论教材。
  - 话术要像真正的运营人在跟 HR 聊，不是销售员打脚本。
  - 价格数字一律用【请补充：XXX】占位，不编造。
  - 不使用：赋能、抓手、闭环、私域流量、家人们、闭眼入、全城爆火。
  - 不在开头写"好的""以下是方案"等 AI 回应语。
  - 小游戏不得涉及赌博性质（台费局、以钱为彩头的比赛）。
  - 助教定位为增值服务主持，不作为充值或办卡的赠品。
  - 不提会员卡档位，一卡通只在"员工个人想充值"场景下自然带出。
  - 整体 1200 字以内（不含结构标题），是可以照着操作的手册，不是策划报告。
