  - cooperation_type
template: |
  你是一位台球行业运营专家，请根据以下信息为球房生成助教 IP 合作方案建议。

  门店名称：{store_name}
  助教姓名：{coach_name}
  合作类型：{cooperation_type}

  ## 门店定位差异（影响IP合作方向）

  - 社区球房：IP合作侧重社区亲和力，内容接地气，展示日常服务
  - 商业球房：IP合作侧重品质和专业，内容体现品牌调性
  - 竞技球房：IP合作侧重竞技技术展示，内容突出球技和赛事
  - 竞技商业球房：IP合作兼顾品质和竞技，内容展示"专业+舒适"

  ---

  ## {store_name} - {coach_name} IP 合作方案建议

  **声明：本方案仅为经营参考建议，不构成法律文件。正式合作前请咨询专业律师起草法律协议。**

  ---

  ### 一、合作模式概览

  台球助教 IP 合作是球房与助教之间的商业合作关系（非劳动关系），围绕助教在全平台自媒体账号的运营及相关商业业务展开。

  可选合作类型：
  - 独家全平台合作：球房独家代理助教全平台账号运营与商业业务
  - 内容共创合作：球房提供拍摄支持与流量扶持，助教负责内容产出
  - 培训孵化合作：球房从零培养助教 IP，提供全程培训与资源

  ---

  ### 二、合作内容建议

  #### 1. 账号归属
  - 合作期内，助教在全平台（包括但不限于抖音、微信、视频号、小红书、快手等）已开设及后续开设的自媒体账号，运营权归球房
  - 后续新开设账号由球房负责注册，助教配合提供资料
  - 球房为助教在约定区域内唯一经纪方

  #### 2. 业务范围
  - 广告业务：助教账号的广告合作由球房统一接洽与签约
  - 电商业务：助教账号的电商店铺（淘宝、微店、视频号等）由球房统一运营
  - 知识付费业务：助教身份下的线上课程（抖音直播间售课、短视频售课等）由球房统一运营
  - 直播业务：助教直播的运营策划与商业合作由球房统一接洽

  #### 3. 内容产出
  - 球房协助助教进行内容定位与规划
  - 球房提供拍摄支持、包装宣传、媒体公关
  - 助教配合球房工作安排，保证内容更新频率
  - 内容风格参考：专业/可爱/飒爽/潮酷，根据助教特质定位（禁止性感擦边方向）

  ---

  ### 三、合作期限建议

  - 有效期建议 1-2 年
  - 到期前 3 个月双方商议续约事宜，球房有优先续约权
  - 任何原因提前终止，已完成业务按约定据实结算

  ---

  ### 四、收益分配参考

  收益分配基数 = 助教全网平台账号产生的纯利润

  | 分配方式 | 球房占比 | 助教占比 |
  |---------|---------|---------|
  | 独家全平台合作 | [请填写]% | [请填写]% |
  | 内容共创合作 | [请填写]% | [请填写]% |
  | 培训孵化合作 | [请填写]% | [请填写]% |

  收益包含范围：
  - 助教各平台账号的广告、直播、打赏等收入
  - 由平台账号发展的线下粉丝及微信粉丝产生的变现收入

  支付方式：
  - 球房在收到第三方支付的相应款项后，于次月 15 日前进行收益分配
  - 各自承担相应税费

  ---

  ### 五、球房权利义务

  #### 权利
  - 安排、接洽、签署与助教 IP 事业相关事宜
  - 知晓助教在各平台动态的真实情况
  - 免费使用助教肖像、声音、个人资料用于球房各项业务及宣传活动

  #### 义务
  - 以专业态度全力配合助教发展
  - 积极寻求商业价值点，努力创造利益
  - 维护助教的经济利益、名誉和公众形象
  - 保证所安排的各项 IP 事业不涉及违法违规内容

  ---

  ### 六、助教权利义务

  #### 权利
  - 按约定获得相关收益
  - 查看球房代签的合同原件

  #### 义务
  - 保持良好个人形象与声誉
  - 不参与损害公众形象的活动（包括涉毒、涉黄、赌博、违反公序良俗等）
  - 合作为独家且排他，不与第三方进行同类合作
  - 接到第三方邀约时立即向球房披露
  - 按约定频率更新原创内容，保证质量
  - 保证内容不侵犯第三人知识产权

  ---

  ### 七、知识产权约定

  - 合作期内，助教账号已发布及未发布的所有内容（视频、图文、音像等）的著作权归双方共同所有
  - 助教肖像权归助教本人，球房拥有在合作期内的专有使用权
  - 球房有权授权第三方使用助教肖像、声音等

  ---

  ### 八、引流渠道建议

  #### 内容平台引流
  - 抖音：短视频+直播，展示球技和门店氛围
  - 视频号：私域触达，会员服务展示
  - 快手：下沉市场，接地气内容
  - 小红书：种草笔记，门店环境展示

  #### 核心思路
  - 公域引流→私域导流→社群维护
  - 内容方向：台球技术教学、门店日常、赛事活动、助教风采（专业方向）

  ---

  ### 九、违约处理参考

  - 助教公开诋毁球房、违法违规、泄露保密信息等，球房有权解除合作
  - 助教私自与第三方合作，所得收益归球房，行为达 3 次球房有权解除合作
  - 球房一个月内未为助教拍摄运营内容、要求助教从事违法活动等，助教有权解除合作
  - 违约金参考：按未完成合作期内预计总收入计算，上下限建议咨询律师

  ---

  ### 十、注意事项

  1. 以上为经营参考建议，具体法律条款请由专业律师审核
  2. 收益分配比例因品牌、投入、地区差异较大，需根据实际协商
  3. 明确约定合作是商业合作而非劳动关系
  4. 明确约定线下活动业务与球房 IP 合作的关系
  5. 保留合作期内的财务透明机制