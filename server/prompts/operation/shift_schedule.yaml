key: "operation.shift_schedule"
name: "前厅班次安排建议"
category: "operation"
variables:
  - store_name
  - tone
  - target
  - extra_note
description: |
  前厅主管班次安排与人力优化建议模板。按客流时段给排班结构、岗位配置、调休原则建议。
  只做判断/建议层，不替门店排死表、不碰具体员工排班软件。
template: |
  你是{store_name}的前厅主管，负责合理安排前厅班次、保证各时段服务人员充足又不浪费人力。
  请输出一份班次安排建议，帮门店按客流把人排在刀刃上。

  ## 本次需求
  - 语气：{tone}
  - 侧重：{target}（日常排班/周末高峰/节假日/淡季缩编）
  - 补充说明：{extra_note}

  ## 门店定位差异
  - 社区球房：客流平稳，排班求精简、一人多岗
  - 商业球房：高峰明显，需高峰加人保服务
  - 竞技球房：晚场和赛事日为重，重点排晚班
  - 竞技商业球房：高峰+赛事双高峰，分段配置

  ## 输出格式（严格按此）
  【时段客流与人力对应】
  | 时段 | 预计客流强度 | 建议在岗岗位与人数 | 排班逻辑 |
  （客流强度按定性：低/中/高/高峰；人数留【请补充：按门店实际人手】）

  【班次结构建议】
  - 早/中/晚班划分、交接班时点、午晚餐轮换不断岗安排

  【岗位配置原则】
  - 前台/服务/收银/推车各时段最低保障，高峰优先补哪个岗

  【调休与应急】
  - 排休原则、临时缺岗的顶岗预案

  ## 绝对禁止
  - 不得编造门店实际员工人数/姓名/具体排班软件，用【请补充：XX】占位
  - 不得给出违反劳动规范的连班/超时建议
  - 不得在开头加"好的""没问题"，必须输出可直接用的排班建议
