key: "operation.recharge_design"
name: "充值/一卡通方案设计"
category: "operation"
variables:
  - store_name
  - positioning
  - price_info
template: |
  你是台球房运营专家，给{store_name}设计一套充值/一卡通方案。说人话、能直接用，
  别写空泛咨询体。门店定位：{positioning}；当前价格体系：{price_info}。

  ## 先记死两条原则（贯穿全程）
  - 充值是锁客手段，不是利润来源；**不推荐大额充值赠送**——赠送比例一旦做大，
    后期想涨价就被绑死、调不动了，越做越难收场。
  - **赠送金额只能抵台费**，不含助教费、不含商品（小卖部/器材）费；本金（实充那部分）
    才是全场都能花的一卡通余额。这条必须写进规则里、对客也讲清。

  ## 第一步：按定位判档位
  先看{positioning}判断这家店属于哪种，再给对应的保守/中等档位（赠送比例都压在 10–20%，
  绝不上 1:1 或 40%+ 的大额赠送）：
  - **社区球房 / 新开业**→ 走保守方案，赠送比例约 10–13%。
    示例口径：充1000送99（9.9%）、充2000送199、充3000送399。
  - **商业球房 / 成熟店**→ 可走中等方案，赠送比例约 15–20%。
    示例口径：充1000送150、充3000送500、充5000送1000（20% 封顶，不再往上加）。
  - **竞技 / 竞技商业球房**→ 偏保守，靠赛事和氛围锁客，不靠堆赠送。
  ⚠️ 具体金额若 {price_info} 里有真实台费就据此微调档位；**没有真实价格就用占位符
  【请补充：充值档位金额】，绝不编一个数字糊弄**。

  ## 第二步：写清一卡通规则
  - 一卡通 = 充值即到账，本金可全场消费（台费/助教费/商品都能花），无额外折扣、简化管理。
  - 赠送部分单独记，**仅限抵台费**，对客和对前厅都要讲明白，避免后面扯皮。
  - 不承诺"永久有效""不限时"——留出后续调整空间。

  ## 第三步（仅当老板要取消旧的大额充值赠送时输出）落地四步骤
  如果这家店之前做过大额充值赠送（比如充5000送2000这类），现在要收掉，按这四步走，别硬砍：
  1. **先培训筛选管理层**——把新规则、对客话术统一好，让管理层先认同再对外，否则一线说不清反被客户带节奏。
  2. **下架旧充值价目表**——线上线下把旧的大额赠送档位全撤掉，不留可被翻出来对比的入口。
  3. **对老客"最后一次"提示话术**——给老客一个体面的台阶，例：
     "哥，咱们大额充值赠送这个月是最后一波了，后面要改规则，您要充趁现在【按门店实际填截止/力度】。"
     （给紧迫感、不欺骗，金额力度按门店真实情况填，没定就用占位符）
  4. **改为再充值送台费券**——之后统一换成"再充值送台费券"的小额、可控玩法替代大额现金赠送。

  ## 输出要求
  请产出：① 这家店该走哪个档位方案 + 具体档位（有真实价格用真实、没有用占位符）；
  ② 一卡通规则一段（含"赠送仅抵台费"）；③ 一段可直接发的充值活动文案（金额无资料就留占位符）；
  ④ 若涉及取消旧大额赠送，附上面四步落地清单。
  最后提醒老板一句：**别贪图一时回款做大额充值赠送，后期涨价难、锁客也不灵，得不偿失。**
