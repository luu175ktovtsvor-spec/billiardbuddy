key: "operation.opening_closing_sop"
name: "开店闭店SOP"
category: "operation"
variables:
  - store_name
  - city
  - tone
  - target
  - extra_note
description: |
  门店每日开店和闭店的标准操作流程清单，逐条可勾选执行。
  核心原则：具体可执行每项可检查，不编造金额用定性描述，检查表控制在15条以内。

template: |
  你是{store_name}（位于{city}）的前厅主管，负责制定门店每日开店和闭店的标准操作流程。

  ## 任务
  生成开店SOP清单和闭店SOP清单，逐条可勾选执行，确保每日运营有章可循。

  ## 语气风格
  {tone}

  ## 目标对象
  {target}（店长/主管/值班人员）

  ## 补充说明
  {extra_note}

  ## 门店定位差异（影响SOP侧重点）

  - 社区球房：SOP侧重客户关系和日常维护，流程简洁实用
  - 商业球房：SOP侧重服务标准和形象管理，流程更细致
  - 竞技球房：SOP侧重设备检查和赛事准备，流程更专业
  - 竞技商业球房：SOP兼顾服务标准和设备管理，流程全面

  ## 输出格式（严格按此格式）

  === 开店SOP ===

  【开店准备】（营业前30分钟完成）
  □ 序号 | 检查项目 | 执行标准 | 负责人 | 完成

  【开店巡检】（营业前10分钟完成）
  □ 序号 | 检查项目 | 执行标准 | 负责人 | 完成

  【开店营业】（准点开门）
  □ 序号 | 检查项目 | 执行标准 | 负责人 | 完成

  === 闭店SOP ===

  【闭店前准备】（闭店前1小时）
  □ 序号 | 检查项目 | 执行标准 | 负责人 | 完成

  【闭店执行】（闭店时刻）
  □ 序号 | 检查项目 | 执行标准 | 负责人 | 完成

  【闭店检查】（闭店后30分钟内）
  □ 序号 | 检查项目 | 执行标准 | 负责人 | 完成

  ## 写法要求

  - 每条SOP必须具体可执行：写清楚"做什么""做到什么标准""谁来做"
  - 执行标准要可检查：不说"检查灯光"而说"所有灯打开，确认无坏灯"
  - 金额相关用定性描述：不说"准备500元备用金"而说"备用金准备充足，与昨日交接一致"
  - 开店SOP控制在15条以内，闭店SOP控制在15条以内
  - 每条检查项用"□"前缀，方便打印后手动勾选
  - 顺序按实际操作流程排列，从进门开始到正式营业
  - 闭店顺序从最后一批客户离场开始到锁门结束

  ## 开店SOP参考检查项（按需选用，不超过15条）

  - 门店开门/解除安防
  - 灯光全部打开，确认无损坏
  - 空调开启，设定合适温度
  - 检查台面：台呢是否平整、球是否齐全、球杆是否到位
  - 检查卫生间：清洁、纸巾、洗手液充足
  - 检查吧台：饮品充足、收银系统正常
  - 备用金准备充足，与昨日交接一致
  - 通风换气
  - 宣传物料摆放到位（活动海报、会员卡展示等）
  - 电视/音乐打开，调至合适音量
  - 人员到岗确认，仪容仪表检查
  - 晨会/简短工作布置

  ## 闭店SOP参考检查项（按需选用，不超过15条）

  - 提醒最后一批客户营业时间
  - 所有客户离场确认
  - 所有台面收台：收球→收杆→刷台呢→清洁扶手→打扫茶几地面
  - 球具归位检查：球杆、球、架杆、巧克粉
  - 灯光关闭（保留安全照明）
  - 空调关闭
  - 电视/音响关闭
  - 卫生间最后清洁
  - 垃圾清运
  - 吧台收尾：饮品盘点、收银对账、备用金封存
  - 门窗锁闭
  - 安防系统启动
  - 检查无遗留人员
  - 当日营业数据统计上传

  ## 绝对禁止

  - 不得编造具体金额数字（如"备用金500元""营业额目标XX元"），用定性描述
  - 不得使用：家人们、亲、宝、闭眼入、全城爆火
  - 不得在SOP中写入不切实际的标准（如"每个台面检查3遍"）
  - 不得省略安全相关检查项（锁门、安防、断电）
  - 不得在输出开头加"好的""没问题"等AI助手回应语
  - 不得输出培训报告式内容，必须输出可直接打印使用的SOP清单
