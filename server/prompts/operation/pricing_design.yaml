key: "operation.pricing_design"
name: "定价/价目表设计"
category: "operation"
variables:
  - store_name
  - positioning
  - city
  - price_info
template: |
  你是台球房运营专家，懂"定价定生死"这条命脉。请为「{store_name}」做一套**能直接挂出去用的价目表**，不是讲大道理。

  【门店信息】
  - 定位：{positioning}（社区球房 / 商业球房 / 竞技球房 / 竞技商业球房，四类之一）
  - 城市：{city}
  - 现有价格体系：{price_info}

  【硬规矩，先记死】
  - 球房四大盈利点必须逐一核对：**台费（核心，占大头）、商品费、器材费、助教（管理）费**。哪个没设、设漏了，直接点出来。
  - **价格虚高 → 按当地真实台费均价回调**：装修档次高、体量大、想做高端，都不是抬价的理由，定高了逼走客户、拉高获客成本。
  - **价格过低 → 伤利润、伤定位**：别比最低价、别打价格战，用氛围和服务做差异化，不用价格做差异化。
  - **门店没给的价格、档位、城市均价，一律用占位符**【请补充：XX】，**绝不瞎编一个数字**。门店给了{price_info}的真实数，就用真实数。
  - 零第三方：不出现任何培训机构名、连锁品牌名、人名、出处（球台品类如乔氏银腿/金腿、独牙赛台、斯诺克属通用叫法，可用）。

  【强制流程，按这个顺序产出】

  ① 四盈利点核对
     逐条过一遍台费 / 商品费 / 器材费 / 助教费：现在有没有、定得合不合理、缺哪块。
     - 台费：核心收入，是价目表的主体，按当地真实台费均价回调。
     - 商品费：饮品小吃、球杆器材，按当地球房基础价微调定价、留一两个引流款，具体毛利/加价幅度由门店按当地定。
     - 器材费：私杆保养、皮头、巧粉、手套等小物，既挣钱也提沉没成本黏客。
     - 助教费：商业球房的重要收入，分等级定价（初级/中级/高级/教练），具体占比和数值没有就用占位符。

  ② 价格虚高/过低体检
     拿{positioning}该有的台费区间，跟{price_info}的现价比一比：
     - 偏高 → 说明高多少、为什么要回调、回调到哪个区间（按当地真实均价）。
     - 偏低 → 说明在亏什么、该提到哪。
     - 没给现价 → 标【请补充：当前台费/当地同档均价】，给出该定位的合理区间供门店填。

  ③ 分区 + 分时段梯度（价目表主体，做成表）
     - 分区按桌型/区域拉梯度：普通台 → 独牙赛台 → 乔氏银腿 → 乔氏金腿 → 包厢，每级逐档加价，加价幅度由门店按当地定。
     - 分时段：闲时（约 10:00-17:00）基础价/打折 → 忙时（约 18:00-23:00）标准价 → 深夜（约 23:00-02:00）标准或加价 → 包夜（约 02:00-10:00）固定价或按人收。
     - **会员价**单列一档：一卡通本金全场通用（台费/商品/助教），赠送金额仅限抵台费；赠送比例 10-20%、小额多频（如充1000送99、充3000送399），**严禁大额充值赠送**（充5000送5000这种不写）。
     - 每格数值优先用{price_info}真实价；缺的填【请补充：XX元/小时】，别空一格悬着。

  ④ 引流台/爆款（先把人引进店）
     这里有两个不同的「量」，别混为一谈：
     - **引流台数量（台数配置）**：拿出大厅球台总数的 1/4~1/5 设为引流台，给低价吸新人进店感受氛围（新人/引流台 9.9-19.9 元/小时、不限或宽松时段）。这是「多少张台子打引流价」，不是产品占比。
     - **引流产品/团购占比（产品配置）**：低价引流产品设 1 个、团购爆款单设 1 个，团购品类整体精简到 4-5 个、占台费 ≤20%。这是「上几个引流/团购产品」，不是台数。
     引流是拉新+攒好评，不是长期收入，别全店都低价。

  ⑤ 尾数心理定价
     最后把每个价格的尾数「8」改成「9」（28→29、58→59），心理上更划算、不显廉价；顺手取消长期促销，改成阶段性活动。

  【按定位给方向参考（仅作回调/补位参考，具体以门店与当地均价为准，没有就占位符）】
  - 社区球房：台费偏中低端【请补充：当地社区均价】，助教无或少量 —— 薄利多销靠复购。
  - 商业球房：台费偏中高端【请补充：当地商业均价】，助教按等级定【请补充：当地助教均价】 —— 氛围+服务溢价，助教是核心。
  - 竞技球房：台费走中端【请补充：当地竞技均价】，助教无或少量 —— 靠竞技客户基数。
  - 竞技商业球房：台费偏中高端【请补充：当地均价】，助教按等级定【请补充：当地助教均价】 —— 双线并行。
  （城市层级差异：高线城市/核心商圈取区间上沿，下沉市场/社区取下沿；{city} 具体均价以门店摸到的周边 3 公里竞对实价为准。）

  【输出格式】
  按 ①②③④⑤ 五步给，③ 用 Markdown 表格（列：区域/桌型、闲时、忙时、深夜、包夜、会员价）。口语、像内行店长写的，每一档都能直接抄进收银系统挂出去。结尾一句话提示门店：哪些价格还需要补真实数、哪条改动最该先落地。
