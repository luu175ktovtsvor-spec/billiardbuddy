key: "operation.workbench_tasks"
name: "工作台任务卡片模板"
category: "operation"
variables:
  - store_name
  - role
  - date
template: |
  你是{store_name}的工作台助手。根据角色和日期，生成每日任务卡片。

  当前角色：{role}
  当前日期：{date}

  请按以下6个角色模板生成对应任务卡片。每个角色8-12个任务，按时间顺序排列，标注优先级。

  ## 门店定位差异（影响任务重点）

  - 社区球房：任务侧重客户关系维护、日常服务、社区氛围营造
  - 商业球房：任务侧重服务品质、会员转化、商务客户维护
  - 竞技球房：任务侧重赛事组织、助教管理、竞技氛围打造
  - 竞技商业球房：任务兼顾运营管理和竞技活动执行

  ---

  ## 店长每日任务卡片

  | 时间 | 任务 | 优先级 | 说明 |
  |------|------|--------|------|
  | 09:00 | 晨会主持 | 高 | 主持全员晨会，部署当日目标，传达公司通知 |
  | 09:30 | 经营数据复盘 | 高 | 查看昨日营业额、客流量、台费收入、商品销售数据 |
  | 10:00 | 人员排班确认 | 中 | 确认当日各岗位人员到岗情况，调整排班 |
  | 10:30 | 门店巡检 | 高 | 检查环境卫生、设备状态、灯光空调、安全隐患 |
  | 11:00 | 客户关系维护 | 中 | 处理客户投诉、回访重点客户、关注会员续费 |
  | 14:00 | 营销活动跟进 | 中 | 跟进当日活动执行情况，监控活动效果 |
  | 15:00 | 助教培训监督 | 中 | 检查助教培训执行情况，参与教学评估 |
  | 16:00 | 供应商对接 | 低 | 处理物资采购、设备维修、耗材补充 |
  | 17:00 | 营业高峰巡查 | 高 | 高峰时段现场管理，确保服务品质 |
  | 20:00 | 当日经营总结 | 中 | 汇总当日经营数据，分析异常情况 |
  | 22:00 | 闭店检查 | 高 | 检查门窗、水电、设备关闭，确认安全后方可离店 |

  ---

  ## 主管每日任务卡片

  | 时间 | 任务 | 优先级 | 说明 |
  |------|------|--------|------|
  | 09:00 | 参加晨会 | 高 | 参加店长主持的晨会，领取当日工作安排 |
  | 09:30 | 前厅人员管理 | 高 | 确认服务员到岗，分配当日区域和任务 |
  | 10:00 | 助教管理 | 高 | 确认助教到岗，安排练球和服务排期 |
  | 10:30 | 环境检查 | 中 | 检查台面整洁、球具完好、环境卫生 |
  | 11:00 | 服务标准监督 | 中 | 巡查各区域服务执行情况，纠正不规范行为 |
  | 14:00 | 助教集中教学 | 高 | 14:00-15:00集中教学，指导助教练球 |
  | 15:00 | 监督助教练球 | 高 | 15:00-16:00监督助教练球，给予反馈 |
  | 16:00 | 营业高峰前准备 | 中 | 检查物资、安排高峰时段人员部署 |
  | 17:00 | 高峰现场管理 | 高 | 现场协调，处理突发情况，确保运转顺畅 |
  | 19:00 | 助教工作统计 | 中 | 统计助教服务收入、练球情况，记录考勤 |
  | 21:00 | 交接班处理 | 中 | 与夜班人员交接，说明注意事项 |
  | 22:00 | 日终汇报 | 中 | 向店长汇报当日工作完成情况和问题 |

  ---

  ## 收银员每日任务卡片

  | 时间 | 任务 | 优先级 | 说明 |
  |------|------|--------|------|
  | 09:00 | 开班准备 | 高 | 登录收银系统，检查打印机、扫码设备，备用金清点 |
  | 09:30 | 开台管理 | 高 | 为到店客户开台，确认台号、计费标准 |
  | 10:00 | 收银结算 | 高 | 处理客户结账，台费、商品、助教服务费分别核算 |
  | 10:30 | 会员业务 | 中 | 办理新会员开卡、充值、续费、积分兑换 |
  | 11:00 | 商品销售 | 中 | 销售饮品零食等商品，确保库存充足 |
  | 14:00 | 助教服务开单 | 高 | 为助教服务开单，记录开始时间 |
  | 17:00 | 营业高峰收银 | 高 | 高峰时段高效收银，避免排队等待 |
  | 20:00 | 活动优惠核销 | 中 | 核对活动优惠券、团购券、会员折扣 |
  | 21:00 | 日终对账 | 高 | 清点现金、核对系统数据，确保账实相符 |
  | 22:00 | 营业数据上报 | 高 | 生成当日营业报表，交店长签字确认 |
  | 22:30 | 交接班 | 中 | 与夜班收银交接现金和待办事项 |

  ---

  ## 服务员每日任务卡片

  | 时间 | 任务 | 优先级 | 说明 |
  |------|------|--------|------|
  | 09:00 | 门店清洁 | 高 | 打扫大堂、包间、卫生间，擦拭台面和球具 |
  | 09:30 | 球具检查 | 高 | 检查球杆、台呢、球是否有损坏，及时报修 |
  | 10:00 | 客户引导 | 高 | 热情接待到店客户，引导入座、介绍台费标准 |
  | 10:30 | 台面服务 | 中 | 为客户提供摆球、递杆等服务，及时清理台面 |
  | 11:00 | 饮品配送 | 中 | 根据客户需求配送饮品零食，保持服务区域整洁 |
  | 14:00 | 区域巡查 | 中 | 巡查负责区域，及时收台、清洁、补充物资 |
  | 17:00 | 高峰服务 | 高 | 高峰时段全区域服务，确保客户需求及时响应 |
  | 19:00 | 环境维护 | 中 | 定时清洁卫生间、清理垃圾桶、补充纸巾 |
  | 21:00 | 收台整理 | 中 | 客户离场后及时收台、整理球具、擦拭台面 |
  | 22:00 | 闭店清洁 | 高 | 全面清洁门店，确保次日营业环境达标 |

  ---

  ## 助教每日任务卡片

  | 时间 | 任务 | 优先级 | 说明 |
  |------|------|--------|------|
  | 13:30 | 打卡签到 | 高 | 准时到岗打卡，更换工装，检查仪容仪表 |
  | 14:00 | 集中教学 | 高 | 14:00-15:00参加主管集中教学，认真听讲练习 |
  | 15:00 | 监督练球 | 高 | 15:00-16:00在主管监督下练球，按训练计划执行 |
  | 16:00 | 自由练习 | 中 | 16:00-17:00自由安排练习或对抗练习 |
  | 17:00 | 助教服务 | 高 | 按排期提供助教服务（专业陪练+技术指导+情绪价值），核心工作是营销获客 |
  | 17:30 | 客户互动 | 中 | 服务中主动与客户交流，介绍活动、推荐办卡、添加微信（助教核心：营销获客） |
  | 19:00 | 持续服务 | 中 | 继续为客户提供助教服务，注意服务质量和营销获客机会 |
  | 20:00 | 社群运营 | 中 | 拍摄短视频素材、维护客户群、回复客户消息 |
  | 21:00 | 服务收尾 | 中 | 完成当日助教服务，及时通知收银员结单 |
  | 21:30 | 训练记录 | 中 | 记录当日练球和服务情况，填写助教工作日志，统计营销获客数据 |
  | 22:00 | 下班交接 | 低 | 向主管汇报当日工作完成情况，交接待办事项 |

  ---

  ## 前台接待每日任务卡片

  | 时间 | 任务 | 优先级 | 说明 |
  |------|------|--------|------|
  | 09:00 | 开班准备 | 高 | 检查前台卫生、整理宣传物料、确认系统正常 |
  | 09:30 | 客户接待 | 高 | 热情接待到店客户，介绍收费标准、推荐一卡通充值 |
  | 10:00 | 电话接听 | 中 | 接听客户来电，解答咨询、预约登记 |
  | 10:30 | 会员推广 | 中 | 主动向客户推荐一卡通充值、活动优惠，完成充值 |
  | 11:00 | 开台引导 | 高 | 为客户开台、分配台号、告知计费规则 |
  | 14:00 | 助教预约 | 中 | 接收客户助教预约，协调助教排期 |
  | 17:00 | 高峰接待 | 高 | 高峰时段高效接待，减少客户等待时间 |
  | 19:00 | 活动推广 | 中 | 向客户介绍当日活动，协助活动执行 |
  | 21:00 | 客户离场处理 | 中 | 协助客户结账，引导评价、邀请加入客户群 |
  | 22:00 | 日终整理 | 低 | 整理前台区域、更新宣传物料、检查遗失物品 |
