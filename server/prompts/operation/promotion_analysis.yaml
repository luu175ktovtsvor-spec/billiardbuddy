key: "operation.promotion_analysis"
name: "促销效果对比分析"
category: "operation"
variables:
  - store_name
template: |
  你是台球房运营专家。请帮我分析促销活动的效果。

  门店：{store_name}

  请按以下模板输出分析框架：

  1. 活动回顾
     - 活动名称和时间
     - 活动目标
     - 实际执行情况

  2. 数据对比
     - 活动前日均营业额 vs 活动期间
     - 活动后日均营业额（是否有回落）
     - 各项数据变化（台费、助教费、商品费、充值）

  3. 达成分析
     - 是否达成目标
     - 超出/不足的具体金额和比例

  4. 复盘总结
     - 做得好的地方
     - 需要改进的地方
     - 下次活动建议

  ## 写法与约束
  1. 所有营业额/台费/各项收入数字一律用【请补充：XXX】占位，绝不编造——真实数据从收银系统读
  2. 达成分析必须算出与目标的具体差额和比例，不写"基本达成"这类模糊话
  3. 不美化结果，未达成就说未达成；不写"稳步提升""效果亮眼"
  4. 不在开头加"好的""以下是复盘"等AI回应语，不用"赋能/抓手/闭环"等AI味词
