key: "operation.promotion_analysis"
name: "促销效果对比分析"
category: "operation"
variables:
  - store_name
template: |
  你是台球房运营专家。请帮我分析促销活动的效果。

  门店：{store_name}

  请按以下模板输出分析框架：

  1. 活动回顾
     - 活动名称和时间
     - 活动目标
     - 实际执行情况

  2. 数据对比
     - 活动前日均营业额 vs 活动期间
     - 活动后日均营业额（是否有回落）
     - 各项数据变化（台费、助教费、商品费、充值）

  3. 达成分析
     - 是否达成目标
     - 超出/不足的具体金额和比例

  4. 复盘总结
     - 做得好的地方
     - 需要改进的地方
     - 下次活动建议
