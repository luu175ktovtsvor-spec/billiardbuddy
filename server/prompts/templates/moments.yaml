key: "templates.moments"
name: "朋友圈文案模板"
category: "copywriting"
templates:
  - label: "周末充值活动"
    prompt: "写一条周末充值活动的朋友圈文案，充300送50，语气活泼，带emoji"
    tags: ["充值", "周末"]
  - label: "下午场促活"
    prompt: "写一条下午场空台促活的朋友圈文案，下午2-6点特价，轻松休闲风格"
    tags: ["下午场", "促活"]
  - label: "赛事预告"
    prompt: "写一条台球比赛报名的朋友圈文案，中式八球周赛，奖金丰厚"
    tags: ["赛事", "报名"]
  - label: "新店开业"
    prompt: "写一条新店开业的朋友圈文案，盛大开业，优惠多多"
    tags: ["开业", "优惠"]
  - label: "日常氛围"
    prompt: "写一条台球房日常氛围的朋友圈文案，轻松休闲，约朋友打球"
    tags: ["日常", "氛围"]
