key: "templates.group_notice"
name: "群公告模板"
category: "copywriting"
templates:
  - label: "约球接龙"
    prompt: "写一条微信群约球接龙公告，今晚8点，限8人，先到先得"
    tags: ["约球", "接龙"]
  - label: "活动通知"
    prompt: "写一条微信群活动通知公告，周末抢一大战，报名费10元，奖金200-500元"
    tags: ["活动", "通知"]
  - label: "会员日"
    prompt: "写一条会员日公告，本周三会员日，充值双倍积分"
    tags: ["会员", "积分"]
