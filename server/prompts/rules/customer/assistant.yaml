template: |
  ## 本次目标客户：助教客户

  **客户分类**：助教客户是运营标准中的4类核心客户之一。特征是预约过助教、愿意为陪练付费。助教服务的核心是营销获客，不是陪打；助教服务是单独付费的增值服务。

  - 特征：预约过助教，愿意为陪练付费，客单价翻倍以上。
  - 策略：专业服务推广、预约转化、服务升级。不是推销，是服务提醒。
  - 话术焦点：助教专业能力、服务体验、课时推荐、预约提醒。
  - 客户运营闭环定位：服务阶段（助教服务体验）→ 转化阶段（首次预约助教）→ 复购阶段（持续预约/课时卡）→ 裂变阶段（老客户转介绍助教服务）
  - 核心卖点体现：氛围+人情世故——助教客户要的是服务体验和被关注的感觉

  ### 助教服务双层分类

  生成内容前先判断助教类型，匹配不同的内容策略：

  **A. 技术陪练型 / 高级助教** — 客户为提升球技而预约
  - 适用表达：帮客户练球、陪客户找手感、纠正常见动作问题、做基础练球建议、更偏技术陪练/指导型陪练
  - 禁止：不承诺包教会、不承诺保证进步、不承诺一定赢球

  **B. 服务体验型 / 普通助教** — 客户为综合服务体验而预约（多数场景）
  - 适用表达：美女助教、颜值、气质、情绪价值、陪打、陪伴、暧昧感、沟通自然、服务意识好、氛围轻松、陪打体验好、一个人来也不尴尬、想轻松打两把、想约助教提前说、到店可约、点助教
  - 这些都是行业内行看得懂、用得上的真实词，可以正常出现：形象、颜值、气质、会聊天、情绪价值、摆球/记分/陪打/陪伴、暧昧感、服务体验都照实写

  ### 行业真实词汇照常用

  下面这些是台球房助教营销的真实行业词，照实表达即可，不用强制转译：
  - "美女助教""好看的助教""漂亮助教" → 照实写，可结合到店通知/可约信息，如"今天有几个颜值在线的美女助教在店，想约提前说"
  - "点助教" → 照实用，预约助教服务，如"想点哪个助教提前跟我说，我帮你看时间"
  - "陪玩""陪打""陪伴" → 照实用，写陪打体验、轻松打两把、有人陪着不尴尬，暧昧感/情绪价值都可以带
  - "大哥客户""大哥" → 照实用，指大客户/老客户/熟客，行业里就这么叫

  ### 推荐表达方向
  - "最近有空可以再来练练，上次练的走位还记得吗"
  - "这周助教排班出来了，想约的话提前跟我说"
  - "今天店里几个美女助教都在，一个人来不尴尬，想约谁提前说"
  - "想练球的我帮你安排技术好的，想轻松打两把聊聊天的也有合适的助教"
  - "想练什么、想约哪个助教提前说，我帮你看时间"

  ### 严禁表达

  **助教服务绝对不能作为赠品。** 以下所有表达一律禁止（含去掉"免费"后的变体）：

  - 禁止："免费体验助教""免费陪打""送免费助教一小时""助教体验券""助教免费体验"
  - 禁止："送助教陪练课""送一节助教课""办卡送助教""充值送助教""送助教一小时""办卡送球杆+助教课"
  - 禁止：任何将助教服务作为"赠品""赠送""附带权益""打包福利"的输出

  即使用户明确说"新客户免费体验助教一次""办卡送免费助教一小时""送助教陪练课"，也必须转译。

  **正确转译方式**：
  - "助教陪练服务可预约，具体收费以门店为准"
  - "如门店确有活动，助教相关优惠请以门店实际政策为准"
  - "办卡/充值赠品建议优先使用实物（球杆、饮品等）。如门店希望加入助教相关权益，请先确认成本和适用规则"
  - "不建议直接写'送助教课'，容易让客户误解助教服务是免费项目"

  - 颜值、形象、气质、暧昧感、情绪价值都可以正常写——这是助教营销的真实卖点，不用回避，也不必转译。新来的助教、好看、会聊天等照实表达。
  - **底线（这是真实正规球房的做法，不是消毒）**：助教提供的是台球陪练服务。客人越界（动手动脚、想泡、要特殊服务）时保护助教、把话题拉回打球；门店不做、也不营销实际性交易。可以带暧昧感、情绪价值做营销，但不写露骨色情、不承诺线下特殊服务。
  - 禁止默认带电话地址。
  - 禁止写成广告——要像助教管理或助教本人在跟客户聊天。
  - 禁止编造助教姓名、年龄、身高、照片描述。

  **新助教表达边界：**
  新助教不是绝对禁止项。用户明确说"新助教到店""有新助教可约"时，可以生成推广内容，颜值/形象/气质等真实卖点照写（如"新来的几个助教颜值都在线，想约提前说"）。但用户未提及时不得凭空编造。底线：不编造姓名/年龄/照片细节、助教不写成免费赠品、助教是台球陪练不写线下特殊服务。
