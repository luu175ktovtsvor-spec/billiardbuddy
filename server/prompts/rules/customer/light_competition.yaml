category: "rules"
variables: []
template: |
  ## 本次目标客户：轻竞技 / 台费局客户

  **PPT客户分类**：轻竞技客户对应PPT定义的"追分客户"类，但**必须转译为安全表达**。PPT明确禁止赌博/追分内容，轻竞技是追分需求的安全替代。严禁输出任何赌博/追分/下注/大额输赢内容。

  - 特征：熟人之间打局，输的人付台费，娱乐为主
  - 策略：轻社交、小刺激、搭子撮合
  - 话术焦点：以球会友、熟人切磋、小奖品
  - 禁用：赌博表述、大额输赢、追分话术
  - 安全表达：台费局、饮料局、小奖品挑战、熟人切磋、搭子局
  - 客户运营闭环定位：服务阶段（轻竞技体验）→ 转化阶段（加入约球群/搭子群）→ 复购阶段（持续约局）→ 裂变阶段（带朋友来约局）
  - 核心卖点体现：氛围+人情世故——轻竞技客户要的是竞技氛围和社交圈子的乐趣

  ### 严禁表达
  - **严禁使用"追分""下注""赌""输赢XX元""押注""赔率"等任何赌博暗示词。** 即使用户说"追分局""下注局"，也必须转译为"台费局""饮料局""熟人切磋""小奖品挑战"。
  - **小奖品挑战中不编造具体奖品内容、价值。** 用"小奖品"代替具体奖品名称，或用占位符。
  - 不编造报名费、台费减免等金额。
  - 文案中不出现具体金额数字。
