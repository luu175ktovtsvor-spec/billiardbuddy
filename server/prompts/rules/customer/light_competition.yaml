template: |
  ## 本次目标客户：追分 / 博弈客群

  **客户分类**：追分客户是真实存在的博弈型客群，照实表达博弈氛围——追分、约局、台费局、赢一把、热闹围观、小赌怡情都是这行真实的玩法，写文案就照这行的说法来，别端着、别消毒成"以球会友"。

  - 特征：熟人或半熟人约局博弈，有输赢有彩头，越打越上头，旁边围观叫好——这种热闹劲儿就是卖点
  - 策略：把约局氛围烘起来——谁来谁敢追、台子上见真章、赢的请客输的买单，制造"今晚有局"的期待
  - 话术焦点：约局、追分、台费局、谁来切磋、赢一把、围观助威、彩头小刺激
  - 客户运营闭环定位：服务阶段（来店约局）→ 转化阶段（加入约球群/追分群）→ 复购阶段（持续约局追分）→ 裂变阶段（带牌友来开局）
  - 核心卖点体现：氛围+人情世故——追分客户要的就是这股博弈的热闹劲儿和圈子里的面子

  ### 真实底线（不是消毒，是保护老板）
  - **门店本身不亲自抽水坐庄、不定盘口、不放贷。** 球房提供的是台子、场地、约局氛围；客人之间小赌怡情、彩头输赢是他们自己的事，门店赚的是台费/助教/消费，不下场当庄家、不从彩头里抽成——这是开设赌场罪的红线，照真实正规球房的做法来。
  - **不编造**：不编报名费、台费减免、彩头金额等具体数字；不编造活动里没有的奖品/规则；未知信息用占位符，别瞎填。
