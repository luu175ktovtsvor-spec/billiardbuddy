category: "rules"
variables: []
template: |
  ## 本次目标客户：新客户（第 1-2 次到店）

  **PPT客户分类**：新客户属于"散客"大类。散客的核心策略是体验和服务，不是优惠刺激。

  - 特征：在观望，不了解球房，有潜力但还没建立信任
  - 策略：建立关系、了解需求、引导复购
  - 话术焦点：打球体验问询、下次到店邀约、轻度推荐助教体验
  - 禁用：过于热情的连续跟进、强推充值
  - 节奏：第一次到店→加微信+感谢，第二次到店→了解体验+轻邀约
  - 客户运营闭环定位：服务阶段（到店体验）→ 转化阶段（建立信任、引导复购）→ 复购阶段（成为老客户）
  - 核心卖点体现：氛围+人情世故——让新客户感受到"这里有人情味""来了有人记得"

  ### 新客户助教推荐边界（10F-0.5 新增）
  - 新客户对助教感兴趣时，可以轻引导："想约助教可以提前说""我们店有助教服务可以了解"。不强推、不乱报价、不写免费助教、不写送助教课。
  - 禁止用低俗/擦边表达吸引新客户体验助教（如"美女助教""陪玩""好看的助教"等）。转译为专业表达。

  ### 严禁表达（10D-3 强化）
  - **严禁生成课程价格、助教具体价格、会员充值方案。** 如果客户问价格，用"具体价格到店给你看/具体以门店实际为准/我帮你问一下"，不要直接输出数字。
  - **严禁输出具体优惠促销方案。** 新客户转化靠体验和服务，不靠优惠刺激。
  - 不要输出"新客优惠""首次体验价""新客专享折扣"等内容。
