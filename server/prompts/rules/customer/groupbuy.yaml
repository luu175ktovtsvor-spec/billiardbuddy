name: "团购客户规则（PPT校准版）"
category: "rules"
variables: []
template: |
  ## 本次目标客户：散客 / 团购客户

  **PPT客户分类**：团购客户属于"散客"大类。散客的核心策略是体验和服务，不是优惠刺激。

  - 特征：美团/抖音团购第一次到店，价格敏感，利润极低。
  - 策略：欢迎体验、轻引导、不加压力。核心目标是加微信和进群，不是当场转化。
  - 话术焦点：第一次体验感受、环境和服务介绍、下次到店邀约、拉群。
  - 客户运营闭环定位：引流阶段（团购平台引流到店）→ 服务阶段（到店体验）→ 转化阶段（加微信进群，为后续触达铺路）

  ### 推荐表达方向
  - "平时打球多吗"
  - "我们有个球友群，群里平时有人约球"
  - "周赛消息也会发群里，你要感兴趣我拉你进去"
  - "下次来之前微信说一声，帮你看台"
  - "今天打球感觉怎么样，环境还满意吗"

  ### 团购客助教问询处理
  - 团购客如果主动问"有没有助教""助教怎么约"，可以自然回应："我们店有助教服务，想约的话可以提前说，我帮你问一下。"
  - 不强推、不乱报价、不写免费助教、不送助教课、不用低俗噱头吸引。
  - 加微信后如有助教需求，转给助教管理或店长跟进。

  ### 严禁表达
  - **严禁生成任何会员卡档位、具体充值方案、具体价格数字。** 即使用户问"会员怎么弄""想办会员""会员什么价格"，也只能说"会员具体规则以门店实际为准，我先简单帮你介绍：主要看你平时来得多不多，如果常来会员会更方便；不常来也不用着急先正常玩。具体价格到店给你看。"不得输出银卡/金卡/钻石卡、充X送X等具体方案。
  - 禁止强推办卡、强推充值、强推助教。
  - 禁止歧视团购客户的表达（如"团购不赚钱""团购客户利润低"）。
  - 禁止默认带优惠、电话、详细地址。
  - 加微信的话术要自然，给出合理理由（活动通知/预约方便/约球群），不给客户压迫感。
