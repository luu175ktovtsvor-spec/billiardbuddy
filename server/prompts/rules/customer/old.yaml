template: |
  ## 本次目标客户：老客户（3 次以上到店）

  **PPT客户分类**：老客户属于"散客"大类的细分。散客的核心策略是体验和服务，不是优惠刺激。老客户维护的核心是"人情世故"——记得客户、像朋友说话、不是冷冰冰的服务。

  - 特征：有消费习惯，对球房有一定认可，但可能一段时间没来了。
  - 策略：人情维护、熟人感、轻提醒，不是推销。核心是"记得你""不是群发"。
  - 话术焦点：好久没见、问问最近忙不忙、什么时候有空来打两把、来之前说一声帮留台。
  - 客户运营闭环定位：复购阶段（持续到店）→ 裂变阶段（老客户转介绍、带朋友来）
  - 核心卖点体现：氛围+人情世故——老客户维护就是人情世故的集中体现

  ### 推荐表达方向
  - "好久没见你来打球了，最近忙什么呢"
  - "哪天有空回来打两把，找找手感"
  - "想找手感可以过来，一个人来也可以安排"
  - "来之前跟我说一声，我帮你看下有没有台"
  - "最近店里挺热闹的，有空过来坐坐"

  ### 严禁表达

  **禁止编造客户历史行为：**
  用户没有提供客户具体历史时，不得编造：
  - 上次到店时间、上次打了几局、上次打的什么玩法（中式八球/斯诺克等）
  - 上次消费记录、上次输赢、客户水平、客户偏好
  - 客户关系细节、客户曾经说过的话、客户参加过什么活动
  正确做法：使用泛化表达——"好久没见""最近有空回来打两把""找找手感""最近忙啥呢"。

  **禁止编造门店新变化：**
  用户没有提供门店变化时，不得编造：
  - 新到台球桌、换新台、装修升级、灯光升级
  - 新设备、新球杆、新茶水、新活动、新教练
  如果用户想突出门店真实变化，可用占位符：【如门店近期有真实升级，可在此补充】。
  注意：新助教不在此列——用户明确说有新助教时可以专业表达（见 baseline_rules 17b 说明），但用户未提及时不得凭空编造。

  - **严禁生成任何优惠、充值、折扣、赠送、会员价。** 包括但不限于："充1000送300""最近有活动""会员优惠""老客户专属折扣""充值优惠""充多少送多少""老带新优惠""首小时折扣""减XX元"。
  - **即使用户说"店里冷清""想拉人""让老客户回来""老客户不怎么来了""促活"等，也严禁默认输出优惠、充值、折扣。** 默认应输出：约球、找手感、提前留台、轻提醒、空台提醒、熟人邀约。
  - 禁止默认带电话、详细地址。
  - 禁止群发模板式"好久不见"——要像熟人打招呼，不是系统通知。
  - 老客户维护应以约球、找手感、提前留台、轻提醒为主，不要一上来就用优惠刺激。
  - **老客户回访不自动推会员/充值/助教**：用户只说"好久没联系老客户""老客户最近没来了""想喊老客户回来打球"时，不得自动附带会员卡推荐、充值方案、助教服务推荐、新助教信息。除非用户明确说"帮我推会员卡""喊他回来找助教"。
  - 如果用户明确要求推优惠/充值/活动，再用占位符写优惠框架，不要自己填数字。
