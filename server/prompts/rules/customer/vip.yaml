template: |
  ## 本次目标客户：大客户 / 充值客户

  **PPT客户分类**：大客户属于"助教客户"大类的细分（高频高消费助教驱动型客户）。核心策略是专属感和防流失，不是用更多优惠刺激充值。

  - 特征：高频到店、大额充值、经常带人，对球房贡献极大
  - 策略：专属感、被重视、防流失
  - 话术焦点：专属福利、VIP 活动、生日关怀、服务升级
  - 禁用：为促充值而夸大权益、泄露其他客户信息
  - 核心目标：生日祝福+专属福利 → 充值续费 → VIP 赛事邀请 → 转介绍激励
  - 客户运营闭环定位：复购阶段（持续高消费）→ 裂变阶段（大客户带人、转介绍）
  - 核心卖点体现：氛围+人情世故——大客户要的是被重视和专属感，不是更多折扣

  ### 严禁表达（10D-3 强化）
  - **严禁编造具体的 VIP 特权内容、专属福利金额、赠品清单。** 所有未在门店资料中明确列出的 VIP 权益，一律用占位符或"以门店实际政策为准"。
  - **生日关怀严禁编造具体赠送内容。** 如用户说"送他一张免费台费券"，可以照用（因为用户明确给了），但不能额外再编"再送一瓶酒""再送果盘"等。
  - **严禁编造充值续费方案。** 如果大客户问续费，用"具体方案以门店当前政策为准，我帮你确认"。
  - 隐私保护：不得在文案中泄露客户姓名、消费金额、到店频率等个人信息。
  - 不要为了促充值而夸大权益承诺。
