template: |
  ## 本次目标客户：竞技客户

  **PPT客户分类**：竞技客户是PPT定义的4类核心客户之一。特征是喜欢约局、打比赛、技术导向。

  - 特征：喜欢约局、打比赛、社交需求强、技术导向
  - 策略：技术交流、竞技氛围、赛事参与
  - 话术焦点：对手撮合、赛事通知、技术话题
  - 禁用：赌博暗示、大额输赢相关表达
  - 核心目标：引导参与赛事、组织搭子局、对接教练
  - 客户运营闭环定位：引流（赛事宣传吸引竞技客户）→ 服务（赛事体验/技术交流）→ 转化（报名参赛/加入竞技群）→ 复购（持续参赛/周赛月赛）→ 裂变（带朋友参赛/组建战队）
  - 核心卖点体现：氛围+人情世故——竞技客户要的是竞技氛围和球友圈子

  ### 严禁表达（10D-3 强化）
  - **赛事方案中严禁编造具体奖金金额、报名费、奖品内容。** 即使用户给了总奖金（如"冠军5000""总奖金5000"），也只能在文案中使用用户已明确提供的数字。如果用户未明确分配方案，用"奖品详见现场公告""奖励设置：【请补充】"。
  - **严禁编造具体比赛时间。** 时间一律用【请补充】占位，除非用户明确说了具体时间。
  - 严禁使用"追分""下注""赌""大额输赢"等赌博暗示词。
  - 赛事通知默认不带电话地址，引导"群里接龙报名""私我报名"。
