  ## 前厅话术核心规则

  ### 运营校准：前厅在客户运营闭环中的角色

  前厅是客户运营闭环的关键触点：**引流→服务→转化→复购→裂变**。
  - 引流：团购客到店核销，加微信进群
  - 服务：接待体验、打球引导、环境介绍
  - 转化：轻推会员/助教（不强推，用推荐语气）
  - 复购：加微信后持续触达、到店提醒
  - 裂变：老客户带朋友、转介绍

  前厅话术必须体现"人情世故"——像朋友说话，不是冷冰冰的服务流程。核心卖点是氛围+人情味，不是价格和优惠。

  ### 规则44：话术要自然

  前厅接待话术不能像背稿。同样的意思要有2-3种表达方式供选择。禁用"您好欢迎光临请问有什么可以帮您"的机械表达。

  实操要点：
  - 同一意图提供2-3种说法，让员工选择最顺口的
  - 话术要有口语感，像真人说话不是念稿
  - 可以用短句、省略句，不用完整书面语
  - 举例：不说"您好，请问您需要开台吗"，而说"来打球啊？我帮你开台"

  ### 规则45：话术要简短

  单条话术控制在50字以内。不要让前厅员工在客户面前读长篇大论。可以拆分为多步（如：第一步说什么→客户可能怎么回→第二步说什么）。

  实操要点：
  - 每条话术不超过50字，当面说的话3-5秒说完
  - 复杂场景拆成多步：第一步→客户可能反应→第二步→客户可能反应→第三步
  - 重点信息放前面，补充说明放后面
  - 宁可多说几轮短话，不要一次说一长段

  ### 规则46：不像推销

  推卡、推助教的话术不能有"推销感"。用"推荐""了解一下""很多客户喜欢"代替"必须办""一定要""不办就亏了"。

  实操要点：
  - 推荐语气：轻推荐、不施压
  - 用词替换表：
    - "必须办" → "可以考虑"
    - "一定要" → "很多客户选这个"
    - "不办就亏了" → "办了会更划算"
    - "你不办吗" → "想了解一下吗"
  - 让客户觉得是"朋友建议"而不是"销售推销"
  - 客户拒绝后不追问，留余地：好的，以后有需要随时说

  ### 规则47：能引导下一步动作

  每条接待话术都要有明确的下一步引导：加微信→进群→预约→到店。话术结束不是终点，是下一个转化的起点。

  实操要点：
  - 话术末尾必须有明确的行动引导
  - 常见下一步动作：
    - 加微信："加个微信吧，下次来提前说"
    - 进群："我们有个球友群，经常约球，要不要进"
    - 预约："想约助教可以提前跟我说，我帮你看时间"
    - 到店："下次来直接找我，不用等"
  - 不要让对话停在"好的再见"，要自然带出下一步

  ### 规则48：区分当面说/微信说/群里说

  同样目的的话术，在不同渠道的表达完全不同。当面说要短（3-5秒说完），微信说要自然（像聊天），群里说要规范（大家都在看）。

  ---

  ## 分渠道表达要求

  ### 当面说（面对面场景）

  - **长度**：每条3-5秒说完，不超过20字
  - **语气**：轻松、自然、像朋友说话
  - **节奏**：短句为主，说完等客户回应再继续
  - **禁忌**：不在客户面前读长稿、不背标准答案
  - **示例**：
    - 团购核销："团购验好了，我帮你开台"
    - 推加微信："加个微信吧，下次来不用团购了"
    - 推助教："你打得太认真了，要不要试试我们助教"

  ### 微信说（私聊场景）

  - **长度**：每条30-80字，像正常微信聊天
  - **语气**：自然、有人味、体现"记得你"
  - **节奏**：第一条不要太长，给客户回复空间
  - **禁忌**：禁用"亲爱的""宝""亲"等过度亲密称呼，不连续发多条
  - **示例**：
    - 老客回访："好久没来了，最近忙啥呢？有空回来打两把"
    - 新客邀约："上次来打得怎么样？这周有空再来练练？"
    - 推助教："上次看你挺认真的，我们助教专门教基础，要不要试试？"

  ### 群里说（群公告/群消息场景）

  - **长度**：200字以内，必须包含"什么事+什么时间+谁参加+怎么做"
  - **语气**：规范、清楚、有号召力
  - **节奏**：一条消息说完关键信息，不刷屏
  - **禁忌**：不写朋友圈风格的配文，不写长篇大论
  - **示例**：
    - 活动通知："周六下午2点会员赛，报名费[请填写]，想参加的群里接龙，名额有限先到先得"
    - 助教可约："今日助教可约，想预约的朋友私信我，我帮你看时间"
