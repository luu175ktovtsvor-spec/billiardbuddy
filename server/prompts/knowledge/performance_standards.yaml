key: "knowledge.performance_standards"
name: "绩效评分标准知识库"
category: "knowledge"
variables: []
description: |
  球房各岗位绩效考核评分标准。按岗位结构化存储考核维度、分值、评分标准、一票否决项。
  球房各岗位绩效考核评分标准。

  # PPT核心校准：4岗位对齐
  # 助教(assistant) | 助教管理(assistant_manager) | 店长(manager) | 教练(coach)
  # 助教核心工作：营销获客（不是陪打）
  # 助教服务定位：单独付费的增值服务

template: |
  ## 各岗位绩效考核核心要点

  ### 助教（100分）
  - 客户管理（20分）：加微信数、回访率、客户满意度
  - 业绩指标（30分）：上钟时长、预约客户数、回头客占比
  - 球技水平（20分）：五分点、蛇彩、围球能力
  - 日常管理（30分）：出勤、朋友圈执行、培训参与
  - 一票否决：收客户红包/现金、私自离岗、与客户发生争吵

  ### 助教管理（60分）
  - 助教管理（20分）：助教上钟率、加微信达标率、培训执行
  - 迎宾管理（10分）：助教迎宾排班执行、推荐转化率
  - 活动策划（10分）：月度活动执行、PK方案落地
  - 日常管理（20分）：日报质量、数据统计、问题解决

  ### 店长（60分）
  - 数据分析（15分）：日报准确性、数据趋势判断
  - 客户管理（15分）：大客户维护、客户流失率
  - 员工留存（15分）：离职率、团队稳定性
  - 日常管理（15分）：巡场质量、成本控制、活动执行

  ### 教练（60分）
  - 助教培训（20分）：助教球技提升率、考核通过率
  - 线上工作（15分）：加微信数、组局数、朋友圈执行
  - 场内工作（15分）：外场互动、小游戏组织、客户维护
  - 日常管理（10分）：出勤、日报质量

  ### 主管（100分）
  - 日常管理（30分）：巡场质量、排班执行、考勤管理
  - 服务管理（30分）：客户满意度、投诉处理、摆球服务
  - 员工留存（20分）：员工状态、培训执行
  - 6S管理（20分）：卫生标准、设备维护、安全检查

roles:
  assistant:
    name: "助教"
    total_score: 100
    dimensions:
      - name: "维客管理"
        score: 20
        standards:
          - "客户陪打基础服务：摆球、拿架杆、聊天、点烟、拿商品、送客户至电梯口"
          - "客户100%添加微信"
          - "备注客户信息，针对客户做分类"
        penalty: "此项未执行一次扣2分，以此类推"
      - name: "指标管理"
        score: 30
        standards:
          - "客户3局体验每天3桌"
          - "上钟每日不低于3小时"
          - "每天练球不低于1小时"
          - "添加客户微信不低于4个"
          - "每天邀约客户至少3组"
        penalty: "未执行每次扣2分；上钟不满4小时且免费体验不达到5桌绩效扣分；上钟每少一小时，免费体验增加两桌以此类推；上钟超过5小时其他指标可以忽略"
      - name: "球技管理"
        score: 20
        standards:
          - "服务流程每月考核一次"
          - "球技基本功每月考核一次，不通过者罚款200元，业绩达标者除外"
        penalty: "以上内容一项未执行到位扣2分，以此类推"
      - name: "日常管理"
        score: 30
        standards:
          - "离岗报备"
          - "摆球回应"
          - "地面垃圾随手捡起"
          - "工作期间不打游戏、不刷短视频、不看无关网页/APP"
          - "不聚众聊天（助教之间、上钟无关的客户、亲朋好友）"
          - "上岗后着工装佩戴工作牌"
          - "无故离岗不超15分钟"
          - "上钟客户送至电梯口"
        penalty: "未执行每次扣2分"
    veto_items:
      - "店内抽烟"
      - "旷工"
      - "被客户投诉"
      - "店内赌博"
      - "免费服务客户超3局不计费"
      - "下班后免费跟客户打球"
    veto_penalty: "一票否决项如有违反当月绩效为零"

  assistant_manager:
    name: "助教管理"
    total_score: 60
    dimensions:
      - name: "助教管理"
        score: 15
        standards:
          - "店内有空台情况下安排助教每日练球时间"
          - "根据助教球技水平安排教练指导"
          - "新人助教每天上钟时长不低于2小时，交友软件导微信不低于4人"
          - "协助助教日上钟时长3小时，3局免费体验次数不低于3桌（上钟时长每少1小时，免费体验指标增加2桌，上钟超过5小时可以不做体验）"
          - "助教每日发朋友圈2条，抖音1条，并截图至助教群"
        penalty: "以上内容未执行绩效扣1分每项"
      - name: "迎宾管理"
        score: 15
        standards:
          - "客人进场上前迎接"
          - "助教迎宾下午15:00-23:00不断岗"
          - "助教迎宾期间使用迎宾语'欢迎光临'"
          - "第一轮助教推荐"
        penalty: "以上内容未执行绩效扣1分每项"
      - name: "活动策划"
        score: 15
        standards:
          - "配合教练每月推出月度助教活动方案"
          - "协助教练每日活动"
        penalty: "以上内容未执行绩效扣1分每项"
      - name: "日常管理"
        score: 15
        standards:
          - "离岗报备发送时间至管理群"
          - "朋友圈2条、抖音1条，截图发送至管理群"
          - "到岗佩戴对讲机/工号牌"
          - "每日发送日报等数据至管理群"
        penalty: "以上内容未执行绩效扣1分每项"
    veto_items:
      - "未经允许单人大厅抽烟"
      - "离岗"
      - "旷工"
      - "被客户投诉"
      - "店内赌博"
      - "不服从工作安排"
    veto_penalty: "一票否决项如有违反当月绩效为零"

  manager:
    name: "店长"
    total_score: 60
    dimensions:
      - name: "数据分析及统计"
        score: 15
        standards:
          - "每日营业数据统计（单日新客数、开台次数、开台平均时长、营业款核对、美团客户数、抖音客户数），并发送至数据统计群"
          - "每周客户数据分析、每月客户数据分析发至管理群"
        penalty: "未执行或者漏发送一次扣1分，以此类推"
      - name: "维客管理"
        score: 15
        standards:
          - "高等级会员客户100%添加微信"
          - "新高等级会员客户登记并发送至管理群"
          - "精准客户90%添加微信"
        penalty: "此项未执行一次扣1分，以此类推"
      - name: "员工流失率（管理层）"
        score: 15
        standards:
          - "1个含1个离职不扣分"
          - "1个以上3个以内离职扣5分"
          - "4个以上的0分"
        note: "离职考核界定：正式入职的管理层，7天内试岗离职及公司解聘的员工不计入考核"
      - name: "日常管理"
        score: 15
        standards:
          - "门店例会、管理例会、库存检查、卫生标准、仪容仪表、组织培训、设备检查、考勤管理、开源节流、助教管理、团购回复"
        penalty: "以上内容一项未执行到位扣1分，以此类推"
    veto_items:
      - "店内大厅单人抽烟"
      - "旷工"
      - "被客户投诉"
      - "店内赌博"
    veto_penalty: "一票否决项如有违反当月绩效为零"
    additional_rule: "绩效考核40分以上按照实际分数核算绩效工资，低于20分绩效归零。"

  coach:
    name: "教练"
    total_score: 60
    dimensions:
      - name: "助教球技培训"
        score: 15
        standards:
          - "每月31日制定月培训计划上报工作群"
          - "每天工作日报上报工作群"
          - "每月上报助教球技考核表"
          - "每月31日上报助教训练情况分析统计报表"
          - "每天监督、督促助教练球，练球时长至少1小时"
          - "针对助教水平情况制定有针对性的球形训练"
        penalty: "未执行或者漏发送一次扣1分，以此类推"
      - name: "线上工作管理"
        score: 15
        standards:
          - "群内红包每天两个，下午两点半，晚上七点半，红包设定金额5元人数30，及时公布中奖情况截图"
          - "群消息应做到及时、合理回复"
          - "每天群内、微信邀约组局，三人轻竞技或二人对抗"
          - "工作微信号日常消息群发，朋友圈每日两条"
          - "工作号每天添加3组以上新客户微信，并发送新客户进群链接邀约进群"
        penalty: "上岗当月开始施行，未执行一次扣1分，以此类推"
      - name: "场内工作管理"
        score: 15
        standards:
          - "每天外场客户互动，晚上9点一场球形挑战小游戏，游戏奖品为台费代金券/饮料/小零食，并及时前台报备送出数量并填写游戏奖品统计表"
          - "8点播报店内活动"
          - "通过小游戏及时发现有培养潜力的轻竞技选手并在工作日报中体现"
          - "每天发送微信邀约信息10人以上"
          - "上岗次月月底统计客户邀约订台数，30台达标"
        penalty: "上岗当月施行，未执行或未达标扣3分"
      - name: "日常管理"
        score: 15
        standards:
          - "离岗报备"
          - "摆球回应"
          - "地面垃圾随手捡起"
          - "工作期间不打游戏、不刷短视频、不看无关网页/APP"
          - "休息区用餐"
        penalty: "上岗当月施行，未执行每次扣1分"
    veto_items:
      - "轻竞技活动提成作弊作假"
      - "客户投诉"
      - "无故旷工"
      - "在岗期间店内赌博"
    veto_penalty: "一票否决项如有违反当月绩效为零"

  supervisor:
    name: "主管"
    total_score: 100
    dimensions:
      - name: "日常管理"
        score: 20
        standards:
          - "检查中班卫生是否达标"
          - "检查中班空调/棋牌电源/加温器电源是否关闭"
          - "组织晚班例会（安排早班人员具体工作）"
          - "安排台泥熨烫，桌球清洗"
          - "下班前全场卫生检查，确保卫生符合标准"
          - "管理日志填写并提交至管理群"
          - "随时巡场监督班次工作人员是否按照工作流程/标准执行工作"
          - "客户来店第一局有人摆球（所有区域）"
          - "随时检查烟缸、垃圾桶、休息区、茶几台面随时安排清洁"
        penalty: "此项未执行一次扣2分，以此类推"
      - name: "服务管理"
        score: 30
        standards:
          - "进入工作场所佩戴工作服、工作牌、对讲机（班次所有人）"
          - "客户呼叫摆球，大声回应'来了'，并跑步前进（班次所有人）"
          - "客人离场后及时复位（班次外场）"
          - "随时观察客户摆球需求并提供摆球服务（班次所有人）"
        penalty: "未执行或者漏发送一次扣2分，以此类推"
      - name: "员工流失"
        score: 20
        standards:
          - "离职1人不扣分"
          - "离职3人扣5分"
          - "离职5人扣10分"
        note: "入职满7天员工计入班次考核，7日内不计入考核"
      - name: "6S管理"
        score: 30
        standards:
          - "地上烟头纸屑第一时间捡起来（班次所有人）"
          - "茶几客人走后第一时间擦拭，无灰尘、无异物（班次所有人）"
          - "垃圾桶垃圾超过1/3更换掉（班次所有人）"
          - "烟缸超过8颗烟头第一时间更换掉（班次所有人）"
          - "早班18:00，中班24:00检查所有茶几、烟缸、垃圾桶，全部更换清洁，球杆摆放全部归位"
        penalty: "以上内容一项未执行到位扣2分，以此类推"
    veto_items:
      - "店内抽烟"
      - "未经允许离岗"
      - "旷工"
      - "被客户投诉"
      - "店内赌博"
      - "不服从工作安排"
    veto_penalty: "一票否决项如有违反当月绩效为零"