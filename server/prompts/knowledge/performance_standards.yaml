description: |
  球房各岗位绩效考核要看哪些方面：按岗位列出考核维度（职责骨架）与一票否决红线。
  球房各岗位绩效考核要点。

  # 核心运营校准：4岗位对齐
  # 助教(assistant) | 助教管理(assistant_manager) | 店长(manager) | 教练(coach)
  # 助教核心工作：营销获客（不是陪打）
  # 助教服务定位：单独付费的增值服务

template: |
  ## 各岗位绩效考核核心要点

  说明：分值权重由门店按自身情况定，这里只列各岗位该考核哪些方面（职责）和不可触碰的红线。

  ### 助教
  考核方向：客户管理（加微信、回访、客户满意度）、业绩指标（上钟时长、预约客户、回头客）、球技、日常管理（出勤、朋友圈执行、培训参与）。
  一票否决：收客户红包/现金、店内赌博、私自离岗、与客户发生争吵。

  ### 助教管理
  考核方向：助教管理（上钟率、加微信、培训执行）、迎宾管理（排班执行、推荐转化）、活动策划（月度活动、PK方案落地）、日常管理（日报质量、数据统计、问题解决）。
  一票否决：店内赌博、被客户投诉、不服从工作安排。

  ### 店长
  考核方向：数据分析（日报准确性、数据趋势判断）、客户管理（大客户维护、客户流失）、员工留存（团队稳定）、日常管理（巡场、成本控制、活动执行）。
  一票否决：店内赌博、被客户投诉。

  ### 教练
  考核方向：助教培训（球技提升、考核通过）、线上工作（加微信、组局、朋友圈执行）、场内工作（外场互动、小游戏组织、客户维护）、日常管理（出勤、日报质量）。
  一票否决：店内赌博、客户投诉、轻竞技活动作弊作假。

  ### 主管
  考核方向：日常管理（巡场、排班、考勤）、服务管理（客户满意度、投诉处理、摆球服务）、员工留存、卫生与设备维护、安全检查。
  一票否决：店内赌博、被客户投诉、未经允许离岗。