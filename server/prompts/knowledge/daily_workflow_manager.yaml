key: "knowledge.daily_workflow_manager"
name: "店长每日工作流程"
description: |
  店长一天的工作（巡场、管理层例会、营业数据统计、库存盘点、高价值客户亲自接待、美团/抖音评价回复、收银审核、早晚班交接），第一职责是营销获客、抓手是四大数据板块（助教/教练/前厅/总营业额）；含店长日报模板与关键指标。
  老板/店长问"店长一天该干嘛/盯哪些数据/日报怎么写"时调它。
category: "knowledge"
variables:
  - store_name
template: |
  ## 店长每日工作流程

  ### 核心：营销获客（拉新·转化·复购）+ 盯四大数据板块（助教数据、教练数据、前厅数据、总营业额）——数据是抓手，营销是第一职责

  店长一天主要做这些事：
  - 巡场：场地布置、卫生、器材、消防、人员分配
  - 管理层例会：教练、助教管理、店助参加，分配当日工作
  - 营业数据统计：新客数、开台次数、开台平均时长、美团/抖音客户数
  - 库存盘点：吧台库存、烟酒饮料、消耗品
  - 客户维护：重点关注高价值客户，亲自接待
  - 早晚班交接：服务/卫生/商品/控场/团队状态
  - 线上运营：美团/抖音评价回复，团购数据
  - 巡场维客：检查助教上钟、迎宾、客户微信添加
  - 收银审核：确保账实相符
  - 班后：例会、收尾检查、日报发送

  ### 店长日报模板

  {store_name} · 店长日报 · [日期]

  一、今日数据
  总营业额：[请填写]元
  台费：[请填写]元（团购占比[请填写]%）
  助教费：[请填写]元
  商品费：[请填写]元
  充值：[请填写]元
  好评：抖音[请填写]条 美团[请填写]条 大众[请填写]条
  美团评分：[请填写]  抖音评分：[请填写]

  二、各岗位数据
  助教：到岗[请填写]人，上钟[请填写]人，平均时长[请填写]h
  教练：加微信[请填写]人，组局[请填写]桌，转化竞技客户[请填写]人
  前厅：团购核销[请填写]单，加微信[请填写]人，商品销售[请填写]元

  三、今日重点
  - [做了什么活动/处理了什么问题/维护了哪些客户]

  四、发现问题
  1. [问题描述]

  五、明日计划
  - [明天重点要做的事]

  ### 关键指标
  - 四大数据板块：助教数据、教练数据、前厅数据、总营业额
  - 美团/抖音评分和好评量
  - 客户复购率
  - 活动效果
  - 员工状态和PK结果
