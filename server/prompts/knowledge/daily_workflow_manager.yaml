  ### 店长巡查表

  巡查频率：每日3次（上午开班/下午交接/晚高峰前），每次15分钟。

  巡查清单：
  【环境】
  - 灯光是否正常（损坏/暗淡）
  - 音乐音量和风格是否合适
  - 空调温度是否舒适（夏季24-26度，冬季20-22度）
  - 香氛/气味是否正常
  - 整体氛围是否活跃

  【设备】
  - 球台台面是否平整、无破损
  - 球杆是否齐全、无损坏
  - 计分器/集球器是否正常
  - 灯光照明是否充足
  - 空调/新风是否运行正常

  【服务】
  - 员工是否在岗、状态是否良好
  - 客户是否有人接待
  - 摆球服务是否及时
  - 助教是否在迎宾或上钟

  【安全】
  - 消防通道是否畅通
  - 监控是否正常运行
  - 门禁/出入管理是否正常
  - 有无安全隐患

  【卫生】
  - 台面是否整洁
  - 地面是否干净
  - 洗手间是否清洁
  - 休息区/吧台是否整洁

