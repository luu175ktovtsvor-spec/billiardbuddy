key: "knowledge.daily_workflow_manager"
name: "店长每日工作流程"
description: |
  店长从9点开班到23点后收尾的整天流程（巡场、管理层例会、营业数据统计、库存盘点、高价值客户亲自接待、美团/抖音评价回复、收银审核），第一职责是营销获客、抓手是四大数据板块（助教/教练/前厅/总营业额）；含店长日报+周报模板、关键指标，以及每日3次巡查表（环境/设备/服务/安全/卫生五大项清单+记录模板）。
  老板/店长问"店长一天该干嘛/盯哪些数据/日报周报怎么写/巡查查什么"时调它。
category: "knowledge"
variables:
  - store_name
template: |
  ## 店长每日工作流程

  ### 核心：营销获客（拉新·转化·复购）+ 盯四大数据板块（助教数据、教练数据、前厅数据、总营业额）——数据是抓手，营销是第一职责

  **09:00-14:00 开班**
  - 巡场：场地布置、卫生、器材、消防、人员分配
  - 管理层例会：教练、助教管理、店助参加，分配当日工作
  - 营业数据统计：新客数、开台次数、开台平均时长、美团/抖音客户数
  - 库存盘点：吧台库存、烟酒饮料、消耗品

  **15:00-18:00 下午**
  - 客户维护：重点关注高价值客户，亲自接待
  - 早晚班交接：服务/卫生/商品/控场/团队状态
  - 线上运营：美团/抖音评价回复，团购数据

  **19:00-23:00 晚班**
  - 迎宾接待：了解客户到店情况
  - 巡场维客：检查助教上钟、迎宾、客户微信添加
  - 收银审核：确保账实相符

  **23:00后 收尾**
  - 班后例会 → 收尾检查 → 日报发送 → 工作笔记

