  #### 5.5 中式台球弹性让球赛主持词（专项模板）

  适用于中式台球弹性会员让球赛，让条件以"球"为单位（弹性让球）。

  **开场要点：**
  - 说明比赛为中式台球弹性让球赛
  - **弹性让球规则（逐局动态，区别于静态档位让球）**：双方全场平打起手 → 谁赢一局就让对方"后一"（受让方下局后手开球/受让一球）→ 下一局若受让方赢，则恢复平打 → 如此循环，让球上限到"后三"为止；当一方领先到 4 局以上时锁死在"后三"，直到领先收窄回 3 局以内才恢复弹性让球。核心是"动态拉平、领先越多让越多、追回就松"，让低手能咬住、高手不能稳赢。
  - （注意：这套"逐局动态让球"才是弹性让球；按选手固定档位让固定球数那叫"静态档位让球"，是另一套，别混。）
  - 其他规则参照通用模板

