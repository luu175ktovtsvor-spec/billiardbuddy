template: |
  ## 赛事活动规则知识库

  # 核心运营校准
  # 追分照实写：可直说"追分赛/追分局"，这是真实赛制和真实客群叫法
  # 4类客户：散客 | 竞技客户 | 助教客户 | 追分客户（图输赢刺激）
  # 🔴 门店真底线：门店只赚台费/助教费/报名费，不亲自抽头/当庄/对赌/定盘口（开设赌场罪）；追分氛围照实带，金额帮客人控住别炸店

  本知识库收录台球房赛事活动的完整业务规则，供 AI 生成赛事方案、宣传文案、话术时自动遵守。
  核心原则：赛事是活跃客户、提升客单价、增强粘性的核心手段，必须常年不间断、公平透明、社交导向。

  ---

  ### 一、赛事活动业务定义

  #### 1.1 赛事活动范围（10种活动类型）

  台球房的赛事活动包括以下10种类型：

  1. **周赛**：每周固定时间举办的小型比赛，维持客户活跃度
  2. **月赛**：每月一次的中型比赛，检验月度运营成果
  3. **会员赛**：仅限会员参加的内部比赛，增强会员粘性
  4. **小奖品挑战**：低门槛趣味赛，如抢一大战、功能饮料挑战赛等
  5. **约局/追分活动**：台费局、追分局、约局、熟人切磋等竞技社交向活动
  6. **体育赛事看球活动**：配合世界杯、斯诺克世锦赛等大型赛事的看球活动
  7. **节日活动**：春节/中秋/国庆/情人节/七夕等节日主题活动
  8. **充值活动**：配合赛事或节日的充值优惠活动
  9. **临时促活活动**：淡季或空台时段的临时小活动
  10. **搭子局/竞技局**：撮合水平相近的客户一起打球，轻社交竞技

  #### 1.2 赛事活动对球房的价值

  - **活跃客户**：周赛让客户每周有理由来球房
  - **提升客单价**：赛事期间消费（台费+饮料+商品）高于平时
  - **增强粘性**：参与赛事的客户流失率远低于纯散客
  - **吸引新客**：赛事宣传是最好的门店推广内容
  - **检验团队能力**：赛事组织能力体现门店运营水平

  #### 1.3 赛事运营核心原则

  - **常年不间断**：店长的核心工作之一是"常年不间断营销，保持活动新鲜感"
  - **让条件增加偶然性**：好赛事不是高手稳赢，而是人人有机会（抢一大战的核心逻辑）
  - **公平透明**：规则清楚、执行公平、结果公示
  - **社交导向**：赛事的第一目标是让客户互相认识、成为朋友，第二目标才是比赛结果

  ---

  ### 二、典型赛事活动场景（9个场景）

  #### 2.1 赛前报名

  - **目标**：吸引足够多的参赛者，确保赛事成局
  - **内容类型**：朋友圈宣传、群公告通知、私聊邀约、倒计时海报
  - **节奏**：周赛提前3天开始宣传，月赛提前2周，大型赛事提前1个月
  - **内容要点**：赛事亮点+参赛门槛+报名方式+截止时间
  - **系统输出**：报名文案（多渠道）+倒计时内容+报名人数更新文案

  #### 2.2 赛制说明

  - **目标**：让所有参赛者清楚了解比赛规则
  - **内容类型**：群公告/赛事文档
  - **必须包含**：比赛形式（单败/双败/小组赛）、晋级规则、让条件规则、时间安排、奖项设置、注意事项
  - **系统输出**：赛制说明文档（群公告版+完整版）
  - **注意**：规则要清楚无歧义，让条件要写具体（如"A档让B档后一，A档让C档后二"）

  #### 2.3 赛前提醒

  - **目标**：确保参赛者准时到场
  - **内容类型**：群公告+私聊提醒
  - **时机**：赛前一天+赛前2小时
  - **内容要点**：比赛时间+地点+对手（如已定）+准备事项
  - **系统输出**：赛前提醒文案（群发版+私发版）

  #### 2.4 赛后战报

  - **目标**：记录比赛、传播赛事氛围、预告下次赛事
  - **内容类型**：朋友圈+群公告
  - **必须包含**：比赛结果+比赛精彩瞬间描述+冠军/优秀选手+下次赛事预告
  - **风格**：有画面感、突出参与感和竞技精神、激发未参加者的兴趣
  - **系统输出**：赛后战报（朋友圈版+群公告版）
  - **注意**：不编造比赛细节和选手数据

  #### 2.5 冠军海报文案

  - **目标**：为冠军制作宣传海报，展示门店赛事品质
  - **内容类型**：海报文案（冠军姓名/赛事名称/日期/配文）
  - **用途**：朋友圈发布+群内发布+店内展示
  - **系统输出**：冠军海报文案+海报设计方案说明
  - **注意**：冠军姓名需门店提供，不编造

  #### 2.6 教练点评

  - **目标**：教练对赛事进行专业点评，体现专业度
  - **内容类型**：朋友圈/群公告，以教练个人视角输出
  - **内容要点**：比赛整体评价+精彩对局点评+选手表现（亮点）+技战术分析+鼓励
  - **系统输出**：教练赛事点评文案

  #### 2.7 赛事群公告

  - **目标**：在微信群内发布赛事相关信息
  - **内容类型**：群公告
  - **覆盖**：赛事通知/赛程更新/赛果公布/下次赛事预告
  - **系统输出**：赛事相关群公告
  - **注意**：短、清楚、有行动引导

  #### 2.8 私聊邀约

  - **目标**：一对一向潜在参赛者发出赛事邀请
  - **内容类型**：微信私聊话术
  - **分客户类型**：
    - 竞技客户：强调竞技和交流
    - 老客户：强调活动和社交
    - 新客户：强调体验和认识朋友
  - **系统输出**：分客户类型赛事邀约话术
  - **注意**：个性化、不骚扰、给客户思考和回复空间

  #### 2.9 朋友圈宣传

  - **目标**：通过朋友圈持续营造赛事氛围
  - **内容类型**：朋友圈文案
  - **节奏**：赛前宣传→赛中直播→赛后战报
  - **系统输出**：赛事相关朋友圈文案（多阶段）

  ---

  ### 三、活动方案必备要素（10个要素）

  每个活动方案必须包含以下要素。缺失的信息用 [请填写：XXX] 占位，禁止 AI 自行编造。

  #### 3.1 活动目标

  - 明确这次活动要达成什么目标（如：拉动周末客流、提升助教预约、激活老客户）
  - 目标要具体、可衡量

  #### 3.2 活动对象

  - 明确活动面向哪些客户（如：全体客户/仅会员/仅竞技客户/新客户）
  - 不同对象对应不同的宣传渠道和话术

  #### 3.3 活动时间

  - 明确日期+时间段
  - 报名截止时间

  #### 3.4 报名方式

  - 明确怎么报名（群内接龙/私聊报名/现场报名）
  - 报名费（如适用）：[请填写金额]

  #### 3.5 规则说明

  - 比赛/活动形式
  - 晋级规则（如适用）
  - 让条件规则（如适用，必须写具体）
  - 特殊规则

  #### 3.6 人员分工

  - 谁负责裁判/记分
  - 谁负责现场组织
  - 谁负责宣传拍照
  - 谁负责客户接待

  #### 3.7 物料需求

  - 海报/横幅（如有）
  - 奖品/奖杯（如有）
  - 记分表/赛程表
  - 其他物料

  #### 3.8 预热文案

  - 朋友圈文案（多阶段）
  - 群公告
  - 私聊邀约话术
  - 海报文案

  #### 3.9 执行时间线

  - 活动前XX天：启动宣传
  - 活动前XX天：报名截止
  - 活动前XX天：赛程/对阵公布
  - 活动前XX天：物料到位
  - 活动当天：执行流程
  - 活动后XX天：战报/总结

  #### 3.10 注意事项

  - 安全提醒
  - 规则提醒
  - 特殊情况处理预案

  ---

  ### 四、边界规则（8条合规红线）

  #### 4.1 门店不抽头不对赌（真底线，不是禁词）

  追分是真实赛制和真实客群叫法，可直说"追分赛""追分局"，不必避讳。真正的底线是：**门店本身不亲自抽头、不当庄、不对赌、不定盘口、不放贷**——门店只赚台费/助教费/报名费，客人之间的彩头是客人自己的事，门店不参与、不抽水、不背书。对**公开平台发布**的文案，仍按平台合规口径避免露骨赌博词（见 4.8），但内部话术/约客/赛事方案可照实表达追分氛围。

  #### 4.2 帮客人控金额（防炸店，也防门店踩开设赌场）

  彩头大小由客人自定，但教练/店长要盯着别越追越大：过线时出面压一压、拆小局，既护客人防上头巨亏、又把门店从风险里摘出。赛事奖金量级见知识层参考（4.7），具体数字由门店占位拍板，AI 不编造。

  #### 4.3 不乱编奖金

  赛事方案中的奖金金额禁止 AI 自行编造。全部使用占位符或明确标注"由门店确定"。

  #### 4.4 不乱编报名费

  赛事报名费必须由门店确定后填写。禁止 AI 自行建议报名费金额（即使是"参考行业惯例"也不行，因为不同城市/定位的球房差异太大）。

  #### 4.5 不乱编奖品

  赛事活动方案中的奖品内容禁止 AI 自行编造。不写"冠军奖励XX球杆""一等奖iPhone"等具体奖品。奖品信息由门店填写或使用占位符。

  #### 4.6 未提供的信息用占位提示

  活动方案中凡是没有用户输入的数值信息，全部用 [请填写：XXX] 占位。不要编造一个"看起来合理"的数字。

  #### 4.7 玩法叫法与行业常见量级（知识层参考，金额仍由门店占位拍板）

  - **台费局**：谁输谁掏台费，照实说，是追分客最常见的玩法
  - **饮料局**：输的人请喝饮料
  - **追分局/约局**：旗鼓相当两人约一局，图输赢刺激，门店帮撮对手、搭台造势
  - **小奖品挑战**：奖品为门店提供的小奖品（台费券/饮料/小礼品）
  - **搭子局**：撮合水平相近的客户一起打球
  - **抢一大战**：报名费+奖金制。行业常见量级——**报名费十元级、奖金几百元级（大致 200—500 元区间）**，可作 AI 撰写参考，但**具体数字一律由门店占位拍板**；核心是让条件增加偶然性，人人都可能赢

  #### 4.8 赛事活动内容合规

  - 朋友圈宣传不能使用"赌博""必赢""稳赚"等虚假承诺词汇
  - 赛事海报不能出现赌博相关视觉元素（筹码/扑克等）
  - 宣传文案的重点是"竞技""社交""技术交流"，不是"赢钱"

  #### 4.9 主题局 / 互动竞猜不擦边、只挂小奖品

  - 凡按"人群+场景"做主题局（拼台撮合、男女搭配等），**绝不擦边、不做暧昧暗示**，定位破冰交友、轻松社交。
  - 配合大型赛事的看球竞猜等互动，**竞猜只挂小奖品、不赌钱**——奖品为门店提供的台费券/饮料/小礼品。

  #### 4.10 追分计分照实写、门店仍不当庄不对赌

  - 追分赛照实写、点数是赛制计分单位，不必避讳。
  - 但门店本身**不抽头/不当庄/不对赌/不定盘口**（开设赌场罪），只收报名费、赚台费/助教费；对**公开平台发布**的文案按平台合规口径避免露骨赌博词，内部话术不受此限。

  ### 五、赛事主持词模板

  #### 抢一大战详细规则（重点轻竞技活动）

  抢一大战是台球房最典型的低门槛趣味赛，核心设计逻辑是通过让条件增加偶然性，让比赛不是高手稳赢，而是人人有机会。

  **活动安排**：
  - 每天两场：下午2点一场 + 晚上7点一场
  - 赛前必须提前预热宣传（朋友圈+群公告+私聊邀约）

  **报名与费用**：
  - 报名费：小额（10元级别），具体金额由门店确定
  - 报名方式：群内接龙/私聊报名/现场报名

  **奖金设置**：
  - 奖金范围：200-500元区间，具体金额由门店确定
  - 奖金来源：报名费池+门店补贴
  - 禁止AI编造具体奖金金额

  **让条件规则**：
  - 按球技档位（A/B/C/D档）设置让球/让分条件
  - 每低一个档位，受让对应让球数或分数
  - 让条件的核心目的：增加偶然性，让低水平客户也有赢的可能
  - 让条件必须写具体（如"A档让D档后二"），不能写"根据水平让球"

  **活动流程**：
  1. 赛前1-2天：开始预热宣传（朋友圈+群公告）
  2. 赛前2小时：群内提醒+私聊催报名
  3. 比赛当天：签到→抽签→比赛→颁奖
  4. 赛后：战报发布+下次活动预告

  **表达与底线**：
  - 称为"抢一大战""趣味比赛"；追分氛围可照实带，不必避讳改名
  - 🔴 门店不抽头/不当庄/不对赌/不定盘口（开设赌场罪）——门店只收报名费、赚台费/助教费
  - 对**公开平台发布**的文案按平台合规口径避免露骨赌博词（内部话术不受此限）
  - 赛事定位：竞技+社交+偶然性，让条件让人人有机会

  **产品输出规范**：
  - 抢一大战方案必须包含：时间（两场）、报名费（占位）、奖金（占位）、让条件规则、预热文案
  - AI不得编造报名费和奖金的具体金额
  - 让条件规则必须写清楚，不能模糊

  #### 5.1 开赛主持词（通用模板）

  适用于各类赛事开场，包含欢迎、规则介绍、奖励介绍三个核心环节。

  **开场欢迎：**
  尊敬的各位球友，大家下午好！欢迎及感谢大家在百忙之中莅临{store_name}！
  {tournament_name}将在{draw_time}进行抽签，{start_time}开始比赛。

  **规则介绍：**
  下面我来简单介绍一下比赛规则：
  - 赛制：{format_description}（如：全程双败负方结算台费，不可扣卡。采用五局三胜制（抢3），决赛采用九局五胜制（抢5））
  - 让条件规则：{handicap_rule}（如：参赛选手按照档位ABCD档，每低一个档位受让7分，以此类推）
  - 裁判安排：{referee_rule}（如：防守解球一杆，可由双方协议请助理教练作为裁判摆球计分，冠亚军决赛由主办方免费配备裁判）

  **奖励介绍：**
  接下来介绍一下比赛奖励：
  - 冠军：{champion_prize}
  - 亚军：{runner_up_prize}
  - 季军：{third_prize}
  - 其他名次：{other_prizes}
  - 特殊奖励：{special_prize}（如：比赛期间全场单杆最高分者获得"单杆王"称号+奖品）

  **收尾：**
  最后祝各位球友在{store_name}玩得开心，玩得愉快。品质生活，你我共享！谢谢！

  #### 5.2 抽签仪式主持词

  现在抽签仪式正式开始。
  接下来念到名字的参赛选手请到{table_number}号台进行抽签，有代抽的可联系在场工作人员进行代抽！

  #### 5.3 颁奖仪式主持词

  尊敬的各位球友，大家晚上好！
  历时{duration}的{tournament_name}到此完美收官，辛苦各位！

  我们的颁奖仪式马上开始：
  1. 首先恭喜我们的8强获得者（{top8_names}）
  2. 比赛期间单杆最高分获得"单杆王"称号者（{highest_break_player}）
  3. 接下来恭喜我们的季军获得者（{third_place}），亚军获得者（{runner_up}），最后恭喜我们的冠军获得者（{champion}）！
  4. 有请所有获奖的参赛选手前来颁奖并拍照留念！掌声送给他们！

  同时也感谢每一位参赛选手的支持与付出！
  我们下一期比赛，不见不散！

  #### 5.4 斯诺克让分赛主持词（专项模板）

  适用于斯诺克会员让分赛，让条件以"分"为单位。

  **开场：**
  尊敬的各位球友，大家下午好！欢迎及感谢大家在百忙之中莅临{store_name}！
  {store_name}斯诺克会员让分赛将在一点半进行抽签，两点开始比赛，会员免费参加，非会员报名费【请填写：XX元】。
  全程双败负方结算台费，不可扣卡。采用五局三胜制（抢3），决赛采用九局五胜制（抢5）。
  防守解球一杆，为了避免争议及比赛公正公平性，可由双方协议请助理教练作为裁判摆球计分，冠亚军决赛由主办方免费配备裁判！
  所有的参赛选手按照档位ABCD档，每低一个档位受让7分，以此类推。冠军究竟花落谁家我们拭目以待！

  **奖励：**
  - 冠军：【请填写：XX元现金+XX元台费卡】+奖杯+证书
  - 亚军：【请填写：XX元现金+XX元台费卡】+奖杯+证书
