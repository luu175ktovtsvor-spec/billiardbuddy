  ### 十一、定档让球赛落地 SOP（让弱者咬得住、强者赢不轻松）

  定档让球是台球房赛事公平性的核心抓手——按选手真实水平定"档位"，高档让低档球/分，让水平参差的人也能同场较量、人人有机会。落地要走这套流程：

  1. **教练定档**：参赛前由门店教练根据选手真实实力评定档位（如 S/9/8/7/6/5/4 档，或 A/B/C/D 档），档位越高水平越强。**定档权归主办方/教练**，选手不能自报偷档。
  2. **填档位牌、现场公示**：每位选手定档后填写"档位牌"并现场公示（KT 板/展架），让所有人看得见各自档位，公开透明、减少争议。
  3. **让球规则按档差**：档位每相差一档，高档让低档对应球/分。例：相邻一档相遇，高档"追 9"（多打一颗才算赢）、低档"追 8"；档差越大让得越多。具体让法门店写清，不能写"根据水平让球"这种模糊话。
  4. **须服从、否则弃赛**：选手在定档、比赛局数、局时、抽签细则上**必须服从主办方安排，否则视为自行弃赛**——这是保证赛事能跑起来的纪律底线。
  5. **屏蔽顶尖高手保公平（重要）**：为保证比赛公平、不让全场被一两个职业级碾压劝退，**对明显超出本店客群水平的顶尖/职业段位选手，主办方有权请其不参赛**（如"全国高段位/多次夺冠的职业级选手应主办方要求不予参赛"）。目的是护住"业余客人也能玩、也能赢"的氛围，这是留客而非竞技公平的取舍。
  6. **女子多让一档（友好设计）**：女子选手参赛时，男子选手在档位让球基础上**再多让一档/多让一球**（如"男选手全程让女选手后一"）——降低女性参赛门槛、鼓励女客群进场，是拉新和氛围设计，不是歧视。青少年同理可加让。
  7. **定档赛配套**：档位牌、积分牌、对战晋级表都要做成可公示物料（见物料清单），让档位/积分/晋级全程透明。

  ### 十二、报名费赛后转充值返还（让钱沉淀回一卡通）

  把"会员报名费"设计成赛后**全额充值进会员卡**，是一招把赛事现金流沉淀回门店、又让会员觉得"白打一场"的留客设计：

  - **会员**：报名费在赛后**全额充进本人会员卡（一卡通）**——等于"报名费没花、变成了卡里余额"，既鼓励会员踊跃报名，又把钱锁回门店后续消费。
  - **非会员**：正常收取报名费，不返充值（也可设计"非会员报名即送等额/部分会员卡"来引导办卡，金额占位）。
  - **效果**：报名费不再是"流出去的成本"，而是"沉淀进一卡通的预存款"，配合一卡通通吃台费/助教/商品，把单次赛事客流转成长期储值客。
  - **合规与占位**：报名费金额、返还比例一律【请填写】由门店定；表达为"报名费赛后充值至会员卡"，不写对赌返现。
  - （此规则同时收录于充值策略库，赛事方案与充值方案需口径一致。）

  ### 十三、赛事须知标准条款（写赛事方案/群公告必带）

  AI 生成正式赛事方案或群公告时，"选手须知"部分应包含以下标准条款（按门店实际删改，金额占位）：

  1. **检录/迟到判罚**：每场比赛提前 30 分钟（或开赛前 10 分钟到检录处检录）抽签；裁判长宣布开始后，迟到 5 分钟判负一局、迟到 10 分钟判负一场（或视为弃权）。
  2. **争议球须击球前提出**：比赛中如有争议球，**必须在击球前提出，击球后争议无效**——避免赛后扯皮。
  3. **负方现金结台费、不可扣卡/挂账**：败方当场以现金结清本局台费，不刷会员卡、不挂账；选手自购香烟饮料等商品需及时结清。
  4. **冲球方式**：全部使用三角框摆球，**胜方冲球**（按门店采用规则可调）。
  5. **禁酗酒/外挂彩金/赌博**：赛会期间严禁酗酒、外挂彩金和任何形式的赌博行为——这是合规底线，方案里必带。
  6. **商业标识须备案**：选手佩戴商业标识须经赛会组委会认可，并在开赛前向组委会申请备案通过。
  7. **服从赛会安排**：遵守赛会纪律、服从安排、尊重裁判判罚；比赛中手机静音、着装得体；违反者可被取消资格。
  8. **解释权**：活动最终解释权归主办方（门店）所有。
  - 注意：以上是通用条款骨架，**具体罚则尺度、检录时间、金额由门店定**，AI 不编造数字、不替门店拍板罚款额。

  ### 十四、赛事物料清单 + 抢局数随轮次递进梯度

  办一场像样的赛事，AI 给方案时应附"物料清单"提醒门店提前备齐，并把"抢局数随轮次升级"写进赛制，让越往后越好看、越紧张。

  **赛事物料清单（按需勾选，数量/单价由门店定）**：
  - 奖杯（常规赛/总决赛冠亚季军，铜质/水晶等档次）
  - 荣誉证书（各名次）
  - 档位牌（公示各选手档位，KT 板/展架）
  - 积分牌（公示实时积分，KT 板/展架）
  - 对战晋级表（公示赛程对阵，KT 板/展架）
  - 点数卡（追分计点用，可用扑克牌代替）
  - 水性马克笔（写档位牌/积分牌用）
  - 音响 + 话筒（主持、播报）
  - 赛程海报电子版（线上传播）
  - 赛程展架 + 架子（店内展示，180×80cm 级）
  - （物料数量、单价、总价一律由门店填，AI 不编预算金额。）

  **抢局数随轮次递进梯度（让赛事越打越精彩）**：
  - 早期轮次/胜部前段：**抢 5**（五局三胜，快、轮转高）；
  - 进入 8 强后：升到**抢 7**；
  - 决赛/总决赛收官：升到**抢 9**（甚至更高，如年终总决赛抢 13）；
  - 胜部冠军 VS 败部冠军（双败收尾）：用更长局数（如平打抢 9）定胜负。
  - 原理：前期局数短保证赛程能在限定天数内跑完、参与面广；越往后局数越长，偶然性下降、含金量上升、观赏性更强，决赛最隆重。具体梯度按参赛人数和场地时间由门店定。

  ### 十五、报名门槛设计（让人敢报、报了还想再报）

  报名门槛直接决定参赛人数。把门槛拆成"免/送/可重复/人人有奖"四招，最大化参与面，尤其拉女客群和新手：

  - **女子 / 青少年免报名费**：女子选手、未满 16 岁（或青少年）报名**免报名费**——降低女性和年轻客群参赛门槛，丰富现场氛围、利于拉新和社交。
  - **本地选手报名送卡**：本地/新选手报名即送等额或部分会员卡（金额占位），把"交报名费"变成"得了张卡"，顺势引导办卡沉淀。
  - **可重复报名**：常规赛/预选赛阶段，输了的选手在截止前可**重复报名再打**（见赛制骨架）——降低"一把出局就走"的劝退，提高到店频次和报名费总收入。
  - **参与奖人人有份**：设"参与奖"，所有参赛选手都得一份小奖励（如充值卡/台费卡 50 元级、小礼品，金额占位）——让没拿名次的人也不空手而归，体验好、下次还来。
  - **男选手报名门槛可略高于女选手**（如男子收报名费、女子免），用差异化门槛平衡男女比例、营造社交场。
  - **合规与占位**：所有报名费、送卡额度、参与奖金额一律【请填写】由门店定；不写对赌、不编数字。

  ### 6. 赛事方案输出检查清单

  AI生成赛事方案时必须逐项包含以下内容，缺一不可：

  1. ✅ 比赛形式（中式八球/斯诺克/九球）
  2. ✅ 赛制（单败淘汰/双败淘汰/循环赛）
  3. ✅ 让条件规则（按档位让球/让分，必须写具体，如"A档让B档后一"）
  4. ✅ 报名费和奖金（用占位符如果用户没提供）
  5. ✅ 比赛时间和地点
  6. ✅ 报名方式和人数限制
  7. ✅ 预热文案和群公告
  8. ✅ 执行SOP（谁负责什么）
