template: |
  ## 追分/博弈客群对内运营

  ### 一、这群人是谁（先认准客群）
  追分客户是四大类客户之一（散客求社交、竞技客求技术交流、助教客户求情绪价值、追分客户求赢钱/输赢刺激）。
  - 核心需求 = **赢钱（输赢那口气）**：图的是台费局赢一把的那口气、追分追到深夜的热乎劲，不是单纯练球。
  - 真实画像：手痒、好胜、爱约局、认人也认对手、来了就想找个旗鼓相当的打两局；
    赢了高兴、输了想翻盘，黏性极强，是球房氛围和台费的重要来源之一。
  - 价值：追分客户基数撑起竞技氛围（竞技球房氛围最主要因素=竞技客户基数），
    一桌热闹的台费局能带动整片区围观、拉动周边台子开台，是真实的高价值客群。

  ### 二、🔴 门店底线（先写清楚，再谈怎么运营）
  门店赚的是**场子的钱**——台费、助教费、商品器材费。追分这件事是客户之间自己的事，门店：
  - **不当庄坐庄**：不替客户拉盘、不当庄家、不安排谁跟谁赌多大。
  - **不定盘口**：不设赔率、不规定彩头大小、不做"几比几让几球赌多少钱"的规则。
  - **不抽水**：绝不从客户输赢的钱里抽成、抽点子、收水钱。
  - **不放贷**：不给客户垫钱、借钱、赊账去赌。
  > 以上任何一条踩了，门店就从"提供场地"变成"开设赌场"，是刑事红线（开设赌场罪），一票否决。
  门店能做的、且应该做的：把氛围搞热、把水平相近的人撮到一起约局、把追分客维护好让他常来开台。
  彩头大小、赌不赌、赌多少，全由客户自行决定，门店只收正常台费/助教费，对此不参与、不知情、不背书。

  ### 三、运营抓手（门店真正能发力的地方）

  #### 抓手1：约局撮合——把水平相近的对手凑一桌
  追分客最怕的是"没人陪打""对手太强或太弱打着没劲"。门店帮他找势均力敌的对手，就是最大的服务。
  - 给追分客打标签：球技档位 + 常来时段 + 常约的人 + 爱打的玩法（中八/斯诺克/九球等品类叫法照用）。
  - 撮合原则：**水平相近才有的打**——档位差太大一方碾压、一方没意思，都留不住。优先撮同档或差半档。
  - 落地动作：前厅/店长/教练做"局头"角色（只撮人、不参赌）——"X哥今天来了，跟你水平差不多，要不要约一局？"
  - 建追分/约局群（门店社群），群里发"今晚谁来追分""谁缺对手"，让客户自己接龙约局，门店只搭台不下场。
  - **撮局前防钓鱼**：撮局/配对前先核实双方真实水平（看球技档位、近期战绩、藏没藏分），别让藏分老手专挑新人下手宰一顿。新客被宰一次就不来了——挡住钓鱼是护新客留存的关键。发现有人惯性藏分专宰新手，店长/教练私下提醒、配对时避开，必要时按真实水平重新定档。

  #### 抓手2：营造热闹围观氛围——让一桌带活一片
  追分图的就是有人看、有气氛、赢得有面子。氛围越热，他越上头、开台越久。
  - 把追分台/竞技台放在显眼、好围观的位置（引流台逻辑），让路过的人能看、能起哄。
  - 关键局留意造势：围观、叫好、记分牌亮起来，音乐、人气、开台次序都往热闹上靠。
  - 拍精彩球、清台、逆风翻盘的短视频（经客户同意），既是门店氛围素材，也让追分客有成就感愿意再来。
  - 让助教/教练在旁边带气氛、记分、陪练，把"一个人干等"变成"一桌人热闹"。

  #### 抓手3：让条件增加偶然性——把"强者恒赢"变成"谁都有机会"
  纯比绝对球技，弱者永远输、很快就不来了。门店在玩法规则上做文章，给弱者机会、给强者悬念，留住更多人。
  - **让球/让分**：强让弱几球、几分，拉平胜率，弱者觉得"有的打"，强者觉得"有挑战"。
  - **限制条件**：限定手数、限定杆法、指定球序、盲拉对手等，给比赛加变量。
  - **赛制设计**：抽签配对、循环积分、败者复活、运气局（如指定球加分），让偶然性进来。
  - 目的：**降低强弱固化**，让每个人都觉得"今天说不定能赢"，从而愿意一次次开台来追。
  > 注意：这里调的是**球桌上的玩法规则**（怎么打更有看头、更公平），不是赌注规则。彩头不归门店管。

  #### 抓手4：控场——帮客户把金额控住，别越追越大炸店
  门店不当庄、不抽水、不定盘口（守住红线），但**不等于撒手不管**——教练/店长要盯着彩头别越追越大，过线时出面压一压。这既护客人防上头巨亏、护店里氛围别闹翻，又把门店从"开设赌场"的刑事风险里摘出来。
  - **盯彩头别越追越大**：追分客一上头容易越追越大，几把下来从小彩头滚成大额。教练/店长在旁带气氛时顺手盯着，感觉要失控就介入。
  - **过线出面压一压、拆小局**：彩头明显超出客人承受、或一方明显要被掏空时，以"局头/带气氛"的身份打个圆场——"今天差不多得了""换个玩法""喝口水歇会儿"，把大局拆成几个小局降温。
  - **既护客人又护门店**：客人被宰到巨亏会炸店、闹事、再也不来，门店若被认定纵容大额对赌则有开设赌场风险。控住金额是两头都护——是这行真实的控场动作，不是多此一举。
  - **始终守红线**：门店控的是"别炸店"，不是替客人定彩头、不抽水、不当庄。控场=降温、拆局、提醒，不是参与赌局。

  ### 四、追分/竞技客维护话术（可直接用，照实口语）
  对内维护这群人，靠的是"懂球、记得你、帮你找到好对手"，不是发广告。
  - **找对手**："X哥，今晚有个跟你水平差不多的来了，要不要约一局热乎热乎？"
  - **造期待**："上次你跟Y哥那局太精彩了，他说还想再追回来，啥时候有空？"
  - **拉氛围**："今晚人多、台子热，正适合开局，来不来露一手？"
  - **记成绩**（专属感）："上回你那记清台我还记着呢，今天状态肯定更好。"
  - **唤醒沉睡客**："好久没见你来追分了，最近手痒不痒？台子给你留着。"
  - 维护原则：自然、不骚扰、体现懂球，分新老程度和球技档位给不同话术，绝不群发模板。
  - 维护落点始终是"来店开台、来店约局"——门店赚台费/助教费，不碰彩头。

  ### 五、占位符与不编造
  - 价格、台费档位、助教费、活动奖品、具体金额：有门店资料用真实值；没有一律用【请补充：XX】，不瞎编。
  - 助教/客户/竞对的姓名、档期、历史战绩：必须基于门店录入资料，没有就留占位符，不虚构。
  - 输出彩头/赌注相关的具体金额：**一律不写、不建议、不替客户设定**——这是客户自己的事，门店不参与。

dos:
  - "给追分客打标签（球技档位+常来时段+常约对手），撮合水平相近的人约局"
  - "撮局前核实双方真实水平、防藏分老手专宰新人（护新客留存）"
  - "控场：盯彩头别越追越大，过线时教练/店长出面压一压、拆小局（护客人也护门店，不抽水不当庄）"
  - "把追分台/竞技台放显眼好围观处，靠氛围、人气、记分牌造热闹"
  - "用让球/让分/限制条件/抽签赛制增加偶然性，给弱者机会、留住更多人"
  - "维护话术体现懂球、记成绩、帮找对手，自然不骚扰、不群发"
  - "金额/姓名/战绩缺资料一律用占位符，不编造"

donts:
  - "🔴 不当庄、不定盘口、不抽水、不放贷——踩了就是开设赌场罪，一票否决"
  - "不替客户设定彩头大小、不写赌注金额、不对赌局背书或知情参与"
  - "不编造客户战绩、助教信息、价格档位"
  - "维护话术不群发模板、不骚扰、不跪舔"
  - "不出现任何第三方机构名/品牌名/人名/出处（器材品类叫法豁免）"
