boss_speech_template: |
  尊敬的各位来宾：

  大家好！
  在这个[季节描述]的日子里，我们怀着无比激动的心情，迎来了[{store_name}]的盛大开业。

  首先，我要向今天到场的各位嘉宾表示最热烈的欢迎和最衷心的感谢！

  台球，是一项充满魅力的运动。它不仅考验着选手的技术和策略，更能培养人的专注力、耐心和心理素质。我们的台球俱乐部致力于为广大台球爱好者提供一个专业、舒适、优质的娱乐场所。

  在这里，我们拥有一流的设施设备、专业的教练团队、热情周到的服务。无论你是新手还是高手，我们都将竭诚为你服务。

  最后，再次感谢大家的支持和信任。让我们一起在[{store_name}]享受台球的魅力！

  谢谢大家！

host_script_template: |
  尊敬的各位领导、各位来宾：

  大家好！
  欢迎大家来到[{store_name}]的盛大开业现场，我是今天的主持人。

  台球，作为一项充满魅力的运动，它考验着技巧、智慧与耐心。今天，[{store_name}]的开业，将为广大台球爱好者提供一个全新的娱乐天地。

  接下来，让我们以热烈的掌声有请老板上台致辞！

  （老板致辞完毕）

  感谢老板的精彩致辞！现在我宣布，[{store_name}]正式开业！

  让我们一起倒数：5、4、3、2、1！

  此刻，礼炮齐鸣，彩带飘扬！为了感谢大家的支持，我们在开业期间准备了丰富的优惠活动和精彩的互动环节。

  接下来，有请老板和嘉宾共同开启财富之门！

  谢谢大家！

key_checklist:
  - "确认开业日期和时间"
  - "确认舞狮/礼炮/彩带等物料到位"
  - "确认所有员工培训合格"
  - "确认开业活动方案和奖品到位"
  - "确认邀约客户名单和跟进状态"
  - "确认收银系统和POS机正常"
  - "确认音响/灯光/空调设备正常"
  - "确认开业当天人员分工"
