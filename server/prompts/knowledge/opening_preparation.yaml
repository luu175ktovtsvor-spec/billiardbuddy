key: "knowledge.opening_preparation"
name: "开业筹备知识库"
category: "knowledge"
variables: []
description: |
  新店开业前30-40天的筹备时间线和任务清单。
  目标：开业当天有足够客流，开业后能快速进入正常运营。
  核心：先搭团队，再拓客，最后全员培训。

template: |
  ## 开业筹备30天时间线

  ### 开业战略框架（房地产运营思维）
  像卖楼盘一样卖球房：先蓄客，再开盘，不是开门了才拉客。
  1. 梳理卖点：氛围（助教数量决定）、人情世故（竞技客户基数决定）、地段/环境/价格，提炼 1-3 个核心卖点对外统一口径
  2. 竞品分析：摸清周边 3-5 家的定价/客群/活动，找到差异化定位
  3. 定价体系：先定台费/服务费/商品三条线，再设计一卡通蓄客方案（小比例赠送，赠送仅限台位费）
  4. 蓄客预售：开业前把储备客户转成"预充值锁客"——开业前充值享一卡通权益，开业当天即有现金流和满台客流
  5. 开业引爆：用积攒的客户和预充值集中在开业当天爆发，而不是开业当天才开始找客

  ### 第一周（第1-7天）：调研+管理层搭建
  - 周边调研：人流动向、客群职业、商圈小区、消费力、竞对数量及定价
  - 竞对分析：调研3-5家竞对的球台品牌/数量/价格/活动/客群/评分
  - 确定定位：社区/商业/竞技/竞技商业
  - 招聘管理层：店长/助教管理/教练/主管（画像：销售能力+管理能力+赚钱欲望+执行力）
  - 确定薪资体系：底薪+提成+奖金

  ### 第二周（第8-14天）：招聘助教+拓客启动
  - 招聘助教：BOSS直聘/抖音/朋友圈（画像：形象>沟通>技术）
  - 7天筛选制：前7天双向筛选，不适合及时止损
  - 管理层开始拓客：加微信、建群、朋友圈、抖音预热
  - 确定开业活动方案

  ### 第三周（第15-21天）：全员培训+持续拓客
  - 服务理念/台球规则/各部门实操/礼仪培训
  - 教练培训助教球技：站位/手架/握杆/运杆/击球/瞄准
  - 全员拓客：抖音矩阵+朋友圈预热+地推邀约
  - 物料准备：用品采购、开业礼品、海报横幅

  ### 第四周（第22-30天）：开业冲刺
  - 全员考核，不合格淘汰
  - 连续7天朋友圈/抖音倒计时预热
  - 集中邀约储备客户，确保开业当天客流
  - 开业当天流程彩排

  ### 开业当天SOP
  09:00搭建 → 09:30舞狮开场 → 11:00主持人+老板致辞 → 11:18剪彩合影 → 11:21开门 → 20:00店长挑战赛

  ### 关键检查清单
  - 开业日期/时间确认、舞狮/礼炮/彩带物料到位
  - 所有员工培训合格、活动方案和奖品到位
  - 邀约客户名单和跟进状态、收银系统正常
  - 音响/灯光/空调正常、当天人员分工明确

timeline:
  week_1:
    name: "第一周：市场调研+管理层搭建"
    days: "第1-7天"
    tasks:
      - task: "市场调研"
        details: "周边调研：人流动向、客群职业、商圈、小区、消费力、当地商业球房数量及台费/服务费/商品费定价"
      - task: "竞对分析"
        details: "调研周边3-5家竞对：球台品牌/数量/价格/活动/客群/位置/评分"
      - task: "确定定位"
        details: "根据调研结果确定球房定位：社区/商业/竞技/竞技商业"
      - task: "搭建管理层"
        details: "招聘店长、助教管理、教练、主管。人才画像：销售能力、管理能力、赚钱欲望、执行力"
      - task: "确定薪资体系"
        details: "根据当地市场确定各岗位薪资：底薪+提成+奖金"

  week_2:
    name: "第二周：招聘助教+拓客启动"
    days: "第8-14天"
    tasks:
      - task: "招聘助教"
        details: "通过BOSS直聘/抖音/朋友圈发布招聘信息。人才画像：个人形象>沟通能力>台球技术"
      - task: "助教筛选"
        details: "7天筛选制：前7天为双向筛选，不适合的及时止损"
      - task: "拓客启动"
        details: "管理层开始拓客：加微信、建群、发朋友圈、抖音预热"
      - task: "确定活动方案"
        details: "开业活动方案：抢一大战/会员赛/小游戏/充值优惠"

  week_3:
    name: "第三周：全员培训+持续拓客"
    days: "第15-21天"
    tasks:
      - task: "全员培训"
        details: "服务理念培训、台球规则教学、各部门实操培训、礼仪培训"
      - task: "助教球技培训"
        details: "教练开始助教球技培训：站位、手架、握杆、运杆、击球、瞄准"
      - task: "持续拓客"
        details: "全员拓客：抖音矩阵发布、朋友圈预热、地推邀约"
      - task: "物料准备"
        details: "门店用品采购、开业礼品准备、海报/横幅制作"

  week_4:
    name: "第四周：开业冲刺"
    days: "第22-30天"
    tasks:
      - task: "全员考核"
        details: "培训期考核，不合格的淘汰"
      - task: "开业预热"
        details: "连续7天朋友圈/抖音预热，倒计时发布"
      - task: "邀约储备客户"
        details: "开业前7天集中邀约储备客户，确保开业当天有足够客流"
      - task: "彩排演练"
        details: "开业当天流程彩排：舞狮→剪彩→开门→挑战赛"
      - task: "员工照片拍摄"
        details: "拍摄员工照片，更改专业头像，让同事与客户清楚各岗位负责人"

opening_day_sop:
  timeline:
    - time: "09:00-09:30"
