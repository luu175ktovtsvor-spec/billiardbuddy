key: "knowledge.assistant_promotion"
name: "助教推广获客知识库"
category: "knowledge"
variables: []
description: |
  助教如何通过各种渠道推广自己获得更多上钟机会。
  助教的核心工作是营销获客（不是陪打），助教的核心任务是提升自己赚钱的能力。
  推广渠道：朋友圈、短视频、现场推荐、客户维护。

template: |
  ## 助教推广获客核心规则

  ### 核心定位
  - 助教是营销获客岗，不是陪打。赚钱公式：上钟时长 × 客户满意度 × 复购率
  - 推广卖点：专业陪练 + 技术指导 + 情绪价值，不是"美女陪打球"

  ### 朋友圈运营（每天1-2条）
  - 技术展示 30%（帮客户纠正握杆、教学成果）
  - 客户互动 25%（经客户同意的服务体验）
  - 门店活动 20%（赛事/优惠引流到店）
  - 个人生活 15%（练球日常，真实人设）
  - 赛事参与 10%（竞技氛围）
  - 禁止：低俗擦边、负面情绪、群发、客户隐私

  ### 短视频（每周2-5条）
  - 方向：技术教学、精彩进球、客户案例、门店氛围、台球科普
  - 标题前3秒要有钩子，定位本地标签，30秒-1分钟最佳

  ### 现场推荐四步法
  1. 观察客户打球水平和状态
  2. 自然搭话聊球（"看你打得不错，平时打得多吗？"）
  3. 说明助教价值（技术提升+陪练体验）
  4. 引导体验（"要不要体验一下？XX元/小时"）
  - 禁止：贬低客户水平、强制推荐、承诺效果

  ### 每日获客硬指标
  - 每日加客户微信 ≥20 人，渠道大致三分：交友平台、短视频、朋友圈/现场各约 1/3
  - 交友平台以"加微"为主，自己主动加与被加各占一半
  - 短视频获客走合规内容（技术/氛围/教学），不擦边、不带球台定位

  ### 客户维护回访话术
  - 离店30分钟内（建立第一次私聊）："哥今天打得挺尽兴，到家给我回个表情报平安哈，下次来提前滴我帮你留台"
  - 3天回访："上次打球感觉怎么样？有什么想提升的可以跟我说"
  - 7天回访："最近有在练球吗？想进步快的话约个时间我帮你看姿势"
  - 15天邀约："好久没来了，最近店里有活动，想来玩跟我说帮你留台"
  - 客户不回复不连续追问，给空间

  ### 提升收入要点
  - 排钟靠运气（保持积极状态）、办卡靠客情（感情>优惠）
  - 加钟靠技巧（不让顾客枯燥，转换模式）、点钟靠用心（老客户更要用心）

core_principle: |
  助教服务是单独付费的增值服务，不是免费陪练。
  推广的核心是"专业陪练+技术指导+情绪价值"，不是"有美女陪你打球"。
  助教赚钱的公式：上钟时长 × 客户满意度 × 复购率

channels:
  moments:
    name: "朋友圈运营"
    frequency: "每天1-2条"
    content_types:
      - type: "技术展示"
        ratio: "30%"
        example: "今天帮一个新手纠正了握杆姿势，打了30分钟进步明显"
        purpose: "展示专业能力"
      - type: "客户互动"
        ratio: "25%"
        example: "今天陪一个大哥打了2小时，他说明天还来找我"
        purpose: "展示服务体验（经客户同意）"
      - type: "门店活动"
        ratio: "20%"
        example: "周六有抢一大战，想参加的私信我报名"
        purpose: "引流到店"
      - type: "个人生活"
        ratio: "15%"
        example: "下班后练了1小时球，今天进步了一点"
        purpose: "展示真实人设"
      - type: "赛事参与"
        ratio: "10%"
        example: "今天参加了店里的周赛，虽然没拿冠军但打得不错"
        purpose: "展示竞技氛围"
    dos:
      - "内容多样化，不要每天发同样的类型"
      - "配图要清晰、好看"
      - "文字要简短、有信息量"
      - "体现专业度和服务态度"
    donts:
      - "不发低俗、擦边内容"
      - "不发负面情绪"
      - "不群发（显得敷衍）"
      - "不发客户隐私信息（未经同意）"

  short_video:
    name: "短视频运营"
    frequency: "每周2-5条"
    platforms: "抖音/快手/视频号/小红书"
    content_directions:
      - direction: "技术教学"
        example: "30秒教你正确的握杆姿势"
        purpose: "展示专业能力，吸引想学球的人"
      - direction: "精彩进球"
        example: "今天打了一个漂亮的翻袋"
        purpose: "展示球技，吸引竞技客户"
      - direction: "客户案例"
        example: "这个客户来了3次，从不会打到现在能清台了"
        purpose: "展示教学效果（经客户同意）"
      - direction: "门店氛围"
        example: "我们店晚上的氛围"
        purpose: "吸引到店"
      - direction: "台球知识"
        example: "台球的六种玩法，你都知道吗？"
        purpose: "科普引流"
    dos:
      - "标题要有吸引力（前3秒钩子）"
      - "内容要有价值（让人想学、想约）"
      - "定位本地标签"
    donts:
      - "不发低俗、擦边内容"
      - "不发过长视频（30秒-1分钟最佳）"

  on_site:
    name: "现场推荐"
    trigger: "客户到店打球时"
    approach:
      - step: "观察"
        details: "观察客户打球水平和状态"
      - step: "自然搭话"
        details: "不要直接推销，先聊球"
        example: "看你打得不错，平时打得多吗？"
      - step: "说明价值"
        details: "说明助教服务的价值（技术提升、陪练体验）"
        example: "我们有专业助教可以陪你练球，帮你纠正姿势，提升很快"
      - step: "引导体验"
        details: "引导客户体验助教服务"
        example: "要不要体验一下？[请填写]元/小时"
    dos:
      - "先观察再推荐，不要盲目推"
      - "强调技术提升和服务体验"
      - "态度自然，不要像推销"
    donts:
      - "不贬低客户水平"
      - "不强制推荐"
      - "不承诺效果"

  customer_retention:
    name: "客户维护"
    rules:
      - rule: "3-7-15天回访"
        details: "第一次上钟后3天回访体验感受，7天回访技术进步，15天邀约再次体验"
      - rule: "记住客户偏好"
        details: "记住每个客户的打球习惯、喜欢的球台、常来的时间"
      - rule: "节日问候"
        details: "节假日发个性化问候（不是群发）"
      - rule: "不骚扰"
        details: "客户不回复时不连续追问，给客户空间"
    scripts:
      - situation: "3天回访"
        script: "上次打球感觉怎么样？有什么想提升的可以跟我说"
      - situation: "7天回访"
        script: "最近有在练球吗？想进步快的话可以约个时间我帮你看看姿势"
      - situation: "15天邀约"
        script: "好久没来了，最近店里有活动，想来玩的话跟我说，帮你留台"

income_boost_tips:
  - tip: "排钟靠运气，心态决定运气"
    details: "保持积极状态，客户能感受到"
  - tip: "办卡靠客情"
    details: "客户要的是感情，不是优惠"
  - tip: "拓客靠勇气"
    details: "勇气是打开销售之门的钥匙"
  - tip: "时间靠管理"
    details: "每天比别人多一个小时，一年就是365个小时"
  - tip: "转介绍靠服务"
    details: "服务好当前每一位客户，客户会主动帮你介绍"
  - tip: "点钟靠用心"
    details: "越是老客户越不能掉以轻心，更要用心对待"
  - tip: "加钟靠技巧"
    details: "不让顾客感觉枯燥乏味，转换模式，提高语言艺术"
  - tip: "状态靠自律"
    details: "无论是朋友圈还是面对客户，不要表现出消极状态"
