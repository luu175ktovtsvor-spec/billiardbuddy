key: "knowledge.assistant_promotion"
name: "助教推广获客知识库"
category: "knowledge"
variables: []
description: |
  助教如何通过各种渠道推广自己获得更多上钟机会。
  助教靠营销获客把人约来、靠陪打上钟把钱挣到，营销与陪打是一条链：营销决定有没有客、上钟时长决定挣多少。核心任务是提升自己赚钱的能力。
  推广渠道：朋友圈、短视频、现场推荐、客户维护。

template: |
  ## 助教推广获客核心规则

  ### 核心定位
  - 助教靠营销获客把人约来、靠陪打上钟把钱挣到：营销决定有没有客、上钟时长决定挣多少，是一条链不是对立。赚钱公式：上钟时长 × 客户满意度 × 复购率
  - 推广卖点：颜值/形象/气质 + 专业陪练 + 情绪价值，落点是台球陪打（行业把个人形象列为助教第一卖点：形象 > 沟通能力 > 台球技术）。四种人设风格可任选其一打：性感、可爱、飒爽、潮酷

  ### 朋友圈运营
  - 内容方向：技术展示（帮客户纠正握杆、教学成果）、客户互动（经客户同意的服务体验）、门店活动（赛事/优惠引流到店）、个人生活（练球日常，真实人设）、赛事参与（竞技氛围）；内容多样化，别天天发同一种
  - 禁止：低俗擦边、负面情绪、群发、客户隐私
  - 代写某位助教的推广朋友圈时：要具体突出这位助教的特长和能给客户带来什么（某项球技、教学耐心、亲和力、能陪练也能逗乐气氛），让人记住"这个助教值得点"，别只泛泛说"今日有助教在店"。

  ### 短视频
  - 方向：技术教学、精彩进球、客户案例、门店氛围、台球科普
  - 标题前3秒要有钩子，定位本地标签，30秒-1分钟最佳

  ### 现场推荐
  - 先观察客户打球水平和状态，再自然搭话聊球（不要直接推销），说明助教价值（技术提升+陪练体验），引导客户体验
  - 禁止：贬低客户水平、强制推荐、承诺效果

  ### 每日获客（持续加微沉淀私域）
  - 通过交友平台、短视频、朋友圈/现场三个渠道持续加客户微信、沉淀私域（每日加微目标由门店自己定 [请填写]，三个渠道都动起来别偏废）
  - 交友平台以"加微"为主：主动去加 + 靠人设吸引被加，两头都做（探探/陌陌/Soul 这类是助教真实获客主渠道，注意养号防封）
  - 短视频走颜值/形象/氛围/技术/教学吸粉（这是抖音的流量型打法），公开平台发布注意别发露骨内容会被限流

  ### 客户维护回访话术
  - 离店后建立第一次私聊："哥今天打得挺尽兴，到家给我回个表情哈，下次来提前滴我帮你留台"
  - 体验回访："上次打球感觉怎么样？有什么想提升的可以跟我说"
  - 邀约话术："好久没来了，最近店里有活动，想来玩跟我说帮你留台"
  - 客户不回复不连续追问，给空间；唤醒老客递进式发、绝不群发

core_principle: |
  助教服务是单独付费的增值服务，不是免费陪练。
  推广的核心是"颜值/形象/气质 + 专业陪练 + 情绪价值"，落点是台球陪打（个人形象是助教第一卖点：形象 > 沟通能力 > 台球技术）。
  助教赚钱的公式：上钟时长 × 客户满意度 × 复购率

channels:
  moments:
    name: "朋友圈运营"
    content_types:
      - type: "技术展示"
        example: "今天帮一个新手纠正了握杆姿势，打了30分钟进步明显"
        purpose: "展示专业能力"
      - type: "客户互动"
        example: "今天陪一个大哥打了2小时，他说明天还来找我"
        purpose: "展示服务体验（经客户同意）"
      - type: "门店活动"
        example: "周六有抢一大战，想参加的私信我报名"
        purpose: "引流到店"
      - type: "个人生活"
        example: "下班后练了1小时球，今天进步了一点"
        purpose: "展示真实人设"
      - type: "赛事参与"
        example: "今天参加了店里的周赛，虽然没拿冠军但打得不错"
        purpose: "展示竞技氛围"
    dos:
      - "内容多样化，不要每天发同样的类型"
      - "配图要清晰、好看"
      - "文字要简短、有信息量"
      - "体现专业度和服务态度"
    donts:
      - "不发低俗、擦边内容"
      - "不发负面情绪"
      - "不群发（显得敷衍）"
      - "不发客户隐私信息（未经同意）"

  short_video:
    name: "短视频运营"
    platforms: "抖音/快手/视频号/小红书"
    content_directions:
      - direction: "技术教学"
        example: "30秒教你正确的握杆姿势"
        purpose: "展示专业能力，吸引想学球的人"
      - direction: "精彩进球"
        example: "今天打了一个漂亮的翻袋"
        purpose: "展示球技，吸引竞技客户"
      - direction: "客户案例"
        example: "这个客户来了3次，从不会打到现在能清台了"
        purpose: "展示教学效果（经客户同意）"
      - direction: "门店氛围"
        example: "我们店晚上的氛围"
        purpose: "吸引到店"
      - direction: "台球知识"
        example: "台球的六种玩法，你都知道吗？"
        purpose: "科普引流"
    dos:
      - "标题要有吸引力（前3秒钩子）"
      - "内容要有价值（让人想学、想约）"
      - "定位本地标签"
    donts:
      - "不发低俗、擦边内容"
      - "不发过长视频（30秒-1分钟最佳）"

  on_site:
    name: "现场推荐"
    trigger: "客户到店打球时"
    approach:
      - step: "观察"
        details: "观察客户打球水平和状态"
      - step: "自然搭话"
        details: "不要直接推销，先聊球"
        example: "看你打得不错，平时打得多吗？"
      - step: "说明价值"
        details: "说明助教服务的价值（技术提升、陪练体验）"
        example: "我们有专业助教可以陪你练球，帮你纠正姿势，提升很快"
      - step: "引导体验"
        details: "引导客户体验助教服务"
        example: "要不要体验一下？[请填写]元/小时"
    dos:
      - "先观察再推荐，不要盲目推"
      - "强调技术提升和服务体验"
      - "态度自然，不要像推销"
    donts:
      - "不贬低客户水平"
      - "不强制推荐"
      - "不承诺效果"

  customer_retention:
    name: "客户维护"
    rules:
      - rule: "记住客户偏好"
        details: "记住每个客户的打球习惯、喜欢的球台、常来的时间"
      - rule: "节日问候"
        details: "节假日发个性化问候（不是群发）"
      - rule: "不骚扰"
        details: "客户不回复时不连续追问，给客户空间"
    scripts:
      - situation: "体验回访"
        script: "上次打球感觉怎么样？有什么想提升的可以跟我说"
      - situation: "邀约"
        script: "好久没来了，最近店里有活动，想来玩的话跟我说，帮你留台"
