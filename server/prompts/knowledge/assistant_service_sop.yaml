key: "knowledge.assistant_service_sop"
name: "助教服务 SOP 知识库"
category: "knowledge"
variables: []
description: |
  球房助教服务标准操作流程与情商话术知识库。
  涵盖上钟前准备、打球中服务、下钟后锁客、私域跟进全流程。

  # 核心运营校准
  # 助教核心工作：营销获客（不是陪打）
  # 助教服务定位：单独付费的增值服务，不是免费陪练
  # 客户运营闭环：引流→服务→转化→复购→裂变

  核心心法：客人花钱点你，买的不是你高超的球技，而是"情绪价值"与"尊贵感"。
  不要试图在球桌上打败客人，你要做的是在情绪上征服客人。
  服务宗旨：眼里有活，嘴里有糖，心中有账。

template: |
  ## 助教服务 SOP 核心规则

  ### 核心定位
  - 助教是营销获客岗，不是陪打。赚钱公式：上钟时长 × 客户满意度 × 复购率
  - 服务宗旨：眼里有活，嘴里有糖，心中有账
  - 核心心法：客人买的是"情绪价值"与"尊贵感"，不是高超球技

  ### 上钟前3分钟（专业度定调）
  - 台面：先用刷子理台呢，检查巧克粉和架杆
  - 挑杆：主动挑2根重量不同的公杆，打好巧克粉
  - 话术："哥你好，我是X号助教。这张台子我刚理过，走球很顺。今天我给哥当好陪练，先热热身找找手感？"

  ### 打球中服务（60分钟情绪管理）
  - 连赢时：适度放水+捧球技，"哥你这杆法太厉害了，我都紧张了"
  - 连输时：主动安慰+转移话题，"这局运气差了点，下一局肯定翻盘"
  - 适时送饮料/水果，体现贴心
  - 打球时少玩手机，专注服务

  ### 下钟后锁客
  - 送客：送至电梯口，面对面给助教管理报备
  - 加微信：及时发感谢信息，"今天打得开心，下次来提前跟我说帮你留台"

  ### 私域跟进（3-7-15天）
  - 3天回访："上次打球感觉怎么样？有什么想提升的跟我说"
  - 7天回访："最近有在练球吗？想进步快的话约个时间帮你看姿势"
  - 15天邀约："好久没来了，最近店里有活动，想来玩跟我说帮你留台"

  ### 禁忌
  - 不让客人自己去拿球杆
  - 打球时不要试图在球桌上打败客人
  - 不群发消息（显得敷衍）
  - 客户不回复不连续追问

service_phases:
  phase_1:
    name: "上钟前3分钟（专业度定调）"
    steps:
      - step: "台面与物料掌控"
        action_sop: "助教到达台球桌前，必须先用刷子顺着方向理一遍台呢，检查巧克粉是否充足、架杆是否在位。"
        script: "哥你好，我是X号助教。这张台子我刚用刷子理过，咱们店用的是xxx的台呢，走球非常顺，没点功底还真控不住。今天我给哥当好陪练，咱们先随便热热身找找手感？"
        psychology: "一上来不问查户口的问题，而是通过介绍高档器材，瞬间建立专业人设，同时暗捧客人的球技。"
      - step: "挑杆服务"
        action_sop: "不要让客人自己去杆架上乱拿。助教主动挑出2根重量不同、皮头状态完美的公杆，并顺手打好巧克粉。"
        script: "哥，这两根杆我刚试过，一根偏重适合发力，一根偏轻适合打控制。皮头我都修过了，你颠一下看看哪根更合手？"

  phase_2:
    name: "打球中60分钟（情绪拉扯与连带销售）"
    core_principle: "三不问原则：不问收入、不问感情状况、不主动纠正动作（除非客人主动请教）"
    scenarios:
      - scenario: "客人连续进球，状态极佳"
        wrong_script: "好球。（太敷衍，像机器人）"
        best_script_detail: "哇！哥，你刚才这杆低杆拉得太透了！这发力，我看没个几年功底绝对打不出来。"
        best_script_strategy: "绝了！这球一般人都想着强攻，你这杆防守思路太清晰了，完全是职业级的大局观啊！"
      - scenario: "客人连续失误，脸色难看"
        action_sop: "绝对不能笑！立刻递上巧克粉，主动帮忙擦拭皮头，并立刻给出合理的'台阶'。"
        best_script: "哎呀太可惜了，就差半颗球的厚度！哥，今天这新台呢走球确实快，职业选手刚来也得适应两把。这局怪我没给你留好球形，下局我给你做个舒服的球。"
        psychology: "帮客人把失误的责任推给'新台呢太滑'或者'运气不好'，保住大哥的面子。"
      - scenario: "预判服务（无声胜有声）"
        water_service:
          timing: "打到第三局左右，客人稍微出汗或深呼吸。不要问'渴不渴'，直接拿温水或饮料过去。"
          script: "哥，看你出了点汗，打球喝太冰的伤胃，我给你倒了杯常温柠檬水，润润嗓子咱们继续。"
        ashtray_service:
          timing: "客人摸口袋找烟的一瞬间，烟灰缸立刻推到手边。"
      - scenario: "水吧/小吃的高情商连带推销"
        wrong_script: "哥，你要点点什么喝的吗？（容易被直接拒绝）"
        best_script: "哥，今天跟你打球太费脑子了，我看你也出了不少汗。咱们店吧台刚调了那种很解渴的冰镇果茶，酸酸甜甜的特好喝，要不我去给你端两杯过来解解乏？"
        psychology: "变'推销'为'关心'，顺理成章提高客单价。"

  phase_3:
    name: "下钟后5分钟（强制锁客）"
    steps:
      - step: "制造下一次见面的理由（加微信）"
        wrong_script: "哥，加个微信吧，下次来找我。（目的性太强，易引起反感）"
        best_script: "哥，今天跟你打这几局太尽兴了，尤其是你那杆防守我都没学明白。我加你个微信吧，下次你来之前提前滴我，我把最顺手的那根杆和这张台子提前给你留着，省得你来了还得等！"
      - step: "极致的送客体验"
        action_sop: "必须送至电梯口（目送下楼），不能在台子旁边说完拜拜就走。"
        script: "哥，路上开车慢点。刚出了一身汗，车里空调别开太大容易感冒，到家了有空给我回个表情包报个平安哈。"

  phase_4:
    name: "私域跟进（3-7-15回访法则）"
    steps:
      - day: "当天晚上"
        action: "必须完成备注打标。格式：张哥-爱抽利群-无糖可乐-喜欢打防守-性格稳重。"
      - day: "第3天（无痕互动）"
        action: "不推销。客人发朋友圈，进行一次走心的评论。"
        example: "客人发美食，评论：'这家店看着也太香了吧哥，下次我也去打卡！'"
      - day: "第7天（借用器材/活动邀约）"
        script: "张哥忙着呢？咱们店的球杆皮头刚找师傅全部精修了一遍，打感绝了！这周末有空没？过来试试手感，我把上次那张台子给你留着！"
      - day: "第15天（沉默客户激活）"
        script: "张哥，半个月没见你这防守大师来虐我了，最近是不是工作太忙啦？注意身体啊。下次来我请你喝咱们家新出的饮品！"

inspection_rules:
  description: "店长每天必须巡场抽查"
  deductions:
    - violation: "客人自己去找杆、找架杆"
      points: -10
    - violation: "助教在客人击球时，视线离开球桌看手机"
      points: -20
    - violation: "客人失误时，助教没有任何语言安抚或递巧克粉动作"
      points: -15
    - violation: "结账时未主动引导添加微信"
      points: -30
  penalty: "当月扣分超过50分，取消当月上钟排班优先权。"

assistant_core_mission:
  description: |
    # 核心运营校准：助教核心工作
    助教的核心工作不是陪打，而是营销获客。具体体现：
    1. 迎宾获客：主动迎接新客户，建立第一印象
    2. 加微信留存：每个服务对象100%加微信，进入私域
    3. 邀约复购：主动邀约客户二次到店，提升复购率
    4. 转介绍裂变：通过服务让老客户带新客户
    5. 门店消费引导：自然引导商品消费、充值、助教体验

  assistant_service_positioning:
    description: |
      # 核心运营校准：助教服务定位
      助教服务是单独付费的增值服务，不是免费陪练。
      - 不生成"免费助教""免费陪练""送助教课"等文案
      - 助教服务按课时收费，价格由门店确定
      - 助教体验仅限首次到店客户20分钟免费体验，之后按正常收费
      - 不把助教服务作为充值赠送的附属品

assistant_full_workflow_scripts:
  description: |
    # 助教陪打全流程话术（迎宾 → 陪打 → 送宾 → 超休报备 → 离岗）
    这是助教一单服务从客人进门到离店的完整动作 + 话术脚本，逐环节具体到一句话怎么说。
    口径：助教 = 台球陪练 + 情绪价值，靠服务把散客转成回头客/会员，不营销实际性交易。
    生成助教话术、培训稿、上钟 SOP 时优先引用本节的真实话术，别讲空泛大道理。
    话术里的等级/编号/称呼用占位（X号、X等级、X名），价格档位一律【请门店填写】，不编数字。

  daily_baseline:
    name: "每日基础动作（不上钟也要做）"
    items:
      - "岗前：化妆着装到可上岗标准、佩戴工牌，上班中及时补妆。选凸显身材的服装（吊带/连衣裙/短裙/短裤/高跟鞋等）"
      - "岗前例会：到岗参加部门例会，听助教管理做当日总结与计划"
      - "客户维护：每天给老客发天气/节假日问候；微信邀约信息每天至少5条"
      - "宣传推广：形象/球技/球房短视频每天2条；配合团队直播解说；朋友圈日常+约球每天2条"
      - "训练：按教练训练计划练球，每天至少2小时"
      - "免费体验：给新客/潜在助教客户20分钟免费陪打体验，每天至少5组"
      - "数据报表：每天群内汇报当日各项工作数据，1天1报"

  phase_welcome:
    name: "迎宾流程（按排班轮值，门店窗口）"
    rule: "除陪打/练球/直播/开会外的时间，按排班表轮流迎宾；优雅站姿、面带微笑，离岗须亲自把迎宾交接给下一位"
    steps:
      - step: "进门招呼 + 问需求（先分流是不是打球）"
        script: "欢迎光临X俱乐部。您好帅哥/老板，请问您是打球？打牌？还是找人？"
      - step: "介绍球房分区 + 自报家门 + 自荐陪打"
        script: "咱们这边VIP区【请门店填写】元/小时，提供摆球服务，直接给您开台吧？我是X号助教X名，需要我陪您打几盘吗？"
      - step: "配合收银开台、带客到台"
        script: "（对收银）麻烦给客人开下X号台，我现在带客人过去。"
      - step: "摆球时二次介绍：免费20分钟体验 + 商品推荐"
        script: "现在球房有助教陪打20分钟免费试打，看您应该是高手，可以跟您切磋几盘吗？帅哥/老板，您和朋友喝点什么饮料我给您拿？"
      - step: "迎宾重点1：判断是否首次到店、什么渠道来的"
        script: "您今天第一次来我们家打球吗？您是怎么了解到我们家的呀？"
      - step: "迎宾重点2：问到客人姓氏称呼，增加亲切感"
        script: "哥，我是X号助教X名，请问您这边怎么称呼呢？"
      - step: "迎宾重点3：做助教自我推荐"
        script: "帅哥，今天有约哪个助教打球吗？需要我陪您打几局吗？"
    penalty: "门迎无交接、玩手机、不带客：罚款50元/次（金额以门店制度为准）"

  phase_companion:
    name: "陪打流程（一单服务核心）"
    steps:
      - step: "接待 + 帮接拿物品（口袋提醒）"
        script: "您好，X号助教X名为您服务。需要我帮您拿下球杆吗？外套我帮您挂起来吧，口袋没有贵重物品吧？"
      - step: "介绍助教团队并自我介绍 + 自谦抬客"
        script: "我是X号X等级助教，您叫我X名就好。我打球时间短，您手下留情哈。"
      - step: "放置物品、询问饮料小吃，促进商品开单"
        script: "您喝什么饮料我帮您拿？到饭点了需要吃点什么吗？"
      - step: "群内报备上钟状态，去拿球杆"
        script: "（群内）X号上X号桌。（对客）您稍坐一下，我去帮您拿球杆，马上就来。"
      - step: "递冲杆请客人先开球"
        script: "（递过冲杆）哥，您先开球。"
      - step: "认真打球 + 架杆预判服务"
        action_sop: "态度端正、尽量发挥水平让客人感受到乐趣；客人要用架杆时提前预判、提前递好，打完从客人手中接过架杆放好。"
      - step: "每盘快速准确摆球（熟练）"
        script: "（摆好后）哥，请开球。"
      - step: "适时互动、表情管理（别全程无交流）"
        script: "哥，您是做什么生意的呢？哥，您球打得不错，打了蛮久吧？之前没见过您，平常常去哪个球房玩？"
      - step: "了解消费习惯与偏好（为转化做准备）"
        action_sop: "在聊天中摸清客人消费习惯、爱好、来店频率，记进客户备注，为后续转化/约球铺垫。"
      - step: "上钟期间客人要商品，助教亲自去吧台拿（有声服务）"
        script: "好嘞哥，我去给您拿，马上回来。哥，功能饮料帮您打开？哥，饮料帮您放这里啦。"
      - step: "客人打出好球/运气球，及时赞许（轻拍库边）"
        script: "好球啊哥，厉害！太准了这杆！"
      - step: "有定时提前5分钟告知"
        script: "哥，咱定时快到了，要不要接着再玩会儿？"
      - step: "陪打结束前加微信（想尽办法留联系方式）"
        script: "哥，认识您挺开心的，方便加个微信吗？有空咱好约球，下次来发个信息我给您留台不用排队。"
      - step: "客人去洗手间做指引、备纸巾"
        script: "洗手间在这边，我带您过去。（递纸巾）擦下手。"
      - step: "把客户球杆放入杆柜并发信息"
        script: "（微信）哥，球杆给您放好啦，下次来提前告诉我，给您留台。"

  phase_send_off:
    name: "送宾流程（结账即办卡充值的关键节点）"
    steps:
      - step: "提醒拿好私人物品，带去前台结账"
        script: "哥，您的外套，别忘了东西哈。"
      - step: "结账时推送充值/办卡（情商话术）"
        script: "哥，您可以办个会员，以后经常来玩，充值有优惠。哥，卡里钱不够了，这次多充点，您反正天天来玩，多充划算。"
      - step: "问停车票等细节，多为顾客着想"
        script: "哥，您开车来的吗？有免费停车票我帮您拿。"
      - step: "告知下次可提前联系留台"
        script: "哥，下次来发微信给我，给您留台哈。"
      - step: "送至电梯口，目送下楼"
        script: "哥，您慢走，下次再约哈。"

  phase_overtime_report:
    name: "超休/临时请假报备（核心收入但严格报备守边界）"
    note: "超休=助教出售时间的陪伴服务（陪吃饭/看电影/K歌等），区别于店内陪打。管理靠请假报备规避风险+注意人身安全，守距离界限/职业素养/不越界，不营销实际性交易。"
    steps:
      - step: "出发前群内报备（说明准确时间、时长）"
        script: "X号助教X名X月X日X点因事需请假外出X小时，请领导批准。"
      - step: "回岗群内报备"
        script: "X号助教X名临时请假结束，X年X月X日X点回岗。"
    rules:
      - "请假以整小时整点计，最少1小时（如18:55超休1小时则到19:55）"
      - "凡涉及晚上20:00-22:00之间请假的，一律直接请假至第二天凌晨00:00"
      - "已到岗需离店的，报备助教管理且至少请假1小时方可离岗；超时第一时间补请"

  phase_leave_post:
    name: "离岗/下班要求"
    rules:
      - "下班：最后一单陪打结束后方可下班；禁止提醒客户已下班致使提前下钟"
      - "外出：需做好工作交接、群内报备，告知店长外出和返回时间"