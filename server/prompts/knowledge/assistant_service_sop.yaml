key: "knowledge.assistant_service_sop"
name: "助教服务 SOP 知识库"
category: "knowledge"
variables: []
description: |
  球房助教服务标准操作流程与情商话术知识库。
  涵盖上钟前准备、打球中服务、下钟后锁客、私域跟进全流程。

  # 核心运营校准
  # 助教核心工作：营销获客（不是陪打）
  # 助教服务定位：单独付费的增值服务，不是免费陪练
  # 客户运营闭环：引流→服务→转化→复购→裂变

template: |
  ## 助教服务 SOP 核心规则

  ### 核心定位
  - 助教是营销获客岗，不是陪打。靠服务把散客转成回头客/会员
  - 助教服务是单独付费的增值服务，不是免费陪练，不营销实际性交易

  ### 上钟服务骨架
  - 能不让客户动手就不让客户动手（拿杆/收杆/架杆）
  - 自我介绍、主动沟通
  - 台面保持：理台呢、巧克粉、架杆到位
  - 适时送饮料/小吃，点烟
  - 打球时专注服务，不让客人自己去杆架乱拿

  ### 下钟/送客
  - 送客：送至电梯口，面对面给助教管理报备
  - 加微信：及时发感谢信息，约下次来提前留台

  ### 报备
  - 上钟报备格式：X号上X号桌
  - 超休/请假先群内报备，守距离界限、不越界

  ### 禁忌
  - 不让客人自己去拿球杆
  - 不群发消息（显得敷衍）
  - 客户不回复不连续追问

service_phases:
  phase_1:
    name: "上钟前（专业度定调）"
    steps:
      - step: "台面与物料掌控"
        action_sop: "助教到达台球桌前，先理一遍台呢，检查巧克粉是否充足、架杆是否在位。"
      - step: "挑杆服务"
        action_sop: "不要让客人自己去杆架上乱拿。助教主动挑出公杆，并顺手打好巧克粉。"

  phase_2:
    name: "打球中（能不让客户动手就不让客户动手）"
    steps:
      - step: "拿杆/收杆/架杆"
        action_sop: "客人要用架杆时提前预判、提前递好，打完从客人手中接过架杆放好。能不让客户动手就不让客户动手。"
      - step: "主动沟通 + 适时送饮料/点烟"
        action_sop: "态度端正、主动沟通，适时送饮料/小吃、点烟，专注服务不玩手机。"

  phase_3:
    name: "下钟后（送客 + 加微信）"
    steps:
      - step: "加微信（制造下一次见面的理由）"
        action_sop: "约下次来提前留台，把最顺手的杆和台子提前留好。"
      - step: "极致的送客体验"
        action_sop: "必须送至电梯口（目送下楼），不能在台子旁边说完拜拜就走。"

assistant_core_mission:
  description: |
    # 核心运营校准：助教核心工作
    助教的核心工作不是陪打，而是营销获客。具体体现：
    1. 迎宾获客：主动迎接新客户，建立第一印象
    2. 加微信留存：每个服务对象100%加微信，进入私域
    3. 邀约复购：主动邀约客户二次到店，提升复购率
    4. 转介绍裂变：通过服务让老客户带新客户
    5. 门店消费引导：自然引导商品消费、充值、助教体验

  assistant_service_positioning:
    description: |
      # 核心运营校准：助教服务定位
      助教服务是单独付费的增值服务，不是免费陪练。
      - 不生成"免费助教""免费陪练""送助教课"等文案
      - 助教服务按课时收费，价格由门店确定
      - 助教体验仅限首次到店客户免费体验，之后按正常收费
      - 不把助教服务作为充值赠送的附属品

assistant_full_workflow_scripts:
  description: |
    # 助教陪打全流程话术（迎宾 → 陪打 → 送宾 → 超休报备 → 离岗）
    这是助教一单服务从客人进门到离店的完整动作 + 话术脚本，逐环节具体到一句话怎么说。
    口径：助教 = 台球陪练 + 情绪价值，靠服务把散客转成回头客/会员，不营销实际性交易。
    生成助教话术、培训稿、上钟 SOP 时优先引用本节的真实话术，别讲空泛大道理。
    话术里的等级/编号/称呼用占位（X号、X等级、X名），价格档位一律【请门店填写】，不编数字。

  daily_baseline:
    name: "每日基础动作（不上钟也要做）"
    items:
      - "岗前：化妆着装到可上岗标准、佩戴工牌，上班中及时补妆。选凸显身材的服装（吊带/连衣裙/短裙/短裤/高跟鞋等）"
      - "岗前例会：到岗参加部门例会，听助教管理做当日总结与计划"
      - "客户维护：每天给老客发天气/节假日问候；微信邀约信息每天至少5条"
      - "宣传推广：形象/球技/球房短视频每天2条；配合团队直播解说；朋友圈日常+约球每天2条"
      - "训练：按教练训练计划练球"
      - "免费体验：给新客/潜在助教客户免费陪打体验"
      - "数据报表：每天群内汇报当日各项工作数据，1天1报"

  phase_welcome:
    name: "迎宾流程（按排班轮值，门店窗口）"
    rule: "除陪打/练球/直播/开会外的时间，按排班表轮流迎宾；优雅站姿、面带微笑，离岗须亲自把迎宾交接给下一位"
    steps:
      - step: "进门招呼 + 问需求（先分流是不是打球）"
        script: "欢迎光临X俱乐部。您好帅哥/老板，请问您是打球？打牌？还是找人？"
      - step: "介绍球房分区 + 自报家门 + 自荐陪打"
        script: "咱们这边VIP区【请门店填写】元/小时，提供摆球服务，直接给您开台吧？我是X号助教X名，需要我陪您打几盘吗？"
      - step: "配合收银开台、带客到台"
        script: "（对收银）麻烦给客人开下X号台，我现在带客人过去。"
      - step: "摆球时二次介绍：免费体验 + 商品推荐"
        script: "现在球房有助教陪打免费试打，看您应该是高手，可以跟您切磋几盘吗？帅哥/老板，您和朋友喝点什么饮料我给您拿？"
      - step: "迎宾重点1：判断是否首次到店、什么渠道来的"
        script: "您今天第一次来我们家打球吗？您是怎么了解到我们家的呀？"
      - step: "迎宾重点2：问到客人姓氏称呼，增加亲切感"
        script: "哥，我是X号助教X名，请问您这边怎么称呼呢？"
      - step: "迎宾重点3：做助教自我推荐"
        script: "帅哥，今天有约哪个助教打球吗？需要我陪您打几局吗？"
    penalty: "门迎无交接、玩手机、不带客：罚款50元/次（金额以门店制度为准）"

  phase_companion:
    name: "陪打流程（一单服务核心）"
    steps:
      - step: "接待 + 帮接拿物品（口袋提醒）"
        script: "您好，X号助教X名为您服务。需要我帮您拿下球杆吗？外套我帮您挂起来吧，口袋没有贵重物品吧？"
      - step: "介绍助教团队并自我介绍 + 自谦抬客"
        script: "我是X号X等级助教，您叫我X名就好。我打球时间短，您手下留情哈。"
      - step: "放置物品、询问饮料小吃，促进商品开单"
        script: "您喝什么饮料我帮您拿？到饭点了需要吃点什么吗？"
      - step: "群内报备上钟状态，去拿球杆"
        script: "（群内）X号上X号桌。（对客）您稍坐一下，我去帮您拿球杆，马上就来。"
      - step: "递冲杆请客人先开球"
        script: "（递过冲杆）哥，您先开球。"
      - step: "认真打球 + 架杆预判服务"
        action_sop: "态度端正、尽量发挥水平让客人感受到乐趣；客人要用架杆时提前预判、提前递好，打完从客人手中接过架杆放好。"
      - step: "每盘快速准确摆球（熟练）"
        script: "（摆好后）哥，请开球。"
      - step: "适时互动、表情管理（别全程无交流）"
        script: "哥，您是做什么生意的呢？哥，您球打得不错，打了蛮久吧？之前没见过您，平常常去哪个球房玩？"
      - step: "了解消费习惯与偏好（为转化做准备）"
        action_sop: "在聊天中摸清客人消费习惯、爱好、来店频率，记进客户备注，为后续转化/约球铺垫。"
      - step: "上钟期间客人要商品，助教亲自去吧台拿（有声服务）"
        script: "好嘞哥，我去给您拿，马上回来。哥，功能饮料帮您打开？哥，饮料帮您放这里啦。"
      - step: "客人打出好球/运气球，及时赞许（轻拍库边）"
        script: "好球啊哥，厉害！太准了这杆！"
      - step: "有定时提前5分钟告知"
        script: "哥，咱定时快到了，要不要接着再玩会儿？"
      - step: "陪打结束前加微信（想尽办法留联系方式）"
        script: "哥，认识您挺开心的，方便加个微信吗？有空咱好约球，下次来发个信息我给您留台不用排队。"
      - step: "客人去洗手间做指引、备纸巾"
        script: "洗手间在这边，我带您过去。（递纸巾）擦下手。"
      - step: "把客户球杆放入杆柜并发信息"
        script: "（微信）哥，球杆给您放好啦，下次来提前告诉我，给您留台。"

  phase_send_off:
    name: "送宾流程（结账即办卡充值的关键节点）"
    steps:
      - step: "提醒拿好私人物品，带去前台结账"
        script: "哥，您的外套，别忘了东西哈。"
      - step: "结账时推送充值/办卡（情商话术）"
        script: "哥，您可以办个会员，以后经常来玩，充值有优惠。哥，卡里钱不够了，这次多充点，您反正天天来玩，多充划算。"
      - step: "问停车票等细节，多为顾客着想"
        script: "哥，您开车来的吗？有免费停车票我帮您拿。"
      - step: "告知下次可提前联系留台"
        script: "哥，下次来发微信给我，给您留台哈。"
      - step: "送至电梯口，目送下楼"
        script: "哥，您慢走，下次再约哈。"

  phase_overtime_report:
    name: "超休/临时请假报备（核心收入但严格报备守边界）"
    note: "超休=助教出售时间的陪伴服务（陪吃饭/看电影/K歌等），区别于店内陪打。管理靠请假报备规避风险+注意人身安全，守距离界限/职业素养/不越界，不营销实际性交易。"
    steps:
      - step: "出发前群内报备（说明准确时间、时长）"
        script: "X号助教X名X月X日X点因事需请假外出X小时，请领导批准。"
      - step: "回岗群内报备"
        script: "X号助教X名临时请假结束，X年X月X日X点回岗。"
    rules:
      - "请假须群内报备准确时间、时长，整点计"
      - "已到岗需离店的，报备助教管理方可离岗；超时第一时间补请"
      - "守距离界限/职业素养/不越界，注意人身安全，不营销实际性交易"

  phase_leave_post:
    name: "离岗/下班要求"
    rules:
      - "下班：最后一单陪打结束后方可下班；禁止提醒客户已下班致使提前下钟"
      - "外出：需做好工作交接、群内报备，告知店长外出和返回时间"