  ## 前厅培训手册知识库

  # PPT核心校准
  # 4岗位：助教 | 助教管理 | 店长 | 教练
  # 核心卖点：氛围 + 人情世故
  # 客户运营闭环：引流→服务→转化→复购→裂变

  本知识库收录台球房前厅部培训的完整内容，包括岗位培训大纲、服务标准、考核要点和常见问题处理，供AI生成培训内容、服务话术和考核题目时参考。

  ---

  ### 一、前厅部组织架构与岗位职责

  #### 1. 店长岗位职责

  **核心职责：**
  - 全面负责门店经营管理工作
  - 对门店营业额和利润负责
  - 制定月度经营计划和营销方案
  - 负责员工招聘、培训、考核、晋升
  - 维护客户关系，处理重大投诉
  - 负责门店安全管理

  **日常管理要求：**
  - 准时上班，提前30分钟到店巡场
  - 每日主持晨会，传达工作安排
  - 每日巡场不少于3次（上午、下午、晚间各1次）
  - 班后召开例会，总结当日经营
  - 每周提交经营分析报告

  **人事管理权限：**
  - 领班最多批假1天
  - 店长最多批假3天
  - 超过3天需老板批准
  - 月累计请假超过3天需老板批准

  #### 2. 主管岗位职责

  **核心职责：**
  - 协助店长完成门店日常运营管理
  - 负责前厅人员管理和排班
  - 负责助教日常管理和培训
  - 监督服务标准执行
  - 处理客户一般投诉

  **日常工作要求：**
  - 参加晨会，领取当日任务
  - 确认各岗位到岗情况
  - 每小时巡查1次各区域
  - 14:00-16:00负责助教集中教学和监督练球
  - 17:00-19:00高峰时段现场管理
  - 22:00日终向店长汇报

  #### 3. 收银员岗位职责

  **核心职责：**
  - 负责门店收银结算工作
  - 会员卡办理和管理
  - 营业数据统计和报表
  - 商品销售和库存管理

  **收银操作规范：**
  - 台费、商品、陪打费分别核算
  - 每笔交易确认金额后再操作
  - 团购券、优惠券核销需核对有效期
  - 会员折扣自动计算，不可手动修改
  - 当日现金当日清点，账实相符

  #### 4. 服务员岗位职责

  **核心职责：**
  - 负责客户接待和服务
  - 保持门店环境卫生
  - 球具管理和维护
  - 饮品配送和台面服务

  #### 5. 前台接待岗位职责

  **核心职责：**
  - 客户接待和引导
  - 电话接听和咨询解答
  - 会员推广和开台引导
  - 助教预约协调

  ---

  ### 二、服务标准体系

  #### 1. 有声服务标准

  **基本要求：**
  - 客人进门3秒内主动打招呼："您好，欢迎光临！"
  - 客人离店时说："谢谢光临，欢迎下次再来！"
  - 服务过程使用礼貌用语："请"、"谢谢"、"不好意思"

  **定岗站姿要求：**
  - 两人站立对称定位
  - 精神饱满，面带微笑
  - 面对门口，随时关注客人需求
  - 不得倚靠柜台、聊天、玩手机

  #### 2. 客户接待流程

  **标准流程：**
  1. 客人进门 → 主动迎接，引导入座
  2. 帮客户开台 → 确认台号、计费标准
  3. 拿球杆 → 根据客人需求提供合适球杆
  4. 递巧克粉 → 主动递上巧克粉
  5. 询问茶水 → 主动询问茶水饮料需求
  6. 营业中 → 及时摆球、添茶水、清洁台面
  7. 客人离场 → 引导结账、欢送

  **茶水服务标准：**
  - 客人入座后5分钟内送上第一杯茶
  - 茶水低于三分之一杯时及时添加
  - 烟灰缸内烟蒂超过8颗及时更换

  #### 3. 客户离场复位标准

  **复位检查清单：**
  - 擦拭球杆汗渍，按标准摆放回杆架
  - 将台球放入集球器，检查少球或破损
  - 顺毛刷台呢，清理巧克粉残留
  - 擦拭库边手印和巧克粉
  - 架杆归位
  - 茶几清洁
  - 烟灰缸注水复位
  - 检查是否有遗留物品

  ---

  ### 三、营业前检查标准

  #### 1. 台面摆设检查

  - 台面清洁无污渍
  - 球具完整无缺失
  - 架杆归位摆放整齐
  - 台灯正常开启

  #### 2. 台椅摆设检查

  - 椅子摆放整齐
  - 座位清洁无污渍
  - 扶手稳固无松动

  #### 3. 工作台检查

  - 收银系统正常
  - 打印机正常
  - 扫码设备正常
  - 宣传物料摆放整齐

  #### 4. 地毯卫生检查

  - 无明显污渍
  - 无纸屑杂物
  - 吸尘清洁到位

  #### 5. 环境检查

  - 灯光正常开启
  - 空调温度适宜（夏季24-26度，冬季20-22度）
  - 通风良好无异味
  - 背景音乐音量适中

  ---

  ### 四、设备损坏处理流程

  1. 服务员发现设备损坏 → 立即报告主管
  2. 主管核查损坏原因和程度
  3. 属客人损坏 → 当面确认，协商赔偿
  4. 属员工违规操作 → 责任人赔偿
  5. 属自然损耗 → 领班保工程部维修
  6. 填写设备损坏记录表
  7. 跟进维修进度，确保及时修复

  ---

  ### 五、客户投诉处理规范

  #### 对客标准

  - 执行"客人总是对的"原则
  - 克己自检，不与客人争辩
  - 道歉 + 解决 + 感谢
  - 任何员工都必须先道歉并表示理解
  - 接到投诉的员工必须负责到底
  - 自己处理不了的立刻通知主管

  #### 对内标准

  - 区分合理投诉和非合理投诉
  - 合理投诉：研究原因、制定防范措施、视情节处理责任人
  - 非合理投诉：员工已礼貌劝阻和耐心解释的，不承担个人责任
  - 所有投诉必须记录在投诉登记本上

  #### 投诉处理步骤

  1. 倾听：真诚耐心听取客人意见，不打断
  2. 肯定：用和蔼语言肯定客人意见，稳定情绪
  3. 道歉：无论对错，先道歉
  4. 解决：提供解决方案，征求客人意见
  5. 跟进：事后回访，确认客人满意
  6. 记录：填写投诉处理记录
  7. 改进：分析原因，制定防范措施

  ---

  ### 六、安全管理制度

  #### 日常安全

  - 勤查设备，防患于未然
  - 熟练使用消防器材
  - 工作期间不会客，不带外人进入
  - 营业结束后检查灯、电器、烟头
  - 客人遗失物品及时追还或上交

  #### 突发事件处理

  - 对行为不轨客人密切关注并通知主管
  - 发生火情立即疏散客人，拨打119
  - 客人受伤立即提供帮助，必要时拨打120
  - 严禁员工班后在门店逗留
  - 严禁在店内吸烟、喝酒、赌博

  ---

  ### 七、员工行为规范

  #### 仪容仪表

  - 统一着装，工牌佩戴整齐
  - 头发整洁，不留奇异发型
  - 指甲修剪整齐，不涂指甲油
  - 不佩戴夸张首饰

  #### 工作纪律

  - 不得擅自离岗、串岗
  - 不得在客人面前打闹、闲聊
  - 不得使用客用设施
  - 不得私下接受客人馈赠
  - 不得泄露公司商业信息
  - 对待客人须一视同仁
  - 严禁向客人诉说私事
  - 工作中无论发生任何情况，严禁在客人面前喊叫

  ---

  ### 八、常见问题处理指南

  | 场景 | 处理方式 |
  |------|----------|
  | 客人嫌价格贵 | 礼貌解释定价依据，推荐会员卡优惠 |
  | 客人要求打折 | 按公司规定执行，超出权限请示主管 |
  | 客人投诉服务差 | 先道歉，了解情况，立即改进 |
  | 客人投诉环境差 | 先道歉，立即处理，事后跟进 |
  | 客人损坏设备 | 礼貌说明，协商赔偿 |
  | 客人遗留物品 | 妥善保管，及时联系归还 |
  | 客人醉酒闹事 | 劝阻无效通知主管，必要时报警 |
  | 客人要求开发票 | 按规定开具，确认信息准确 |
  | 客人对助教不满 | 先道歉，更换助教，事后分析原因 |
  | 客人要求见老板 | 礼貌解释，记录诉求，转交店长 |

  ---

  ### 九、培训考核要点

  #### 新员工入职培训（3天）

  **第1天：**
  - 公司介绍和企业文化
  - 门店环境熟悉
  - 岗位职责说明
  - 服务礼仪培训

  **第2天：**
  - 操作系统培训（收银、开台）
  - 服务流程实操
  - 产品知识（台球基础、会员体系）
  - 投诉处理培训

  **第3天：**
  - 实习跟岗
  - 考核测试
  - 签订劳动合同和保密协议

  #### 在岗培训（每月）

  - 月度服务技能提升培训（1次/月）
  - 月度考核测试（1次/月）
  - 不合格者补训1周后重新考核
  - 连续2次不合格考虑调岗或辞退

  #### 考核标准

  - 理论测试：填空题+选择题+判断题+简答题，满分100分，80分合格
  - 实操测试：模拟服务场景，考官评分，80分合格
  - 综合评定：理论40% + 实操40% + 日常表现20%

  ---

  ### 台呢维护SOP

  #### 日常维护（每2小时）

  1. 用专用马毛刷顺毛方向刷台呢（从开球线方向向集球器方向）
  2. 禁止逆毛刷，会损伤台呢纤维
  3. 用小毛刷清理库边灰尘
  4. 用干净毛巾擦拭库边手印和巧克粉痕迹

  #### 深度保养（每周1次）

  1. 用专业台呢吸尘器吸尘
  2. 检查台呢有无起毛、变色、破损
  3. 如有轻微起毛，用台呢修剪器处理

  #### 台呢熨烫标准

  1. 熨斗调温200度
  2. 先用马毛刷顺毛刷一遍
  3. 用小毛刷清理库边
  4. 用湿毛巾逆毛擦拭（拧不出水为标准），每张毛巾擦3张台
  5. 熨斗从开球线内侧向集球器方向缓慢匀速熨烫
  6. 熨完后用湿毛巾擦拭库边

  #### 台呢损坏判断与报修

  - 起毛严重（影响走球）→ 报修，安排更换
  - 变色（大面积污渍无法清除）→ 报修
  - 破损（撕裂、破洞）→ 立即报修，暂停使用
  - 报修流程：前厅主管记录 → 上报店长 → 联系供应商 → 安排更换时间
