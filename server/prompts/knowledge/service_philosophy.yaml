template: |
  ## 服务理念场景化知识库

  # 核心运营校准
  # 球房两大核心卖点：氛围 + 人情世故
  # 氛围 = 听觉(音乐) + 触觉(温度) + 视觉(人气/助教数量) + 嗅觉(香氛)
  # 人情世故 = 服务细节 + 社交连接 + 情绪价值
  # 客户运营闭环：引流→服务→转化→复购→裂变

  本知识库收录台球房一线服务的真实场景动作与话术，供 AI 生成服务培训内容、话术指导、考核标准时参考。不讲空泛口号，只给员工每天会撞到的真实场景与对应做法、话术。

  ---

  ## 助教上课标准服务三段式：上钟 → 送客（核心 SOP）

  助教带客流程 = 上钟服务 → 送客服务，每段都有标准动作。

  ### 上钟服务（陪打/上课中）
  - **能不让客户动手就不让客户动手**：拿杆、收杆、架杆、摆球、点烟都主动到位。
  - 开场先**自我介绍**，**主动沟通**破冰、了解客户喜好。
  - 全程**保持台面**：客户打完一局换人时快速整理球；台面有水渍主动擦；球台布起毛及时报修。
  - 递杆、架杆、收杆动作自然麻利，让客户感觉被照顾到。

  ### 送客服务（结束离店）
  - **送至电梯口**（不是台边一句"慢走"就完事）。
  - 送完客**面对面给助教管理报备**（上钟时长、客户情况）。
  - 客户离店后**及时发送感谢信息**，为下次邀约埋线。

  ---

  ## 迎宾接待场景动作

  **场景 1：散客首次进店**
  - 客户推门进来，前台或最近的服务员立即自然招呼（别用机械的"欢迎光临"）："来啦，几位？我给你看个合适的台。"
  - 引导客户到合适区域，介绍分区和价格。
  - 帮客户开台，递上巧粉和矿泉水。

  **场景 2：老客户进店**
  - 客户进门，前台热情说："王哥来啦！您老位置今天空着呢，我帮您开台。"
  - 记住客户偏好的区域和球台。

  **场景 3：客户独自等人**
  - 客户一个人在等朋友，主动说："哥，朋友还没到？先打两杆练练手？"
  - 递上球杆，帮客户摆好球。

  **场景 4：新手客户**
  - 看到客户明显不会打球，主动说："哥，第一次来吧？我教您基本姿势？"
  - 不嘲笑客户技术差，耐心指导；客户对规则不太懂时适当帮讲解——这些小细节最能体现球房的专业和贴心。

  ---

  ## 离店送客场景动作

  **场景 1：普通客户离店**
  - 客户准备走，服务员说："哥慢走，下次再来啊！"
  - 客户出门后目送，不要客户刚转身就低头玩手机。

  **场景 2：雨天 / 深夜离店**
  - 下雨主动提醒："外面下雨了，您有伞吗？"
  - 凌晨客户要走："这么晚了，路上注意安全，到家发个消息。"必要时帮客户叫车。

  **场景 3：客户遗落物品**
  - 第一时间联系客户："哥，您落了件外套在 X 号台，我们帮您收好了，什么时候来取都行。"
  - 贵重物品（手机、钱包）单独保管，做交接记录。

  ---

  ## 巧粉 / 皮头 / 台面 / 温度维护

  **巧粉管理**
  - 客户坐下打球前，巧粉已经放在台面上，正放（蓝色面朝上）方便直接拿取。
  - 客户巧粉用完了，不等开口主动递上新巧粉。
  - 客人爱把巧粉倒扣在台面、容易掉粉沾衣服、还易让母球起静电：趁摆球的间隙帮客人把台帮擦干净、把巧粉放正，顺带提醒"巧粉倒扣容易掉粉到台帮、沾衣服不好洗"；也可摆球时帮客人把母球上的巧粉擦掉。

  **皮头维护**
  - 发现客户球杆皮头磨损，主动说："哥，皮头该换了，我帮您修一下？"
  - 修完皮头后帮客户试打确认。

  **台面与饮品**
  - 客户打完一局换人时快速整理球；台面有水渍主动擦拭；球台布起毛及时报修。
  - 客户打球半小时左右主动问："哥，喝点什么？"；记住常客饮品偏好；冬天推热饮、夏天推冷饮。

  **温度控制**
  - 夏天客户打球出汗适当调低空调；冬天保证室内温度舒适；包厢区域可单独调节。

  ---

  ## 走动式服务

  - 服务员在区域内走动，不坐在吧台玩手机、不扎堆聊天。
  - 走过每张球台时扫一眼：巧粉够不够、水有没有、台面是否整洁；发现客户在找东西主动上前："哥，需要什么？"
  - 客户打球不顺心有情绪，适时递水："哥，歇会儿喝口水。"客户正专注打球时不打扰。
  - **不从客人瞄球的视线里穿过**；会挡到就停一下，等客人打完这杆再过去。
  - 问客人事情**一定等他这杆球打完再问**，或者问没在打球的同行客人。

  ---

  ## 高频场景话术：换台 / 退卡 / 排队 / 会员查询

  **球台故障 / 换台**
  - 客户说"这桌子有毛病"，立即到台边查看；能修当场修，不能修马上换："哥，这张台我给您换一张，马上安排。"
  - 绝对不说"就这样"或"将就打吧"。

  **噪音协调**
  - 客户反映隔壁太吵，立即过去委婉提醒："哥，隔壁在打球，稍微小声点哈。"协调不了就给被影响的客户换个安静区域。

  **价格争议**
  - 客户觉得贵，不说"我们不贵"，而是："哥，我理解，我们这个价位是有原因的——您看球台配置、环境、服务……"让客户感受到价值，不与客户争辩。

  **排队等候**
  - 高峰期需要等台："哥，现在满了，大概要等 20 分钟。您先坐这边喝杯水，到台了我马上叫您。"提供等候区饮品，到台第一时间通知。

  **会员查询 / 忘带卡**
  - 客户忘带储值卡，不说"没卡不能打折"，而是："哥，您报一下手机号，我帮您查一下会员信息。"主动帮客户想办法，不用规定堵客户。

  **退卡**
  - 不刁难、不拖延，按流程处理："哥，理解您的想法，退卡流程我帮您走，大概 X 天到账。"退卡不代表结束，留好印象客户可能还会回来。

  **充值 / 活动透明**
  - 充值说清楚：金额、赠送、使用规则、有效期，不夸大、不隐瞒限制。
  - 活动规则写清时间、条件、限制，不用"最终解释权归本店所有"这种模糊条款，来了就按宣传执行。

  ---

  ## 助教形象管理与重点管理

  - **形象管理**：靠引导、赞美、及时奖励来抓，不是靠骂。
  - **违纪管理**：迟到、打扮不得体、嚼舌根等问题及时纠正。
  - 助教带人核心：一对一、面对面、松弛有度、有营销意识。

  ---

  ## 助教守红线（自爱 · 诚信 · 人情世故）

  助教疑难问题的处理原则就三个词：**自爱、诚信、人情世故**。

  - **自爱、守分寸**：陪打/上课中崇拜、撒娇、适度肢体接触、抢局活跃气氛属正常服务话术，但**到此为止**——不越界、不发展线下私下交易、不做任何越线行为。客户对助教有不当想法时，得体回绝、用人情世故化解，绝不顺势越线。
  - **诚信**：不骗钱、不哄客户冲动消费做超出能力的承诺。
  - **硬红线（任何时候不碰）**：不组织/不参与赌博抽水、不当庄、不对赌；不做擦边到实际性交易的任何行为；不涉及未成年人；不帮任何刑事级违法。这几条压倒一切话术与业绩。
