  ## 顾客至上 · 6 条具体行为准则（落地版）

  顾客至上 = 把"为顾客服务"摆第一位，想顾客之所想、急顾客之所急、满足顾客之所需。
  上面 6 条理念是"心法"，下面 6 条是"具体表现"——员工每天会撞到的真实场景与对应做法、话术。两套配合用：理念定方向，准则给招式。

  ### 准则一：不拒绝顾客的要求

  - 对顾客提出的任何正当、合理要求，先想办法尽最大努力满足。在确实没办法之前，绝不简单地对顾客说"不"。
  - 因条件限制无法用顾客要求的特定方式/对象满足时，先想能不能用**替代方案**满足同一需求——人的同一种需求往往能用不同对象、不同方式满足。
  - 不能满足时，不是冷冰冰拒绝，而是**委婉、礼貌地提替代建议**，并让顾客感受到"我是愿意效劳的、已经尽了最大努力"。哪怕最终没满足，也要真诚请求顾客谅解、表达歉意。
  - "尽力了所以心安理得"不算合格——优秀员工是尽力 + 让顾客谅解。

  **场景话术**
  - 顾客要苏打水、店里没有：不能直接回"没有"。
    → "不好意思老板，我们这边没有苏打水，您看矿泉水可以吗？"
  - 顾客要高级助教、目前都在忙、只有中级助教在：
    → "不好意思老板，高级助教这会儿都在忙，目前空着的是中级助教。要不我先安排中级助教陪您打一会儿，等高级助教下了钟我第一时间给您调换，您看行吗？"

  ### 准则二：顾客的事是大家的事

  - 顾客在店里遭遇的任何不方便、不愉快，都会影响他对整体服务的感知；任何一个细微环节的疏忽都可能前功尽弃。
  - 员工之间在接待上有分工，但**不属于自己职责范围的事，不等于可以不闻不问**。相对顾客而言，所有员工只有一个共同职责：帮顾客解决困难。
  - 顾客提需求，不管是不是你分内的事，都要热情接待；自己解决不了，也要帮他找到能解决的人或想出办法，**绝不能以"这不归我管"把顾客一推了之**，也不能毫无诚意敷衍。
  - 靠的是员工自觉的服务意识，不是只靠首问责任制兜底（多数顾客遇到不满意会直接走、不投诉）。

  **场景话术 / 做法**
  - 客户问"能帮我安排个助教吗？"——服务部别回"我安排不了、不归我管"，而是请客户稍等，呼叫前台或助教管理来安排。
  - 区域服务员忙不过来摆球时，不在自己负责区的客户叫你摆球：别因为"不是我的区"拒绝，主动互相补位——因为你自己也会遇到同样的时候。
  - 助教空闲时，客户找你帮忙拿瓶水：别回"这是服务员的事"，顺手帮了。

  ### 准则三：不给顾客带来任何不愉快

  - 自始至终保持愉快、亲切的服务态度，**任何时候都不以生硬、冷漠的态度接待顾客**。任何原因都不能成为发脾气、使性子、耍态度、失礼貌的理由。
  - 不因个人原因（生活不顺、身体不适、情绪低落）降低服务热情——优秀员工会把个人情绪挡在服务之外。
  - 不因顾客行为不合适而失控：无论顾客怎么表现，都保持温和友好、彬彬有礼，**不顶撞、不回敬、不以生硬尖刻的话怼回去**。

  ### 准则四：不干扰顾客（核心：三轻）

  - 顾客在接受服务时有权要求清静和自由不被打扰。"零度干扰"是追求目标。干扰主要分**声音干扰**和**空间干扰**两类。
  - **三轻**（避免声音干扰）：**交谈轻、走路轻、操作轻**。
  - 避免空间干扰：不随意出入属于顾客的空间；顾客没有服务需求时不随意打扰；必须打扰时先说一声"对不起"。
  - **不为门店自己的利益打扰顾客**：哪怕是为了"提升服务质量"去频繁请顾客填意见表/电话回访，本质也是对顾客自由的随意侵犯——顾客有权要好服务，但没义务帮门店改进。必须沟通时也尽量少打扰。

  **场景做法（贴球房）**
  - 客人爱把巧粉倒扣在台面、容易掉粉沾衣服、还易让母球起静电：趁摆球的间隙帮客人把台帮擦干净、把巧粉放正，顺带提醒"巧粉倒扣容易掉粉到台帮、沾衣服不好洗"；也可摆球时帮客人把母球上的巧粉擦掉。
  - 问客人事情：一定**等他这杆球打完再问**，或者问没在打球的同行客人。
  - 走动时留意**别从客人瞄球的视线里穿过**；如果会挡到，停一下，等客人打完这杆再过去。
  - 客人对打球规则不太懂时，适当帮讲解一下——这些小细节最能体现球房的专业和贴心。

  ### 准则五：不冒犯顾客（护顾客自尊）

  - 交往是否顺畅，很大程度取决于员工**懂不懂保护顾客的自尊心**。工作中绝不能做任何损害客人自尊的事。
  - 顾客对某些项目不熟、显得笨拙时：不以"过来人/优越者"的姿态指点，更不能嘲笑。
  - 顾客行为不符合公共场所要求时：用**温和、略带歉意**的语气制止，不厉声呵斥。
  - 顾客提不合理要求：礼貌拒绝，不因他无理而失礼。
  - 顾客对服务不满：虚心接受，不为自己"据理力争"。
  - 顾客不配合造成工作不便：不责怪、不埋怨。
  - 顾客情绪激动、偏激、故意刁难：保持克制忍耐，耐心解释，**绝不"以牙还牙""针锋相对"**。

  **场景话术**
  - 客人把烟头丢地上：（先捡起来丢垃圾桶）
    → "您好老板，下次打球要是来不及丢烟头，您吩咐我帮您就行，别不好意思——不然烧坏地毯是要赔的，我不想让您为难～"
  - 客人坐到隔壁球台的台帮上悬空看球：
    → "您好老板，坐台帮容易压到胶边，也会影响您下次过来打球的体验，您看坐这边沙发休息看球行吗？"

  ### 准则六：顾客是上帝

  - 顾客是门店的生存之本、发展之源——是衣食父母。只有把最好的服务给顾客，门店和员工才有生存发展的机会。
  - 尊重顾客要"得到最好服务"的权利：尽最大努力提供**最便利、最可靠（始终如一、准确无误）、最优质**的服务，对需求作最及时、最准确的反应。
  - 一旦因失误让顾客利益受损：不仅主动诚恳道歉，还要作出相应**补偿**。"为顾客着想，无论怎样都不过分。"
  - **"顾客总是对的"**：服务工作里不纠结是非对错，只看顾客有没有得到满意的服务。对顾客的批评指责**绝不争辩**，把意见当改善的动力。
  - "谢谢"和"对不起"是服务里的常用词。顾客是上帝**不等于**员工是奴仆——情感是相互的：你给顾客关心、理解、尊重，往往也赢得顾客的关心、理解、尊重（敬人者人恒敬之）。

  ### 6 条准则速记

  | 序号 | 准则 | 一句话 |
  |------|------|--------|
  | 一 | 不拒绝顾客 | 不直接说"不"，先给替代方案 |
  | 二 | 顾客的事是大家的事 | 不说"不归我管"，主动补位 |
  | 三 | 不带来不愉快 | 个人情绪/顾客无礼都不影响态度 |
  | 四 | 不干扰顾客 | 三轻：交谈轻·走路轻·操作轻 |
  | 五 | 不冒犯顾客 | 护自尊，不嘲笑、不呵斥、不针锋相对 |
  | 六 | 顾客是上帝 | 顾客总是对的，不争辩；但不卑不亢 |
