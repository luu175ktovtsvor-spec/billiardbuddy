key: "knowledge.site_selection"
name: "商业球房选址要点"
description: |
  开店选址 20 条硬条件（商业用地、每 40 平一台、层高 4 米以上、柱距 8 米、楼层选 2-4 层、停车广告位用电消防产权等）+ 选址前两步：扒透周边竞品的定价/储值玩法/美团抖音团购爆款找需求空白，用地图人流热力图圈高热区再叠竞品分布定地段。
  老板问"开新店/分店怎么选址、这个场地能不能签、怎么判断人流和竞争",用它。
category: "knowledge"
variables: []
template: |
  ## 商业球房选址 20 个关键要点

  选址是球房经营的第一步，选址错误可能导致整个项目失败。

  ### 场地基础条件
  1. 确定该场地为商业用地
  2. 公摊面积合理，基本上要达到每 40 平米一张球桌
  3. 层高 4 米以上
  4. 场地方正、柱距 8 米以上

  ### 租赁条款
  5. 关注租金水平、免租期、涨幅比例、付款方式、押金
  6. 如有转让费，转让费过大不考虑
  7. 租期建议 5-8 年

  ### 楼层选择
  8. 尽量选二至四层（负一层问题比较多，楼层过高消防难度大）
  9. 商场需签订独家排他协议

  ### 交通与停车
  10. 电梯是否独立且 24 小时运行
  11. 地下停车场是否能提供指引标识
  12. 停车位足够，能否提供私人停车位，免费停车 3 小时以上

  ### 广告与形象
  13. 广告位面积：外招牌最低需要 6-10 个平方
  14. 能否在电梯和停车场设置指引标识

  ### 设施设备
  15. 用电保障：每 100 平米保证 10 千瓦
  16. 落实商业用电价格，确认是否有公摊服务费
  17. 空调自行安装，要求能提供空调主机安装位置
  18. 能否提供原始 CAD 图纸（必须复尺）

  ### 消防与合规
  19. 物业必须通过一次消防，是否能为二消提供帮助
  20. 产权没有纠纷，落实租赁前是否有抵押

  ### 附加注意事项
  - 如楼上是小区，测试是否构成扰民带来投诉（基本不建议）
  - 要求物业提供免费的临时筹备办公室（50 平以上）
  - 很多球房从一开始就是错的，定位看生死
  - 品牌连锁的商业球房会逐渐抢占市场，中小型球房的市场份额会越来越低

  ## 选址前先做两件事：知己知彼 + 热力图找地

  选址不是单看场地条件，开张前要先把"周边有谁、人在哪"摸清楚。

  ### 一、知己知彼：扒透周边竞品（开店前必做）
  把目标商圈方圆几公里内的球房逐家摸一遍，重点扒三类信息：
  - **定价**：各档台型（普台/中端台/高端台/包厢）的小时价、高峰/平峰价差、有没有错峰分时定价——找出价格带空白。
  - **储值/会员玩法**：充值档位、赠送比例、有没有一卡通通吃台费+助教+商品——看自己能不能做得更有诱惑力。
  - **团购爆款**：在美团/抖音上他家卖得最好的是哪几个套餐、定价多少、销量评分多少——直接对标设计自己的引流爆款。
  附带看：他家有没有助教/教练团队、有没有赛事、服务和环境短板在哪——找出可以差异化切入的口子。
  目的：选址不只是选个好位置，是要在这个商圈里找到"别人没占满的需求 + 别人做得差的环节"，落点要打在能赢的地方。

  ### 二、热力图找高热区（用数据印证人流量）
  靠脚去踩点容易看走眼，先用地图工具的"人口热力图/人流热力图"做第一道筛：
  - 看目标商圈在工作日/周末、白天/晚上的人流热力分布，圈出**持续高热的区块**。
  - 把高热区与竞品分布叠看：高热 + 竞品空白/竞品弱 = 优先候选地段。
  - 再回到前面 20 条硬条件（商业用地、层高、柱距、停车、广告位、消防…）逐项验证候选场地。
  原则：热力图定"大方向找哪片"，实地复尺与 20 条硬条件定"具体选哪间"，两步都做，别只凭感觉拍板。
