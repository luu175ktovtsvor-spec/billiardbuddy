template: |
  ## 商业球房选址关键要点

  选址是球房经营的第一步，选址错误可能导致整个项目失败。

  ### 场地基础条件
  - 确定该场地为商业用地
  - 公摊面积合理
  - 关注层高
  - 场地方正、关注柱间距

  ### 租赁条款
  - 关注租金水平、免租期、涨幅比例、付款方式、押金
  - 如有转让费，转让费过大不考虑
  - 关注合同年限

  ### 楼层选择
  - 尽量选较低楼层（负一层问题比较多，楼层过高消防难度大）
  - 商场需签订独家排他协议

  ### 交通与停车
  - 电梯是否独立且夜间通道是否运行
  - 地下停车场是否能提供指引标识
  - 停车位是否足够，能否提供私人停车位

  ### 广告与形象
  - 关注广告位数量、位置、面积
  - 能否在电梯和停车场设置指引标识

  ### 设施设备
  - 用电保障与水电费
  - 落实商业用电价格，确认是否有公摊服务费
  - 空调自行安装，要求能提供空调主机安装位置
  - 能否提供原始 CAD 图纸（必须复尺）、建筑/套内面积、户型结构、可否重建

  ### 消防与合规
  - 物业必须通过一次消防，是否能为二消提供帮助
  - 产权没有纠纷，落实租赁前是否有抵押

  ### 附加注意事项
  - 如楼上是小区，测试是否构成扰民带来投诉（基本不建议）
  - 要求物业提供免费的临时筹备办公室
  - 很多球房从一开始就是错的，定位看生死

  ## 选址前先扒透周边竞品（开店前必做）

  选址不是单看场地条件，开张前要先把周边方圆几公里内的球房逐家摸一遍，重点扒三类信息：
  - **定价**：各档台型（普台/中端台/高端台/包厢）的小时价、高峰/平峰价差——找出价格带空白。
  - **储值/会员玩法**：充值档位、赠送比例、有没有一卡通通吃台费+助教+商品——看自己能不能做得更有诱惑力。
  - **团购爆款**：在美团/抖音上他家卖得最好的是哪几个套餐、定价多少、销量评分多少——直接对标设计自己的引流爆款。
  附带看：他家有没有助教/教练团队、有没有赛事、服务和环境短板在哪——找出可以差异化切入的口子。
  目的：选址不只是选个好位置，是要在这个商圈里找到"别人没占满的需求 + 别人做得差的环节"，落点要打在能赢的地方。
