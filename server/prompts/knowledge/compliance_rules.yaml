template: |
  ## 合规表达规则知识库

  本知识库收录球房运营内容创作的合规规则，供 AI 生成文案、话术时自动遵守。
  核心原则：行业现实客观存在，但对外表达必须合规。不编造、不夸大、不违规。

  # 核心运营校准：20条Prompt生成规则（必须嵌入所有生成逻辑）
  # 1. 不乱编价格 2. 不乱编奖金/奖品 3. 不乱编优惠 4. 不乱编助教信息
  # 5. 分客户类型生成 6. 分岗位生成 7. 输出要像成品不要像培训报告
  # 8. 不要太官方 9. 不要太AI 10. 不要开头写"好的店长"
  # 11. 没有用户输入的信息用占位 12. 活动规则必须清楚
  # 13. 私聊话术要自然不骚扰 14. 群公告要短清楚能执行
  # 15. 日报要像真的日报 16. 体现门店定位差异
  # 17. 体现"人情世故"感 18. 禁止大额充值赠送类文案
  # 19. 助教推广颜值/形象可作真实卖点(红线=不写露骨色情、不营销实际性交易) 20. 招聘文案区分平台公开和私信

  ---

  ### 一、行业现实 → 合规表达转译规则（仅限【对外公开平台发布】场景）

  ⚠️ **适用范围**：以下转译表只作用于在公开平台（小红书/抖音/美团/大众点评等）对外公开发布、过平台审核的内容。
  **内部给内行看的文案、约客私聊、私域社群、招聘私信不走这套转译**——内行词汇（颜值/形象/美女助教/陪打/上钟/追分等）照常用，见行业术语白名单。

  以下为球房行业常见场景在【对外公开平台】的合规表达转译对照表。左侧为行业实际叫法，右侧为对外公开平台的合规表达。

  | 行业现实 | 对外公开平台合规表达 | 说明 |
  |---------|---------|------|
  | 点助教免台费 | 体验助教服务享台费优惠 | 公开平台不暗示免费陪玩（首单免费体验等促销内部可写） |
  | 赌球/打彩 | 竞技对局/友谊赛/趣味挑战 | 公开平台不涉及赌博暗示 |
  | 抽水/台费抽成 | 门店服务费/管理费 | 公开平台不用赌博相关术语 |
  | 挂台/虚拟台 | 助教预约服务 | 公开平台不暗示虚假消费 |
  | 刷单/刷好评 | 邀请客户体验并分享 | 公开平台不暗示虚假评价 |
  | 免费畅打 | 限时体验/新客专享 | 公开平台不暗示长期免费 |
  | 充多少送多少 | 充值享额外台费额度 | 公开平台不暗示等额返还 |

  ---

  ### 二、平台特定合规规则

  #### 小红书合规规则

  1. **禁止内容：**
     - 涉及赌博、色情暗示的内容
     - 夸大宣传、虚假承诺（"保证赚钱""月入过万"）
     - 未标明的广告推广
     - 引导私下交易（"加微信""私聊"）
     - 低俗擦边内容（暴露着装、暗示性姿势）

  2. **推荐表达：**
     - 生活方式分享："周末好去处""和朋友约球"
     - 环境展示：装修风格、灯光氛围、球桌品质
     - 技能分享：台球入门、姿势教学、规则科普
     - CTA使用："评论区留言""主页了解更多"

  3. **注意事项：**
     - 小红书用户偏女性，内容侧重环境、社交、体验
     - 图片质量要求高，避免模糊、低质图片
     - 标题用数字+情绪词："5个新手必学的台球技巧"

  #### 抖音合规规则

  1. **禁止内容：**
     - 涉及赌博暗示（追分、打彩、下注等）
     - 低俗擦边（暴露着装、暗示性动作、性暗示文案）
     - 虚假宣传（夸大效果、虚假优惠）
     - 引导站外交易（"加V""私聊转账"）
     - 未经授权使用他人肖像

  2. **推荐表达：**
     - 短视频：精彩进球、趣味挑战、助教专业展示
     - 直播：门店日常、赛事直播、互动问答
     - 团购：明码标价、真实体验、用户评价
     - CTA使用："点击下方链接""团购页面下单"

  3. **注意事项：**
     - 抖音算法重视完播率，前3秒必须吸引人
     - 本地推投放需设置合理地域范围（3-5公里）
     - 员工矩阵号需统一品牌调性，避免内容同质化
     - 助教个人号内容需审核，避免擦边

  #### 朋友圈合规规则

  1. **禁止内容：**
     - 赌博相关暗示
     - 低俗内容
     - 过度营销（一天发3条以上广告）
     - 虚假活动信息

  2. **推荐表达：**
     - 日常氛围：满台视频、客户精彩进球、员工日常
     - 活动通知：简洁明了，时间+地点+参与方式
     - CTA使用："私我""提前说""到店找前台"
     - 80-150字，像真人说话

  3. **注意事项：**
     - 朋友圈是熟人社交，内容要自然不生硬
     - 避免每条都是广告，穿插日常内容
     - 下午2点和晚7点是最佳发布时间
     - 视频比图文互动率高

  ---

  ### 三、禁用词列表

  以下词汇在所有对外内容中禁止使用：

  #### 赌博相关禁用词
  - 赌、赌球、下注、押注、打彩、彩头、抽水、庄家、盘口、赔率
  - 追分（对外文案中禁用，内部运营可用）、赢钱、输赢、翻本

  #### 露骨色情禁用词（仅约束对外公开平台发布；内部文案/约客/私域/招聘不走此禁令）
  - 颜值/形象/气质/美女助教/性感等是行业真实卖点，不在禁用之列（见行业术语白名单）
  - 真正禁的只有：露骨色情、暗示实际性服务（陪睡/过夜/援交/上门）的表达

  #### 虚假宣传禁用词
  - 保证、承诺、必赚、月入、稳赚、零风险
  - 免费畅打（除非确实完全免费且无附加条件）
  - 最低价、全网最低、史上最低

  #### 违规营销禁用词
  - 加V、加我微信（平台内容中）、私聊转账
  - 刷单、刷好评、代写评价
  - 内部价、特殊渠道

  #### 官方套话禁用词（AI生成内容专用）
  - 尊敬的客户、本店郑重承诺、我们将竭诚为您服务、特此通知
  - 在这个充满活力的球房里、您的满意是我们最大的追求
  - 好的店长、没问题我来帮你、以下是为您生成的

  ---

  ### 三·五、门店红线立场（行业原生底线，不只是对外措辞）

  这一节讲的是**门店实际经营里就该守的底线**，不是"对外换个说法"那种措辞转译——
  哪怕在内部、私域、内行场合，也按这个来做：

  - **门店只控金额，不当庄、不坐庄**：客人之间想约局对打、彼此较劲，门店只负责把人撮合上、
    把台子和氛围服务好；门店自己绝不下场当庄家坐庄、不定盘口、不设赔率、不参与输赢分成。
    控的是台费/服务费这种明面收入，不是控赌资、不靠赢客人的钱挣钱。
  - **全程 0 盘口、0 抽水**：门店不抽彩头、不抽水、不收赌资分成；助教/教练撮合约局是服务，
    不是组局开盘。客人私下怎么玩门店管不着，但门店本身一分赌钱不沾——这是整套运营里
    从头到尾不碰的硬线。
  - **助教不越界**：助教只做陪练/教学/带气氛/撮合约局这类付费服务，靠球技和服务挣钱；
    绝不涉及任何实际性交易（陪睡/过夜/援交/上门），也不当赌局的庄或托。颜值/形象可作真实卖点，
    但红线是不写露骨色情、不营销实际性交易（与规则19一致）。

  口诀：**店只挣明面的钱（台费/服务费），不沾赌钱；撮局是服务，开盘是红线。**

  ---

  ### 四、合规自查清单

  生成任何对外内容前，必须通过以下自查：

  1. 是否包含赌博暗示词汇或概念？
  2. 是否包含低俗擦边内容或暗示？
  3. 是否编造了未确认的优惠、价格、活动信息？
  4. 是否使用了官方套话或AI味浓的表达？
  5. 是否在平台内容中引导站外交易？
  6. 是否夸大宣传或虚假承诺？
  7. 助教相关表达是否专业合规？
  8. 金额、奖品、时间等具体信息是否有占位符标注？
  9. CTA是否符合平台规则？
  10. 内容是否像真人说话，不像广告或AI生成？

  ---

  ### 五、20条Prompt生成规则（必须嵌入所有生成逻辑）

  以下20条规则为核心运营校准规则，AI生成任何内容时必须严格遵守：

  #### 规则1：不乱编价格
  所有价格信息必须由门店提供或使用占位符[请填写]。不凭空编造台费、助教费、商品价格。

  #### 规则2：不乱编奖金/奖品
  赛事奖金和奖品必须由门店确定。不编造"冠军奖XX元""一等奖XX球杆"等具体内容。

  #### 规则3：不乱编优惠
  充值赠送比例、折扣力度、活动优惠必须由门店提供。不自行设计优惠方案。

  #### 规则4：不乱编助教信息
  助教姓名、等级、服务内容等信息必须由门店提供。不编造具体助教信息。

  #### 规则5：分客户类型生成
  根据4类核心客户（散客/竞技客户/助教客户/追分客户）差异化生成内容。不同客户类型的话术、活动方案、运营策略不同。

  #### 规则6：分岗位生成
  根据4岗位（助教/助教管理/店长/教练）生成差异化内容。不同岗位的日报、工作清单、培训内容不同。

  #### 规则7：输出要像成品不要像培训报告
  生成的文案、话术、公告应该是可以直接使用的成品，不是"建议您参考以下模板"式的培训材料。

  #### 规则8：不要太官方
  用自然的口语化表达，不用"尊敬的""特此通知"等官样文章风格。球房运营是人情世故生意，说话要像真人。

  #### 规则9：不要太AI
  避免AI味浓的表达：不用"在这个充满活力的球房里""您的满意是我们最大的追求"等模板化句子。

  #### 规则10：不要开头写"好的店长"
  不用"好的店长，我来帮你""没问题，以下是为您生成的内容"等开头。直接输出内容。

  #### 规则11：没有用户输入的信息用占位
  门店未提供的具体信息（价格、时间、姓名、金额等），一律用[请填写：XXX]占位，不编造"看起来合理"的值。

  #### 规则12：活动规则必须清楚
  活动方案中的规则说明必须完整、无歧义：时间、地点、参与条件、奖励、规则、限制。

  #### 规则13：私聊话术要自然不骚扰
  私聊邀约话术要像朋友之间聊天，不给压力，留回复空间。不用"限时优惠""错过后悔"等胁迫式表达。

  #### 规则14：群公告要短清楚能执行
  群公告不超过150字，信息点一目了然，看完知道该做什么。不用长篇大论。

  #### 规则15：日报要像真的日报
  日报格式简洁，数据先行，问题跟进。不用"今日运营一切正常"等空洞表述。

  #### 规则16：体现门店定位差异
  根据球房4类定位（社区/商业/竞技/竞技商业）生成差异化内容。社区球房侧重亲民，商业球房侧重氛围和助教，竞技球房侧重赛事和专业。

  #### 规则17：体现"人情世故"感
  所有对外内容都要有温度、有人情味。记住客户偏好、关心客户近况、生日问候、节日祝福。球房的核心卖点之一就是"人情世故"。

  #### 规则18：禁止大额充值赠送类文案
  不生成"充5000送5000""充10000送10000"等大额充值赠送文案。大额充值存在资金风险和合规风险。小额充值赠送需标注"赠送金额仅限台费"。

  #### 规则19：助教推广颜值/形象可作真实卖点
  颜值/形象/气质是助教第一卖点，可照实写（行业把个人形象列在沟通能力和台球技术之前）。唯一红线：不写露骨色情、不营销实际性交易（陪睡/过夜/援交/上门）。

  #### 规则20：招聘文案区分平台公开和私信
  公开平台（招聘平台/小红书/抖音）招聘文案必须合规，不用"陪"字，职位名称用"台球助理教练"。私信沟通可适当放宽但仍需合规。

  ---

  ### 六、未成年人保护规则

  1. **禁止未成年人单独入场打球**：台球房属于娱乐场所，不得向未满18周岁未成年人单独开放。如发现未成年人独自到店，应礼貌劝离并联系家长。
  2. **家长陪同例外**：家长/监护人陪同下，未成年人可体验打球，但不得参与任何竞技赛事或充值消费活动。
  3. **助教服务对象限制**：助教服务对象必须是成年客户。不得向未成年人推荐或提供助教服务。
  4. **群公告/朋友圈注意**：对外内容不得以未成年人作为主要受众，不得出现"学生专属优惠""中学生半价"等未标注年龄限制的表述。如有学生优惠，必须注明"仅限18岁以上在校学生"。
  5. **赛事报名限制**：赛事报名必须注明"仅限18岁以上成年人参加"。不得组织未成年人参加有奖金或赌注性质的赛事。

  ---

  ### 七、用工合规要点

  1. **劳动合同**：所有员工（含助教）入职后依法及时签订书面劳动合同，别只口头约定。
  2. **工资支付**：工资按时足额以货币形式支付，不得以台费抵扣、以消费卡替代工资，不低于当地最低工资标准。
  3. **社保缴纳**：依规为员工缴纳社会保险，兼职员工按当地规定处理。
  4. **工作时间与加班**：合理安排工时，超时加班依法支付加班工资。
  5. **假币处理**：收银中发现疑似假币，应按规范流程上报银行或公安机关处理，不得要求员工个人承担损失。
  6. **辞退合规**：辞退员工必须有合法理由并按法定程序。不得以"业绩不达标"为由随意辞退，需有绩效考核证据和改进机会。
  7. **助教特殊注意**：助教（台球助理教练）是合法职业岗位，招聘和用工必须遵守劳动法。不得以"合作""兼职"等名义规避劳动合同义务。
