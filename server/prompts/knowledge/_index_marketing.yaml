template: |
  ## 营销获客 marketing · 域目录页（L1 导航）

  这个域管【把人引进来 + 对外传播】：先看清客户是谁，再提卖点，再多渠道引流，再在平台上做内容和口碑。
  下面是骨架 → 子知识索引 → 典范 → 硬数字/红线单一源。

  ### 骨架（底层逻辑，模型据此延伸）
  - **营销 = 识别 → 创造 → 传播 → 交付**：先认清客户画像，再围绕需求打造氛围与产品，再多渠道传播，最后线下把体验交付到位。不是单纯砸抖音/美团/大额充值赠送。
  - **先分客户再说话**：散客/竞技/助教/追分四类核心客户 + 散客四层细分（娱乐型/仅限朋友型/刚上瘾型/竞技型），不同客户卖点和语气完全不同；加微后按标签精准推送。
  - **引流要排优先级**：第一优先合规公域（抖音矩阵/美团大众点评/小红书/视频号），第二优先合规私域（梯度集赞/老带新/组局裂变/打卡），再叠地推/异业/达人/交友平台。助教引流（颜值形象 + 上钟陪打是一条链）、教练以普通客户身份去同行店结搭子再引回，都是真实打法。
  - **平台是口碑战场**：美团/大众点评做评分与金牌店铺达标、抖音做内容矩阵；好评要多角度、有差异、配图。
  - **内容说人话**：短视频/图文/朋友圈展示氛围与卖点，差评公开回复要体面有格局（帮老板专业回应、不怼客人）。

  ### 子知识索引（要细则，用 look_up_knowledge 查或读全文）
  - knowledge.customer_types — 四类核心客户 + 散客四型细分。
  - knowledge.casual_customer_segments — 初次进店散客按上瘾程度分四层、各层怎么维护转化。
  - knowledge.customer_tagging / knowledge.customer_profile_template — 打标签方法、客户档案字段与生命周期。
  - knowledge.traffic_generation — 引流总手册（线上短视频/直播/交友平台 + 美团大众点评爆款套餐与评分达成）。【红线相关】
  - knowledge.traffic_priority — 引流渠道合规优先级（先做哪个、能不能碰、会不会违规）。【红线相关】
  - knowledge.growth_playbook — 拉新裂变 + 留存锁客套路库（集赞/老带新/转介绍/地推/异业）。【红线相关】
  - knowledge.assistant_promotion / knowledge.assistant_persona_building — 助教推广获客、助教美女人设/形象卖点打造。【红线相关】
  - knowledge.platform_operations — 美团抖音运营实操（评分线/金牌达标/刷评防风控/差评回复/团购品类）。【硬数字】
  - knowledge.review_generation_rules — 好评文案写法规范（多角度/有差异/15字以上/配3图）。【红线相关】

  ### 典范（要动手写真东西时，读这几个最对版；多为 operation 模板，经 find_scenario 取 prompt_key）
  - 助教/教练推广 → operation.assistant_promo、operation.coach_outreach、operation.coaching_promo。
  - 平台与内容 → operation.douyin_matrix_plan、operation.short_video、operation.review_guidance、operation.review_reply、operation.platform_review_plan。
  - 团购 → operation.groupbuy_optimize、operation.groupbuy_to_private。
  - 地推/异业/达人/转介绍/开业地推 → operation.ground_promotion、operation.cross_industry_alliance、operation.influencer_outreach、operation.referral_program、operation.opening_ground_blitz。

  ### 硬数字 · 单一源（钉死，别处只引用不复述）
  - 平台评分线 / 金牌三条件 / 刷评防风控口径 → knowledge.platform_operations；团购品类阈值 → operation.groupbuy_optimize。**查到再用。**

  ### 红线（不复述，一律见 core.safety_redlines）
  - 助教不越界·绝不营销实际性交易、招聘防封、刷评防风控的合规边界、差评不怼客人、未成年保护、对外公开平台禁用词与合规转译——
    写对外内容前必看 `core.safety_redlines`（含"对外公开平台合规底线"附节）。颜值/形象/美女助教/陪打/追分是真实卖点、不是红线，别误杀。
