description: |
  台球房"拉新裂变 + 留存锁客"的可落地套路库。供 AI 生成引流活动、裂变方案、老带新、留存活动文案时参考。
  来源：台球行业真实做法 + 同类到店休闲行业(桌游/密室/健身/餐饮)借鉴。
template: |
  ## 拉新裂变与留存套路库

  > 用法：生成引流 / 裂变 / 老带新 / 留存活动时，从下面挑合适的套路落地，组合使用。
  > 红线：金额、赞数、折扣、时长一律用 [请填写] 让老板自己填，**绝不自己编数字**；充值赠送只送台费、不写会员卡档位；靠真实福利和社交黏性，不打价格战、不搞"充X送等额X""免费畅打"这类无底线让利。

  ### 一、拉新裂变（把一个客户变成一群）

  1. **梯度集赞**：客户把活动海报分享到朋友圈，集 [X] 个赞 → [小奖励，如抵用券]；[Y] 个赞 → [中奖励，如饮品]；[Z] 个赞 → [大奖励，如台费时长]。门槛分档，越分享越值。
  2. **邀请有礼（阶梯）**：邀 1 位新朋友到店 → 双方各得 [奖励]；邀 [N] 位 → [更高奖励]。奖励双方都给，推动老带新。
  3. **连续打卡挑战**：连续 [N] 天发打球照 + 指定话题到朋友圈 → 得 [奖励]；连满 [M] 天 → 进月末抽奖。靠持续曝光带动同城认知。
  4. **限时限桌引流局**：只在 [冷清时段] + 限定 [几张] 台开"[低价] 体验局"，现场引导加微信、进群沉淀种子客户。靠"限时限桌"控成本，不是全天全桌降价。
  5. **拼台 / 搭子局**：发"拼台邀请"，满 [2-4] 人开局；新人首次拼台送 [体验时长]；[3] 人以上组队享 [优惠] + 赠饮。把"一个人来"变成"约着来"。
  6. **异业互赠券**：和周边餐饮 / 影院 / 健身等互发优惠券，互相导流，扩展消费场景。

  ### 二、留存锁客（让来过的一直来）

  7. **低价月卡 / 储值**：[价格] 月卡 = 优惠价 + 定期赛事 + 周边福利，靠"福利 + 社交归属"留人，不靠降价。充值只送台费、不写会员卡档位。
  8. **同城群高频运营**：球友群里日更 [≥3] 条——拼台信息 / 赛事预告 / 福利 / UGC 接龙，群活跃则复购稳；别让群变死群、广告群。
  9. **积分翻倍 + 排行榜**：消费积分加倍、积分换 [礼品 / 台费]，定期发积分排行榜，激发好胜心和到店频次。
  10. **每日幸运抽奖**：每日消费满 [额度] 可抽奖（[免费时长券 / 小礼品]），固定开奖时间，养成到店习惯。
  11. **会员闲时特权**：会员享任意时段 [折扣] + 固定闲时段免费 / 特价台；午市"[消费] 送 [时长]"专吃白天闲台。

  ### 三、配套动作（裂变 / 活动落地必做）

  - 每场活动**当场引导加微信、进同城群**，把流量沉淀进私域，否则做完就流失。
  - 活动设计成"需多次到店才能用完"（如分次抵用券、连续打卡），制造复购钩子。
  - **留客 > 拉新**：投流 / 团购能把人拉来，但靠社群关系、助教服务、赛事氛围、真实福利才留得住；羊毛党打一次就走，别为拉新牺牲正常价格体系。
