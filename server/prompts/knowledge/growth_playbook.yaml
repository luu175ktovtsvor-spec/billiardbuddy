description: |
  台球房"拉新裂变 + 留存锁客"的可落地套路库。供 AI 生成引流活动、裂变方案、老带新、留存活动文案时参考。
  来源：台球行业真实做法 + 同类到店休闲行业(桌游/密室/健身/餐饮)借鉴。
template: |
  ## 拉新裂变与留存套路库

  > 用法：生成引流 / 裂变 / 老带新 / 留存活动时，从下面挑合适的套路落地，组合使用。
  > 红线：金额、赞数、折扣、时长一律用 [请填写] 让老板自己填，**绝不自己编数字**；充值赠送只送台费、不写会员卡档位；靠真实福利和社交黏性，不打价格战、不搞"充X送等额X""免费畅打"这类无底线让利。

  ### 一、拉新裂变（把一个客户变成一群）

  1. **梯度集赞**：客户把活动海报分享到朋友圈，集 [X] 个赞 → [小奖励，如抵用券]；[Y] 个赞 → [中奖励，如饮品]；[Z] 个赞 → [大奖励，如台费时长]。门槛分档，越分享越值。
  2. **邀请有礼（阶梯）**：邀 1 位新朋友到店 → 双方各得 [奖励]；邀 [N] 位 → [更高奖励]。奖励双方都给，推动老带新。
  3. **连续打卡挑战**：连续 [N] 天发打球照 + 指定话题到朋友圈 → 得 [奖励]；连满 [M] 天 → 进月末抽奖。靠持续曝光带动同城认知。
  4. **限时限桌引流局**：只在 [冷清时段] + 限定 [几张] 台开"[低价] 体验局"，现场引导加微信、进群沉淀种子客户。靠"限时限桌"控成本，不是全天全桌降价。
  5. **拼台 / 搭子局**：发"拼台邀请"，满 [2-4] 人开局；新人首次拼台送 [体验时长]；[3] 人以上组队享 [优惠] + 赠饮。把"一个人来"变成"约着来"。
  6. **异业互赠券**：和周边餐饮 / 影院 / 健身等互发优惠券，互相导流，扩展消费场景。

  ### 二、留存锁客（让来过的一直来）

  7. **低价月卡 / 储值**：[价格] 月卡 = 优惠价 + 定期赛事 + 周边福利，靠"福利 + 社交归属"留人，不靠降价。充值只送台费、不写会员卡档位。
  8. **同城群高频运营**：球友群里日更 [≥3] 条——拼台信息 / 赛事预告 / 福利 / UGC 接龙，群活跃则复购稳；别让群变死群、广告群。
  9. **积分翻倍 + 排行榜**：消费积分加倍、积分换 [礼品 / 台费]，定期发积分排行榜，激发好胜心和到店频次。
  10. **每日幸运抽奖**：每日消费满 [额度] 可抽奖（[免费时长券 / 小礼品]），固定开奖时间，养成到店习惯。
  11. **会员闲时特权**：会员享任意时段 [折扣] + 固定闲时段免费 / 特价台；午市"[消费] 送 [时长]"专吃白天闲台。

  ### 三、配套动作（裂变 / 活动落地必做）

  - 每场活动**当场引导加微信、进同城群**，把流量沉淀进私域，否则做完就流失。
  - 活动设计成"需多次到店才能用完"（如分次抵用券、连续打卡），制造复购钩子。
  - **留客 > 拉新**：投流 / 团购能把人拉来，但靠社群关系、助教服务、赛事氛围、真实福利才留得住；羊毛党打一次就走，别为拉新牺牲正常价格体系。

  ### 四、营销活动库（行业真实在用的活动玩法，挑着落地）

  > 用法：老板要"搞个开业活动 / 充值活动 / 留客活动"时，从下面挑成熟玩法直接套；金额、赞数、奖品、台费额度一律 [请填写] 让门店定，**绝不自己编数字**；赠送只送台费 / 饮料 / 小礼品，不写会员卡档位。

  **A. 开业引爆类**
  1. **打满抽奖**：开业期间客户每打满 [N] 小时得一次抽奖机会——一等奖 [台费额度]、二等奖 [定制周边，如保温杯 / 雨伞]、三等奖 [饮品两瓶]。用"打得越久抽得越多"拉满开业当天的台时。
  2. **红包墙**：墙面挂满红包，客人进店抽一次（[X]-[Y] 元台费 / 钥匙扣小礼品），转发朋友圈带定位再抽一次。把"开业人气"直接变成同城曝光。
  3. **集赞免打券**：抖音 / 微信转发门店宣传视频（带定位）——集 [18] 赞送 1 小时竞技台免打券 ×1；集 [38] 赞送 ×3；集 [68] 赞送 ×5。两个平台可叠加、设明确截止日。免打券逼客户到店核销、顺手沉淀进群。

  **B. 充值锁客类**
  4. **充值套圈**：充值客户按充值额给套圈机会（最低门槛 [2] 次，充得越多机会越多，可叠加可递增）。把"枯燥充值"变成有现场感的游戏。
  5. **饮料卡 + 一卡通锁客**：充值门槛上加 [10] 元，送 [50] 瓶饮料（品类门店定 / 客户选同价位的），但**每次到店只能领 [2] 瓶**——一笔小赠送把客户锁住至少 [25] 次到店，门店不亏、复购拉满。
  6. **反向办卡（送台费抵扣）**：客户到店打满 [1] 小时，直接送 [500] 元台费卡，之后每次消费台费抵扣 [20%]。不逼客户主动充值，而是"他手里有卡就想再来用掉"，反向养成复购习惯。

  **C. 竞技氛围 + 群互动类**
  7. **每日群红包尾号福利**：每天群里发红包——手气最佳者到店领 [免打时长 / 福利]；红包尾号是 [⑥] 者到店开台领 [可乐一瓶]；尾号 [⑧] 者领 [果盘一份]。当日带截图领、过期作废，养成"每天看群"的习惯。
  8. **斯诺克单杆风云榜**（需找空白墙面做一面榜，助教现场记分有效）：单杆达分给阶梯奖励——[35] 分 [可乐]、[45] 分 [功能饮料]、[60] 分 [台费卡 100]、[80] 分 [台费卡 500]、[100] 分 [台费卡 1000]、[147] 分 [现金大奖]。把斯诺克高手的好胜心变成持续到店打高分的钩子；具体分档与奖励额度门店定。

  **D. 拓展场景类**
  9. **异业联盟**：与周边外卖小哥 / 美业 / 足浴 / KTV 等的工作人员谈合作，以"优惠券编号返利"方式互相导流——他们带客来扫编号、门店给返利，扩展获客渠道、共享同城客流。

  ### 五、促销先定目标（goal-driven，别无脑打折）

  > 核心一句话：**促销，是"我想让谁、干什么"**。先想清楚目标客群和你要他们做的那个动作，再倒推选手段。没目标的打折＝白送钱、还把价格体系打烂。

  **第一步：先填空，再选手段。** 每次做促销前问自己三句：
  - 我想让**谁**动？（新客 / 老客 / 沉睡客 / 高频客 / 只来不充值的客）
  - 我想让他们**干什么**？（第一次进店 / 加微信进群 / 第一次充值 / 提高到店频次 / 转介绍）
  - 干完之后**怎么把他留住**？（不留下私域和复购钩子的促销，做完就流失）

  **第二步：三类经典手段，各自对应一个目的（按目标选，别乱用）。**

  1. **助教免费体验 → 养"消费习惯"**
     - 目的：让没消费过助教的客户先白嫖一次，体验过"有人陪练 / 陪打更爽"，之后自己愿意花钱点钟。
     - 落地：首单 / 首次到店送 [体验时长] 免费助教陪打（促销钩子，不是长期免费赠品）；体验完当场引导"觉得好下次可以点钟"，把一次性体验转成消费习惯。
     - 红线：是"首单免费体验"的促销钩子，**不能写成长期白送助教**；助教服务只卖陪练 / 陪打 / 教学，**不碰任何线下实际性交易**。

  2. **充值送小礼 / 器材券 → 养"兴趣"**
     - 目的：充值时搭赠球房常用器材券（手套 / 皮头 / 巧粉 / 功能饮料等小件），让客户因为"有这些装备 / 福利"对打球更上心、来得更勤。
     - 落地：充 [门槛] 送 [器材券 / 小礼包]（券分次核销、逼多次到店）；器材类品类门店自定，金额一律 [请填写]。
     - 注意：充值赠送遵循球房规矩——**只送台费 / 器材小件 / 饮料，不写会员卡档位**，赠送小比例、不无底线让利。

  3. **低门槛入会礼包 → 提"沉没成本"、增黏性**
     - 目的：用一笔不高的入会费（如 [入会价]）换一个"塞满东西的礼包"（功能饮料 + 巧粉 + 皮头 + 手套等），客户花了这笔钱、手里攒着这些权益，**沉没成本上来了就舍不得不来**。
     - 落地：[入会价] 入会礼包 = [一卡通台费权益] + [器材小件若干] + [闲时特权]；礼包价值感拉满、但门槛压低，**重点是"已经花了钱"的心理绑定**，不是靠便宜。
     - 红线：入会礼包对应的是台费 / 器材 / 特权，**不写会员卡分档**；金额、礼包内容一律 [请填写]。

  **第三步：每种促销都要带"留人动作"。** 体验 / 充值 / 入会当场必做：加微信、进同城群、告知下次怎么用掉手里的权益——否则促销只换来一次性流量。

  ### 六、品牌传播三部曲（同城心智抢占）

  > 在一座城里，谁先占住客户心智谁赢。传播按这三步走，缺一步都打不透。

  1. **差异化（你和竞对到底差在哪）**
     - 先想清楚一句话能讲明白的"和隔壁球房的区别"：是助教服务更贴心 / 环境更适合搭子局 / 赛事氛围更浓 / 某个业态组合（如台球 + [其它业态]）别人没有。
     - 没有差异就先造一个能立住的点，再去传播——同质化的店没法被记住。

  2. **重复性（重复传播、频繁抢占同城心智）**
     - 同一个差异化卖点，**反复、高频**地在同城渠道露出（朋友圈 / 短视频 / 同城群 / 团购页 / 异业渠道），不是发一次就完。
     - 频次比花样重要：客户要被同一句话"砸"很多次，才会在想打球时第一个想起你。传播是日更动作，不是一次性活动。

  3. **高感知（一句好记的 slogan，一秒钟入脑）**
     - 把差异化压缩成一句**朗朗上口、好记好传**的话，让人听一遍就记住、还能替你转述。
     - 推荐句式：**"找[需求]来[店名]"**——把客户的核心需求和门店名直接绑死。比如"找搭子来[店名]""找贴心助教来[店名]""想抢台费 PK 来[店名]"。需求词替换成你的差异化卖点，[店名] 用门店实际名。
     - 一句 slogan 贯穿所有传播物料（招牌 / 海报 / 视频结尾 / 群签名），全渠道统一口径，强化记忆。
