template: |
  ## 拉新裂变与留存套路库

  > 用法：生成引流 / 裂变 / 老带新 / 留存活动时，从下面的方向落地，组合使用。
  > 红线：金额、折扣、时长一律用 [请填写] 让老板自己填，**绝不自己编数字**；充值赠送只送台费、不写会员卡档位（会员卡已不是锁客手段，全部改一卡通，取消大额充值赠送）；靠真实福利和社交黏性，不打价格战、不搞"充X送等额X""免费畅打"这类无底线让利。

  ### 一、促销先定目标（goal-driven，别无脑打折）

  > 核心一句话：**促销，是"我想让谁、干什么"**。先想清楚目标客群和你要他们做的那个动作，再倒推选手段。没目标的打折＝白送钱、还把价格体系打烂。

  **先填空，再选手段。** 每次做促销前问自己三句：
  - 我想让**谁**动？（新客 / 老客 / 沉睡客 / 高频客 / 只来不充值的客）
  - 我想让他们**干什么**？（第一次进店 / 加微信进群 / 第一次充值 / 提高到店频次 / 转介绍）
  - 干完之后**怎么把他留住**？（不留下私域和复购钩子的促销，做完就流失）

  **三类经典手段，各自对应一个目的（按目标选，别乱用）：**

  1. **助教免费体验 → 养"消费习惯"**
     - 目的：让没消费过助教的客户先体验一次"有人陪练 / 陪打更爽"，之后自己愿意花钱点钟。
     - 落地：首单 / 首次到店送免费助教陪打（促销钩子，不是长期免费赠品）；体验完当场引导"觉得好下次可以点钟"，把一次性体验转成消费习惯。
     - 红线：是"首单免费体验"的促销钩子，**不能写成长期白送助教**；助教服务只卖陪练 / 陪打 / 教学，**不碰任何线下实际性交易**；助教需自爱、守边界。

  2. **充值送小礼 / 器材券 → 养"兴趣"**
     - 目的：充值时搭赠球房常用器材券（手套 / 皮头 / 巧粉等小件），让客户对打球更上心、来得更勤。
     - 注意：充值赠送遵循球房规矩——**只送台费 / 器材小件 / 饮料，不写会员卡档位**，赠送小比例、不无底线让利（取消大额充值赠送）。

  3. **一卡通（替代会员卡）→ 锁客**
     - 会员卡已不能成为锁客手段、过大充值赠送只会让台费上涨更难——全部改为一卡通，靠"福利 + 社交归属"留人，不靠降价。

  ### 二、配套动作（裂变 / 活动落地必做）

  - 每场活动**当场引导加微信、进同城群**，把流量沉淀进私域，否则做完就流失。
  - **留客 > 拉新**：投流 / 团购能把人拉来（美团 / 大众点评 / 抖音本地推 / 达人 / 地推），但靠社群关系、助教服务、赛事氛围、真实福利才留得住；羊毛党打一次就走，别为拉新牺牲正常价格体系。
  - 引流台占比控制在大厅球台的 **1/4 ~ 1/5**，靠"限时限桌 + 引流台占比"控成本，不是全天全桌降价。

  ### 三、营销传播渠道（异业联盟 / 转介绍 / 地推 / 广告位）

  > 拉新渠道围绕这四条铺：**异业联盟、转介绍、地推、广告位**，配合美团 / 大众点评 / 抖音本地推 / 达人矩阵打同城。

  - **异业联盟**：和周边商家互发优惠券、互相导流，扩展获客渠道、共享同城客流。
  - **转介绍**：老客带新客给双方福利，靠社交关系裂变。
  - **地推**：明确目的是引流到店、当场加微信进群，不是发完传单就走。
  - **广告位**：招牌 / 周边广告位露出统一的差异化卖点与 slogan。

  ### 四、品牌传播三部曲（同城心智抢占）

  > 在一座城里，谁先占住客户心智谁赢。传播按这三步走，缺一步都打不透。

  1. **差异化（你和竞对到底差在哪）**
     - 先想清楚一句话能讲明白的"和隔壁球房的区别"：是助教服务更贴心 / 环境更适合搭子局 / 赛事氛围更浓 / 某个业态组合别人没有。
     - 没有差异就先造一个能立住的点，再去传播——同质化的店没法被记住。

  2. **重复性（重复传播、频繁抢占同城心智）**
     - 同一个差异化卖点，反复、高频地在同城渠道露出（朋友圈 / 短视频 / 同城群 / 团购页 / 异业渠道），不是发一次就完。

  3. **高感知（一句好记的 slogan，一秒钟入脑）**
     - 把差异化压缩成一句**朗朗上口、好记好传**的话，让人听一遍就记住、还能替你转述。
     - 推荐句式：**"找[需求]来[店名]"**——把客户的核心需求和门店名直接绑死。比如"找搭子，抢台费，来[店名]""找贴心助教就来[店名]"。
     - 一句 slogan 贯穿所有传播物料（招牌 / 海报 / 视频结尾 / 群签名），全渠道统一口径，强化记忆。
