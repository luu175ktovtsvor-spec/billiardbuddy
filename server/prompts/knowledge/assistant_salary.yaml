  ### 三、提成阶梯机制

  #### 全提条件

  达到 180 小时打球时长以上，或当月全勤+打球时长打满 150 小时以上可全提。

  | 打球时长 | 提成比例 |
  |---------|---------|
  | 180 小时 | 100% |
  | 160 小时 | 90% |
  | 140 小时 | 80% |
  | 120 小时 | 70% |

  每 20 小时为一个提成阶梯。

  #### 打赏提成阶梯

  | 打赏时长 | 打赏提成（元/小时） |
  |---------|-------------------|
  | 60 小时以下 | [请填写] |
  | 80 小时以上 | [请填写] |
  | 100 小时以上 | [请填写] |

  每 20 小时一个提成阶梯。

  ---

  ### 四、保底期规则（可选方案）

  > 口径说明：行业主流为**七天筛选制**——新助教七天内按实际业绩结算、不设保底，七天内完成去留筛选（开业前招聘只有补助、没有保底）。以下"15天试用+2个月保底"是部分成熟门店的留人方案，与七天筛选制**二选一**，生成方案时不可混用两种口径。

  - 新人试用期为 15 天，如试用期内无法通过岗位考核，被劝退按 100 元/天结算
  - 新人 15 天试用期通过，自动归为保底期
  - 保底期 2 个月，新人要达到当月满勤天数才能拿保底
  - 实习没满整月，按天数算工资，每周一天休
  - 保底期后按提成结算

  满勤标准：
  - 31 天月：28 天算满勤
  - 30 天月：27 天算满勤
  - 29 天月：26 天算满勤

