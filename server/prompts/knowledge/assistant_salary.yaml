  ### 十一、两类薪酬机制对比（怎么选）

  > 球房定助教薪酬，本质就两条路：**底薪跳点 + 少量提成**，或**无底薪纯提成**。两条路各有取舍，按门店体量和管理诉求选，不要照抄别人。具体金额、提成比例一律由门店按当地市场定，下文用[请填写]占位。

  #### 机制一：浮动底薪跳点 + 少量提成

  **怎么算**：助教有一份"无责保底"底薪（如[请填写]元），月上钟时长达到最低门槛即可拿到保底；底薪随业绩浮动"跳点"——上钟时长越高，底薪台阶越高（如打满[请填写]小时，底薪从保底跳到[请填写]元），跳点之上再叠加上钟时长的提成。跳点的依据是工作量、服务质量、客户评价等综合因素。

  **优势：**
  - 给助教一份基本生活保障，留得住人
  - 浮动跳点 + 提成双驱动，逼着助教把上钟时长往上做，积极性高
  - 团队稳定、有归属感，便于上考核、上规章

  **不足：**
  - 助教容易只盯着跳点和提成、忽视服务质量和球技提升
  - 跳点/提成比例往往写死，对市场和客户需求变化的适应性差

  **适用**：**大型商业球房**——承载力高、客户基数大，工作量大、助教流动性高，需要用底薪把队伍稳住。

  #### 机制二：无底薪纯提成

  **怎么算**：助教没有任何底薪，收入完全等于自己干出来的——助教费多少就提多少，做多少拿多少（球房只赚台费，助教费全归助教）。看似科学、好算、好管。

  **优势：**
  - 把助教的积极性和创造力压到极限——多劳多得，逼着助教练球技、练销售、做客户维护
  - 球房成本最低、风险最小，适合精打细算

  **致命缺陷（小心）：**
  - **降团队积极性**：做一小时拿一小时，没考核没动力，今天赚够了明天就不想来，出勤全凭心情
  - **降人员稳定性**：随时能走，被批评一句就跳隔壁球房——"在哪干都一样"；**而助教一走很可能把客户带走**（助教客户对球房没粘性，这是行业共识）
  - **没归属感**：全职受一堆规章约束、时间还不自由，感觉还不如做兼职，留人难

  **适用**：**规模较小、严控成本、又对服务质量有严格要求**的小球房/俱乐部。

  #### 选型口诀

  - 体量大、要稳队伍、上得起考核 → 选**底薪跳点 + 提成**。
  - 体量小、抠成本、能接受人员流动 → 选**纯提成**，但要清醒：稳定性差、客户易被助教带走，靠后续客户维护和资料备注（把客户绑在球房而非个人）来对冲。
  - **无论哪种**，都要引导助教重视：客户后续维护 + 资料备注 + 主动邀约 + 自身球技/销售提升——这才是助教把收入做高、把客户留在店里的根。

  ---

  ### 十二、助教个体合作的经济结构（场地费 / 管理费折算进小时报酬）

  > 不少球房与助教是**合作关系**（助教用球房场地、球房提供统一管理与增值服务），其经济结构本质是：球房按比例收"场地费 + 管理费"，再把这两笔折算进按级别定的小时报酬里，一次算清、不再另收。具体比例和金额一律由门店定，下文用占位。

  #### 一、两笔费用

  - **场地租赁费**：球房为助教提供球台/场地，按助教整体收入约 **[请填写，约 20%]** 收取场地费。
  - **管理费**：球房通过客户增值服务、设备维护等统一管理服务辅助助教完成业绩，按助教整体收入约 **[请填写，约 5%]** 收取管理费。

  #### 二、折算进按级别的小时报酬

  为方便计算，把上面两笔费用**直接折算进"每完成一小时开灯陪打的报酬"**——按助教级别定一个明确的小时价（级别越高小时价越高，如初级[请填写]/中级[请填写]/高级[请填写]/星级[请填写]）。**该小时报酬一旦确定，球房不再另行向助教收取场地费和管理费**，避免重复扣、算不清。

  #### 三、陪打时长门槛 + 分档保底

  保底报酬与"月度任务/陪打时长"挂钩，分档发放：

  | 条件 | 保底发放 |
  |------|---------|
  | 完成当月[请填写]小时月度任务，**或**当月开灯陪打时长 ≥ [请填写，如 50] 小时 | **全额保底** |
  | 当月开灯陪打时长 ≤ [请填写，如 50] 小时（含） | **全额保底的 60%** |

  - 合作起步前两个月可设**补足**：助教当月实拿保底不足全额的，球房补足到全额，帮助教度过爬坡期、稳住新人。
  - 全额保底金额按级别和当地市场定（如[请填写]元/月），由门店填。

  > 说明：本节只讲**合作的经济结构与算法逻辑**（场地费/管理费/小时报酬/保底分档），供 AI 生成薪酬方案、合作模式说明时参考；不涉及合同法律条款（违约金/管辖/竞业/保密等）。助教是台球陪练，对外只营销球房商品与一卡通、不索要任何财物、不与客人外出，这些纪律底线不变。
