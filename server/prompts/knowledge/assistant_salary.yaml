  ## 助教薪资体系知识库

  本知识库收录台球助教薪资体系参考，供 AI 生成薪资方案、招聘文案、经营建议时参考。具体数字因城市、品牌、门店规模差异较大，用[请填写]占位的部分需门店根据实际情况填写。

  ---

  ### 一、薪资结构概述

  助教薪资由以下部分组成：
  - 基础课时奖励（保底期）/ 课时提成（全提期）
  - 打赏提成
  - 奖励（业绩排名奖、时长阶梯奖）
  - 福利（房补、带薪培训）

  保底与底薪的区别：
  - 底薪是固定的，不管业绩多少都发
  - 保底是最低标准，多劳多得，无保底后按提成结算工资

