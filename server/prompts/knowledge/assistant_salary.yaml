  ### 三、提成阶梯机制

  #### 全提条件

  达到 180 小时打球时长以上，或当月全勤+打球时长打满 150 小时以上可全提。

  | 打球时长 | 提成比例 |
  |---------|---------|
  | 180 小时 | 100% |
  | 160 小时 | 90% |
  | 140 小时 | 80% |
  | 120 小时 | 70% |

  每 20 小时为一个提成阶梯。

  #### 打赏提成阶梯

  | 打赏时长 | 打赏提成（元/小时） |
