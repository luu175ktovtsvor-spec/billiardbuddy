  ## 助教薪资体系知识库

  本知识库收录台球助教薪资体系参考，供 AI 生成薪资方案、招聘文案、经营建议时参考。具体数字因城市、品牌、门店规模差异较大，用[请填写]占位的部分需门店根据实际情况填写。

  ---

  ### 一、保底与筛选（七天筛选制）

  行业主流做法是**七天筛选制**：
  - 新助教七天内按实际业绩结算、**不设保底**，七天内完成去留筛选。
  - 开业前招聘只有补助、没有保底。
  - 七天筛选出能留下来、不依赖保底的助教后，再按实打计算薪资。

  保底与底薪的区别：
  - 底薪是固定的，不管业绩多少都发。
  - 保底是最低标准，多劳多得，无保底后按提成结算工资。

  ---

  ### 二、月业绩奖励阶梯（参考值，门店自定）

  当月总业绩（陪打时长）达标，给阶梯奖励：

  | 当月总业绩 | 奖励金额 |
  |-----------|---------|
  | 超过 170 小时 | 500 元 |
  | 超过 200 小时 | 1000 元 |
  | 超过 230 小时 | 1500 元 |

  > 说明：以上为参考档位，因城市差异大、门店自定。具体课时费、保底金额、房补等其它薪资项一律由门店按当地市场定，用[请填写]占位。

  ---

  ### 三、纪律底线（红线）

  助教是台球陪练，对外只营销球房商品与一卡通、不索要任何财物、不与客人外出。这些纪律底线不变。
