key: "knowledge.core_operations"
name: "台球房核心运营逻辑"
description: |
  球房运营的总纲底牌：营销四步（识别-创造-传播-交付）、客户运营五步（引流-服务-转化-复购-裂变）、六岗位分工、四类客户差异化策略、客户金字塔分层、加微三部曲+ABCD分类、定价促销铁律（不推大额充值、尾数8改9）、氛围打造、助教/前厅核心逻辑、输出风格（说人话不带AI运营词）、以及一整套助教教练把散客做成铁粉的真实拢客动作清单。
  几乎任何运营内容生成都该先调它对齐基本盘——老板提"怎么搞活动/定价/加微/分客户/养大客户/把客户留住""日报赛事PK方案要写什么字段""文案别太机器"时优先用它。
category: "knowledge"
