key: "knowledge.recharge_strategy"
name: "充值活动策略知识库"
category: "knowledge"
variables: []
description: |
  充值活动和一卡通策略。
  核心原则：不推荐大额充值赠送（会让后期涨价更难），建议小比例赠送。
  一卡通替代传统会员卡。

template: |
  ## 充值活动策略核心规则

  ### 核心原则
  - 不推荐大额充值赠送（充5000送2000会让后期涨价困难）
  - 赠送仅限小额可控的两类：①台费券（仅限台位费抵扣）②器材券（巧粉/皮头/手套等耗材代金券，消化耗材库存又养客户的器材消费兴趣）；都不包含助教费和商品费现金
  - 一卡通替代传统会员卡（充值即消费，简化管理）
  - 充值是锁客手段，不是利润来源

  ### 推荐方案
  - 保守方案（社区/新开业）：充1000送99(9.9%)、充2000送199(9.95%)、充3000送399(13.3%)
  - 中等方案（商业/成熟）：充1000送150(15%)、充3000送500(16.7%)、充5000送1000(20%)
  - 激进方案（不推荐）：充5000送2000(40%)、充10000送5000(50%) — 后期涨价困难

  ### 一卡通实施
  - 充值金额直接到账，无额外折扣
  - 可设阶梯赠送（充1000送99），赠送仅限台位费
  - 不设有效期或设超长有效期
  - 赛事报名费转充值：会员报名费可设计为赛后全额充进本人会员卡（一卡通），把报名现金流沉淀回门店、会员觉得"白打一场"；非会员正常收费（或办卡送等额卡引导），金额一律占位由门店定

  ### 活动文案模板
  - 开业：充1000送99 / 充2000送199 / 充3000送399，赠送仅限台位费，充值即享一卡通
  - 节日：比日常略高，但不要每次都做（避免客户等节日才充）

  ### 红线
  - 赠送比例控制10-20%，不做1:1赠送（充100送100）
  - 不承诺"永久有效"或"不限时"
  - 不把赠送包含助教费和商品费
  - 文案中不编造具体金额，用占位符或提醒用户填写

  ### 促销方案：低门槛入会礼包（抬沉没成本黏客）
  - 这是独立于"现金充值送台费券/器材券"的另一条锁客 lever，玩法不一样：不是让客户充一笔大钱，而是用一个**百元级的低门槛入会价**（[请填写]，门槛压低、几乎人人愿意试）+ 立刻送一批**实物器材小物**（功能饮料、巧粉、皮头、手套等耗材小件，[请填写赠品清单]）。
  - 底层逻辑是"沉没成本"：客户已经花钱买了入会、又领了实物到手，会觉得"东西都拿了、不来打可惜"，从而更愿意常来——抬高的是心理黏性，不是直接利润。
  - 适用场景：新客转化、淡场拉人、扫码进群后第一步钩子；门槛低，比"上来就让人充几千"好成交得多，是把生客变熟客的轻量入口。
  - 落地动作：入会价、赠品清单、领取方式（到店领/进群领）一律由门店定（[请填写]）；赠品集中送门店本就要消化的耗材小件，既清库存又养客户器材消费习惯。
  - 守住红线：赠品是**小额实物耗材小件**，不是大额返现、不是1:1让利、不是变相返钱；入会价是门槛、不是充值额，别把它和"充X送台费"混成一档；不写无底线让利、不承诺永久有效。

core_principles:
  - "不推荐大额充值赠送（充5000送2000这种会让后期涨价更难）"
  - "赠送金额仅限台位费，不包含助教费和商品费"
  - "一卡通替代传统会员卡（简化管理，提升体验）"
  - "充值是锁客手段，不是利润来源"

recharge_tiers:
  conservative:
    name: "保守方案"
    tiers:
      - amount: "1000"
        bonus: "99"
        ratio: "9.9%"
      - amount: "2000"
        bonus: "199"
        ratio: "9.95%"
      - amount: "3000"
        bonus: "399"
        ratio: "13.3%"
    suitable: "社区球房、新开业球房"
  moderate:
    name: "中等方案"
    tiers:
      - amount: "1000"
        bonus: "150"
        ratio: "15%"
      - amount: "3000"
        bonus: "500"
        ratio: "16.7%"
      - amount: "5000"
        bonus: "1000"
        ratio: "20%"
    suitable: "商业球房、成熟球房"
  # 大额赠送（如充5000送2000、充10000送5000，比例40%-50%）违背"取消大额充值赠送"的定价铁律，
  # 一律不推荐、不生成、不在库内保留可套用的档位模板。

membership_card:
  traditional:
    name: "传统会员卡"
    pros: "客户有归属感"
    cons: "管理复杂，客户觉得被绑定"
  prepaid_card:
    name: "一卡通（推荐）"
    description: "充值即消费，无额外折扣，简化管理"
    pros:
      - "管理简单，充值即消费"
      - "客户不觉得被绑定"
      - "可以设置小额赠送增加吸引力"
    cons: "客户感知优惠力度不如传统会员卡"
    implementation:
      - "充值金额直接到账，无额外折扣"
      - "可以设置阶梯赠送（充1000送99）"
      - "赠送限台费券或器材券（巧粉/皮头/手套等耗材代金券）两类小额可控赠品，不送助教费/商品费现金"
      - "不设有效期（或设超长有效期）"

activity_templates:
  opening_recharge:
    name: "开业充值活动"
    description: "开业期间的充值活动，目的是快速回笼资金和锁定客户"
    template: |
      【开业充值活动】{store_name}
      充1000送99
      充2000送199
      充3000送399
      赠送金额仅限台位费使用
      活动时间：开业期间
      充值即享一卡通权益
    notes:
      - "开业期间可以适当提高赠送比例"
      - "活动结束后恢复正常比例"
      - "不要承诺'永久有效'，避免后期无法调整"
  holiday_recharge:
    name: "节日充值活动"
    description: "配合节日的充值活动"
    template: |
      【{holiday}充值活动】{store_name}
      充1000送[请填写]
      充3000送[请填写]
      活动时间：{date_range}
      赠送金额仅限台位费使用
    notes:
      - "节日活动可以比日常略高"
      - "不要每次都做，避免客户等节日才充值"

dos:
  - "赠送比例控制在10-20%"
  - "赠送金额仅限台位费"
  - "活动有时间限制，不要承诺永久"
  - "开业期间可以适当提高比例"
  - "用一卡通替代传统会员卡"

donts:
  - "不推荐充5000送2000这种大比例赠送"
  - "不承诺'永久有效'或'不限时使用'"
  - "不把赠送金额包含助教费和商品费"
  - "不做'充100送100'这种1:1赠送"
  - "不在文案中编造具体金额（用占位符或提醒用户填写）"
