key: "knowledge.recharge_strategy"
name: "充值活动策略知识库"
category: "knowledge"
domain: strategy
freedom: hard_number
tags: [scene:充值, scene:定价, scene:会员]
variables: []
description: |
  充值活动和一卡通策略。
  核心原则：不推荐大额充值赠送（会让后期涨价更难），建议小比例赠送。
  一卡通替代传统会员卡。

template: |
  ## 充值活动策略核心规则

  ### 核心原则
  - 不推荐大额充值赠送（充5000送2000会让后期涨价困难）
  - 赠送仅限小额可控的两类：①台费券（仅限台位费抵扣）②器材券（巧粉/皮头/手套等耗材代金券，消化耗材库存又养客户的器材消费兴趣）；都不包含助教费和商品费现金
  - 一卡通替代传统会员卡（充值即消费，简化管理）
  - 充值是锁客手段，不是利润来源

  ### 推荐方案（一卡通参考档位）
  - 充1000送99 / 充3000送399 / 充5000送799 / 充10000送1999（赠送仅限台位费）
  - 比例控制在小额可控范围，因城市/门店自定，金额一律由门店填写
  - 激进方案（不推荐）：充5000送2000、充10000送5000 这类大比例赠送 — 后期涨价困难

  ### 一卡通实施
  - 充值金额直接到账，无额外折扣
  - 可设阶梯赠送（充1000送99），赠送仅限台位费
  - 不设有效期或设超长有效期

  ### 活动文案模板
  - 开业：充1000送99 / 充2000送199 / 充3000送399，赠送仅限台位费，充值即享一卡通
  - 节日：比日常略高，但不要每次都做（避免客户等节日才充）

  ### 红线
  - 赠送比例控制小额可控，不做1:1赠送（充100送100）
  - 不承诺"永久有效"或"不限时"
  - 不把赠送包含助教费和商品费
  - 文案中不编造具体金额，用占位符或提醒用户填写

core_principles:
  - "不推荐大额充值赠送（充5000送2000这种会让后期涨价更难）"
  - "赠送金额仅限台位费，不包含助教费和商品费"
  - "一卡通替代传统会员卡（简化管理，提升体验）"
  - "充值是锁客手段，不是利润来源"

recharge_tiers:
  conservative:
    name: "保守方案"
    tiers:
      - amount: "1000"
        bonus: "99"
        ratio: "9.9%"
      - amount: "2000"
        bonus: "199"
        ratio: "9.95%"
      - amount: "3000"
        bonus: "399"
        ratio: "13.3%"
    suitable: "社区球房、新开业球房"
  # 大额赠送（如充5000送2000、充10000送5000）违背"取消大额充值赠送"的定价铁律，
  # 一律不推荐、不生成、不在库内保留可套用的档位模板。

membership_card:
  traditional:
    name: "传统会员卡"
    pros: "客户有归属感"
    cons: "管理复杂，客户觉得被绑定"
  prepaid_card:
    name: "一卡通（推荐）"
    description: "充值即消费，无额外折扣，简化管理"
    pros:
      - "管理简单，充值即消费"
      - "客户不觉得被绑定"
      - "可以设置小额赠送增加吸引力"
    cons: "客户感知优惠力度不如传统会员卡"
    implementation:
      - "充值金额直接到账，无额外折扣"
      - "可以设置阶梯赠送（充1000送99）"
      - "赠送限台费券或器材券（巧粉/皮头/手套等耗材代金券）两类小额可控赠品，不送助教费/商品费现金"
      - "不设有效期（或设超长有效期）"

activity_templates:
  opening_recharge:
    name: "开业充值活动"
    description: "开业期间的充值活动，目的是快速回笼资金和锁定客户"
    template: |
      【开业充值活动】{store_name}
      充1000送99
      充2000送199
      充3000送399
      赠送金额仅限台位费使用
      活动时间：开业期间
      充值即享一卡通权益
    notes:
      - "开业期间可以适当提高赠送比例"
      - "活动结束后恢复正常比例"
      - "不要承诺'永久有效'，避免后期无法调整"
  holiday_recharge:
    name: "节日充值活动"
    description: "配合节日的充值活动"
    template: |
      【{holiday}充值活动】{store_name}
      充1000送[请填写]
      充3000送[请填写]
      活动时间：{date_range}
      赠送金额仅限台位费使用
    notes:
      - "节日活动可以比日常略高"
      - "不要每次都做，避免客户等节日才充值"

dos:
  - "赠送比例控制在10-20%"
  - "赠送金额仅限台位费"
  - "活动有时间限制，不要承诺永久"
  - "开业期间可以适当提高比例"
  - "用一卡通替代传统会员卡"

donts:
  - "不推荐充5000送2000这种大比例赠送"
  - "不承诺'永久有效'或'不限时使用'"
  - "不把赠送金额包含助教费和商品费"
  - "不做'充100送100'这种1:1赠送"
  - "不在文案中编造具体金额（用占位符或提醒用户填写）"
