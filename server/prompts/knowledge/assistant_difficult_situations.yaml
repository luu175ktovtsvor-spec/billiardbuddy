description: |
  教练和助教管理在日常工作中经常遇到的刁钻问题及标准应对话术。
  这些场景来自真实门店经验，教练可以直接背下来用。
  核心原则：保护助教、不让客户难堪、找到折中方案。

template: |
  ## 教练刁钻问题应对话术

  ### 助教保护类（核心原则：保护助教、不伤客户面子、把话题拉回打球）
  - 客人对助教动手动脚 → "哥，咱们助教是专业陪练，打球为主。有什么需要跟我说，我来安排。"
  - 客人想泡助教 → "助教有规定不能和客户发展私人关系。打球技术是真的好，多来练球提升技术比什么都强。"
  - 客人想送助教下班 → "谢谢好意，助教有规定下班后统一走，公司有安排。"
  - 助教怕拒绝客人不来 → "你不想去就不去，这是你的权利。我们靠服务留客，不靠这种事。"
  - 助教身体不适要换人 → 可以换，身体第一。跟客人说"身体不舒服，换一个同事陪你打"。
  - 客人叫助教放下当前客人过去 → "先跟大哥说稍等10分钟，这边客人马上打完了。"不能丢下当前客人。

  ### 客户要求类（核心原则：不搞选妃、强调专业性、明确拒绝不当要求）
  - 客人指定已上钟的助教 → "现在有客人在打，我帮您安排同样水平的助教，保证服务不打折。"
  - 客人反复换助教 → "您想找什么样的？技术好的、会聊天的？我帮您精准匹配。"
  - 客人说"叫几个进来挑" → "助教都是专业陪练，您告诉我练什么，我安排最合适的。"
  - 客人问特殊服务 → "我们是正规台球俱乐部，只有专业陪练服务。"明确拒绝，不暧昧。
  - 客人要带助教出去 → "这个真没有。我们助教都是正规工作，只提供陪练服务。"
  - 教练被客人缠住打球 → "哥您打得真好！我先去巡一圈场，回来再跟您打。"夸客户+找借口脱身。

  ### 内部管理类
  - 助教情绪低落 → 关心了解原因，客人问题我处理，私人问题先调整，不行就休息。
  - 加客人微信话术 → "加个微信吧，想打球提前说帮您留台，有活动第一时间通知您。"
  - 推荐助教话术 → "看您打得不错，想不想再提升？专业助教陪练纠正姿势，要不要体验一下？"

assistant_related:
  - situation: "客人在包厢一直对助教动手动脚"
    response: "哥，咱们助教是专业陪练，打球为主。有什么需要可以跟我说，我来安排。"
    principle: "保护助教，不直接指责客户，转移注意力到打球上"

  - situation: "客人想泡助教，要助教做他女朋友"
    response: "哥，助教是来工作的，她们有规定不能和客户发展私人关系。不过打球技术是真的好，多来练练球，技术提升了比什么都强。"
    principle: "明确拒绝但不伤面子，把话题拉回打球"

  - situation: "客人想送助教下班回家"
    response: "哥，谢谢您的好意，助教有规定下班后统一走，公司有安排。您放心，安全没问题的。"
    principle: "用公司规定挡，不给助教个人压力"

  - situation: "助教说客人想带她出去，她不想去但怕客人以后不来"
    response: "你不想去就不去，这是你的权利。客人不来是他的损失，不是你的问题。我们靠服务留客，不靠这种事。"
    principle: "支持助教，明确底线"

  - situation: "助教说大姨妈肚子痛，能不能换人"
    response: "可以换，身体第一。你跟客人说'不好意思，身体不舒服，换一个同事陪你打'，正常客人都能理解。"
    principle: "助教健康优先，换人要自然"

  - situation: "助教说大哥突然来了，叫她马上下掉这桌过去找他"
    response: "你现在这桌还没结束，先跟大哥说'稍等我10分钟，这边客人马上打完了'。不能丢下当前客人。"
    principle: "先服务当前客户，再安排新客户"

  - situation: "助教说客人一直叫她陪去吃宵夜，她不想去但怕客人不来"
    response: "不想去就别去。你可以说'谢谢哥，我下班后有安排了，下次来打球我好好陪你打'。用服务留人，不用陪吃饭留人。"
    principle: "拒绝要温柔但坚定"

customer_related:
  - situation: "客人叫你把15号助教叫过来上桌（15号助教已经在上了）"
    response: "哥，15号现在有客人在打，我帮您安排一个同样水平的助教，保证服务不打折。或者您等一下，她下钟了我第一时间安排。"
    principle: "不能把正在服务的助教换走，提供替代方案"

  - situation: "客人叫你换一个助教，第二个进来又说换一个"
    response: "哥，您想找什么样的？技术好的、会聊天的、还是长得好看的？您跟我说，我帮您精准匹配。"
    principle: "了解真实需求，避免无限换人"

  - situation: "客人说'叫几个小妹进来，我挑一下'"
    response: "哥，我们助教都是专业陪练，每个人技术都不错。您告诉我您想练什么，我帮您安排最合适的。"
    principle: "不搞选妃模式，强调专业性"

  - situation: "客人问有没有特殊服务，钱无所谓的"
    response: "哥，我们是正规台球俱乐部，只有专业陪练服务。助教技术很好，帮您提升球技比什么都值。"
    principle: "明确拒绝，不暧昧"

  - situation: "客人说介绍一个能带出去的助教，搞定了给介绍费"
    response: "哥，这个真没有。我们助教都是正规工作，只提供陪练服务。您要打球我随时安排。"
    principle: "直接拒绝，不留余地"

  - situation: "客人叫教练打两把，打起劲了一局接一局，你如何脱身"
    response: "哥，您打得真好！我先去巡一圈场，回来再跟您打。您先喝口水休息一下。"
    principle: "夸客户+找借口离开，不要被拖住"

  - situation: "客人让教练叫3个女孩子去轰趴别墅玩"
    response: "哥，这个真不行，我们助教只在店内提供服务。您要打球随时来，我给您安排最好的台位。"
    principle: "明确拒绝，不参与任何店外活动"

  - situation: "客人说你们这的女孩子能不能带走"
    response: "哥，我们是正规俱乐部，助教只在店内工作。您要打球我随时安排。"
    principle: "标准回答，不解释太多"

internal_management:
  - situation: "发现助教情绪低落坐在助教区"
    response: "怎么了？有什么事跟我说。如果是客人的问题，我来处理。如果是私人的事，先调整状态，不行就先休息一下。"
    principle: "关心助教，了解原因，必要时给休息"

  - situation: "如何加客人微信"
    response: "哥，加个微信吧，以后想打球提前跟我说，帮您留台。有活动我也第一时间通知您。"
    principle: "给客户一个加微信的合理理由"

  - situation: "如何售卖球杆"
    response: "哥，您这杆用多久了？皮头有点磨损了，影响发力。我们这有[请填写]品牌的杆，性价比很高，要不要看看？"
    principle: "从客户现有问题切入，自然推荐"

  - situation: "如何给客人推助教"
    response: "哥，看您打得不错，想不想再提升一下？我们有专业助教可以陪练，帮您纠正姿势，进步很快。要不要体验一下？"
    principle: "从客户水平切入，强调技术提升"
