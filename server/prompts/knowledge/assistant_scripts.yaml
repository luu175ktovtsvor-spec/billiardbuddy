description: |
  助教前线高频场景的可直接复制话术卡：迎宾、走访、排钟、转介绍、办卡、邀约。
  与 assistant_service_sop（上钟服务流程）、assistant_promotion（线上推广）互补，
  专门补"开口怎么说"的即用短句，不重复上钟中/回访话术。
template: |
  ## 助教高频话术速查（可直接背诵/复制，按真人语气说）

  ### 迎宾（第一次见到到店客户）
  - 招呼 + 自我介绍："欢迎光临！我是 X 号助教 XXX。"顺手帮客户放好衣物/球包。
  - 摸清情况：是不是第一次来、怎么知道我们店的、怎么称呼。
  - 第一次来的客户，优先推荐陪打体验；摆好球再回迎宾岗。

  ### 走访（主动接近单独到店、还没人陪的客户）
  - 开口："哥/姐一个人来的吗？我是 X 号助教，X 等级，要不要切磋两局交个朋友？"
  - 先聊球、不直接推销，观察水平再讲价值。

  ### 排钟（被点到/确定上钟时）
  - "很荣幸认识您，请问怎么称呼？想喝点什么我帮您拿。"
  - 上钟立刻翻牌报备（X 号上 X 号桌）。

  ### 转介绍（服务好、客户明显尽兴后）
  - "今天陪哥打得挺开心。哥要是对我的服务还满意，身边有喜欢打球的朋友，方便的话帮我引荐一下～"
  - 时机：客户夸你/明显尽兴时开口，不强求。

  ### 办卡引导（客户常来、认可后）
  - "哥来得挺勤的，我们店现在有储值优惠和会员福利，长期打下来更划算，具体方案我让前台给您介绍下？"
  - 不夸大、不承诺，把成交交给前台/管理层。

  ### 邀约三原则（约客心法）
  - 永不拒绝、永不答应、永不承诺。
  - 保持感恩的心，先和客户聊上 2 次以上再开口邀约。
  - 邀约切入话题：抢局邀约、点外卖、聊天气、分享好物、问客户偏好、向客户请教问题。

  ### 通用红线
  - 不群发、不骚扰（客户不回，不连环追问，给空间）。
  - 推广话术统一为"专业陪练 / 技术指导 / 情绪价值"，不出现擦边表达。
