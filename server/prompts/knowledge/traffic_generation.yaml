template: |
  ## 球房引流体系

  引流是球房经营的命脉，没有客流就没有一切。引流分为线上和线下两大渠道。

  ### 一、线上引流

  #### 1. 短视频引流
  - 抖音、视频号、快手、小红书同城
  - 内容方向：球房环境展示、助教教学片段、赛事精彩瞬间、客户打球花絮
  - 核心目的：加微信，从公域导流到私域
  - 注意事项：擦边内容不能带球台画面，避免平台审核风险

  #### 2. 直播引流
  - 助教轮流直播，直播手机不能停
  - 直播内容：打球教学、花式表演、与观众互动
  - 保持账号活跃、稳定开播（具体时长由门店把握）

  #### 3. 交友平台引流
  - 各类社交交友平台
  - 以加微信为主，适当高冷但不能让话题死
  - 加微信平均分配主动加和被加

  #### 4. 美团/大众点评
  - 设置爆款商品（最多 5 个）
  - 评分目标：及格 4.6，良好 4.8，优秀 4.9
  - 美团评价要求：3 张图片 + 15 字以上文字
  - 评价前关闭门店 WiFi，使用自己的流量
  - 同一账号每天只能评价一次，下次评价至少隔天
  - 验券后需间隔 20 分钟再评价

  ### 二、线下引流

  #### 1. 地推拓客
  - 核心原则：在门店周边 5 公里内做曝光，把精准客户加微沉淀下来
  - 地推形式：展点、海派、扫楼、插车
  - 落点、时段、分组分工由门店按周边人流情况自行安排

  #### 2. 异业联盟
  - 与周边不同行业商家合作，互相引流
  - 植入展架广告，互相赠送代金券等增值服务
  - 增加球房曝光度，导入精准客户

  #### 3. 地推话术要点
  - 话术要简洁易懂，让路过的人一听就明白

  #### 4. 地推数据管理
  - 每日地推结束后开总结大会
  - 办卡好的员工上台分享技巧
  - 数据汇总：办卡数、金额、加微数、拉群数

  ### 三、美团经营评分达成要点
  1. 聊天监控：不要以文字发送给客户关于做评价的信息
  2. 定位监控：评价前后三天内必须定位到过店
  3. 打字输入速度：不要复制粘贴
  4. 老会员评价周期至少间隔一周以上
  5. 每日评价不超过 10 条

  ### 四、大众点评星级达成
  - 到店打卡后 30 分钟可以评价
  - 3 张图片 + 15 个文字（每日最多 5 条）

  ### 五、本地化铁律：线上曝光的落点都是 5 公里到店
  球房是线下交付的生意——人必须走进店里才产生消费。所以一条压舱底的铁律：所有投流、达人合作、短视频、内容铺设，它们的最终落点都必须是「5 公里以内的人到店」。线上做得再热闹，引来的若是外地粉、泛流量、看个乐子的围观号，到不了店就等于零。

  - **落点判定，先于一切玩法**：每做一条内容、每投一笔钱，先问一句"这能不能让 5 公里内的人多走进来一个"。不能，就别做——别被播放量、点赞数、涨粉数迷惑，那不是球房要的数。同城曝光占比、到店转化、扫码进群留存这些"会来人"的指标，才是判断引流好坏的标尺。
  - **投流定向卡死本地**：付费投流（本地推/同城流量）地域必须圈在门店周边 [请填写] 公里内，宁可覆盖窄、来的人准，也不要泛投全国白烧预算。
  - **达人合作按城市梯度选**：
    - 小城市——做本地网红就够了。城区不大，一个覆盖同城的达人基本就把全城会来的人圈进来了，没必要追更大盘子。
    - 大城市——做区域网红。全城太大、跨城没人会专程来，要找覆盖门店所在商圈、周边片区的区域达人，把"住得近、逛得到、真会来"的人精准圈进来。
    - 选达人先看粉丝地域分布：本地粉占比 [请填写] % 以上才合作，满屏外地粉的大号再火也不投。
  - **内容也要"带着地名走"**：短视频、图文里露出商圈、地标、周边写字楼/小区的名字，让刷到的同城人一眼认出"这是我家附近那家"，把内容变成本地人的到店指引，而不是飘在公域的泛传播。
  - **一句话收口**：球房的流量不是越多越好，是越近越好——把"同城 5 公里内、真会来的人"圈进来，剩下的热闹都和这家店没关系。
