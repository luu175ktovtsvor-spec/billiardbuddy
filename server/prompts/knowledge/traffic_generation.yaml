  ## 球房引流体系

  引流是球房经营的命脉，没有客流就没有一切。引流分为线上和线下两大渠道。

  ### 一、线上引流

  #### 1. 短视频引流
  - 抖音、视频号、快手、小红书同城
  - 内容方向：球房环境展示、助教教学片段、赛事精彩瞬间、客户打球花絮
  - 核心目的：加微信，从公域导流到私域
  - 注意事项：擦边内容不能带球台画面，避免平台审核风险

  #### 2. 直播引流
  - 助教轮流直播，直播手机不能停
  - 直播内容：打球教学、花式表演、与观众互动
  - 每组助教每天直播不少于 2 小时

  #### 3. 交友平台引流
  - 各类社交交友平台
  - 以加微信为主，适当高冷但不能让话题死
  - 加微信平均分配主动加和被加

  #### 4. 美团/大众点评
  - 设置爆款商品（最多 5 个）
  - 评分目标：及格 4.6，良好 4.8，优秀 4.9
  - 美团评价要求：3 张图片 + 15 字以上文字
  - 评价前关闭门店 WiFi，使用自己的流量
  - 同一账号每天只能评价一次，下次评价至少隔天
  - 验券后需间隔 20 分钟再评价

  ### 二、线下引流

  #### 1. 地推拓客
  - 划分区域（东区、中区、西区等），分组每日轮换
  - 两人一小组，一人介绍活动，一人负责办卡加微
  - 地推形式：展点、海派、扫楼、插车
  - 关键时间点：写字楼中午、商业街晚上 6 点后、企事业单位下班时间

  #### 2. 异业联盟
  - 与周边不同行业商家合作，互相引流
  - 植入展架广告，互相赠送代金券等增值服务
  - 增加球房曝光度，导入精准客户

  #### 3. 地推话术要点
  - 话术要简洁易懂，让路过的人一听就明白

  #### 4. 地推数据管理
  - 每日地推结束后开总结大会
  - 办卡好的员工上台分享技巧
  - 数据汇总：办卡数、金额、加微数、拉群数

  ### 三、美团经营评分达成要点
  1. 聊天监控：不要以文字发送给客户关于做评价的信息
  2. 定位监控：评价前后三天内必须定位到过店
  3. 打字输入速度：不要复制粘贴
  4. 老会员评价周期至少间隔一周以上
  5. 每日评价不超过 10 条

  ### 四、大众点评星级达成
  - 到店打卡后 30 分钟可以评价
  - 3 张图片 + 15 个文字（每日最多 5 条）
