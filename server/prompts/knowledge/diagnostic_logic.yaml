description: |
  球房经营诊断的"指标异常 → 根因 → 责任部门 → 具体动作"决策规则。
  用于经营诊断、复盘、数据分析类生成，让诊断落到具体部门的具体动作，
  而不是停在"提升服务、加强营销"这种空话。
template: |
  ## 经营诊断决策树（指标异常 → 根因 → 责任部门 → 改进动作）

  诊断方法：先看数据的走势（环比/同比）和结构（各项占比），再按下列规则定位根因，
  最后必须落到"哪个部门、做什么动作"。禁止停在"提升服务""加强营销"这类空话。

  ### 一、营收结构类

  规则1 ｜ 开台次数达标（如日 150+ 台次）但总台费偏低
  → 根因：到店量足、客户质量差，优质/竞技客户少
  → 责任：教练部 + 助教管理
  → 动作：强化竞技客户留存与大客户维护、提高平均客单价、检查教练的客户转化能力

  规则2 ｜ 助教费上涨但总台费走平
  → 根因：竞技客户的台费没打出来
  → 责任：教练部
  → 动作：加强下午场约客（日均邀约 20 人以上）、维护竞技客户、多组局

  规则3 ｜ 团购占比过高（>70%）且直接开台偏低
  → 根因：教练/前厅的直接获客能力弱，过度依赖低价引流
  → 责任：教练部 + 前厅
  → 动作：启动约客专项、强化朋友圈与社群维护、把团购品类控制在 4-5 个

  规则4 ｜ 商品费低于助教费
  → 根因：推品能力不足
  → 责任：教练部 + 前厅
  → 动作：教练上钟时加推品、前厅小推车（下午 1 小时/次、晚场 40 分钟/次）、设商品销售指标

  规则5 ｜ 充值多但扣卡少、会员消费占比低
  → 根因：会员粘性弱，充值在"空挂"
  → 责任：前厅 + 店长
  → 动作：升级一卡通权益、提高扣卡率、避免大额充值空挂（坚持小比例赠送）

  ### 二、区域/台桌类

  规则6 ｜ 某区域开台率 <30% 或平均时长 <1.5 小时
  → 根因：该区域配置不匹配市场需求，或教练关注度不足
  → 责任：店长 + 该区域教练
  → 动作：重新规划台桌用途、派高效教练驻守、把优质客户邀约引导到该区域；
    持续低效的区域可改为"引流区/引流台"，让客户一进店先感受氛围

  ### 三、客流类

  规则7 ｜ 新客占比高但客单价下降
  → 根因：流量质量下降（团购/低价客为主）
  → 责任：店长 + 教练
  → 动作：优化获客渠道结构、加强到店转化链路（免费体验 → 加微信 → 邀约复购）

  规则8 ｜ 整体冷清、上座率低（尤其工作日/下午场）
  → 根因：氛围没起来
  → 责任：全员
  → 动作：用引流台、助教休息区、管理层接待造氛围；教练下午茶点红包（2 个：14:00 与 19:30 左右）、
    组织小游戏拉人气；助教提升到店可约的存在感

  ### 阈值参考（判断"高/低"的标尺）

  - 翻台率：4 小时/桌/天 及格，6 小时 优秀
  - 团购占比：<20% 健康，>40% 预警，>70% 紧急
  - 助教人均上钟：≥4 小时/天 及格
  - 开台率：>50% 正常，30-50% 预警（需加约客），<30% 紧急（需调配置）
  - 台费收入占比：正常 60-70%；房租占比建议不超过营业额 30%

  ### 诊断输出铁律

  - 每条诊断必须落到"责任部门 + 具体动作"，不能只说"提升服务/加强营销"
  - 用比例和区间，不编造门店没有的具体财务数字
  - 不承诺具体的业绩提升幅度
  - 结合门店定位（社区/商业/竞技/竞技商业）给差异化建议
