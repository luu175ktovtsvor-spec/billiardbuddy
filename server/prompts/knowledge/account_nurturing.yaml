template: |
  ## 微信养号流程知识库

  # 核心运营校准
  # 养号流程必须合规，不涉及任何违规操作
  # 不生成规避微信平台审核的内容
  # 不建议使用外挂、多开等违规工具

  本知识库收录微信养号的完整流程与注意事项，供 AI 生成运营建议、社群搭建指导、引流话术时参考。养号的核心目的是让新注册微信号模拟真实用户行为，避免被微信系统判定为营销号或批量注册号而导致封号。

  ---

  ### 一、手机号码选择

  - 不要选 177XXX、199XXX 等虚拟号段
  - 尽量选 134XXX、139XXX 等传统号段
  - 手机号最好不要选连号
  - 不要在市面上买免实名卡、0 月租卡（大部分这类卡有法律风险，无法长期使用）

  ---

  ### 二、实名认证

  - 如果怕员工离职影响手机使用，可以用企业身份去营业厅办理
  - 不管企业还是个人身份办理手机号，必须实名
  - 每个人在每个运营商处最多只能注册 5 张手机卡
  - 各地政策严格程度不一样

  ---

  ### 三、一机一卡一号原则

  - 一个手机、一张卡、一个微信号
  - 新注册的时间、空间要分开（空间指网络环境、基站）
  - 新注册微信号时，手机通讯录不要为空
  - 一批注册的微信密码不要一样

  ---

  ### 四、新号第一天操作

  #### 1. 添加老号
  - 新注册的微信号，加 3-5 个可控制的微信老号
  - 老号一般指注册时间长的号，现在主要指代私人号
  - 批量注册时不要多个账号加同样的好友
  - 让老号改新号备注昵称，加标签，加电话号码
  - 新号第一天不要加任何不能控制的好友，杜绝被人屏蔽

  #### 2. 定位与流量
  - 打开定位
  - 使用电话卡流量（不用 WiFi）
  - 后台不退出微信 APP

  #### 3. 发朋友圈
  - 发一条朋友圈
  - 手动发，每个新号的图片文字各不相同
  - 注意：多个号同时点赞一批新号的朋友圈，会被打上批量注册标签，容易牵连封号

  ---

  ### 五、微信群活跃

  - 老号邀请新号加入一个群
  - 最好是非广告的活跃群，群里大部分是老号
  - 当天发 3-5 条信息
  - 第二天更新签名：每个新号准备一个正能量签名，至少 20% 的文字不相同
  - 签名不要打广告，不能有公司、银行、账号、代理等关键词

  ---

  ### 六、避免外挂

  - 不要使用各种微信营销软件
  - 一定不要使用多开软件
  - 不要使用虚拟定位、抢红包、群广告等插件软件

  ---

  ### 七、附近与摇一摇

  - 新号不要查看附近的人
  - 不要使用摇一摇

  ---

  ### 八、日常养号动作矩阵

  | 方向 | 每日动作 | 方向 | 每日动作 |
  |------|---------|------|---------|
  | 通讯录 | 手机通讯录每天导入 3-5 个 | 朋友圈 | 朋友圈间隔时间发 1-3 条 |
  | 微信群 | 加到 5 个以上活跃微信群，群内每日活跃 | 朋友圈 | 用老号点赞和评论 |
  | 微信群 | 群里收发红包 | 朋友圈 | 给好友朋友圈点赞和评论 |
  | 微信群 | 每个群发一个表情、一条文字、一条语音正常聊天 | 1 对 1 私聊 | 每天分三个时段和 5 个好友聊天，每个好友来回 5-10 句，文字表情语音图片文章夹杂 |
  | 公众号 | 每日主动搜索关注 2 个 | 1 对 1 私聊 | 聊天中不要涉及钱、银行、支付宝、账号、期货等风险关键词 |
  | 公众号 | 取消关注之前关注的一个 | 1 对 1 私聊 | 和自己老号语音通话，接通 2 秒挂断 |
  | 公众号 | 模拟阅读文章（有停留时长，拉到最下面） | 选做 1-3 个 | 买 1 元理财或充 1 元话费，打开发现-购物随便逛 |
  | 公众号 | 文章下留言评论 | 选做 1-3 个 | 下载新表情包 |
  | 公众号 | 公众号菜单互动 | 选做 1-3 个 | 打开发现-游戏找个游戏下载，定期打开玩两分钟 |
  | 公众号 | 打开腾讯新闻阅读到文末 | 选做 1-3 个 | 给好友加标签、备注、电话号码、名片 |
  | 公众号 | 收藏 1-2 篇热门文章 | | |

  ---

  ### 九、养号每日必做

  - **语音**：每天和稳定老号语音/视频持续半小时以上然后挂断
  - **交易**：买 1 元理财，给自己充话费，打开发现-购物随便逛，滴滴出行打车，超市扫码消费
  - **互动**：手机设备经常带出去，不要长时间在同一区域不动；好友之间必须有聊天来回互动；下载新表情包
  - **朋友圈**：好友之间互动点赞评论转发；多个账号发布内容不要一致，必须有更改
  - **加好友**：新号引流必须养号超过半个月到一个月以上才可开始加个位数的陌生人，慢慢递增每天增加几个；给微信好友加标签、备注、电话号码
  - **沟通**：聊天方式多样化，避免涉及钱、银行、期货、转账、支付宝等敏感关键词

  ---

  ### 十、封号扣分机制

  1. 用户投诉举报（扣分多）
  2. 发色情、政治、股票等敏感词
  3. 头像、签名、照片、密码雷同
  4. 注册新号之后立刻切换账号登录
  5. 海量加人、多开、无限制群发

  ---

  ### 十一、容易牵连封号的情况

  1. 大量微信号做一样的营销行为
  2. 同一台手机批量注册的微信号
  3. 同一个 IP 批量注册的微信号
  4. 同一台手机登录的多个微信号
  5. 多台手机轮流登录一个微信号
  6. 手机号因灰黑原因被封过

  ---

  ### 十二、微信封号常见情况与解封流程

  #### 常见封号类型

  | 类型 | 表现 | 处理方式 |
  |------|------|---------|
  | 临时限制 | 设备连了有问题的 WiFi，没用本机号流量 | 可直接申请解封，需好友辅助 |
  | 短期封号 | 好友投诉，营销发同样消息过于频繁 | 封 3 天→7 天→1 个月（逐级加重） |
  | 永久限制 | 前几次封号后依然有违规操作 | 判定永久封号，可拨打客服 4006700700 申诉 |

  #### 解封后注意事项

  1. 解封成功后第一时间不做任何动作，打开飞行模式持续 3 天（避免再次追封）
  2. 飞行模式 3 天后打开第一天，不做任何操作
  3. 第二天开始慢慢和稳定好友互动（聊天、表情包、语音通话、视频通话）
  4. 第三天持续正常养号操作
  5. 第四天之后开始慢慢恢复发朋友圈，每天 1-2 条，不可多发，不可发营销，全部发生活类
  6. 封号过的微信必须养号最少半个月以上才可继续使用