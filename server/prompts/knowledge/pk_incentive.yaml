key: "knowledge.pk_incentive"
name: "PK激励机制知识库"
category: "knowledge"
variables: []
description: |
  三层PK激励机制：管理层PK、助教PK、助教个人奖励。
  目标：保持团队战斗力，让每个人都有动力干活。
  核心原则：公平分组、透明指标、及时公示、兑现承诺。

template: |
  ## PK激励机制核心规则

  ### 三层PK体系
  1. 管理层PK（月度）：店长/助教管理/教练/主管
     - 指标：营业额达成率40% + 客户满意度30% + 团队稳定性20% + 活动执行10%
     - 奖惩：月度冠军奖励/末位惩罚，连续3个月末位约谈调整
  2. 助教PK（月度）：按5-8人分组，水平均衡
     - 指标：上钟时长40% + 客户评分30% + 加微信数15% + 预约回头客15%
     - 每周公示排名，月末兑现奖励（冠军组/个人冠军/进步最大）
  3. 助教个人阶梯奖励（月度）
     - 170小时 → 奖励A
     - 200小时 → 奖励B（高于A）
     - 230小时 → 奖励C（高于B）
     - 奖励可叠加，次月5日前发放
  4. 助教榜首激励（按全员总时长比例提成，与阶梯奖并行叠加）
     - 机制：日/周/月「陪打时长第一名」各自单独奖励，奖金 = 当月全体助教总陪打时长 × 系数
     - 系数随周期递增（行业常见参考：日榜 0.2 元/小时、周榜 0.3 元/小时、月榜 0.5 元/小时；具体系数门店自定）
     - 设计意图：把「争第一」和「全店一起把总时长做大」绑在一起——头名拿得多，但前提是全店总时长高，逼着大家既抢上钟又互相带（不是零和内卷）
     - 与第 3 条阶梯奖并行：一个助教既可拿个人阶梯奖、又可拿榜首奖

  ### 设计原则
  - 公平：分组均衡，指标透明
  - 及时：每周公示，不月底才公布
  - 兑现：承诺的奖励必须兑现，否则失去信任
  - 激励：奖励有吸引力，惩罚适度
  - 调整：每季度根据实际情况调整PK规则

  ### 输出模板
  管理层PK：月初公布指标和奖惩 → 月末管理群公布排名
  助教PK：月初分组公布规则 → 每周日晚助教群公布排名 → 月末兑现
  个人阶梯：月初公布 → 月末统计 → 次月5日前发放

three_layers:
  management_pk:
    name: "管理层PK"
    participants: "店长、助教管理、教练、主管"
    frequency: "月度"
    metrics:
      - metric: "营业额达成率"
        weight: "40%"
      - metric: "客户满意度（好评数/差评数）"
        weight: "30%"
      - metric: "团队稳定性（离职率）"
        weight: "20%"
      - metric: "活动执行效果"
        weight: "10%"
    rules:
      - "按月度PK，月初公布指标，月末结算"
      - "输的管理层要在管理群里发红包或请赢的吃饭"
      - "连续3个月输的要进行约谈和调整"
    output_template: |
      【管理层PK方案】{month}
      PK指标：
      1. 营业额达成率（权重40%）
      2. 客户满意度（权重30%）
      3. 团队稳定性（权重20%）
      4. 活动执行效果（权重10%）
      奖惩：
      - 月度冠军：[请填写奖励]
      - 月度末位：[请填写惩罚]
      公示：每月底在管理群公布排名

  assistant_pk:
    name: "助教PK"
    participants: "全体助教"
    frequency: "月度"
    grouping: "按人数分组，每组5-8人，水平尽量均衡"
    metrics:
      - metric: "上钟时长"
        weight: "40%"
        description: "当月总上钟小时数"
      - metric: "客户评分"
        weight: "30%"
        description: "客户满意度评分"
      - metric: "加微信数"
        weight: "15%"
        description: "当月新增客户微信数"
      - metric: "预约回头客"
        weight: "15%"
        description: "当月预约回头客数"
    rules:
      - "月初分组，公布PK规则"
      - "每周公示一次排名"
      - "月末结算，兑现奖励"
      - "分组要公平，避免强弱悬殊"
    reward_tiers:
      - tier: "月度冠军组"
        reward: "[请填写，如：全组奖金/聚餐/额外休假]"
      - tier: "月度个人冠军"
        reward: "[请填写，如：个人奖金/助教展示区推荐位]"
      - tier: "月度进步最大"
        reward: "[请填写，如：奖金/培训机会]"
    output_template: |
      【助教PK方案】{month}
      分组：{group_details}
      PK指标：
      1. 上钟时长（40%）
      2. 客户评分（30%）
      3. 加微信数（15%）
      4. 预约回头客（15%）
      奖励：
      - 冠军组：[请填写]
      - 个人冠军：[请填写]
      - 进步最大：[请填写]
      公示：每周日晚在助教群公布排名

  assistant_reward:
    name: "助教个人奖励"
    type: "阶梯式奖励"
    description: "根据助教个人业绩给予阶梯式奖励，鼓励突破目标"
    tiers:
      - tier: "170小时"
        reward: "[请填写奖励金额或福利]"
      - tier: "200小时"
        reward: "[请填写奖励金额或福利，高于170小时档]"
      - tier: "230小时"
        reward: "[请填写奖励金额或福利，高于200小时档]"
    rules:
      - "以月度为周期统计"
      - "达到对应阶梯即可获得奖励"
      - "奖励可以叠加（达到200小时可同时获得170和200的奖励）"
      - "次月月初发放"
    output_template: |
      【助教月度奖励】{month}
      阶梯奖励：
      - 月上钟170小时：[请填写]
      - 月上钟200小时：[请填写]
      - 月上钟230小时：[请填写]
      统计周期：每月1日-月末
      发放时间：次月5日前

design_principles:
  - "公平：分组要均衡，指标要透明"
  - "及时：每周公示，不要月底才公布"
  - "兑现：承诺的奖励必须兑现，否则失去信任"
  - "激励：奖励要有吸引力，惩罚要适度"
  - "调整：根据实际情况每季度调整一次PK规则"

pk_output_checklist:
  description: "AI生成PK方案时必须逐项包含以下内容，缺一不可"
  items:
    - "✅ 分组规则（按什么分、每组几人、如何保证公平）"
    - "✅ 指标和权重（具体考核什么、各占多少比例）"
    - "✅ 阶梯奖励（分几档、每档门槛和奖励）"
    - "✅ 排名公示节奏（每天/每周/每月）"
    - "✅ 兑现时间和方式"
    - "✅ 执行建议（谁负责、怎么启动）"

punishment_system:
  name: "惩处制度"
  description: "有奖有罚，制度才能落地。AI生成PK方案时应包含惩处条款。"
  principles:
    - "惩处目的是纠正行为，不是惩罚人"
    - "阶梯处罚：先警告、再罚款、再停岗、最后辞退"
    - "一票否决项必须明确，触碰即开除"
  common_violations:
    - violation: "迟到/早退"
      penalty: "警告 → 罚款[请填写]元/次 → 累计3次扣全勤奖"
    - violation: "旷工"
      penalty: "扣3倍日工资 → 累计2次辞退"
    - violation: "客户投诉（服务态度）"
      penalty: "第一次警告+道歉 → 第二次罚款[请填写]元 → 第三次停岗培训"
    - violation: "客户投诉（重大事故）"
      penalty: "立即停岗调查，视情节严重程度处理"
    - violation: "私自收费/收红包"
      penalty: "一票否决，立即辞退"
    - violation: "泄露门店商业信息"
      penalty: "一票否决，立即辞退"
  veto_items:
    - "在店内参与赌博"
    - "私自收费/收客户红包转账"
    - "泄露门店商业秘密"
    - "与客户发生肢体冲突"
    - "连续旷工3天以上"
  output_note: "AI生成惩处制度时，金额用[请填写]占位，不编造具体数字"

referral_reward:
  name: "转介绍奖励"
  description: "鼓励老客户带新客户到店消费，降低获客成本"
  types:
    - type: "客户转介绍"
      description: "老客户带新朋友来打球"
      reward_rules:
        - "新客户首次消费后，奖励老客户[请填写]元台费券或等值礼品"
        - "新客户累计消费满[请填写]元，再奖励老客户[请填写]元"
      note: "奖励金额由门店确定，AI用占位符"
    - type: "员工转介绍（招聘）"
      description: "员工推荐新人入职"
      reward_rules:
        - "新人入职满1周：奖励[请填写]元"
        - "新人入职满1个月：再奖励[请填写]元"
        - "新人入职满3个月：再奖励[请填写]元"
      note: "参考行业标准：入职1周200元+半个月300元+满月500元"
  output_note: "AI生成转介绍方案时，金额用[请填写]占位"

management_commission:
  name: "管理提成规则"
  description: "店长/助教管理/教练的管理提成结构"
  roles:
    - role: "店长"
      structure: "底薪 + 门店利润提成 + PK奖金 + 年终分红"
      commission_reference: "门店月利润的[请填写]%"
    - role: "助教管理"
      structure: "底薪 + 助教部管理费提成 + PK奖金"
      commission_reference: "助教部月营收的[请填写]%或按助教人数提成"
    - role: "教练"
      structure: "底薪 + 课时提成 + 赛事组织奖金 + 器材销售提成"
      commission_reference: "课时费的[请填写]% + 器材销售额的[请填写]%"
  principle: "低底薪高提成，多劳多得，与门店业绩挂钩"
  output_note: "AI生成薪资方案时，具体比例用[请填写]占位"
