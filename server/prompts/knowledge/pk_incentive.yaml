key: "knowledge.pk_incentive"
name: "PK激励机制知识库"
category: "knowledge"
variables: []
description: |
  三层PK激励机制：管理层PK、助教PK、助教个人奖励。
  目标：保持团队战斗力，让每个人都有动力干活。
  核心原则：公平分组、透明指标、及时公示、兑现承诺。

template: |
  ## PK激励机制核心规则

  ### 三层PK体系
  1. 管理层PK（月度）：店长/助教管理/教练/主管
     - 指标：营业额达成率40% + 客户满意度30% + 团队稳定性20% + 活动执行10%
     - 奖惩：月度冠军奖励/末位惩罚，连续3个月末位约谈调整
  2. 助教PK（月度）：按5-8人分组，水平均衡
     - 指标：上钟时长40% + 客户评分30% + 加微信数15% + 预约回头客15%
     - 每周公示排名，月末兑现奖励（冠军组/个人冠军/进步最大）
  3. 助教个人阶梯奖励（月度）
     - 170小时 → 奖励A
     - 200小时 → 奖励B（高于A）
     - 230小时 → 奖励C（高于B）
     - 奖励可叠加，次月5日前发放

  ### 设计原则
  - 公平：分组均衡，指标透明
  - 及时：每周公示，不月底才公布
  - 兑现：承诺的奖励必须兑现，否则失去信任
  - 激励：奖励有吸引力，惩罚适度
  - 调整：每季度根据实际情况调整PK规则

  ### 输出模板
  管理层PK：月初公布指标和奖惩 → 月末管理群公布排名
  助教PK：月初分组公布规则 → 每周日晚助教群公布排名 → 月末兑现
  个人阶梯：月初公布 → 月末统计 → 次月5日前发放

three_layers:
  management_pk:
    name: "管理层PK"
    participants: "店长、助教管理、教练、主管"
    frequency: "月度"
    metrics:
      - metric: "营业额达成率"
        weight: "40%"
      - metric: "客户满意度（好评数/差评数）"
        weight: "30%"
      - metric: "团队稳定性（离职率）"
        weight: "20%"
      - metric: "活动执行效果"
        weight: "10%"
    rules:
      - "按月度PK，月初公布指标，月末结算"
      - "输的管理层要在管理群里发红包或请赢的吃饭"
      - "连续3个月输的要进行约谈和调整"
    output_template: |
      【管理层PK方案】{month}
      PK指标：
      1. 营业额达成率（权重40%）
      2. 客户满意度（权重30%）
      3. 团队稳定性（权重20%）
      4. 活动执行效果（权重10%）
      奖惩：
      - 月度冠军：[请填写奖励]
      - 月度末位：[请填写惩罚]
      公示：每月底在管理群公布排名

  assistant_pk:
    name: "助教PK"
    participants: "全体助教"
    frequency: "月度"
    grouping: "按人数分组，每组5-8人，水平尽量均衡"
    metrics:
      - metric: "上钟时长"
        weight: "40%"
        description: "当月总上钟小时数"
      - metric: "客户评分"
        weight: "30%"
        description: "客户满意度评分"
      - metric: "加微信数"
        weight: "15%"
        description: "当月新增客户微信数"
      - metric: "预约回头客"
        weight: "15%"
        description: "当月预约回头客数"
    rules:
      - "月初分组，公布PK规则"
      - "每周公示一次排名"
      - "月末结算，兑现奖励"
      - "分组要公平，避免强弱悬殊"
    reward_tiers:
      - tier: "月度冠军组"
        reward: "[请填写，如：全组奖金/聚餐/额外休假]"
      - tier: "月度个人冠军"
        reward: "[请填写，如：个人奖金/优先排钟权]"
      - tier: "月度进步最大"
        reward: "[请填写，如：奖金/培训机会]"
    output_template: |
      【助教PK方案】{month}
      分组：{group_details}
      PK指标：
      1. 上钟时长（40%）
      2. 客户评分（30%）
      3. 加微信数（15%）
      4. 预约回头客（15%）
      奖励：
      - 冠军组：[请填写]
      - 个人冠军：[请填写]
      - 进步最大：[请填写]
      公示：每周日晚在助教群公布排名

  assistant_reward:
    name: "助教个人奖励"
    type: "阶梯式奖励"
    description: "根据助教个人业绩给予阶梯式奖励，鼓励突破目标"
    tiers:
      - tier: "170小时"
        reward: "[请填写奖励金额或福利]"
      - tier: "200小时"
        reward: "[请填写奖励金额或福利，高于170小时档]"
      - tier: "230小时"
        reward: "[请填写奖励金额或福利，高于200小时档]"
    rules:
      - "以月度为周期统计"
      - "达到对应阶梯即可获得奖励"
      - "奖励可以叠加（达到200小时可同时获得170和200的奖励）"
      - "次月月初发放"
    output_template: |
      【助教月度奖励】{month}
      阶梯奖励：
      - 月上钟170小时：[请填写]
      - 月上钟200小时：[请填写]
      - 月上钟230小时：[请填写]
      统计周期：每月1日-月末
      发放时间：次月5日前

design_principles:
  - "公平：分组要均衡，指标要透明"
  - "及时：每周公示，不要月底才公布"
  - "兑现：承诺的奖励必须兑现，否则失去信任"
  - "激励：奖励要有吸引力，惩罚要适度"
  - "调整：根据实际情况每季度调整一次PK规则"
