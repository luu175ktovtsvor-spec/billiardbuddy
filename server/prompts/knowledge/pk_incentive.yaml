key: "knowledge.pk_incentive"
name: "PK激励机制知识库"
category: "knowledge"
variables: []
description: |
  助教PK激励的两组硬规则：助教个人阶梯奖励、助教榜首激励（按全员总时长比例提成）。
  目标：保持团队战斗力，让每个人都有动力干活。
  核心原则：透明指标、及时公示、兑现承诺。

template: |
  ## PK激励机制核心规则

  ### 助教个人阶梯奖励（月度）
  - 170小时 → 奖励A
  - 200小时 → 奖励B（高于A）
  - 230小时 → 奖励C（高于B）
  - 奖励可叠加，次月5日前发放

  ### 助教榜首激励（按全员总时长比例提成，与阶梯奖并行叠加）
  - 机制：日/周/月「陪打时长第一名」各自单独奖励，奖金 = 当月全体助教总陪打时长 × 系数
  - 系数：日榜 ×0.2、周榜 ×0.3、月榜 ×0.5（系数随周期递增是固定口径设计；金额因城市差异大，具体由门店自定）
  - 设计意图：把「争第一」和「全店一起把总时长做大」绑在一起——头名拿得多，但前提是全店总时长高，逼着大家既抢上钟又互相带（不是零和内卷）
  - 与阶梯奖并行：一个助教既可拿个人阶梯奖、又可拿榜首奖

  ### 设计原则
  - 及时：及时公示，不月底才公布
  - 兑现：承诺的奖励必须兑现，否则失去信任
  - 激励：奖励有吸引力

  ### 输出模板
  个人阶梯：月初公布 → 月末统计 → 次月5日前发放

three_layers:
  assistant_reward:
    name: "助教个人奖励"
    type: "阶梯式奖励"
    description: "根据助教个人业绩给予阶梯式奖励，鼓励突破目标"
    tiers:
      - tier: "170小时"
        reward: "[请填写奖励金额或福利]"
      - tier: "200小时"
        reward: "[请填写奖励金额或福利，高于170小时档]"
      - tier: "230小时"
        reward: "[请填写奖励金额或福利，高于200小时档]"
    rules:
      - "以月度为周期统计"
      - "达到对应阶梯即可获得奖励"
      - "奖励可以叠加（达到200小时可同时获得170和200的奖励）"
      - "次月月初发放"
    output_template: |
      【助教月度奖励】{month}
      阶梯奖励：
      - 月上钟170小时：[请填写]
      - 月上钟200小时：[请填写]
      - 月上钟230小时：[请填写]
      统计周期：每月1日-月末
      发放时间：次月5日前

design_principles:
  - "公平：分组要均衡，指标要透明"
  - "及时：每周公示，不要月底才公布"
  - "兑现：承诺的奖励必须兑现，否则失去信任"
  - "激励：奖励要有吸引力，惩罚要适度"
  - "调整：根据实际情况每季度调整一次PK规则"

pk_output_checklist:
  description: "AI生成助教奖励方案时必须逐项包含以下内容，缺一不可"
  items:
    - "✅ 阶梯奖励（分几档、每档门槛和奖励）"
    - "✅ 排名公示节奏（每天/每周/每月）"
    - "✅ 兑现时间和方式"
    - "✅ 执行建议（谁负责、怎么启动）"

# 安全红线：以下行为一票否决，触碰即开除
veto_items:
  - "在店内参与赌博"
  - "私自收费/收客户红包转账"
  - "泄露门店商业秘密"
  - "与客户发生肢体冲突"
