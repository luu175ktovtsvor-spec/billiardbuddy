template: |
  ## 管理岗位薪资结构（骨架·门店自定）

  ### 一、口径说明

  - 薪资架构管理是球房管理的一项（行业资料在册）。
  - 各管理岗位（店长 / 助教管理 / 教练 / 前厅主管）的**具体薪资构成、提成比例、绩效考核维度由门店自定**，不写死。
  - AI 生成薪资方案 / 招聘文案时，所有金额一律用 [请填写] 占位，因城市和门店差异大，不编造。

  ### 二、在册的硬激励机制（参考值·门店自定）

  这两条是行业真实运营资料在册的奖励机制（硬规则），数值为参考、门店自定：

  - **助教月业绩奖励阶梯**：当月总业绩 >170h 奖 500 / >200h 奖 1000 / >230h 奖 1500。
  - **助教 PK 系数（陪打时长第一名奖励）**：日 ×0.2 / 周 ×0.3 / 月 ×0.5（每月最后一天除外）。

  详见助教等级体系 / PK 激励知识库。
