template: |
  ## 管理岗位薪资结构（骨架·门店自定）

  ### 一、口径说明

  - 薪资架构管理是球房管理的一项（行业资料在册）。
  - 各管理岗位（店长 / 助教管理 / 教练 / 前厅主管）的**具体薪资构成、提成比例、绩效考核维度由门店自定**，不写死。
  - AI 生成薪资方案 / 招聘文案时，所有金额一律用 [请填写] 占位，因城市和门店差异大，不编造。

  ### 二、在册的硬激励机制（数字以单一源为准，本处不另列、避免口径漂移）

  行业资料在册的硬激励机制有两条——**助教月业绩奖励阶梯** 与 **助教 PK 系数**。
  具体数值为参考、门店自定，且**统一以单一可信源为准、本文件不重复写数字**：

  - 助教月业绩奖励阶梯 → 见 `knowledge.assistant_salary`
  - 助教 PK 系数（陪打时长第一名奖励）→ 见 `knowledge.pk_incentive`
