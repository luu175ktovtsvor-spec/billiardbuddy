template: |
  ## 管理岗位薪资结构参考

  ### 一、薪资设计原则

  - 低底薪高提成：多劳多得，与门店业绩挂钩
  - 阶梯激励：业绩越好，提成比例越高
  - 透明公开：薪资结构清晰，员工知道怎么赚钱
  - 及时兑现：PK奖金、提成按时发放

  ### 二、店长薪资结构

  结构：底薪 + 门店利润提成 + PK奖金 + 年终分红

  参考（具体由门店确定）：
  - 底薪：[请填写]元/月
  - 门店利润提成：月利润的[请填写]%
  - PK奖金：[请填写]元/月
  - 年终分红：[请填写]

  绩效考核维度：
  - 营业额达成率
  - 利润率
  - 客户满意度（好评率）
  - 员工留存率

  ### 三、助教管理薪资结构

  结构：底薪 + 助教部管理费提成 + PK奖金

  参考（具体由门店确定）：
  - 底薪：[请填写]元/月
  - 管理费提成：助教部月营收的[请填写]% 或 按助教人数提成[请填写]元/人
  - PK奖金：[请填写]元/月

  绩效考核维度：
  - 助教到岗率
  - 助教上钟率
  - 助教人均时长
  - 招聘完成率

  ### 四、教练薪资结构

  结构：底薪 + 课时提成 + 赛事组织奖金 + 器材销售提成

  参考（具体由门店确定）：
  - 底薪：[请填写]元/月
  - 课时提成：课时费的[请填写]%
  - 赛事组织奖金：每场[请填写]元
  - 器材销售提成：销售额的[请填写]%

  绩效考核维度：
  - 加微信数
  - 组局数
  - 赛事组织次数
  - 竞技客户转化数

  ### 五、前厅主管薪资结构

  结构：底薪 + 绩效奖金 + 商品销售提成

  参考（具体由门店确定）：
  - 底薪：[请填写]元/月
  - 绩效奖金：[请填写]元/月
  - 商品销售提成：销售额的[请填写]%

  绩效考核维度：
  - 团购核销数
  - 好评数
  - 客诉处理满意度
  - 卫生检查达标率
