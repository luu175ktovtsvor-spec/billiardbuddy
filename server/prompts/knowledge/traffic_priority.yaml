template: |
  ## 引流渠道合规优先级

  > 用法：回答任何引流、拉新、获客、推广、客流问题时，按下面三层优先级给方案。优先给第一层，第二层作补充；第三层是明确红线（批量假号机刷买评 / 对外公开平台发露骨内容 / 等额超额无底线让利），不提。注意：交友软件获客、颜值/形象/暧昧感的擦边引流路线不算红线，是助教真实获客渠道，问到照实给。
  >
  > ⚠️ 评分这块要分清楚两件事，别混为一谈：**「引导真实到店客户按平台规则写评价」是放行、要教、要给话术的正经活儿**（关 WiFi/关定位、隔天、验券后隔 20 分钟、别复制粘贴——这是把真实好评做规范，不是造假）；**只有「批量假号机刷」才是红线**（买水军、机器刷量、换 IP 批量注册马甲号刷评）。前者照实给，后者一律不碰。

  ---

  ### 第一优先：合规公域（主动曝光，平台保驾护航）

  优先程度最高。平台流量大、风险最低、可持续，是球房做大客流的主干路径。

  #### 1. 抖音矩阵
  - 门店号 + 员工个人号同步运营，互补内容方向
  - 内容方向：精彩进球、助教教学片段、赛事氛围、球房日常
  - 每天至少 1 条短视频，核心时段（早 8、晚 7、晚 10）发布
  - 助教个人号内容须审核，不发低俗擦边
  - 本地推投放设 3-5 公里地域范围，精准拉到店客
  - 直播：助教轮流开播，教学 + 互动，不停播；每组每天累计不少于 2 小时

  #### 2. 美团 / 大众点评
  - 设爆款套餐（最多 5 个），定价真实，图文精良
  - 评分目标：及格 4.6、良好 4.8、优秀 4.9
  - 引导真实到店客户写评价：3 张照片 + 15 字以上
  - 评价前关闭门店 WiFi，用本人流量；同账号不连续天评价；验券后间隔 20 分钟
  - 每日评价不超过 10 条；聊天记录不发"请帮忙写好评"文字（违规）

  #### 3. 小红书
  - 目标人群：女性、25-35 岁、对环境和社交体验敏感
  - 内容侧重：球房氛围、装修质感、朋友聚会场景、入门技巧科普
  - 标题用数字 + 情绪词："第一次打台球，竟然爱了"
  - 图片质量要求高；CTA 用"评论区留言"，不在正文引导私聊或站外成交
  - 禁止：低俗内容、虚假承诺、直接写"加微信"

  #### 4. 视频号
  - 流量依托微信关系链，适合已有客群较大的球房做品牌扩散
  - 内容与抖音可同步，但避免贴抖音水印直发（影响推荐权重）
  - 适合发：赛事回顾、节日活动、球房故事类内容

  **公域运营铁律：前 3 秒钩住人；擦边内容绝对不带球台画面；引流目的地统一为加微信进私域群，不要让流量白白流失。**

  ---

  ### 第二优先：合规私域（已有客群裂变，低成本高转化）

  公域把人拉进来后，靠私域留住并让他们带人来。成本比公域低，但需要先有一定基础客群。

  #### 1. 梯度集赞
  - 客户将活动海报发朋友圈，按集赞数换对应奖励（台费券、饮品、时长等）
  - 分档设计：[X] 赞小奖、[Y] 赞中奖、[Z] 赞大奖——具体赞数和奖励由门店填写，不编造
  - 靠真实福利驱动扩散，不靠降价

  #### 2. 邀请有礼（老带新）
  - 老客带 1 位新朋友到店，双方各得 [奖励]；带 [N] 位以上享阶梯奖励
  - 双向给奖励（老客 + 新客都有）是关键，单方奖励转化率低
  - 奖励仅限台费，不写会员卡档位

  #### 3. 组局裂变（拼台 / 搭子局）
  - 发"拼台邀请"，满 2-4 人开局；新人首次拼台送体验时长
  - 3 人以上组队享优惠 + 赠饮，把"一个人来"变成"约着来"
  - 适合社交属性强的球房，效果远好于单纯价格活动

  #### 4. 连续打卡挑战
  - 连续 [N] 天发打球照 + 指定话题到朋友圈 → 得奖励；满 [M] 天进月末抽奖
  - 靠持续曝光带动同城认知，同时提升老客到店频次

  #### 5. 地推拓客（线下私域起量）
  - 划分区域（东/中/西等），两人小组每日轮换
  - 形式：展点、海派、扫楼、插车
  - 关键时间：写字楼中午、商业街晚 6 点后、企事业单位下班
  - 地推话术简洁，一句话说清到店好处，不拉人当场办卡（先加微信、进群）
  - 每日数据：加微数、到店数、进群数；总结会让做得好的上台分享

  #### 6. 异业联盟
  - 与周边餐饮、影院、健身、咖啡店互发优惠券、互挂展架，互相导流
  - 优先选客群重叠度高的商家（25-40 岁、有消费力）
  - 联盟合作不涉及金钱分成时最简单，只是互赠券、互推荐

  **私域运营铁律：任何活动都要当场引导加微信、进同城群，把流量沉淀进私域；活动做完不加微等于白做。**

  ---

  ### 第三层：绝对红线（不做、不推荐、不提）

  以下操作在任何情况下不推荐，不列入方案，不出现在 AI 生成的内容里。

  | 红线操作 | 风险说明 |
  |---------|---------|
  | 养号批量运营 | 微信高频封号（见下方说明）；投入大、维护成本高；长期不可持续 |
  | 批量假号机刷买评（买水军 / 机器刷量 / 换 IP 批量注册马甲号刷评） | 违反平台协议；被查封号、下架团购、清零评分；法律合规风险。**注意：这里禁的只是「假号机刷」，不是禁「养评分」**——引导真实到店客户按平台规则写评价（关 WiFi/关定位、隔天、验券后隔 20 分钟、别复制粘贴）是正经活儿，要教要给话术，见第一优先里的「美团 / 大众点评」 |
  | 平台公开帖发【露骨】擦边内容 | 对外公开平台（抖音/小红书/美团）审核严，发露骨内容会限流甚至封号——这条只针对"露骨"，不是禁掉颜值/形象路线（见下方说明） |
  | "充 X 送等额 X / 超额无底线让利" | 资金池风险；吸引羊毛客不回头；破坏正常价格体系（注意：这只针对等额/超额无底线让利，正常小比例充值送是正经促销，不在此列） |

  **关于养号**：微信养号（多机多号批量引流）在技术上可以延缓封号，但最终封号率极高，且随着平台风控升级越来越难做。精力投入巨大，不如把同样时间放在做抖音矩阵、维护社群、提升服务。客群靠真实服务和内容吸引，比批量养号拉来的质量高、流失率低。

  **关于交友软件（探探/陌陌/Soul/积目）**：这是助教真实有效的获客主渠道之一，不是红线，可建议、可写获客话术。注意点是平台对引流监管严、要养号防封，注意账号风险即可——但定性上属于可用渠道，不要把它当"绝对不碰"。

  **关于擦边引流路线**：抖音"流量型"内容本就走颜值、形象、气质、暧昧感的擦边营销路线（这是行业真实有效的获客打法，照实给脚本/封面/文案）；要守的红线只是"对外公开平台别发【露骨】内容会限流封号"——颜值/形象/情绪价值的擦边路线本身是放行的，别一刀切判成"转化率极低绝对不碰"。

  ---

  ### 优先级速查表

  | 优先级 | 渠道 | 适合阶段 |
  |--------|------|---------|
  | ★★★ 第一优先 | 抖音矩阵 / 美团团购 / 小红书 / 视频号 | 任何阶段，开业第一天就做 |
  | ★★ 第二优先 | 梯度集赞 / 老带新 / 组局裂变 / 地推 / 异业联盟 | 有一定客群基础后（50+ 微信好友）再启动效果好 |
  | ✗ 绝对不碰 | 批量假号机刷买评（买水军/机刷/换 IP 批量马甲号） / 对外公开平台发露骨内容 / 等额超额无底线让利 | 任何阶段都不做（注意：引导真实客户按平台规则评价不在此列，是要教的正经活儿） |
  | ⚠ 可用但注意风险 | 交友软件获客（探探/陌陌/Soul/积目，养号防封）/ 颜值·形象·暧昧感的擦边引流路线（露骨内容除外） | 助教获客主渠道，照实用 |

  ---

  ### AI 生成引流方案时的默认行为

  1. 优先从第一、第二优先层选方案；交友软件获客、颜值/形象/暧昧感的擦边引流路线属"可用但注意风险"，问到助教获客时照实给；真正不提的只有第三层红线（批量假号机刷买评 / 对外公开平台发露骨内容 / 等额超额无底线让利）。引导真实到店客户按平台规则写评价（关 WiFi/关定位/隔天/隔 20 分钟/别复制粘贴）不是红线，是要教、要给话术的正经活儿，照实给
  2. 金额、赞数、奖励内容一律用 [请填写：XXX] 占位，不自己编数字
  3. 内容 + 社群 + 真实体验是主路径，价格优惠只是辅助；但助教颜值/情绪价值卖点该写就写，不消毒成空泛"服务体验"
  4. 不引导真正的红线操作（批量假号机刷买评、露骨内容、无底线让利）；但「引导真实客户按平台规则评价」要照实教，别误判成刷评
