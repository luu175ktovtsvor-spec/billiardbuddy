template: |
  ## 助教招聘合规规则知识库

  # 核心运营校准
  # 招聘文案区分平台公开和私信
  # 公开平台（招聘平台/小红书/抖音）必须合规
  # 私信沟通可适当放宽但仍需合规
  # 禁止生成规避平台审核的内容

  本知识库收录台球助教招聘的合规底线，供 AI 生成招聘文案、职位描述时参考，避免触发平台审核机制导致封号。

  ---

  ### 一、招聘平台封号注意事项（两条）

  - **禁止在其他岗位聊助教**（招聘平台、微信）：在非助教岗位的对话里聊助教内容，平台风控会判违规。
  - **禁止在助教岗位和第三方谈业务**：在助教岗位对话里跟第三方谈业务，同样触发风控。

  踩了这两条就封号，前面攒的资源全废。

  ---

  ### 二、招聘内容红线方向（保护助教与门店）

  - 不发越界、涉黄擦边的招聘内容；线上公开平台一律合规、专业。
  - 不写"靠打赏/红包"式的陪玩收入模式——助教是台球陪打的增值服务，不是性服务。
  - 不索要与工作无关的私密信息（身材、酒量、私密生活照等）。
  - 招聘排序：个人形象 > 沟通能力 > 台球技术（招聘标准）。
