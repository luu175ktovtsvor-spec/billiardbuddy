  ## 助教招聘合规规则知识库

  # 核心运营校准
  # 规则20：招聘文案区分平台公开和私信
  # 公开平台（招聘平台/小红书/抖音）必须合规，不用"陪"字
  # 私信沟通可适当放宽但仍需合规
  # 禁止生成规避平台审核的内容

  本知识库收录台球助教招聘的各平台合规规则，供 AI 生成招聘文案、职位描述时参考，避免触发平台审核机制导致封号。

  ---

  ### 一、核心红线：禁止"陪"字及关联词

  在 BOSS 直聘等平台，工作内容涉及"陪"字（及变体），系统自动判定为涉黄高风险。

  #### 绝对禁止的表述

  - "陪同打球"、"陪练"、"陪伴客户"
  - 系统看到"陪"字会直接关联到"陪玩、陪聊"
  - 变体词也不行："助教+性格开朗+会聊天+能和客户打成一片"→系统认为这是"陪聊"的委婉说法

  #### 薪资结构描述禁区

  - 不要写"底薪+提成，提成高，主要靠客户打赏/红包"
  - 会被视为变相的"陪玩"收入模式

  ---

  ### 二、严禁索要与工作无关的个人信息

  - 永远不要在聊天里问"身材怎么样"、"发张生活照"、"身高体重多少"
  - 一旦提问，AI 会认为你在挑选符合"陪"的候选人
  - 禁提情商、酒量："酒量好不好"、"会不会来事"→等于默认工作内容是陪酒

  ---

  ### 三、职位名称合规对照表

  | 错误名称（易触发审核） | 正确名称（相对安全） |
  |----------------------|---------------------|
  | 台球助教 | 台球助理教练 |
  | 台球陪练 | 台球指导员 |
  | 桌球妹子 | 台球课程顾问 |
  | 球员助理 | 台球厅服务生 |

  注："台球厅服务生"会降低薪资上限，但比较安全。

  ---

  ### 四、岗位描述合规对照

  #### 错误描述（直接踩红线）

  - "负责陪客户打球，活跃气氛。"
  - "要求形象好，能聊天，会喝酒优先。"
  - "不需要打球技术好，主要是陪得开心。"

  #### 正确描述（合规写法）

  - "负责为会员提供台球基础动作指导和规则讲解。"
  - "组织店内小型台球友谊赛，记录比分。"
  - "维护球房秩序，协助顾客挑选球杆。"

  ---

  ### 五、各平台规则要点

  #### BOSS 直聘

  - 台球助教账号是平台严查重点
  - 封号通常不是误伤，而是触发了"虚假高薪"和"涉黄擦边"的专项治理规则
  - 禁止在其他岗位聊助教（BOSS、微信）
  - 禁止在助教岗位和第三方谈业务
  - 账号被锁定后需彻底整改才能解封

  #### 小红书

  - 招聘内容需避免擦边图片和暗示性文案
  - 职位描述用专业术语，避免口语化
  - 评论区不回复薪资细节

  #### 抖音

  - 招聘视频避免低俗暗示画面
  - 职位描述与 BOSS 规则类似，避免"陪"字
  - 直播招聘时不要讨论薪资结构细节

  #### 朋友圈

  - 招聘文案避免"高薪+无门槛+轻松"组合
  - 不发助教工作场景的暗示性照片
  - 用专业岗位名称

  ---

  ### 六、资质与薪资合规底线

  - 营业执照范围必须包含"体育指导"、"体育培训"、"健身休闲活动"
  - 如果只有"餐饮服务"或"台球器材销售"，招教练属于超范围经营
  - 被举报后锁定账号基本无法申诉
  - 薪资合理：写"月薪 2 万-5 万"→系统认为只有"陪"才能达到，直接拦截或封禁

  ---

  ### 七、禁用词列表

  以下词汇在招聘文案中禁止使用：

  - 陪、陪练、陪打、陪同、陪伴
  - 陪玩、陪聊、陪酒
  - 打赏、红包（作为薪资描述）
  - 形象好、身材好、长相佳（作为硬性要求）
  - 能喝酒、酒量好、会来事
  - 性格开朗+会聊天（组合使用）
  - 月薪 2 万以上（助教岗位）

  ---

  ### 八、合规招聘模板参考

  #### 职位名称

  - 首选：台球助理教练 / 球房会员助理
  - 备选：台球店员 / 实习教练 / 球房会员顾问
  - 格式建议："城市+岗位+经验要求"

  #### 岗位职责（3-5 条）

  - 与顾客切磋球技，提供专业执裁
  - 进行台球基础技术指导（握杆、站位、瞄准、杆法）
  - 负责迎宾接待、场地安排、客情维护
  - 参与俱乐部活动组织与赛事执行
  - 保持球房整洁，维护器材设备

  #### 任职要求

  - 服务业优先，无基础可带薪培训（硬性条件：形象端正）
  - 沟通能力强，具备服务意识（软性素质）
  - 愿意长期从事台球行业
  - 有台球经验者优先（加分项）

  #### 薪资范围

  - 建议设置为市场中位值上浮 15%
  - 职位描述首行注明"底薪+绩效+带薪培训+提供住宿"

  #### 职位标签

  - 勾选福利标签：五险一金、包住、带薪培训、弹性工作、员工聚餐
  - 增加吸引力标签：高提成、晋升快、0 基础可学

  ---

  ### 九、账号被锁定后的处理建议

  1. 先自查：把所有职位描述都删掉，换成合规版本
  2. 申诉时态度诚恳：表示"已学习平台规范，之前用词不当，现已将所有'陪'字相关描述删除，并修改为'台球教学指导'，承诺严格遵守平台规则"
  3. 准备实体材料：营业执照、法人身份证、门头照片、店内环境视频，证明是正规经营的台球厅
