template: |
  ## 台球行业数据知识库

  # 核心卖点：氛围 + 人情世故
  # 4类客户：散客 | 竞技客户 | 助教客户 | 追分客户（核心需求=赢钱/输赢刺激，门店只控金额、不当庄、不抽水、不定盘口）

  本知识库收录台球行业宏观数据与消费者画像，供 AI 生成经营建议、市场分析、定位策略时参考。

  ---

  ### 一、行业规模与客群

  - 客群规模：约 2.1 亿
  - 市场规模：约 6000 亿
  - 爱好者年复合增长率：约 180%
  - 市场规模巨大、行业覆盖人群范围广、复合增长率高

  行业发展脉络：街头游戏 → 竞技（自发）→ 商业化发展 → 竞技（专业服务）

  ---

  ### 二、消费者画像与行为特征

  #### 1. 年龄分布

  - 18-35 岁为主力消费群体，占比约 70%
  - 18-25 岁：偏好时尚娱乐
  - 26-35 岁：注重社交与放松

  #### 2. 性别比例

  - 男性占比约 90%，女性增长至约 10%
  - 女性消费者更关注环境与服务
  - 男性偏好竞技性以及异性情绪价值（助教提供的异性陪打/情绪价值是真实需求）

  ---

  ### 三、行业发展方向

  #### 1. 数字化 + 智能化

  - 智能预约系统、动态定价算法，实现客户标签化管理、优化资源调配
  - 物联网球杆记录击球数据（力度、角度等），结合 AI 摄像头生成球桌热力图、精彩瞬间，与客户交互

  #### 2. 业态多元化

  - 跨界合作与 IP 联名：与知名品牌推出联名球杆、赛事周边，吸引年轻消费者
  - 健康与休闲结合：健康饮品、无烟区、穿戴设备监测心率、减压服务

  #### 3. 新客群 + 差异化

  - 女性与青少年市场：轻量化器材、女性专属赛事，青少年培训体系
  - 白领减压场景：都市白领把台球房作为社交和放松场所，俱乐部通过环境升级（高端 VIP 服务）满足高净值人群
  - 专注竞技体验：专为竞技客户打造、营造极致竞技氛围的球房

  ---

  ### 四、球房定位与赛道

  #### 球房类型

  - 社区球房：亲民路线，服务周边居民，价格中低端
  - 商业球房：社交+娱乐，注重环境与服务，中高端定位
  - 竞技球房：专业赛事导向，吸引竞技客户
  - 竞技商业球房：竞技+商业融合，兼顾专业与社交

  #### 定位核心

  - 定位是针对竞争对手，在客户头脑里建立的优势位置
  - 给客户一个选择我们的理由
  - 定位清晰后才能制定定价、人员配置、营销策略

  ---

  ### 五、球房两大卖点

  #### 1. 氛围

  - 听觉：音乐
  - 触觉：温度
  - 视觉：人气
  - 嗅觉：香氛
  - 决定商业俱乐部氛围的最主要因素：助教数量
  - 决定竞技俱乐部氛围的最主要因素：竞技客户基数
  - 快速打造氛围的方法：引流台 / 助教休息区 / 管理层接待；音乐 / 开台次序 / 活动

  #### 2. 人情世故

  - 店长与大客户
  - 教练与竞技客户及散客
  - 助教及助教管理与助教客户

  ---

  ### 六、四大类客户特征

  | 客户类型 | 特点 | 核心需求 | 转化路径 |
  |---------|---------|---------|---------|
  | 散客 | 消费弱、频次低、年龄小 | 线下社交 | 散客→朋友→会员 |
  | 竞技客户 | 频次高、时长高、价格不敏感、消费力强、对体验敏感 | 技术交流 | 竞技→圈子→赛事 |
  | 助教客户 | 器材要求高、难伺候 | 异性情绪价值 | 体验→习惯→充值 |
  | 追分客户 | 打球带彩头冲着赢钱来、好胜爱约局、黏性强，有经济纠纷与钓鱼风险 | 赢钱/输赢刺激 | 撮合对手约局→造氛围→社群（门店只控金额、不当庄、不抽水、不定盘口、防钓鱼） |

  常见误区（要避免）：
  - 以貌取人，看到 9.9 的客户就反感、不关心、不维护
  - 仅限于和教练的关系维护，没有打造出竞技氛围圈子
  - 在大客户身上投入精力过大
  - 要防止钓鱼客户、防止教练员同流合污
