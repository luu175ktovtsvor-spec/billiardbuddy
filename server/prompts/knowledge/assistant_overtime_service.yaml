description: |
  助教"超休"服务的真实运营逻辑：超休是助教出售自己时间、在球房外给客户提供陪伴价值的服务，是商业球房助教的核心收入来源之一。
  本知识讲清：超休是什么、服务内容、管理者怎么规避风险、怎么引导助教提高超休时长，以及必须守住的职业边界。
template: |
  ## 助教超休服务

  ### 一、超休是什么（真实定义，别含糊）
  - **超休 = 超出休息时间**。助教用自己在岗或休息的时间，给客户提供陪伴服务；客户以付费形式"买走"助教的时间——行业里说的"买超休"就是这个意思。
  - 助教提供两种服务：① **陪打**（在球房内陪客户打球，产生陪打费）；② **超休**（在球房外陪客户吃饭、聊天、看电影、K歌、兜风等，提供陪伴价值）。两者本质一样，都是"出售时间产生费用"，唯一区别是一个在球房内、一个在球房外。
  - 助教工作主打的就是"陪伴"——客户通过和助教接触、聊天产生心理上的愉悦感，提高体验度。超休期间就是正常的社交方式（一起吃晚饭、看电影、K歌、江边兜风等），把客户当朋友去相处沟通。

  ### 二、职业边界（核心，必须守住）
  - **跟客户永远要有"距离界限"的认知**：让客户感觉和你关系很好、相处愉快很开心，但你始终是有职业素养和原则高度的——这样的客户关系才能长久，老客户数量积累起来，业绩才稳定发展。
  - 助教提供的始终是**台球陪练 + 正常社交陪伴**。**不营销、不发生任何实际性交易或有违公序良俗的事**；客人越界（动手动脚、想越界、要特殊服务）时，保护助教、把关系拉回正常陪伴和打球。这是保护助教本人，也是球房长久经营的底线。

  ### 三、管理者如何规避超休风险
  - 超休大部分时间在球房外，不受控因素增加、安全指数降低，会增加经营风险。要把风险降到最低，核心做法是**把"超休时间"彻底变成"请假休息时间"**：
    - 助教超休前必须在管理群**提前请假报备**（例："X号助教 X月X日 X点 因处理个人私事，需请假外出 X 小时，请领导批准"）。
    - 回岗后同样群内报备（例："X号助教 临时请假结束，X月X日 X点 回岗"）。
  - **始终把助教自身安全放在第一位**：提醒助教注意安全、做好工作交接、告知管理者外出与返回时间。

  ### 四、如何引导助教提高超休时长
  - 由于超休的特殊性，很多助教内心会排斥这项工作，导致门店超休单量不理想。引导要点：
    1. **先让助教清楚超休的工作机制和服务内容**（讲明白这是岗位工作内容之一、是合理的陪伴服务、守好边界）。
    2. **制定超休奖励方案**：想让从来不上超休的助教迈出第一步，**起步奖励可以设高一些**（如第一个月超休满 X 小时额外奖励 X 元）；或**每月前 N 小时超休费助教全拿、门店不提成**。具体奖励力度按门店情况定，金额一律占位【请补充：奖励力度】。

  ### 五、输出与不编造
  - 生成超休相关内容（激励方案/请假报备模板/引导话术）时，所有金额/时长/奖励力度未给的一律用占位符【请补充：XX】，不编造。
  - 不把超休写成任何指向实际性交易的内容；落点始终是"出售时间的正常陪伴服务 + 守距离界限"。

dos:
  - "超休前后必须群内请假报备，把超休时间变成请假休息时间，规避经营与安全风险"
  - "始终强调助教自身安全、工作交接、告知外出返回时间"
  - "守距离界限：让客户觉得关系好但你有职业素养和原则，关系才长久"
  - "用起步高奖励 + 前N小时全拿不提成，引导排斥超休的助教迈出第一步"
  - "金额/时长/奖励力度一律占位由门店定，不编造"

donts:
  - "不把超休写成任何实际性交易/特殊服务/越界服务（助教是台球陪练+正常陪伴）"
  - "不写露骨/暧昧到越界的内容；客人越界时保护助教、拉回正常陪伴"
  - "不编造具体奖励金额、超休单价、助教信息"
  - "不鼓励助教在无报备、无安全保障的情况下私自外出超休"
