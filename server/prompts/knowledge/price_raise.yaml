  # 经营改善后：分区主动涨价 playbook

  这一套补的是很多球房老板的短板——**只会降价救火，不会主动涨价提毛利**。
  价格不是只能往下走。当一家店被接管后把氛围、上座、充值、口碑都做起来，
  营业额成倍涨，这时候就该回头看：哪些区域当初为了拉人定低了、现在可以收回来，
  把毛利提上去。但涨价是门手艺，硬涨会炸客，软着陆才稳。

  ## 一、前提：先把店做起来，再谈涨价（别一上来就涨）

  涨价的底气不是嘴硬，是"我这店现在值这个价、你舍不得走"。所以顺序永远是：

  1. **先做氛围和上座**——接手一家半死不活的店，第一步是把人气、打球氛围、
     回头客做起来（充值送、活动、助教带场、社群激活），让球台坐满、让人觉得"来这儿打球带劲"。
  2. **再做充值和口碑**——日均充值、日均营业额成倍往上走，美团/抖音口碑分起来，
     周边客认这家店。（路径示意：接手前日均营业额一个量级，把氛围充值做起来后能翻到一倍多，
     充值额能涨到两倍以上——这才是涨价的资本。注：这里的倍数只作示意，
     随门店底子、城市、商圈差异很大，不是承诺、也别拿去给老板打包票。）
  3. **最后才择机涨价**——等"这店现在很旺、不愁客"成了既成事实，再分区把价格收回正常水位。
     一上来就涨 = 把刚拉来的人又赶走，前功尽弃。

  > 内行口诀：**先有人挤着打，才有底气涨价；没把氛围做起来就涨，是自杀。**

  ## 二、涨价时机信号（满足越多越敢涨）

  看到下面这些信号，说明涨价窗口到了：

  - **上座率高**：黄金时段（晚上/周末）经常坐满、要等台、排队，说明供不应求，涨价不愁客。
  - **团购占比能压下来**：自然到店、充值客、回头客占比上来了，不再靠低价团购硬撑流量，
    可以把团购的让利收一收。
  - **口碑起来了**：评分、好评、复购都稳，客人是冲"体验/氛围/助教"来的，不是只冲便宜。
  - **周边没有更便宜的等价替代**：周边同档位的店要么更贵、要么体验不如你，
    客人换店成本高——这是你最硬的涨价底气。

  四条里满足三条以上，就可以排涨价计划了。只占一两条、还在靠低价撑场，先别动价。

  ## 三、分区上调因素分析（逐区看：凭什么能涨、涨多少不流失）

  涨价不是全店一刀切加价，是**分区域逐个分析**：每个区凭什么能涨（稀缺/体验/需求旺）、
  当前价 vs 周边、涨多少不掉客。逐区拆：

  ### 1. 团购区（引流低价区）
  - **本质**：团购是引流钩子，价低是为了把人拉进门，不是给老客长期低价。
  - **能涨的逻辑**：店旺了就该把团购"含金量"收一收——抬团购门槛价、缩短时段、
    取消最便宜那档、或把团购引导成到店充值转化（团购只做新客首单钩子）。
  - **看什么**：团购到店后的转化率、团购客占比。占比高说明过度依赖低价，要往回收。
  - **涨多少**：先收最甜的那档（如把最低价团购下架/提价 [请填写]），观察新客量是否还稳。

  ### 2. 包厢
  - **能涨的逻辑**：包厢是稀缺资源（数量有限）+ 私密体验 + 适合聚会/商务，需求旺、客单高、不敏感。
  - **看什么**：包厢黄金时段是否经常订满、要不要等。订满 = 供不应求 = 能涨。
  - **涨多少**：黄金时段包厢台费可适度上调 [请填写]，平峰时段保持或小幅动，
    用"高峰涨、平峰稳"做错峰。包厢客对几块钱不敏感，但对"订不到"敏感——可同步加预订机制。

  ### 3. 竞技区（金腿/银腿等高端台）
  - **能涨的逻辑**：竞技/高端球台是体验差异点，认真打球的客群、比赛局、约球局都冲这个来，
    对台子品质敏感、对价格不敏感。
  - **看什么**：竞技台黄金时段上座、约球局/比赛局频次。常被占用 = 能涨。
  - **涨多少**：竞技区/高端台台费上调 [请填写]，并配套"竞技氛围"（赛事、积分、约球群）让客人觉得物有所值。
    这是全店最该先涨、也最经得起涨的区。

  ### 4. 贵宾区 / VIP
  - **能涨的逻辑**：面向高消费客群，本来就吃"专属感/服务/面子"，价格敏感度最低。
  - **看什么**：贵宾客的充值额、复购、专属需求。
  - **涨多少**：可上调台费或绑高阶充值权益 [请填写]，重点不是单价、是把贵宾客的**充值盘子**做大
    （绑更高充值档、专属服务），让客单价整体抬上去。

  ### 5. 助教费
  - **能涨的逻辑**：助教带场体验好、客人认人，助教费有上调空间，尤其高等级助教。
  - **看什么**：助教上钟率、客人指定率。指定率高的助教 = 能涨。
  - **涨多少**：按助教等级分档（高等级助教费上调 [请填写]、新手保持引流价），
    可保留"首单免费体验/首单优惠"作新客钩子，但常规上钟价该收回的收回。
    （注意：助教是付费陪打/教球服务，靠球技和服务挣钱，不碰任何越界交易。）

  ## 四、涨价先后顺序（先涨最旺、最不敏感的区）

  不要全店同时涨，按"价格敏感度从低到高"排队，先涨最稳的：

  1. **第一批：竞技区 / 高端台 + 黄金时段包厢**——需求最旺、客最不敏感、最经得起涨，先涨这两块吃毛利。
  2. **第二批：贵宾区 + 高等级助教费**——绑充值权益一起调，把高端客单价做厚。
  3. **第三批：团购让利收口**——把低价钩子往回收（提门槛/减档位），减少对低价的依赖。
  4. **最后/最谨慎：大厅散台、平峰时段、新手助教**——这是价格最敏感、最容易掉量的区，
     能不涨就不涨，要涨也最小幅、最晚动，并紧盯上座率变化。

  口诀：**先涨不愁客的，再收低价钩子，散台平峰最后碰。**

  ## 五、怎么对客软着陆（提前预告 + 老客保护 + 体验升级，别硬涨炸客）

  涨价能不能不掉客，全看怎么对客面。硬涨 = 炸客，软着陆 = 客人接受甚至觉得理所当然：

  - **提前预告**：涨价前 [请填写] 天在群里/店内/前台预告，给老客一个"调价前最后充值/锁价"的窗口，
    既缓冲情绪、又顺势拉一波充值。
  - **老客保护**：已充值/会员一卡通客按原权益保护一段时间，或给老客专属保价/升级权益，
    让老客觉得"我是被照顾的"，不是被宰。
  - **配套体验升级**：涨价同时让客人看到"东西变好了"——换台呢、升级球杆、加竞技氛围、
    优化服务/环境，让涨价有支撑，客人觉得物有所值而不是单纯被加价。
  - **错峰而非全涨**：高峰时段/热门区涨、平峰/冷门区稳，给价格敏感客留"便宜时段"，
    既提了毛利又没把人赶走。
  - **小步快跑、看数据**：每次只动一两个区、小幅调，涨完盯上座率/充值/退卡信号一两周，
    稳了再涨下一区。掉量明显就回调，别一次涨到位赌。

  > 合规提醒：对外宣传不写"全城最低价/最高端"等绝对化广告词，不打包赢承诺；
  > 涨价话术讲"体验升级、品质对得起价格"，不贬损同行、不编造稀缺。
