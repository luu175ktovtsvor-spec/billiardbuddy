  # 助教人设 / 形象卖点打造 SOP

  > 这是助教这条线最值钱的一块运营。助教岗位卖的不是台球技术，是**异性陪伴的情绪价值**——
  > 客户掏钱约助教，核心动机是"有个好看、会聊、让人舒服的人陪我打一场"，技术高低排在很后面。
  > 把这个想透了，下面所有动作才说得通。

  ## 一、为什么形象是助教第一卖点

  助教岗位的能力排序，内行的优先级是固定的：

  **个人形象 > 沟通能力 > 台球技术。**

  - **形象第一**：客户在台前/线上第一眼看的就是人。形象决定了客户愿不愿意约、愿不愿意续、愿不愿意多花。
    形象到位的助教，技术再普通也有人排队约；形象不到位的，球打得再好也很难起量。这不是消毒过的客套话，是真实变现逻辑。
  - **沟通第二**：约到台前之后，能不能让客户聊得开心、舒服、想再来，靠的是会聊会带气氛、会给情绪价值，
    而不是给客户上技术课。助教首先是陪玩、陪聊、给松弛感的角色。
  - **技术第三**：助教要能陪打、能教两手基础、能让客户觉得"跟她打有进步"，但技术只是基本盘、不是卖点上限。
    不要让助教把大量时间砸在练高难技术上，那不是这个岗位的投产比所在。

  招新、培养、考核助教，都按这个排序来：选人优先看形象气质与镜头感，沟通可培养，技术补到能陪打即可。

  ## 二、四类人设风格定位（一人选一类、做到极致）

  引流人设不要"什么都沾一点"，那样没记忆点。按助教本人的**天然气质**选一类强化，做到这一类里的极致辨识度。
  四个主流方向：

  - **性感**：成熟、有曲线、强女人味。穿搭偏修身/露线条，妆容偏浓、强调眼神与唇，气场偏撩。适合本身气质偏成熟、有身材优势的助教。
  - **可爱**：邻家、甜、年龄感年轻。穿搭偏甜系/学院/短裙，妆容清透显嫩，表情多笑、爱撒娇。适合脸偏甜、笑起来有亲和力的助教。
  - **飒爽**：清爽、利落、有点酷又好接近。穿搭偏简洁运动/中性帅气，妆容干净，状态自信大方。适合身高/线条好、性格直爽的助教。
  - **潮酷**：街头、潮、有态度。穿搭偏潮牌/个性风，妆造有设计感，气质偏酷拽。适合本身爱玩穿搭、有镜头表现欲的助教。

  定位原则：**顺着本人气质放大，不要逆着拧**。让一个甜妹硬演性感、让一个利落女生硬装可爱，都别扭、也撑不久。
  一旦选定，所有内容（穿搭、妆造、文案、视频风格）都往这一类收拢，越统一越有记忆点、越好被客户记住和指名约。

  ## 三、人设落地：穿搭 / 妆造 / 现场到镜头的统一标准

  人设不是拍视频那一刻才装一下，是一套**贯穿线上线下的统一形象**。客户线上刷到的、到店见到的，必须是同一个人、同一种感觉，
  不能线上一个样、到台前判若两人，那是最掉续约率的事。

  落地清单（每位助教按自己选定的风格定一套标准、固定下来）：

  - **穿搭**：定 [请填写] 套符合人设的固定搭配做"工作战袍"，颜色/版型/风格统一，避免每天乱穿稀释记忆点。上钟、拍内容都穿这一套体系内的。
  - **妆容**：定一套与风格匹配的标准妆（性感偏浓、可爱偏清透、飒爽偏干净、潮酷偏有设计感），上钟前必须到位，做到镜头里和现场一致。
  - **发型**：固定一个适合本人风格的发型/发色基调，保持稳定，不要频繁大改人设认不出。
  - **现场状态**：到台前的姿态、表情、说话方式与人设一致——可爱就多笑多互动，飒爽就大方利落，性感就稳住气场，潮酷就带态度。
  - **朋友圈一致性**：朋友圈是客户复看人设的地方。头像、相册、日常发的内容风格，必须和短视频/现场是同一套人设，不能这边性感那边卖惨。
    朋友圈日常 = 把选定的人设"演成生活"给客户看，强化记忆、维持热度。

  > 核心一句话：**线上、现场、朋友圈三处人设必须是同一个**，否则客户约前的期待和到店的体验对不上，约一次就不再来。

  ## 四、各平台人设内容方向（都围绕选定那一类风格）

  引流以**短视频 + 直播**为主，多平台分发。所有平台的内容都不偏离选定的那一类人设。

  - **短视频出镜**：每个助教按自己的风格出镜——展示状态、台前片段、穿搭、日常切片。
    内容数量比单条精致更重要，保持稳定更新 [请填写] 条/周，让算法和客户都记住这个人。视频文案口吻也要贴人设（可爱就甜、飒爽就利落）。
  - **直播**：直播是把人设"活"给客户看，互动感最强。固定时段开播、围绕风格设计直播状态与话术，
    直播里自然地把观众往私域引（引导加微信/到店），别硬推销。
  - **朋友圈日常**：维持人设热度的主战场，发选定风格的日常、台前花絮、客户互动反馈，
    用持续的"人设生活感"养着老客、勾着潜在客，节奏稳定 [请填写] 条/天左右。

  内容方向不管哪个平台，落点都是一致的：**让人记住这个人 → 引导加微信 → 收进私域沉淀 → 转化到店约钟**。

  ## 五、助教管理者的活：逐个定人设 + 拍内容 + 统一往"加微信"收口

  助教人设不是放任各自发挥，是**助教管理者要一个一个带出来**的活。管理者的核心工作：

  1. **逐人定人设**：和每个助教一起判断她的天然气质，从四类里选定一类，给她讲清这一类的穿搭/妆造/表情/文案标准，
     帮她把"工作战袍 + 标准妆 + 固定发型"这套定下来。
  2. **协助拍内容**：帮助教策划、拍摄、剪辑短视频，安排直播时段，把控内容是否贴人设、质量是否过线，
     避免助教自己瞎拍、风格乱飘。管理者要懂内容、能给方向。
  3. **统一往"加微信"收口**：这是所有内容动作的终点。不管短视频、直播还是现场服务，最后都要自然地**引导客户添加微信**——
     把公域流量沉淀成私域，私域里才能维护、复购、指名约。每个助教的内容里都要埋好加微信的钩子（评论引导/直播话术/到店扫码），但用引导、不用骚扰。
  4. **协助沟通**：管理者还要在助教和客户之间做润滑——帮助教处理刁钻客户、统一对外口径、维护好私域里的客户关系，
     让助教把精力放在出镜和陪打上。

  > 管理目标：把一支助教队伍做成**一组各有记忆点、又都往同一个私域漏斗收口**的内容矩阵。

  ## 六、底线（自然守住，别越界）

  人设营销是真做、要大方做——形象、风格、内容、引流都是为了变现，这没什么好遮掩的。但服务的**实际落点只有两个**：
  **台球陪打 + 情绪价值（陪聊、陪玩、给松弛感）**。

  - 人设、暧昧感、撩拨气质都是促成约钟的钩子，但**到了实际服务，落点就是陪打球和情绪陪伴**，不营销、不暗示、不安排任何实际性交易（性服务/援交/陪睡/上门过夜一律不碰）。
  - 首单免费体验、约钟促销这类钩子可以用；但不打"全城最低/包教包赢"这类绝对化话术，也不把助教写成长期免费赠品。
  - 客户在台前要控金额/控场面时，按门店控场规矩稳住，别让客户上头炸店——这是真实控场动作，要做。
