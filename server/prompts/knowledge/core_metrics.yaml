key: "knowledge.core_metrics"
name: "核心指标公式库"
category: "knowledge"
variables: []
description: |
  球房经营核心指标的计算公式和分析方法。
  用于AI生成日报、周报、诊断建议时引用正确的指标公式，避免编造数据。
  数据来源：行业资料中的数据分析流程文档。

template: |
  ## 核心指标公式库

  ### 一、日经营核心公式

  总营业额 = 台费 + 助教费 + 商品费
  台费 = 直接开台台费 + 团购台费
  台费 = 助教客户台费 + 竞技客户台费 + 散客台费
  商品费 = 助教客户商品 + 竞技客户商品 + 前厅部商品

  ### 二、台费指标

  翻台率 = 日均开台时长 / 营业时长
  及格线：4小时/桌/天
  优秀：6小时/桌/天

  客单价 = 台费总额 / 开台台次
  纯台费客单价参考：30-60元
  含助教客单价参考：100-200元

  团购占比 = 团购台费 / 总台费
  健康水平：20%以内
  过高（>40%）：依赖低价引流，客单价难提升

  ### 三、助教指标

  上钟率 = 上钟时长 / 在岗时长
  人均时长 = 总上钟时长 / 到岗人数
  参考值：人均4小时/天为及格

  助教费占比 = 助教费 / 总营业额
  商业球房参考：20-30%

  ### 四、教练指标

  加微信转化率 = 新增微信数 / 接触客户数
  竞技客户转化率 = 新增竞技客户 / 总客户数
  组局率 = 成功组局数 / 邀约数

  ### 五、前厅指标

  团购核销率 = 核销数 / 购买数
  好评率 = 好评数 / 到店客户数
  参考值：美团评分及格4.6/良好4.8/优秀4.9

  ### 六、分区数据（六大金刚区域）

  每个区域独立核算：
  - 开台次数
  - 总时长
  - 营收金额
  - 平均每单时长
  - 平均客单价

  区域划分（以大型球房为例）：
  - 乔氏金腿区
  - 乔氏银腿区
  - 台球包间区
  - 棋牌包间区
  - 独牙自助区
  - 独牙非自助区

  ### 七、趋势分析方法

  日环比 = (今日 - 昨日) / 昨日 × 100%
  周同比 = (本周均值 - 上周均值) / 上周均值 × 100%
  月同比 = (本月 - 上月) / 上月 × 100%

  异常判断：
  - 日环比波动>20% → 需要分析原因
  - 周同比持续下降>10% → 需要干预
  - 某区域营收占比异常 → 定位问题部门

  ### 八、数据诊断思路

  开台次数不错但总台费差 → 优质客户不够，需要提升客单价
  助教费还可以但总台费上不去 → 教练部门出问题，竞技客户转化不足
  团购金额还可以但总台费上不去 → 直接开台出问题，散客转化不足
  商品费一般，助教费高于商品费 → 前厅推商品能力需加强
