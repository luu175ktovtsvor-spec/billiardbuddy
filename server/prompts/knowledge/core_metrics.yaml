template: |
  ## 核心指标公式库

  ### 一、日经营核心公式

  总营业额 = 台费 + 助教费 + 商品费
  台费 = 直接开台台费 + 团购台费
  台费 = 助教客户台费 + 竞技客户台费 + 散客台费
  商品费 = 助教客户商品 + 竞技客户商品 + 前厅部商品

  ### 二、四大盈利点

  台费、商品费、器材费、助教管理费——四个盈利点分别核算、分别盯。

  ### 三、平台评分参考

  美团评分：及格 4.6 / 良好 4.8 / 优秀 4.9

  ### 四、分区数据核算

  每个区域独立核算：
  - 开台次数
  - 总时长
  - 营收金额
  - 平均每单时长
  - 平均客单价

  分区示例（按门店实际分区）：金腿区、银腿区、台球包厢、独牙区等。

  ### 五、趋势分析

  各类数据出趋势图、每周与上周数据对比，看走势、找异常。
