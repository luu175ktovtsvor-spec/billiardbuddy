description: |
  台球房店长的能力模型与考核体系。讲清三件事：①店长的核心工作不是看店收银，
  而是营销——把客流和业绩做上去；②店长必须具备的五大能力（营销/数据分析/团队搭建/
  组织活动/解决问题）；③团队怎么搭（赛马机制筛选培养助教管理、教练）；④老板/投资人
  抓店长的硬指标，以及店长往下盯四大数据、老板往上用一组数抓店长这两个视角。
  用于回答"店长该干什么、怎么考核店长、店长怎么带团队"类问题。
template: |
  # 店长能力模型（怎么当一个值钱的店长）

  ## 一、先纠一个认知：店长的核心工作是营销，不是看店

  很多人以为店长就是排班、收银、盯着场子别出乱子——错。**球房店长的核心工作只有两个字：营销。**

  看店、收银、巡场是基本功，是底线，不是价值。一个店长值不值钱，看的是他能不能**把客流和业绩做上去**：
  - 怎么让新客进来（拉新、平台运营、地推、异业、转介绍）；
  - 怎么让老客回头、提频、充值（留存、社群、助教/教练带客）；
  - 怎么让单客产值更高（台费之外的助教、教练、商品、器材）。

  一句话：**店长是这家店的"业绩第一责任人"，不是"治安队长"。** 你交给老板的不该是"今天没出事"，而是"今天比昨天多做了多少业绩、多了几个新客"。

  ## 二、店长必须具备的五大能力

  | 能力 | 一句话说清要会啥 |
  |------|------------------|
  | **营销能力** | 会想活动、会拉新、会留存、会用平台（团购/短视频/社群）把客流和业绩做上去——这是核心，排第一。 |
  | **数据分析能力** | 会看数、会算账。每天能从台费、上钟、商品、会员等数字里看出"哪儿涨了、哪儿漏了、为什么"，并据此调动作，不是月底才发现亏了。 |
  | **团队搭建能力** | 会招、会筛、会培养、会留人。能搭出一支助教管理 + 教练 + 前厅的班子，靠机制让能干的人冒出来（见第三节赛马机制）。 |
  | **组织活动能力** | 会落地。一个活动从策划、排期、分工、宣传、执行到复盘，店长能把它跑通跑出效果，而不是发个朋友圈就完事。 |
  | **解决问题能力** | 现场什么都可能出：客诉、纠纷、设备坏、员工闹情绪、突发控场。店长得能当场拍板、稳住局面、把问题平掉，不往老板那儿推。 |

  配套两条基本素质（贯穿五大能力）：
  - **"跟我冲，不是给我上"**——店长得有人格吸引力，敢为人先、严于律己，带头干而不是指着别人干，员工才服。
  - **了解员工、有目标方向**——清楚每个员工的长处和短板，给团队拆出月度/季度/年度目标，不断帮扶进步，不能只一味提要求不给方法。

  ## 三、团队怎么搭：赛马机制

  店长组建团队的核心方法是**赛马机制**——给目标、比数据、能者上。不靠拍脑袋提拔、不靠关系，靠真实数据说话。

  **怎么落地：**
  1. **给同一个目标**：把候选的助教/教练放到同一条赛道，定一个可量化的目标（比如一段周期内的陪打时长、约客转化、带客复购、客户好评等），口径一致、谁都看得见。
  2. **比数据**：周期内拉出排名，用数据排座次，而不是用印象。谁约客多、谁陪打时长高、谁带的客回头率高，一目了然。
  3. **能者上**：跑赢的人提到管理岗（助教管理）或给更好的资源/班次/客源；持续垫底的淘汰或调整。位置是赛出来的，不是分配的。

  ### 筛选助教管理的方法
  从助教里赛出管理者，看的不只是个人业绩，更看**能不能带队**：
  - 个人数据要在前列（自己得是会挣钱的助教，服众）；
  - 愿意分享方法、能帮新助教上手、有责任心、扛得住事；
  - 给一小队试带，看这一队的整体数据有没有被带起来——**带队的成绩才是管理者的成绩**。

  ### 筛选教练的方法
  教练赛的是**专业 + 转化 + 留存**：
  - 球技与教学专业度（能教明白、学员有进步）；
  - 能把体验课/单次客转成持续学员（约课转化、续课率）；
  - 学员满意度与口碑（带出来的学员愿不愿意续、愿不愿意推荐）。

  > 招人原则一句话：**人对了，事就顺了。** 店长的面试能力、培训能力、吸引人才的能力，最终都服务于"把对的人筛进来、用机制让他们冒出来"。

  ## 四、店长往下盯：四大数据

  店长日常管理盯**四大数据**，这是他自己的仪表盘：
  - **助教数据**：当日助教上班人数、平均陪打时长、约客/转化、客户标签维护等——助教是产值引擎，数据掉了业绩立刻掉。
  - **教练数据**：课时量、约课转化、续课率、学员满意度。
  - **前厅数据**：商品费、器材费、电费等运营成本，以及前厅服务带来的连带消费。
  - **总营业额数据**：台费、团购占比、整体营收与利润趋势。

  店长靠这四组数每天判断"今天哪儿好、哪儿漏"，当天就调动作，而不是等月底复盘才发现问题。

  ## 五、老板往上抓：用一组硬指标抓店长

  老板/投资人不可能天天盯现场，他**用一组硬指标抓店长**——店长干得好不好，就看这几个数：

  | 硬指标 | 看什么 |
  |--------|--------|
  | **营业额及利润** | 最终结果，赚没赚到钱、赚了多少。 |
  | **人事指标** | 团队稳不稳、流失率、在岗结构、招培留做得怎么样。 |
  | **台费（团购占比）** | 台费总量，以及团购占了多大比例——团购占比过高说明吃低价流量、利润被压，店长要把它控在合理区间。 |
  | **当日助教上班人数** | 排班是否到位、产值引擎开了几台。 |
  | **平均陪打时长** | 助教的真实产出效率，时长上不去说明约客/转化或管理出了问题。 |
  | **商品费** | 商品（饮品/小吃等）的销售贡献。 |
  | **器材费** | 器材相关消费/损耗与收入。 |

  **两个视角串起来看：**
  - **店长往下**：用"助教/教练/前厅/总营业额"四大数据管现场、管团队、当天调动作；
  - **老板往上**：用"营业额及利润 / 人事 / 台费（团购占比）/ 当日助教上班数 / 平均陪打时长 / 商品费 / 器材费"这组数抓店长。

  这两组数是咬合的：店长往下盯的四大数据做扎实了，老板往上抓的这组硬指标自然就好看。**店长心里要清楚——你每天盯的那几个数，正是老板用来给你打分的那几个数。**

  > 提醒：以上所有金额、比例、目标数字（团购占比红线、平均陪打时长目标、营业额/利润目标等）都[请填写]，由门店按自己的城市、店型、阶段来定。行业里团购占比常被控制在一个不让利润失血的区间、平均陪打时长是助教核心 KPI，但具体数字各店差异大，不要套别人的。
