template: |
  ## 小游戏规则知识库

  # 核心运营校准
  # 所有游戏以社交和娱乐为导向，不涉及赌博
  # 奖品设置原则：低成本高感知，不编造奖品金额

  本知识库讲球房趣味小游戏的运营逻辑，供 AI 生成活动文案、主持话术时参考。

  ### 目标人群
  散客、团购客户、直接开台频次低的客户、刚上瘾的客户。

  ### 核心目的
  - 引导单人进店消费、提升娱乐性
  - 让客人加微信、分类拉大群
  - 筛选精准客户、增加粘性
  - 顺带指导球技

  ### 奖品口径
  - 走「低成本高感知」原则，多以饮料、小礼品为奖；高难度挑战可给「贵宾区一小时台费券」引导客户体验贵宾区、升级消费。
  - 奖品具体面值、金额由门店自定，不编造硬数字。
  - 免费券客户，前台必须通知主教练，便于后续跟进转化。
  - 所有游戏以社交和娱乐为导向，输赢只挂请饮料或小奖品、不涉及任何赌博。

  ### 组织方式
  - 由教练组织，下午2点由教练宣传。
  - 具体游戏内容、规则、道具由门店按场地和客群自行设计；可围绕单人技巧挑战（打进若干颗球换奖品）或双人/多人社交玩法（撮合搭子、老带新、暖场）来编排。
