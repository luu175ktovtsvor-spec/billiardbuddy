  ## 小游戏规则知识库

  # 核心运营校准
  # 所有游戏以社交和娱乐为导向，不涉及赌博
  # 奖品设置原则：低成本高感知，不编造奖品金额

  本知识库收录球房常用趣味小游戏，供 AI 生成活动文案、主持话术时参考。
  游戏目标人群：散客、团购客户、直接开台频次低的客户、刚上瘾的客户。
  核心目的：引导单人进店消费。

  奖品设置原则：
  - 低难度：可乐/雪碧等5元饮料
  - 中难度：红牛/功能饮料等10元饮品
  - 高难度：贵宾区一小时台费券（消费升级体验，引导客户体验贵宾区）
  - 注意：免费券客户前台必须通知主教练，便于后续跟进转化
  - 奖品可随时更换，以上仅作为门店参考

  ---

  ### 1. 黄金满台

  **规则：** 台面铺满奖励（各面值现金、台费卡、饮料卡、礼品卡），底库袋口摆放一颗目标球，母球位于开球线任意点位。击打目标球后，白球停在哪个奖励上，即获得对应奖品。

  **道具：** 活动专题展示板、台费卡、各面值现金、饮料卡、礼品卡

  **时长：** 每人约3-5分钟

  **适合场景：** 开业活动、大型促销日、晚场氛围活跃

  **注意事项：** 奖励需提前摆放，现场拍照营造视觉冲击；奖品格子不宜过小

  ---

  ### 2. 旋转5分点

  **规则：** 体验者原地先转3圈，然后击打10颗5分点球。打进3颗奖可乐一瓶；5颗奖红牛一瓶；7颗奖68元台费卡。

  **道具：** 台费卡、红牛、可乐

  **时长：** 每人约3分钟

  **适合场景：** 晚场小游戏、日常活跃、团购客转化

  **注意事项：** 转圈后容易头晕，注意安全；难度适中，趣味性强

  ---

  ### 3. 倒车入库

  **规则：** 白球放置于开球点，打到底库弹回中袋规范地点算成功。成功奖励红牛一瓶。

  **道具：** 红牛

  **时长：** 每人约2分钟

  **适合场景：** 快速互动、散客破冰

  **注意事项：** 规则简单，适合新手参与；可多给几次机会增加成功率

  ---

  ### 4. 看你有多库

  **规则：** 桌上放四个纸杯当障碍物，游戏回合一次，开球区开球击打底库，回弹不碰到障碍物为成功。两库奖励可乐一瓶；三库奖励红牛一瓶；四库奖励68元台费卡。

  **道具：** 可乐、红牛、台费卡、4个纸杯

  **时长：** 每人约2-3分钟

  **适合场景：** 中高级球友挑战、晚场互动

  **注意事项：** 纸杯位置固定且提前摆好；难度可调整纸杯间距

  ---

  ### 5. 控球大师

  **规则：** 在不碰到桌面障碍物的情况下，把6颗洞口球打进。打进4颗奖励可乐一瓶；5颗奖励红牛一瓶；6颗奖励68元台费卡。

  **道具：** 可乐、红牛、台费卡、障碍物

  **时长：** 每人约3-5分钟

  **适合场景：** 中高级球友挑战、日常活动

  **注意事项：** 障碍物位置影响难度，可准备不同难度布局

  ---

  ### 6. 穿越火线

  **规则：** 用三个壳子或两瓶饮料搭一个门，开球区开球穿越门，一个来回算成功一次。成功一次可乐一瓶；两次红牛一瓶；三次68元台费卡。

  **道具：** 可乐、红牛、台费卡、壳子/饮料瓶

  **时长：** 每人约3分钟

  **适合场景：** 晚场互动、散客破冰

  **注意事项：** 门的位置和宽度决定难度；适合新手，观赏性强

  ---

  ### 7. 开火车

  **规则：** 球台并排两排球，母球从球间穿越来回，不碰到球台任意一颗球，三次机会成功一次即为成功。成功奖励5元饮料任选一瓶。

  **道具：** 可乐、雪碧

  **时长：** 每人约2分钟

  **适合场景：** 快速互动、新手体验

  **注意事项：** 难度较低，适合引导首次到店客户参与

  ---

  ### 8. 冲出牢笼

  **规则：** 将15颗球按三角形摆放到球点上，把三角架放在球堆上，用母球击打球堆，球框落下，以框住球颗数评定奖励。套住2颗奖励可乐一瓶；3颗奖励红牛一瓶；4颗以上奖励68元台费卡。

  **道具：** 可乐、红牛、台费卡、三角架

  **时长：** 每人约2分钟

  **适合场景：** 开业引流、大型活动

  **注意事项：** 观赏性强，适合围观；一次一人，节奏快

  ---

  ### 9. 硬币突围：精准一击

  **规则：** 在球台摆球点摆一颗球，上面放一枚硬币，在黑球周围框一个方形区域，在开球点击打母球，硬币掉出圈外视为挑战成功。成功一次奖励可乐一瓶；两次红牛一瓶；三次68元台费卡。

  **道具：** 可乐、红牛、台费卡、硬币

  **时长：** 每人约3分钟

  **适合场景：** 精准度挑战、晚场互动

  **注意事项：** 方形区域大小决定难度；趣味性强，适合拍照分享

  ---

  ### 10. 六球奇遇记：扑克定局

  **规则：** 在球台三分线依次摆放6颗球，拿来对应数值的6张扑克牌打乱，客人依次抽取3张牌，抽到几号打几号球，白球每次固定开球线点位，打进视为挑战成功。进一颗可乐一听，两颗以上红牛一听。

  **道具：** 可乐、红牛、扑克牌

  **时长：** 每人约3分钟

  **适合场景：** 晚场互动、新手参与

  **注意事项：** 扑克牌增加随机性和趣味性；新手友好，无需高球技

  ---

  ### 11. 点球大战

  **规则：** 白球固定开球线中间点位，黑8固定3分线点位，打进即视为成功。成功一次可乐；两次红牛；三次68元台费卡。

  **道具：** 可乐、红牛、台费卡

  **时长：** 每人约2分钟

  **适合场景：** 快速互动、散客破冰、新手体验

  **注意事项：** 规则极简，参与门槛最低；适合教练快速组织

  ---

  ### 12. 控力接龙

  **规则：** 7个目标球固定两个中袋正中间一排位置，在不碰球不吃库的情况下，由每次的第二颗球为母球击打第一颗进同一个中袋。3颗可乐一听，5颗红牛一听，全打完台费卡68元。

  **道具：** 可乐、红牛、台费卡

  **时长：** 每人约5分钟

  **适合场景：** 中高级球友挑战、技术展示

  **注意事项：** 难度较高，适合有一定基础的客户；展示性强

  ---

  ## 游戏组织建议

  1. 活动时间：下午2点由教练组织宣传，晚上9点由教练主持开始，10点结束
  2. 奖品可随时更换，以上仅作为门店参考
  3. 游戏周期更换（每日或每周末），保持新鲜感
  4. 免费券客户前台必须通知主教练，便于后续跟进转化
  5. 每次活动后教练记录参与人数和送出奖品，用于活动效果评估
