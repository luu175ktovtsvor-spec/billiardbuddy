template: |
  ## 数据诊断 data-analysis · 域目录页（L1 导航）

  这个域管【读数据 → 找问题 → 给动作】：用对指标、看懂四大数据、按决策树定位根因、落到具体部门的具体动作。
  下面是骨架 → 子知识索引 → 典范 → 硬数字单一源。**铁律：POS 只读，只读老板导出的报表做诊断，不碰收银系统；真实数字由报表提供，模板只做判断、不编造营业额。**

  ### 骨架（底层逻辑，模型据此延伸）
  - **先用对指标**：台费/上座率/翻台/客单价/复购/会员占比等核心指标各有公式，算之前先确认公式、别编数据。术语给老板看时翻成大白话（客单价＝一个人平均花多少、翻台＝一桌走了下一桌接上、环比＝比上个月）。
  - **四大数据是体检表**：台费 / 助教费 / 商品费 / 充值的结构与趋势，重点不是罗列数字而是"看出问题 → 给下一步动作"。
  - **诊断走决策树**：指标异常 → 根因 → 责任部门 → 具体动作，让诊断落到某个部门的某件事，不停在"营业额下滑"这种空话。
  - **复盘要闭环**：日报/月报关注趋势和同比（不是堆数字）、复盘会对齐问题、推广效果做前后对比看值不值。

  ### 子知识索引（要细则，用 look_up_knowledge 查或读全文）
  - knowledge.core_metrics — 核心指标计算公式与分析方法（生成日报/周报/诊断时引用正确公式，避免编数据）。【硬数字】
  - knowledge.diagnostic_logic — 经营诊断决策树（指标异常→根因→责任部门→具体动作）。

  ### 典范（要动手写真东西时，读这几个最对版；多为 operation 模板，经 find_scenario 取 prompt_key）
  - 日报/月报 → operation.daily_report、operation.monthly_report（数据用占位符，不美化不编造）。
  - 复盘 → operation.four_data_review（四大数据结构与趋势判断）、operation.review_meeting（复盘会模板）。
  - 推广效果 → operation.promotion_analysis（促销效果前后对比分析）。
  - 真诊断入口 → operation.diagnosis_tool（读老板导出报表做经营诊断）。

  ### 硬数字 · 单一源（钉死，别处只引用不复述）
  - 指标公式 → knowledge.core_metrics（这是全产品指标口径的唯一可信源）。**算之前查它、按它的公式来，不自己造公式、不编造数据。**

  ### 红线 / 边界
  - 不碰收银系统、只读导出报表；不编造营业额/数字，缺数据一律占位。涉及对外/合规仍守 `core.safety_redlines`。
