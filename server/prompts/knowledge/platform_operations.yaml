template: |
  ## 美团/抖音平台运营标准

  ### 评分要求
  - 及格线：4.6分
  - 良好：4.8分
  - 优秀：4.9分

  ### 好评规范
  - 图片：3张（场景图+球台图+氛围图）
  - 文字：15字以上，每条评价文字表述需有差异
  - 评价前：关闭门店WIFI，使用手机流量
  - 定位：关闭手机定位服务后再评价
  - 验券后间隔20分钟再评价
  - 同一账号每天只能评价一次，下次评价至少隔天

  ### 美团星级达成五个要点
  1. 聊天监控：勿以文字发送做评价的信息
  2. 定位监控：评价前后三天内必须定位到店
  3. 打字速度：不要复制粘贴
  4. 老会员评价间隔至少一周
  5. 美团每日评价不超过10条

  ### 大众点评操作
  - 到店打开大众点评→左下角打卡→30分钟后评价
  - 3张图片+15个文字，每日最多5条

  ### 团购品类优化
  - 团购产品类别减少至4-5个
  - 设置爆款商品，积累单量
  - 品类太多不利于爆款单量积累
  - 页面展示：场景图+美女图+场馆美图

  ### 抖音运营
  - 抖音全要好评
  - 美团控制在10条/天
  - 图文并茂，多个视角
