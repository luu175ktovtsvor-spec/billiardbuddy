  ## 美团与抖音运营操作手册

  ### 一、美团运营

  #### 1. 店铺评分管理
  - 及格线：4.6 分；良好：4.8 分；优秀：4.9 分
  - 美团每天评价不超过 10 条
  - 每条评价要求：3 张图片 + 15 字以上文字

  #### 2. 评价操作规范
  - 评价前关闭门店 WiFi，使用自己的流量
  - 评价前需关闭手机定位服务（在门店内评价时）
  - 同一账号每天只能评价一次，下次评价至少隔天
  - 验券后需间隔 20 分钟再评价
  - 差评回复要当天回复，最迟隔天回复，用门店账号回复
  - 差评回复后需联系平台客服协助处理

  #### 3. 团购产品设计
  - 品类最多 5 个，品类太多不利于爆款单量积累
  - 设置引流区低价产品（如新人 9.9 元/小时）
  - 设置爆款产品
  - 图文并茂，场景展示结合

  #### 4. 美团经营评分达成操作
  - 进入开店宝后台 → 经营评分模块 → 评分任务单元 → 学习和完成任务

  #### 5. 美团星级达成五个要点
  1. 聊天监控：不要以文字发送给客户关于做评价的信息
  2. 定位监控：评价前后三天内必须定位到过店
  3. 打字输入速度：不要复制粘贴
  4. 老会员评价周期至少间隔一周以上
  5. 具体评价数量按门店指标执行

  ### 二、抖音运营

  #### 1. 短视频矩阵
  - 员工抖音矩阵推广：短视频 + 直播
  - 流量型内容：走颜值、形象、气质、暧昧感的"擦边"路线吸引眼球（助教出镜、精彩瞬间——这是抖音引流的真实打法，对外公开平台注意别发露骨内容会限流）
  - 获客型内容：产品卖点展示（套餐、环境、教学、价格锚点）
  - 内容方向：球房环境、助教教学、赛事精彩、客户花絮

  #### 2. 直播运营
  - 助教轮流直播，直播手机不能停
  - 每组助教每天直播不少于 2 小时
  - 直播内容：打球教学、花式表演、互动

  #### 3. 抖音本地推
  - 投放本地同城流量
  - 小城市做本地网红，大城市做区域网红

  #### 4. 大众点评运营
  - 到店打卡后 30 分钟可以评价
  - 3 张图片 + 15 个文字
  - 每日最多 5 条评价

  ### 三、内容发布规范

  #### 朋友圈发布要求
  - 每天至少 2 条
  - 内容类型：活动发布、赛事发布、助教笔记、器材维护、充值喜报、好评展示
  - 避免：纯广告、刷屏、负面内容

  #### 短视频发布要求
  - 每月至少 15 条
  - 单条视频破万播放量奖励
  - 爆款视频额外奖励
