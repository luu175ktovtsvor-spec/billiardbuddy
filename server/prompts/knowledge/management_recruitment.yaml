description: |
  台球房管理层（店长、助教管理、教练、主管）的招聘方法论。
  核心：找到对的人（赛马机制），而不是自己干所有事。

template: |
  ## 管理层招聘核心规则

  ### 四个岗位及核心要求
  - 店长：销售能力+管理能力+赚钱欲望+执行力+数据分析
  - 助教管理：女生沟通能力+管理能力+赚钱欲望+执行力
  - 教练：营销获客（把散客带上瘾、转成竞技客户、扩大竞技客户基数=核心第一位）+ 竞技技术指导/教学 + 客户维护 + 赛事组织
  - 主管：执行力+服务意识+团队协调

  ### 招聘渠道要点
  - 招聘平台：岗位写"服务员/前台/台球教练"不写"助教"；薪资写"底薪+绩效+带薪培训"；主动搜索候选人
  - 抖音：发门店环境视频展示工作氛围，用合规岗位名
  - 朋友圈：发团队合照/培训花絮/工作日常，让现有员工转发

  ### 面试流程
  平台沟通 → 加微信 → 查朋友圈（判断形象和生活状态）→ 约到店面试 → 参观门店介绍工作和薪资 → 1-3天试岗

  ### 招聘核心原则
  - 招聘排序：个人形象 > 沟通能力 > 台球技术
  - 双向选择不降标准，宁缺毋滥，不合适及时止损

  ### 助教招聘实战（线上发起 → 筛形象 → 约面 + 同业挖人）
  助教是门店的挣钱引擎，招得快、招得多、形象过关，比什么都重要。这一节讲的是真打仗的打法：主动出击、批量筛人、把精力花在能成的人身上。心态先摆正——**是我招你，不是你招我**，花最少的精力筛更多的人。

  #### 一、线上发起（招聘平台主动私信）
  - **主动出击，不等投递**：在招聘平台上主动搜候选人、主动发起聊天，靠等人投简历招助教太慢。把"打招呼"当成日常动作，每天定量发。
  - **非助教岗名义，别打标签**：线上一律**不提"助教"**两个字，岗位挂"台球助理教练"（或服务员/前台/台球教练）。原因有两个——一是助教岗在平台容易被限流/封号，二是直接打"助教"标签，很多本可以聊的人一看就划走了。**先把人聊到微信，再讲真实工作内容和收入**。
  - **发起时段挑活跃点**：经验上**晚上 11 点到凌晨 3 点**这个时段，目标人群在线、回复率明显高（夜生活作息和门店客群重合）；这个时间段主动发私信，效率比白天高。话术简短直接，例如"你好，有换工作的打算吗？我们这边在招台球助理教练，待遇不错"。
  - **回复就立刻要微信**：对方回"有"，第一时间引导"方便加个微信细聊吗"，把阵地从平台转到微信——平台聊多了容易被风控，微信里才好发照片、看朋友圈、约面试。
  - **没回的第二天再触达一次**：当天没回的，第二天上午统一再发一条跟进，触达过一轮还没反应的就放掉，不纠缠，把精力留给有回应的人。
  - **⚠️ 防封红线**：别在非助教岗位的对话里聊助教内容、别在助教岗对话里跟第三方谈业务——平台风控盯这些，踩了就封号，前面攒的资源全废。

  #### 二、筛形象（加微信 → 要照片 → 看朋友圈 → 约面）
  助教这行形象气质是硬指标，**线上就要把形象筛掉一大半**，别把不合适的人约到店里浪费双方时间。核心是"我主导、我筛选"的心态：
  - **主导聊天，直接要照片**：加上微信别绕弯子，主导节奏、直接说"方便发张生活照看下吗，我们这边对形象有要求"。要照片不是冒犯，是岗位需要，理直气壮地要。
  - **看朋友圈判断形象气质**：翻对方朋友圈——有没有露脸照片、整体气质、生活状态。**朋友圈一张本人照片都没有的，大概率形象不过关**，可以直接降优先级。这一步几乎不花成本，却能筛掉大半。
  - **形象合格直接约面试**：照片和朋友圈都过得去，**不废话、直接约到店面试**，别在微信里反复寒暄消耗。约面也是你定时间、你定地点，主动权在你手里。
  - **心法**：是我招你不是你招我；线上这一关就是个漏斗，目标是**用最少的精力把不合适的快速刷掉**，把到店名额留给真正可能成的人。形象不达标的及时止损，不勉强。

  #### 三、同业挖人（周边门店 → 私微交朋友 → 放大痛点 → 直奔主题）
  现成的熟手助教是最值钱的——上手快、自带客户。从周边门店挖人是一条稳路子，**视情况可以辐射到更大范围**。打法是慢热铺垫、再临门一脚：
  - **私人微信加，先交朋友**：用个人微信添加，**先正常聊天交朋友**，别一上来就挖人——突兀地谈跳槽容易把人聊死，也容易被原店察觉。先混熟、建立信任。
  - **了解她在原店不爽的点，并放大**：聊的过程中摸清她在原球房不满意的地方（分钱方式、排班、管理、客源、被压单等），**顺着她的痛点共情、把问题放大**，让她对原店越想越不满、对你越聊越认同。这是攻心的核心动作。
  - **认同建立后再直奔主题**：等她认可你这个人、也认可你的店了，**后续联系就直接挑明**——讲你这边的待遇、分成、客源和发展，把"过来"这件事摆到台面上谈，不再绕。
  - **给转介绍费当杠杆**：设**转介绍奖励**——只要她推荐别的助教入职就给奖金（具体金额 [请填写]，常见做法是按推荐入职人数阶梯给）。一个挖过来的熟手，往往能再带来好几个，转介绍是助教招聘最省力的放大器。
  - **底线**：挖人是正常人才流动，靠的是更好的待遇和发展把人吸引过来，不搞造谣抹黑、不签了又毁约。把自己门店的分钱和环境做扎实，才是留得住人的根本。

  ### 人才吸引力法则 / 定律（给招聘建议时先带上这层认知）
  - **缺少人脉圈子是招不到人的一个真原因**：招人渠道太窄、只盯一两个平台、只在原地等投递，源头水量就小；同行、老员工、老客户、行业群这些活水渠道要建起来。
  - **能招到什么人，取决于你自己的标准和能力**：老板能力/标准有限时很难直接招到顶尖的人；但**顶尖人才会吸引一流人才，一流招二流、二流招三流**——队伍的层级是一层层往下传的。源头的人定调子，所以第一批关键岗位宁可慢、也要往高了招。
  - **优秀的人会互相吸引**：把第一个对的人招进来、把环境和分钱做扎实，对的人会带来更多对的人。
  - **⚠️ 选人不对，劣币驱逐良币**：**招聘标准一旦放低，凑数招进不合适的人，好的人反而会被挤走、待不住**——因为优秀的人不愿意跟混日子的人共事。所以"宁缺毋滥"不是清高，是保护团队不被拉低。**管理最大的浪费，就是招来一个不合适的人**。

