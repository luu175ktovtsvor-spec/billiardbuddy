key: "knowledge.management_recruitment"
name: "管理层招聘知识库"
category: "knowledge"
variables: []
description: |
  台球房管理层（店长、助教管理、教练、主管）的招聘方法论。
  核心：找到对的人（赛马机制），而不是自己干所有事。

template: |
  ## 管理层招聘核心规则

  ### 四个岗位及核心要求
  - 店长：销售能力+管理能力+赚钱欲望+执行力+数据分析
  - 助教管理：女生沟通能力+管理能力+赚钱欲望+执行力
  - 教练：台球技术达标+教学能力+客户维护+赛事组织
  - 主管：执行力+服务意识+团队协调

  ### 面试关键问题
  - 店长："你管理过多少人？上家月营业额多少做了什么提升？助教闹矛盾怎么处理？"
  - 助教管理："管过多少助教？上钟率低怎么处理？怎么激励助教？抢单怎么处理？"
  - 教练："球技档位？教过多少学员？怎么组织比赛？微信好友多少维护了多少客户？"

  ### 招聘渠道要点
  - BOSS直聘：岗位写"服务员/前台/台球教练"不写"助教"；薪资写"底薪+绩效+带薪培训"；主动搜索候选人
  - 抖音：发门店环境视频展示工作氛围，用合规岗位名
  - 朋友圈：发团队合照/培训花絮/工作日常，让现有员工转发

  ### 面试流程
  平台沟通 → 加微信 → 查朋友圈（判断形象和生活状态）→ 约到店面试 → 参观门店介绍工作和薪资 → 1-3天试岗

  ### 评估维度权重
  - 形象气质25% + 沟通能力25% + 赚钱欲望20% + 执行力15% + 行业经验10% + 球技5%
  - 核心原则：双向选择不降标准，宁缺毋滥，不合适及时止损

positions:
  store_manager:
    name: "店长"
    salary_range: "底薪[请填写]，综合[请填写]"
    requirements:
      - "销售能力：能带团队做业绩"
      - "管理能力：能管人、能解决问题"
      - "赚钱欲望：有目标感，想赚钱"
      - "执行力：说到做到，不拖延"
      - "数据分析能力：能看懂报表，能做决策"
    interview_questions:
      - question: "你之前管理过多少人的团队？"
        purpose: "了解管理经验"
      - question: "你上一家店的月营业额是多少？你做了什么来提升？"
        purpose: "了解业绩能力和数据意识"
      - question: "如果助教之间闹矛盾，你怎么处理？"
        purpose: "了解冲突解决能力"
      - question: "你觉得一个好店长最重要的是什么？"
        purpose: "了解管理理念"
      - question: "你为什么想来我们这里？"
        purpose: "了解动机和稳定性"

  assistant_manager:
    name: "助教管理"
    salary_range: "底薪[请填写]，综合[请填写]"
    requirements:
      - "女生沟通能力：能跟助教打成一片"
      - "管理能力：能安排任务、盯指标"
      - "赚钱欲望：有目标感"
      - "执行力：说到做到"
    interview_questions:
      - question: "你之前管过多少个助教？"
        purpose: "了解管理规模"
      - question: "助教上钟率低你怎么处理？"
        purpose: "了解问题解决能力"
      - question: "你怎么激励助教？"
        purpose: "了解激励方法"
      - question: "助教之间抢单你怎么处理？"
        purpose: "了解冲突解决能力"

  coach:
    name: "教练"
    salary_range: "底薪[请填写]，综合[请填写]"
    requirements:
      - "台球技术：至少[请填写]档"
      - "教学能力：能教新手入门"
      - "客户维护能力：能加微信、能组局"
      - "赛事组织能力：能策划和执行比赛"
    interview_questions:
      - question: "你的球技档位是多少？"
        purpose: "了解技术水平"
      - question: "你教过多少个学员？"
        purpose: "了解教学经验"
      - question: "你怎么组织一场比赛？"
        purpose: "了解赛事组织能力"
      - question: "你的微信好友有多少？维护了多少客户？"
        purpose: "了解客户维护能力"

recruitment_channels:
  boss:
    name: "BOSS直聘"
    tips:
      - "岗位写'服务员/前台/台球教练'，不写'助教'"
      - "薪资范围写'底薪+绩效+带薪培训'"
      - "福利标签勾选：包住、带薪培训、弹性工作"
      - "主动搜索候选人，不要只等投递"
  douyin:
    name: "抖音"
    tips:
      - "发布门店环境视频，展示工作氛围"
      - "评论区互动，引导私信"
      - "用'台球教练''服务员'等合规岗位名"
  wechat_moments:
    name: "朋友圈"
    tips:
      - "发团队合照、培训花絮、工作日常"
      - "配文'我们在招人，有兴趣的私信'"
      - "让现有员工转发"

interview_process:
  steps:
    - step: "平台沟通"
      details: "在BOSS等平台初步沟通，了解基本情况"
    - step: "加微信"
      details: "通过平台后加微信，进一步了解"
    - step: "查朋友圈"
      details: "看候选人朋友圈，判断形象和生活状态"
    - step: "约面试"
      details: "形象合格的约到店面试"
    - step: "到店面试"
      details: "带候选人参观门店，介绍工作内容和薪资"
    - step: "试岗"
      details: "面试通过的安排1-3天试岗"
  principles:
    - "双向选择，不降低标准求人来"
    - "是我招你，不是你招我"
    - "面试重点：形象、沟通能力、服务意识、对台球的兴趣"
    - "宁缺毋滥，不合适及时止损"

evaluation_dimensions:
  - dimension: "形象气质"
    weight: "25%"
  - dimension: "沟通能力"
    weight: "25%"
  - dimension: "赚钱欲望"
    weight: "20%"
  - dimension: "执行力"
    weight: "15%"
  - dimension: "行业经验"
    weight: "10%"
  - dimension: "球技水平"
    weight: "5%"
