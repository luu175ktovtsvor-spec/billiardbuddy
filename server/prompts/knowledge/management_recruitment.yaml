key: "knowledge.management_recruitment"
name: "管理层招聘知识库"
category: "knowledge"
variables: []
description: |
  台球房管理层（店长、助教管理、教练、主管）的招聘方法论。
  核心：找到对的人（赛马机制），而不是自己干所有事。

template: |
  ## 管理层招聘核心规则

  ### 四个岗位及核心要求
  - 店长：销售能力+管理能力+赚钱欲望+执行力+数据分析
  - 助教管理：女生沟通能力+管理能力+赚钱欲望+执行力
  - 教练：营销获客（把散客带上瘾、转成竞技客户、扩大竞技客户基数=核心第一位）+ 竞技技术指导/教学 + 客户维护 + 赛事组织
  - 主管：执行力+服务意识+团队协调

  ### 面试关键问题
  - 店长："你管理过多少人？上家月营业额多少做了什么提升？助教闹矛盾怎么处理？"
  - 助教管理："管过多少助教？上钟率低怎么处理？怎么激励助教？抢单怎么处理？"
  - 教练："球技档位？教过多少学员？怎么组织比赛？微信好友多少维护了多少客户？"

  ### 招聘渠道要点
  - 招聘平台：岗位写"服务员/前台/台球教练"不写"助教"；薪资写"底薪+绩效+带薪培训"；主动搜索候选人
  - 抖音：发门店环境视频展示工作氛围，用合规岗位名
  - 朋友圈：发团队合照/培训花絮/工作日常，让现有员工转发

  ### 面试流程
  平台沟通 → 加微信 → 查朋友圈（判断形象和生活状态）→ 约到店面试 → 参观门店介绍工作和薪资 → 1-3天试岗

  ### 评估维度权重
  - 形象气质25% + 沟通能力25% + 赚钱欲望20% + 执行力15% + 行业经验10% + 球技5%
  - 核心原则：双向选择不降标准，宁缺毋滥，不合适及时止损

  ### 识人：管理层"露馅"的五大特征（招进来/用人时盯这五条）
  招管理层最怕招到"看着能干、实际拎不动"的人。下面五种是真出问题前的早期信号，面试和试用期都要盯：
  1. **错把平台当能力**：把上家店/上个平台给的资源、流量、业绩，当成自己的本事；换个台子就打不出来——要追问"哪些是平台给的、哪些是你自己拿下的"。
  2. **崇拜权威**：开口闭口"某某大佬说""行业都这么干"，没有自己的判断；遇到具体问题答不出落地动作。
  3. **容易喊疼**：稍微加点任务、定点指标就叫苦喊累、讲条件；扛压能力差，带不动一线。
  4. **只说不做**：会上方案讲得漂亮，落地永远差一口气；承诺多、交付少，复盘时全是客观原因。
  5. **频繁跳槽**：履历上一年换好几家、没有一家做出结果——稳定性和结果交付都打问号。
  用法：这五条不是用来一票否决，而是用来设观察重点——命中越多，试用期越要盯紧定岗定责的落实。

  ### 抓执行：让管理层动起来的四招（盯、教、帮 + 定岗定责）
  招到人只是第一步，管理层躺平往往不是不会干、是没人盯。四招把执行抓起来：
  1. **盯**：设专人盯考勤与过程（如上下班水印相机露脸打卡、迟到当天交罚款），每时段按要求做好个人工作；纪律是执行的地基。
  2. **教**：思路不清的，店长手把手捋流程、教方法，让他能为门店提合理化建议，而不是干等指令。
  3. **帮**：责任心不强、卡住的环节，店长当场补位帮一把，把人带过坎，再逐步放手。
  4. **定岗定责**：每个管理岗的职责写死、上墙——谁管助教形象/直播/上课/推客/充值，谁管器材/赛事/订台订包，谁管商品/好评/盘账——岗位职责不清是一切躺平的根。
  落地心法：态度有了，业绩自然就有了——抓执行的本质是先把态度和习惯立起来。

  ### 助教招聘实战（线上发起 → 筛形象 → 约面 + 同业挖人）
  助教是门店的挣钱引擎，招得快、招得多、形象过关，比什么都重要。这一节讲的是真打仗的打法：主动出击、批量筛人、把精力花在能成的人身上。心态先摆正——**是我招你，不是你招我**，花最少的精力筛更多的人。

  #### 一、线上发起（招聘平台主动私信）
  - **主动出击，不等投递**：在招聘平台上主动搜候选人、主动发起聊天，靠等人投简历招助教太慢。把"打招呼"当成日常动作，每天定量发。
  - **非助教岗名义，别打标签**：线上一律**不提"助教"**两个字，岗位挂"台球助理教练"（或服务员/前台/台球教练）。原因有两个——一是助教岗在平台容易被限流/封号，二是直接打"助教"标签，很多本可以聊的人一看就划走了。**先把人聊到微信，再讲真实工作内容和收入**。
  - **发起时段挑活跃点**：经验上**晚上 11 点到凌晨 3 点**这个时段，目标人群在线、回复率明显高（夜生活作息和门店客群重合）；这个时间段主动发私信，效率比白天高。话术简短直接，例如"你好，有换工作的打算吗？我们这边在招台球助理教练，待遇不错"。
  - **回复就立刻要微信**：对方回"有"，第一时间引导"方便加个微信细聊吗"，把阵地从平台转到微信——平台聊多了容易被风控，微信里才好发照片、看朋友圈、约面试。
  - **没回的第二天再触达一次**：当天没回的，第二天上午统一再发一条跟进，触达过一轮还没反应的就放掉，不纠缠，把精力留给有回应的人。
  - **⚠️ 防封红线**：别在非助教岗位的对话里聊助教内容、别在助教岗对话里跟第三方谈业务——平台风控盯这些，踩了就封号，前面攒的资源全废。

  #### 二、筛形象（加微信 → 要照片 → 看朋友圈 → 约面）
  助教这行形象气质是硬指标，**线上就要把形象筛掉一大半**，别把不合适的人约到店里浪费双方时间。核心是"我主导、我筛选"的心态：
  - **主导聊天，直接要照片**：加上微信别绕弯子，主导节奏、直接说"方便发张生活照看下吗，我们这边对形象有要求"。要照片不是冒犯，是岗位需要，理直气壮地要。
  - **看朋友圈判断形象气质**：翻对方朋友圈——有没有露脸照片、整体气质、生活状态。**朋友圈一张本人照片都没有的，大概率形象不过关**，可以直接降优先级。这一步几乎不花成本，却能筛掉大半。
  - **形象合格直接约面试**：照片和朋友圈都过得去，**不废话、直接约到店面试**，别在微信里反复寒暄消耗。约面也是你定时间、你定地点，主动权在你手里。
  - **心法**：是我招你不是你招我；线上这一关就是个漏斗，目标是**用最少的精力把不合适的快速刷掉**，把到店名额留给真正可能成的人。形象不达标的及时止损，不勉强。

  #### 三、同业挖人（周边门店 → 私微交朋友 → 放大痛点 → 直奔主题）
  现成的熟手助教是最值钱的——上手快、自带客户。从周边门店挖人是一条稳路子，**视情况可以辐射到更大范围**。打法是慢热铺垫、再临门一脚：
  - **私人微信加，先交朋友**：用个人微信添加，**先正常聊天交朋友**，别一上来就挖人——突兀地谈跳槽容易把人聊死，也容易被原店察觉。先混熟、建立信任。
  - **了解她在原店不爽的点，并放大**：聊的过程中摸清她在原球房不满意的地方（分钱方式、排班、管理、客源、被压单等），**顺着她的痛点共情、把问题放大**，让她对原店越想越不满、对你越聊越认同。这是攻心的核心动作。
  - **认同建立后再直奔主题**：等她认可你这个人、也认可你的店了，**后续联系就直接挑明**——讲你这边的待遇、分成、客源和发展，把"过来"这件事摆到台面上谈，不再绕。
  - **给转介绍费当杠杆**：设**转介绍奖励**——只要她推荐别的助教入职就给奖金（具体金额 [请填写]，常见做法是按推荐入职人数阶梯给）。一个挖过来的熟手，往往能再带来好几个，转介绍是助教招聘最省力的放大器。
  - **底线**：挖人是正常人才流动，靠的是更好的待遇和发展把人吸引过来，不搞造谣抹黑、不签了又毁约。把自己门店的分钱和环境做扎实，才是留得住人的根本。

  ### 团队搭建心法 / 识人定律（给招聘建议时先带上这层认知，不只教发招聘信息）
  招人这事，大多数老板的卡点不在"发了多少招聘信息"，而在"想没想透要什么人、敢不敢动手筛人"。给门店做招聘/团队建议时，先把下面这层识人认知带进去——它决定了招聘动作有没有用。

  #### 一、招不到人，往往是这四个真原因（先对照自查，别急着怪平台没人）
  1. **不够痛**：根子上没把招人当头等大事——总觉得"现在凑合够用""等忙完这阵再招"，招人意愿不够强、不够痛，自然不会持续投精力。**招人是老板的一号工程，不是有空才做的事**。
  2. **面试数量不够**：见的人太少。招聘是个概率游戏，见 10 个人和见 100 个人，挑出对的人的概率完全不同——**没见够数量，就谈不上挑到对的人**。
  3. **没有人脉圈**：招人渠道太窄，只盯一两个平台、只在原地等投递；同行、老员工、老客户、行业群这些活水渠道都没建起来，源头水量就小。
  4. **不会识人**：见了人也看不准——分不清哪些是平台/资源给的、哪些是本人的真本事，被简历和话术带着走。识人能力（见上面"管理层露馅五大特征""助教筛形象"）是招聘的内功。

  #### 二、人才吸引力法则：你的标准决定你能招到什么层级的人
  - **能招到什么人，取决于你自己的标准和能力**：老板能力/标准有限时很难直接招到顶尖的人；但**顶尖人才会吸引一流人才，一流招二流、二流招三流**——队伍的层级是一层层往下传的。源头的人定调子，所以第一批关键岗位宁可慢、也要往高了招。
  - **优秀的人会互相吸引**：把第一个对的人招进来、把环境和分钱做扎实，对的人会带来更多对的人。
  - **⚠️ 选人不对，劣币驱逐良币**：**招聘标准一旦放低，凑数招进不合适的人，好的人反而会被挤走、待不住**——因为优秀的人不愿意跟混日子的人共事。所以"宁缺毋滥"不是清高，是保护团队不被拉低。**管理最大的浪费，就是招来一个不合适的人**。

  #### 三、一句心法：小店看招到谁、大店看敢不敢开掉谁
  - **小店（起步阶段）的成败，取决于招到了什么人**——人少，一个关键岗错了就能拖垮一摊，所以前期把识人和招聘做对是头等大事。
  - **大店（成熟阶段）的成败，取决于敢不敢开掉不合适的人**——盘子大了，留着一个躺平/不合适的管理层，损耗会沿着团队层层放大；该止损时不止损，比招错更伤。
  - 用法：给小店的建议重心放在"怎么招对第一批人"，给已成规模的店，要敢于点出"该不该换人"——别只教怎么发招聘信息，而是帮老板想清楚"现在最该解决的是招人、还是换人"。

positions:
  store_manager:
    name: "店长"
    salary_range: "底薪[请填写]，综合[请填写]"
    requirements:
      - "销售能力：能带团队做业绩"
      - "管理能力：能管人、能解决问题"
      - "赚钱欲望：有目标感，想赚钱"
      - "执行力：说到做到，不拖延"
      - "数据分析能力：能看懂报表，能做决策"
    interview_questions:
      - question: "你之前管理过多少人的团队？"
        purpose: "了解管理经验"
      - question: "你上一家店的月营业额是多少？你做了什么来提升？"
        purpose: "了解业绩能力和数据意识"
      - question: "如果助教之间闹矛盾，你怎么处理？"
        purpose: "了解冲突解决能力"
      - question: "你觉得一个好店长最重要的是什么？"
        purpose: "了解管理理念"
      - question: "你为什么想来我们这里？"
        purpose: "了解动机和稳定性"

  assistant_manager:
    name: "助教管理"
    salary_range: "底薪[请填写]，综合[请填写]"
    requirements:
      - "女生沟通能力：能跟助教打成一片"
      - "管理能力：能安排任务、盯指标"
      - "赚钱欲望：有目标感"
      - "执行力：说到做到"
    interview_questions:
      - question: "你之前管过多少个助教？"
        purpose: "了解管理规模"
      - question: "助教上钟率低你怎么处理？"
        purpose: "了解问题解决能力"
      - question: "你怎么激励助教？"
        purpose: "了解激励方法"
      - question: "助教之间抢单你怎么处理？"
        purpose: "了解冲突解决能力"

  coach:
    name: "教练"
    salary_range: "底薪[请填写]，综合[请填写]"
    requirements:
      - "营销获客能力（核心第一位）：能把只来玩两把的散客带上瘾、转成常来打竞技的客户，扩大球房竞技客户基数"
      - "提升散客娱乐性 + 竞技氛围打造：让普通客人觉得打球有意思、愿意往竞技玩法走"
      - "竞技技术指导：至少[请填写]档球技，能给竞技客户做针对性指导"
      - "教学能力：能教新手入门"
      - "客户维护与人情世故：能加微信、能组局、维护好客户关系"
      - "赛事组织能力：能策划和执行比赛"
    interview_questions:
      - question: "你怎么把只来玩两把的散客留成常来打竞技的客户？"
        purpose: "了解营销获客与竞技转化能力（教练核心）"
      - question: "你的球技档位是多少？"
        purpose: "了解技术水平"
      - question: "你教过多少个学员？"
        purpose: "了解教学经验"
      - question: "你怎么组织一场比赛？"
        purpose: "了解赛事组织能力"
      - question: "你的微信好友有多少？维护了多少客户？"
        purpose: "了解客户维护能力"

