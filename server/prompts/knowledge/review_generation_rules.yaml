key: "knowledge.review_generation_rules"
name: "好评文案生成规范"
category: "knowledge"
variables: []
description: |
  美团/抖音/大众点评好评文案的写法规范。
  核心要求：每一条文字表述有差异、多角度评价、15字以上、配3张图。

template: |
  ## 好评文案生成规范

  ### 通用原则
  - 每条文案必须差异化，不能同一模板改几个字
  - 评价角度轮换：今天重点提环境，明天重点提服务
  - 语气自然像真实客户，不过度夸张（避免"太棒了""绝了"）
  - 可提具体细节（"3号台球桌特别平"）增加真实感
  - 不提价格数字，不违反平台规则

  ### 美团规则
  - 每条文字表述有差异，15字以上，配3张不同角度图
  - 同账号隔天评价，验券后间隔20分钟再评价
  - 关闭定位、断开WiFi，打字速度正常
  - 差评当天回复+联系客服，每日最多10条

  ### 评价角度库（轮换使用）
  - 环境：球桌台面平/灯光不刺眼/休息区舒适
  - 服务：前台热情/茶水续杯/教练专业纠正姿势
  - 助教：专业陪练/态度好/教技巧（经同意）
  - 氛围：适合聚会/干净整洁/音乐音量刚好
  - 性价比：价格合理/团购划算/会员卡值

  ### 抖音/大众点评
  - 抖音：自然真实用户风格，配好看图片，带话题标签，每日最多5条
  - 大众点评：到店打卡后30分钟评价，3图+15字，每日最多5条

platforms:
  meituan:
    name: "美团"
    rules:
      - "每一条评论文字表述必须有差异，不能重复"
      - "多维度评价：环境、服务、球台、氛围、助教、饮品"
      - "文字15字以上"
      - "配3张图（不同角度）"
      - "同账号隔天评价，不要连续评价"
      - "验券后间隔20分钟再评价"
      - "差评当天回复+联系客服"
      - "每日最多10条"
      - "评价时关闭定位、断开WiFi"
      - "打字速度正常，不要太快（像机器）"
    angles:
      - angle: "环境"
        examples:
          - "球桌很新，台面很平，打起来手感好"
          - "灯光很舒服，不刺眼，打球氛围很好"
          - "休息区沙发很舒服，等位的时候不无聊"
      - angle: "服务"
        examples:
          - "前台很热情，一进门就有人接待"
          - "服务员很勤快，茶水随时续"
          - "教练很专业，帮我纠正了握杆姿势"
      - angle: "助教"
        examples:
          - "助教很专业，陪我练了1小时进步明显"
          - "助教态度很好，服务很到位"
          - "助教球技不错，教了我很多技巧"
      - angle: "氛围"
        examples:
          - "整体氛围很好，适合朋友聚会"
          - "环境干净整洁，打球很舒服"
          - "音乐音量刚好，不吵不闹"
      - angle: "性价比"
        examples:
          - "价格合理，体验很好，下次还来"
          - "团购很划算，环境和服务都超出预期"
          - "会员卡性价比高，经常来的话很值"
      - angle: "综合"
        examples:
          - "整体体验很好，环境干净，服务热情，球桌质量好"
          - "第一次来，感觉很不错，会推荐给朋友"
          - "来了好几次了，每次体验都很稳定"

  douyin:
    name: "抖音"
    rules:
      - "评价要自然，像真实用户写的"
      - "配图要好看，突出环境和服务"
      - "可以带话题标签"
      - "每日最多5条"
    examples:
      - "环境很好，球桌质量不错，服务也到位，推荐！#台球 #周末去哪玩"
      - "第一次来，环境超出预期，助教很专业，下次还来 #台球房"
      - "和朋友来的，氛围很好，球桌很新，打起来手感好 #休闲娱乐"

  dianping:
    name: "大众点评"
    rules:
      - "到店打卡→30分钟后评价"
      - "3图+15字"
      - "每日最多5条"
    examples:
      - "环境干净整洁，球桌质量好，服务热情，性价比高"
      - "第一次来体验很好，助教很专业，会再来"
      - "适合朋友聚会，氛围好，服务到位"

generation_principles:
  - "每条文案必须有差异化，不能用同一模板改几个字"
  - "角度要多样化：今天重点提环境，明天重点提服务"
  - "语气要自然，像真实客户写的，不要像广告"
  - "不要过度夸张（'太棒了''绝了'），要真实可信"
  - "可以提具体细节（'3号台的球桌特别平'），增加真实感"
  - "不要提价格数字（避免违反平台规则）"
