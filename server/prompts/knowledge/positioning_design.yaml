template: |
  # 球房定位设计与品牌传播

  ## 一、定位是什么——给客户一个"买我不买隔壁"的理由

  定位的本质：**给客户一个买我们、不买隔壁的理由**。说人话——客户为什么放着旁边那家不去，专门来你这？答不上来，就是没定位。

  定位不是你觉得自己有多好，而是**在客户脑子里占住一个词**。一栋楼里常常挤着好几家球房（楼上一家、楼下一家很常见），客户进哪家，往往就靠脑子里那个一闪而过的印象：
  - "那家便宜实在"——占了**性价比**
  - "那家环境好、适合带朋友"——占了**氛围**
  - "那家高手多、能打比赛"——占了**竞技**
  - "那家助教贴心、新手不尴尬"——占了**助教/陪练**
  - "那家好找搭子、不冷场"——占了**搭子/社交**

  这一个词，就是你的定位。**定位清晰，工作才好往下展开**——文案、活动、门头、招人、训练全都围着这个词转；定位不清，干啥都是散的。

  > 真实案例量级（参考，不照搬）：有门店把定位理顺、对外口号打出去后，几个月里月营收能成倍往上走（从月 8 万级别一路爬到 26 万级别都出现过）。靠的不是降价，是让客户脑子里清楚"来这家是为了啥"。

  ## 二、怎么找自己的定位——扒竞品 → 找空位 → 提炼优势词

  定位是**针对竞争对手**定的，不是关起门来自己想。三步走：

  ### 第 1 步：扒同城/同商圈竞品占了哪些词
  把方圆几公里、尤其同一栋楼/同一条街的球房都列出来，逐个看：
  - 它主打什么？（便宜？高端？比赛多？助教多？）
  - 门头、抖音、美团详情页上反复说的是哪个词？
  - 客户提起它第一反应是什么？

  ### 第 2 步：找别人没占住的需求位（空位）
  客户的需求位就那么几个：性价比、氛围、竞技、助教、搭子、新手友好。**别人占满的别硬挤**（人家"便宜"已经深入人心，你再喊便宜是给人抬轿），去找**还没人牢牢占住、而你又真能做到**的那一格。

  常见空位思路：
  - 周围都拼价格 → 你做**氛围/环境/服务体验**，主打"打球舒服、带朋友有面子"
  - 周围都是老炮高手扎堆、新手不敢进 → 你做**新手友好/不尴尬**，"小白来了有人带"
  - 周围没人正经做陪练 → 你做**贴心助教/陪练**，把助教服务做成招牌
  - 周围一个人来没意思 → 你做**搭子/社交**，"来这不愁没人陪打"

  ### 第 3 步：提炼成一个自己的优势词
  从空位里挑一个**你真做得到、且能持续做强**的，焊成你的核心词。四类球房常见定位方向（按业态自己对号）：
  - **社区球房**：图近、图便宜、图随时能来——偏**性价比 + 街坊熟人氛围**
  - **竞技商业球房**：又能比赛又能社交、客流大——偏**竞技 + 搭子/氛围**双轮
  - **竞技球房**：高手扎堆、赛事密、台子讲究——偏**竞技/专业**
  - **商业球房**：环境/品质/服务为卖点、客流大但不主打竞技——偏**氛围/体验/社交**

  ## 三、怎么写高感知差异化口号（slogan）

  优势词找到了，要变成一句**客户一听就懂、还能自己复述给别人**的话。这就是 slogan。

  口号三条标准：
  1. **差异化**——一句话点出你和隔壁的区别，别说放之四海皆准的废话（"专业台球俱乐部"谁都能说，等于没说）。
  2. **高感知**——客户一听就 get 到"对我有啥用"，不用解释。
  3. **可重复**——短、顺口、好记，客户能脱口而出帮你传。

  推荐句式：**"找[核心需求]，来[店名]"** 或 **"[核心人群痛点]就来[店名]"**——把你的优势词和门店名焊在一起，让客户想到这个需求就想到你。

  剥名范例（替换 XX 为门店名，按自己定位选一句，别贪多）：
  - 主打搭子+性价比：**"找搭子，抢台费，来 XX"**
  - 主打新手友好：**"新手不尴尬，就来 XX"**
  - 主打贴心陪练：**"找贴心助教，就来 XX"**
  - 主打氛围社交：**"约球约人约氛围，就来 XX"**
  - 主打竞技：**"想打比赛找高手，就来 XX"**

  写口号时的硬规矩：
  - **不写绝对化广告词**——"全城最低""第一""最好"这类违规，平台会限流也会被举报；用"实在""贴心""不尴尬"这种可感知的词替代。
  - 数字（台费、优惠）用 [请填写] 让门店自己定，别在口号里写死价格。
  - 一家店**只主打一句**，别又喊便宜又喊高端又喊比赛——什么都说等于什么都没说。

  ## 四、品牌传播三部曲

  定位和口号有了，**传播**才是把它种进客户脑子的过程。三步，缺一不可：

  ### ① 差异化——先想清楚"和竞争对手的区别"
  传播的内容内核，就是你比隔壁强在哪一格。没有差异化，传得再勤也只是噪音。这一步在前面"找定位"已经定下来了，传播时所有素材都咬住它。

  ### ② 重复性——重复传播，频繁抢占顾客心智
  心智是抢出来的，不是说一次就占住的。**同一句口号、同一个卖点，在所有触点上反复出现**，让客户在同城范围内一次次刷到你，刷到记住为止。怕的不是重复，怕的是这条说性价比、那条说高端，自己把自己的定位冲散。

  ### ③ 高感知——一句话 slogan 收口
  最终所有传播都收敛到那一句高感知 slogan 上。客户记不住你的活动细节，但能记住那一句话——这句话就是你在他脑子里的"占位符"。

  ## 五、口号怎么在各渠道重复曝光，抢同城心智

  一句 slogan 定下来后，**所有对外触点统一用它、反复用它**，形成同城轰炸：

  - **门头/灯箱/店内主视觉**：最大那行字就是这句 slogan，进店第一眼就看到、记住。这是曝光频次最高、最便宜的广告位。
  - **抖音（同城）**：每条视频的标题/口播结尾/封面字，都带这句口号或它的卖点；POI 定位挂门店，专吃同城流量，重复刷脸抢本地客户心智。
  - **美团/点评**：店铺名后缀、门店简介首句、团购标题，统一用这句定位词，让搜索/逛店的客户一眼对上号。
  - **朋友圈/社群**：员工和老板朋友圈、客户群公告的固定话术尾巴带上口号；活动海报角落固定放这句 slogan。
  - **客户口口相传**：口号顺口好记，客户帮你转述时不变形——这是最值钱的免费传播，前提是那句话足够短、足够戳。

  核心心法：**一个定位、一句口号、所有渠道、反复曝光**。不是每个渠道想一句新词，而是同一句话砸到客户记住为止——重复，才是抢心智的真功夫。
