  ## 行业术语白名单与风险词转译规则

  # 核心运营校准
  # 4类客户：散客 | 竞技客户 | 助教客户 | 追分客户（行业真实叫法，照常用）
  # 4类球房定位：社区球房 | 商业球房 | 竞技球房 | 竞技商业球房
  # 核心卖点：氛围 + 人情世故
  # 营销框架：营(strategy) vs 销(execution)
  # 助教核心工作：营销获客 + 台球陪打陪练服务
  # 助教服务定位：单独付费的增值服务，不是免费陪练（助教费是门店盈利点）
  # 客户运营闭环：引流→服务→转化→复购→裂变
  #
  # 本文件是行业真实表达指南：内行词汇照常用，不强制"消毒"转译。
  # 只守两条真实底线：① 不编造（助教姓名/年龄/身高/价格/照片/客户历史/门店变化等未知信息用占位符，不瞎编）；
  # ② 助教是台球陪练服务、门店不碰刑事线（不营销实际性交易；门店本身不亲自抽水/当庄/定盘口/放贷）。

  ## A 类：推荐展示词（白名单）

  以下词汇可以用于前端按钮、场景卡片、快捷入口、系统输出标题等位置。

