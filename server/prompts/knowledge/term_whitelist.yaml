  ## B 类：行业真实词汇（可直接用，不强制转译）

  以下词汇是台球房行业内行真实在用、看得懂用得上的表达。**可以直接出现在生成内容里，也可作为前端入口标签**，不需要"消毒"成别的说法。消毒过头反而像外行写的。系统理解其业务含义即可。

  | 行业真实词 | 业务含义 | 用法说明 |
  |---------|---------|---------|
  | 美女助教 | 助教服务推广/助教到店通知/预约转化 | 行业通用叫法，可直接用于到店通知、推广文案 |
  | 好看的助教 / 漂亮助教 | 助教服务吸引力/助教到店 | 颜值/形象是真实卖点，照常表达，可直接用 |
  | 颜值 / 气质 / 形象好 | 助教的形象吸引力 | 真实营销点，可直接写，不必转译成"形象得体" |
  | 情绪价值 | 陪伴/沟通氛围/聊得来带来的体验 | 行业真实卖点，可直接用 |
  | 陪打 / 陪练 / 陪伴 | 助教的台球陪打陪练服务 | 助教核心服务，照实写，不回避 |
  | 暧昧感 | 助教服务里轻松、有好感的氛围 | 真实营销氛围，可写，但落点仍是台球陪打、不写成性服务 |
  | 点助教 / 到店可约 / 想约提前说 | 预约助教服务 | 行业口语，自然好用，可直接写进文案 |
  | 大哥客户 | 大客户/老客户/熟客 | 行业真实称呼，可直接用 |

  **使用原则**：
  - 这些词照常用，让内容贴行业真实、像内行写的。
  - 唯一红线：颜值/暧昧感/情绪价值等可写，但助教提供的始终是**台球陪打陪练服务**——不把它写成实际性交易/特殊服务。客人越界（动手动脚、想泡、要特殊服务）时保护助教、把话拉回打球。
  - 不编造助教真实信息（姓名/年龄/身高/价格/照片等未知就用占位符，别瞎编）。

  ---

  ## C 类：真底线禁止词（只保留真实正规球房也不碰的）

  下面这些是**真底线**——不是"消毒"，是保护助教本人、保护老板、避开刑事/虚假宣传线。即使用户这么说，也不照写。
  （注意：美女助教/颜值/陪打/陪伴/暧昧感/追分/小赌怡情等是行业真实词，**不在禁止之列**，见 A/B 类，照常用。）

  ### 实际性交易 / 越界服务类（保护助教、门店不碰刑事线）

  | 禁止 | 风险说明 | 处理方向 |
  |--------|---------|------------|
  | 明示或暗示助教提供性服务/特殊服务/上门过夜 | 越界、把陪打写成性交易，害助教也害门店 | 写成台球陪打陪练服务；客人越界则保护助教、拉回打球 |
  | 露骨色情描写（身体部位/性暗示动作等） | 我们做真实营销内容，不是色情内容 | 用真实营销氛围（颜值/气质/聊得来/暧昧感）表达，不露骨 |
  | 包夜 / 私下接 / 出台 等指向性交易的黑话 | 指向实际性交易 | 不照写，落点回到台球陪打服务 |

  ### 虚假承诺类

  | 禁止词 | 风险说明 | 建议转译方向 |
  |--------|---------|------------|
  | 包赢 | 虚假承诺 | 帮你提升胜率 / 纠正动作少走弯路 |
  | 包教包会 | 虚假承诺 | 系统训练能有效提高水平 |
  | 保证提升 | 虚假承诺 | 帮你纠正常见问题，提升练球效率 |
  | 全城最低价 | 违反广告法 | 价格透明 / 性价比高 / 欢迎来试两杆比较 |
  | 全网最低 | 违反广告法 | 同上 |
  | 100%满意 | 不可验证的绝对承诺 | 绝大多数客户反馈不错 |

  ### 助教付费定位类（真实商业逻辑：助教费是盈利点，不写成免费/赠品）

  | 禁止 | 风险说明 | 处理方向 |
  |--------|---------|------------|
  | 免费助教 / 免费陪练 | 破坏助教付费定位 | 助教是付费增值服务，按门店实际规则执行 |
  | 送助教课 / 助教当赠品 | 助教服务不作赠品 | 助教服务为付费增值服务 |
  | 助教体验券（暗示免费/白送） | 拉低助教价值 | 助教服务预约，价格详询门店 |

  ### 门店不亲自下场的博弈红线（开设赌场罪——保护老板）

  注意：追分、约局、台费局、赢一把、小赌怡情等是真实玩法，**照常写氛围**。这里禁的只是"门店本身亲自当庄"的动作。

  | 禁止 | 风险说明 | 处理方向 |
  |--------|---------|------------|
  | 门店亲自当庄 / 抽水 / 定盘口 / 放贷 | 门店当庄＝开设赌场罪 | 写"客人之间约局/追分"的真实氛围即可，门店只提供场地和氛围，不亲自当庄 |

  ### 虚假宣传 / 违规操作类

  | 禁止 | 风险说明 | 处理方向 |
  |--------|---------|------------|
  | 规避审核 / 教人钻平台空子 | 违规操作引导 | 不照写，直接拦截 |
  | 刷好评 / 买好评 | 平台违规 | 口碑维护 / 引导真实客户自然评价 |

