  ## B→A 转译映射（19 条示例）

  | # | 用户口语 | 系统理解 | 推荐输出 |
  |---|---------|----------|----------|
  | 1 | 美女助教到了 | 助教到店通知 / 助教预约转化 | 今日助教到店，想约助教服务的朋友可以提前说 |
  | 2 | 点助教 | 预约助教服务 | 想约助教可以提前告诉我，我帮你看时间 |
  | 3 | 好看的助教 | 助教服务吸引力 | 今日助教可约，服务自然，适合轻松打两把 |
  | 4 | 大哥客户好久没来了 | 大客户/老客户流失预警 | 好久没见您来打球了，最近忙什么呢？有空回来打两把 |
  | 5 | 今天助教到了，帮我发朋友圈 | 助教到店通知 + 朋友圈推广 | 今日助教到店，想练球或想找助教服务的朋友可以滴滴我 |
  | 6 | 新来的助教挺漂亮 | 新助教到店 / 服务吸引力 | 新助教到店，助教服务可约。想约的朋友提前说 |
  | 7 | 老客户三个月没来了，怎么约 | 老客户唤醒 | 好久没见你来了，最近忙啥呢？有空回来打两把，找找手感 |
  | 8 | 帮我写助教短视频，要有吸引力但别擦边 | 助教短视频获客 / 合规约束 | 输出台球技术展示/教学片段/门店氛围类配文，不涉及擦边内容 |
  | 9 | 店里新来了几个美女助教 | 新助教批量到店 / 助教推广 | 新助教到店，助教服务可约。想了解助教服务的朋友欢迎到店体验 |
  | 10 | 帮我想想怎么推助教 | 助教服务推广 | 输出助教服务推广方案：门店层品牌介绍+助教管理账号朋友圈+助教个人号内容 |
  | 11 | 客户问有没有好看的助教 | 客户咨询助教服务 | 我们店有助教服务可以预约。想看哪位助教方便，我帮你确认时间 |
  | 12 | 给我写个招助教的文案，要有吸引力 | 助教招聘 | 输出合规岗位描述：形象得体、沟通自然、服务意识好，不设身高年龄门槛 |
  | 13 | 客户想约助教但嫌贵 | 价格敏感型客户 / 助教预约转化 | 助教服务是按课时收费的增值服务，具体价格可以到店了解。很多客户体验后觉得挺值的 |
  | 14 | 帮我在群里说今天助教都在 | 群公告 / 助教可约通知 | 今日助教可约，想打球或想找助教服务的朋友滴滴我，帮你看时间 |
  | 15 | 下雨天没人，推一下助教 | 空台促活 + 助教推广 | 下雨天窝家里不如来打两局。助教可约，一个人来也不尴尬 |
  | 16 | 老客带新客来，新客对助教感兴趣 | 转介绍 + 助教服务介绍 | 感谢带朋友来！对助教服务感兴趣的话，可以让朋友了解一下，想约随时说 |
  | 17 | 有人说我们助教不好看 | 口碑维护 / 差评应对 | 助教服务重在服务体验和沟通自然。不同助教风格不同，可以帮您推荐适合的 |
  | 18 | 月底了助教业绩不够，想办法推一下 | 助教业绩冲刺 / 助教推广 | 月底冲刺，助教可约。想练球、想找助教服务的朋友抓紧时间预约 |
  | 19 | 隔壁球房的助教比我家的多 | 竞对压力 / 助教招聘+推广 | 输出助教招聘文案 + 现有助教服务推广内容，不贬低竞对 |

  ---

  ## 转译执行原则

  ### 不直接复述原则

  即使用户输入包含 B 类或 C 类词汇，生成内容中也不得直接复述这些词汇。必须替换为 A 类对应表达。

  ### 意图保留原则

  转译改变的是表达方式，不是业务需求。用户想推助教就要帮推助教，只是用专业的方式推。

  ### 降级不明说原则

  当用户输入包含 C 类禁止词汇时，系统不回复"您的输入包含违规内容"，而是默认以 A 类表达完成生成，用行动示范专业做法。

  ### 前端静默转译原则

  前端快捷场景和示例中，默认使用 A 类词汇。不在前端 UI 中展示"这个词不能说/那个词被替换了"的提示，用户无感知转译。
