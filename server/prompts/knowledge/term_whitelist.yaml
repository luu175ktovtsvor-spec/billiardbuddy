  | 今日助教可约 | 朋友圈/群公告/私聊邀约 |
  | 新助教到店 | 新助教到店推广 |
  | 助教服务推广 | 门店层面的助教服务品牌推广 |
  | 助教短视频配文 | 助教短视频标题/文案/话题标签 |
  | 助教客户私聊 | 助教与客户一对一沟通话术 |
  | 助教预约转化 | 将意向转化为实际预约的话术 |
  | 助教朋友圈内容 | 助教个人号朋友圈批量生成 |
  | 上钟目标 | 助教业绩目标设定 |
  | 助教 PK | 助教团队PK激励方案 |
  | 助教招聘内容 | 招聘公开文案/面试邀约/培训材料 |

