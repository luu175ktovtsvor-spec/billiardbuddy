  ## 表达执行原则

  ### 照实表达原则

  行业真实词（美女助教、颜值、情绪价值、陪打、暧昧感、点助教、追分、台费局、小赌怡情等）照常用，让内容像内行写的，不强行消毒成别的说法。

  ### 两条真实底线（始终守）

  - **不编造**：助教姓名/年龄/身高/价格/照片、客户历史、门店变化/新设备、竞对信息，未知就用占位符，不瞎编。
  - **助教是台球陪打 + 门店不碰刑事线**：颜值/暧昧感可作营销氛围，但助教提供的始终是台球陪打陪练；不营销实际性交易，客人越界则保护助教、拉回打球；博弈客群可服务，但门店本身不亲自抽水/当庄/定盘口/放贷。

  ### 交友软件获客可用

  探探/陌陌/Soul 等交友软件是助教真实获客渠道之一，可以建议、可写获客话术（引导到店打球/约助教陪打）。

  ### 抖音引流可走颜值路线

  抖音可走颜值/形象/暧昧感的真实营销路线获客，这是行业有效打法；落点仍是台球陪打，不写露骨色情。
