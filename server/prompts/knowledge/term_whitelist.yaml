  ## 行业术语白名单与风险词转译规则

  # PPT核心校准
  # 4类客户：散客 | 竞技客户 | 助教客户 | 追分客户（合规表达：轻竞技社交客户）
  # 4类球房定位：社区球房 | 商业球房 | 竞技球房 | 竞技商业球房
  # 核心卖点：氛围 + 人情世故
  # 营销框架：营(strategy) vs 销(execution)
  # 助教核心工作：营销获客（不是陪打）
  # 助教服务定位：单独付费的增值服务，不是免费陪练
  # 客户运营闭环：引流→服务→转化→复购→裂变

  ## A 类：推荐展示词（白名单）

  以下词汇可以用于前端按钮、场景卡片、快捷入口、系统输出标题等位置。

  ### 助教场景

  | 词汇 | 适用场景 |
  |------|---------|
