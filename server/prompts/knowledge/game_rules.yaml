  ## 台球玩法规则知识库

  本知识库收录球房常见玩法规则，供 AI 生成活动文案、玩法说明时参考。

  **详细规则请参考：** `knowledge.billiards_game_rules`

  ---

  ## 玩法运营要点补充

  以下为各玩法的运营细节建议，供活动策划参考：

  ### 抢一大战运营要点
  - 报名费一般10-20元，奖金200-500元
  - 可设让球机制增加偶然性（让条件），让新手也有机会
  - 赛前提前预热宣传，比赛当天教练主持
  - 使用普通台球桌即可，不限制桌型

  ### 台费局运营要点
  - 需提前约定台费由谁承担的规则
  - 避免变成赌博，台费为门店正常收费标准
  - 教练可在旁裁判，同时推荐贵宾区体验

  ### 饮料局运营要点
  - 饮料指定门店在售品类
  - 金额不大，重在氛围
  - 可搭配小推车促销，现场点单

  ### 小奖品挑战运营要点
  - 奖品以可乐、功能饮料、台费卡等低成本高感知为主
  - 挑战难度分层：3颗可乐、5颗功能饮料、7颗以上台费卡
  - 教练主持，增加互动感
  - 避免难度过高导致无人参与

  ### 搭子局运营要点
  - 匹配时注意水平接近，避免差距过大
  - 教练/助教可在场协调氛围
  - 适合在社群中宣传"找搭子"概念
  - 是重要的客户转化入口：搭子→常客→会员

  ---

  **完整规则详见：** `knowledge.billiards_game_rules`
