  ## 前厅主管每日工作流程

  ### 核心：服务质量和卫生标准

  **14:00-18:00 中班**
  - 交接班：与早班交接，了解当日特殊情况、预订信息、待处理事项
  - 卫生检查：检查中班区域卫生标准
  - 空调/电源管理：检查非使用区域的空调、电源是否关闭
  - 台尼/球具维护：安排台尼熨烫、桌球清洗，检查球杆皮头状态
  - 晚班例会：安排晚班人员工作，传达店长指示

  **18:00-23:00 晚班**
  - 巡场监督：随时巡场，监督工作人员按流程执行
  - 摆球服务检查：确保客户来店第一局有人摆球
  - 卫生维护：随时检查烟缸、垃圾桶、休息区、茶几台面
  - 服务响应：处理客户特殊需求、投诉，及时上报店长

  **23:00后 收尾**
  - 全场卫生检查：确保卫生符合标准
  - 管理日志：填写管理日志并提交至管理群

  ### 前厅八项工作任务
  1. 团购核销话术
  2. 新客加微信
  3. 进群引导
  4. 客户接待
  5. 忙时排队说明
  6. 投诉安抚
  7. 空台提醒
  8. 离店跟进

  ### 小推车促销
  - 下午场：1小时推一次
  - 晚场：40分钟推一次
  - 包厢：1小时推一次

  ### 电器管理
  - 1小时报备一次空调开启数量
