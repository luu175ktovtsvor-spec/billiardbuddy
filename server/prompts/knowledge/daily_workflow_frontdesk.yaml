key: "knowledge.daily_workflow_frontdesk"
name: "前厅每日工作流程"
description: |
  前厅主管从14点中班到23点后收尾的整天流程（交接班、卫生检查、空调电源管理、台尼熨烫球具维护、巡场监督、摆球服务、投诉处理），核心是服务质量和卫生标准；含前厅八项任务（团购核销/加微/进群/接待/排队/安抚/空台提醒/离店跟进）、小推车促销节奏、果盘服务、电器报备、前厅日报模板、客离3分钟复位SOP、对讲机话术规范。
  老板/前厅问"前厅一天该干嘛/服务卫生标准/客离怎么复位/对讲机怎么说/前厅日报"时调它。
category: "knowledge"
variables:
  - store_name
template: |
  ## 前厅主管每日工作流程

  ### 核心：服务质量和卫生标准

  **14:00-18:00 中班**
  - 交接班：与早班交接，了解当日特殊情况、预订信息、待处理事项
  - 卫生检查：检查中班区域卫生标准
  - 空调/电源管理：检查非使用区域的空调、电源是否关闭
  - 台尼/球具维护：安排台尼熨烫、桌球清洗，检查球杆皮头状态
  - 晚班例会：安排晚班人员工作，传达店长指示

  **18:00-23:00 晚班**
  - 巡场监督：随时巡场，监督工作人员按流程执行
  - 摆球服务检查：确保客户来店第一局有人摆球
  - 卫生维护：随时检查烟缸、垃圾桶、休息区、茶几台面
  - 服务响应：处理客户特殊需求、投诉，及时上报店长

  **23:00后 收尾**
  - 全场卫生检查：确保卫生符合标准
  - 管理日志：填写管理日志并提交至管理群

  ### 前厅八项工作任务
  1. 团购核销话术
  2. 新客加微信
  3. 进群引导
  4. 客户接待
  5. 忙时排队说明
  6. 投诉安抚
  7. 空台提醒
  8. 离店跟进

  ### 小推车促销
  - 下午场：1小时推一次
  - 晚场：40分钟推一次
  - 包厢：1小时推一次

  ### 服务体验动作（量化）
  - 果盘服务：下午时段送 2 份（造氛围、提客情）
  - 全员朋友圈：服务员每人每日 ≥1 条
  - 台呢熨烫、桌球清洗、桌腿清扫：每日按区域排查记录

  ### 电器管理
  - 1小时报备一次空调开启数量

  ### 前厅主管日报模板

  {store_name} · 前厅日报 · [日期]

  一、今日数据
  团购核销：[请填写]单
  加微信数：[请填写]人
  商品销售：[请填写]元
  好评数：[请填写]条（抖音[请填写]/美团[请填写]）
  客诉数：[请填写]件

  二、服务问题
  - [今日发生的服务问题/投诉/特殊情况]

  三、卫生检查
  - [检查结果：合格/需整改项]

  四、明日计划
  - [明天重点要做的事]

  ### 客离复位SOP

  客户离开后3分钟内完成以下步骤：

  1. 清台面：擦干净球台台面，清除巧克粉痕迹
  2. 归位球杆：球杆按规格摆放（大头杆左侧、冲杆右侧、小头杆第二排，左高右低）
  3. 检查设备：集球器是否正常、台面有无破损
  4. 补充耗材：巧克粉、架杆、烟灰缸
  5. 检查遗留物品：如有客户遗留物品，立即交前台保管
  6. 通知收银：对讲机通知收银台"X号台复位完毕"

  ### 对讲机话术规范

  - 频道统一5频道
  - 说话前按住按键1-2秒
  - 简洁、明确、不喊名字（用编号）、不聊私事
  - 标准话术：
    - 试机："试机，收到请讲"
    - 客离报备："X号台客人离场"
    - 摆球回应："收到，马上到"
    - 开灯确认："X号台开灯"
    - 关灯确认："X号台关灯"
