  ## 球房合同与法律基础

  球房经营涉及多种合同和法律文件，以下是核心要点。

  ### 一、助教合作协议核心条款

  #### 合同期限
  - 有效期一般为 1 年，合同期满提前一个月书面续约
  - 薪酬条款须与门店实际制度一致：行业主流为七天筛选制（按实际业绩结算、不设保底）；若门店采用保底方案（如试用期前两个月保底），需在合同中写明保底金额与满勤条件，二者不可混用

  #### 工作内容
  - 指导学员掌握台球技巧，维护球房秩序
  - 协助教练进行教学计划制定和实施
  - 负责维护教学场所整洁和安全
  - 协助组织学员参加比赛和活动
  - 向客人营销球房商品及一卡通充值

  #### 工作时间
  - 一般为 13:00—24:00（根据实际营业时间调整）
  - 每月休息 4 天，周末（五、六、日）除外

  #### 报酬结构
  - 保底报酬：根据级别不同（初级/中级/高级/星级），保底金额不同
  - 浮动报酬：按实际课时计算，每小时报酬根据级别递增
  - 完成月度课时任务可享受全额保底

  #### 工作纪律
  - 工作时间严禁与内部人员以外客人免费打球
  - 严禁向客人索要任何财物
  - 工作时间严禁以任何理由与客人外出
  - 迟到赔偿：10 分钟内 50 元，60 分钟内 100 元
  - 旷工赔偿：每天 500 元，三次以上视为自动离职

  #### 安全责任
  - 员工应如实告知健康状况
  - 遵守服务规则，不做超出工作内容的服务
  - 非工作场所引发的人身安全由员工自行承担

  #### 肖像权
  - 员工自愿按要求拍摄宣传素材
  - 球房有权将作品用于各项业务及宣传活动

  #### 竞业禁止
  - 合同期内不得在其他球房从事相同或类似工作
  - 合同期满后不得劝诱、聘用球房其他员工
  - 违反竞业禁止需赔偿违约金

  #### 保密条款
  - 不得泄露球房商业秘密、客户信息
  - 合同期满后仍需遵守保密义务

  #### 违约责任
  - 任何一方违反合同规定需承担违约责任
  - 员工提前解除合同需提前一个月书面通知

  ### 二、招聘平台合规要点

  #### 严禁事项
  - 岗位描述不能出现「陪」字及其变体（陪练、陪同打球、陪伴客户）
  - 不能问外貌相关问题（身材、生活照、身高体重）
  - 不能提情商、酒量等与陪酒相关的词

  #### 合规写法
  - 正确名称：台球教练、台球指导员、台球课程顾问
  - 工作内容：提供台球基础动作指导和规则讲解、组织小型友谊赛
  - 薪资设置：市场中位值上浮 15%，不要写过高薪资
