key: "knowledge.competitive_group_ops"
name: "竞技群运营知识库"
category: "knowledge"
variables: []
description: |
  教练维护竞技群的日常运营知识。
  竞技群是教练的核心工作阵地，目标是让竞技客户持续到店、参与赛事、带朋友来打球。
  核心逻辑：氛围+人情世故。教练营造的是竞技氛围和球友圈子的人情味。

template: |
  ## 竞技群运营核心规则

  ### 每日节奏
  - 上午时段 早安互动+约球召集（昨天赛事回顾、今日空台情况）
  - 下午时段 技术讨论+新人欢迎（引导新人报档位+区域+时间偏好）
  - 晚间时段 晚间约球+赛事播报+活动预告（扣1约球、实时比分）
  - 打烊后 今日总结（几桌约球成功、明天继续）
  - 具体钟点排程由门店按客流节奏把握

  ### 赛事周期
  - 赛前：赛事通知（时间/赛制/报名费/冠军奖金）+ 倒计时预热
  - 临赛：提醒参赛者提前到热身，告知抽签时间
  - 比赛当天：赛前热身召集 → 每轮实时播报 → 决赛预告吸引围观
  - 赛后：完整战报（冠亚军+比分+精彩瞬间）+ 下次赛事预告

  ### 博弈氛围照实表达（追分客=四大客群之一，图输赢刺激）
  - 追分客户图的就是输赢刺激：台费局（谁输谁掏台费）、追分局、约局，照实说，不用避讳改名。
  - 门店活=把氛围搞热、撮势均力敌的对手约局，让一桌带活一片。
  - 🔴 门店底线（守住即可）：门店只赚台费/助教费，绝不亲自当庄/定盘口/抽水/放贷（=开设赌场罪）。
  - 帮控金额：彩头由客人自定，但教练/店长盯着别越追越大炸店，过线时出面压一压、拆小局，既护客人防上头巨亏、又把门店从风险里摘出。

  ### 频率
  - 保持群活跃，工作日有日常互动、周末和赛事期间加密，具体频率节奏由门店把握
  - 比赛日：赛前预热→赛中播报→赛后战报，每轮战报及时发
  - 回复群友要及时，记住常来球友的档位和偏好

  ### 禁忌
  - 不偏袒选手、不发不准确赛程、不发无关内容干扰比赛
  - 不贬低对手、不发广告、不@全体（除非紧急赛事通知）
  - 🔴 门店不亲自当庄/定盘口/抽水/放贷（开设赌场罪）；追分氛围照实带，但金额要帮客人控住别炸店

daily_operations:
  morning:
    time: "上午时段"
    actions:
      - action: "早安互动"
        details: "在群里发一条早安消息或昨日赛事回顾，保持群存在感"
        example: "昨天周赛决赛打得真精彩，@张三 那杆翻袋太绝了"
      - action: "约球召集"
        details: "发今日约球召集，说明时间段和空台情况"
        example: "今天下午2-6点有空台，想练球的群里喊一声，我帮你们配对"

  afternoon:
    time: "下午时段"
    actions:
      - action: "技术讨论"
        details: "发一个台球技术话题或训练方法，引导群友讨论"
        example: "今天练了一下中袋发力，发现手腕放松效果好很多，大家有什么心得？"
      - action: "新人欢迎"
        details: "有新人进群时主动欢迎，引导自我介绍（档位+区域+时间偏好）"
        example: "欢迎新朋友！先报个到：档位+一般什么时间有空，方便大家约球"

  evening:
    time: "晚间时段"
    actions:
      - action: "晚间约球"
        details: "发晚间约球召集，营造紧迫感"
        example: "今晚8点有人约吗？3号台空着，来的扣1"
      - action: "赛事播报"
        details: "有比赛时实时播报比分和精彩瞬间"
        example: "【战报】半决赛：张三 5:3 李四，张三那杆清台太漂亮了"
      - action: "活动预告"
        details: "预告近期赛事或活动"
        example: "本周六下午2点有抢一大战，报名费10元，冠军奖金[请填写]，想参加的群里报名"

  closing:
    time: "打烊后"
    actions:
      - action: "今日总结"
        details: "简短总结今日群内活动或赛事结果"
        example: "今天3桌约球成功，感谢各位捧场，明天继续"

weekly_rhythm:
  weekday:
    focus: "日常约球+技术交流"
    frequency: "保持日常互动，频率由门店把握"
  weekend:
    focus: "赛事活动+约球高峰"
    frequency: "加密互动，频率由门店把握"
  match_day:
    focus: "赛事全流程"
    frequency: "赛前预热→赛中播报→赛后战报"

match_cycle:
  pre_match:
    - action: "赛事预告"
      details: "在群内发布赛事通知，说明时间、赛制、报名方式"
      example: "【赛事通知】{store_name} 周赛 时间：本周六14:00 赛制：单败淘汰抢5 报名费：[请填写] 冠军奖金：[请填写] 报名方式：群里扣'报名+姓名+档位'"
    - action: "倒计时提醒"
      details: "赛前定期提醒倒计时，营造紧迫感（频率由门店把握）"
  near_match:
    - action: "赛前提醒"
      details: "提醒参赛者比赛时间和注意事项"
      example: "明天下午2点开打，各位记得提前到热身。抽签1:30开始，别迟到"
  match_day:
    - action: "赛前热身"
      details: "比赛当天上午发赛前热身召集"
    - action: "实时播报"
      details: "每轮比赛结束后立即播报比分和精彩瞬间"
    - action: "决赛预告"
      details: "决赛前发预告，吸引围观"
  after_match:
    - action: "赛后战报"
      details: "比赛结束后发完整战报，包含比分、精彩瞬间、下次赛事预告"
      example: "【战报】{store_name} 周赛 冠军：张三 亚军：李四 决赛比分：7:5 精彩瞬间：张三第6局一杆清台，全场最佳 下周赛事预告：月赛，奖金升级，敬请期待"
    - action: "精彩回放"
      details: "如有视频回放，在群内分享"

inactive_period:
  problem: "非赛事期间群容易冷场"
  solutions:
    - solution: "约球召集"
      details: "每天固定时间发约球召集，保持群活跃"
    - solution: "技术话题"
      details: "发台球技术讨论话题，引导群友互动"
    - solution: "小游戏预告"
      details: "预告店内小游戏活动，吸引到店"
    - solution: "老照片/老视频"
      details: "分享往期赛事精彩瞬间，唤起回忆"
    - solution: "群友风采"
      details: "分享群友的精彩进球或进步，增强归属感"

dos:
  - "赛程/规则信息必须准确清晰"
  - "每轮战报及时播报，附比分和亮点"
  - "赛事期间营造紧张氛围"
  - "非赛事期间发约球/训练信息保持活跃"
  - "新人进群主动欢迎并引导自我介绍"
  - "回复群友消息要及时"
  - "记住常来的球友的档位和偏好"

donts:
  - "不发布不准确的赛程信息"
  - "不偏袒任何参赛选手"
  - "赛事期间不发无关内容干扰"
  - "🔴 门店不亲自当庄/定盘口/抽水/放贷（开设赌场罪）——彩头是客人自己的事，门店只赚台费/助教费"
  - "不贬低对手或使用侮辱性语言"
  - "不在群里发广告或推销内容"
  - "不艾特全体打扰（除非紧急赛事通知）"
  - "追分氛围照实带，但金额帮客人控住别越追越大炸店（教练/店长过线时出面压一压、拆小局）"

gaming_atmosphere:
  - "台费局 → 谁输谁掏台费，照实说，是追分客最常见的玩法"
  - "追分局/约局 → 旗鼓相当的两人约一局，图输赢刺激，门店帮撮对手、搭台造势"
  - "门店赚的是场子钱（台费/助教费/商品），彩头大小由客人自定、门店不参与不抽水"
  - "帮控金额：彩头别越追越大，教练/店长盯着，过线出面压一压、拆小局，护客人也护门店"
  - "撮合水平相近的对手约局，让一桌热闹带活整片区开台"

new_member_integration:
  description: "如何引导刚从散客转化来的新手在竞技群找到归属感"
  steps:
    - step: "入群欢迎"
      action: "教练在群里简单介绍，不暴露新手身份"
      example: "欢迎新球友@XXX，以后约球可以群里喊"
    - step: "首次约球"
      action: "教练主动撮合一个水平相近的老成员陪打"
      example: "@XXX @YYY 你俩水平差不多，约一局？"
    - step: "低门槛约局邀请"
      action: "邀请参加低门槛约局/台费局，不要一上来就推正式比赛"
      example: "下周有个台费局，谁输谁掏台费、图个热闹，来不来？"
    - step: "技术指导"
      action: "教练给一点简单的技术建议，让新手感受到被关注"
      example: "你发力有点大，试试七分力，走位会好很多"
    - step: "逐步升级"
      action: "从约球→轻竞技→正式比赛，循序渐进"
      note: "不要急着推比赛，先让新手在群里找到朋友和归属感"
