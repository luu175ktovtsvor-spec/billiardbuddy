key: "knowledge.competitive_group_ops"
name: "竞技群运营知识库"
category: "knowledge"
variables:
  - store_name
description: |
  教练维护竞技群的日常运营知识。
  竞技群是教练的核心工作阵地，目标是让竞技客户持续到店、参与赛事、带朋友来打球。
  核心逻辑：氛围+人情世故。教练营造的是竞技氛围和球友圈子的人情味。

template: |
  ## 竞技群运营核心规则

  ### 每日节奏
  - 11:00-14:00 早安互动+约球召集（昨天赛事回顾、今日空台情况）
  - 14:00-18:00 技术讨论+新人欢迎（引导新人报档位+区域+时间偏好）
  - 18:00-23:00 晚间约球+赛事播报+活动预告（扣1约球、实时比分）
  - 23:00后 今日总结（几桌约球成功、明天继续）

  ### 赛事周期
  - 赛前3天：赛事通知（时间/赛制/报名费/冠军奖金）+ 每日倒计时
  - 赛前1天：提醒参赛者提前到热身，抽签时间
  - 比赛当天：赛前热身召集 → 每轮实时播报 → 决赛预告吸引围观
  - 赛后：完整战报（冠亚军+比分+精彩瞬间）+ 下次赛事预告

  ### 安全表达（禁止赌博相关词汇）
  - 用"台费局"代替赌球（输的人付台费）
  - 用"饮料局"代替金钱博弈
  - 用"小奖品挑战"（门店提供台费券/饮料/小礼品）
  - 用"搭子局"撮合水平相近的客户
  - 禁止：追分、赌球、下注、金钱输赢

  ### 频率
  - 工作日每天2-3条，周末每天3-5条
  - 比赛日：赛前预热→赛中播报→赛后战报，每轮战报及时发
  - 回复群友不超过2小时，记住常来球友的档位和偏好

  ### 禁忌
  - 不偏袒选手、不发不准确赛程、不发无关内容干扰比赛
  - 不谈赌博、不贬低对手、不发广告、不@全体（除非紧急赛事通知）

daily_operations:
  morning:
    time: "11:00-14:00"
    actions:
      - action: "早安互动"
        details: "在群里发一条早安消息或昨日赛事回顾，保持群存在感"
        example: "昨天周赛决赛打得真精彩，@张三 那杆翻袋太绝了"
      - action: "约球召集"
        details: "发今日约球召集，说明时间段和空台情况"
        example: "今天下午2-6点有空台，想练球的群里喊一声，我帮你们配对"

  afternoon:
    time: "14:00-18:00"
    actions:
      - action: "技术讨论"
        details: "发一个台球技术话题或训练方法，引导群友讨论"
        example: "今天练了一下中袋发力，发现手腕放松效果好很多，大家有什么心得？"
      - action: "新人欢迎"
        details: "有新人进群时主动欢迎，引导自我介绍（档位+区域+时间偏好）"
        example: "欢迎新朋友！先报个到：档位+一般什么时间有空，方便大家约球"

  evening:
    time: "18:00-23:00"
    actions:
      - action: "晚间约球"
        details: "发晚间约球召集，营造紧迫感"
        example: "今晚8点有人约吗？3号台空着，来的扣1"
      - action: "赛事播报"
        details: "有比赛时实时播报比分和精彩瞬间"
        example: "【战报】半决赛：张三 5:3 李四，张三那杆清台太漂亮了"
      - action: "活动预告"
        details: "预告近期赛事或活动"
        example: "本周六下午2点有抢一大战，报名费10元，冠军奖金[请填写]，想参加的群里报名"

  closing:
    time: "23:00以后"
    actions:
      - action: "今日总结"
        details: "简短总结今日群内活动或赛事结果"
        example: "今天3桌约球成功，感谢各位捧场，明天继续"

weekly_rhythm:
  weekday:
    focus: "日常约球+技术交流"
    frequency: "每天2-3条"
  weekend:
    focus: "赛事活动+约球高峰"
    frequency: "每天3-5条"
  match_day:
    focus: "赛事全流程"
    frequency: "赛前预热→赛中播报→赛后战报"

match_cycle:
  before_3_days:
    - action: "赛事预告"
      details: "在群内发布赛事通知，说明时间、赛制、报名方式"
      example: "【赛事通知】{store_name} 周赛 时间：本周六14:00 赛制：单败淘汰抢5 报名费：[请填写] 冠军奖金：[请填写] 报名方式：群里扣'报名+姓名+档位'"
    - action: "倒计时提醒"
      details: "每天提醒一次倒计时，营造紧迫感"
  before_1_day:
    - action: "赛前提醒"
      details: "提醒参赛者比赛时间和注意事项"
      example: "明天下午2点开打，各位记得提前到热身。抽签1:30开始，别迟到"
  match_day:
    - action: "赛前热身"
      details: "比赛当天上午发赛前热身召集"
    - action: "实时播报"
      details: "每轮比赛结束后立即播报比分和精彩瞬间"
    - action: "决赛预告"
      details: "决赛前发预告，吸引围观"
  after_match:
    - action: "赛后战报"
      details: "比赛结束后发完整战报，包含比分、精彩瞬间、下次赛事预告"
      example: "【战报】{store_name} 周赛 冠军：张三 亚军：李四 决赛比分：7:5 精彩瞬间：张三第6局一杆清台，全场最佳 下周赛事预告：月赛，奖金升级，敬请期待"
    - action: "精彩回放"
      details: "如有视频回放，在群内分享"

inactive_period:
  problem: "非赛事期间群容易冷场"
  solutions:
    - solution: "约球召集"
      details: "每天固定时间发约球召集，保持群活跃"
    - solution: "技术话题"
      details: "发台球技术讨论话题，引导群友互动"
    - solution: "小游戏预告"
      details: "预告店内小游戏活动，吸引到店"
    - solution: "老照片/老视频"
      details: "分享往期赛事精彩瞬间，唤起回忆"
    - solution: "群友风采"
      details: "分享群友的精彩进球或进步，增强归属感"

dos:
  - "赛程/规则信息必须准确清晰"
  - "每轮战报及时播报，附比分和亮点"
  - "赛事期间营造紧张氛围"
  - "非赛事期间发约球/训练信息保持活跃"
  - "新人进群主动欢迎并引导自我介绍"
  - "回复群友消息要及时，不超过2小时"
  - "记住常来的球友的档位和偏好"

donts:
  - "不发布不准确的赛程信息"
  - "不偏袒任何参赛选手"
  - "赛事期间不发无关内容干扰"
  - "不谈赌博、不搞追分、不涉及金钱输赢"
  - "不贬低对手或使用侮辱性语言"
  - "不在群里发广告或推销内容"
  - "不艾特全体打扰（除非紧急赛事通知）"
  - "不使用'追分''赌球''下注'等词汇，用'台费局''饮料局''小奖品挑战'替代"

safe_expressions:
  - "台费局 → 输的人付台费（金额=一小时台费，不是大额金钱）"
  - "饮料局 → 输的人请喝饮料"
  - "小奖品挑战 → 奖品为门店提供的小奖品（台费券/饮料/小礼品）"
  - "熟人切磋 → 朋友之间的技术交流"
  - "搭子局 → 撮合水平相近的客户一起打球"
  - "轻竞技 → 强调社交和娱乐，不是金钱博弈"
