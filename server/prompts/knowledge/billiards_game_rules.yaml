description: |
  球房常用的台球玩法名词:引流/社交特色玩法(抢一大战、台费局、饮料局、奖品挑战、熟人切磋、搭子局)+ 正式比赛名目(中式八球、中式九球、斯诺克)。老板要设计活动玩法、写玩法推荐/活动文案、想用低门槛玩法破冰引流时用它(玩法一律以社交娱乐为导向、不涉赌博)。
