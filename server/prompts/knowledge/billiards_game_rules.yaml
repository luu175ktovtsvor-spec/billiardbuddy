  ## 台球玩法规则知识库

  # PPT核心校准
  # 追分 → 合规表达：轻竞技社交 / 中式九球
  # 不涉及赌博内容，所有玩法以社交和娱乐为导向

  本知识库收录球房常见的台球玩法规则，包括6种特色玩法和正式比赛规则，供生成玩法推荐、活动文案、游戏指导时参考。

  ---

  ### 一、抢一大战

  快节奏淘汰赛。两人单局对决，赢者晋级，输者淘汰。适合引流活动和晚场活跃气氛。

  规则要点：
  - 单局淘汰制，1局定胜负
  - 可设让球规则增加趣味性
  - 适合淘汰赛、擂台赛形式

  适合场景：晚场活跃氛围、小型活动引流、新手破冰活动

  ---

  ### 二、台费局

  两人对战1局中式八球，输者承担双方台费。适合日常引流。

  规则要点：
  - 赢家台费免单
  - 输家承担当局台费
  - 可擂台制守擂

  ---

  ### 三、饮料局

  输者请赢者一杯指定饮品（5-15元范围）。玩法轻松，社交属性强，适合新客引流和破冰。

  ---

  ### 四、小奖品挑战赛

  挑战打进指定球洞或完成指定路线即可赢得奖品（饮品、小礼品、充值卡等）。适合开业引流和晚场活动。

  ---

  ### 五、熟人切磋

  常客之间的友谊对局，以练球和交流为主，不涉及赌注。适合维护老客户关系和日常约球。

  ---

  ### 六、搭子局

  由球房或社群组织搭配水平相近的球友组局对抗，主打社交属性。新人有伴不孤单，是重要的客户转化入口。

  ---

  ### 中式八球规则

  - 使用1-15号球，1-7号为全色球，9-15号为花色球，8号为黑8
  - 开球后进球决定双方球组
  - 先打完本组球再打8号球者获胜
  - 误击8号球入袋、犯规打进8号、提前打进8号均判负
  - 母球摔袋给对方自由球

  ---

  ### 中式九球（轻竞技社交玩法）

  3人轮流击球，按号码顺序击打1-9号球，各种进球形式计分：
  - 大金（开球清台）：14分
  - 小金：7分
  - 普胜：4分
  - 犯规让对方获得自由球

  合规说明：此玩法为轻竞技社交活动，不涉及赌博。球数可调整：4球/6球/7球/9球玩法。

  ---

  ### 九球规则

  按1-9号顺序击打，9号落袋即赢。自由球、犯规送球等保护规则。

  ---

  ### 斯诺克基本规则

  - 22颗球（15红6彩1白），红球1分，彩球黄2绿3棕4蓝5粉6黑7
  - 先打红球再打彩球循环交替，红球不归位，彩球打进后归位
  - 一杆最高可147分（15红+15黑+彩球清彩）
  - 犯规罚4分起，或根据犯规对象加罚

  ---

  ### 抽牌玩法

  三人抽牌，根据扑克牌对应球号，每个玩家守自己号码。相同号码可为共同目标球。适合4人趣味玩法。

  ---

  ### 摸牌玩法

  15张扑克对应15球号。玩家按抽牌号击对应号球进洞。4人玩法更有趣味性，入门门槛低。

  ---

  ## 6种玩法对照表

  | 玩法 | 人数 | 门槛 | 属性 | 推荐场景 |
  |------|------|------|------|---------|
  | 抢一大战 | 2/多人 | 低 | 竞技+趣味 | 活动引流、淘汰赛 |
  | 台费局 | 2 | 低 | 轻竞技 | 日常对决、擂台赛 |
  | 饮料局 | 2/4 | 很低 | 社交 | 新客交互、轻松玩法 |
  | 奖品挑战 | 1+ | 中 | 趣味 | 营销引流 |
  | 搭子局 | 2-6 | 低 | 社交 | 匹配陌生人、社群运营 |
  | 熟人切磋 | 2-4 | 任意 | 社交 | 老客维护、日常约球 |
