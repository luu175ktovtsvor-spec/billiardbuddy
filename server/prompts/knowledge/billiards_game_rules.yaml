template: |
  ## 台球玩法规则知识库

  # 核心运营校准
  # 追分 → 合规表达：轻竞技社交 / 中式九球
  # 不涉及赌博内容，所有玩法以社交和娱乐为导向

  本知识库收录球房常见的台球玩法名目，供生成玩法推荐、活动文案时参考。

  ---

  ### 一、抢一大战

  快节奏淘汰对决，赢者晋级、输者淘汰，可设让球规则增加趣味性。适合引流活动和晚场活跃气氛、新手破冰。

  ---

  ### 二、台费局

  两人对战中式八球，输者承担台费、赢家免单，可擂台制守擂。适合日常引流。

  ---

  ### 三、饮料局

  输者请赢者一杯指定饮品。玩法轻松，社交属性强，适合新客引流和破冰。

  ---

  ### 四、小奖品挑战赛

  挑战打进指定球洞或完成指定路线即可赢得奖品（饮品、小礼品、台费券等）。适合开业引流和晚场活动。

  ---

  ### 五、熟人切磋

  常客之间的友谊对局，以练球和交流为主，不涉及赌注。适合维护老客户关系和日常约球。

  ---

  ### 六、搭子局

  由球房或社群组织搭配水平相近的球友组局对抗，主打社交属性。新人有伴不孤单，是重要的客户转化入口。

  ---

  ### 正式比赛名目

  店内可承接的正式赛事玩法：中式八球、中式九球（轻竞技社交表达）、斯诺克。这些为通行竞技项目，作为活动和会员赛的载体，以社交娱乐为导向、不涉及赌博。
