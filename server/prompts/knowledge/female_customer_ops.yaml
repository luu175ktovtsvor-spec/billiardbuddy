template: |
  ## 女性客群差异化运营知识库

  > 台球房女性客户近年增长（行业大盘女性占比约一成），但多数门店仍沿用男性视角做内容和接待。
  > 本知识库供 AI 生成面向女性客群的文案、活动方案、话术时参考。核心定性来自行业认知：**女性客户更关注环境与服务**（男性更偏好竞技性与异性情绪价值）。下面的细化做法是基于这一定性的参考建议，不是硬规则，读场合灵活用。

  ---

  ### 一、核心定性：女性更看重环境与服务（参考）

  - 女性对环境的感知更细腻：灯光、卫生间、空气、座位区是否整洁舒适；进店前看过照片，实际和图片出入大容易劝退
  - 接待上更看重"被尊重"而不是"被搭讪"：礼貌有距离、不长时间站台边看；不主动要助教时不硬推
  - 社交体验、拍照出片往往比技术提升更是来店动机——先让她们玩起来、拍起来，打球是背景
  - 以上为参考方向，门店按实际客群和场合调整

  ---

  ### 二、写文案时的视角切换（参考）

  - 语气更轻松、温暖、有画面感，少用"决战/碾压/对决"这类硬核竞技词，多用"一起来试试""第一次打也没关系"等低门槛表达
  - 卖点偏向氛围舒适、好出片、新手友好、闺蜜一起来，而不只是球台好、高手多
  - 不要写"女生也能打台球"（在强调女性打球是例外）；不要以"美女"作卖点描述女性顾客

  ---

  ### 三、注意边界

  - 女性向运营是"差异化服务"，不是"专门歧视"——有些女性就是来打竞技的，读场合，不要套公式
  - 助教服务面向所有客群，不能因为是女性客户就默认不推助教，但推的时机和方式要自然
  - 不编造数字：「女生场增长50%」这类数据除非门店自己有，否则不说
  - 边界：描述女性【顾客】时不物化她们的外貌身材（她们对这类话题更敏感、会劝退）；不暗示"来认识男生"等社交暗示。注意这只约束对女性顾客的描述，不约束【助教】颜值/形象/气质的真实营销表达（助教的形象是真实卖点，照常写，见行业术语白名单）
