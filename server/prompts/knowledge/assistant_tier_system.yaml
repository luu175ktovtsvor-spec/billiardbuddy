template: |
  ## 助教等级体系知识库

  # 核心运营校准
  # 助教靠营销获客把人约来、靠陪打时长把钱挣到，两者一条链不是对立：
  #   营销决定有没有客，陪打时长决定挣多少（陪打时长是店长考核第一指标、薪资提成全按上钟/陪打时长算）
  # 助教服务定位：单独付费的增值服务，不是免费陪练

  本知识库收录台球房助教等级体系的骨架口径（以行业真实运营资料在册的为准），供 AI 生成助教管理方案、晋升指导时参考。具体球技分级线、保底/提成/课时等薪酬数字因城市差异大、非标准，一律由门店自定，AI 生成时用 [请填写] 占位、不编造。

  ---

  ### 一、助教分级与球技门槛

  - 助教按台球技术分级（行业资料只写"台球技术不低于四档"作为门槛基线），具体逐级量化球技线由门店按自家水平拍板，不写死。
  - 分级要把"球技要到什么水平、对应什么服务收费"说清楚，但**核心不是越能赢客人越好**——球技达标即可，助教核心是营销获客与情绪价值，不是只会打球。

  ---

  ### 二、用人与保底口径（重要，生成薪资/招聘方案时必须遵守）

  - **七天筛选制（行业主流）**：新助教入职七天内按实际业绩结算、不设保底，七天内筛选出能留任的人。
  - **开业前招聘只有补助、没有保底**。
  - 是否在七天筛选制之外另设"保底留人方案"由门店自定，同一方案中不可混用两种口径。
  - AI 生成薪资/招聘方案时，所有金额一律用 [请填写] 占位、不照搬任何参考数字。

  ---

  ### 三、入职培训（七维）

  新助教入职培训围绕这几个维度展开（行业资料在册）：

  - 球技
  - 形象
  - 服务
  - 拓客
  - 约客
  - 维客
  - 技巧

  具体每天的课程编排、考核分值由门店按七天筛选期自定，不写死。

  ---

  ### 四、助教月业绩奖励档（参考值·门店自定）

  > 这是行业真实运营资料在册的奖励档（硬规则），数值为参考、因城市差异大门店自定：

  | 当月总业绩 | 奖励 |
  |------|------|
  | 超过 170 小时 | 500 元 |
  | 超过 200 小时 | 1000 元 |
  | 超过 230 小时 | 1500 元 |

  - 陪打时长是店长考核第一指标、薪资提成全按上钟/陪打时长算。
  - PK 系数（陪打时长第一名奖励）：日 ×0.2 / 周 ×0.3 / 月 ×0.5（每月最后一天除外）——详见 PK 激励知识库。
