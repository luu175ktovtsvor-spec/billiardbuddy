  ## 助教等级体系知识库

  # 核心运营校准
  # 助教靠营销获客把人约来、靠陪打时长把钱挣到，两者一条链不是对立：
  #   营销决定有没有客，陪打时长决定挣多少（陪打时长是店长考核第一指标、薪资提成全按上钟/陪打时长算）
  # 助教服务定位：单独付费的增值服务，不是免费陪练

  本知识库收录台球房助教等级体系的完整规则，包括等级划分标准、各等级要求、升降级规则、考核周期、薪酬体系等，供AI生成助教管理方案、薪酬计算、晋升指导时参考。

  ---

  ### 一、助教等级划分

  #### 等级体系

  注：以下课时费和保底工资为参考数据，实际金额因城市和门店差异较大，AI生成薪资方案时具体数字应使用[请填写]占位。

  | 等级 | 排序 | 球技标准 | 服务收费 | 月最低课时 | 保底工资 | 保底期限 |
  |------|------|----------|----------|-----------|----------|----------|
  | 实习助教 | 1 | 达到初级标准方可上岗 | 带薪培训100元/天 | - | - | 培训期15-20天 |
  | 初级助教 | 2 | 5分点10进3，蛇彩3颗一杆清 | 50-68元/小时（参考数据，因城市差异大），提50元/小时 | 100小时/月 | 4500元/月 | 无责2个月 |
  | 中级助教 | 3 | 5分点10进5，蛇彩5颗一杆清 | 68-88元/小时（参考数据，因城市差异大），提60元/小时 | 120小时/月 | 5500元/月 | 无责2个月 |
  | 高级助教 | 4 | 5分点10进7，蛇彩7颗一杆清 | 78-108元/小时（参考数据，因城市差异大），提70元/小时 | 140小时/月 | 6500元/月 | 无责2个月 |
  | 特级助教 | 5 | 5分点10进9，蛇彩9颗按顺序一杆清 | 88元/小时（参考数据，因城市差异大），提80元/小时 | 160小时/月 | 7500元/月 | 无责2个月 |

  **蛇彩说明：**
  - 初级/中级/高级：不按顺序不限袋一杆清台
  - 特级：按顺序不限袋一杆清台

  ---

  ### 二、各等级详细要求

  #### 实习助教

  **入职条件：**
  - 面试通过后进入培训期
  - 培训期限15-20天

  **培训内容：**
  1. 专业理论知识
  2. 技能培训（按球技训练SOP执行）
  3. 心理建设
  4. 自我保护意识
  5. 服务理念
  6. 赋能培训
  7. 目标及方向
  8. 晋升及成就

  **特殊规定：**
  - 实习助教不参与正式接客，除非客户点名指定上钟
  - 必须专心练球，培训服务意识，学习规则内容
  - 上钟时需跟客户说明是实习情况
  - 培训期未通过考核并未做满一个月且未提前申请离职的，不予发放培训工资
  - 达到培训期后不能上岗酌情处理
  - 培训期未达到正式上岗条件并工作一个月以上，不予发放培训期工资

  **转正标准：**
  - 达到初级助教球技考核标准
  - 通过服务意识和服务流程考核
  - 由主管和助教管理共同评估

  ---

  **保底口径说明（重要，生成薪资/招聘方案时必须遵守）：**
  - 行业主流为七天筛选制：新助教入职七天内按实际业绩结算、不设保底，七天内筛选出能留任的人；开业前招聘只有补助、没有保底
  - 下文各等级的"保底工资、无责2个月"是部分成熟门店的可选留人方案，与七天筛选制二选一，门店须明确采用哪一种，同一方案中不可混用两种口径

  #### 初级助教

  **球技标准：**
  - 5分点10进3
  - 蛇彩3颗球不按顺序不限袋一杆清台

  **业绩标准：**
  - 月课时最低100小时
  - 服务收费50-68元/小时（参考数据，因城市差异大），提成50元/小时
  - 保底工资4500元/月，无责2个月

  **日常要求：**
  - 每日上钟不得低于规定时长
  - 每天练球时间按训练计划执行
  - 每日新增客户微信不低于规定数量
  - 参加每日例会

  ---

  #### 中级助教

  **球技标准：**
  - 5分点10进5
  - 蛇彩5颗球不按顺序不限袋一杆清台

  **业绩标准：**
  - 月课时最低120小时
  - 服务收费68-88元/小时（参考数据，因城市差异大），提成60元/小时
  - 保底工资5500元/月，无责2个月

  **附加要求：**
  - 能独立接待和陪打
  - 具备基本客户维护能力
  - 能配合门店活动宣传

  ---

  #### 高级助教

  **球技标准：**
  - 5分点10进7
  - 蛇彩7颗球不按顺序不限袋一杆清台

  **业绩标准：**
  - 月课时最低140小时
  - 服务收费78-108元/小时（参考数据，因城市差异大），提成70元/小时
  - 保底工资6500元/月，无责2个月

  **附加要求：**
  - 具备较强客户维护和拓客能力
  - 能协助培训新助教
  - 能参与门店营销活动执行

  ---

  #### 特级助教

  **球技标准：**
  - 5分点10进9
  - 蛇彩9颗球按顺序不限袋一杆清台

  **业绩标准：**
  - 月课时最低160小时
  - 服务收费88元/小时（参考数据，因城市差异大），提成80元/小时
  - 保底工资7500元/月，无责2个月

  **特殊要求：**
  - 必须在高级助教基础上连续两个月业绩达到特级助教业绩标准方可申请晋级
  - 具备优秀的客户维护和拓客能力
  - 能独立组织门店营销活动
  - 能担任助教培训讲师

  ---

  ### 三、晋升制度

  **基本条件：**
  1. 本等级连续两个月业绩考核达标（或跨越两个等级业绩可只需一个月）
  2. 遵守俱乐部助教部日常管理规范
  3. 积极配合店内宣传、培训等工作

  **晋升流程：**
  1. 符合基本条件的助教，在当月选择一天进行球技考核
  2. 球技考核每人三次机会
  3. 考核通过后，次日起正式提升助教等级
  4. 修改收费标准和展示推荐位
  5. 球技考核由本俱乐部教练或助教管理现场拍摄

  **重要规则：**
  - 晋级只能一级一级往上升，不能跨等级（保底期除外）
  - 保底期内不参与降级考核

  ---

  ### 四、降级制度

  **降级条件：**
  - 本等级业绩不达标

  **降级规则：**
  - 晋级需双向考核（球技+业绩）
  - 降级后下次晋级只考核业绩，不考核球技
  - 保底期内不参与降级考核

  **原球房等级过来本公司：**
  - 面试当天考核本等级球技
  - 考核通过 → 直接按照正常晋升制度执行
  - 考核不通过 → 保留原等级一个月
  - 一个月内随时找助教管理重新考核
  - 一个月仍不通过 → 下月降级

  ---

  ### 五、考核周期

  - **球技考核：** 晋升时进行，每月可申请1次
  - **业绩考核：** 每月1次，月底统计当月课时和业绩
  - **综合考核：** 每月1次，包含球技、业绩、服务态度、纪律遵守
  - **保底期考核：** 保底期内只考核服务态度和纪律，不考核业绩

  ---

  ### 六、薪酬与奖励

  #### 保底工资说明

  - 保底期内除正常公休外有请假（丧假婚假除外）或违反日常工作规范者不给保底工资，按业绩发放
  - 保底期2个月，从正式上岗之日起计算

  #### 奖励制度

  | 项目 | 奖励标准 |
  |------|----------|
  | 球杆销售提成 | 10% |
  | 充值台费卡提成 | 10000元以下提3%，10000元以上部分提5%（单笔满 [请填写] 元起提，门店定） |
  | 月总业绩第一 | 红包奖励500元 |
  | 月加班第一（30小时以上） | 红包奖励500元 |
  | 月总业绩第二 | 奖励300元 |
  | 月总业绩第三 | 奖励200元 |
  | 介绍助教正式入职满2个月 | 奖励1000元 |

  ---

  ### 七、日常工作规范

  #### 工作时间

  - 上班时间：14:00-23:00
  - 14:00上班前群内发每日上班及每日目标
  - 23:00下班后发每日总结

  **每日上班目标格式：**
  ```
  XX号XX等级XX名已上班
  今日目标XX分钟
  ```

  **每日下班总结格式：**
  ```
  XX号XX等级XX名已下班
  今日完成XX分钟
  今日加班XX小时
  今日新客+V：XX个
  今日预定桌台：XX个
  今日充值XX元
  本月总计XX分钟，加班XX小时，本月新客+VXX个，本月预定桌台XX个，充值XX元
  本月公休XX天，病假XX天，事假XX天
  ```

  #### 上钟/下钟报备

  - 上钟（及时翻牌）群里报备格式：xx号上xx号桌
  - 下钟（及时翻牌）群里报备格式：xx号下xx号桌（方便及时安排）

  #### 迎宾规定

  - 迎宾意义：让每位助教与顾客接触认识，提升业绩
  - 认真接待每位顾客，做好自荐工作
  - 摆好球后再回到迎宾岗位
  - 迎宾需要离岗必须亲自交接至下一位
  - 门迎无交接、玩手机、不带客：罚款50元

  ---

  ### 八、助教红线（严重违纪）

  以下行为一经发现开除处理，并取消发放当月工资：

  1. 拒钟，强制下钟
  2. 背后勾心斗角，辱骂脏话
  3. 顾客不知情情况下私自挂钟扣卡
  4. 不可引导顾客去别的台球俱乐部
  5. 禁止店内员工之间恋爱
  6. 禁止私自收取客户的打赏
  7. 禁止私自售卖店内的品牌器材

  ---

  ### 九、罚款规定

  | 违规行为 | 罚款金额 |
  |----------|----------|
  | 未按仪容仪表标准上岗 | 50元/次 |
  | 忘记翻牌或恶意动牌 | 50元/次 |
  | 与客人或同事争吵打骂 | 200元/次，严重者开除 |
  | 斯诺克操作不规范 | 100元/次 |
  | 包厢/小台/斯诺克忘记收拾 | 200元/次 |
  | 上钟时间大厅抽烟/叼烟打球/巡场 | 500元/次 |
  | 工作时间打游戏/看剧/刷抖音/睡觉 | 200元/次 |
  | 茶几卫生不合格/烟头堆积 | 200元/次 |
  | 临时请假/爽约罚款（已排钟未到） | 按损失的服务时长计，[请填写]/小时（与下方「事假扣款」不重复叠加） |
  | 旷工 | 1000元/天 |
  | 累计旷工3天 | 自动离职，当月工资不予发放 |

  ---

  ### 十、请假考勤制度

  **请假规定：**
  - 请病假需医疗单位证明（含时间、姓名、地点、原因），请病假1天扣款100元
  - 事假1天扣款300元
  - 婚假最长3天不扣款（需提供证明，本人及亲兄弟姐妹结婚）
  - 丧假最长3天不扣款（需提供证明，三代内直系亲属）
  - 离职需提前一个月申请，临时离职不予发放当月工资

  **加班规定：**
  - 当日加班指第二天凌晨00:00之后的上钟时间
  - 加班以整小时计，加班几小时第二天可晚几小时到岗
  - 加班下班后必须拍照上报加班小时数
  - 当日加班累计最多6小时
  - 超出6小时，第二日20:00上班；超出第二天中午12:00直接休息一天

  **排休规定：**
  - 每月最后一天排定下月公休，每人每月公休4天
  - 每月可申请2天指定日期休息（特殊3天），须月末前申请
  - 指定休息日期须错开周五、六和法定节假日
  - 排休表排定后不更改，临时需休息自行换休并上报

  ---

  ### 十一、助教赋能培训课程表

  新助教入职后7天筛选期内的培训安排。每天6小时，由助教管理和教练共同执行。

  **Day1：服务理念 + 门店认知**
  - 上午：门店介绍、规章制度、薪资体系、晋升通道
  - 下午：服务理念培训（眼里有活、嘴里有糖、心中有账）
  - 考核：笔试（门店基本信息、服务理念）

  **Day2：球技基础**
  - 上午：站位、手架、握杆、运杆（教练一对一指导）
  - 下午：三分点练习（目标：10进3）
  - 考核：三分点进球率

  **Day3：话术演练**
  - 上钟话术：自我介绍、台面介绍、互动话术
  - 送客话术：送至电梯口、感谢信息
  - 私聊话术：3-7-15天回访法则
  - 考核：模拟对练（助教管理扮演客户）

  **Day4：实操考核**
  - 上午：上钟服务全流程实操（理台→挑杆→服务→送客）
  - 下午：球技考核（三分点+五分点）
  - 考核：实操评分（服务态度+球技水平）

  **Day5：客户模拟**
  - 模拟不同客户类型的服务场景：
    - 散客：热情接待，引导体验
    - 竞技客户：配合打球，不抢风头
    - 助教客户：专业服务，情绪价值
  - 考核：场景应对评分

  **Day6：上钟实习**
  - 在助教管理陪同下，实际接待1-2桌客户
  - 助教管理现场观察并记录问题
  - 实习结束后一对一复盘

  **Day7：综合评估**
  - 球技考核：三分点+五分点
  - 服务考核：模拟上钟全流程
  - 综合评分：球技(30%) + 服务(40%) + 态度(30%)
  - 结果：通过 → 正式入职 | 不通过 → 劝退

  **带教老师每日清单：**
  - 示范：先做一遍给新人看
  - 讲解：边做边讲要点
  - 练习：让新人自己做
  - 纠正：指出问题并示范正确做法
  - 考核：当天培训内容当天考核

  ---

  ### 十二、新助教多维100分评级表（定级用，配伯乐奖）

  新招的助教不是只看球技，按多个维度打分（满分100），用分数确定初始级别，并据此给推荐人/招聘负责人奖励（伯乐奖）。这套表也可作为在职助教的月度综合评分参考。

  | 评分项 | 分值 | 看什么 |
  |--------|------|--------|
  | 上课时长 | 20 | 当月/试用期实际上钟陪打时长，越高越能扛业绩 |
  | 形象管理 | 10 | 仪容仪表、妆容着装、镜头/现场形象是否到位 |
  | 服务 | 15 | 上钟前中后服务流程是否标准、有没有"眼里有活" |
  | 球技 | 10 | 按等级球技标准（5分点进球率/蛇彩清台）实测 |
  | 情绪价值 | 15 | 陪聊互动、捧场抬客、让客人舒服愿意再来的能力 |
  | 自媒体营销 | 10 | 短视频/直播/朋友圈产出量与质量、能不能引流获客 |
  | 活动配合度 | 5 | 门店赛事/促销/直播等活动的参与配合度 |
  | 考勤 | 5 | 出勤、请假、迟到、翻牌报备等纪律遵守情况 |
  | 自主约课 | 10 | 主动约客、私域复购、客户留存的拉单能力 |
  | **合计** | **100** | — |

  **用法：**
  - 招聘/试用结束按此表打分定初始等级（高分可直接定中级及以上，低分从初级/实习起）
  - 情绪价值(15)+自媒体(10)+自主约课(10)三项权重高，体现"助教核心是营销获客、不是只会打球"
  - 球技仅占10分——球技达标即可，不是越能赢客人越好（核心是情绪价值与服务）

  **伯乐奖（招聘激励）：**
  - 介绍/招到的新助教评分越高，给推荐人的奖励越高（按门店设定的奖励阶梯发放，具体金额【请门店填写】）
  - 与"介绍助教正式入职满2个月奖励"叠加，鼓励老员工推荐高质量新人
  - ⚠️ 金额一律由门店定，AI 生成方案时用[请填写]占位，不编造数字

  **配套：上课时长激励（鼓励多上钟，金额由门店定）：**
  - 日奖励：当日上课时长达标且为当日第一名 → 现金奖励【请门店填写】
  - 周奖励：当周上课时长达标且为当周第一名 → 现金奖励【请门店填写】
  - 月奖励：当月上课时长达标且为当月前三名 → 分别奖励【请门店填写】（一名/二名/三名递减）
