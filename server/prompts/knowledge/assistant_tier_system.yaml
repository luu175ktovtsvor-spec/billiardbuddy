#   下文只保留在册的骨架：七天筛选制、开业前只有补助没保底、入职培训七维、助教月业绩奖励档（170/200/230）。
#   球技逐级量化线、保底/提成/课时全表、罚款表、考勤制度、7天课程表、100分评级表、伯乐奖等均为模型/行业通行整理，非核心口径，已剥离。
