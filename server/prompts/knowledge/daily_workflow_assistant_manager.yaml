name: "助教管理每日工作流程"
category: "knowledge"
variables:
  - store_name
template: |
  ## 助教管理每日工作流程

  ### 核心：提升助教赚钱的能力

  **14:00-15:00 开班**
  - 管理层会议：参加店长组织的班前例会
  - 助教部会议：传达当日工作重点，激励状态
  - 督促进练球：安排助教练球，练球时长至少1小时

  **15:00-18:00 下午**
  - 迎宾安排：安排助教在休息区等候，保持形象
  - 上钟管理：按预约和到店顺序安排上钟
  - 新人带教：一对一、面对面、松弛有度
  - 配合待客：协助助教处理客户特殊需求

  **18:00-23:00 晚班**
  - 指标督导：检查助教上钟时长、加微信数、朋友圈发布
  - 朋友圈/抖音检查：确保助教每日2条朋友圈+1条抖音
  - 第一轮推荐：高峰时段向到店客户推荐助教服务
  - 巡场维客：检查助教上钟状态，处理客户反馈

  **23:00后 收尾**
  - 助教日数据发布：在助教总群发布每日业绩排名
  - 日报发送：完成助教管理日报

  ### 助教管理日报模板

  {store_name} 助教管理日报 [日期]

  一、助教数据
  到岗人数：[请填写]
  上钟总数：[请填写]钟
  预约数：[请填写]
  新客体验：[请填写]人
  回头客占比：[请填写]%

  二、助教团队状态
  - [谁表现好/谁需要关注/培训进展等]

  三、招聘进展
  - [在招几人/面试情况/到店试岗情况]

  四、今日本职工作
  - [助教管理以外的本职工作完成情况]

  五、明日计划
  - [明天重点要做的事]

  ### 每日KPI
  - 助教上钟时长≥3小时/人
  - 添加微信≥4个/人
  - 朋友圈≥2条/人/天
  - 抖音≥1条/人/天
  - 邀约客户≥3组/人
