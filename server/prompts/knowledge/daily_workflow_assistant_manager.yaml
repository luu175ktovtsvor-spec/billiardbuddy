key: "knowledge.daily_workflow_assistant_manager"
name: "助教管理一日工作流程"
description: |
  助教管理（带助教的主管）一天围绕什么干：三大核心方向（维客拓客、带助教赚钱、打开助教思维）、抓助教维客/拓客/免费体验转化/直播/朋友圈短视频产出、晚场门迎推助教、刷 BOSS 直聘招人、核对助教日报。导向是营销获客不是单纯堆陪打时长。具体到分钟的作息表、各项 KPI 目标数字由门店自定，不写死。
  老板/助教主管问"助教管理一天该干嘛/怎么带组/日报怎么写"时调它。
category: "knowledge"
variables:
  - store_name
template: |
  ## 助教管理一日工作流程

  ### 三大核心方向
  1. 打开助教思维
  2. 维客拓客能力（核心）
  3. 带助教赚钱

  ### 重点工作提示
  - 助教管理和助教间关系维护
  - 助教的每一步动作都要对助教管理进行报备
  - 助教管理必须实时知道助教的情况，方便安排

  ### 一天围绕的几件事（不写死时间点，门店按自家场次排）

  #### 到店准备
  1. 检查到店助教的仪容仪表（穿着、妆容、工号牌），发现不规范及时纠正
  2. 观察助教情绪，有情绪不对的单独疏导

  #### 一对一沟通与布置
  1. 总结昨日工作，给助教布置今天工作
  2. 检查助教朋友圈、短视频发布情况，带话题标签
  3. 安排助教轮流直播（直播手机不能停）
  4. 人情世故方面：提前告知助教给客户点奶茶、小吃水果，加深客情
  5. 包间客户，助教管理必须进去打招呼维护客情

  #### 维客与拓客
  1. 维护自己手里的客户，线上维护拉进客情关系
  2. 邀约意向客户到店
  3. 检查助教维客拓客动作，未达标进行一对一教学
  4. 社交软件聊天导入朋友圈，培训助教进行营销

  #### 直播与练球
  1. 检查并督促助教直播，巡场看是否扎堆
  2. 没约上客户的安排练球、主动上桌找客户聊天

  #### 招聘
  - 刷 BOSS 直聘招聘助教，保证小组人数

  #### 晚场工作
  1. 助教管理门迎接待顾客（管理层轮流门迎）
  2. 门迎带着没约到客户的助教，以推助教为主
  3. 未约到客户的由助教管理带领免费体验转化
  4. 陪打过程中助教需与顾客沟通，助教管理协助加客户微信
  5. 检查顾客离场后是否发消息关心维护客情

  #### 每日例会与日报
  1. 检查并核对每位助教日报
  2. 提出今天发现的问题，给出针对性解决方案
  3. 汇报各小组今日考勤、上课情况、存在问题、招聘情况
  4. 助教管理进行每日数据更新，今日总结 + 明日计划

  ### 导向说明
  - 陪打时长是保底基础，绩效增长看"加微 / 邀约 / 免费体验转化"，不是堆陪打小时数。
  - 各项动作的每日目标数（加微多少、体验转化几桌、直播几小时等）由门店按自家情况自定，AI 生成时用 [请填写] 占位、不写死。

