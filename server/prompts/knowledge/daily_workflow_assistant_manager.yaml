  ## 助教管理一日工作流程

  ### 三大核心方向
  1. 打开助教思维
  2. 维客拓客能力（核心）
  3. 带助教赚钱

  ### 重点工作提示
  - 助教管理和助教间关系维护
  - 助教的每一步动作都要对助教管理进行报备
  - 助教管理必须实时知道助教的情况，方便安排

  ### 详细时间表

  #### 13:50 到店准备
  1. 检查到店助教的仪容仪表（穿着、妆容、工号牌），发现不规范及时纠正
  2. 观察助教情绪，有情绪不对的单独疏导

  #### 14:00-14:30 一对一工作沟通
  1. 总结昨日工作，给助教布置今天工作
  2. 检查助教朋友圈、短视频发布情况，带话题标签
  3. 安排助教轮流直播（直播手机不能停）
  4. 人情世故方面：提前告知助教给客户点奶茶、小吃水果，加深客情
  5. 检查助教轮流派赛工作，不允许断岗
  6. 包间客户，助教管理必须进去打招呼维护客情

  #### 14:30-15:30 维护客户
  1. 维护自己手里的客户，线上维护拉进客情关系
  2. 邀约客户（盘点客户时邀约意向客户到店）
  3. 检查助教维客拓客动作，未达标进行一对一教学

  #### 15:30-16:30 拓客培训
  1. 协助助教维客（拓客）
  2. 注重助教的拓客动作
  3. 培训助教进行营销
  4. 社交软件聊天导入朋友圈

  #### 16:30-17:00 检查直播
  1. 检查助教直播情况，督促助教直播（每天每组必须直播够 2 小时）
  2. 巡场，检查助教是否有扎堆情况

  #### 17:00-18:00 练球与招聘
  1. 检查助教练球，没有约上客户的安排练球
  2. 培训助教主动上桌找客户聊天
  3. 刷 BOSS 直聘招聘助教

  #### 18:00-18:45 用餐时间

  #### 18:45-00:00 晚场工作
  1. 助教管理门迎接待顾客（管理层轮流门迎，每半小时轮换）
  2. 门迎带着没有约到客户的助教，以推助教为主
  3. 检查助教约客情况，未约到客户的由助教管理带领免费体验转化
  4. 免费体验时间控制在 10-15 分钟内
  5. 陪打过程中助教需与顾客沟通，助教管理协助加客户微信
  6. 检查顾客离场后是否发消息关心维护客情

  #### 00:00-00:20 每日例会
  1. 检查并核对每位助教日报
  2. 提出今天发现的问题，提出针对性解决方案
  3. 汇报各小组今日考勤、上课情况、存在问题、招聘情况

  #### 00:20-00:30 日报总结
  1. 日报总结汇报
  2. 助教管理进行每日数据更新
  3. 今日工作总结，明日计划安排
  4. 刷 BOSS 直聘招助教
