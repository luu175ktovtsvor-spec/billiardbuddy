template: |
  ## 客户运营 customer-ops · 域目录页（L1 导航）

  这个域管【把人留下来、来得勤、还带人来】：服务做到位 → 转化复购 → 裂变，配上玩法活动赛事和私域社群。
  下面是骨架 → 子知识索引 → 典范 → 红线单一源。本域条目最多，先看 core_operations 对齐基本盘再细分。

  ### 骨架（底层逻辑，模型据此延伸）
  - **客户运营五步法**：引流 → 服务 → 转化 → 复购 → 裂变。写任何运营内容先想清它服务于哪一环。
  - **服务是真功夫**：迎宾 → 上钟/上课 → 送客（送至电梯口）全流程 + 巧粉皮头台面维护 + 助教形象，靠"氛围 + 人情世故"把单次到店做深成铁粉。
  - **分客群差异化对待**：散客撑流量底盘、抓关键人/意见领袖、大客户重点维护（包厢+助教质量决定去留）、竞技客最难维系但忠诚度最高、追分客图输赢刺激（照实营造氛围、但门店不当庄）、女性客群诉求不同（环境体感/安全感/新手怕被笑/拍照出片）。
  - **玩法即活动**：抢一大战/台费局/饮料局/搭子局/奖品挑战是引流社交玩法，正式赛事（中八/斯诺克/周赛月赛）要素齐全（形式/赛制/让条件/报名费奖金/预热战报）；让条件的核心是增加偶然性让人人有机会。
  - **私域是沉淀池**：公域引流 → 加微拉群导流 → 社群按客户分类维护（客户群/会员群/竞技群），群里有内容、有活动、有归属。
  - **复购靠主动够客**：老客召回、离店跟进（自然不骚扰、有时机感）、空台/淡季促活、VIP 维护（让客户觉得"被记住"比"被推销"重要）。

  ### 子知识索引（要细则，用 look_up_knowledge 查或读全文）
  - knowledge.core_operations — 球房运营总纲底牌（营销四步/五步法/六岗分工/四类客户/加微三部曲/拢客动作清单）。先调它对齐基本盘。
  - knowledge.service_philosophy — 一线服务真实场景动作与话术（迎宾→上钟→送客全流程）。
  - knowledge.assistant_service_sop / knowledge.assistant_scripts — 助教上钟服务 SOP、前线高频话术速查卡。
  - knowledge.female_customer_ops — 女性客群差异化运营（真实诉求 + 语气）。
  - knowledge.gaming_customer_ops — 追分/博弈客群对内运营（核心需求=输赢刺激）。
  - knowledge.competitive_group_ops — 竞技群日常运营（教练核心阵地）。
  - knowledge.game_rules / knowledge.billiards_game_rules / knowledge.mini_games — 玩法运营落地、玩法名词、趣味小游戏。
  - knowledge.tournament_rules — 赛事活动规则（类型/典型场景/必备要素/追分边界）。
  - knowledge.daily_workflow — 前厅各角色每日/每周工作清单（服务交付侧）。

  ### 典范（要动手写真东西时，读这几个最对版；多为 operation 模板，经 find_scenario 取 prompt_key）
  - 玩法/赛事闭环 → operation.qiangyi_battle、operation.tournament_signup、operation.tournament_rules、operation.tournament、operation.tournament_report、operation.champion_poster、operation.partner_match、operation.game_recommend。
  - 约客/复购/召回 → operation.assistant_outreach、operation.assistant_booking、operation.old_customer_recall、operation.departure_followup、operation.empty_table_promo、operation.off_season_revival、operation.vip_maintenance。
  - 私域社群 → operation.group_content、operation.customer_group_guide、operation.member_assistant_notice、operation.store_atmosphere。
  - 海报/氛围/投诉 → operation.poster_copy、operation.complaint_handling、operation.activity_direction、operation.table_content_plan。

  ### 红线（不复述，一律见 core.safety_redlines）
  - 追分氛围可营造但门店不当庄·不抽水·不定盘口·控赌博金额；助教陪伴/撒娇/超休是情绪价值，绝不滑向实际性交易；
    撮合约局只是牵线、不是开盘；未成年保护。判断/写之前必看 `core.safety_redlines`，本页只指路不重述。
