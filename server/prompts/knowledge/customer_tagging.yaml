key: "knowledge.customer_tagging"
name: "客户标签体系知识库"
category: "knowledge"
variables: []
description: |
  给客户打标签的方法和维护策略。
  核心逻辑：不同类型的客户需要不同的对待方式，打标签是为了精准服务。
  教练和助教都要养成打标签的习惯。

template: |
  ## 客户标签体系核心规则

  > 客户的"需求分类"只有 4 类核心客户：散客（求社交）·竞技客户（求技术交流）·助教客户（求情绪价值）·追分客户（**核心内核=输赢刺激、图追分赢钱那口气**，是真实高价值客群）。对外公开文案可软表达，但作为打标签知识，追分客户就照真内核认：好胜、爱约局、图赢钱刺激、黏性强。
  > 下面这组是在四大类之上叠加的"生命周期 + 价值分级"维度，用于打标签和分层维护，不是另一套客户分类。

  ### 客户分级与维护策略（生命周期 / 价值分级）
  - 散客/团购：热情接待 → 加微信 → 了解需求 → 邀约复购
  - 新客户(1-2次)：建立关系 → 了解需求 → 引导复购
  - 老客户(3次+)：人情维护 → 价值升级 → 活动邀请
  - 竞技客户：教练重点维护 → 引导进竞技群 → 赛事邀请
  - 助教客户：助教管理重点维护 → 服务升级 → 专属活动
  - VIP/大客户：店长亲自维护 → 专属服务 → 生日关怀

  ### 球技档位与服务方式
  - 1档新手：基础教学，耐心引导，多鼓励
  - 2-3档入门：纠正姿势，教基本走位，建立信心
  - 4-5档中等：提升准度，教复杂走位，组局配对
  - 6-7档高手：赛事邀请，高手配对，竞技氛围

  ### 打标签流程
  - 教练：每次客户到店后记录（姓名+球技档位+客户类型+常来时间+微信）
  - 助教：每次上钟后记录（姓名+消费偏好+性格特点+下次预约意向）

  ### 高价值客户维护
  - 标准：高频消费+高客单价
  - 动作：优先安排好台位/好助教 + 生日关怀 + VIP专属活动 + 每周至少1次回访

  ### 流失风险客户挽回
  - 标准：以前高频，最近1个月没来
  - 动作：个性化回访（非群发）→ 了解原因 → 给出回店理由（新活动/新助教/专属优惠）

  ### 新客户培育
  - 当天加微信 → 次日回访体验感受 → 3天内邀约第二次 → 引导进群

  ### 维客的最高境界：让会员在你店里互相成朋友
  > 维客的天花板不是"门店对客一对一伺候得好"，而是把会员之间撮合起来——让他们互相认识、自发约球、结成圈子。客户最后黏的是"这个圈子、这帮球友"，而不只是你家的台子。这种黏性最牢：换一家店打球，意味着要丢掉一整帮熟人，他舍不得，自然就离不开你这个场子。

  - **从"客对店"升到"客对客"**：教练/管理层维客有两个核心，其一就是让会员互相成为朋友、能自发约球。日常动作——
    - 撮合搭子：水平相近的两个客户互相引荐，约到一起打；约局多了自然成熟人。
    - 拉进社群/竞技群：把熟起来的客户拉进店内球友群，约球、组队、约局都在群里发起，让"约下一场"这件事天然发生在你店的池子里。
    - 店内组局：教练出面把几个客户攒成一桌局（组局=撮合约局，是教练真正的维客硬功夫），席间互相认识、留微信、约下次。⚠️ 守底线——教练只撮合约局、约时间约台，绝不当庄/坐庄、不定盘口、不抽水；客人之间私下押多少是他们的事，门店只帮控金额、做和事佬，不下场坐庄。
    - 制造共同记忆：会员赛、主题局、节日局，让这帮人有"我们一起玩过"的共同经历，圈子才黏得住。

  ### 防被钓走（防钓鱼）——把约球留在店里发生
  > 熟客一旦互相熟络，就有真实流失风险：会员之间、或被同行球房/私人教练私下约走，绕开门店在别处打球，门店白白培养了圈子却收不到台费。这叫"被钓鱼"，是维客做到一定程度必然会遇到的坎。

  - **判断信号**：某个常来的熟客突然到店频次掉、约球都"在外面约"、或被某个总在店里转悠加人的同行/私人教练频繁私聊——警惕被钓。
  - **应对动作**：
    - 让约局都在店内发生：店内社群约球、教练撮合组局，把"下一场约在哪"的主动权握在门店手里，而不是放任客户私下互加私下约走。
    - 维客做扎实：客户黏的是圈子+这家店的服务/教练/氛围，圈子越牢、越难被单点撬走。
    - 警惕"挖人型"角色：对总在店里加客户、拉私单的同行/私人教练保持距离，别让自己辛苦攒的圈子给别人做了嫁衣。

  ### 内部会员赛的隐藏作用：检验维客 + 把客户黏进圈子
  - 内部会员赛表面是比赛，隐藏目的是教练的"终极能力考场"：一次会员赛能同时检验教练的**维客能力**（叫得动多少熟客来）、**组局能力**（能不能把人攒成局、安排好对阵）、**定档水平**（让条件/分档分得公不公平、好不好玩）。
    - 维客没做到位：人叫不来、报名冷清，说明平时圈子没养起来。
    - 组局没能力：来了也撮合不成局、对阵安排乱，客户体验差。
    - 定档不准：让条件不合理，强者碾压或弱者被虐，下次没人来。
  - 同时会员赛本身就是黏客的手段：一帮会员一起报名、一起打、一起复盘，互相成朋友、加深圈子记忆，赛后约球更频繁——既检验维客，又反过来强化维客，把客户更牢地黏进门店圈子。

tag_dimensions:
  basic_info:
    name: "基础信息"
    fields:
      - field: "姓名"
        required: true
      - field: "初次进店时间"
        required: true
        purpose: "判断客户生命周期"
      - field: "联系方式（微信）"
        required: true
      - field: "常来时间段"
        required: false
        example: "周末下午/工作日晚上"
      - field: "常来区域"
        required: false
        example: "住附近/公司附近"

  customer_type:
    name: "客户类型"
    types:
      - type: "散客/团购"
        characteristics: "第一次来或很少来，以体验为主"
        strategy: "热情接待，引导加微信，了解需求，下次邀约"
      - type: "新客户（1-2次）"
        characteristics: "来过几次，还没养成习惯"
        strategy: "建立关系，了解需求，引导复购"
      - type: "老客户（3次以上）"
        characteristics: "经常来，有固定偏好"
        strategy: "人情维护，价值升级，活动邀请"
      - type: "竞技客户"
        characteristics: "喜欢约局、打比赛、技术导向"
        strategy: "教练重点维护，引导进竞技群，赛事邀请"
      - type: "助教客户"
        characteristics: "经常约助教，客单价高"
        strategy: "助教管理重点维护，服务升级，专属活动"
      - type: "VIP/大客户"
        characteristics: "消费高，影响力大"
        strategy: "店长亲自维护，专属服务，生日关怀"

  skill_level:
    name: "球技档位"
    levels:
      - level: "1档（新手）"
        description: "刚接触台球，基本规则不清楚"
        service: "基础教学，耐心引导，多鼓励"
      - level: "2-3档（入门）"
        description: "会基本规则，但姿势和发力有问题"
        service: "纠正姿势，教基本走位，建立信心"
      - level: "4-5档（中等）"
        description: "有一定基础，能打简单走位"
        service: "提升准度，教复杂走位，组局配对"
      - level: "6-7档（高手）"
        description: "技术好，经常参加比赛"
        service: "赛事邀请，高手配对，竞技氛围"

  consumption:
    name: "消费行为"
    fields:
      - field: "消费频次"
        purpose: "判断客户活跃度"
        categories: "高频（每周2次以上）/中频（每周1次）/低频（每月1-2次）"
      - field: "平均消费金额"
        purpose: "判断客户价值"
      - field: "消费偏好"
        purpose: "精准推荐"
        categories: "纯台费/台费+助教/台费+商品/全套"

tagging_workflow:
  coach:
    name: "教练打标签"
    when: "每次客户到店打球后"
    how: "在客户档案中记录：姓名+球技档位+客户类型+常来时间+微信"
    frequency: "每次客户到店后更新"
  assistant:
    name: "助教打标签"
    when: "每次上钟服务后"
    how: "记录：姓名+消费偏好+性格特点+下次预约意向"
    frequency: "每次上钟后更新"

maintenance_strategy:
  high_value:
    name: "高价值客户维护"
    criteria: "消费频次高+平均消费高"
    actions:
      - "专属服务（优先安排好台位、好助教）"
      - "生日关怀（个性化祝福+小礼物）"
      - "活动邀请（VIP专属活动）"
      - "定期回访（每周至少1次）"
  at_risk:
    name: "流失风险客户"
    criteria: "以前高频，最近1个月没来"
    actions:
      - "主动回访（不是群发，是个性化问候）"
      - "了解原因（忙？搬家？不满意？）"
      - "给出回店理由（新活动/新助教/专属优惠）"
  new_customer:
    name: "新客户培育"
    criteria: "第一次来或来过1-2次"
    actions:
      - "加微信（当天）"
      - "次日回访（体验感受）"
      - "3天内邀约第二次"
      - "引导进群（竞技群/会员群）"

abcd_classification:
  name: "ABCD客户分级标准"
  description: "按消费力和活跃度将客户分为四级，每级有不同的维护频率和动作"
  levels:
    - level: "A类（高价值活跃客户）"
      criteria: "高频（每周2次以上）+ 高客单价（含助教或充值）+ 高复购"
      maintenance_frequency: "每周1次"
      actions:
        - "专属服务：优先安排好台位、好助教"
        - "生日关怀：个性化祝福+小礼物"
        - "VIP活动邀请"
        - "定期回访，了解需求变化"
    - level: "B类（中等价值客户）"
      criteria: "中频（每周1次）+ 中客单价 + 稳定复购"
      maintenance_frequency: "每两周1次"
      actions:
        - "活动邀约：周赛/月赛/会员日"
        - "服务升级推荐：尝试助教体验"
        - "充值引导：介绍一卡通模式"
    - level: "C类（潜力客户）"
      criteria: "低频（每月1-2次）+ 有消费但未形成习惯"
      maintenance_frequency: "每月1次"
      actions:
        - "空台提醒：下午场/工作日促活"
        - "搭子撮合：帮找球友"
        - "小游戏邀约：降低到店门槛"
    - level: "D类（沉默/流失客户）"
      criteria: "30天以上未到店"
      maintenance_frequency: "季度唤醒"
      actions:
        - "个性化回访：不是群发，是真问候"
        - "了解流失原因"
        - "给出回店理由：新活动/新助教/新设备"
  conversion_path: "散客 → 加微信 → 打标签 → ABCD分级 → 差异化维护"
