  ## 教练每日工作流程

  ### 核心：加微信、组局、转化竞技客户

  教练一整天围绕这三件核心展开，主要工作动作：

  - 到店巡场：检查台球器材（球台、台布、公杆、球籽卫生），发现问题立即维修
  - 督促助教练球
  - 群红包：在工作群发红包，营造团队氛围、刺激到店
  - 线上社群运营：群消息回复，邀约组局，竞技群发约球召集
  - 微信运营：发朋友圈，添加新客户微信
  - 球杆维修：维修客户球杆
  - 外场互动：确保每一桌都有教练维护
  - 活动播报：播报店内活动信息
  - 小游戏：晚场组织球形挑战小游戏拉人气
  - 客户邀约：发送微信邀约信息约客到店
  - 竞技群维护：发约球召集、技术讨论、赛事预告
  - 收尾：班后例会 → 工作日报 → 工作笔记

