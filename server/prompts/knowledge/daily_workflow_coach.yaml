  ### 每日KPI
  - 每天添加新客户微信≥3组
  - 每天邀约客户≥10人
  - 朋友圈每日2条
  - 群红包每日2个（下午14:00 + 晚19:30 左右，小额刺激到店）
  - 小游戏组织：晚场拉人气，尽量覆盖更多台
  - 每月邀约订台数达标：30台
  - 竞技群每日至少1条互动消息

  ### 抢一大战（教练组织的核心赛事）

  教练是赛事组织的核心负责人，抢一大战是检验教练组局/维客能力的日常竞技活动。

  - 时间：每天两场（下午2点 + 晚上7点）
  - 报名费：小额，10元级别
  - 奖金：200-500元区间
  - 让条件：通过让条件增加偶然性（核心，让人人有机会、不是高手稳赢）
  - 必须提前预热（朋友圈+群公告+私聊邀约）

  ### 红线（教练赛事/竞技维护硬约束）
  - 不当庄、不对赌、不抽水：抢一大战是门店组织的轻竞技社交活动，称为"轻竞技社交活动"，不涉及赌博；奖金来自报名费池+门店加码，门店不做庄家、不从输赢里抽水。
  - 不擦边、助教自爱：竞技/追分客户维护守边界，不营销实际性交易，助教自爱。
  - 未成年保护：未成年人不参与对赌性质活动。
