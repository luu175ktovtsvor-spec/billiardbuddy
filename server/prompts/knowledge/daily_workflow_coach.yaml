key: "knowledge.daily_workflow_coach"
name: "教练每日工作流程"
description: |
  教练从11点开班到23点后收尾的整天流程（巡场查器材、督促助教练球、群红包、竞技群约球、朋友圈、修杆、晚场小游戏、客户邀约），核心三件事=加微信·组局·转化竞技客户；含每日KPI（加新客≥3组、邀约≥10人、朋友圈2条、群红包2个、月订台30台）、教练日报模板，以及四套赛事方案框架（万元赛/会员周赛/品牌冠名联赛/抢一大战的赛制、报名费、让球规则、SOP）。
  老板/教练问"教练一天该干嘛/KPI多少/教练日报""办个赛事怎么排赛制让球奖金"时调它。
category: "knowledge"
variables:
  - store_name
template: |
  ## 教练每日工作流程

  ### 核心：加微信、组局、转化竞技客户

  **11:00-14:00 开班**
  - 到店巡场：检查台球器材（球台、台布、公杆、球籽卫生），发现问题立即维修
  - 参加店长班前例会
  - 立岗定位：课时期间清理烟灰缸，提醒客人酒水摆放

  **14:00-18:00 下午**
  - 助教球技培训：14:00-17:00督促助教练球，至少1小时
  - 下午茶点红包：14:00在工作群发红包，营造团队氛围
  - 线上社群运营：群消息回复，邀约组局，竞技群发约球召集
  - 微信运营：朋友圈每日两条，每天添加3组以上新客户微信
  - 球杆维修：17:00-18:00维修客户球杆
  - 客户回访：查看客户档案，做回访

  **18:00-23:00 晚班**
  - 外场互动：确保每一桌都有教练维护
  - 活动播报：20:00播报店内活动信息
  - 小游戏：21:00组织球形挑战小游戏
  - 客户邀约：每天发送微信邀约信息10人以上
  - 竞技群维护：发约球召集、技术讨论、赛事预告

  **23:00后 收尾**
  - 班后例会 → 工作日报 → 工作笔记

