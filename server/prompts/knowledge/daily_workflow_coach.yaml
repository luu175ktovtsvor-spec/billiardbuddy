  ### 每日KPI
  - 每天添加新客户微信≥3组
  - 每天邀约客户≥10人
  - 朋友圈每日2条
  - 群红包每日2个（下午14:00 + 晚19:30 左右，小额刺激到店）
  - 小游戏组织：晚场拉人气，尽量覆盖更多台
  - 每月邀约订台数达标：30台
  - 竞技群每日至少1条互动消息

  ### 赛事方案框架

  教练是赛事组织的核心负责人。以下是常见赛事的方案框架：

  **万元赛方案**
  - 赛制：中式八球，全程双败淘汰
  - 报名费：[请填写]元/人（女子/14岁以下免费）
  - 奖金池：报名费总额 + 门店加码 = 万元级别
  - 冠军奖金：[请填写]元 + 奖杯 + 证书
  - 让条件：按档位ABCD档，每低一档让球/让分
  - 赛程：预选赛 → 32强 → 16强 → 8强 → 半决赛 → 决赛
  - 执行SOP：预热（赛前7天）→ 报名（赛前3天截止）→ 抽签 → 比赛 → 颁奖 → 战报

  **会员周赛方案**
  - 赛制：中式八球，弹性让球双败淘汰
  - 报名费：[请填写]元/人
  - 奖金：冠军[请填写]元 + 奖杯证书
  - 弹性让球规则：平打开始，赢一局让后一，最高让后三，领先3局内恢复平打
  - 时间：每周[请填写]举办
  - 人数：16人以上成赛

  **品牌冠名联赛方案**
  - 赛制：门店或赞助商冠名，三场常规赛 + 一场总决赛
  - 总奖金：[请填写]元
  - 积分制：胜方积3分，负方积1分
  - 定档让球：S/9/8/7/6/5/4档，按档位让球
  - 执行SOP：品牌宣传 → 预热报名 → 常规赛（3场）→ 积分排名 → 总决赛 → 颁奖 → 二次传播

  **抢一大战方案**
  - 时间：每天两场（下午2点 + 晚上7点）
  - 报名费：[请填写]元/人（小额，10元级别）
  - 奖金：[请填写]元（200-500元区间）
  - 核心逻辑：通过让条件增加偶然性，好赛事不是高手稳赢，而是人人有机会
  - 必须提前预热（朋友圈+群公告+私聊邀约）
  - 合规表达：称为"轻竞技社交活动"，不涉及赌博
