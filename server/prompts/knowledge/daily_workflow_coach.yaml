  ### 抢一大战（教练组织的核心赛事）

  教练是赛事组织的核心负责人，抢一大战是检验教练组局/维客能力的日常竞技活动。

  - 时间：每天两场（下午2点 + 晚上7点）
  - 报名费：小额，10元级别
  - 奖金：200-500元区间
  - 让条件：通过让条件增加偶然性（核心，让人人有机会、不是高手稳赢）
  - 必须提前预热（朋友圈+群公告+私聊邀约）

  ### 红线（教练赛事/竞技维护硬约束）
  - 不当庄、不对赌、不抽水：抢一大战是门店组织的低门槛趣味赛（10元级报名费、奖金来自报名费池+门店补贴），不是客户间对赌，门店不做庄家、不从输赢里抽水。追分客户来店追分对打是客户自己的事，门店只控金额、不当庄、不抽水、不定盘口。
  - 不擦边、助教自爱：竞技/追分客户维护守边界，不营销实际性交易，助教自爱。
  - 未成年保护：未成年人不参与对赌性质活动。
