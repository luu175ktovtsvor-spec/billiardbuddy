template: |
  # 初次进店散客细分与维护转化

  ## 一个核心前提：散客不是一类人，先分层再下手

  第一次进店的客人，你看他们都在打球，其实心里想的完全不是一回事。
  有人就图开心、有人是被朋友拉来陪打、有人刚打出兴趣想打好、有人一进门就想跟人较量。
  **同样的话术对四种人，效果天差地别**：你跟"就想放松"的人猛讲技术，他觉得累；
  你跟"想较量"的人光陪着哈哈乐，他觉得没劲。所以服务这步的第一动作不是上钟、是**判断他是哪一层**。

  分层维度就两个：**上瘾程度**（来打球的内在驱动有多强）+ **来意**（自己想打还是陪人）。
  对应四类：娱乐型 / 仅限朋友型 / 刚上瘾型 / 竞技型。
  这条线最终要把人推进"单人进店 → 上瘾 → 组局 → 进圈子"的闭环里——
  越往里走，黏性越高、消费越稳。下面逐类拆。

  ---

  ## ① 娱乐型客户 —— 核心抓手：让他释放自己

  **识别特征**
  - 来就是图个开心、放松、解压，球技好不好他不在乎。
  - 常见状态：下班/聚餐后顺路来玩两杆、边打边聊天刷手机、进球了起哄欢呼、不进球也不沮丧。
  - 不主动问规则、不在意输赢，更像把球房当社交+放松的场子。

  **核心抓手：让他"释放自己"、玩开、别拘束**
  - 营造轻松气氛是第一位：别一上来就纠正他姿势、别讲一堆专业术语压他，那会让他更拘谨。
  - 顺着他的情绪走——他起哄你就接、他炫一杆你就捧场，让他在这儿待得自在、笑得出来。
  - 适当带个简单小游戏／趣味玩法（谁输谁请喝的、定点进球小挑战这类），把放松感拉满，
    重点是"好玩"不是"考技术"。
  - 服务上把"舒服"做足：递水、调灯、帮记分，让他觉得来这儿被照顾、不操心。

  **转化方向**
  - 往**高频复购+会员/一卡通**带：这类人黏的是"放松的场子"和氛围，不是技术。
    让他形成"想放松就来这儿"的习惯，引导办[请填写]档位的一卡通，把零散来玩沉淀成稳定复购。
  - 不强推助教、不硬塞课。真要带也只带"陪你玩得更开心"的轻服务，别讲"提升你"。
  - 加微信进群是底线动作，后续靠社群活动、好玩主题局反复唤他回来。

  ---

  ## ② 仅限朋友型客户 —— 核心抓手：给他专业体验、让他有面子

  **识别特征**
  - 自己本来不怎么打，是被朋友拉来陪着的；进店时心理上"在朋友的局里"。
  - 常见状态：站旁边看的时间多、被叫上场才打两杆、更关注朋友打得怎样、容易在意"我是不是打得太菜被笑"。
  - 他对球房本身没什么概念，全部观感来自这一次的体验好不好。

  **核心抓手：给他"专业体验"、让他感到这店专业、有面子**
  - 这类人最吃"专业感"和"被尊重"：你把店里的专业度展示给他看，他会觉得跟着朋友来这家店有面子。
  - 现场动作：球台/器材摆放整齐、台呢干净、服务规范有礼；助教/教练路过顺手指点一两句关键的
    （比如怎么站稳、怎么瞄准），让他立刻进一个球——**第一杆进球的爽感是转化他的关键**。
  - 别让他在朋友面前一直丢脸：默默给点小帮助，让他打得不那么狼狈，他对这家店的好感就上来了。
  - 把"专业"做成他能感知到的东西：环境、服务、那一两句到位的指导，而不是讲一堆他听不懂的术语。

  **转化方向**
  - 先把他从"陪打"变成"自己也想试试"——他一旦体会到进球的乐趣，就有机会从②滑向③刚上瘾型。
  - 这一步**不急着卖卡卖课**，重点是留住好印象 + 加微信，让他下次愿意主动再来（哪怕还是跟朋友）。
  - 中长期往**助教首单体验**带：可以用"首单免费体验[请填写]"这类钩子，让他试一次被专业服务带飞的感觉，
    打开"原来打好球这么爽"的开关。

  ---

  ## ③ 刚上瘾型客户 —— 核心抓手：提升自信、夸他进步快

  **识别特征**
  - 开始有兴趣了、想把球打好；自己会主动来、来了愿意多打一会儿、会反复练某个球。
  - 常见状态：进了个好球会回头看有没有人注意、会主动问"我这样对不对"、关心自己有没有进步。
  - 内心很在意"我是不是有天赋""我能不能打好"——他需要正反馈来支撑这股兴趣。

  **核心抓手：给他"提升自信"、夸他进步快、给点小指导留住他**
  - 这类人最怕"打不好就泄气走人"。你的任务是**用正反馈把这股新鲜兴趣稳住**，别让它凉掉。
  - 具体夸要落到点上、别空夸："你这杆走位明显比刚才稳""上手挺快的，有点天赋"——
    让他感到自己在变强、有奔头。
  - 给"小指导、看得见效果"的那种：一次只纠一个最影响他出杆的小毛病，让他立刻打出变化，
    自信心当场被点燃。**别一次塞太多，会打击他。**
  - 帮他设个够得着的小目标（这周练成某个球、能稳定打进某种球），让他有理由一次次回来。

  **转化方向**
  - 这是**转助教/转会员的黄金人群**：他正缺人带、缺正反馈，助教/教练的价值对他最实。
    可以引导他试"首单免费体验[请填写]"的助教/教学，体验到"被带一下进步飞快"，
    再顺势引导办一卡通/课时把进步固化下来。
  - 往复购+课程双线走：用"想打好就得常来练"把他的来店频次拉起来。
  - 同时把他往④竞技型方向养——等他打出点水平、自信起来，自然会想找人较量，进入组局/竞技圈。

  ---

  ## ④ 竞技型客户 —— 核心抓手：营造竞技氛围、给他对手

  **识别特征**
  - 一进门就奔着"较量"来：在意输赢、爱比分、喜欢挑战、问"店里有没有打得好的"。
  - 常见状态：主动找人约球、自己练得很认真、关注水平高低、对"跟高手过招"很有兴趣。
  - 这类人黏的不是放松、是**竞技带来的刺激和成就感**。

  **核心抓手：营造"竞技氛围"、撮合对手、引向竞技/追分客群**
  - 给他**对手**是第一刚需：帮他撮合水平相当或略高的人对打，让他有得较量、有目标追。
  - 把竞技氛围做起来——店内排名、积分挑战、小型对抗赛、约战墙这类机制，让他感到"这儿有得打、有人比"。
  - 引导他进店里的竞技/追分圈层（高水平玩家的群和局），让他在圈子里找到归属和对手，黏性最强。
  - 控场提醒：竞技型容易上头玩"打钱博彩"。**店家不当庄、不定盘口、不抽水**；
    但要做真实控场——帮客人把金额控在玩乐范围、别炸店、别让小赌变大、别影响别的客人，
    这是护店也是护客。

  **转化方向**
  - 往**竞技圈层+赛事+高阶教学**带：这类人是组局、进圈子闭环的核心，也是赛事报名、追分局的主力。
    一旦进了圈子，复购和黏性最稳。
  - 助教/教练对他卖的是"陪练/拆解对手/补短板"的高阶价值，不是入门教学。
  - 他往往会成为店里的"活跃节点"——带动约球、撑场子、吸引同水平的人聚过来，值得重点维护。

  ---

  ## 用法小结：先认人，再下招，最后往圈子里带

  | 类型 | 一句话识别 | 核心抓手 | 主转化方向 |
  |------|-----------|---------|-----------|
  | 娱乐型 | 图开心放松、不在乎输赢 | 让他释放自己、玩开 | 高频复购 + 一卡通 |
  | 仅限朋友型 | 陪朋友来、自己没概念 | 给专业体验、有面子 | 留好印象 + 助教首单体验 |
  | 刚上瘾型 | 想打好、在意进步 | 提升自信、夸进步、给小指导 | 助教/课时 + 会员 |
  | 竞技型 | 想较量、爱比分 | 营造竞技氛围、撮对手 | 竞技圈层 + 赛事 + 追分局 |

  - **第一动作永远是判断对方是哪一层**，再用对应抓手，别一套话术打天下。
  - 四类不是固定的——人是会"进化"的：仅限朋友型体验好会变刚上瘾，刚上瘾打出水平会变竞技。
    维护的本质是**顺着他往闭环深处推**：单人进店 → 上瘾 → 组局 → 进圈子。越往里黏性越高、消费越稳。
  - 所有金额、档位、提成、活动力度一律由门店按自己定价填，本知识只给打法逻辑、不给死数字。
