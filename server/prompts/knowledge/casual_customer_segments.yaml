description: |
  初次进店的"散客"不是同一类人。按上瘾程度和来店动机分成四层：娱乐型、仅限朋友型、刚上瘾型、竞技型。
  同样是散客，每一层的心理诉求不一样，维护和转化的打法也完全不同——用错招会把人推走。
