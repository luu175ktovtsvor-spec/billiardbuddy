  ## 球房盈利模型知识库

  # PPT核心校准：4类球房定位
  # 社区球房 | 商业球房 | 竞技球房 | 竞技商业球房
  # 核心卖点：氛围 + 人情世故
  # 营销框架：营(strategy) vs 销(execution)

  本知识库收录球房行业盈利模型，供 AI 生成经营建议、活动方案、定价策略时参考。

  ---

  ### 一、收入来源

  #### 1. 台位费（核心收入，占比60-70%）

  - 普通时段：20-30元/小时
  - 高峰时段：40-60元/小时
  - 包夜服务：30-50元/人
  - 桌型定价参考（以商业球房为例）：
    - 普通台：20-36元/小时
    - 独牙赛台：39-49元/小时
    - 乔氏银腿：49-69元/小时
    - 乔氏金腿：59-79元/小时
    - 包厢：加价10-20元/小时

  #### 2. 助教服务费（重要收入，占比20-30%）

  - 初级助教：50-68元/小时（参考数据，因城市差异大）
  - 中级助教：68-88元/小时（参考数据，因城市差异大）
  - 高级助教：78-108元/小时（参考数据，因城市差异大）
  - 教练课时：100-300元/小时
  - 门店提成方式：助教每小时固定管理费（如8元/小时），教练课时提成（如48元/课时）

  #### 3. 商品销售（补充收入，占比15-25%）

  - 饮品小吃：毛利率70-80%，人均消费10-20元
  - 球杆器材：按进价翻倍定价，一两个引流款低价
  - 商品费通常占日均营业额15-20%

  #### 4. 会员充值（锁定长期客户）

  - 充值卡：500-2000元/张，赠送比例为充值额的20-33%
  - 月卡/季卡：300-800元
  - 充值赠送参考：
    - 充300送100
    - 充500送200
    - 充1000送500
    - [请填写更大额度方案，需门店根据实际情况确定]
  - ⚠️ 禁止大额充值赠送类文案：不生成"充5000送5000""充10000送10000"等大额充值赠送文案，大额充值存在资金风险和合规风险
  - 行业趋势：减少大额充值赠送，改为小额赠送+限定消费范围（赠送金额仅限台费）

  ---

  ### 二、成本结构

  #### 1. 房租（最大固定成本）

  - 占营收比例建议不超过30%
  - 租金评估标准：单月运营成本测算到每天满台时长不超过4小时
  - 谈判要点：争取免租期、阶梯租金

  #### 2. 人工成本（第二大支出）

  - 参考薪资体系：
    - 店长：8000-15000元/月
    - 教练：5000-8000元/月
    - 主管：3500-5000元/月
    - 助教：保底4500-6500元/月（1-2个月），之后按提成结算
    - 收银：3000-3500元/月
    - 服务员：2500-3000元/月
    - 保洁：2000-2500元/月
  - 人员配置：每4桌配备1个服务员

  #### 3. 设备折旧

  - 球桌：普通台5000-15000元/张，乔氏/独牙2-5万/张
  - 球杆：公用杆几十到几百元，品牌杆上千
  - 台泥更换：每年1-2次
  - 其他设备：空调、新风、收银系统、监控等

  #### 4. 耗材成本

  - 巧克、皮头、球杆维护耗材
  - 清洁用品
  - 水电费（空调为主要消耗）

  ---

  ### 三、关键经营指标

  #### 1. 翻台率

  - 定义：每张球桌日均开台时长
  - 及格线：4小时/桌/天
  - 优秀：6小时/桌/天
  - 计算：日均台费收入 / 球桌数 / 小时单价

  #### 2. 客单价

  - 定义：每位客户平均消费金额
  - 纯台费客单价：30-60元
  - 含商品客单价：50-100元
  - 含助教客单价：100-200元
  - 提升：通过助教服务、商品推荐、会员充值提升

  #### 3. 会员占比

  - 定义：会员消费占总营业额比例
  - 健康水平：会员充值占日均营业额30-40%
  - 过高（>50%）：充值赠送力度过大，实际台费收入偏低
  - 过低（<20%）：会员转化不足，客户粘性弱

  #### 4. 团购占比

  - 团购占台费比例建议控制在20%以内
  - 过高说明依赖低价引流，客单价难以提升
  - 团购目的：拉新+好评，不是长期收入来源

  #### 5. 日均营业额参考

  - 小型球房（4-6张台）：3000-8000元
  - 中型球房（8-12张台）：8000-20000元
  - 大型球房（15张台以上）：15000-30000元

  ---

  ### 四、球房定位与盈利策略（PPT 4类定位）

  # PPT核心校准：球房定位只有4类——社区球房/商业球房/竞技球房/竞技商业球房
  # 以下按4类定位描述盈利策略，不再按规模大小分类

  #### 社区球房

  - 核心策略：亲民路线，服务周边居民
  - 定位：便利、性价比
  - 目标客户：散客为主
  - 台费区间：中低端
  - 助教配置：少量或无
  - 关键指标：复购率
  - 运营：自助为主，减少人工
  - 营销：抖音同城引流、学生群体裂变

  #### 商业球房

  - 核心策略：氛围+社交，助教体系是核心竞争力
  - 定位：中高端，注重环境和服务
  - 目标客户：助教客户+社交需求客户
  - 台费区间：中高端
  - 助教配置：充足（助教人数与球台数比例建议1:2以上）
  - 关键指标：助教上桌率
  - 运营：专业服务+助教团队，定期赛事和活动
  - 增值：饮品小吃、会员体系、助教课程
  - 氛围打造：商业球房氛围核心=助教数量

  #### 竞技球房

  - 核心策略：专业赛事导向，吸引竞技客户
  - 定位：专业、赛事
  - 目标客户：竞技客户+轻竞技社交客户
  - 台费区间：中端
  - 助教配置：少量
  - 关键指标：竞技客户基数
  - 运营：赛事驱动，教练体系
  - 氛围打造：竞技球房氛围核心=竞技客户基数

  #### 竞技商业球房

  - 核心策略：竞技+商业融合，兼顾专业与社交
  - 定位：综合
  - 目标客户：全类型客户
  - 台费区间：中高端
  - 助教配置：适量
  - 关键指标：综合坪效
  - 运营：助教+教练双体系并行，赛事运营+品牌化
  - 氛围打造：兼顾助教氛围和竞技氛围

  ---

  ### 五、球房经营诊断评分维度

  以下 7 个诊断维度可用于门店自检或 AI 生成诊断报告，每个维度包含核心评估项。

  #### 维度一：选址与周边环境

  - 停车位是否充足，停车是否便利
  - 周边商业球房开设情况及生意较好的竞品名称
  - 球厅面积是否与台球桌数匹配
  - 周边人流动向、客群职业、商圈成熟度
  - 层高不低于 3.5 米，柱间距不低于 7.5 米
  - 有无 24 小时电梯或独立进店通道
  - 广告位是否醒目

  #### 维度二：硬件与配置

  - 球台品牌与型号（百能 V8/V9、独牙赛台、乔氏银腿/金腿等）
  - 球台数量（含包厢台）
  - 配套区域：吧台、仓库、休息区、办公室、会议室、更衣室、修杆室、包厢、企业形象墙、助教展示区、器材展示区
  - 设备是否齐全：空调、新风、弱电、可直播回放截取设备
  - 观球椅、地毯、公用杆质量

  #### 维度三：定价体系

  - 台费定价是否合理（参考当地基础定价 +3 元，结合球台+环境+服务）
  - 不同区域（团购区/竞技区/贵宾区/包厢）定价是否有梯度
  - 助教费分等级定价（初级/中级/高级/教练）
  - 商品定价是否合理（按当地球房基础上加 0-3 元）
  - 充值赠送比例是否健康（建议赠送金额仅限台费）
  - 团购占台费比例是否控制在 20% 以内

  #### 维度四：人员架构与管理

  - 人员配置是否达标：店长、财务、主管、教练、助教、收银、服务员、保洁
  - 每 4 桌配备 1 个服务员
  - 助教数量是否充足（直接影响商业球房氛围）
  - 教练配置是否合理（竞技氛围打造）
  - 管理层是否按层级汇报：员工→部门管理→店长→老板
  - 各岗位是否有明确的工作流程与红线制度

  #### 维度五：营销与引流

  - 线上渠道是否覆盖：抖音矩阵、美团/大众点评、小红书
  - 线下渠道是否覆盖：地推、易拉宝、商家联营
  - 开业前地推是否执行（开业前 5 天，3 公里区域覆盖）
  - 团购产品设计是否合理（最多 4-5 个，设置爆款）
  - 好评维护机制是否建立（评分目标：及格 4.6、良好 4.8、优秀 4.9）
  - 助教引流是否执行：交友平台→微信→社群

  #### 维度六：服务与客户体验

  - 迎宾接待流程是否标准化
  - 服务细节：摆球、递水、巧粉放置、皮头维护
  - 卫生与环境：台面清洁、台帮擦拭、巧粉正放、气味管理
  - 音乐时间节点：10-18 点流行、18-23 点劲爆、23-2 点经典
  - 送客流程：微笑送客、来有迎声去有送语
  - 客户情绪关怀：常来客户关注、晚间场夜宵小推车

  #### 维度七：数据复盘与持续改进

  - 每日经营数据是否记录：客流量、营业额、会员新增、开台数、商品费、上课费
  - 是否建立日复盘/月复盘/年复盘机制
  - 复盘中是否形成《问题解决行动计划表》
  - 行动计划是否有明确负责人与完成时间
  - 次日/次月工作安排是否基于复盘结论调整
