  球房算账和盈利全景：收入结构（台费/助教费/商品/会员充值占比）、成本结构（房租/人工薪资/设备折旧/耗材）、翻台率客单价会员占比团购占比等关键指标的健康线、四类定位（社区/商业/竞技/竞技商业）各自的盈利策略、七维经营诊断打分、桌型和时段定价梯度（含乔氏银腿/金腿等参考价）、定价红线（不打价格战、禁大额充值赠送、尾数用9），以及助教型/竞技型/社区型三种球房「客户从哪进、靠哪个岗接、往哪转」的转化动线。
