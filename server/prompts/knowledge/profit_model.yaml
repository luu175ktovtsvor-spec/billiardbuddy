template: |
  ## 球房盈利模型知识库

  # 4类球房定位
  # 社区球房 | 商业球房 | 竞技球房 | 竞技商业球房
  # 核心卖点：氛围 + 人情世故
  # 营销框架：营(strategy) vs 销(execution)

  本知识库收录球房行业盈利模型，供 AI 生成经营建议、活动方案、定价策略时参考。

  ---

  ### 一、收入来源

  #### 1. 台位费（核心收入）

  - 按时段差异化（闲时/忙时/深夜/包夜）和桌型差异化定价
  - 桌型梯度（由低到高）：普通台 → 独牙赛台 → 乔氏银腿 → 乔氏金腿 → 包厢，具体价格由门店按当地定，留一两个引流款低价
  - 引流台数量占大厅球台数量的 1/4 或 1/5

  #### 2. 助教服务费（重要收入）

  - 助教按等级（初级/中级/高级）、教练按课时收费，具体价格因城市差异大，由门店定
  - 门店提成方式：助教每小时固定管理费、教练课时提成

  #### 3. 商品销售（补充收入）

  - 饮品小吃、球杆器材；定价由门店按当地行情和进货成本定，留一两个引流款低价

  #### 4. 会员充值（锁定长期客户）

  - 采用一卡通模式：一张卡通用台费/饮品/商品/助教，不办多种卡
  - 小比例赠送、多频次，且赠送金额仅限台位费消耗：
    - 充1000送99 / 充3000送399 / 充5000送799 / 充10000送1999（均送台费券，参考档位，因城市/门店自定）
  - ⚠️ 禁止大额充值赠送类文案：不生成"充5000送5000""充10000送10000"等大额充值赠送文案，大额充值存在资金风险和合规风险
  - 行业趋势：取消大额充值赠送，改为小额赠送+限定消费范围（赠送金额仅限台费）

  ---

  ### 二、成本结构

  #### 1. 房租（最大固定成本）

  - 谈判要点：争取免租期、阶梯租金

  #### 2. 人工成本（第二大支出）

  - 岗位：店长、教练、主管、助教、收银、服务员、保洁；具体薪资由门店按当地定
  - 助教主流为七天筛选制后按提成结算
  - 人员配置：按客流配齐服务人员，低谷减员、高峰加员

  #### 3. 设备折旧

  - 球桌（普通台/乔氏/独牙）、球杆（公用杆/品牌杆）
  - 台泥更换：看磨损判断，不定死周期（高频/竞技台磨得快，社区低频台撑得久）
  - 其他设备：空调、新风、收银系统、监控等

  #### 4. 耗材成本

  - 巧克、皮头、球杆维护耗材
  - 清洁用品
  - 水电费（空调为主要消耗）

  ---

  ### 三、关键经营指标

  > 营业额 = 台费 + 助教费 + 商品费（行业真实拆分）。下面是要盯的几个方向，健康线由门店结合自身数据判断。

  #### 1. 翻台率
  - 定义：每张球桌日均开台时长（日均台费收入 / 球桌数 / 小时单价）

  #### 2. 客单价
  - 定义：每位客户平均消费金额；通过助教服务、商品推荐、会员充值提升

  #### 3. 会员占比
  - 定义：会员消费占总营业额比例；过高说明充值赠送力度过大、实际台费偏低，过低说明会员转化不足

  #### 4. 团购占比
  - 团购目的：拉新+好评，不是长期收入来源；占比过高说明依赖低价引流，客单价难以提升

  ---

  ### 四、球房定位与盈利策略（4类定位）

  # 球房定位只有4类——社区球房/商业球房/竞技球房/竞技商业球房
  # 以下按4类定位描述盈利策略，不再按规模大小分类

  #### 社区球房

  - 核心策略：亲民路线，服务周边居民
  - 定位：便利、性价比
  - 目标客户：散客为主
  - 台费区间：中低端
  - 助教配置：少量或无
  - 关键指标：复购率
  - 运营：自助为主，减少人工
  - 营销：抖音同城引流、老带新口碑裂变

  #### 商业球房

  - 核心策略：氛围+社交，助教体系是核心竞争力
  - 定位：中高端，注重环境和服务
  - 目标客户：助教客户+社交需求客户
  - 台费区间：中高端
  - 助教配置：充足（助教数量直接决定商业球房氛围，按门店体量配足）
  - 关键指标：助教上桌率
  - 运营：专业服务+助教团队，定期赛事和活动
  - 增值：饮品小吃、会员体系、助教课程
  - 氛围打造：商业球房氛围核心=助教数量

  #### 竞技球房

  - 核心策略：专业赛事导向，吸引竞技客户
  - 定位：专业、赛事
  - 目标客户：竞技客户+追分客户
  - 台费区间：中端
  - 助教配置：少量
  - 关键指标：竞技客户基数
  - 运营：赛事驱动，教练体系
  - 氛围打造：竞技球房氛围核心=竞技客户基数

  #### 竞技商业球房

  - 核心策略：竞技+商业融合，兼顾专业与社交
  - 定位：综合
  - 目标客户：全类型客户
  - 台费区间：中高端
  - 助教配置：适量
  - 关键指标：综合坪效
  - 运营：助教+教练双体系并行，赛事运营+品牌化
  - 氛围打造：兼顾助教氛围和竞技氛围

  ---

  ### 五、球房经营诊断评分维度

  以下 7 个诊断维度可用于门店自检或 AI 生成诊断报告，每个维度包含核心评估项。

  #### 维度一：选址与周边环境

  - 停车位是否充足，停车是否便利
  - 周边商业球房开设情况及生意较好的竞品名称
  - 球厅面积是否与台球桌数匹配
  - 周边人流动向、客群职业、商圈成熟度
  - 关注层高是否够（影响采光与压抑感）、柱间距是否够（影响球台摆放与走位）
  - 有无 24 小时电梯或独立进店通道
  - 广告位是否醒目

  #### 维度二：硬件与配置

  - 球台品牌与型号（独牙赛台、乔氏银腿/金腿等）
  - 球台数量（含包厢台）
  - 配套区域：吧台、仓库、休息区、办公室、会议室、更衣室、修杆室、包厢、企业形象墙、助教展示区、器材展示区
  - 设备是否齐全：空调、新风、弱电、可直播回放截取设备
  - 观球椅、地毯、公用杆质量

  #### 维度三：定价体系

  - 台费定价是否合理（参考当地真实台费均价，结合球台+环境+服务定）
  - 不同区域（团购区/竞技区/贵宾区/包厢）定价是否有梯度
  - 助教费分等级定价（初级/中级/高级/教练）
  - 商品定价是否合理（参考当地球房基础价微调，幅度由门店按当地定）
  - 充值赠送比例是否健康（建议赠送金额仅限台费）
  - 团购占台费比例是否控制在合理范围（团购是拉新攒好评，不是长期收入，占比过高伤客单价）

  #### 维度四：人员架构与管理

  - 人员配置是否达标：店长、财务、主管、教练、助教、收银、服务员、保洁
  - 服务人员是否按客流配齐（低谷减员、高峰加员，不按"每天一样"排）
  - 助教数量是否充足（直接影响商业球房氛围）
  - 教练配置是否合理（竞技氛围打造）
  - 管理层是否按层级汇报：员工→部门管理→店长→老板
  - 各岗位是否有明确的工作流程与红线制度

  #### 维度五：营销与引流

  - 线上渠道是否覆盖：抖音矩阵、美团/大众点评、小红书
  - 线下渠道是否覆盖：地推、易拉宝、商家联营
  - 开业前地推是否执行（开业前 5 天，3 公里区域覆盖）
  - 团购产品设计是否合理（最多 4-5 个，设置爆款）
  - 好评维护机制是否建立（评分目标：及格 4.6、良好 4.8、优秀 4.9）
  - 助教引流是否执行：交友平台→微信→社群

  #### 维度六：服务与客户体验

  - 迎宾接待流程是否标准化
  - 服务细节：摆球、递水、巧粉放置、皮头维护
  - 卫生与环境：台面清洁、台帮擦拭、巧粉正放、气味管理
  - 背景音乐：按时段调整氛围
  - 送客流程：微笑送客、来有迎声去有送语
  - 客户情绪关怀：常来客户关注、晚间场夜宵小推车

  #### 维度七：数据复盘与持续改进

  - 每日经营数据是否记录：客流量、营业额、会员新增、开台数、商品费、上课费
  - 是否建立日复盘/月复盘/年复盘机制
  - 复盘中是否形成《问题解决行动计划表》
  - 行动计划是否有明确负责人与完成时间
  - 次日/次月工作安排是否基于复盘结论调整

  ---

  ### 八、定价规则体系

  #### 1. 桌型定价梯度

  普通台 → 独牙赛台 → 乔氏银腿 → 乔氏金腿 → 包厢，按桌型逐级加价，具体价格由门店确定：
  - 普通台：[请填写]元/小时
  - 独牙赛台：[请填写]元/小时
  - 乔氏银腿：[请填写]元/小时
  - 乔氏金腿：[请填写]元/小时
  - 包厢：[请填写]元/小时

  #### 2. 时段定价规则

  - 闲时：基础价或打折
  - 忙时：标准价
  - 深夜：标准价或加价
  - 包夜：固定价或按人收费

  #### 3. 团购产品设计原则

  - 品类控制在 4-5 个，太多不利于爆款积累
  - 必须有 1 个引流爆款（新人低价款）
  - 设置 2-3 个核心套餐（台费+饮品/果盘组合）
  - 设置 1 个高端体验产品（包厢/助教体验）

  #### 4. 定价红线

  - 不打价格战，不比最低价
  - 不搞大额充值赠送（充 5000 送 2000 等）
  - 用服务和氛围做差异化，不用价格做差异化
  - 价格尾数建议用"9"不用"8"（28→29）

  ### 定价操作步骤

  #### 1. 取消大额充值赠送的操作流程
  - 第一步：管理层培训，统一认知
  - 第二步：下架充值价目表
  - 第三步：向客户提示最后一次大额赠送机会
  - 第四步：后续充值改为送台费券（小额度）

  #### 2. 一卡通模式设计
  - 取消传统会员卡，改为一卡通
  - 充值金额全场通用（台费+商品+助教）
  - 赠送金额仅限消费台位费
  - 示例：充 1000 送 99、充 3000 送 399、充 5000 送 799、充 10000 送 1999

  #### 3. 线上团购产品优化
  - 页面增加场馆美图，突出球台品牌
  - 团购品类优化，设置爆款产品
  - 引流区：新人低价款，不限时段
  - 团购产品类别减少至 4-5 个
  - 管理层每天主动向客户要好评

  #### 4. 定价调整技巧
  - 价格尾数「8」调为「9」（心理定价）
  - 取消长期促销，改为阶段性活动
  - 根据实际台费均价调整，不要虚高

  ## 三种球房的客户转化入口动线

  这一节讲的不是"四类客户标签"（散客/竞技/助教/团体那套分级），而是**客户从哪个口子进店、靠哪个岗位接住、再往哪一类转化**——同样是把人盘活，但不同定位的球房，第一锚点客户不一样，决定了你该先重点养哪批人、先把人手堆在哪个岗。开店前先想清楚自己是哪一型，别照搬别人的转化路径。

  ### ① 助教型球房：助教客户为入口 → 带出竞技客 → 沉淀散客

  - **第一锚点 = 来找助教的客户**。客人冲着"有人陪打、有人教、能边玩边学"进店，入口是助教的服务和人设，不是台子便宜。
  - **接客岗位**：助教是绝对主力，前厅负责把新客分流给合适的助教。助教上钟前/中/后全流程把人服务舒服，是这型球房的命脉。
  - **转化动线**：助教把人陪出兴趣 → 一部分客人打上瘾、想进阶 → 引导进竞技群、约局对打，转成竞技客；竞技客带朋友来，又沉淀出一批稳定散客复购。
  - **先养谁、先配谁**：先堆助教、把助教梯队和服务 SOP 做扎实（助教数量和质量直接决定能接多少客、转化多少）。助教不够，入口就是空的。
  - 助教只做陪练/教学/带气氛/组局撮合约局这些服务，绝不涉及任何实际性交易——这条不碰。

  ### ② 竞技型球房：竞技客户为锚 → 带朋友来 → 筛出散客

  - **第一锚点 = 有水平、爱打比赛的竞技客**。靠球房的竞技氛围、赛事、好台子和高手扎堆吸人，客人图的是"这儿能打硬球、有对手、有圈子"。
  - **接客岗位**：教练/赛事组织者是核心，负责攒竞技客基数、组织赛事和约局、维护竞技群；前厅配合分辨新客里哪些是潜在竞技苗子。
  - **转化动线**：竞技客是锚，他们各自带朋友进店 → 朋友里筛出愿意留下的，一部分被氛围带成新竞技客、一部分转成稳定散客。圈子滚雪球，靠的是竞技客这批种子。
  - **先养谁、先配谁**：先攒竞技客基数、把竞技群和赛事节奏跑起来（基数和氛围是这型的发动机），再谈带客。基数不够，氛围立不住，带客也带不动。

  ### ③ 散客型 / 社区球房：散客为主 → 处成朋友 → 留住复购

  - **第一锚点 = 周边自然进店的散客**。靠地段、便利、价格和熟络感吃饭，客人多是附近的、顺路来玩两杆的，没那么强的进阶或竞技诉求。
  - **接客岗位**：前厅/店长是主力，靠人情味、记得住老客、把散客处成朋友；助教/教练是补充，不是主角。
  - **转化动线**：散客进店 → 通过加微信、记名字、唠家常、小恩小惠把人处成熟客朋友 → 靠熟人黏性和复购把人留住，重点是"留住"而不是"升级"。能升一部分进竞技/助教更好，但主盘是稳住复购基本盘。
  - **先养谁、先配谁**：先做熟人黏性——前厅服务、社群维护、老客触达（黏性和复购率是这型的生命线），把"附近人愿意常来"这件事做透。

  ### 三型对照（一句话记住）

  - 助教型：**入口在助教** → 先堆助教，靠服务把人陪上瘾再往竞技/散客转。
  - 竞技型：**锚点在竞技客** → 先攒竞技客基数和氛围，靠老带新滚圈子。
  - 社区型：**主盘在散客** → 先做熟人黏性，靠复购稳住基本盘。

  共同闭环（不分类型，最终都要走这条）：**单人进店 → 玩上瘾 → 组局（教练/助教撮合约局，不是当庄坐庄定盘口抽水）→ 进圈子**。第一锚点决定从哪头切入，但最后都要把孤客盘进圈子、变成离不开这家店的复购人群。
