template: |
  ## 客户档案模板

  ### 一、客户档案字段定义

  【基础信息】
  - 姓名：客户称呼
  - 电话/微信：联系方式
  - 性别：男/女
  - 初次进店时间：如"3月15日"

  【消费信息】
  - 消费频次：[客户实际到店频率描述]
  - 偏好桌型：普通台/赛台/包厢
  - 偏好助教：[助教姓名]或"无固定"
  - 偏好时段：下午/晚上/周末

  【标签信息】
  - 客户类型：散客/竞技/助教客户/追分客户
  - 球技档位：[按门店档位标注]

  【维护信息】
  - 上次到店时间：[日期]
  - 维护人：[教练/助教/店长姓名]
  - 下次预约：[日期]或"未预约"
  - 备注：[客户偏好、注意事项]

  ### 二、打标签SOP

  **谁来打：**
  - 教练：记录球技档位、客户类型、常来时间
  - 助教：记录消费偏好、性格特点、下次预约意向
  - 前厅：记录来源渠道（团购/散客/会员）、首次到店时间

  **什么时候打：**
  - 每次客户到店后更新
  - 每次助教上钟后更新
  - 每次教练服务后更新

  **打什么：**
  - 第一次到店：记录基础信息 + 来源渠道
  - 第二次到店：记录消费偏好 + 球技档位
  - 第三次及以上：更新客户类型 + 维护策略

  ### 三、备注格式参考

  微信备注格式：名字+初次进店时间+客户类型+球技档位
  示例：张哥-3月15日-竞技客户-5档

  微信描述格式：距离+消费频次+分区
  示例：3km内/每周2次/竞技区
