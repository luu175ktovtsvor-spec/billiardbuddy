key: "knowledge.customer_profile_template"
name: "客户档案模板知识库"
category: "knowledge"
variables: []
description: |
  客户档案的字段定义、打标签SOP和客户生命周期管理。
  用于AI生成客户运营内容时引用正确的档案结构。
  数据来源：行业资料中的助教管理用表和客户分类文档。

template: |
  ## 客户档案模板

  ### 一、客户档案字段定义

  【基础信息】
  - 姓名：客户称呼
  - 电话/微信：联系方式
  - 性别：男/女
  - 年龄段：18-25/25-35/35-45/45+
  - 初次进店时间：如"3月15日"

  【消费信息】
  - 消费频次：高频（每周2次以上）/中频（每周1次）/低频（每月1-2次）
  - 平均客单价：纯台费/台费+助教/台费+商品/全套
  - 偏好桌型：普通台/赛台/包厢
  - 偏好助教：[助教姓名]或"无固定"
  - 偏好时段：下午/晚上/周末

  【标签信息】
  - ABCD等级：A类（高价值活跃）/B类（中等）/C类（潜力）/D类（沉默）
  - 客户类型：散客/竞技/助教客户/追分客户/VIP
  - 球技档位：1-7档

  【维护信息】
  - 上次到店时间：[日期]
  - 维护人：[教练/助教/店长姓名]
  - 下次预约：[日期]或"未预约"
  - 备注：[客户偏好、注意事项]

  ### 二、打标签SOP

  **谁来打：**
  - 教练：记录球技档位、客户类型、常来时间
  - 助教：记录消费偏好、性格特点、下次预约意向
  - 前厅：记录来源渠道（团购/散客/会员）、首次到店时间

  **什么时候打：**
  - 每次客户到店后更新
  - 每次助教上钟后更新
  - 每次教练服务后更新

  **打什么：**
  - 第一次到店：记录基础信息 + 来源渠道
  - 第二次到店：记录消费偏好 + 球技档位
  - 第三次及以上：更新ABCD等级 + 维护策略

  ### 三、客户生命周期管理

  新客（1-3次）：
  - 目标：加微信 → 打标签 → 引导复购
  - 维护频率：每次到店后次日回访
  - 关键动作：体验问询 + 下次邀约

  成长期（4-10次）：
  - 目标：建立消费习惯 → 提升客单价
  - 维护频率：每两周1次
  - 关键动作：活动邀约 + 服务升级推荐

  成熟期（10次以上）：
  - 目标：稳定复购 → 转介绍
  - 维护频率：每周1次
  - 关键动作：人情维护 + 专属活动 + 转介绍激励

  沉默期（30天未到店）：
  - 目标：唤醒回店
  - 维护频率：每月1次
  - 关键动作：个性化回访 + 了解流失原因 + 给出回店理由

  流失期（60天以上未到店）：
  - 目标：挽回或标记流失
  - 维护频率：季度1次
  - 关键动作：最后尝试回访，了解是否可挽回

  ### 四、备注格式参考

  微信备注格式：名字+初次进店时间+客户类型+球技档位
  示例：张哥-3月15日-竞技客户-5档

  微信描述格式：距离+消费频次+分区
  示例：3km内/每周2次/竞技区
