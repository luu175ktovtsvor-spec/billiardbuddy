description: |
  店长怎么控成本、怎么自检的判断和清单。
  四块：人员人效、电费（空调为主）、器材商品损耗、成材率（台呢/皮头/巧粉/新手练废）。
  边界：具体库存数、进货价、能耗读数归收银系统/账本，这里只读不控；我们做的是"怎么控、怎么自检"。

template: |
  ## 店长成本控制与成材率（怎么控 + 怎么自检）

  店长盯四大数据（助教/教练/前厅/总营业额），其中"控成本"是利润的另一条腿。
  成本不是抠出来的，是**把每一块钱花在拉营业额上**——人员对齐客流、空调对齐人头、器材对齐使用、台呢对齐成材。
  下面给的是判断逻辑和自检动作，不做台账：具体库存数量、进货单价、电表读数从收银系统/账本看，
  本库不存这些数字，缺数字一律用占位符【请补充：XX】，不瞎编。

  ### 一、人员人效（排班对齐客流，这是最大可控成本）
  - 核心判断：**人效低 = 客流低谷还排满人 / 高峰反而缺人**。排班要贴着真实客流曲线走，不是按"每天都一样"排。
  - 自检清单：
    - 看本店客流时段分布（工作日 vs 周末、白天 vs 晚高峰），低谷时段在岗人数是不是偏多？
    - 服务员配比对不对（按客流配齐服务人员，店里实际几桌几人、对不对得上客流？数字看排班表）。
    - 助教排班对齐没：助教是营销岗，**没客流时硬排一堆助教 = 干等耗工时**；高峰缺助教 = 漏单。看当日助教上班人数 vs 当日台费。
    - 一人多岗能不能用：低谷时段前台/收银/保洁能否合并，高峰再拆。
  - 红线：人效优化是"对齐客流"不是"砍服务"。高峰期缺人导致接待掉、上钟漏，省的工资远不够赔掉的营业额。

  ### 二、电费（空调为大头，按时段开 + 按人头报备开启数）
  - 核心判断：球房电费**空调占绝对大头**，控电费基本=控空调。原则是"对齐营业时段 + 对齐在店人数"，不是一刀切不开（不开就掉氛围/掉体验）。
  - 自检清单：
    - 空调按营业时段开：开店前提前量、打烊前提前关，非营业时段不空转。
    - 按分区/按上座开：人少时只开有人的分区，空台区域的空调/灯光关掉或调低，别整层全开陪几桌人。
    - **每小时报备当前开启台数/分区数**：让前厅按在店人头动态增减开启数，这是前厅主管的日常能耗报备动作，店长抽查。
    - 设备维护降耗：滤网定期清、温度设合理区间（过低费电也不一定更舒服）。
  - 边界：具体每度电多少钱、当月用了多少度，看电表/账单，本库不存；店长做的是"开关策略对不对、有没有空转"的判断。

  ### 三、器材与商品损耗（对齐使用，盯异常）
  - 器材损耗：公用球杆、架杆、台球、三角框、灯具等。判断逻辑——**正常损耗按使用量走，异常损耗查管理**。
    - 公用杆皮头/前节磨损、杆头开裂属正常消耗，按周期换；但**球杆莫名其妙坏得多、台球少得快**，多半是看护/客户使用问题，查监控查现场，不是无脑补货。
  - 商品损耗：饮料零食、巧粉、手套、小物料等。
    - 盘点对不对得上：领用、销售、赠送（活动送的功能饮料/巧克/手套等）要能对上账，对不上就是漏记或跑冒滴漏。
    - 赠送物料是营销成本不是浪费，但要记进活动账，别和正常损耗混。
  - 自检清单：器材巡检（开店前查公用杆/灯/台是否可用）、商品定期盘点（对不上立刻查）、损耗异常时先查人/查现场再决定补货。
  - 边界：进货价、当前库存数、盘点明细归收银系统/库存表，本库只给"怎么看异常、怎么自检"的判断口径。

  ### 四、成材率（台球房真实术语，台呢/皮头/巧粉/新手练废）
  > 成材率 = 同样一块台呢、一批耗材，**能撑多少有效营业时长 / 能服务多少局**。成材率高 = 同样的器材成本产出更多台费；成材率低 = 器材没用到位就废了，钱白烧。
  - **台呢（台泥/台面绒）更换周期**：
    - **周期不定死、看磨损**：高频店、竞技局多的店磨得快，社区低频店撑得久，按实际磨损判断、不卡固定周期。
    - 影响成材率的关键：摆球/开球是否规范（暴力开球、拖球、台面放硬物最伤呢）、是否禁止台面放饮料/手机、巧粉是否乱撒。
    - 判断换不换：起球、有明显磨痕/勾丝、走球不准影响体验时换；竞技台/比赛台标准更高、换得勤；引流台/练习台可适当延后。
    - 具体几月换、上次换的日期，看门店维护记录【请补充：上次换台呢日期/各台磨损情况】。
  - **皮头耗量**：公用杆皮头是高频消耗件，打多了会磨平/打滑/掉皮，影响出杆手感和体验。
    - 控成材率：定期巡检公用杆皮头，磨平/松动及时修整或更换，别等客户投诉打滑才换（体验已经掉了）。
    - 异常判断：皮头掉得特别快，查是不是客户用法粗暴或杆本身质量问题。
  - **巧粉（巧克）耗量**：单价低但量大，是典型"看着不起眼、一年加起来不少"的耗材。
    - 常见浪费：摆得太散随手拿、客户带走、放置不规范导致碎屑浪费。
    - 控法：按台配置、放置规范（巧粉正放，碎屑少）、巡台时收拢，既省耗材又是服务细节。
  - **新手练废口径**：新手客户/新助教练球时损耗明显高于熟手——暴力击球伤台呢、频繁蹭巧粉、打坏公用杆概率高。
    - 这不是要赶走新手（新手是复购和成长的来源），而是：练习/教学尽量安排到**练习台/引流台**而非主力竞技台，把高损耗集中到"本来就用来消耗"的台上，保护好台面状态最好的台留给付费高峰和竞技客户。
    - 新助教带教时同步讲"爱护器材"，把成材率意识带进团队。

  ### 五、店长成本自检清单（每周/每月过一遍）
  - 人员：上周各时段在岗人数 vs 客流，有没有低谷排满、高峰缺人？助教上班人数 vs 当日台费匹配吗？
  - 电费：空调开启策略按时段/按分区/按人头走了吗？前厅有没有按小时报备开启数？有没有空台还全开？
  - 器材：公用杆/台/灯巡检过吗？有没有异常损耗（坏得多、少得快）？查到原因了吗？
  - 商品：盘点对得上账吗？赠送物料记进活动账了吗？
  - 成材率：各台台呢磨损情况记录了吗？皮头/巧粉耗量正常吗？新手/教学练习有没有安排到练习台？
  - 复盘：成本占营业额比例和上月比是升是降？升的话是哪一块、为什么（看数据，不拍脑袋）？

  ### 红线
  - 成本控制是"对齐经营、去掉浪费"，**不是砍服务、砍体验、砍氛围**——球房卖的就是氛围和人情世故，砍这些等于砍营业额。
  - 不编造具体数字：库存数、进货价、能耗读数、台呢更换日期等门店真实数据没有就用占位符【请补充：XX】，从收银系统/账本/维护记录看，本库不充当台账系统。
  - 不越界做收银/库存/计费系统：我们做"怎么控、怎么自检"的判断和清单，数字账由收银系统管。

dimensions:
  staff_efficiency:
    name: "人员人效"
    principle: "排班对齐真实客流曲线，不是每天一样排"
    self_check:
      - "低谷时段在岗人数是否偏多"
      - "服务员配比对不对（按客流配齐服务人员，对得上客流吗）"
      - "助教上班人数 vs 当日台费是否匹配"
      - "低谷能否一人多岗、高峰再拆"
    red_line: "对齐客流不是砍服务；高峰缺人赔掉的营业额远超省下的工资"
  electricity:
    name: "电费（空调为大头）"
    principle: "对齐营业时段 + 对齐在店人数，不一刀切不开"
    self_check:
      - "空调按营业时段开关，非营业不空转"
      - "人少只开有人分区，空台区域调低或关"
      - "前厅每小时报备开启台数/分区数，店长抽查"
      - "滤网定期清、温度设合理区间"
    boundary: "电价/用电量看电表账单，本库不存"
  equipment_goods_loss:
    name: "器材与商品损耗"
    principle: "正常损耗按使用量走，异常损耗查管理"
    self_check:
      - "器材巡检：公用杆/灯/台是否可用"
      - "商品定期盘点，对不上立刻查"
      - "赠送物料记进活动账，别和正常损耗混"
      - "异常损耗先查人查现场，再决定补货"
    boundary: "进货价/库存数/盘点明细归收银系统，本库只给自检口径"
  yield_rate:
    name: "成材率"
    definition: "同样器材成本能撑多少有效营业时长/服务多少局；高=产出更多台费"
    items:
      table_cloth:
        name: "台呢（台泥/台面绒）"
        cycle: "看磨损判断、不定死周期；竞技/比赛台勤、引流/练习台可延后"
        key_factors: "开球摆球是否规范、台面是否放饮料硬物、巧粉是否乱撒"
        replace_signal: "起球/明显磨痕勾丝/走球不准影响体验时换"
        placeholder: "上次换台呢日期与各台磨损情况【请补充】"
      cushion_tip:
        name: "皮头"
        principle: "高频消耗件，磨平/松动及时修整更换，别等投诉打滑才换"
        abnormal: "掉得特别快查客户用法或杆质量"
      chalk:
        name: "巧粉（巧克）"
        principle: "单价低量大，按台配置+放置规范+巡台收拢"
        waste: "摆太散随手拿、客户带走、碎屑浪费"
      novice_wear:
        name: "新手练废口径"
        principle: "新手/新助教练球损耗高于熟手，安排到练习台/引流台，保护主力竞技台"
        note: "不是赶走新手；新助教带教同步讲爱护器材"
    red_line: "成本控制不砍服务/体验/氛围；数字缺就占位符，不编"

dos:
  - "排班贴客流曲线，低谷减员高峰加员"
  - "空调按时段+按分区+按人头开，前厅按小时报备开启数"
  - "器材商品定期巡检盘点，异常先查人查现场"
  - "台呢看磨损定换期，竞技台勤、练习台延后"
  - "皮头巧粉巡台维护，新手教学安排到练习台/引流台"
  - "每周每月过成本自检清单，成本占比升要查原因"

donts:
  - "不砍服务/体验/氛围来省钱（球房卖的就是氛围和人情世故）"
  - "不编造库存数/进货价/能耗读数/台呢更换日期（用占位符）"
  - "不把本库当台账/收银/库存系统，数字账归收银系统"
  - "不无脑补货，先判断是正常损耗还是异常损耗"
  - "不为省电整层不开或人少全开（要对齐人头）"
