template: |
  ## 门店人员配置基准

  本知识库用于 AI 生成经营建议、人员规划时参考门店人员配置基准。
  以约 45 张球台规模为基准给出配置；门店实际台数不同的，按比例增减、不照抄。

  ---

  ### 一、满编满岗配置（约45台规模）

  - 店长 1 名
  - 前厅主管 1 名
  - 助教管理 4 名
  - 助教 40 名
  - 教练 2 名
  - 前台组长 3 名
  - 服务生 16 名
  - 收银 4 名

  ---

  ### 二、开业期分阶段到位的最小配置

  开业前期不必一步到位，按以下最小配置先把摊子支起来，再随生意爬坡补人：

  - 店长 1 名
  - 前厅主管 1 名
  - 助教管理 至少 3 名
  - 教练 2 名
  - 保洁 3 名

  ---

  ### 三、用法

  - 门店台数与 45 台差异较大时，按台数比例调整各岗位人数，不要直接照搬数字。
  - 助教数量与门店定位（商业球房靠助教数量撑氛围）强相关，可结合定位章节一起看。
