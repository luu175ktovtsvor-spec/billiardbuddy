  ## 门店规模分档适配指南

  # 核心警示：行业里流传的"标准指标"很多来自头部连锁球房（50台以上，60人助教团队）
  # 中小独立店（10-20台）生搬这套会越比越灰心，指标本身没错，但不是给你量身的
  # 本指南按台数把球房分三档，每档给适配的配置、指标阈值和运营重心
  # 规模决定资源上限，别用大店逻辑审判小店

  本知识库用于 AI 生成经营建议、诊断报告、方案规划时，根据门店台数匹配对应档位的参数与逻辑，
  避免把头部连锁标准照搬给社区小店或中型独立店。

  ---

  ### 一、三档划分标准

  | 档位 | 台数区间 | 常见形态 | 核心竞争逻辑 |
  |------|---------|---------|------------|
  | 小店档 | 10台及以下 | 社区球房、夫妻店、自助球房 | 靠熟客复购和口碑，不靠规模效应 |
  | 中店档 | 11-20台 | 独立商业球房、社区+商业混合 | 助教体系起步，效率比规模更重要 |
  | 大店档 | 21台以上 | 连锁门店、旗舰球房、竞技商业综合体 | 规模效应+多中心运营+助教矩阵 |

  ---

  ### 二、小店档（10台及以下）

  #### 经营定位
  - 这个规模的核心是把附近几条街的熟人做扎实，不是出圈做大
  - 每一个老客都是资产，流失一个比大店流失10个更伤
  - 不适合大规模助教矩阵，人多管不过来反而乱

  #### 助教配置参考
  - 建议助教人数：2-4人（视营业时间和台数利用率而定）
  - 人手精而不求多，每人必须会引流、会服务、会维客，三样都要
  - 若只有1-2台空余球桌，养超过4名助教会造成内耗（上钟不够分）
  - 七天筛选制同样适用，留下来的人重点培养，不要靠人海战术
  - 不建议设助教主管岗（人少层级多反而低效），老板或店长直管

  #### 绩效指标阈值（适配小店）
  - 翻台率及格线：3.5小时/桌/天（大店是4小时，小店客流本就少）
  - 翻台率优秀：5小时/桌/天
  - 助教人均上钟：2.5小时/天及格，4小时/天优秀（不要照搬大店的5小时标准）
  - 会员充值占营业额比例：25-35%健康（比大店略低，熟客不需要充值锁定）
  - 好评数目标：美团/抖音月度合计 ≥15条（大店可能要求50条以上，不适合小店）
  - 团购占台费比例：建议控制在25%以内（比大店略宽松，因为散客基数本身小）

  #### 定价策略
  - 台费不要以"便宜"为卖点，低价拉不来有钱的熟客
  - 定价参考当地市场中间价，不用比竞争对手便宜10块
  - 助教费定价：可以比大店低10-20元，但不要随意打折，打折容易成习惯
  - 一卡通充值：赠送比例控制在10-15%，金额别超过充1000送150
  - 团购产品：1-2个就够，爆款引流款1个、中等套餐1个，不要铺太多品类（搜索权重不集中）

  #### 运营重心
  - 第一优先：把每一个进门客户变成认识你名字的回头客（让前台/老板记住人名和偏好）
  - 第二优先：每周1-2次活动（小游戏/赠台费券/朋友圈打卡），把熟客拉进一个微信群维护
  - 第三优先：抖音同城发内容（展示球厅环境/小游戏/打球片段），周更就行，不用天天更
  - 不适合跑的动作：大型赛事（场地和人手不够支撑）、60人以上的团建（协调成本高）
  - 常见误区：看到大店搞赛事就跟风，结果人没到、奖金发出去、口碑反而差

  #### 人员结构参考
  - 老板/店长 + 1名前台/收银 + 2-4名助教 + 保洁兼职（高峰期）
  - 若规模达到8-10台且生意好，可考虑引入1名兼职教练负责竞技氛围和助教球技
  - 服务员：每4桌1人，10台球房配2-3名服务员已足够

  #### 日均营业额参考
  - 健康水平：【请补充：当地实际水平，参考值 3000-8000元/天】
  - 达到这个区间后再考虑扩台或开分店，不要在没跑稳之前急着扩张

  ---

  ### 三、中店档（11-20台）

  #### 经营定位
  - 这个规模处于"社区店往上走、连锁店没到位"的过渡带，最容易管理错位
  - 已经有条件跑助教体系，但人手和资金不够跑大店那套全套动作
  - 核心逻辑：把助教体系跑通，让助教客户撑起30%以上营业额，是这档的关键突破口
  - 竞技氛围和助教服务同步建，不要只顾一边

  #### 助教配置参考
  - 建议助教人数：6-15人（每3台球桌至少配2名助教保证有人在场迎宾）
  - 此规模建议设1名助教主管（兼职或专职），负责排班、日报、培训跟进
  - 七天筛选制执行，筛选后留下的人进保底培养期（可选方案：2个月保底后全提）
  - 重点培养2-3名口碑好的核心助教，让他们带新人，降低招聘成本
  - 助教晋级体系可简化为3级（实习/正式/高级），不需要大店的5级体系

  #### 绩效指标阈值（适配中店）
  - 翻台率及格线：4小时/桌/天，优秀：6小时/桌/天（与行业标准一致）
  - 助教人均上钟：3小时/天及格，5小时/天优秀
  - 助教费占总营业额比例：目标20-28%（如果还在15%以下，说明助教体系没跑起来）
  - 会员充值占营业额：30-40%健康水平
  - 好评数目标：月度合计 ≥30条
  - 团购占台费比例：控制在20%以内

  #### 定价策略
  - 台费可以做桌型梯度（普通台/赛台/包厢），每级差价10-20元，让客户有选择感
  - 助教费按级别分档定价（初级/中级/高级），价差10-20元，不要全部同价
  - 一卡通充值：赠送比例10-18%，充值额度设2-3档（充500/1000/3000）
  - 团购：3-5个品类，必须有1个爆款引流款（9.9-29.9元/小时），1个中端核心套餐

  #### 运营重心
  - 第一优先：跑通助教上钟流程——迎宾→体验推荐→上钟→维客（这一环跑顺了营业额自然往上走）
  - 第二优先：建立1个竞技群，教练每周组局，把竞技客户沉淀下来
  - 第三优先：抖音账号矩阵（店号+2-3个助教号），内容以助教出镜和打球片段为主
  - 第四优先：每月1-2场小型赛事（名额20-40人，奖金【请补充：XXX】元），带来新客和话题
  - 常见误区：以为台数到了就自然能跑成大店的节奏，实际上管理升级比台数扩张更难

  #### 人员结构参考
  - 店长（1人）+ 助教主管（1人）+ 前台/收银（2人，轮班制）+ 助教（6-15人）+ 教练（1人）
  - 服务员：每4桌1人，15台球房配3-4名服务员
  - 店长工作重心：数据复盘、活动策划、大客户维护，而不是每天站在前台

  #### 日均营业额参考
  - 健康水平：【请补充：当地实际水平，参考值 8000-20000元/天】
  - 若台费和助教费加起来达不到这个区间，优先检查助教上钟率和团购占比

  ---

  ### 四、大店档（21台以上）

  #### 经营定位
  - 这个规模才适合套用大多数行业内流传的"标准配置"
  - 规模效应开始显现：助教可以分组竞争、赛事可以拉到50人以上、线上矩阵可以多账号协同
  - 管理重心从"老板亲自做"转向"团队分层执行+数据驱动复盘"

  #### 助教配置参考
  - 建议助教人数：15人以上（视定位，商业球房每3台配2人以上）
  - 建议设正式助教主管岗（专职，不再兼任其他职位）
  - 助教分组制：5-8人一组，设组长，组间PK竞争（详见pk_incentive知识库）
  - 完整五级晋升体系（实习→初级→中级→高级→特级）可在此规模跑起来
  - 保底期后全提制，提成阶梯按月度上钟时长设4-5档

  #### 绩效指标阈值（适配大店，亦是行业通行标准）
  - 翻台率及格线：4小时/桌/天，优秀：6小时/桌/天
  - 助教人均上钟：4小时/天及格，6小时/天优秀
  - 助教费占总营业额比例：目标25-35%
  - 会员充值占营业额：35-45%
  - 好评数目标：月度合计 ≥60条
  - 团购占台费比例：控制在20%以内

  #### 定价策略
  - 台费做完整4档梯度（普通/赛台/银腿/金腿/包厢）
  - 助教费可做4-5档，高级/特级定价不低于当地中等商业球房的1.2倍
  - 包厢区域单独定价，加价10-20元/小时，附带饮品套餐
  - 一卡通充值：赠送比例10-20%，设4-5档充值金额，大额充值赠送台费券为主

  #### 运营重心
  - 第一优先：助教矩阵——分组PK、迎宾排班、日常培训、月度晋级常态化运转
  - 第二优先：竞技体系——教练+竞技群+月度赛事，把竞技客户基数做到可观
  - 第三优先：内容矩阵——抖音多账号（5个以上）、美团精细化运营、小红书种草
  - 第四优先：数据驱动——每日日报、每周复盘、每月经营分析会，发现问题快速调整
  - 可考虑但中小店不建议的动作：赞助性外部联赛、大型团建接待（50人以上）、品牌联名

  #### 人员结构参考
  - 店长（1人）+ 助教主管（1人）+ 教练（1-2人）+ 前台主管（1人）+ 收银（2-3人，轮班）
  - 助教：15-60人（视规模）
  - 服务员：每4桌1人，30台球房配7-8名服务员
  - 运营专员（1人，负责线上内容和数据统计）

  #### 日均营业额参考
  - 健康水平：【请补充：当地实际水平，参考值 15000-50000元/天】
  - 旗舰级别的连锁门店（50台以上）日均可超过5万元，但这是极端头部，不是普遍标准

  ---

  ### 五、跨档常见误区（防照搬）

  | 误区场景 | 问题所在 | 正确做法 |
  |---------|---------|---------|
  | 10台小店搭5级助教晋级体系 | 人少、上钟不够分、助教内卷恶化 | 简化为2-3级，先把上钟做稳 |
  | 15台中店要求月度助教上钟≥200小时 | 中店助教人均基数不同，200小时是大店标准 | 先把人均3-4小时/天做到，总时长自然达标 |
  | 8台小店每月办大型赛事 | 场地只能容纳20人，名额卖不出去，奖金白发 | 改办小游戏+台费代金券活动，频率高但成本低 |
  | 12台中店上来就跑60人助教矩阵 | 管理层不够、上钟分不开、助教提前离职 | 先稳定6-10人，跑通管理再逐步扩团队 |
  | 小店用大店好评数量指标（月≥60条）自检 | 小店客流基数不够，月15条已经很优秀 | 看好评率（好评/到店人数）更准确 |

  ---

  ### 六、判断门店当前档位的方法

  AI在生成经营建议前，先判断用户门店属于哪个档位：
  - 询问或已知台数：10台及以下→小店档，11-20台→中店档，21台以上→大店档
  - 若用户未提供台数，可从门店描述中推断（如"就我们两夫妻加两个助教"→小店档）
  - 根据档位选对应节内的指标阈值和运营建议，不要把大店标准默认套给所有人
  - 生成的建议要点出"这是根据你们X台的规模给的建议，不是大店那套"——让用户感受到是专门为他们定的
