template: |
  ## 客户类型知识库

  # 核心运营校准：4类核心客户
  # 散客 | 竞技客户 | 助教客户 | 追分客户（合规表达：轻竞技社交客户）

  本知识库收录球房4类核心客户的特征、需求和运营策略，以及散客按打球水平的4型细分，供 AI 生成话术、活动方案、客户运营建议时参考。

  ---

  ### 一、4类核心客户

  **1. 散客**
  - 单人或少数人到店，以台费消费为主，社交需求待激发。
  - 运营方向：前厅主动接待、教练/助教破冰互动、首次到店小惊喜、加微信建联沉淀私域。
  - 是其它三类客户的转化源头。

  **2. 竞技客户**
  - 球技较好，追求技术提升和竞技对抗，关注球桌品质、台泥、球杆。
  - 运营方向：教练重点维护、建竞技群、组织会员赛/抢一赛等轻竞技活动（合规表达，不涉及赌博）、提供存杆/修杆服务、引导参与赛事增加到店频次。

  **3. 助教客户**
  - 常点助教、对门店有归属感，由助教服务驱动复购。
  - 运营方向：助教主动维护、记住偏好、制造下次见面理由、后续邀约。

  **4. 追分客户（合规表达：轻竞技社交客户）**
  - 熟人之间打局、输的人付台费，娱乐社交为主，追求轻松小刺激。
  - **表达为轻竞技社交，不涉及赌博和大额输赢**。
  - 运营方向：引导从娱乐向正式赛事升级、介绍搭子群扩大社交圈、组织台费局/饮料局/小奖品挑战等轻竞技活动。

  ---

  ### 二、散客类型细分（按打球水平，初次进店）

  散客进店后按打球水平细分维护：**娱乐型 → 仅限朋友型 → 刚上瘾型 → 竞技型**。

  - **娱乐型**：偶尔来玩、不追求球技。维护要点：基础服务到位、营造轻松氛围、不过度推销。
  - **仅限朋友型**：跟着朋友来、自己兴趣一般。维护要点：照顾好带他来的那位、让他觉得这地方舒服、加微信留存。
  - **刚上瘾型**：开始对台球上心、想多打。维护要点：适时推荐助教体验/搭子局、引导参与活动、养消费习惯。
  - **竞技型**：球技不错、想进阶。维护要点：推荐竞技活动/会员赛、介绍同水平对手、按竞技客户维护。

  ---

  ### 三、转化逻辑

  ### 核心转化闭环
  引流 → 服务 → 转化 → 复购 → 裂变

  ### 通用转化逻辑

  散客 → 免费体验/小游戏 → 加微信 → 二次邀约 → 习惯到店 → 充值会员（一卡通） → 转介绍

  三条核心转化方向：
  1. 散客 → 助教服务 → 助教客户
  2. 散客 → 竞技活动 → 竞技客户
  3. 散客 → 搭子组局 → 社交客户（找搭子、抢台费，线下社交需求）

  教练部闭环：单人进店 → 上瘾 → 组局 → 进圈子。

  > 免费体验是首单养消费习惯的促销钩子，不是长期白送；助教服务只卖陪练/陪打/教学，不碰任何线下实际性交易，助教需自爱守边界。
