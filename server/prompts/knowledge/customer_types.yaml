  ## 客户类型知识库

  # PPT核心校准：4类核心客户
  # 散客 | 竞技客户 | 助教客户 | 追分客户（合规表达：轻竞技社交客户）
  # 以下9种为客户细分，均映射到上述4类核心客户：
  # 散客 ← 新客、团购客、散客、搭子
  # 竞技客户 ← 竞技客
  # 助教客户 ← VIP客户（助教驱动型）、充值客户（助教驱动型）
  # 追分客户 ← 轻竞技/台费局客户（合规表达，不涉及赌博）

  本知识库收录球房9种客户细分类型的特征、需求和运营策略，以及5条核心转化路径，供 AI 生成话术、活动方案、客户运营建议时参考。
  所有细分类型均归属于PPT定义的4类核心客户：散客、竞技客户、助教客户、追分客户（对外表达为"轻竞技社交客户"）。

  ---

  ### 一、新客（核心归类：散客）

  **特征：**
  - 首次到店或到店不超过3次
  - 对门店不熟悉，不知道设施位置、服务内容
  - 消费决策犹豫，容易被体验感影响去留
  - 来源：团购、地推、朋友推荐、路过

  **需求：**
  - 被关注和引导，不希望被冷落
  - 快速了解门店基本情况（桌型、价格、服务）
  - 良好的第一印象：环境、服务、氛围

  **运营策略：**
  - 前厅主动接待，引导选台
  - 教练/助教主动破冰，组织小游戏拉近距离
  - 首次到店小惊喜（免费体验、小饮料）
  - 加微信建联，为后续邀约打基础
  - 引导体验不同区域（引流区→贵宾区升级）

  **话术要点：**
  - 欢迎+引导为主，不急于推销充值
  - "来过我们店吗？""我帮你开台""有什么需要随时叫我"
  - 离店时加微信："下次来提前说，我帮你留台"

  ---

  ### 二、老客（核心归类：散客→助教客户/竞技客户转化阶段）

  **特征：**
  - 到店频次稳定（每周1-3次）
  - 有固定球友或搭子
  - 对门店熟悉，与部分员工有互动
  - 消费习惯已形成

  **需求：**
  - 被认出来的归属感
  - 稳定的服务质量
  - 偶尔的新鲜感和关怀

  **运营策略：**
  - 识别和称呼，记住偏好（桌号、球杆、饮品）
  - 定期回访和邀约
  - 生日关怀、节日问候
  - 引导充值会员、存杆
  - 鼓励带朋友来，转介绍激励

  **话术要点：**
  - 熟人感："又来啦""老位置帮你留着呢"
  - 自然推荐："最近上了新饮料，要不要试试"
  - 关怀提醒："好久没来了，最近忙吗"

  ---

  ### 三、竞技客（核心归类：竞技客户）

  **特征：**
  - 球技较好，追求技术提升和竞技对抗
  - 关注球桌品质、台泥状态、球杆性能
  - 有自己的社交圈，以球会友
  - 消费能力中等偏上，对价格不敏感但对体验敏感

  **需求：**
  - 高品质球桌（乔氏/独牙/斯诺克）
  - 同水平对手
  - 赛事和竞技氛围
  - 器材维护服务（修杆、换皮头）

  **运营策略：**
  - 教练重点维护，建立竞技群
  - 定期组织会员赛、抢一赛、轻竞技活动（合规表达，不涉及赌博）
  - 提供存杆、修杆服务
  - 竞技区氛围打造（高手对局、观赛区）
  - 引导参与赛事，增加到店频次

  **话术要点：**
  - 技术认同："你那个低杆真稳""最近手感不错啊"
  - 竞技引导："周六有会员赛，来不来""群里几个高手约球呢"
  - 器材推荐："皮头该换了吧""新到一批球杆，要不要试试"

  ---

  ### 四、团购客（核心归类：散客）

  **特征：**
  - 通过抖音/美团团购首次到店
  - 对价格敏感，冲着优惠来
  - 多为新手或偶尔打球
  - 到店后容易感到紧张或无所适从

  **需求：**
  - 物超所值的体验
  - 不被区别对待
  - 有人引导，不至于尴尬

  **运营策略：**
  - 前厅主动接待，与普通客户同等对待
  - 教练小游戏互动，消除紧张感
  - 团购验券后自然推荐升级体验（贵宾区、助教）
  - 加微信，后续邀约回店
  - 要好评（但要合规，不强迫）

  **话术要点：**
  - 不提"团购""优惠"标签："欢迎来打球"
  - 升级引导："要不要试试乔氏台，手感更好"
  - 离店留存："下次来不用团购了，直接找我，我帮你安排"

  ---

  ### 五、VIP客户（核心归类：助教客户）

  **特征：**
  - 充值金额大，消费频次高
  - 常点助教或包厢
  - 对门店有归属感和话语权
  - 期望被重视和尊重

  **需求：**
  - 优先预定球台
  - 专属服务（指定助教、包厢预留）
  - 生日和节日关怀
  - 参与门店决策的参与感

  **运营策略：**
  - 管理层亲自维护，定期深度沟通
  - 专属福利：优先预定、生日特权、免费存杆
  - 不定期赠送体验（新品饮料、台费券）
  - 重要活动优先邀请
  - 防止被竞品挖走

  **话术要点：**
  - 尊重感："X总来啦""您常坐的位置留着呢"
  - 专属推荐："新到了一批好杆，您先挑"
  - 关怀至上："生日那天来，我给您安排"

  ---

  ### 六、散客（核心归类：散客）

  **特征：**
  - 无固定到店规律，随机性大
  - 多为1-2人，社交需求低
  - 消费金额有限，以台费为主
  - 打完就走，与门店互动少

  **需求：**
  - 有空台就行
  - 不被过多打扰
  - 基本的礼貌服务

  **运营策略：**
  - 基础服务到位即可，不过度推销
  - 教练/助教观察后适时互动（如球技不错可推荐竞技活动）
  - 加微信留存，定期推送活动信息
  - 根据打球水平分类：娱乐型→仅限朋友型→刚上瘾型→竞技型

  **话术要点：**
  - 简洁自然："开哪桌""需要什么跟我说"
  - 适时关心："一个人打啊？我们最近有搭子局，要不要试试"
  - 不强推："加个微信吧，有空台我帮你留意"

  ---

  ### 七、搭子（核心归类：散客）

  **特征：**
  - 通过门店社群或平台找球友组局
  - 社交需求强，想认识新朋友
  - 球技参差不齐
  - 到店频次取决于是否有搭子

  **需求：**
  - 水平接近的球友
  - 轻松的社交氛围
  - 有人组织协调

  **运营策略：**
  - 建立搭子群，教练/助教做群主
  - 定期组织搭子局活动
  - 按水平分组，避免差距过大
  - "找搭子"作为品牌传播概念
  - 搭子→常客→会员的转化路径

  **话术要点：**
  - 社交引导："群里刚好有人约球，要不要一起"
  - 匹配推荐："有个水平差不多的，我帮你约"
  - 氛围营造："今晚几桌搭子局，来了不愁没人打"

  ---

  ### 八、轻竞技/台费局客户（核心归类：追分客户，合规表达为"轻竞技社交客户"）

  **特征：**
  - 熟人之间打局，输的人付台费，娱乐为主
  - 追求轻松社交、小刺激，不是严肃竞技
  - 消费金额不高但频次可能较稳定
  - 社交属性强，喜欢约朋友一起

  **需求：**
  - 轻松的社交氛围
  - 小刺激增加趣味（台费、饮料、小奖品）
  - 不涉及大额输赢，纯娱乐
  - 有搭子一起打

  **运营策略：**
  - 引导参与正式赛事，从娱乐向竞技升级
  - 介绍搭子群，扩大社交圈
  - 推荐助教体验课，提升球技增加乐趣
  - 组织台费局、饮料局、小奖品挑战等轻竞技活动
  - 表达为轻竞技社交，不涉及赌博和大额输赢

  **话术要点：**
  - 社交引导："今晚几桌台费局，来了不愁没人打"
  - 趣味推荐："输的请饮料，赢了白打，来不来"
  - 升级引导："你水平不错，周六会员赛来试试"

  ---

  ### 九、充值客户（核心归类：助教客户/散客，视充值驱动因素而定）

  **特征：**
  - 已办卡或充值，有一定忠诚度
  - 对门店有归属感，消费习惯稳定
  - 期望享受会员权益、被重视
  - 充值金额从几百到上万不等

  **需求：**
  - 享受会员权益（折扣、优先预定、专属服务）
  - 被重视和尊重
  - 权益清晰透明，不夸大不虚假
  - 防止权益缩水或被忽视

  **运营策略：**
  - 充值感谢：每次充值后发送感谢文案
  - 权益说明：清晰告知可享受的权益，不夸大、不做无法兑现的承诺
  - 专属活动邀请：VIP赛事、会员专场、新品体验
  - 防流失：关注充值客户到店频次变化，及时关怀
  - 引导续费：余额不足时提前提醒，配合优惠活动

  **话术要点：**
  - 感谢感："感谢支持，您的权益我都帮您记着呢"
  - 专属推荐："会员专场活动，优先通知您"
  - 防流失："好久没来了，余额还够打几次，有空来练练手"

  ---

  ## 客户转化路径

  ### PPT核心转化闭环
  引流 → 服务 → 转化 → 复购 → 裂变

  ### 通用转化逻辑

  散客 → 免费体验/小游戏 → 加微信 → 二次邀约 → 习惯到店 → 充值会员 → 转介绍裂变

  三种核心转化逻辑：
  1. 散客 → 助教服务 → 助教客户（异性情绪价值需求，合规表达：助教服务体验需求）
  2. 散客 → 竞技活动 → 竞技客户（技术交流需求）
  3. 散客 → 搭子组局 → 社交客户（线下社交需求）

  ### 5条核心转化路径

  **路径1：团购→私域**
  团购核销 → 加微信+进群 → 二次到店邀约 → 推荐会员卡/充值 → 老客户
  关键动作：前厅核销时自然加微信，不歧视团购客户，强调"欢迎第一次来体验"

  **路径2：团购→助教**
  团购到店 → 推荐助教体验课 → 助教跟进+复约 → 客单价翻倍
  关键动作：团购客到店时轻推荐助教体验，不强制，用"很多客户体验后觉得挺值"引导

  **路径3：单人→搭子局**
  单人客户 → 撮合凑局 → 进搭子群 → 自约习惯 → 高频到店
  关键动作：识别单人客户，推荐搭子局，按水平匹配，建立自约习惯

  **路径4：老客→高价值**
  老客户 → 推荐充值 → 邀请周赛 → 预约助教 → 带朋友来 → 大客户
  关键动作：从稳定消费升级为高价值客户，逐步引导充值、赛事、助教、转介绍

  **路径5：大客→专属维护**
  生日祝福+专属福利 → 充值续费 → VIP赛事邀请 → 转介绍激励 → 防流失
  关键动作：管理层亲自维护，专属感+被重视，防竞品挖人，转介绍激励
