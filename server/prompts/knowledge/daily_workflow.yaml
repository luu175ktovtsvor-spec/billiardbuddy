key: "knowledge.daily_workflow"
name: "前厅日常工作流程知识库"
category: "knowledge"
variables: []
description: |
  球房前厅各角色每日/每周工作清单知识库。
  球房前厅各角色每日/每周工作清单知识库。
  涵盖店长、主管、教练、收银员、服务员、助教管理等角色的日常工作流程。

  # 核心运营校准：4岗位对齐
  # 助教(assistant) | 助教管理(assistant_manager) | 店长(manager) | 教练(coach)
  # 助教核心工作：营销获客（不是陪打）
  # 助教服务定位：单独付费的增值服务

template: |
  ## 四岗每日工作流程 · 总览与索引

  说明：本条是「四岗每日流程总览 + 跨岗协同」索引。
  各岗位的逐时段细节、日报/周报模板、KPI、巡查表、SOP、赛事方案等，
  请看对应分岗知识（它们是各岗细节的唯一来源）：
  - 店长 → knowledge.daily_workflow_manager（整天流程 + 日报/周报 + 三次巡查表）
  - 教练 → knowledge.daily_workflow_coach（整天流程 + 日报 + KPI + 四套赛事方案）
  - 前厅主管 → knowledge.daily_workflow_frontdesk（整天流程 + 八项任务 + 客离复位SOP + 对讲机话术）
  - 助教管理 → knowledge.daily_workflow_assistant_manager（整天时间表 + KPI + 日报）

  ### 跨岗协同节点（一天里几个岗位互相咬合的关键点）
  - 班前例会（开班）：店长主持 → 教练/助教管理/店助参加；店长例会须在助教管理召开助教例会【之前】完成。
  - 上钟与客流：助教管理盯助教上钟与免费体验转化，教练盯加微/组局/竞技转化，前厅盯团购核销与加微——
    同一波客流分别贡献到「助教数据/教练数据/前厅数据」，最终汇到店长的总营业额。
  - 早晚班交接：前厅主管牵头交接（服务/卫生/商品/控场/团队），店长在 17:30-18:30 与早晚班领班对齐。
  - 班后例会与日报：各岗当日数据汇到店长日报；店长统看四大数据板块（助教/教练/前厅/总营业额）。

  ## 各岗位每日工作流程核心要点

  ### 店长（核心：四大数据板块）
  - 09:00-14:00：巡场→管理层例会→营业数据统计→库存盘点
  - 15:00-18:00：客户维护→早晚班交接（服务/卫生/商品/控场/团队）→线上运营
  - 19:00-23:00：迎宾接待→巡场维客→收银审核
  - 23:00后：班后例会→收尾检查→日报发送→工作笔记
  - 关键指标：助教数据、教练数据、前厅数据、总营业额

  ### 教练（核心：加微信、组局、转化竞技客户）
  - 11:00-14:00：到店巡场→参加例会→立岗定位
  - 14:00-18:00：助教球技培训→社群运营→微信运营→客户回访
  - 18:00-23:00：外场互动→活动播报→小游戏→客户邀约→竞技群维护
  - 每日KPI：加微信≥3组、邀约≥10人、朋友圈2条、竞技群1条互动

  ### 助教管理（核心：提升助教赚钱能力）
  - 14:00-15:00：管理层会议→助教部会议→督促练球
  - 15:00-18:00：迎宾安排→上钟管理→新人带教→配合待客
  - 18:00-23:00：指标督导→朋友圈/抖音检查→第一轮推荐→巡场维客
  - 每日KPI：上钟≥3h/人、免费体验5桌/人、加微信≥4/人、朋友圈2条+抖音1条

  ### 主管（核心：服务质量和卫生标准）
  - 14:00-18:00：交接班→卫生检查→电源管理→晚班例会→台尼球具维护
  - 18:00-23:00：巡场监督→摆球服务检查→卫生维护→服务响应
  - 23:00后：全场卫生检查→管理日志

extended_scenarios:
  new_manager_guide:
    name: "店长新手指南"
    user_input: "新来的店长不知道怎么上手"
    first_week:
      - "熟悉门店环境、设备、人员"
      - "了解门店定位和目标客群"
      - "查看近3个月的经营数据"
      - "与每位员工一对一沟通"
      - "了解竞对情况（周边3-5家球房）"
    first_month:
      - "建立日报制度（各岗位每天报数据）"
      - "组织第一次管理层会议"
      - "制定当月运营目标"
      - "检查并优化前厅SOP"
      - "了解助教团队状态和需求"
    first_quarter:
      - "建立完整的数据跟踪体系"
      - "优化定价策略"
      - "建立客户标签体系"
      - "制定助教PK机制"
      - "与老板建立定期汇报机制"

  cost_control:
    name: "成本控制清单"
    user_input: "成本太高了，怎么控制"
    categories:
      - category: "电费"
        control: "每小时报备空调开启数量，非营业区域关闭空调，22:00后逐步关闭部分区域灯光"
      - category: "人工"
        control: "合理排班避免冗余，高峰期增加人手、低谷期减少，助教按业绩淘汰"
      - category: "耗材"
        control: "台尼定期保养延长寿命，球杆定期维护减少损坏，商品库存避免过期"
      - category: "设备"
        control: "定期维护减少大修，球台台尼按时更换，空调定期清洗"
      - category: "营销"
        control: "优先免费渠道（朋友圈/抖音），付费推广要计算ROI，避免无效投放"

  assistant_retention:
    name: "助教离职挽留话术"
    user_input: "助教说她不想干了，怎么留"
    steps:
      - step: "了解原因"
        script: "怎么了？是有什么不开心的事吗？跟我说说"
        purpose: "先倾听，不要急着挽留"
      - step: "针对性解决"
        solutions:
          - reason: "收入低"
            response: "我看看你的上钟数据，帮你分析一下怎么提升。这个月你上了XX小时，如果能到XX小时，收入能到XX"
          - reason: "客人骚扰"
            response: "这个我来处理，你放心。我们有规定保护助教，不会让你受委屈"
          - reason: "同事关系"
            response: "我了解了，我来协调。你做好自己的事就行"
          - reason: "想换城市"
            response: "你想去哪？我们有其他城市的门店，可以帮你安排"
      - step: "给希望"
        script: "你条件不错，再坚持一下。下个月有PK活动，奖金[请填写]，以你的能力拿个名次没问题"
    principle: "先倾听→再解决→最后给希望。不要画大饼，要给具体的解决方案"

  assistant_grab_order:
    name: "助教抢单处理规则"
    user_input: "助教之间抢单怎么办"
    root_cause: "接客规则不清晰或执行不严格"
    solutions:
      - solution: "点钟优先"
        details: "客户指定的助教直接上钟，任何人不得截客"
      - solution: "未点钟客户引导自选"
        details: "客户未指定时，由前厅出示助教展示区/助教名册让客户自选，禁止助教围抢施压"
      - solution: "靠营销分客，不靠排队分客"
        details: "长期解法是提升每个助教自带客的能力（朋友圈/短视频/私域维护），自带客越多收入越高；不建议把排钟做成长期制度——排队分客会削弱助教主动获客的动力"
      - solution: "处罚机制"
        details: "发现抢单/截客行为，第一次警告，第二次罚款[请填写]，第三次开除"
      - solution: "透明公示"
        details: "接客规则公开，所有助教知晓，避免暗箱操作"
    principle: "点钟优先→引导自选→营销分客；制度清晰→执行严格→公开透明"

  assistant_speed_training:
    name: "助教速成培训计划"
    user_input: "助教球技不行，怎么快速培训"
    phases:
      - phase: "第1-3天（基础）"
        content:
          - "站位：双脚与肩同宽，身体微前倾"
          - "手架：三种手架（V型/凤眼/库边）"
          - "握杆：后手握杆位置、松紧度"
          - "运杆：匀速运杆、出杆直"
          - "瞄准：假想球瞄准法"
        target: "能稳定打进近距离直球"
      - phase: "第4-7天（进阶）"
        content:
          - "五分点练习：中袋直球10进6"
          - "基本走位：白球走到下一个目标球附近"
          - "力度控制：轻推/中力/大力的区分"
          - "常见杆法：高杆/低杆/定杆"
        target: "能完成简单清台"
      - phase: "第8-14天（实战）"
        content:
          - "蛇彩练习：按顺序打进6个球"
          - "角度球：30度/45度/60度的瞄准调整"
          - "翻袋基础：一库翻袋的线路判断"
          - "与客户对打练习"
        target: "能与3档客户正常对打"
      - phase: "第15-30天（提升）"
        content:
          - "五分点10进8"
          - "蛇彩清台"
          - "围球思路"
          - "防守意识"
        target: "达到4档水平，能独立带客户"
    daily_schedule: "14:00-15:00集中教学，15:00-16:00监督练习，16:00-17:00自由练习"