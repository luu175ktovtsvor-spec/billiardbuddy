key: "knowledge.daily_workflow"
name: "前厅日常工作流程知识库"
category: "knowledge"
variables: []
description: |
  球房前厅各角色每日/每周工作清单知识库。
  球房前厅各角色每日/每周工作清单知识库。
  涵盖店长、主管、教练、收银员、服务员、助教管理等角色的日常工作流程。

  # 核心运营校准：4岗位对齐
  # 助教(assistant) | 助教管理(assistant_manager) | 店长(manager) | 教练(coach)
  # 助教核心工作：营销获客（不是陪打）
  # 助教服务定位：单独付费的增值服务

template: |
  ## 各岗位每日工作流程核心要点

  ### 店长（核心：四大数据板块）
  - 09:00-14:00：巡场→管理层例会→营业数据统计→库存盘点
  - 15:00-18:00：客户维护→早晚班交接（服务/卫生/商品/控场/团队）→线上运营
  - 19:00-23:00：迎宾接待→巡场维客→收银审核
  - 23:00后：班后例会→收尾检查→日报发送→工作笔记
  - 关键指标：助教数据、教练数据、前厅数据、总营业额

  ### 教练（核心：加微信、组局、转化竞技客户）
  - 11:00-14:00：到店巡场→参加例会→立岗定位
  - 14:00-18:00：助教球技培训→社群运营→微信运营→客户回访
  - 18:00-23:00：外场互动→活动播报→小游戏→客户邀约→竞技群维护
  - 每日KPI：加微信≥3组、邀约≥10人、朋友圈2条、竞技群1条互动

  ### 助教管理（核心：提升助教赚钱能力）
  - 14:00-15:00：管理层会议→助教部会议→督促练球
  - 15:00-18:00：迎宾安排→上钟管理→新人带教→配合待客
  - 18:00-23:00：指标督导→朋友圈/抖音检查→第一轮推荐→巡场维客
  - 每日KPI：上钟≥3h/人、免费体验5桌/人、加微信≥4/人、朋友圈2条+抖音1条

  ### 主管（核心：服务质量和卫生标准）
  - 14:00-18:00：交接班→卫生检查→电源管理→晚班例会→台尼球具维护
  - 18:00-23:00：巡场监督→摆球服务检查→卫生维护→服务响应
  - 23:00后：全场卫生检查→管理日志

roles:
  manager:
    name: "店长"
    description: "门店全面管理负责人，核心工作是营销（拉新·转化·复购）；通过盯四大数据板块（助教数据、教练数据、前厅数据、总营业额）驱动经营，数据是抓手不是目的"
    daily_tasks:
      opening:
        time: "09:00-14:00"
        tasks:
          - task: "准时上班巡场"
            details: "提前到岗，换好制服打好考勤卡。巡场检查：场地布置、卫生、器材、消防设施、人员分配合理性、能耗合理性。发现不合理情况及时协调处理"
          - task: "组织班前管理层例会"
            details: "参会人员：教练、助教管理、店助。内容：检查仪容仪表→根据财务报表和巡查情况分配当日工作→传达活动和公司通知→激励员工状态。例会须在助教管理召开助教例会前完成"
          - task: "营业数据统计"
            details: "统计昨日数据：新客数、开台次数、开台平均时长、营业款核对、美团客户数、抖音客户数，发送至数据统计群"
          - task: "库存盘点"
            details: "检查吧台库存、烟酒饮料、消耗品，及时补货下单"
      afternoon:
        time: "15:00-18:00"
        tasks:
          - task: "客户维护"
            details: "15:00-17:00无特殊情况参与客户维护工作，重点关注到店高价值客户，亲自接待并了解需求"
          - task: "早晚班交接沟通"
            details: "17:30-18:30与早晚班领班沟通，总结当班工作：服务/卫生质量/商品及会员销售/节能控场/团队状态，总结优点给予表扬"
          - task: "线上运营"
            details: "检查美团/抖音等线上渠道回复，查看评价并回复，关注团购数据"
      evening:
        time: "19:00-23:00"
        tasks:
          - task: "迎宾接待"
            details: "19:30-20:30无特殊情况参与大厅迎宾接待工作，了解客户到店情况"
          - task: "巡场维客"
            details: "20:30后参与维护客户工作，同时兼顾巡查各部工作情况随时督促调整。检查助教上钟、迎宾、客户微信添加情况"
          - task: "收银审核"
            details: "审核当日收银数据，确保账实相符"
      closing:
        time: "23:00以后"
        tasks:
          - task: "组织班后例会"
            details: "参会人员：教练、助教管理、店助。带领团队总结当班工作，时间不宜过长"
          - task: "收尾检查"
            details: "全场灯光、空调、设备关闭检查，确保安全"
          - task: "日报发送"
            details: "完成每日个人客户数据统计并上传，发送当日经营数据和管理日志至管理群"
          - task: "工作笔记"
            details: "做好当日工作笔记，记录重点事项和待跟进事项"
    daily_report_format: |
      {store_name} · 店长日报 · {report_date}

      一、今日数据
      总营业额：[请填写]元
      台费：[请填写]元（团购占比[请填写]%）
      助教费：[请填写]元
      商品费：[请填写]元
      充值：[请填写]元
      好评：抖音[请填写]条 美团[请填写]条 大众[请填写]条
      美团评分：[请填写]  抖音评分：[请填写]

      二、各岗位数据
      助教：到岗[请填写]人，上钟[请填写]人，平均时长[请填写]h
      教练：加微信[请填写]人，组局[请填写]桌，转化竞技客户[请填写]人
      前厅：团购核销[请填写]单，加微信[请填写]人，商品销售[请填写]元

      三、今日重点
      - [做了什么活动/处理了什么问题/维护了哪些客户]

      四、发现问题
      1. [问题描述]
      2. [问题描述]

      五、明日计划
      - [明天重点要做的事]
    weekly_tasks:
      - task: "周度客户数据分析"
        frequency: "每周一"
        details: "分析上周客户数据趋势，发送分析报告至管理群"
      - task: "管理例会"
        frequency: "每周一次"
        details: "组织管理层周例会，复盘上周问题，制定本周计划"
      - task: "员工一对一沟通"
        frequency: "每周至少3人"
        details: "与员工进行一对一沟通，了解工作状态、困难、建议"
      - task: "竞争对手调研"
        frequency: "每周一次"
        details: "调研周边竞品动态，价格、活动、客流量"
    key_metrics:
      - "四大数据板块：助教数据（到岗/上钟/平均陪打时长）、教练数据（加微信/组局/转化竞技客户）、前厅数据（商品费/电费/好评数）、总营业额"
      - "美团/抖音评分和好评量"
      - "客户复购率"
      - "活动效果"
      - "员工状态和PK结果"

  supervisor:
    name: "主管"
    description: "协助店长管理日常运营"
    daily_tasks:
      morning:
        time: "14:00-18:00（中班开始）"
        tasks:
          - task: "交接班"
            details: "与早班主管交接，了解当日特殊情况、预订信息、待处理事项"
          - task: "中班卫生检查"
            details: "检查中班区域的卫生标准是否达标"
          - task: "空调/电源管理"
            details: "检查中班空调、棋牌电源、加温器电源是否关闭（非使用区域）"
          - task: "组织晚班例会"
            details: "安排晚班人员具体工作，传达店长指示和当日重点"
          - task: "台尼/球具维护"
            details: "安排台尼熨烫、桌球清洗，检查球杆皮头状态"
      evening:
        time: "18:00-23:00"
        tasks:
          - task: "巡场监督"
            details: "随时巡场，监督班次工作人员是否按流程和标准执行"
          - task: "摆球服务检查"
            details: "确保客户来店第一局有人摆球，所有区域覆盖"
          - task: "卫生维护"
            details: "随时检查烟缸、垃圾桶、休息区、茶几台面，及时安排清洁"
          - task: "服务响应"
            details: "处理客户特殊需求、投诉，及时上报店长"
      closing:
        time: "23:00以后"
        tasks:
          - task: "全场卫生检查"
            details: "下班前全场卫生检查，确保卫生符合标准"
          - task: "管理日志"
            details: "填写管理日志并提交至管理群"
    weekly_tasks:
      - task: "6S大检查"
        frequency: "每周一次"
        details: "组织全场6S大检查（整理、整顿、清扫、清洁、素养、安全）"
      - task: "排班管理"
        frequency: "每周"
        details: "制作下周排班表，确保各时段人员充足"

  coach:
    name: "教练"
    description: "负责助教球技培训、客户互动、竞技群维护、赛事活动组织。核心目标：加微信、组局、转化竞技客户"
    daily_tasks:
      opening:
        time: "11:00-14:00"
        tasks:
          - task: "到店巡场"
            details: "11:00到店，检查场地情况，巡查台球器材（球台、台布、公杆、球籽卫生），发现问题立即维修"
          - task: "仪容仪表检查"
            details: "换好制服，佩戴好工牌，参加店长班前工作例会，认真听取店长提出的每一项工作要求并严格执行"
          - task: "立岗定位"
            details: "例会后立刻进入工作岗位，课时期间及时清理烟灰缸等垃圾，提醒客人酒水摆放"
      afternoon:
        time: "14:00-18:00"
        tasks:
          - task: "助教球技培训"
            details: "14:00-17:00监督、督促助教练球，练球时长至少1小时，针对水平制定球形训练。学员进门要迎三步，说话时身体前倾15度"
          - task: "下午茶点红包"
            details: "14:00在工作群发下午茶点红包，营造团队氛围"
          - task: "线上社群运营"
            details: "群消息及时回复，邀约组局。竞技群发约球召集、赛事预告"
          - task: "微信运营"
            details: "工作微信号日常消息群发，朋友圈每日两条，每天添加3组以上新客户微信"
          - task: "球杆维修"
            details: "17:00-18:00安排用餐，维修客户球杆，避免在下午及晚上的高峰期处理球杆维修"
          - task: "客户回访"
            details: "查看客户档案情况，结合实际情况做客户回访工作"
      evening:
        time: "18:00-23:00"
        tasks:
          - task: "外场互动"
            details: "高峰期确保每一桌顾客都有教练维护到，包括翻台的顾客。与客户建立联系，加入会员，维护客户关系"
          - task: "活动播报"
            details: "20:00播报店内活动信息"
          - task: "球形挑战小游戏"
            details: "21:00组织一场球形挑战小游戏，通过小游戏发现有培养潜力的轻竞技选手"
          - task: "人才发现"
            details: "在工作日报中体现发现的潜力选手"
          - task: "客户邀约"
            details: "每天发送微信邀约信息10人以上"
          - task: "竞技群维护"
            details: "在竞技群发约球召集、技术讨论、赛事预告，保持群活跃"
      closing:
        time: "23:00以后"
        tasks:
          - task: "参加班后例会"
            details: "积极与店长沟通，对当日工作进行总结、分析、汇报"
          - task: "工作日报"
            details: "完成每日个人客户数据统计并上传，上报工作日报至工作群"
          - task: "工作笔记"
            details: "做好当日工作笔记"
    daily_kpis:
      - "每天添加新客户微信≥3组"
      - "每天邀约客户≥10人"
      - "朋友圈每日2条"
      - "每月邀约订台数达标：30台"
      - "竞技群每日至少1条互动消息"
    daily_report_format: |
      {store_name} · 教练日报 · {report_date}

      加顾客微信：[请填写]人
      组局：[请填写]桌
      小游戏：[请填写]场
      好评：抖音[请填写]条 美团[请填写]条
      朋友圈：[请填写]条
      短视频：[请填写]条
      约客到店：[请填写]人
      器材销售：[请填写]件
      转化竞技客户：[请填写]人
      新入竞技群：[请填写]人
    monthly_tasks:
      - task: "月度培训计划"
        frequency: "每月31日"
        details: "制定下月培训计划上报工作群"
      - task: "助教球技考核"
        frequency: "每月"
        details: "组织并上报助教球技考核结果"
      - task: "训练分析报表"
        frequency: "每月31日"
        details: "上报助教训练情况分析统计报表"
    difficult_situations: "参考 knowledge.assistant_difficult_situations 中的18个刁钻问题应对话术"

  cashier:
    name: "收银员"
    description: "负责前台收银、会员办理、客户接待"
    daily_tasks:
      opening:
        time: "到岗后"
        tasks:
          - task: "吧台准备"
            details: "检查收银设备、POS机、扫码枪是否正常，备好零钱"
          - task: "商品陈列"
            details: "检查吧台商品陈列、标价是否完整"
          - task: "会员系统检查"
            details: "确认会员系统正常运行，打印当日预订信息"
      during_shift:
        tasks:
          - task: "收银结算"
            details: "准确录入消费项目，确保收银无差错"
          - task: "会员办理"
            details: "主动介绍会员权益，引导客户充值办一卡通"
          - task: "客户登记"
            details: "登记新客户信息（姓名、电话、来源渠道），添加微信"
          - task: "线上回复"
            details: "美团/抖音等平台客户咨询及时回复"
          - task: "商品管理"
            details: "烟酒饮料等商品的售卖和库存管理"
      closing:
        tasks:
          - task: "日结对账"
            details: "核对当日营业额与系统数据，确保账实相符"
          - task: "交班记录"
            details: "填写交班记录，注明待处理事项"

  service_staff:
    name: "服务员"
    description: "负责场内服务、摆球、清洁等工作"
    daily_tasks:
      opening:
        time: "到岗后"
        tasks:
          - task: "区域准备"
            details: "检查所负责区域的台面、地面、座椅、烟缸是否整洁"
          - task: "物料准备"
            details: "补充巧克粉、架杆、擦球布等物料"
          - task: "灯光/空调"
            details: "检查区域灯光和空调是否正常"
      during_shift:
        tasks:
          - task: "摆球服务"
            details: "客户呼叫摆球时大声回应'来了'，跑步前往"
          - task: "客户入座服务"
            details: "客户到店第一局主动摆球，提供球杆、巧克粉"
          - task: "区域巡查"
            details: "随时观察客户需求，及时更换烟缸（超过8颗烟头）、清理垃圾桶（超过1/3）"
          - task: "客离复位"
            details: "客人离场后及时复位：摆好球、擦台面、整理座椅、清理烟缸"
          - task: "地面维护"
            details: "地面垃圾随手捡起，保持场内整洁"
      closing:
        tasks:
          - task: "区域收尾"
            details: "清理所有茶几、烟缸、垃圾桶，球杆摆放归位"
          - task: "设备关闭"
            details: "关闭区域灯光、空调"

  assistant_manager:
    name: "助教管理"
    description: "负责助教团队的日常管理、客户维护、助教推广。核心任务是提升助教赚钱的能力"
    daily_tasks:
      opening:
        time: "14:00-15:00"
        tasks:
          - task: "参加管理层会议"
            details: "14:10参加管理层会议，了解当日工作重点"
          - task: "开助教部会议"
            details: "14:30开助教部会议，安排当日工作，激励助教状态"
          - task: "助教练球督促"
            details: "督促助教练球和服务意识跟进，助教拍摄及助教客户邀约"
      afternoon:
        time: "15:00-18:00"
        tasks:
          - task: "助教迎宾安排"
            details: "安排助教迎宾排班，15:00-23:00不断岗，使用迎宾语'欢迎光临'"
          - task: "助教上钟管理"
            details: "安排助教上钟，确保每日上钟时长不低于3小时；上钟不足4小时的，免费体验需达到5桌"
          - task: "新人助教带教"
            details: "新人助教每天上钟时长不低于2小时，交友软件导微信不低于4人"
          - task: "配合服务部待客"
            details: "配合店内活动安排，协助服务部接待客户"
      evening:
        time: "18:00-23:00"
        tasks:
          - task: "助教指标督导"
            details: "检查助教每日指标：上钟≥3小时、免费体验5桌、添加微信≥4个、邀约客户≥3组"
          - task: "朋友圈/抖音检查"
            details: "助教每日发朋友圈2条、抖音1条，截图至助教群"
          - task: "第一轮助教推荐"
            details: "客户到店时进行第一轮助教推荐，现场观察客户水平→自然推荐→说明服务价值→引导体验"
          - task: "巡场走访维客"
            details: "每日巡场，走访，维客，寻找精准客户推助教上钟"
          - task: "整理助教上课表"
            details: "整理助教每日上课表，并根据助教情况进行单独约谈"
      closing:
        time: "23:00以后"
        tasks:
          - task: "助教日报"
            details: "汇总助教当日数据，发送日报至管理群"
          - task: "复盘总结"
            details: "下班复盘当日助教部门的工作情况，发现问题制定解决方案"
    daily_kpis:
