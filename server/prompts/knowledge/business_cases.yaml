template: |
  ## 商业球房运营案例知识库

  # 核心运营校准
  # 4类球房定位：社区球房 | 商业球房 | 竞技球房 | 竞技商业球房
  # 核心卖点：氛围 + 人情世故
  # 4类客户：散客 | 竞技客户 | 助教客户 | 追分客户（核心需求=赢钱/输赢刺激，门店只控金额、不当庄、不抽水、不定盘口）
  # 营销框架：营(strategy) vs 销(execution)

  本知识库收录不同规模、不同定位商业球房的运营策略与盈利模式，供 AI 生成经营建议、定位分析、运营规划时参考。

  ---

  ### 一、球房定位与赛道选择

  #### 1. 定位的核心逻辑

  - 定位是针对竞争对手，在客户头脑里建立的优势位置
  - 给客户一个选择我们的理由
  - 定位清晰后才能制定定价、人员配置、营销策略
  - 定位决定了球房的一切运营方向

  #### 2. 四大球房类型

  | 类型 | 核心卖点 | 目标客户 | 台费区间 | 助教配置 | 关键指标 |
  |------|---------|---------|---------|---------|---------|
  | 社区球房 | 亲民、便利 | 周边居民 | 中低端 | 少量或无 | 复购率 |
  | 商业球房 | 氛围、社交 | 社交+助教客户 | 中高端 | 充足 | 助教上桌率 |
  | 竞技球房 | 专业、赛事 | 竞技客户+追分客户 | 中端 | 少量 | 竞技客户基数 |
  | 竞技商业球房 | 综合 | 全类型客户 | 中高端 | 适量 | 综合坪效 |

  ---

  ### 二、球房两大核心卖点

  #### 卖点一：氛围

  氛围是商业球房的核心竞争力，氛围好客户才愿意来、愿意留、愿意消费。

  **氛围四感打造：**

  | 感官 | 打造方式 |
  |------|---------|
  | 听觉 | 背景音乐 |
  | 触觉 | 温度控制（空调舒适度，不同季节调温） |
  | 视觉 | 人气呈现（开台率、助教数量、灯光） |
  | 嗅觉 | 香氛管理（淡香型，定期更换） |

  **商业球房氛围核心：助教数量**
  - 助教数量直接决定客户体验
  - 助教偏少=客户体验差=客户流失
  - 即使淡季也要保证助教到岗率

  **竞技球房氛围核心：竞技客户基数**
  - 活跃的竞技客户群体
  - 定期组织赛事
  - 追分氛围带动消费（追分客户冲着赢钱来、爱约局，一桌热闹的台费局带活整片台子）

  #### 卖点二：人情世故

  人情世故是客户粘性的核心，让客户感受到被重视、被记住。

  **服务细节：**
  - 摆球：专业、快速、不出声
  - 递水：及时、记住偏好
  - 巧克粉：主动放置
  - 皮头维护：主动帮客户修皮头

  **社交连接：**
  - 组局：帮散客组局约球
  - 社群：维护客户微信群
  - 比赛：组织小型友谊赛

  **情绪价值：**
  - 关心客户：记住常来客户的偏好
  - 生日关怀：客户生日送祝福/小礼物
  - 长期关注：节假日问候、活动优先通知

  ---

  ### 三、四大类客户运营策略

  #### 1. 散客

  | 特征 | 运营策略 |
  |------|---------|
  | 线下社交需求 | 散客→朋友→会员转化路径 |
  | 单次消费为主 | 引导充值卡，锁定复购 |
  | 对价格敏感 | 团购引流+到店转化 |

  #### 2. 竞技客户

  | 特征 | 运营策略 |
  |------|---------|
  | 技术交流需求 | 竞技→圈子→赛事运营 |
  | 消费力中等 | 教练教学+赛事参与 |
  | 忠诚度高 | 打造竞技社群，定期组织赛事 |

  #### 3. 助教客户

  | 特征 | 运营策略 |
  |------|---------|
  | 助教服务体验需求 | 体验→习惯→充值转化 |
  | 消费力强 | 助教服务+会员充值 |
  | 忠诚度依赖助教 | 助教管理+服务标准化 |

  #### 4. 追分客户

  | 特征 | 运营策略 |
  |------|---------|
  | 核心需求=赢钱/输赢刺激（打球带彩头、图赢一把那口气） | 撮合水平相近对手约局→造热闹氛围→追分客维护话术 |
  | 消费力强、黏性高 | 引导多来开台，门店赚台费/助教费 |
  | 带动氛围 | 把追分台放显眼处、靠围观人气带活整片 |
  | 🔴 门店守红线 | 只控金额防炸店、不当庄、不抽水、不定盘口、防钓鱼（详见 knowledge.gaming_customer_ops） |

  ---

  ### 四、开业关键节点

  - 地推覆盖周边范围，传单+体验券+开业活动宣传
  - 团购产品上线（减至 4-5 个，做爆款）
  - 助教提前到位培训
  - 开业前低价预充值蓄客，开业当天即有现金流和满台客流
  - 一卡通充值推广
  - 每日复盘经营数据，好评维护