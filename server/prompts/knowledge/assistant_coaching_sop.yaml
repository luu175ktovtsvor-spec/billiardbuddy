template: |
  ## 球技培训SOP知识库

  # 核心运营校准
  # 助教核心工作：营销获客（不是陪打）
  # 助教服务定位：单独付费的增值服务

  本知识库收录台球助教球技培训的完整教学大纲、教学流程和教学话术要点，供AI生成培训计划、教学内容和考核标准时参考。

  ---

  ### 一、新手助教训练大纲（初级）

  新手助教训练流程，每项合格后进入下一项目训练。

  #### 1. 训练科目：姿势

  **手架训练：**
  - 五指张开，手背微微弓起，大拇指贴住食指第一关节
  - 球杆放于V型凹槽处即可

  **入位训练：**
  - 养成身体在进球线中间位置的习惯
  - 球杆放置在无限接近白球的位置
  - 右手握在持杆的位置，右脚脚心踩在右手正下方
  - 左脚与肩同宽向前半个脚掌的位置
  - 左手向前伸出微微弯曲摆好手架，放置在距离白球约20CM位置
  - 右手持杆手臂自然向下垂直于地面，形成右腿绷直、左腿弯曲状态

  **训练安排：**
  - 一天训练时间为8小时，每训练20分钟休息10分钟放松肌肉

  **合格标准：**
  - 白球置于开球点，训练者能熟练进行入位，且姿势标准，形成肌肉记忆

  #### 2. 训练科目：击球训练

  **训练内容：**
  - 每一次击球都要求入位
  - 练习一颗球在开球线推进底袋
  - 要求白球击打中心点响袋，动作不变形
  - 完成锁定大臂运杆，短拉短出

  **训练安排：**
  - 一天训练时间为8小时，每15颗球为一组
  - 每完成3组休息10分钟

  **合格标准：**
  - 一次性击打45颗，要求击打白球中心点响袋，中途没进重新计算

  #### 3. 训练科目：三分点

  **训练内容：**
  - 击打三分点，寻找白球与目标球的重合点，熟悉击打白球中心点
  - 每一次击球都要求入位，要求动作不变形，完成锁定大臂运杆

  **训练安排：**
  - 一天训练时间为8小时，每15颗为一组
  - 完成3组休息10分钟

  **合格标准：**
  - 一次性击打30颗三分点能稳定打进，白球移动不超过2个球位

  #### 4. 训练科目：五分点+蛇彩

  **训练内容：**
  - 五分点训练为了让训练者能够熟悉长距离的击球
  - 把白球与目标球完全重合
  - 三颗球的蛇彩为了让训练者可以有意识地进行简单的控制白球
  - 每一次击球都要求入位，五分点练习，要求动作不变形，完成锁定大臂运杆

  **训练安排：**
  - 一天训练时间为8小时，五分点每15颗为一组
  - 摆放3颗蛇彩不要求按顺序打完
  - 各完成一组休息10分钟

  **合格标准：**
  - 五分点10进4以上，三颗蛇彩5次打完一组

  #### 5. 训练科目：进阶五分点+蛇彩

  **训练内容：**
  - 五分点定杆训练，蛇彩4颗走位训练
  - 每一次击球都要求入位，要求动作不变形，完成锁定大臂运杆

  **训练安排：**
  - 一天训练时间为8小时，五分点定杆定住，完成30颗
  - 蛇彩完成4颗休息10分钟

  **合格标准：**
  - 五分点定杆10进5以上，要求有一半以上要定住
  - 五次机会打完蛇彩4颗

  ---

  ### 二、中级助教训练大纲

  **晋升标准：** 五分点要求10进5以上，蛇彩4颗能够完成

  **训练内容：**

  **五分点：**
  - 五分点定杆完成3组，15颗为一组
  - 要求每次击球退台入位，尽可能控制白球击打完以后移动不超过2个球位

  **蛇彩：**
  - 蛇彩5颗训练时要求要顺序打完
  - 5颗蛇彩完成2组休息10分钟

  **训练安排：**
  - 一天训练时间为8小时

  ---

  ### 三、高级助教训练大纲

  **晋升标准：** 五分点十进七以上，蛇彩5颗按顺序打完

  **训练内容：**
  1. 五分点高杆双下，低杆双下训练
  2. 蛇彩5颗打同一个袋口
  3. 分离角训练15度K球，白球自由球连续击打
  - 每天要求5分点高杆跟进30颗，低杆拉进袋30颗
  - 15度的角度球练习分离角K球，每颗球放在库边的每个颗星点上，按顺序K球，完成10组

  **训练安排（一天8小时）：**
  1. 五分点高低杆双下各15颗，休息10分钟
  2. 蛇彩5颗打同一个袋口完成3组，休息10分钟
  3. 分离角训练连续K球2组，休息10分钟
  4. 三分点连续击打5颗以上完成3组，休息10分钟

  ---

  ### 四、球技考核标准

  | 等级 | 五分点标准 | 蛇彩标准 |
  |------|-----------|---------|
  | 实习助教 | 需达到初级助教考核标准方可上岗 | - |
  | 初级助教 | 5分点10进3 | 蛇彩3颗球不按顺序不限袋一杆清台 |
  | 中级助教 | 5分点10进5 | 蛇彩5颗球不按顺序不限袋一杆清台 |
  | 高级助教 | 5分点10进7 | 蛇彩7颗球不按顺序不限袋一杆清台 |
  | 特级助教 | 5分点10进9 | 蛇彩9颗球按顺序不限袋一杆清台 |

  **特级助教特殊要求：** 必须在高级助教基础上连续两个月业绩达到特级助教业绩标准方可申请晋级特级助教

  ---

  ### 五、教学流程规范

  #### 教学阶段划分

  1. **集中教学时间（14:00-15:00）**：主管集中教学，助教认真听取教学内容，认真练习
  2. **监督练球时间（15:00-16:00）**：主管监督练球，根据主管指示认真、专注地练习
  3. **自由练习时间（16:00-17:00）**：可自由安排练习或对抗练习，或根据主管建议练习
  4. **在练球时间内上岗助教**：如有陪打工作应通知主管，及时开单前去
  5. **陪打结束回归**：下午2-5点之间，助教在陪打结束后，立即回到助教练球区向主管报告，参与培训

  #### 教学话术要点

  **姿势纠正话术：**
  - "注意入位，身体要在进球线中间位置"
  - "右脚脚心踩在右手正下方，左脚与肩同宽"
  - "手架距离白球约20CM，持杆手臂自然垂直于地面"

  **击球训练话术：**
  - "每一次击球都要入位，养成习惯"
  - "击打中心点响袋，动作不要变形"
  - "锁定大臂运杆，短拉短出"

  **五分点训练话术：**
  - "注意白球与目标球的重合点"
  - "控制白球走位，击打完移动不超过2个球位"
  - "定杆要求一半以上要定住"

  **蛇彩训练话术：**
  - "按顺序打完，注意走位路线"
  - "K球时注意分离角控制"
  - "连续击打时保持节奏，不要急"

  **鼓励话术：**
  - "这杆不错，保持这个节奏"
  - "进步很明显，继续加油"
  - "动作越来越标准了，肌肉记忆在形成"

  **纠正话术：**
  - "动作变形了，重新入位再来"
  - "不要急，慢慢来，动作标准比进球重要"
  - "运杆节奏不对，重新调整"

  ---

  ### 六、晋升与降级制度

  **晋升制度：**
  - 本等级连续两个月业绩考核达标，或跨越两个等级业绩可只需一个月
  - 遵守俱乐部助教部日常管理规范
  - 积极配合店内宣传、培训等工作者
  - 符合以上三点，可在当月选择一天进行球技考核，每人三次机会
  - 球技考核通过后，次日起正式提升助教等级，修改收费标准
  - 球技考核由本俱乐部教练或助教管理现场拍摄

  **降级制度：**
  - 晋级需双向考核，本等级业绩不达标给予降级
  - 下次晋级只考核业绩，不考核球技
  - 晋级只能一级一级往上升，不能跨等级（保底期除外）
  - 原球房等级过来本公司的考核：面试当天考核本等级球技，考核通过后直接按照正常晋升制度执行；不通过者保留原等级一个月，月底之前随时找助教管理重新考核，一个月不通过者于下月降级

  ---

  ### 七、助教球技速成训练基本原理

  > **为什么要速成**：台球是公认最难学的运动之一，职业选手要大量时间反复训练 + 实战才能成型。但球房招来的助教必须在**短时间内**从"零基础新手"变成"懂台球、了解知识点、会打球的初学者水平"——能跟客户互动、对抗、有球技上的交流，从而拉长开台时长、撑起陪打服务。速成课要解决的就是这个矛盾：用有针对性的课程练习 + 集中课堂讲解，**快**。

  #### 速成训练的四个目标（教练带助教，按这四条铺）

  **1. 短期内建立正确的动作模型**
  - 万事开头难——让一个从没打过球的人拿起杆，可能连母球都打不到，更不知道腿怎么站、手怎么动、姿势怎么摆。
  - 教练第一件事：用**简单易懂**的方式教会"如何站位、如何放手架、如何出杆成功打出母球"，先把基本动作模型搭起来。

  **2. 短期内掌握基本理论知识**
  - 台球牵扯的学科非常广，理论大多晦涩难懂。
  - 教练要**化繁为简**：只把日常能马上用到的、最基本的知识传授给学员就够了，**不要一章一章铺开讲**，速成阶段贪多必失。

  **3. 短期内理解（而非掌握）基本杆法原理及训练方法**
  - 用词是"理解"不是"掌握"——杆法不是十天半月能掌握的，可能要一两年甚至更久，短期授课不可能让人掌握。
  - 速成阶段要做的是：**理解原理**——各种杆法的效果是怎么实现的、每种杆法该怎么去训练，把"思想"和"训练方法"教给学员，让他知道往哪练。

  **4. 短期内掌握台球基本战术思维**
  - 台球和围棋很像：每盘都要大量思考，高手一定有大局观、有战术思想、能把握全盘。
  - 但台球又不同——它要大脑和运动肌群的协调，肌肉记忆（动作幅度、高度的统一、稳定性）只能靠长期训练，**短期练不出来**；而**思路技巧、战术思维是可以短期培训掌握的**，所以战术思维是速成课的**重点**。

  #### 能力配比认知（速成课的取舍依据）

  台球想赢，能力大致是这个配比——速成课就照这个分配精力：

  | 维度 | 占比 | 速成阶段能不能短期出成效 |
  |------|------|------------------------|
  | 技术（动作/准度/稳定性） | 约 40% | 难——靠肌肉记忆，需长期训练；速成只搭基本动作模型 |
  | 战术（全盘思路/战术思维） | 约 40% | **能**——思路技巧可短期培训掌握，是速成课重点 |
  | 心理（对战心态/心理素质） | 约 20% | 部分能——心态调整、心理素质养成需引导 |

  > **结论**：速成课别把宝全压在练准度（技术 40% 短期出不来），要把战术思维和心理这 60% 抓起来——这部分短期见效快，能最快让助教"会打、能跟客户对抗、有交流"，达到拉长开台时长的目的。
