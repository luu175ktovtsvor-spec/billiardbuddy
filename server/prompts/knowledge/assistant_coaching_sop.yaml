  把零基础新助教练成能陪客对抗的球技培训流程:初/中/高级训练大纲(姿势手架入位、击球、三分点、五分点、蛇彩走位)、每级球技考核标准(5分点10进N、蛇彩N颗清台)、教学流程时间表与各场景话术、晋升降级制度,以及"速成原理"(技术40%靠长期练不来、战术心理60%可短期出成效,所以速成重战术思维)。老板要排助教训练计划、定球技考核线、写带教话术、想清楚新助教该往哪练时用它。
