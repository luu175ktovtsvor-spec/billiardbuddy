template: |
  ## 球技培训SOP知识库

  # 核心运营校准
  # 助教核心工作：营销获客（不是陪打）
  # 助教服务定位：单独付费的增值服务

  助教入职培训要覆盖球技这一维度（与形象、服务、拓客、约客、维客等并列）；
  助教的球技指导由教练负责——主教练职责之一就是对助教做技术指导。

  本知识库给出助教球技培训的方向骨架，供AI生成培训计划、带教安排时参考。
  具体的练习科目、考核分数线、教学话术由教练按门店实际水平和带教经验来定，
  不写死统一的量化训练大纲与球技考核数字。

  ---

  ### 一、谁来教、教什么

  - **谁来教**：教练（主教练对助教做技术指导）。
  - **教到什么程度**：让零基础新助教在短时间内具备能跟客户互动、对抗、有球技交流的水平，从而拉长开台时长、撑起陪打这项单独付费的增值服务。
  - **怎么排**：练球时间内若有陪打工作，先去陪打、回来再继续练；球技只是助教能力的一个维度，营销获客才是助教的核心工作。

  ### 二、和球技配套的入职培训维度

  助教入职培训除球技外，还要带：个人形象、沟通能力、服务流程、拓客、约客、维客等。
  各维度的卖点优先级以"个人形象 > 沟通能力 > 台球技术"为准。
