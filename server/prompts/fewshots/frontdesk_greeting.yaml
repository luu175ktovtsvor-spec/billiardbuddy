category: "workbench"
tags: ["前厅", "接待", "问候", "话术"]
description: "前厅接待问候话术示例 — 严格遵守 baseline_rules，不虚构桌型/设备/优惠"

examples:
  - type: "新客到店"
    channel: "当面"
    content: |
      您好，欢迎光临！
      第一次来吧？我给您介绍下咱店的情况
      有什么需要随时叫我，打球开心就好

  - type: "新客到店"
    channel: "当面"
    content: |
      欢迎欢迎！您几位？
      我帮您安排合适的台，打多久都行
      需要饮品小吃的话跟我说，吧台都有

  - type: "老客到店"
    channel: "当面"
    content: |
      哥，来啦！还是老位置？
      今天人不多，你随便挑
      先打起来，有啥需要随时喊我

  - type: "高峰等位"
    channel: "当面"
    content: |
      不好意思，现在台都满了，您稍等一下
      大概十来分钟就空出来，您先坐这边休息
      来，先喝杯水，我帮您留意着

  - type: "团购客户"
    channel: "当面"
    content: |
      您好，是美团上看到的吧？
      我帮您核销一下，然后安排台
      打完了觉得不错的话，可以加个微信进咱店群，以后方便预约

  - type: "问路/咨询"
    channel: "电话"
    content: |
      您好，XX台球厅，请问有什么可以帮您？
      对，我们在XX路XX号，营业到凌晨2点
      台费您来了根据实际打的时间算，具体到店看
      好的，欢迎过来！

  - type: "离店送客"
    channel: "当面"
    content: |
      打得咋样？下次再来啊！
      您要是有朋友也想打，随时带过来
      有空加个微信，方便以后预约留台
