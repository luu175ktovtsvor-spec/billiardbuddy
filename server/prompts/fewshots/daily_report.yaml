key: "fewshots.daily_report"
name: "日报模板示例"
category: "fewshots"
variables: []
template: |
  ## 日报模板示例

  以下为台球房日报模板示例，供 AI 生成日报时参考。

  ---

  ### 简版日报

  - type: 简版日报
    content: |
      【XX台球 日报】2024-XX-XX
      今日客流：XX人 | 开台XX台次
      营业额：XX元（台费XX + 饮品XX + 其他XX）
      会员新增：X人 | 充值：XX元
      助教上钟：X单 | 助教收入：XX元
      备注：XX

  ### 详细日报

  - type: 详细日报
    content: |
      【XX台球 详细日报】2024-XX-XX

      一、客流与开台
      - 全天客流：XX人（同比+X%）
      - 开台台次：XX次
      - 高峰时段：XX:00-XX:00（满台率XX%）
      - 包间使用率：XX%

      二、营收明细
      - 台费收入：XX元
      - 饮品收入：XX元
      - 助教收入：XX元
      - 会员充值：XX元
      - 其他收入：XX元
      - 合计：XX元

      三、会员数据
      - 新办卡：X人
      - 续费：X人
      - 充值金额：XX元
      - 会员消费占比：XX%

      四、助教数据
      - 上钟数：X单
      - 助教收入：XX元
      - 最受欢迎助教：XXX

      五、今日亮点/问题
      - 亮点：XXX
      - 问题：XXX

      六、明日计划
      - XXX

  ### 周报模板

  - type: 周报模板
    content: |
      【XX台球 周报】第X周（XX/XX-XX/XX）

      一、本周概览
      - 总客流：XXX人（周环比+X%）
      - 总营收：XXX元（周环比+X%）
      - 日均开台：XX次

      二、会员数据
      - 新办卡：X人
      - 充值总额：XXX元
      - 会员消费占比：XX%

      三、助教数据
      - 总上钟：XX单
      - 助教收入：XXX元

      四、活动效果
      - XX活动：参与X人，带来营收XX元

      五、下周重点
      - XXX
