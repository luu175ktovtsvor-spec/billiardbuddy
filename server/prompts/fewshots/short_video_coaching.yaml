category: "workbench"
tags: ["助教", "短视频", "抖音", "宣传"]
description: "助教短视频文案示例 — 严格遵守 baseline_rules，不用擦边话术，不虚构身材/颜值描述"

examples:
  - type: "技术教学"
    channel: "抖音"
    content: |
      一分钟学会低杆
      出杆要稳，击球点偏下，送杆要够长
      跟着我练，这个杆法特别实用
      想学更多？来店里找我

  - type: "技术教学"
    channel: "抖音"
    content: |
      翻袋怎么打？看这一遍就会
      关键是找入射角，力度要柔和
      新手也能学会的技巧
      来XX台球厅，我教你

  - type: "日常打球"
    channel: "抖音"
    content: |
      今天店里人不多，打得很舒服
      你平时在哪打？来XX台球厅找我切磋
      球技就是在一次次实战中涨上去的

  - type: "日常打球"
    channel: "抖音"
    content: |
      下班后的快乐就是打球
      你有没有那种一杆清台的爽感？
      来XX台球厅，约一局

  - type: "学员成果"
    channel: "抖音"
    content: |
      学员今天第一次清台！
      练了两个月的成果，太开心了
      台球真的没那么难，找对方法就行
      想学？来店里找我

  - type: "球房氛围"
    channel: "抖音"
    content: |
      周末的XX台球厅，热闹
      打球的人多，氛围好
      你也来？我帮你留台

  - type: "约球互动"
    channel: "抖音"
    content: |
      谁想来打球？评论区举手
      我来帮你安排台位
      XX台球厅，随时约
