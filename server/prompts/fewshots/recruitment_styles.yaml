key: "fewshots.recruitment_styles"
name: "招聘图文风格样例"
category: "fewshots"
variables:
  - style
template: |
  招聘图文风格样例库。根据用户指定的 style 变量，从 examples 中匹配对应风格的文案样例注入 Prompt。
  16种风格：找搭子型/找工作搭子型/被迫入行型/求问收入型/反向吐槽型/地域选择型/抱团取暖型/急疯急迫型/动机探寻型/热门话题蹭流型/新手上路型/收入炫耀型/本地生活型/悬念好奇型/真诚安利型/时间节点焦虑型
  3个平台：小红书/抖音/朋友圈
  合规转译：qf→球房, qfzj→球房助教, zj→助教, 搞钱→提升收入
  禁用词：招聘、招人、急招、底薪、月薪、提成、高薪
  禁止出现具体电话号码和地址
examples:
  # ========== 1. 找搭子型 ==========
  - style: "找搭子型"
    platform: "小红书"
    content: |
      在同城找个球房搭子，有人一起吗？
      一个人上班太无聊了 想找个姐妹一起
      你带课我也带课 互相照应 不孤单
      同款举个手

  - style: "找搭子型"
    platform: "抖音"
    content: |
      球房助教搭子有没有啊 一个人真的要急了
      想找个搭子一起在球房上班 互相照应
      你带课我也带课 不孤单
      同款举个手

  # ========== 2. 找工作搭子型 ==========
  - style: "找工作搭子型"
    platform: "小红书"
    content: |
      找工作搭子！有没有一起的姐妹？
      想试试球房助教 一个人不太敢去
      有没有想一起的 咱们组队去了解
      互相壮胆 评论区扣1

  - style: "找工作搭子型"
    platform: "抖音"
    content: |
      同城找工作搭子！有没有一起的姐妹？
      想去球房做助教 一个人去面试好紧张
      有没有想一起的 咱们组队
      感兴趣的私信我

  # ========== 3. 被迫入行型 ==========
  - style: "被迫入行型"
    platform: "小红书"
    content: |
      找工作太难了 只能试试球房助教了
      投了好多简历都没回音 实在没办法
      听说球房助教时间比较灵活 先试试看吧
      有没有姐妹也是这样过来的

  - style: "被迫入行型"
    platform: "抖音"
    content: |
      在同城找工作太难了 只能试试球房助教了
      投了一堆简历石沉大海 真的绝望
      听说球房助教收入还行 有没有过来人说说
      是不是至少比服务员强

  # ========== 4. 求问收入型 ==========
  - style: "求问收入型"
    platform: "小红书"
    content: |
      想问一下做球房助教的姐妹 平均每个月能有多少呀？
      看到有人说月入过万是真的吗
      还是说只有头部才能赚到
      求真实数据 不要虚的

  - style: "求问收入型"
    platform: "抖音"
    content: |
      球房助教一个月到底能赚多少？
      有人说几千有人说几万 到底哪个是真的
      有没有在职的姐妹说说真实收入
      评论区聊聊 不方便说的私信也行

  # ========== 5. 反向吐槽型 ==========
  - style: "反向吐槽型"
    platform: "小红书"
    content: |
      劝退！别来做球房助教了 真的不好做
      每天要跟不同的人聊天 好累
      客人有时候要求特别多 应付不过来
      而且还要一直站着 脚疼
      所以……有没有姐妹来分担一下 我快扛不住了

  - style: "反向吐槽型"
    platform: "抖音"
    content: |
      劝退！别来做球房助教了 真的不好做
      收入高是高 但是每天要跟那么多人打交道
      社恐慎入 不过收入确实比我之前的工作强
      纠结要不要继续 有没有同行聊聊

  # ========== 6. 地域选择型 ==========
  - style: "地域选择型"
    platform: "小红书"
    content: |
      去哪个城市的球房做助教能赚到钱？
      本地的球房好像收入一般 想换个城市试试
      有没有姐妹在不同城市做过的 说说哪边好
      主要看收入和客源

  - style: "地域选择型"
    platform: "抖音"
    content: |
      去哪个地方的球房做助教收入高？
      听说一线城市机会多 但生活成本也高
      二线城市是不是性价比更高
      有经验的姐妹评论区说说你们那边情况

  # ========== 7. 抱团取暖型 ==========
  - style: "抱团取暖型"
    platform: "小红书"
    content: |
      还没找到工作的姐妹们 出来吱一声
      我也还没着落 一个人找工作真的好焦虑
      有没有想一起去球房试试的
      至少有人一起 心里踏实点

  - style: "抱团取暖型"
    platform: "抖音"
    content: |
      找搭子 40万人都在找搭子
      我做球房助教的 有没有一起的姐妹
      一个人太孤单了 想找个人互相照应
      评论区举个手 咱们组队

  # ========== 8. 急疯急迫型 ==========
  - style: "急疯急迫型"
    platform: "小红书"
    content: |
      球房助教搭子有没有 一个人真的要疯了
      急需一个搭子一起上班 互相有个照应
      有没有同城的姐妹 在线等 挺急的
      私信我！！！

  - style: "急疯急迫型"
    platform: "抖音"
    content: |
      急疯了！！球房助教搭子有没有
      马上要入职了 一个人去真的慌
      有没有姐妹一起的 求求了
      评论区留言或私信我

  # ========== 9. 动机探寻型 ==========
  - style: "动机探寻型"
    platform: "小红书"
    content: |
      做球房助教的姐妹们 为什么一开始选择做这个？
      我是实在找不到其他工作才来的
      但发现其实还不错 时间自由 收入也可以
      你们呢 是什么契机入行的

  - style: "动机探寻型"
    platform: "抖音"
    content: |
      球房助教这行 你们是怎么入的？
      我是被朋友推荐的 来了之后发现比想象中好
      收入至少比之前坐办公室强
      有没有姐妹分享下自己的入行故事

  # ========== 10. 热门话题蹭流型 ==========
  - style: "热门话题蹭流型"
    platform: "小红书"
    content: |
      找搭子话题40万人都在发 我也来凑个热闹
      我在球房做助教 有没有姐妹想一起的
      工作时间灵活 收入看自己努力
      想了解的评论区聊

  - style: "热门话题蹭流型"
    platform: "抖音"
    content: |
      热搜说今年最难就业季 我来说个冷门选择
      球房助教 入行门槛不高 收入还行
      关键是时间灵活 可以只做周末
      有没有姐妹想了解的 评论区扣1

  # ========== 11. 新手上路型 ==========
  - style: "新手上路型"
    platform: "小红书"
    content: |
      新手想试试球房助教 需要注意什么？求指点
      完全没经验 也不知道靠不靠谱
      球技一般能做吗？需要什么条件
      有没有过来人给点建议

  - style: "新手上路型"
    platform: "抖音"
    content: |
      小白想试试球房助教 求带
      球技一般 形象还可以 不知道够不够格
      正规球房会不会有培训
      有经验的姐妹说说新手入门要注意什么

  # ========== 12. 收入炫耀型 ==========
  - style: "收入炫耀型"
    platform: "小红书"
    content: |
      做球房助教第三个月 终于破万了
      第一个月才3000 第三个月质变了
      回头客多了真的不愁 现在老客户排着约
      选对行业比努力重要

  - style: "收入炫耀型"
    platform: "抖音"
    content: |
      做球房助教半年 从月薪4000到月入过万
      只换了一份工作 收入翻了两倍多
      关键是回头客养起来了 不愁没课带
      当然前提是你得会做客情

  # ========== 13. 本地生活型 ==========
  - style: "本地生活型"
    platform: "小红书"
    content: |
      有什么好吃的宵夜推荐吗？下班了跟搭子一起去吃
      在球房上班的好处就是下班晚 宵夜随便选
      有没有同城的姐妹推荐下
      咱们可以约着一起吃

  - style: "本地生活型"
    platform: "抖音"
    content: |
      同城美食推荐！球房下班后的宵夜攻略
      每天凌晨下班 宵夜店老板都认识我了
      有没有同城的姐妹 约着一起吃宵夜
      顺便聊聊球房上班的那些事

  # ========== 14. 悬念好奇型 ==========
  - style: "悬念好奇型"
    platform: "小红书"
    content: |
      球房助教这行有个真相 懂的人自然懂
      没做之前以为就是陪人打球
      做了之后才发现完全不是那回事
      想知道的评论区问我

  - style: "悬念好奇型"
    platform: "抖音"
    content: |
      球房助教这行有个真相 懂的人自然懂
      外面的人只看到收入高
      但里面有些事 只有做了才知道
      想了解真相的 评论区扣1 人多我就说

  # ========== 15. 真诚安利型 ==========
  - style: "真诚安利型"
    platform: "小红书"
    content: |
      说实话球房助教这行真的挺好的 至少比我之前的工作强
      之前在工厂站流水线 现在在球房陪人打球
      收入高了不止一点 时间还更自由
      不是广告 纯粹真心觉得适合想换工作的姐妹

  - style: "真诚安利型"
    platform: "抖音"
    content: |
      真心推荐想换工作的姐妹试试球房助教
      入行门槛不高 会聊天就行
      收入看自己努力 好的时候真的很可观
      至少不用996 时间自己安排

  # ========== 16. 时间节点焦虑型 ==========
  - style: "时间节点焦虑型"
    platform: "小红书"
    content: |
      都这个月了还没找到工作 是不是只有我这样
      看着身边人都有着落了 就我还在这飘着
      是不是该降低标准了 球房助教也考虑一下
      有没有同款的姐妹 互相安慰一下

  - style: "时间节点焦虑型"
    platform: "抖音"
    content: |
      快过年了还没着落 越来越焦虑了
      朋友推荐我去球房做助教 有点犹豫
      但再不找份工作真的来不及了
      有没有同样焦虑的姐妹 大家聊聊

  # ========== 朋友圈专用风格 ==========
  - style: "找搭子型"
    platform: "朋友圈"
    content: |
      最近球房在招姐妹 有没有想一起上班的
      时间灵活 收入还可以 关键是不用坐办公室
      有兴趣的私我 了解了解又不亏

  - style: "真诚安利型"
    platform: "朋友圈"
    content: |
      在球房上班第三个月了 比我之前的工作好太多
      时间自由 收入看自己 同事也都很好相处
      有想换工作的姐妹可以来试试 私我问详情

  - style: "收入炫耀型"
    platform: "朋友圈"
    content: |
      上个月收入又创新高了 感谢回头客们
      球房助教这行 真的是越做越顺
      想了解的私我 不骗人 真实分享

  # ========== 合规转译对照 ==========
  # 黑话→正式词转译规则（生成新文案时必须遵守）：
  # qf → 球房
  # qfzj → 球房助教
  # zj → 助教
  # 搞钱 → 提升收入/增加收入
  # 赚到米 → 有可观收入
  # 禁用词：招聘、招人、急招、底薪、月薪、提成、高薪
  # 禁止出现具体电话号码和地址
  # 禁止指导用户规避平台审核
