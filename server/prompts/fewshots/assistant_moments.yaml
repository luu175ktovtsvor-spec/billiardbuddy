# 助教朋友圈文案 few-shot 样例库
# 用途：助教发朋友圈场景的 few-shot 注入，帮助 AI 生成符合行业风格的朋友圈文案
# 原则：原文完整保留，每条标注内容类型和适用场景

key: "fewshots.assistant_moments"
name: "助教朋友圈文案样例"
category: "fewshots"
variables:
  - content_type

examples:
  # ========== 1. 趣味调侃型 ==========
  - content_type: "趣味调侃型"
    scene: "日常发圈，用自嘲和幽默吸引互动"
    content: |
      最近我怕是中了台球的"毒"，症状如下：看到圆的东西就想拿杆戳，走路都不自觉比划击球动作，和人聊天三句不离台球。谁来"救救"我，来[球厅名字]陪我大战三百回合可好？

  - content_type: "趣味调侃型"
    scene: "日常发圈，用夸张比喻制造趣味"
    content: |
      家人们，我怀疑我被台球小精灵附身了！白天想着怎么走位，晚上做梦都在解斯诺克的球局。解药嘛，就是来[球厅名字]和各位高手过过招，谁来成全我？

  - content_type: "趣味调侃型"
    scene: "日常发圈，用'病症'自嘲引发共鸣"
    content: |
      我这身体最近有点"奇怪"，只要一靠近台球厅，就立马精神抖擞；要是几天不打球，浑身就像散了架。有没有同款"病友"？速来[球厅名字]，一起"以球治病"。

  - content_type: "趣味调侃型"
    scene: "日常发圈，用俏皮话约球"
    content: |
      好烦啊 到底用什么样的手机才能收到你打球的信息🎱

  - content_type: "趣味调侃型"
    scene: "日常发圈，用反差制造趣味"
    content: |
      别人靠颜值约球，我只能靠球技约球🎱
      谁来陪我打几局？在线等

  # ========== 2. 热情邀约型 ==========
  - content_type: "热情邀约型"
    scene: "周末/节假日发圈，热情邀约到店"
    content: |
      宝子们，阳光正好，来[球厅名字]打台球呀！在这儿，不仅能尽情挥洒汗水，还能和各路高手交流球技。我在球厅等你们，不见不散哦！

  - content_type: "热情邀约型"
    scene: "周末不知道干啥的场景，用探索感吸引"
    content: |
      嘿，朋友们！周末不知道干啥？来[球厅名字]找我呀！一起在台球桌上释放活力，说不定还能解锁新的击球技巧，快来开启欢乐台球时光。

  - content_type: "热情邀约型"
    scene: "日常氛围营造，用场景感吸引到店"
    content: |
      各位台球爱好者，[球厅名字]的氛围已经拉满，球杆、球桌都在等你们大显身手。别犹豫，赶紧来，让我们一起在台球世界里尽情遨游。

  - content_type: "热情邀约型"
    scene: "晚间转场邀约，用氛围感制造期待"
    content: |
      🚦 转场通道已开启🚦
      ➲  持续热爱·玩乐不止💥
      ➲  延伸快感·重建狂欢💥
      ➲  蓄能完毕·氛围扛扛💥

  - content_type: "热情邀约型"
    scene: "日常发圈，用简洁有力的排比制造节奏感"
    content: |
      增进友谊
      消遣娱乐
      助理教练
      提升球技
      果盘饮品
      🎱欢迎来战🎱
      恭候您的光临✨

  # ========== 3. 日常感慨型 ==========
  - content_type: "日常感慨型"
    scene: "日常发圈，用情感共鸣吸引同好"
    content: |
      每一次手握球杆，都感觉像握住了全世界的快乐。在[球厅名字]，和大家一起打球的日子，就是我生活里最闪耀的时光。你们呢，是不是也一样热爱？

  - content_type: "日常感慨型"
    scene: "日常发圈，用自我超越的主题引发共鸣"
    content: |
      打台球，就像一场与自己的较量，每一次精准的击球，都是对自我的超越。在[球厅名字]这个充满热爱的地方，我不断收获着成长与满足。期待和你们一起，继续书写属于我们的台球故事。

  - content_type: "日常感慨型"
    scene: "日常发圈，用生活感悟+台球结合"
    content: |
      台球，是生活中的一抹亮色，让我在忙碌之余找到一方宁静的天地。在[球厅名字]，看着白球在球桌上划出优美的弧线，所有的烦恼都烟消云散。愿我们都能在热爱中，找到属于自己的小确幸。

  - content_type: "日常感慨型"
    scene: "日常发圈，用台球比喻人生"
    content: |
      生活就像台球🎱
      白是起点 黑是终点
      一杆下去会有收获也会有失落
      不因进而喜 不因未过而悲
      真正喜欢的是打的过程

  - content_type: "日常感慨型"
    scene: "日常发圈，用真诚打动客户"
    content: |
      做的是服务，交的是朋友，
      赢的是信任，对得起自己的付出，
      对得起客户的选择!

  # ========== 4. 展示成果型 ==========
  - content_type: "展示成果型"
    scene: "技能突破后发圈，用成就感吸引同好切磋"
    content: |
      哇塞！经过这段时间的努力，我终于掌握了高难度的"扎杆"技巧！多亏了在[球厅名字]和各位高手的切磋。有没有小伙伴想挑战一下我新技能，快来[球厅名字]找我。

  - content_type: "展示成果型"
    scene: "清台突破后发圈，用进步感激励他人"
    content: |
      今天在[球厅名字]又突破了自己，连续清台三局！这种成就感简直无法言喻。台球的魅力就在于不断挑战，不断进步。你们也快来，一起感受这奇妙的过程。

  - content_type: "展示成果型"
    scene: "团队比赛胜利后发圈，用团队感吸引加入"
    content: |
      刚在[球厅名字]和小伙伴们进行了一场激烈的双打比赛，我们默契配合，成功拿下胜利！团队作战的感觉太棒啦。台球不仅是个人的运动，更是团队的狂欢。期待更多伙伴加入我们，一起享受胜利的喜悦

  - content_type: "展示成果型"
    scene: "日常发圈，用被挑战激发胜负欲"
    content: |
      你一句太菜了 我练了一宿又一宿🎱

  - content_type: "展示成果型"
    scene: "日常发圈，用自信态度展示实力"
    content: |
      万事开头难，你打不过我也很正常

  # ========== 5. 球厅活动宣传型 ==========
  - content_type: "球厅活动宣传型"
    scene: "赛事活动宣传，用奖品和嘉宾吸引报名"
    content: |
      家人们，[球厅名字]要搞大事情啦！本周六将举办"台球争霸赛"，丰厚奖品等你拿，还有神秘嘉宾现场指导。这可是提升球技、结交高手的好机会，赶紧来报名，咱们赛场见！

  - content_type: "球厅活动宣传型"
    scene: "优惠活动宣传，用福利吸引到店"
    content: |
      [球厅名字]福利来袭！为了回馈新老顾客，即日起至月底，凡来打球的朋友，均可享受买二送一的优惠，还能参与抽奖活动，赢取高端球杆。别等了，快来享受这超值福利，尽情畅打。

  - content_type: "球厅活动宣传型"
    scene: "教学活动宣传，用专业课程吸引新手"
    content: |
      宝子们，[球厅名字]全新推出"台球教学小课堂"，由专业助教团队授课，从基础姿势到高阶技巧，包教包会。感兴趣的朋友，快来球厅报名，开启你的台球进阶之路。

  - content_type: "球厅活动宣传型"
    scene: "新店/新环境宣传，用硬件升级吸引到店"
    content: |
      包厢全新装修
      乔氏桌子已到位🎱
      全新台尼 够丝滑🎱
      助理教练球技精湛
      打累了还能坐下喝喝茶🍵
      别心动 现在就行动

  - content_type: "球厅活动宣传型"
    scene: "挑战赛宣传，用游戏规则和奖品吸引参与"
    content: |
      周五邀请您
      游戏时间20:00开始
      🎱红牛中八挑战赛🎱
      游戏规则：
      一瓶红牛即可报名参加
      守擂成功3局可获得惊喜奖励！
      守擂成功6局可获得超级大奖！
      挑战失败者，红牛累计入奖池，一直到守擂成功者出现！
      参与条件：开台即可报名
      报名方式：联系身边工作人员

  # ========== 6. 在岗服务型 ==========
  - content_type: "在岗服务型"
    scene: "日常在岗发圈，用真诚服务态度吸引客户"
    content: |
      当你需要时，希望你能想起我。
      一直没变，想我了记得打给我！
      我这里没有花言巧语，只有真诚与实意。

  - content_type: "在岗服务型"
    scene: "日常在岗发圈，用坚持和敬业打动客户"
    content: |
      每天在岗，随时恭候，
      一如既往"的坚持，
      一门心思"的奋斗，
      一丝不苟"的态度，
      不忘初心"的服务!

  - content_type: "在岗服务型"
    scene: "日常在岗发圈，用温暖语气+到店引导"
    content: |
      心存善良，万物晴朗
      从来不怕等待，只担心你不来
      每天我都会在，只为你的一句：在?
      今日敬业的我已到岗✨

  - content_type: "在岗服务型"
    scene: "日常在岗发圈，用关怀+约球引导"
    content: |
      宝，天氣漸冷 注意保暖 按時吃飯 要開心哦。
      我在球厅很想见你！

  - content_type: "在岗服务型"
    scene: "日常在岗发圈，用简洁排比制造记忆点"
    content: |
      最动听的一句话
      留个台马上到🎱
      生活需要激情
      打球需要提醒

  # ========== 7. 转场氛围型 ==========
  - content_type: "转场氛围型"
    scene: "晚间转场时段发圈，用氛围感吸引到店"
    content: |
      ►预定越早_台位越好
      ►将惊喜填满整个夜晚
      ►让快乐在这里延续
      ►让每一个夜晚都充满期待！

  - content_type: "转场氛围型"
    scene: "晚间转场时段发圈，用爆满暗示制造紧迫感"
    content: |
      💥爆满不是你来的太迟
      是你预定得太晚
      但"快乐"却永不缺席
      —转场预约·桌球—
      品质夜生活的态度

  - content_type: "转场氛围型"
    scene: "晚间转场时段发圈，用激情氛围吸引"
    content: |
      ╓转╖ ◉ 将深夜引向"精彩"
      ║场║ ◉ 将热情彻底"点燃"
      ║滴║ ◉ 欢迎回家➠新感觉
      ╙滴╜  活力四射

  - content_type: "转场氛围型"
    scene: "晚间转场时段发圈，用期待感制造到店动力"
    content: |
      当夜幕降临 烦恼全消散
      将负重卸掉 将激情点燃
      你的快乐←我来安排
      转场就是现在🎱

  # ========== 8. 情感互动型 ==========
  - content_type: "情感互动型"
    scene: "日常发圈，用俏皮话引发互动"
    content: |
      我把你当朋友 让你来打球🎱
      你已读不回是把我当粉丝吗

  - content_type: "情感互动型"
    scene: "日常发圈，用生活态度+台球结合"
    content: |
      别让生活过的只剩工作，
      却忘了快乐
      愉快周天 在线安排
      感受娱乐动感每一天夜晚
      娱乐消遣 从预定开始

  - content_type: "情感互动型"
    scene: "日常发圈，用台球热爱引发共鸣"
    content: |
      🎱总要热爱点什么，把这无趣的生活吞没！
      约球时间到～

  - content_type: "情感互动型"
    scene: "日常发圈，用真诚+幽默结合"
    content: |
      我一个干台球的🎱
      能有什么坏心思
      只盼你开开心心
      快快乐乐每一天

  - content_type: "情感互动型"
    scene: "日常发圈，用感恩打动老客户"
    content: |
      致谢书：
      这个月已经收尾 我的业绩单上 有您浓墨重彩的一笔 感恩您每一次的捧场！因为你手握无数人的微信 最终却选择了我 感谢您的长久陪伴
      因为有您收官
      下个月期待与您一路同行
