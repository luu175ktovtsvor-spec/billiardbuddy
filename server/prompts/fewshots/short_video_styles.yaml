  ## 短视频文案精选风格库

  以下为从100+条台球行业短视频文案中精选的30条，按类型标签分类，供AI生成短视频文案时参考风格和结构。

  ---

  ### 探店型

  - type: 探店型
    platform: 抖音
    content: |
      台尼都坏了，你还做什么营销？
      上周我去一家球房，定价39.9，满台率60%，看着挺热闹。打了两杆，台尼走线，球都走不直。
      我问老板：台尼多久没换了？他说：太贵了，再撑撑。
      我说：你39.9的定价，给的却是9块9的体验。客人不骂你，骂谁？
      很多老板本末倒置。天天琢磨做什么活动、搞什么营销，却连最基础的东西都做不好。
      营销是锦上添花，产品才是雪中送炭。别把顺序搞反了。

  - type: 探店型
    platform: 抖音
    content: |
      我去过一家球房，服务员培训得很好：进门鞠躬、大声问好、全程微笑。但有一个问题：我想点一杯水，叫了三遍没人理。
      这就是"伪服务"：表面功夫做足，核心需求没人管。
      客人不需要你鞠躬90度，他需要的是球台平整、灯光舒服、想喝水的时候有人递过来。
      服务不是表演，是解决问题。问题没解决，演得再好也没用。

  - type: 探店型
    platform: 抖音
    content: |
      我做了一个实验。选了三家球房，每家待了两个小时。出来之后，我问自己一个问题：如果我是客人，我还会来吗？
      第一家：球台不错，但服务员全程没笑过。不会来。
      第二家：服务员很热情，但球台走线严重。不会来。
      第三家：球台平整，服务到位，但定价太乱。不会来。
      答案其实很简单：要么体验不好，要么价格太乱，要么感受不对。

  - type: 探店型
    platform: 抖音
    content: |
      200万的店，被一张台尼干死了。
      有个老板，投了200万开球房。半年后来找我：晓天，我快撑不住了。
      我去他店里看了一圈，发现问题出在一张台尼上。大厅中间那张台，台尼磨损严重，走线偏得离谱。
      客人看见这张台，心里想的是：这家店连台尼都不换，其他地方也好不到哪去。
      一张台尼，毁了200万的投入。

  - type: 探店型
    platform: 抖音
    content: |
      28天，80万——一家店从开业到关门，就用了28天。
      开业那天，人山人海。28天后，门上贴了张纸：旺铺转让。
      为什么？开业那波热度过了，人就不来了。老板慌了，开始降价。越降越没人。
      这家店最大的问题，不是没钱、不是没人，是没脑子。没想过开业之后怎么办。

  - type: 探店型
    platform: 抖音
    content: |
      你花20万装修，却舍不得花2万培训？
      装修的时候眼睛都不眨：地板要好的、灯光要亮的、球台要乔氏的。20万砸下去，店确实漂亮。
      开业三个月，业绩开始掉。老板急了：怎么办？我说：培训一下团队吧。他问：多少钱？我说：两万。他倒吸一口凉气：这么贵？
      装修20万，是为了让客人第一次来。培训两万，是为了让客人第二次、第三次、第十次来。哪个更重要？

  ### 教学型

  - type: 教学型
    platform: 抖音
    content: |
      你觉得你缺店长？我告诉你——你缺的是自己。
      你根本不知道自己要什么。你要的是能带团队的，还是能自己干活的？你要的是听话的，还是有想法的？
      你连需求都说不清楚，招聘就是在碰运气。
      更可怕的是，你把自己该干的事，全推给店长。定位、定价、战略方向——这些是老板的活儿，不是店长的。
      想明白了，人自然就来了。

  - type: 教学型
    platform: 抖音
    content: |
      你招不到人，是因为你眼里只有"便宜"。
      你说5000，他说太贵了，有没有4000的？你选了4000的。
      结果4000的干了两个月，不行，辞了。再招，又是4000的。循环往复。
      5000的那个，能干一年，稳定、专业、省心。4000的那个，干两个月走了，你损失的不只是工资。
      便宜的人，最后都贵。贵的人，最后都便宜。

  - type: 教学型
    platform: 抖音
    content: |
      你给的钱不少，员工为什么还是没干劲？
      你给的钱，买的是什么？如果你觉得是买他的时间、他的体力，那他给你的就是这些。
      但如果你想要他的脑子、他的热情，那你给的就不能只是钱。
      给他尊重、给他成长、给他被看见、给他有盼头。钱能买到时间，买不到心。

  - type: 教学型
    platform: 抖音
    content: |
      你定的标准，员工知道吗？
      我问过很多服务员：你们店的服务标准是什么？一半人答不上来。
      什么叫好标准？是可执行的、可衡量的、可检查的。
      比如：客人进门三秒内打招呼、球台空置五分钟内复位、客人离店时说再见并邀请下次再来。
      你把标准定成"要热情"，等于没定。标准不清晰，执行就是碰运气。

  - type: 教学型
    platform: 抖音
    content: |
      你天天盯员工？盯得越紧，说明你越没系统。
      什么是系统？是你不盯着，员工也知道该干什么。
      是他早上到店，知道第一件事是检查球台；是他看到客人，知道下一步是迎上去。
      没有系统，你就得永远当"监工"。建系统的人，才有资格当老板。

  - type: 教学型
    platform: 抖音
    content: |
      你想做大，就得先学会"不做"。
      不做那些不重要的事、不做那些可以交给别人的事、不做那些没有长期价值的事。
      把精力省下来，做那几件真正重要的事：战略、方向、人才、系统。
      做对的事，比做很多事重要。

  ### 日常氛围型

  - type: 日常氛围型
    platform: 抖音
    content: |
      我从服务员做起，所以我知道你在经历什么。
      三年前，我连五分点都打不稳，被人叫"那个不会打球的店长"。
      白天带店，晚上等客人走了，一个人对着台子，一练就是两三个小时。
      打到后来，那些当初笑我的人，一个一个被我打服了。
      我教的东西，不是纸上谈兵。每一招每一式，都是在泥地里摔打过、验证过的。

  - type: 日常氛围型
    platform: 抖音
    content: |
      我不是天才，我只是摔得够多。
      第一次当店长，连五分点都打不稳。第一次带团队，管不住人。第一次做区域总，业绩没达标。
      但我有个优点：摔倒了，会爬起来看看地上有什么。
      那个五分点，我练了一个半月。那个团队，我花了半年重建。那个业绩，我复盘了十几遍。

  - type: 日常氛围型
    platform: 抖音
    content: |
      当老板，是一场一个人的修行。
      白天在店里，要微笑、要鼓励、要拍板、要扛事。晚上回到家，一个人坐着，想说话，不知道跟谁说。
      所有的压力、焦虑、迷茫，都得自己消化。
      有一次，一个老板半夜给我发消息：晓天，我快撑不住了。我问他怎么了。他说：没怎么，就是累。
      就两个字：累。但我知道，这个累，不是身体累，是心累。

  - type: 日常氛围型
    platform: 抖音
    content: |
      你扛着所有人的未来，却没人问你累不累。
      有个女老板，店里三十多号人。每天早上第一个到，晚上最后一个走。
      有一天她实在扛不住了，在办公室哭。有个员工进来，看见她哭，愣了一下，转身走了。
      后来她听见他在外面跟别人说：老板好像心情不好，别惹她。
      她不是要他们安慰她。她只是希望有个人问一句：你还好吗？

  - type: 日常氛围型
    platform: 抖音
    content: |
      你的店还没倒，你先倒了——值吗？
      我认识一个老板，拼了三年，店终于做起来了。但他自己，进了医院。
      胃出血、失眠、焦虑、高血压。三十多岁的人，身体像五十岁。
      你拼了命把店做起来，最后却无福享受。值吗？

  ### 活动宣传型

  - type: 活动宣传型
    platform: 抖音
    content: |
      你的活动为什么做一次死一次？
      你原价39.9，活动价19.9。客人来了，体验挺好。活动结束，恢复39.9。客人一看：凭什么？
      你降价的时候，其实是在告诉客人：你的正常价格是虚高的。
      活动应该是"增值"，不是"降价"。你可以送东西、可以搞比赛、可以做会员日，但不能直接砍价。
      真正好的活动，是让客人觉得"值"，不是让客人觉得"便宜"。

  - type: 活动宣传型
    platform: 抖音
    content: |
      客人要的不是便宜，是"占便宜"的感觉。
      你定价39.9，今天搞活动送瓶水，他觉得占便宜了，开心。你定价39.9，今天降价到19.9，他也开心。但明天恢复39.9，他会觉得亏了。
      同样是让利，结果完全不一样。送水是"增值"，降价是"贬值"。
      便宜是暂时的，被重视是长久的。

  - type: 活动宣传型
    platform: 抖音
    content: |
      2026年，台球行业进入淘汰赛。
      全国人大刚刚建议：把台球厅纳入未成年人重点保护场所。
      那些指着夜场赚钱的店、那些靠擦边引流的人——这轮洗牌，第一个被清场的就是他们。
      每一次政策收紧，都是专业选手的机会。你的店，准备好了吗？

  - type: 活动宣传型
    platform: 抖音
    content: |
      你被隔壁卷死了，是因为你只有价格。
      如果说你只能靠价格留住客人，那你活该被卷死。因为你没有自己的护城河。
      什么是护城河？是服务、是氛围、是某个员工的笑脸、是你记住他喜欢喝什么茶。
      这些东西，隔壁卷不走。

  - type: 活动宣传型
    platform: 抖音
    content: |
      我在杭州开了一家"台球医院"。不是治球，是治球房。
      很多老板找我，电话里聊半天，回去一落地发现哪哪儿都对不上。
      因为球房的病，和人的病一样——没法远程问诊。
      你来杭州，我当面看。带着你的数据、你的痛点、你的困惑。坐下来，咱们一个一个拆。

  ### 个人IP型

  - type: 个人IP型
    platform: 抖音
    content: |
      三万多？太贵了？那我问你：你招错一个店长，亏多少钱？
      你把内训当成了"给店长发工资"，所以你觉得贵。但内训的真正买家，不是店长，是你自己。
      招一个店长，试用期两个月，他能不能干满都是未知数。你自己摸索，踩坑交学费。一个选址错误，亏几十万。
      内训是什么？三天时间，把你整个团队的认知拉到同一个频率。这不是成本，这是投资。

  - type: 个人IP型
    platform: 抖音
    content: |
      你不是不行，你只是太急了。
      你开店多久了？半年。你知道隔壁那家，做了多久才起来吗？三年。
      你只看见别人起来了，没看见别人爬了多久。
      给自己一点时间，给店一点时间。

  - type: 个人IP型
    platform: 抖音
    content: |
      你焦虑，是因为你在跟别人比。
      隔壁满台了，你焦虑。同行开分店了，你焦虑。别人发视频火了，你焦虑。
      但你想过没有：你拿自己的起点，跟别人的终点比，怎么可能不焦虑？
      跟自己比：上个月满台率50%，这个月55%，你就赢了。

  - type: 个人IP型
    platform: 抖音
    content: |
      你做了三个月就想赚钱，人家做了三年才开始赚。
      快的，半年到一年；慢的，两到三年。三年才开始赚钱的，比比皆是。
      你想三个月赚钱，就只能做短期有利、长期有害的事。真正能活下来的店，都是愿意熬的。
      你想赚快钱，就得接受快钱来得快去得也快。

  - type: 个人IP型
    platform: 抖音
    content: |
      你所谓的"坚持"，其实就是"死扛"。
      坚持是有方向的，死扛是没出路的。
      坚持是我知道问题在哪儿，我在解决；死扛是我不知道问题在哪儿，但我还在熬。
      如果是死扛，早点承认。因为死扛扛到最后，只有一个结果：死。

  - type: 个人IP型
    platform: 抖音
    content: |
      你每天都在"假装开店"。
      早上到店，转一圈，看看有没有人。没人，叹口气，回办公室刷手机。有人，坐着看一会儿。晚上发条朋友圈：今天又是充实的一天。
      你今天干了什么？思考过定价吗？分析过数据吗？培训过员工吗？
      你只是在"在场"，不是在"经营"。
