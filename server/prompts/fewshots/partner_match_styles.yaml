key: "fewshots.partner_match_styles"
name: "搭子群文案 fewshot"
category: "fewshots"
variables:
  - store_name
  - city
  - tone
description: |
  从搭子群社群运营文案资料精选20条，按风格标签分类。
  用于生成台球搭子群招募文案、朋友圈文案、社群运营文案。

examples:
  - style: "直击痛点型"
    content: "找个长期台球搭子，要求如下：时间白天12:00-23:00随时可约；地点{city}全域；技术1-3档最好，人菜瘾大优先；氛围饮料我请，脾气要好，开得起玩笑；台费随意，我出都行（或者AA也ok）；规则纯娱乐局，不赌！别问在不在，直接滴滴我，带上你的档位和区域，今晚有空就直接冲！"
  - style: "人菜瘾大型"
    content: "人菜瘾大，技术大概在1-3档之间浮动。虽然菜，但是态度好，输球了不仅不甩脸子，还会主动递水。对你的期望：别是职业选手（我怕我自卑）；别嫌弃我（我会进步的！）；男女不限，只要你也爱开玩笑，咱们边打边唠嗑。台费随意，哥/姐不差这点，开心最重要。坐标{city}，附近的球友速来把我带走！"
  - style: "结构化信息型"
    content: "【时间】12:00-23:00\n【坐标】{city}\n【技术】1-3档，娱乐局\n【性格】脾气好，能唠嗑\n【禁忌】不赌钱！纯属为了出汗+解压\n评论或私信：发你的档位+区域，我看离得近的直接拉群/约球"
  - style: "拒绝鸽子型"
    content: "受够了'下次一定'的球友？每次约球都说忙，等人的时间比打球时间还长。来{city}真球友群，都是'人菜瘾大'的急性子，只要你喊，立马有人应战。私信我'台球'，拉你进群，今晚就约起来！"
  - style: "社恐友好型"
    content: "社恐福音！只想安静打球不想尬聊？我们群规矩很简单：约球→开台→打完AA→下次再约。不查户口，不搞推销，只谈球技（或者菜鸡互啄）。私信我'台球'，拉你进群，今晚就约起来！"
  - style: "收留型"
    content: "{city}台球'孤儿'收容所开放了！一个人打球像练球，两个人打球才叫娱乐。无论你是1档菜鸟还是5档大腿，这里都有你的位置。私信我'台球'，拉你进群，今晚就约起来！"
  - style: "心碎收留型"
    content: "收留{city}心碎台球人。收留那些被朋友放鸽子的、想打球找不到人的、人菜瘾大怕被嫌弃的。私信我'台球'，拉你进群，今晚就约起来！"
  - style: "失恋发泄型"
    content: "失恋了？失业了？来打球发泄！群里都是'虽然技术菜但很会安慰人'的戏精，包你打完球心情舒畅。私信我'台球'，拉你进群，今晚就约起来！"
  - style: "娱乐局招募型"
    content: "{city}球友！别卷了，来打娱乐局！受够了跟职业哥打球被清台的屈辱吗？进群！我们这里主打1-3档菜鸡互啄，偶尔也有大佬当教练，主打一个快乐台球。私信我'台球'，拉你进群，今晚就约起来！"
  - style: "新手欢迎型"
    content: "刚来{city}，想找几个台球搭子一起打台球。台费算我的抢一个也行。搭子来搭子来，搭子从四面八方来。"
  - style: "下班解压型"
    content: "下班不想回家？约场台球呗！不用专业，主打放松解压，输了请喝饮料，赢了帮你拍高光视频。新手小白也欢迎，一起边玩边唠。"
  - style: "长期有效型"
    content: "一杆清台太难，但和你打球很简单，寻找稳定长期台球搭子，长期有效。时间随缘，球品优先，有空就冲，快乐至上。"
  - style: "氛围感型"
    content: "台球搭子在哪里？技术无所谓，主打快乐到位。会出杆，会唠嗑，不迟到，不跑路。私信进群，今晚就开杆。"
  - style: "随缘型"
    content: "输赢不重要，重要的是有人陪我蹲在球桌旁捡球。台球搭子快私信我，长期有效，随缘约球。"
  - style: "新手不慌型"
    content: "{city}球友集合！新手不慌、老手不卷，主打快乐打球。私信拉群，今晚就开杆～"
  - style: "解压首选型"
    content: "下班解压好去处！约场台球不费脑，新手小白也能玩，输了请喝饮料超随和。{city}台球搭子，等你组队。"
  - style: "陪伴型"
    content: "找稳定长期球搭子！有空就冲，不挑时间，主打陪伴解压，快乐翻倍，台费AA透明。"
  - style: "稳定型"
    content: "寻{city}台球伙伴！不跑路、不鸽局，边玩边唠超轻松，长期约球超稳定，打完AA不墨迹。"
  - style: "号召型"
    content: "不想宅家？来打台球！不用专业技术，只管放松唠嗑，球搭子等你组队，{city}随时约。"
  - style: "走心型"
    content: "城市很大，独处很难。一个人打球的孤单，只有自己懂。{city}台球搭子群，收留孤独的打球人。平淡日子里，用一杆温柔治愈情绪。"