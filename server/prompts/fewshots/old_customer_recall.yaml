category: "workbench"
tags: ["老客户", "回访", "私聊"]
description: "老客户回访话术示例 — 严格遵守 baseline_rules，不虚构优惠/折扣/门店变化"

examples:
  - type: "久未到店"
    channel: "私聊"
    content: |
      哥，好久没见了，最近忙啥呢？
      店里最近人气挺旺的，晚上经常满台
      啥时候有空来打两把？我帮你留台

  - type: "久未到店"
    channel: "私聊"
    content: |
      哥，最近咋没来打球了？
      你的手感可不能生疏了啊，哈哈
      这周找个时间过来？我提前给你留个好台

  - type: "节日问候"
    channel: "私聊"
    content: |
      哥，端午节快乐！🫔
      放假有空来打两杆呗？
      假期店里人可能多，要来的话提前跟我说，帮你预留

  - type: "赛事邀约"
    channel: "私聊"
    content: |
      哥，这周六店里搞个小比赛，你来不来？
      就图个热闹，水平高低都无所谓
      赛后一起吃个饭，好久没见了聚聚

  - type: "日常关怀"
    channel: "私聊"
    content: |
      哥，最近天气凉快了，打球正合适
      你那帮球友还在一块打不？
      要是来店里，跟我说一声，给你安排靠窗的台

  - type: "新球友引荐"
    channel: "私聊"
    content: |
      哥，最近店里来了几个水平不错的新朋友
      你要是有空来打，我给你介绍认识一下
      高手过招才有意思嘛

  - type: "群内互动"
    channel: "群聊"
    content: |
      @所有人 兄弟们，最近店里晚上七八点经常满台
      要来的提前群里喊一声，我给你们留台
      人多热闹，球技也涨得快

  - type: "周年回馈"
    channel: "私聊"
    content: |
      哥，你在咱店打球都一年多了，感谢一直支持！
      店里最近在准备会员活动，具体方案还在定
      定了我第一个通知你，肯定有你的份
