category: "workbench"
tags: ["赛事", "通知", "战报", "比赛"]
description: "赛事通知话术示例 — 严格遵守 baseline_rules，奖金/奖品用占位符"

examples:
  - type: "周赛通知"
    channel: "群公告"
    content: |
      【本周六台球赛】
      时间：周六晚7点
      赛制：中式八球，单败淘汰
      报名费：【请补充：报名费】
      奖品：【请补充：奖品/奖金设置】
      名额：16人，先报先得
      报名方式：群里接龙或到店报名
      截止时间：周五晚10点

  - type: "月赛通知"
    channel: "群公告"
    content: |
      【月赛来了！】
      时间：本月最后一个周日，下午2点
      赛制：双败淘汰，抢3
      报名费：【请补充：报名费】
      奖金池：【请补充：总奖金及分配方式】
      报名截止：赛前一天

  - type: "周赛通知"
    channel: "朋友圈"
    content: |
      周末不知道干嘛？来打球赛啊
      本周六晚7点，业余台球赛
      16个名额，报满即止
      奖品丰厚，敢不敢来？
      报名群里接龙或到店前台

  - type: "赛后战报"
    channel: "朋友圈"
    content: |
      上周比赛战报
      冠军：【请补充：冠军姓名】
      最精彩一杆：【请补充：精彩瞬间】
      下周六继续，等你来挑战

  - type: "赛后战报"
    channel: "群公告"
    content: |
      恭喜本周比赛获奖选手
      冠军：【请补充：冠军姓名及奖品】
      亚军：【请补充：亚军姓名及奖品】
      季军：【请补充：季军姓名及奖品】
      感谢所有参赛选手，下周见！

  - type: "趣味赛通知"
    channel: "群公告"
    content: |
      【清台挑战赛】
      5颗球按顺序清台，不限时
      挑战费：【请补充：费用】
      奖励：【请补充：清台奖励】
      每日限10人，成绩登榜
      你能挑战成功吗？

  - type: "助教挑战赛"
    channel: "朋友圈"
    content: |
      【助教挑战赛】
      想跟助教切磋？每周三晚8点
      输赢都好玩，以球会友
      想参加的微信报名
