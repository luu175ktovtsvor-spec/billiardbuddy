key: "recruitment.comments"
name: "评论区话术 fewshot"
category: "recruitment"
variables:
  - store_name
  - city
  - scenario
  - tone
examples:
  - type: "配合型"
    content: "哥，我刚发现一种超有趣的台球玩法，叫联动击球，几个人配合着打，超欢乐。你明天有空不，咱一起喊上几个朋友来试试，我都迫不及待看你大展身手啦。"
  - type: "配合型"
    content: "帅哥，咱台球厅新到了一批进口球杆，手感那叫一个绝。你这行家可得来品鉴品鉴，顺便给我指导下怎么选杆，后天有时间不？"
  - type: "配合型"
    content: "哥，你不是一直想提高远距离进球的命中率嘛。我请教了一位大神，学到了超实用的方法，保证对你有帮助。你明天来台球厅，我详细跟你说。"
  - type: "配合型"
    content: "大哥，我发现一个能快速提升专注力的小秘诀，打台球的时候超有用。你啥时候有空来台球厅，我分享给你，顺便咱俩再杀几局。"
  - type: "配合型"
    content: "帅哥，我最近在练一种高难度的旋转球技巧，老是掌握不好。你明天有空来教教我呗，顺便咱俩再切磋几局，我想看看差距。"
  - type: "配合型"
    content: "哥，我发现台球厅旁边开了家超好吃的小吃店，打完球可以去尝尝。你明天来打球不，咱打完球一起去解馋。"
  - type: "互动回复型"
    content: "嗨，大帅哥！你是不是背着我偷偷练球啦，最近都不见你出山，台球厅的'高手榜'都快没你名字啦，啥时候来重新称霸一下？"
  - type: "互动回复型"
    content: "帅哥，你知道吗？自从你上次来过，台球厅的球都'想'你了，觉得只有你能给它们带来刺激的'旅程'，今儿有空来满足满足它们呗？"
  - type: "互动回复型"
    content: "帅哥，跟你说个超逗的事儿，上次有个新手来打球，把白球打进了，还以为自己赢了。你快来给大伙传授点专业知识，顺便打几局展示下真正的技术。"
  - type: "互动回复型"
    content: "帅哥，最近忙啥呢？好久没见你，是不是工作太忙啦？打台球能放松放松，你今天要不抽空来，我陪你好好解解压。"
  - type: "互动回复型"
    content: "哥，天气越来越冷啦，台球厅里可暖和了，还有热饮。你啥时候来打打球，暖暖身子，我都好久没跟你切磋了。"
  - type: "互动回复型"
    content: "嗨，帅哥！听说最近流感挺严重的，你可得注意身体。要是觉得累了，就来台球厅活动活动，出出汗，精神也能好点，今天有空不？"
  - type: "引导私信型"
    content: "帅哥，告诉你个好消息，台球厅这周末搞活动，打球买一小时送一小时，还有免费小吃。你可别错过这大好机会，周末来玩呀。"
  - type: "引导私信型"
    content: "哥，我们台球厅新推出了会员储值优惠，充值有相应赠送，还能享受优先订场。你这么爱打球，办一个超划算，今天就来办呗，顺便打几局试试新优惠。"
  - type: "引导私信型"
    content: "帅哥，台球厅下周五有个'花式台球表演赛'，还有互动环节，能跟高手学技巧。你肯定感兴趣，记得来呀，提前给你留个好位置。"
  - type: "引导私信型"
    content: "哥，我们打算搞个台球'双打争霸赛'，我就想跟你组队，你这实力加上我的'辅助'，肯定能夺冠。你啥时候有空，咱们先练练手。"
  - type: "引导私信型"
    content: "嗨，帅哥！咱台球厅准备办个'台球知识竞赛'，奖品是高端球杆，你对台球知识那么了解，肯定能轻松拿下，快来报名参加呀。"
  - type: "引导私信型"
    content: "帅哥，我最近看你打球，那个发力方式特别独特，进球率超高。你能不能今天来教教我，顺便咱俩再打几局，让我好好感受下。"