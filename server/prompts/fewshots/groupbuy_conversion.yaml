category: "workbench"
tags: ["团购", "私域", "转化", "加微信"]
description: "团购转私域话术示例 — 严格遵守 baseline_rules，不虚构优惠/折扣/会员价"

examples:
  - type: "到店引导加微信"
    channel: "面对面"
    content: |
      您好，团购验券好了～
      加个微信吧，以后来打球直接跟我预约就行
      不用每次团购，我帮你留台

  - type: "到店引导加微信"
    channel: "面对面"
    content: |
      打得还满意吗？
      我们有个球友群，经常约球、搞活动
      扫码加我，我拉你进群
      群里经常有空台通知，不用白跑

  - type: "到店引导加微信"
    channel: "面对面"
    content: |
      今天体验感觉怎么样？
      加个微信吧，下次来直接找我
      我帮你安排台位，省得等

  - type: "离店跟进"
    channel: "私聊"
    content: |
      今天打球还开心吗？
      下次来不用团购了，直接微信找我
      我给你留台，到了直接打

  - type: "离店跟进"
    channel: "私聊"
    content: |
      感谢今天来体验！
      以后想来打球随时微信说
      我帮你留台，不用等位
      有啥需要随时问我

  - type: "群内互动"
    channel: "群聊"
    content: |
      今天下午3-5点有空台
      想来的群里说一声，我帮你们留
      人多热闹，约起来

  - type: "群内互动"
    channel: "群聊"
    content: |
      各位球友，周末店里人少，打起来舒服
      想来的提前说，我给你们安排
      约上朋友一起来更有意思
