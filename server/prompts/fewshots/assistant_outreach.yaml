# 助教约客话术 few-shot 样例库
# 来源：唐希台球连锁-助教约客话术（137条）
# 用途：助教约客场景的 few-shot 注入，帮助 AI 生成符合行业风格的话术
# 原则：原文完整保留，每条标注风格类型、适用客户类型、核心技巧

key: "fewshots.assistant_outreach"
name: "助教约客话术样例"
category: "fewshots"
variables:
  - customer_type
  - style

examples:
  # ========== 1. 轻松调侃型 ==========
  - style: "轻松调侃型"
    customer_type: "老客"
    technique: "用幽默夸张的方式调侃客户久不露面，制造轻松氛围拉近距离"
    content: |
      嗨，大帅哥！你是不是背着我偷偷练球啦，最近都不见你出山，台球厅的"高手榜"都快没你名字啦，啥时候来重新称霸一下？

  - style: "轻松调侃型"
    customer_type: "老客"
    technique: "拟人化台球，用俏皮话勾起客户兴趣"
    content: |
      帅哥，你知道吗？自从你上次来过，台球厅的球都"想"你了，觉得只有你能给它们带来刺激的"旅程"，今儿有空来满足满足它们呗？

  - style: "轻松调侃型"
    customer_type: "老客"
    technique: "荒诞想象+好奇心钩子，暗示客户球技可能进步"
    content: |
      嘿，球友！我怀疑你被外星人抓走特训了，不然咋这么久不现身。快回来，让我看看你是不是球技飞升啦，今天来一局？

  # ========== 2. 分享趣事型 ==========
  - style: "分享趣事型"
    customer_type: "老客"
    technique: "讲一个球厅里发生的趣事，自然引入约球，给客户一个展示实力的理由"
    content: |
      帅哥，跟你说个超逗的事儿，上次有个新手来打球，把白球打进了，还以为自己赢了。你快来给大伙传授点专业知识，顺便打几局展示下真正的技术。

  - style: "分享趣事型"
    customer_type: "老客"
    technique: "用荒诞故事烘托客户高手人设，激发表现欲"
    content: |
      哥，前几天台球厅来了个大叔，非要自创一种"跳跃式击球法"，笑翻全场。你啥时候来，给大家来点正经又厉害的操作，让他们见识下啥叫高手。

  - style: "分享趣事型"
    customer_type: "老客"
    technique: "用小朋友的崇拜引发客户成就感，软性邀约"
    content: |
      嗨呀，帅哥！昨天有个小朋友在这儿看别人打球，模仿得有模有样，还说以后要成为像你一样厉害的高手呢。你快来给小朋友指导指导，顺便也和我们打几局呗。

  # ========== 3. 关心问候型 ==========
  - style: "关心问候型"
    customer_type: "老客"
    technique: "先关心对方近况，再自然引出台球解压，语气温暖不施压"
    content: |
      帅哥，最近忙啥呢？好久没见你，是不是工作太忙啦？打台球能放松放松，你今天要不抽空来，我陪你好好解解压。

  - style: "关心问候型"
    customer_type: "老客"
    technique: "结合天气变化，用球厅的舒适环境作为邀约理由"
    content: |
      哥，天气越来越冷啦，台球厅里可暖和了，还有热饮。你啥时候来打打球，暖暖身子，我都好久没跟你切磋了。

  - style: "关心问候型"
    customer_type: "老客"
    technique: "关心健康+运动出汗的好处，把台球包装成健康生活方式"
    content: |
      嗨，帅哥！听说最近流感挺严重的，你可得注意身体。要是觉得累了，就来台球厅活动活动，出出汗，精神也能好点，今天有空不？

  # ========== 4. 制造优惠型 ==========
  - style: "制造优惠型"
    customer_type: "新客"
    technique: "用限时优惠制造紧迫感，降低决策门槛"
    content: |
      帅哥，告诉你个好消息，台球厅这周末搞活动，打球买一小时送一小时，还有免费小吃。你可别错过这大好机会，周末来玩呀。

  - style: "制造优惠型"
    customer_type: "老客"
    technique: "储值优惠+优先订场权益，针对常客的性价比说服"
    content: |
      哥，我们台球厅新推出了会员储值优惠，充多少送相应额度，还能享受优先订场。你这么爱打球，办一个超划算，今天就来办呗，顺便打几局试试新优惠。

  - style: "制造优惠型"
    customer_type: "老客"
    technique: "老带新双向激励，利用社交关系裂变"
    content: |
      嗨，帅哥！现在到月底，凡是老顾客介绍新顾客来打球，双方都能获得一张免费一小时的券。你快拉几个朋友一起来，咱热热闹闹打几场。

  # ========== 5. 活动邀请型 ==========
  - style: "活动邀请型"
    customer_type: "老客"
    technique: "用活动稀缺性（留位置）制造专属感，给客户被重视的感觉"
    content: |
      帅哥，台球厅下周五有个"花式台球表演赛"，还有互动环节，能跟高手学技巧。你肯定感兴趣，记得来呀，提前给你留个好位置。

  - style: "活动邀请型"
    customer_type: "老客"
    technique: "主动邀请组队，用'我们'建立伙伴关系，降低客户单独赴约压力"
    content: |
      哥，我们打算搞个台球"双打争霸赛"，我就想跟你组队，你这实力加上我的"辅助"，肯定能夺冠。你啥时候有空，咱们先练练手。

  - style: "活动邀请型"
    customer_type: "竞技客"
    technique: "针对台球知识丰富的客户，用高端奖品激发参与欲"
    content: |
      嗨，帅哥！台球厅准备办个"台球知识竞赛"，奖品是高端球杆，你对台球知识那么了解，肯定能轻松拿下，快来报名参加呀。

  # ========== 6. 好奇请教型 ==========
  - style: "好奇请教型"
    customer_type: "老客"
    technique: "真诚请教球技，满足客户被认可的心理，顺便约球"
    content: |
      帅哥，我最近看你打球，那个发力方式特别独特，进球率超高。你能不能今天来教教我，顺便咱俩再打几局，让我好好感受下。

  - style: "好奇请教型"
    customer_type: "老客"
    technique: "表达对客户球技的佩服+主动请客，增加赴约吸引力"
    content: |
      哥，上次你用的那个旋转球技巧，我研究了好久都没搞明白。你啥时候有空，再给我演示演示，我请你喝饮料。

  - style: "好奇请教型"
    customer_type: "老客"
    technique: "观察细节+提问，让客户感受到被关注，引发分享欲"
    content: |
      嗨，帅哥！我发现你每次打球前的准备动作都很有讲究，是不是有什么特别的作用呀？你今天来给我讲讲呗，顺便一起打几局。

  # ========== 7. 新物推荐型 ==========
  - style: "新物推荐型"
    customer_type: "竞技客"
    technique: "用专业器材升级吸引行家，强调体验提升"
    content: |
      帅哥，台球厅新到了一批进口的巧克粉，擦上之后球杆和球的摩擦力刚刚好，击球特别稳。你快来试试，今天就来打几局感受下。

  - style: "新物推荐型"
    customer_type: "老客"
    technique: "用设备升级（台布）承诺更好的打球体验，精准度提升对竞技客有吸引力"
    content: |
      哥，我们换了全新的台球桌布，顺滑度一流，球的走位都更精准了。你啥时候来体验体验这新变化，我在这儿等你。

  - style: "新物推荐型"
    customer_type: "散客"
    technique: "用周边体验（饮品）作为附加吸引力，降低约球门槛"
    content: |
      嗨，帅哥！台球厅新添了几款特色饮品，打球的时候来上一杯，那叫一个惬意。你今天来打球，顺便尝尝新口味。

  # ========== 8. 回忆共鸣型 ==========
  - style: "回忆共鸣型"
    customer_type: "老客"
    technique: "唤起共同记忆，用情感纽带约球，比直接邀约更温暖"
    content: |
      帅哥，还记得咱俩第一次打球吗？你那时候就打得超棒，把我打得心服口服。后来每次跟你打，我都能学到新东西。你今天有空再来教教我不？

  - style: "回忆共鸣型"
    customer_type: "老客"
    technique: "用双打默契回忆制造'再来一次'的冲动，团队感强"
    content: |
      哥，上次咱们一起双打，配合得那叫一个默契，直接把对手打得落花流水。要不今天再组个队，重温一下那种畅快淋漓的感觉？

  - style: "回忆共鸣型"
    customer_type: "老客"
    technique: "回忆高光时刻，用赞美+期待激发客户再来一次的动力"
    content: |
      嗨呀，帅哥！想起之前有次打球，最后一局你那绝杀球，简直帅炸了，大家都忍不住叫好。你啥时候再来个精彩的，今天有空来打球不？

  # ========== 9. 休闲提议型 ==========
  - style: "休闲提议型"
    customer_type: "散客"
    technique: "低压力邀约，把台球包装成休闲社交活动，不打竞技牌"
    content: |
      帅哥，周末啦，别在家闲着，来台球厅放松放松。打打球，和朋友们聊聊天，多惬意呀，今天就过来呗。

  - style: "休闲提议型"
    customer_type: "散客"
    technique: "利用饭后空闲时段+热闹氛围，暗示来了不无聊"
    content: |
      哥，晚上吃完饭没啥事吧，来台球厅转转。最近台球厅人可多了，可热闹了，你也来凑凑热闹，打几局球。

  - style: "休闲提议型"
    customer_type: "散客"
    technique: "工作与生活平衡角度，主动提出陪伴，消除一个人来打球的心理障碍"
    content: |
      嗨，帅哥！工作之余得找点乐子呀，打台球就是个不错的选择。你今天下班后来台球厅，我陪你好好玩几局。

  # ========== 10. 激励挑战型 ==========
  - style: "激励挑战型"
    customer_type: "竞技客"
    technique: "用竞争对手激发胜负欲，给客户一个'证明自己'的理由"
    content: |
      帅哥，最近台球厅来了几个自认为很厉害的新手，到处挑战。我跟他们说你才是真正的高手，他们还不信呢。你啥时候来，给他们点颜色看看。

  - style: "激励挑战型"
    customer_type: "竞技客"
    technique: "以自己进步为理由发起挑战，不给客户压力又激起胜负心"
    content: |
      哥，我最近球技进步不少哦，感觉能跟你好好较量一番了。你今天有空来接受我的挑战不，看看我是不是真的变强了。

  - style: "激励挑战型"
    customer_type: "竞技客"
    technique: "用排行榜+奖励机制，给竞技型客户明确的竞争目标"
    content: |
      嗨，帅哥！台球厅准备设置一个"高手挑战榜"，第一名会有特殊奖励。以你的实力，肯定能轻松登顶，快来开启你的称霸之路吧。

  # ========== 综合型（前29条精选） ==========
  - style: "活动邀请型"
    customer_type: "新客"
    technique: "用新奇玩法+多人互动降低新客单独赴约的尴尬感"
    content: |
      哥，我刚发现一种超有趣的台球玩法，叫联动击球，几个人配合着打，超欢乐。你明天有空不，咱一起喊上几个朋友来试试，我都迫不及待看你大展身手啦。

  - style: "新物推荐型"
    customer_type: "竞技客"
    technique: "用专业器材吸引行家品鉴，把客户放在'指导者'位置"
    content: |
      帅哥，咱台球厅新到了一批进口球杆，手感那叫一个绝。你这行家可得来品鉴品鉴，顺便给我指导下怎么选杆，后天有时间不？

  - style: "激励挑战型"
    customer_type: "老客"
    technique: "展示自己进步+请求切磋，给客户当'师傅'的成就感"
    content: |
      大哥，我最近跟高手学了几招超炫的击球技巧，感觉自己球技大增，正愁没人切磋呢。你今晚有空来台球厅，咱俩大战三百回合，让我见识下你的厉害。

  - style: "活动邀请型"
    customer_type: "老客"
    technique: "组队参赛+求助姿态，降低客户拒绝的心理负担"
    content: |
      嗨，帅哥！台球厅周末要举办双打赛，我正愁找不到搭档呢。你球技这么好，咱俩组队肯定有戏，你就当帮帮我呗。周末有空不，说不定咱俩能拿个好名次。

  - style: "好奇请教型"
    customer_type: "竞技客"
    technique: "针对客户明确的提升需求，用学到的干货作为邀约筹码"
    content: |
      哥，你不是一直想提高远距离进球的命中率嘛。我请教了一位大神，学到了超实用的方法，保证对你有帮助。你明天来台球厅，我详细跟你说。

  - style: "新物推荐型"
    customer_type: "老客"
    technique: "环境升级+陪伴需求双重理由，既有新鲜感又有情感连接"
    content: |
      帅哥，咱台球厅重新布置了灯光，晚上打球氛围感拉满，像在舞台上一样。你今晚有空来感受下不，顺便陪我练几局，我最近状态不太好。

  - style: "关心问候型"
    customer_type: "老客"
    technique: "把台球包装成解压方式，切中职场人痛点"
    content: |
      哥，我听说你最近工作压力大，打台球可是解压的好办法。今晚来台球厅放松放松呗，我陪你痛痛快快打几场，把压力全释放掉。

  - style: "休闲提议型"
    customer_type: "散客"
    technique: "用附近美食作为打球后的附加奖励，增加整体体验吸引力"
    content: |
      哥，我发现台球厅旁边开了家超好吃的小吃店，打完球可以去尝尝。你明天来打球不，咱打完球一起去解馋。

  # ========== 熟客专属型 ==========
  - style: "回忆共鸣型"
    customer_type: "老客"
    technique: "用上次对战的细节+自己进步的信息，制造'再来一局'的动力"
    content: |
      陈哥，上次打球你那几记绝妙的走位，可把我打得心服口服。但这几天我跟高手讨教，学了不少新招，感觉能跟你再好好比划比划啦。就今天下午，有空咱再大战一场，看看我这新本事有没有用。

  - style: "回忆共鸣型"
    customer_type: "老客"
    technique: "用共同经历的趣事引出活动邀约，有故事感有画面感"
    content: |
      赵哥，还记得上次打球中途突然停电那事儿不？当时正打得激烈，可把人憋坏了。今天台球厅专门搞了个"夜场激战"活动，电力十足，氛围超棒，还有特色灯光。你今晚务必得来，咱痛痛快快打个够。

  - style: "好奇请教型"
    customer_type: "老客"
    technique: "用客户教过的技巧+自己苦练成果，制造'来验收'的理由"
    content: |
      孙哥，前儿个你教我的那个控制击球力度的技巧，太实用了，我这两天练得炉火纯青。我感觉现在能跟你有来有回啦，要不就今天晚上，来台球厅检验检验我的学习成果？

  - style: "关心问候型"
    customer_type: "老客"
    technique: "记住客户反馈并告知已改善，体现重视感，顺便邀约"
    content: |
      周哥，上次你说台球厅的休息区要是能再舒服点就好了。这几天老板听了建议，重新布置了，换上了超软的沙发，还添了按摩椅呢。你今天就来享受享受新环境，顺便和我打几局球呗。

  - style: "回忆共鸣型"
    customer_type: "老客"
    technique: "记住客户的个人喜好（球星/音乐/美食等），展示用心，用共同话题邀约"
    content: |
      吴哥，上次咱打球聊起你喜欢的斯诺克选手，我回去查了好多他的比赛视频，真的太厉害，也学到不少技巧。就今晚，来台球厅咱边打边交流交流心得。

  - style: "关心问候型"
    customer_type: "老客"
    technique: "记住客户的小偏好（饮品/食物），主动安排，制造被照顾的体验感"
    content: |
      郑哥，之前你说喜欢喝的那种冰美式，台球厅现在随时都备着啦。你今天想来打球的话，提前说一声，保证给你安排得妥妥的。就今天下午，我在这儿等你。

  - style: "回忆共鸣型"
    customer_type: "老客"
    technique: "把非台球话题（追剧/自驾游等）作为约球附属活动，让打球不只是打球"
    content: |
      冯哥，上次打球时提到你正在追的那部剧，我也去看了，剧情太精彩，咱们可有不少能聊的。要不今天就来台球厅打球，一边打球一边唠唠剧情，多有意思。

  - style: "激励挑战型"
    customer_type: "老客"
    technique: "用客户教过的技巧+自己苦练成果，制造挑战的合理性"
    content: |
      于哥，前几天你展示的那个跳球技巧，我苦练了好久，终于有点模样了。我想跟你实战试试，看看能不能派上用场。你今天晚上有空来台球厅不？

  - style: "新物推荐型"
    customer_type: "老客"
    technique: "记住客户对设备的需求，主动告知改善，体现专业和用心"
