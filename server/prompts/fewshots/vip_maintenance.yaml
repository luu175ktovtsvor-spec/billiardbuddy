category: "workbench"
tags: ["大客户", "VIP", "维护", "私聊"]
description: "VIP 大客户维护话术示例 — 严格遵守 baseline_rules，不虚构优惠/特权/赠送"

examples:
  - type: "日常问候"
    channel: "私聊"
    content: |
      哥，最近忙不？好久没见你来打球了
      你常打的那个台还给你留着呢
      啥时候过来，提前说一声就行

  - type: "专属预约"
    channel: "私聊"
    content: |
      哥，这周五晚上有空不？
      店里那会儿人少，打起来舒服
      你要来的话我提前帮你把台留好

  - type: "球友圈引荐"
    channel: "私聊"
    content: |
      哥，店里最近来了几个水平很高的朋友
      你要是想找个对手切磋，我可以帮你约一下
      高手之间过招，那才过瘾

  - type: "赛事推荐"
    channel: "私聊"
    content: |
      哥，下个月市里有个业余赛，你有没有兴趣参加？
      以你的水平去了肯定有竞争力
      要去的话我帮你看看报名条件

  - type: "节日关怀"
    channel: "私聊"
    content: |
      哥，中秋快乐！🥮
      放假来打两杆不？
      店里假期人可能多，提前跟我说，我帮你安排

  - type: "反馈收集"
    channel: "私聊"
    content: |
      哥，最近打球体验咋样？
      有啥建议随时跟我说，我反馈给店里改进
      你们常来的感受最真实，我们很重视

  - type: "新服务通知"
    channel: "私聊"
    content: |
      哥，店里最近在考虑增加一些新服务，还在规划中
      比如助教陪练预约、赛事信息推送这些
      你最希望店里增加啥？跟我说说，我帮你提上去
