category: "workbench"
tags: ["投诉", "安抚", "处理", "话术"]
description: "投诉安抚话术示例 — 严格遵守 baseline_rules，不擅自承诺免单/退款/赠送"

examples:
  - type: "台桌问题"
    channel: "面对面"
    content: |
      实在抱歉，这张台确实有点问题
      我马上给您换一台
      换台后如果还不满意，我帮您反馈给店长处理

  - type: "台桌问题"
    channel: "面对面"
    content: |
      抱歉让您体验不好了
      我记下来了，明天就让师傅来修
      换个台吧，那边的台状态好
      有任何问题随时找我

  - type: "等位问题"
    channel: "面对面"
    content: |
      抱歉让您等了，今天确实人多
      我给您倒杯茶，先坐着休息
      大概还要15分钟，前面那桌快结束了
      感谢理解

  - type: "等位问题"
    channel: "面对面"
    content: |
      真的抱歉，今天满台了
      这样吧，我帮您预约明天同一时间
      到了直接来，不用等

  - type: "服务态度"
    channel: "面对面"
    content: |
      非常抱歉给您不好的体验
      这件事我一定反馈给店长
      您的意见我们非常重视
      下次来有任何不满意直接找我

  - type: "服务态度"
    channel: "私聊"
    content: |
      真的很抱歉，这是我们管理的问题
      我已经反馈给店长了，会认真处理
      希望您再给我们一次机会
      下次来有任何不满意直接找我

  - type: "收费争议"
    channel: "面对面"
    content: |
      我理解您的感受，让我查一下
      【确认后】
      您说得对，这个确实计费有误
      多收的部分我帮您处理
      不好意思，以后一定注意

  - type: "收费争议"
    channel: "面对面"
    content: |
      抱歉让您困惑了
      我给您解释一下计费规则
      【耐心解释】
      以后我提前给您说明清楚，避免误会
