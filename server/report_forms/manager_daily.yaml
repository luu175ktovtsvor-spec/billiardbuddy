key: manager_daily
shape: flat
role: manager
title: "{store_name}·店长日报·{date}"
prefill: [store_name, date, weekday]
groups:
  - name: 今日数据
    fields:
      - {key: revenue,      label: 营业额,   type: number, unit: 元, source: pos_glance}
      - {key: table_fee,    label: 台费,     type: number, unit: 元, source: pos_glance}
      - {key: groupbuy_pct, label: 团购占比, type: number, unit: "%", source: pos_glance}
      - {key: coach_fee,    label: 助教费,   type: number, unit: 元, source: pos_glance}
      - {key: goods_fee,    label: 商品费,   type: number, unit: 元, source: pos_glance}
      - {key: recharge,     label: 充值,     type: number, unit: 元, source: pos_glance}
  - name: 运营动作
    fields:
      - {key: add_wechat,    label: 加微信,         type: number, unit: 人, source: manual}
      - {key: reviews,       label: 好评数,         type: number, unit: 条, source: manual}
      - {key: patrol_issues, label: 巡查发现问题,   type: number, unit: 项, source: manual}
  - name: 各岗位汇总
    fields:
      - {key: coach_on_duty,  label: 助教到岗, type: number, unit: 人, source: manual}
      - {key: coach_on_clock, label: 助教上钟, type: number, unit: 人, source: manual}
narrative:
  prompt_key: report.manager_daily_narrative
  outputs: [今日总结, 发现问题, 明日计划]
  delta_fields: [revenue, recharge, coach_on_clock]
excel:
  layout: sectioned
