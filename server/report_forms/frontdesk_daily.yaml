key: frontdesk_daily
shape: flat
role: frontdesk
title: "{store_name}·前厅日报·{date}"
prefill: [store_name, date, weekday]
groups:
  - name: 今日数据
    fields:
      - {key: groupbuy_verify, label: 团购核销, type: number, unit: 单, source: manual}
      - {key: add_wechat,      label: 加微信,   type: number, unit: 人, source: manual}
      - {key: goods_sales,     label: 商品销售, type: number, unit: 元, source: pos_glance}
      - {key: reviews,         label: 好评数,   type: number, unit: 条, source: manual}
      - {key: complaints,      label: 客诉数,   type: number, unit: 件, source: manual}
narrative:
  prompt_key: report.frontdesk_daily_narrative
  outputs: [服务问题, 明日计划]
  delta_fields: [goods_sales]
excel:
  layout: sectioned
