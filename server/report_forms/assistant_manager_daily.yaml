key: assistant_manager_daily
shape: roster
role: assistant_manager
title: "{store_name}·助教管理日报·{date}"
prefill: [store_name, date, weekday]
row_label: 助教
rank_by: hours
columns:
  - {key: name,       label: 助教,     type: text}
  - {key: hours,      label: 陪打时长, type: number, unit: h, source: manual}
  - {key: add_wechat, label: 加微,     type: number, unit: 人, source: manual}
  - {key: convert,    label: 体验转化, type: number, unit: 桌, source: manual}
narrative:
  prompt_key: report.assistant_manager_daily_narrative
  outputs: [业绩排名播报]
excel:
  layout: roster
