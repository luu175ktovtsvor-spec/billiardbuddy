# BilliardBuddy mainland build assets. billiardbuddy-gateway is intentionally loopback-only and
# reaches the US public entry through the dedicated OpenSSH tunnel.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mp.zzyppz.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /assets/ {
        alias /var/www/billiardbuddy-assets/;
        autoindex off;
        add_header Accept-Ranges bytes;
    }

    location / {
        return 404;
    }
}
