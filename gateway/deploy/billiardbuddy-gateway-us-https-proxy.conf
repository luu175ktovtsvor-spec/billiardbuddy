# Include this file inside the HTTPS server block for zzyppz.cn.
#
# Public clients terminate TLS on the US domain. The local port is an OpenSSH
# forward to billiardbuddy-gateway's mainland loopback listener; no gateway traffic uses public HTTP.
location /gw/ {
    proxy_pass http://127.0.0.1:8800/;
    proxy_http_version 1.1;
    proxy_set_header Host 39.106.214.21;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_connect_timeout 15s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    send_timeout 300s;
    client_max_body_size 32m;
}
