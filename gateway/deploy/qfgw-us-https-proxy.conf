# Include this file inside the HTTPS server block for zzyppz.cn.
#
# Public clients terminate TLS on the US domain. The present mainland deployment
# has no DNS name, so this is an HTTP server-to-server backhaul only; replace it
# with a verified private/TLS link before treating that hop as end-to-end secure.
location /gw/ {
    proxy_pass http://39.106.214.21/gw/;
    proxy_http_version 1.1;
    proxy_set_header Host 39.106.214.21;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_connect_timeout 15s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    send_timeout 300s;
    client_max_body_size 32m;
}
