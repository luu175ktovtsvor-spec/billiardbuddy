# Installed at the existing root-domain include
# `/etc/nginx/snippets/billiardbuddy-video-media.conf` inside the confirmed
# zzyppz.cn TLS server block. It is now the authoritative public boundary for
# the three independent product services, despite retaining the established
# file name. It deliberately contains no server/certificate/hostname settings.

# Gateway's Relay identity authority is Compose-only. Public callers never get
# an identity projection, even through the Gateway prefix.
location ^~ /gw/internal/ {
    return 404;
}

# The existing root-domain vhost owns the general /gw/ Gateway route, including
# its 300-second streaming and no-buffer settings. Do not duplicate it here:
# Nginx rejects duplicate prefix locations in one server block.

# Docker probes the detailed Image Relay health snapshot through 127.0.0.1.
# It includes queue and capacity diagnostics, so public callers receive neither
# that operational data nor a second health API surface.
location = /image-generation/healthz {
    return 404;
}

# Image Relay owns paid provider credentials, admission and signed results.
location ^~ /image-generation/ {
    client_max_body_size 32m;
    proxy_pass http://127.0.0.1:8790/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_connect_timeout 15s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# Video bytes use short-lived OSS URLs. This Nginx/Bun path is control-plane
# JSON only and reaches the dedicated Video Media Relay directly.
location ^~ /video-media/ {
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:8791/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_connect_timeout 15s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    send_timeout 300s;
}
