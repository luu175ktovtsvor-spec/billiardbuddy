server {
    listen 443 ssl;
    server_name zzyppz.cn;

    location = /gw/v1/auth/bootstrap {
        limit_req zone=bootstrap burst=4 nodelay;
        proxy_pass http://127.0.0.1:8799/v1/auth/bootstrap;
    }

    # Actual production insertion point: after bootstrap, before the generic
    # Gateway prefix. The remaining audio and desktop/toolchain locations are
    # intentionally outside this fixture and unaffected by the Relay snippet.
    include /etc/nginx/snippets/billiardbuddy-video-media.conf;

    location /gw/ {
        proxy_pass http://127.0.0.1:8799/;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        send_timeout 300s;
    }
}
